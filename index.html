/**
 * Registrar un convenio, una cotización o un contrato que ya andaba firmado
 * antes de que existiera el CRM —o que se hizo en Word, como siempre.
 *
 * No se inventa el documento: se guarda el escaneado tal cual y la ficha
 * queda marcada como externa, para que nadie espere ver la carta armada por
 * la aplicación cuando lo abra.
 */
const TIPOS_EXTERNO = [
  { id:"convenio",      name:"Convenio de hospedaje",      donde:"convenios" },
  { id:"cotizacion",    name:"Cotización de hospedaje",    donde:"contratos" },
  { id:"contrato",      name:"Contrato de hospedaje",      donde:"contratos" },
  { id:"cotizacionbq",  name:"Cotización de evento",       donde:"eventos" },
  { id:"contratobq",    name:"Contrato de banquetes",      donde:"contratosbq" }
];

/** Cuánto ocupa hoy la cartera en este navegador, para no pasarnos del tope. */
function pesoGuardado(){
  try{ return (localStorage.getItem(STORE) || "").length; }catch(e){ return 0; }
}
/* Con almacén en la nube el archivo ni toca el navegador, así que cabe uno de
   verdad: un escaneado a color de varias hojas anda por los 8 MB. Sin almacén
   se queda el límite viejo, que no es capricho —es lo que aguanta el navegador—. */
const MAX_ARCHIVO      = 2 * 1024 * 1024;    // incrustado, por documento
const MAX_ARCHIVO_NUBE = 20 * 1024 * 1024;   // en el almacén del proyecto
const TOPE_TOTAL  = 4.2 * 1024 * 1024;    // el navegador corta cerca de 5 MB

/* ==========================================================================
   EL ALMACÉN DE ESCANEADOS

   Un convenio escaneado pesa lo que pesa, y meterlo dentro del propio registro
   llenaba el navegador con tres documentos. Aquí los archivos van aparte, al
   almacén del proyecto, y del registro cuelga nada más la ruta.

   El depósito es privado: se lee con la sesión de quien pregunta, igual que
   todo lo demás. Se crea corriendo archivos.sql una sola vez.
   ========================================================================== */

const DEPOSITO = "escaneados";

/** ¿Hay a dónde subirlos? Sin nube o sin sesión, no. */
const hayDeposito = () => nubeActiva() && !nube.sinDeposito;

/** Nombre de archivo limpio y único, para que dos escaneados no se pisen. */
function rutaEscaneo(nombre){
  const ext = (String(nombre).match(/\.([A-Za-z0-9]{1,8})$/) || [,"bin"])[1].toLowerCase();
  const b = new Uint8Array(9);
  crypto.getRandomValues(b);
  const azar = [...b].map(x => x.toString(36).padStart(2,"0")).join("").slice(0, 14);
  return `${hoyISO().slice(0,7)}/${azar}.${ext}`;
}

/**
 * Sube el archivo al almacén y devuelve su ruta.
 *
 * Si el depósito no existe todavía —nadie ha corrido archivos.sql— se anota y
 * no se vuelve a intentar en esta sesión: el escaneado se guarda incrustado,
 * como antes, para no dejar a nadie sin poder registrar su documento.
 */
async function subirEscaneo(archivo){
  const ruta = rutaEscaneo(archivo.name);
  const r = await fetch(`${nube.url}/storage/v1/object/${DEPOSITO}/${ruta}`, {
    method: "POST",
    headers: {
      apikey: nube.anon,
      Authorization: "Bearer " + (nube.sesion && nube.sesion.access_token),
      "Content-Type": archivo.type || "application/octet-stream",
      "x-upsert": "false"
    },
    body: archivo
  });
  if (!r.ok){
    const detalle = await r.text().catch(() => "");
    if (r.status === 404 || /bucket not found/i.test(detalle)) nube.sinDeposito = true;
    throw new Error(`${r.status} · ${detalle || "sin detalle"}`);
  }
  return ruta;
}

/** Trae el archivo del almacén como una dirección que el navegador pueda abrir. */
async function bajarEscaneo(ruta){
  const r = await fetch(`${nube.url}/storage/v1/object/${DEPOSITO}/${ruta}`, {
    headers: {
      apikey: nube.anon,
      Authorization: "Bearer " + (nube.sesion && nube.sesion.access_token)
    }
  });
  if (!r.ok) throw new Error(`${r.status} · ${await r.text().catch(() => "")}`);
  return URL.createObjectURL(await r.blob());
}

/**
 * Todos los documentos que traen un escaneado, vengan de donde vengan.
 *
 * Se recorre de una sola manera para que mudarlos, contarlos y pesarlos usen
 * la misma lista y no se le olvide a nadie una colección.
 */
function documentosConEscaneo(){
  const fuera = [];
  for (const col of ["convenios","contratos","eventos"])
    for (const d of state[col])
      if (traeEscaneo(d.firmaManual)) fuera.push({ col, doc:d, m:d.firmaManual });
  return fuera;
}

/** Los que todavía pesan dentro del navegador. */
const escaneosIncrustados = () => documentosConEscaneo().filter(x => x.m.pdf);

/**
 * Sube al almacén los escaneados que estén incrustados y los saca del registro.
 *
 * Es la operación que libera el navegador. Se hace de uno en uno y guardando
 * después de cada uno: si se corta a la mitad, lo que ya subió quedó bien y
 * volver a darle continúa donde se quedó.
 */
async function mudarEscaneos(avisa){
  const pendientes = escaneosIncrustados();
  let hechos = 0;
  for (const { doc, m } of pendientes){
    if (avisa) avisa(hechos, pendientes.length);
    const blob = await (await fetch(m.pdf)).blob();
    const archivo = new File([blob], m.archivo || "escaneado",
                             { type: m.tipoMime || blob.type });
    const ruta = await subirEscaneo(archivo);
    doc.firmaManual = saneaManual(Object.assign({}, m,
      { ruta, pdf:"", tam: m.tam || blob.size, tipoMime: m.tipoMime || blob.type }));
    doc.updatedAt = new Date().toISOString();
    guardar();
    hechos++;
  }
  if (avisa) avisa(hechos, pendientes.length);
  return hechos;
}

/** Borra un escaneado del almacén. Que falle no es grave: queda huérfano y ya. */
async function borrarEscaneo(ruta){
  if (!ruta || !hayDeposito()) return;
  try{
    await fetch(`${nube.url}/storage/v1/object/${DEPOSITO}/${ruta}`, {
      method: "DELETE",
      headers: { apikey: nube.anon,
                 Authorization: "Bearer " + (nube.sesion && nube.sesion.access_token) }
    });
  }catch(e){ console.warn("No se pudo borrar el escaneado:", e.message); }
}

      if (e && [...fEje.options].some(o => o.value === e)) fEje.value = auto = e;
    });
    fCli.dispatchEvent(new Event("change"));   // por si ya venía un cliente escogido
  }

  // En un documento de banquetes lo que importa es cuándo es el evento.
  {
    const fTipo = ov.querySelector("#exTipo"), lbl = ov.querySelector("#exVigLbl");
    const acomoda = () => {
      const bq = /bq$/.test(fTipo.value);
      lbl.innerHTML = bq ? `Fecha del evento <span class="hint">(para el calendario)</span>`
                         : `Vigencia hasta <span class="hint">(opcional)</span>`;
    };
    fTipo.addEventListener("change", acomoda);
    acomoda();
  }

  const err = ov.querySelector("#exErr");
  const falla = html => { err.innerHTML = `<div class="errbox">${html}</div>`;
                          err.scrollIntoView({ block:"center", behavior:"smooth" }); };

  // Se avisa al abrir, no al final. Enterarse de que no cabe después de
  // escanear el papel, escoger el archivo y llenar la ficha es enterarse tarde.
  if (!hayDeposito() && pesoGuardado() > TOPE_TOTAL * 0.7)
    err.innerHTML = `<div class="errbox"><b>Este equipo ya casi no tiene lugar.</b>
      Sin el almacén del proyecto, los escaneados se guardan dentro del navegador y ahí
      el tope son unos 5 MB —con tres o cuatro documentos se llena—.
      <br>Avísale a sistemas: se monta una vez (<code>archivos.sql</code>) y a partir de
      ahí los archivos dejan de ocupar lugar aquí.</div>`;

  ov.querySelector("#bOkEx").onclick = () => {
    const tipo = ov.querySelector("#exTipo").value;
    const cid  = ov.querySelector("#exCli").value;
    const f    = ov.querySelector("#exArchivo").files[0];

    if (!cid) return falla("Selecciona el cliente.");
    if (!f)   return falla("Elige el archivo escaneado.");
    const tope = hayDeposito() ? MAX_ARCHIVO_NUBE : MAX_ARCHIVO;
    if (f.size > tope)
      return falla(`El archivo pesa ${(f.size/1024/1024).toFixed(1)} MB y el límite son
        ${Math.round(tope/1024/1024)} MB.
        Vuelve a escanearlo en blanco y negro o a menor resolución, o toma una foto.`);
    if (!hayDeposito() && pesoGuardado() + f.size * 1.4 > TOPE_TOTAL)
      return falla(`<b>Ya casi no cabe en este navegador.</b> Sin el almacén del proyecto los
        archivos escaneados se guardan junto con la cartera, y el navegador corta cerca de
        los 5 MB. Avísale a sistemas para que monte el almacén (<code>archivos.sql</code>);
        a partir de ahí dejan de ocupar lugar aquí.`);

    const bOk = ov.querySelector("#bOkEx");
    bOk.disabled = true; bOk.textContent = "Guardando…";
    const listo = manual => { seguir(manual); };
    const seRindio = e => {
      bOk.disabled = false; bOk.textContent = "Registrar";
      falla(`No se pudo guardar el archivo en el almacén del proyecto.<br>
        <span class="hint">${esc(e.message)}</span>`);
    };

    // Al almacén si lo hay; si no —o si el depósito todavía no existe—, al
    // propio registro, como se hacía antes.
    if (hayDeposito()){
      subirEscaneo(f)
        .then(ruta => listo(saneaManual({ fecha:new Date().toISOString(), quien:quienEs(),
          archivo:f.name, ruta, tam:f.size, tipoMime:f.type })))
        .catch(e => {
          if (!nube.sinDeposito) return seRindio(e);
          // El depósito no existe: se sigue por el camino viejo sin molestar.
          console.warn("Sin almacén de escaneados:", e.message);
          incrustado();
        });
    } else incrustado();

    function quienEs(){
      return ov.querySelector('[name="exEje"]').value.trim() || miNombre();
    }

    function incrustado(){
      if (pesoGuardado() + f.size * 1.4 > TOPE_TOTAL){
        bOk.disabled = false; bOk.textContent = "Registrar";
        return falla(`<b>Ya casi no cabe en este navegador.</b> Avísale a sistemas para que
          monte el almacén del proyecto (<code>archivos.sql</code>).`);
      }
      const r = new FileReader();
      r.onerror = () => { bOk.disabled = false; bOk.textContent = "Registrar";
                          falla("No se pudo leer el archivo."); };
      r.onload = () => listo(saneaManual({ fecha:new Date().toISOString(), quien:quienEs(),
        archivo:f.name, pdf:String(r.result), tam:f.size, tipoMime:f.type }));
      r.readAsDataURL(f);
    }

    function seguir(manual){
      const c = cliente(cid);
      const quien = ov.querySelector('[name="exEje"]').value.trim() || miNombre();
      const folio = ov.querySelector("#exFolio").value.trim();
      const fecha = ov.querySelector("#exFecha").value || hoy;
      const vig   = ov.querySelector("#exVig").value;
      const notas = ov.querySelector("#exNotas").value.trim();
      const dest = c ? { empresa:c.empresa, contacto:c.contacto, ubicacion:c.ubicacion,
                         telefono:c.telefono, email:c.email } : null;
      const nombre = TIPOS_EXTERNO.find(t => t.id === tipo).name;

      if (tipo === "convenio"){
        const v = saneaConv({
          clienteId:cid, ejecutivo:quien, externo:true,
          folio: folio || folioLibre(String(fecha).slice(0,4)),
          fecha, vigenciaDesde:fecha, vigenciaHasta:vig, notas,
          firmaManual: manual, createdAt:new Date().toISOString()
        });
        state.convenios.push(v);
        // Se anota en el contador del servidor: si no, volvería a repartir ese
        // número y el convenio de papel quedaría repetido con uno nuevo.
        anotarFolio("convenios", v.folio);
        cerrarConvenio(v, null, `Documento externo. Se subió el archivo "${f.name}".`, quien);
        v.avisado = true;     // lo registró el propio equipo: no hay novedad que avisar
      } else if (tipo === "cotizacionbq" || tipo === "contratobq"){
        const ev = saneaEvento({
          clienteId:cid, ejecutivo:quien, externo:true,
          tipo: tipo === "contratobq" ? "contrato" : "cotizacion",
          folio: folio || folioEvento(tipo === "contratobq" ? "contrato" : "cotizacion",
                                      String(fecha).slice(0,4)),
          fecha, vigencia:vig, observaciones:notas, estado:"confirmado",
          bloques: vig ? [saneaBloqueEv({ fecha: vig })] : [],
          firmaManual: manual, destinatario: dest, createdAt:new Date().toISOString()
        });
        state.eventos.push(ev);
        registrarAuto(cid, `${nombre} ${ev.folio} registrada desde un documento externo`,
          `Se subió el archivo "${f.name}".`, quien);
      } else {
        const k = saneaContrato({
          clienteId:cid, ejecutivo:quien, externo:true, tipo,
          folio: folio || folioContrato(String(fecha).slice(0,4)),
          fecha, vigencia:vig, notas, estado:"aceptado",
          firmaManual: manual, destinatario: dest, createdAt:new Date().toISOString()
        });
        state.contratos.push(k);
        registrarAuto(cid, `${nombre} ${k.folio} registrada desde un documento externo`,
          `Se subió el archivo "${f.name}".`, quien);
      }

      guardar(); render();
      ov.remove();
      vista = TIPOS_EXTERNO.find(t => t.id === tipo).donde;
      render();
      if (alTerminar) alTerminar();
    }
  };
}

/**
 * La ficha de un documento que vino de fuera.
 *
 * No se dibuja una carta: no hay de dónde. Se enseñan los datos que se
 * capturaron y el archivo tal cual lo subieron.
 */
function fichaExterna(titulo, etiqueta, filas, manual, alBorrar){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${esc(titulo)}</h2>
        <span class="estado-chip" style="background:var(--ok-soft);color:var(--ok)">${esc(etiqueta)}</span>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note">Este documento <b>no se armó en el CRM</b>: se subió ya firmado.
          Lo que vale es el archivo escaneado.</div>
        <div style="overflow:auto"><table class="data"><tbody>${filas.map(([a,b]) => `<tr>
          <td style="width:190px;color:var(--muted)">${esc(a)}</td>
          <td><b>${esc(b || "—")}</b></td></tr>`).join("")}</tbody></table></div>
      </div>
      <div class="modal-foot">
        <button class="btn danger" id="bDelEx">Eliminar</button>
        <div class="spacer"></div>
        <button class="btn primary" id="bVerEsc">Ver el documento</button>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);
  ov.querySelector("#bVerEsc").onclick = () => verEscaneado(manual, titulo);
  ov.querySelector("#bDelEx").onclick = () => {
    if (!confirm("¿Eliminar este documento del CRM?\n\nSe borra también el archivo subido.")) return;
    // El archivo del almacén se va con el registro; si no, quedaría ocupando
    // lugar en el proyecto sin que nadie pueda volver a abrirlo.
    if (manual && manual.ruta) borrarEscaneo(manual.ruta);
    alBorrar(); ov.remove();
  };
  return ov;
}

function verConvenioExterno(v, alCerrar){
  const c = cliente(v.clienteId);
  fichaExterna(`Convenio ${v.folio || ""}`, "Externo · firmado", [
    ["Cliente", (c && c.empresa) || nombreCli(v.clienteId)],
    ["Ejecutivo", ejecutivoDe(v)],
    ["Fecha del documento", fechaCorta(v.fecha)],
    ["Vigencia hasta", v.vigenciaHasta ? fechaCorta(v.vigenciaHasta) : ""],
    ["Archivo", v.firmaManual && v.firmaManual.archivo],
    ["Lo registró", v.firmaManual && v.firmaManual.quien],
    ["Observaciones", v.notas]
  ], v.firmaManual, () => {
    state.convenios = state.convenios.filter(x => x.id !== v.id);
    guardar(); render(); if (alCerrar) alCerrar();
  });
}

function verContratoExterno(k, alCerrar){
  const c = cliente(k.clienteId);
  fichaExterna(`${infoTipoCt(k.tipo).name} ${k.folio || ""}`, "Externo · firmado", [
    ["Cliente", (c && c.empresa) || nombreCli(k.clienteId)],
    ["Ejecutivo", ejecutivoDeCt(k)],
    ["Fecha del documento", fechaCorta(k.fecha)],
    ["Vigencia hasta", k.vigencia ? fechaCorta(k.vigencia) : ""],
    ["Archivo", k.firmaManual && k.firmaManual.archivo],
    ["Lo registró", k.firmaManual && k.firmaManual.quien],
    ["Observaciones", k.notas]
  ], k.firmaManual, () => {
    state.contratos = state.contratos.filter(x => x.id !== k.id);
    guardar(); render(); if (alCerrar) alCerrar();
  });
}

/** Enseña el escaneado que se subió, sin sacarlo de la aplicación. */
function verEscaneado(manual, titulo){
  if (!traeEscaneo(manual)){ alert("Este documento no trae archivo."); return; }

  const nombre = manual.archivo || "documento";
  const esImagen = manual.pdf
    ? /^data:image\//.test(manual.pdf)
    : /^image\//.test(manual.tipoMime || "") || /\.(jpe?g|png|gif|webp|heic)$/i.test(nombre);

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${esc(titulo || nombre)}</h2>
        <button class="btn" data-close>\u2715</button></div>
      <div class="modal-body" style="background:#f2f0f5">
        <div id="escCaja" class="vacio">Trayendo el archivo\u2026</div>
      </div>
      <div class="modal-foot">
        <span class="hint">${esc(nombre)}${manual.quien
          ? " \u00b7 lo subi\u00f3 " + esc(manual.quien) : ""}</span>
        <div class="spacer"></div>
        <button class="btn" id="bBajarEsc" disabled>Descargar</button>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const pintar = src => {
    ov.querySelector("#escCaja").outerHTML = esImagen
      ? `<img src="${esc(src)}" alt="${esc(nombre)}"
           style="max-width:100%;display:block;margin:0 auto;background:#fff">`
      : `<iframe src="${esc(src)}" title="${esc(nombre)}"
           style="border:0;width:100%;height:70vh;background:#fff"></iframe>`;
    const b = ov.querySelector("#bBajarEsc");
    b.disabled = false;
    b.onclick = () => {
      const a = document.createElement("a");
      a.href = src; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
    };
  };

  // Incrustado: ya lo trae consigo. En el almac\u00e9n: hay que ir por \u00e9l con la
  // sesi\u00f3n, porque el dep\u00f3sito es privado y no se abre con una liga suelta.
  if (manual.pdf) return pintar(manual.pdf);

  bajarEscaneo(manual.ruta)
    .then(src => {
      pintar(src);
      // La direcci\u00f3n temporal se suelta al cerrar; si no, el archivo se queda
      // en memoria hasta recargar la p\u00e1gina.
      ov.addEventListener("remove", () => URL.revokeObjectURL(src));
    })
    .catch(e => {
      const caja = ov.querySelector("#escCaja");
      if (caja) caja.innerHTML = `<div class="errbox" style="text-align:left">
        <b>No se pudo traer el archivo del almac\u00e9n.</b><br>
        <span class="hint">${esc(e.message)}</span><br>
        Si dice <i>Bucket not found</i>, falta correr <code>archivos.sql</code>.</div>`;
    });
}

/* ==========================================================================
   BANQUETES · el documento

   Sale de las cotizaciones que trae el departamento, sección por sección:
   detalles del evento, los servicios descritos, la propuesta económica con su
   IVA y su cargo por servicio, las observaciones y la firma.
   ========================================================================== */

const TEXTOS_EV = {
  saludo: "Agradeciendo su preferencia, anexo detallado de los servicios cotizados " +
          "para su evento en {{HOTEL}} en base a la información previamente proporcionada.",
  cortesia: "Si el consumo de Alimentos y Bebidas (en importes netos) cubre la renta del " +
            "espacio, el salón se otorga en cortesía. En caso contrario, el salón será " +
            "re-cotizado.",
  vigencia: "Le recordamos que la presente es solamente una cotización y no establece un " +
    "compromiso por parte del Hotel, tiene una vigencia hasta el {{VIGENCIA}}. En caso de " +
    "confirmar los servicios deberá procederse a la contratación del evento mediante firma " +
    "de contrato y pago de anticipo.",
  observaciones: "Se prohíbe el ingreso de Alimentos & Bebidas ajenos al Hotel.",
  cierre: "Me reitero nuevamente a sus órdenes por cualquier duda o requerimiento adicional."
};

const anioEvento = e => String(e.fecha || hoyISO()).slice(0, 4) ||
  String(new Date().getFullYear());

/** Serie propia: EV para cotizaciones de evento, CB para contratos de banquetes. */
function folioEvento(tipo, anio, excluirId){
  const pre = tipo === "contrato" ? "CB" : "EV";
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^" + pre + "-" + a + "-(\\d+)$", "i");
  const usados = new Set(state.eventos
    .filter(x => x.id !== excluirId)
    .map(x => String(x.folio || "").trim().toUpperCase()));
  let n = Math.max(0, ...state.eventos
    .filter(x => x.id !== excluirId)
    .map(x => Number((re.exec(String(x.folio || "").trim()) || [])[1]) || 0)) + 1;
  let f;
  do { f = `${pre}-${a}-${String(n++).padStart(3, "0")}`; } while (usados.has(f));
  return f;
}

const eventoEsMio = e => puedeVerTodo() ||
  (!!miNombre().trim() && ejecutivoDeEv(e).toLowerCase() === miNombre().trim().toLowerCase()) ||
  esMio(cliente(e.clienteId) || {});

/** Los eventos que le tocan a quien está viendo, del tipo que se le pida. */
const eventosVisibles = tipo => state.eventos
  .filter(e => e.tipo === tipo && eventoEsMio(e))
  .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));

/** "jueves 15 de enero, 2026" — como lo escribe banquetes en sus cotizaciones. */
function fechaLarga(iso){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return String(iso || "");
  const [a, m, d] = String(iso).split("-").map(Number);
  const f = new Date(a, m - 1, d);
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
                 "septiembre","octubre","noviembre","diciembre"];
  return `${dias[f.getDay()]} ${d} de ${meses[m-1]}, ${a}`;
}

const fechaBloque = f => /^\d{4}-\d{2}-\d{2}$/.test(String(f))
  ? fechaCorta(f) : String(f || "—");

/** La cotización lleva su carta; el contrato, el legal completo. */
const docEvento = (e, c) => e.tipo === "contrato" ? cuerpoContratoBq(e, c) : cuerpoEvento(e, c);

      <i>Atención:</i><br>
      <b>${esc(e.atencion || (c && c.contacto) || "—")}</b><br>
      ${c && c.empresa ? esc(c.empresa) + "<br>" : ""}
      ${c && c.email ? esc(c.email) + "<br>" : ""}
      ${e.titulo ? `Ref. “${esc(e.titulo)}”` : ""}
    </div>

    <p style="white-space:pre-wrap">${esc(rellena(TEXTOS_EV.saludo))}</p>

    ${e.bloques.length ? `
      <h2>Detalles de evento</h2>
      <table class="tar"><thead><tr>
          <th style="width:92px">Fecha</th><th style="width:92px">Horario</th><th>Evento</th>
          <th class="num" style="width:52px">Pax</th><th style="width:88px">Montaje</th>
          <th style="width:96px">Salón</th><th style="width:130px">Renta</th></tr></thead>
        <tbody>${e.bloques.map(b => `<tr>
          <td class="nowrap">${esc(fechaBloque(b.fecha))}</td>
          <td class="nowrap">${esc(b.horario || "—")}</td>
          <td>${esc(b.evento || "—")}</td>
          <td class="num">${esc(b.pax || "—")}</td>
          <td>${esc(b.montaje || "—")}</td>
          <td>${esc(b.salon || "—")}</td>
          <td>${esc(b.renta || "—")}</td></tr>`).join("")}</tbody></table>
      <div class="inc">${esc(TEXTOS_EV.cortesia)}</div>` : ""}

    ${e.servicios ? `
      <h2>Servicios cotizados</h2>
      <div class="pol" style="white-space:pre-wrap">${esc(e.servicios)}</div>` : ""}

    ${cu.lineas.length ? `
      <h2>Propuesta económica del evento</h2>
      <table class="tar"><thead><tr>
          <th style="width:82px">Fecha</th><th>Servicio</th>
          <th class="num" style="width:54px">Cant.</th>
          <th class="num" style="width:88px">P. unitario</th>
          <th class="num" style="width:92px">Subtotal</th>
          <th class="num" style="width:76px">IVA ${esc(String(e.iva))}%</th>
          <th class="num" style="width:82px">Serv. ${esc(String(e.cargoServicio))}%</th>

        <tbody>${cu.lineas.map(l => `<tr>
          <td class="nowrap">${esc(fechaBloque(l.fecha))}</td>

          <tr class="ct-tot">
            <td colspan="4"><b>Total del evento</b></td>
            <td class="num"><b>${esc(moneyMN(cu.subtotal))}</b></td>
            <td class="num"><b>${esc(moneyMN(cu.iva))}</b></td>
            <td class="num"><b>${esc(moneyMN(cu.serv))}</b></td>
            <td class="num"><b>${esc(moneyMN(cu.total))}</b></td></tr></tbody></table>
      <div class="inc">El cargo por servicio del ${esc(String(e.cargoServicio))}% aplica
        únicamente a alimentos y bebidas.</div>` : ""}

    <h2>Observaciones</h2>
    <div class="pol" style="white-space:pre-wrap">${esc(
      e.observaciones || TEXTOS_EV.observaciones)}</div>

    <div class="pol" style="margin-top:14px">${esc(rellena(TEXTOS_EV.vigencia))}</div>

    <p style="white-space:pre-wrap;margin-top:14px">${esc(TEXTOS_EV.cierre)}</p>

    <div class="firmas">
      ${bloqueFirma(e.firmaHotel, "Por el hotel", ejecutivoDeEv(e),
        (u && u.rol === "banquetes") ? "Banquetes" : "Banquetes", "")}
      ${bloqueFirma(e.firmaCliente, "Firma de aceptación",
        e.atencion || (c && c.contacto) || "", "", (c && c.telefono) || "")}
    </div>`;
}

function renderEventos(){ pintarListaEv("cotizacion", "tblEventos"); }
function renderContratosBq(){ pintarListaEv("contrato", "tblContratosBq"); }

function pintarListaEv(tipo, idCaja){
  const cont = document.getElementById(idCaja);
  const es = eventosVisibles(tipo);
  const conEje = puedeVerTodo();
  const esCot = tipo === "cotizacion";

  const cab = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <b style="font-size:15px">${esCot ? "Cotizaciones de evento" : "Contratos de banquetes"}</b>
      <span class="hint">${es.length} en total</span>
      <span style="flex:1"></span>
      <button class="btn" data-subirev="${tipo}">Subir uno firmado</button>
      <button class="btn primary" data-nuevoev="${tipo}">+ ${esCot ? "Nueva cotización" : "Nuevo contrato"}</button></div>
    <div class="note">${esCot
      ? "Cotiza un evento: el salón, las horas, los invitados y lo que se sirve. " +
        "Cuando el cliente confirma, se pasa a contrato desde la propia cotización."
      : "El contrato de prestación de servicios, con su anticipo y sus penas por " +
        "cancelación. Sale de una cotización aceptada."}</div>`;

  if (!es.length){
    cont.innerHTML = cab + `<div class="vacio">Todavía no hay ${esCot ? "cotizaciones" : "contratos"}.</div>`;
  } else {
    cont.innerHTML = cab + `<table class="data">
      <thead><tr><th>Folio</th><th>Evento</th><th>Cliente</th>${conEje ? "<th>Ejecutivo</th>" : ""}
        <th>Fecha del evento</th><th class="num">Pax</th><th class="num">Total</th>
        <th>Estado</th><th>Enviado</th><th></th></tr></thead>
      <tbody>${es.map(e => {
        const ec = ESTADOS_EV[e.estado], cu = cuentasEvento(e);
        const pax = e.bloques.reduce((a,b) => Math.max(a, Number(b.pax) || 0), 0);
        const fe = fechaEvento(e);
        return `<tr class="row-link" data-id="${e.id}">
          <td><b>${esc(e.folio || "—")}</b>${e.externo
            ? ` <span class="pill" title="Se subió escaneado">externo</span>` : ""}</td>
          <td>${esc(e.titulo || "—")}</td>
          <td>${esc(nombreCli(e.clienteId))}</td>
          ${conEje ? `<td class="nowrap">${esc(ejecutivoDeEv(e) || "—")}</td>` : ""}
          <td class="nowrap">${fe ? esc(fechaCorta(fe)) : "—"}</td>
          <td class="num">${pax || "—"}</td>
          <td class="num nowrap"><b>${esc(moneyMN(cu.total))}</b></td>
          <td><span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span></td>
          <td class="nowrap">${selloEnvio(e)}</td>
          <td class="nowrap"><button class="btn sm" data-doc="${e.id}">Ver documento</button></td>
        </tr>`;
      }).join("")}</tbody></table>`;

    cont.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", ev => {
      const d = ev.target.closest("[data-doc]");
      if (d){ ev.stopPropagation(); verEvento(d.dataset.doc); return; }
      editarEvento(tr.dataset.id);
    }));
  }
  cont.querySelector("[data-nuevoev]").onclick = () => editarEvento(null, tipo);
  cont.querySelector("[data-subirev]").onclick = () => subirEventoExterno(tipo);
}

/* ----- El editor ----- */

function editarEvento(id, tipoPre, alCerrar){
  const existente = id ? state.eventos.find(x => x.id === id) : null;

  if (existente && existente.externo){ verEventoExterno(existente, alCerrar); return; }
  if (existente && existente.estado !== "borrador"){
    alert("Este documento ya salió y no se puede editar.\n\nSe abrirá en modo lectura.");
    verEvento(existente.id, alCerrar);
    return;
  }

  const tipo = existente ? existente.tipo : (tipoPre || "cotizacion");
  const e = existente || saneaEvento({
    tipo, fecha: hoyISO(), ejecutivo: miNombre(),
    folio: folioEvento(tipo, new Date().getFullYear()),
    bloques: [saneaBloqueEv({})],
    lineas: [saneaLineaEv({})]
  });

  const filaB = b => `<tr>
    <td><input class="field b-fecha" type="date" value="${esc(b.fecha)}" style="width:100%"></td>
    <td><input class="field b-hora" value="${esc(b.horario)}" placeholder="20:00-02:00" style="width:100%"></td>
    <td><input class="field b-evento" value="${esc(b.evento)}" placeholder="Boda" style="width:100%"></td>
    <td><input class="field b-pax num" inputmode="numeric" value="${esc(b.pax)}" style="width:100%;text-align:right"></td>
    <td><input class="field b-montaje" value="${esc(b.montaje)}" list="listaMontajes" style="width:100%"></td>
    <td><input class="field b-salon" value="${esc(b.salon)}" placeholder="Ónix" style="width:100%"></td>
    <td><input class="field b-renta" value="${esc(b.renta)}" placeholder="En cortesía por consumo" style="width:100%"></td>
    <td><button class="btn sm danger" data-quita>✕</button></td></tr>`;

  const filaL = l => `<tr>
    <td><input class="field l-fecha" type="date" value="${esc(l.fecha)}" style="width:100%"></td>
    <td><input class="field l-servicio" value="${esc(l.servicio)}" placeholder="Cena emplatada" style="width:100%"></td>
    <td><input class="field l-cant num" inputmode="numeric" value="${l.cantidad || ""}" style="width:100%;text-align:right"></td>
    <td><input class="field l-precio num" inputmode="decimal" value="${l.precio || ""}" style="width:100%;text-align:right"></td>
    <td class="selcell"><input type="checkbox" class="l-serv"${l.conServicio ? " checked" : ""}
          title="¿Lleva cargo por servicio? Sólo alimentos y bebidas."></td>
    <td class="num l-sub">—</td>
    <td class="num l-tot">—</td>
    <td><button class="btn sm danger" data-quita>✕</button></td></tr>`;

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${existente ? "Editar" : "Nueva"} ${esc(infoTipoEv(tipo).name.toLowerCase())} de evento</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div id="evErr"></div>
        <div class="grid">
          <div class="full"><label class="lbl">Cliente</label>
            <select class="field" id="evCli">
              <option value="">— Selecciona un cliente —</option>
              ${[...state.clientes].sort((a,b)=>a.empresa.localeCompare(b.empresa,"es")).map(x =>
                `<option value="${x.id}"${x.id===e.clienteId?" selected":""}>${esc(x.empresa)}${
                  x.contacto?" · "+esc(x.contacto):""}</option>`).join("")}
            </select></div>
          <div><label class="lbl">Atención a <span class="hint">(a quién va dirigida)</span></label>
            <input class="field" id="evAtn" value="${esc(e.atencion)}" placeholder="Claudia Cruz"></div>
          <div><label class="lbl">Referencia del evento</label>
            <input class="field" id="evTit" value="${esc(e.titulo)}" placeholder="Boda Claudia &amp; Ricardo"></div>
          <div><label class="lbl">Folio</label>
            <input class="field" id="evFolio" value="${esc(e.folio)}"></div>
          <div><label class="lbl">Fecha del documento</label>
            <input class="field" type="date" id="evFecha" value="${esc(e.fecha)}"></div>
          <div><label class="lbl">Vigencia hasta</label>
            <input class="field" type="date" id="evVig" value="${esc(e.vigencia)}"></div>
          <div class="full"><label class="lbl">Ejecutivo de banquetes</label>
            ${selectEjecutivo(e.ejecutivo || (cliente(e.clienteId)||{}).ejecutivo || miNombre(), "evEje")}</div>
          <div><label class="lbl">IVA (%)</label>
            <input class="field" id="evIva" inputmode="decimal" value="${esc(String(e.iva))}"></div>
          <div><label class="lbl">Cargo por servicio (%)</label>
            <input class="field" id="evServ" inputmode="decimal" value="${esc(String(e.cargoServicio))}">
            <div class="hint">Sólo sobre alimentos y bebidas.</div></div>
        </div>

        <h3 class="sec">Detalles del evento</h3>
        <div class="note">Un renglón por momento: el cóctel, la cena, el after. Es lo que
          después se ve en el calendario.</div>
        <div style="overflow:auto"><table class="data" id="tBloq">
          <thead><tr><th style="width:150px">Fecha</th><th style="width:120px">Horario</th><th>Evento</th>
            <th class="num" style="width:80px">Pax</th><th style="width:130px">Montaje</th>
            <th style="width:130px">Salón</th><th style="width:180px">Renta</th><th style="width:44px"></th></tr></thead>
          <tbody>${(e.bloques.length ? e.bloques : [saneaBloqueEv({})]).map(filaB).join("")}</tbody></table></div>
        <datalist id="listaMontajes">${MONTAJES.map(m => `<option value="${esc(m)}">`).join("")}</datalist>
        <p style="margin:8px 0 0"><button class="btn" id="bAddBloq">+ Agregar momento</button></p>

        <h3 class="sec">Servicios cotizados</h3>
        <p class="hint" style="margin-top:0">Tal cual va en el documento: por espacio, con sus
          viñetas. Se imprime respetando los renglones.</p>
        <textarea class="field" id="evServicios" style="width:100%;min-height:150px"
          placeholder="Jardín ZEN&#10;· Ceremonia durante 2 horas previas a la recepción&#10;· Barra de mixología por 1 hora">${esc(e.servicios)}</textarea>

        <h3 class="sec">Propuesta económica</h3>
        <div class="note">La palomita de <b>Serv.</b> marca los renglones que llevan el cargo
          por servicio: alimentos y bebidas sí, audiovisual y mobiliario no.</div>
        <div style="overflow:auto"><table class="data" id="tLin">
          <thead><tr><th style="width:150px">Fecha</th><th>Servicio</th>
            <th class="num" style="width:80px">Cant.</th><th class="num" style="width:110px">P. unitario</th>
            <th style="width:54px">Serv.</th>
            <th class="num" style="width:110px">Subtotal</th>
            <th class="num" style="width:120px">Total</th><th style="width:44px"></th></tr></thead>
          <tbody>${(e.lineas.length ? e.lineas : [saneaLineaEv({})]).map(filaL).join("")}</tbody>
          <tfoot><tr><td colspan="5"><b>Total del evento</b></td>
            <td class="num" id="evSub"><b>—</b></td>
            <td class="num" id="evTot"><b>—</b></td><td></td></tr></tfoot></table></div>
        <p style="margin:8px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn" id="bAddLin">+ Agregar renglón</button>
          <span class="hint" id="evDesglose"></span></p>

        ${tipo === "contrato" ? `
          <h3 class="sec">Del contrato</h3>
          <div class="grid">
            <div><label class="lbl">Garantía de invitados</label>
              <input class="field" id="evGar" inputmode="numeric" value="${esc(e.garantiaPax)}"
                placeholder="150"></div>
            <div><label class="lbl">Anticipo</label>
              <input class="field" id="evAnt" inputmode="decimal" value="${e.anticipo === "" ? "" : e.anticipo}"></div>
            <div><label class="lbl">Pagar antes del</label>
              <input class="field" type="date" id="evLim" value="${esc(e.fechaLimitePago)}"></div>
          </div>` : ""}

        <h3 class="sec">Observaciones</h3>
        <textarea class="field" id="evObs" style="width:100%;min-height:70px"
          placeholder="${esc(TEXTOS_EV.observaciones)}">${esc(e.observaciones)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDelEv">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="bOkEv">Guardar borrador</button>
        <button class="btn ok" id="bFirmarEv">Guardar y firmar</button>
      </div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  const pct = id => Number(q(id).value) || 0;

  function recalcular(){
    const pIva = pct("#evIva") / 100, pServ = pct("#evServ") / 100;
    let sub = 0, iva = 0, serv = 0;
    ov.querySelectorAll("#tLin tbody tr").forEach(tr => {
      const cant = Number(tr.querySelector(".l-cant").value) || 0;
      const pr = parseMoney(tr.querySelector(".l-precio").value);
      const st = cant * pr;
      const i = st * pIva, sv = tr.querySelector(".l-serv").checked ? st * pServ : 0;
      sub += st; iva += i; serv += sv;
      tr.querySelector(".l-sub").textContent = st ? moneyMN(st) : "—";
      tr.querySelector(".l-tot").textContent = st ? moneyMN(st + i + sv) : "—";
    });
    q("#evSub").innerHTML = `<b>${sub ? esc(moneyMN(sub)) : "—"}</b>`;
    q("#evTot").innerHTML = `<b>${sub ? esc(moneyMN(sub + iva + serv)) : "—"}</b>`;
    q("#evDesglose").textContent = sub
      ? `Subtotal ${moneyMN(sub)} · IVA ${moneyMN(iva)} · servicio ${moneyMN(serv)}` : "";
  }

  ov.addEventListener("input", ev => {
    if (ev.target.closest("#tLin") || ev.target.id === "evIva" || ev.target.id === "evServ")
      recalcular();
  });
  ov.addEventListener("change", ev => {
    if (ev.target.classList.contains("l-serv")) recalcular();
  });
  ov.addEventListener("click", ev => {
    const b = ev.target.closest("[data-quita]");
    if (!b) return;
    const tr = b.closest("tr"), cuerpo = tr.parentElement;
    tr.remove();
    if (!cuerpo.children.length)
      cuerpo.insertAdjacentHTML("beforeend",
        cuerpo.closest("#tBloq") ? filaB(saneaBloqueEv({})) : filaL(saneaLineaEv({})));
    recalcular();
  });
  recalcular();

  q("#bAddBloq").onclick = () =>
    ov.querySelector("#tBloq tbody").insertAdjacentHTML("beforeend", filaB(saneaBloqueEv({})));
  q("#bAddLin").onclick = () => {
    ov.querySelector("#tLin tbody").insertAdjacentHTML("beforeend", filaL(saneaLineaEv({})));
    recalcular();
  };

  const bd = q("#bDelEv");
  if (bd) bd.onclick = () => {
    if (!confirm("¿Eliminar este documento? Esta acción no se puede deshacer.")) return;
    state.eventos = state.eventos.filter(x => x.id !== e.id);
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  q("#bOkEv").onclick = () => { if (recoger()){ ov.remove(); if (alCerrar) alCerrar(); } };
  q("#bFirmarEv").onclick = () => {
    if (!recoger()) return;
    ov.remove();
    verEvento(e.id, alCerrar, true);
  };

  function pintaErrores(lista){
    q("#evErr").innerHTML = lista.length
      ? `<div class="errbox"><b>Falta esto para poder continuar:</b><ul>${
          lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      : "";
  }

  function recoger(){
    const cid = q("#evCli").value;
    const bloques = [...ov.querySelectorAll("#tBloq tbody tr")].map(tr => saneaBloqueEv({
      fecha: tr.querySelector(".b-fecha").value, horario: tr.querySelector(".b-hora").value,
      evento: tr.querySelector(".b-evento").value, pax: tr.querySelector(".b-pax").value,
      montaje: tr.querySelector(".b-montaje").value, salon: tr.querySelector(".b-salon").value,
      renta: tr.querySelector(".b-renta").value
    })).filter(b => b.fecha || b.evento || b.salon);
    const lineas = [...ov.querySelectorAll("#tLin tbody tr")].map(tr => saneaLineaEv({
      fecha: tr.querySelector(".l-fecha").value, servicio: tr.querySelector(".l-servicio").value,
      cantidad: tr.querySelector(".l-cant").value,
      precio: parseMoney(tr.querySelector(".l-precio").value),
      conServicio: tr.querySelector(".l-serv").checked
    })).filter(l => l.servicio || l.cantidad || l.precio);

    const problemas = [];
    if (!cid) problemas.push("Selecciona el cliente.");
    if (!bloques.length) problemas.push("Captura al menos un momento del evento.");
    if (!bloques.some(b => b.fecha))
      problemas.push("Al menos un momento necesita fecha, o el evento no sale en el calendario.");
    if (!lineas.length) problemas.push("Captura al menos un renglón en la propuesta económica.");
    lineas.forEach((l, i) => {
      if (!l.servicio) problemas.push(`Al renglón ${i+1} de la propuesta le falta el servicio.`);
      if (!l.cantidad) problemas.push(`Al renglón ${i+1} le falta la cantidad.`);
      if (!l.precio)   problemas.push(`Al renglón ${i+1} le falta el precio.`);
    });

    pintaErrores(problemas);
    if (problemas.length){
      q("#evErr").scrollIntoView({ block:"center", behavior:"smooth" });
      return false;
    }

    let folio = q("#evFolio").value.trim();
    if (state.eventos.some(x => x.id !== e.id &&
        String(x.folio || "").trim().toUpperCase() === folio.toUpperCase()))
      folio = folioEvento(tipo, String(q("#evFecha").value || "").slice(0,4), e.id);

    Object.assign(e, {
      clienteId: cid,
      ejecutivo: q('[name="evEje"]').value.trim(),
      atencion: q("#evAtn").value.trim(),
      titulo: q("#evTit").value.trim(),
      folio,
      fecha: q("#evFecha").value || hoyISO(),
      vigencia: q("#evVig").value,
      iva: pct("#evIva"), cargoServicio: pct("#evServ"),
      bloques, lineas,
      servicios: q("#evServicios").value.trim(),
      observaciones: q("#evObs").value.trim(),
      garantiaPax: q("#evGar") ? q("#evGar").value.trim() : e.garantiaPax,
      anticipo: q("#evAnt") ? (q("#evAnt").value.trim() === "" ? "" : parseMoney(q("#evAnt").value)) : e.anticipo,
      fechaLimitePago: q("#evLim") ? q("#evLim").value : e.fechaLimitePago,
      updatedAt: new Date().toISOString()
    });
    if (!existente){ e.createdAt = new Date().toISOString(); state.eventos.push(e); }
    guardar(); render();
    return true;
  }
}

/**
 * El contrato de prestación de servicios de eventos sociales.
 *
 * Es el legal que usa banquetes, con sus diecinueve cláusulas. Lo que cambia
 * de un contrato a otro son unos cuantos huecos —el cliente, el evento, el
 * salón, el monto—; el resto es siempre igual, así que vive aquí y no se
 * recaptura. Los datos fiscales y bancarios del hotel salen de Ajustes: en
 * este archivo no puede haber ninguno, porque se publica.
 */
function cuerpoContratoBq(e, c){
  if (!(c && c.empresa) && e.destinatario) c = e.destinatario;
  const h = state.ajustes.hotel;
  const cu = cuentasEvento(e);
  const fe = fechaEvento(e);
  const primero = e.bloques[0] || {};
  const hueco = v => String(v || "").trim() || "________________";

  const cl = (t, x) => `<div class="cl"><b>${esc(t)}</b> ${x}</div>`;
  const li = xs => `<ul class="ct-serv">${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const penas = [
    "El 10% del monto total, si la cancelación se solicita 90 días hábiles antes del evento.",
    "El 25% del monto total, si se solicita 60 días hábiles antes del evento.",
    "El 50% del monto total, si se solicita 30 días hábiles antes del evento.",
    "El 100% del monto total, si se solicita 5 días hábiles antes del evento."
  ];

  return `
    <div class="doc-hotel">
      ${h.logo ? `<img class="doc-logo" src="${esc(h.logo)}" alt="${esc(h.nombre)}">`
        : esQuartz(h.nombre) ? `<div class="doc-wordmark">${logoQuartz(MORADO_QUARTZ)}</div>`
        : `<div class="doc-mono">${monogramaQ(MORADO_QUARTZ)}</div><b>${esc(h.nombre)}</b>`}
    </div>
    <div class="doc-regla"></div>

    <h1 style="font-size:14px;text-align:center;margin:14px 0 12px;color:#39104e;
      line-height:1.5">CONTRATO DE PRESTACIÓN DE SERVICIOS DE EVENTOS SOCIALES
      (BANQUETES)</h1>

    <div class="pol">Que celebran por una parte <b>${esc(hueco(h.razonSocial))}</b>,
      representada por <b>${esc(hueco(h.representante))}</b>, a quien en lo sucesivo se le
      denominará <b>“EL PRESTADOR DEL SERVICIO”</b>, y por la otra
      <b>${esc(hueco(c && c.empresa))}</b>, a quien en lo sucesivo se le denominará
      <b>“EL CLIENTE”</b>, al tenor de las siguientes declaraciones y cláusulas:</div>

    <h2>Declaraciones</h2>
    <div class="pol"><b>I.- Declara “EL PRESTADOR DEL SERVICIO”:</b></div>
    ${li([
      `Ser una persona moral mexicana según consta en la escritura pública ${hueco(h.escritura)}.`,
      `Que su RFC es ${hueco(h.rfc)} y su domicilio el ubicado en ${hueco(h.domicilioFiscal)}.`,
      "Que cuenta con la capacidad, infraestructura, servicios y recursos necesarios para dar " +
      "cabal cumplimiento a las obligaciones contenidas en el presente contrato.",
      `Que cuenta con personal capacitado para atender quejas y reclamaciones, para lo cual ` +
      `señala el teléfono ${h.telefono}, con horario de atención ${h.horarioAtencion}.`,
      "Que informó al CLIENTE los precios, tarifas, condiciones, características y costo total " +
      "del servicio, así como las restricciones aplicables."
    ])}

    <div class="pol"><b>II.- Declara “EL CLIENTE”:</b></div>
    ${li([
      "Llamarse como ha quedado plasmado en el proemio de este contrato.",
      "Que es su deseo obligarse en los términos y condiciones del presente contrato, " +
      "manifestando que cuenta con la capacidad legal para celebrarlo.",
      `Que su domicilio es ${hueco(c && c.ubicacion)}, con teléfono ` +
      `${hueco(c && c.telefono)} y correo electrónico ${hueco(c && c.email)}.`
    ])}

    <h2>Cláusulas</h2>

    ${cl("PRIMERA. CONSENTIMIENTO.—",
      "Las partes manifiestan su voluntad de celebrar el presente contrato de prestación de " +
      "servicios de eventos sociales, por lo que EL PRESTADOR DEL SERVICIO se obliga a prestar " +
      "el servicio a EL CLIENTE en el domicilio del primero y, en consecuencia, este último se " +
      "obliga a pagar como contraprestación un precio cierto y determinado.")}

    ${cl("SEGUNDA. OBJETO.—",

/** Cantidades en letra, que es como las pide un contrato. */
function enLetras(n){
  const ent = Math.floor(Math.abs(Number(n) || 0));
  const cent = Math.round((Math.abs(Number(n) || 0) - ent) * 100);
  const U = ["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
    "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve",
    "veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis",
    "veintisiete","veintiocho","veintinueve"];
  const D = ["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const C = ["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos",
    "setecientos","ochocientos","novecientos"];
  const hasta999 = x => {
    if (x === 0) return "";
    if (x === 100) return "cien";
    const c = Math.floor(x / 100), d = Math.floor((x % 100) / 10), u = x % 10;
    const resto = x % 100;
    let t = C[c];
    if (resto){
      if (t) t += " ";
      t += resto < 30 ? U[resto] : (D[d] + (u ? " y " + U[u] : ""));
    }
    return t;
  };
  const tramo = (x, sing, plur) => {
    if (!x) return "";
    if (x === 1) return sing;
    return hasta999(x) + " " + plur;
  };
  let t;
  if (ent === 0) t = "cero";
  else {
    const mill = Math.floor(ent / 1e6), miles = Math.floor((ent % 1e6) / 1000), r = ent % 1000;
    t = [tramo(mill, "un millón", "millones"), tramo(miles, "mil", "mil"), hasta999(r)]
      .filter(Boolean).join(" ");
  }
  return `${t} pesos ${String(cent).padStart(2, "0")}/100 M.N.`;
}

function verEvento(id, alCerrar, pedirFirma){
  const e = state.eventos.find(x => x.id === id);
  if (!e) return;
  if (e.externo){ verEventoExterno(e, alCerrar); return; }
  const c = cliente(e.clienteId);
  const h = state.ajustes.hotel;
  const ec = ESTADOS_EV[e.estado];
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);
  const yaTieneContrato = state.eventos.some(x => x.cotizacionId === e.id);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>${esc(infoTipoEv(e.tipo).name)} ${esc(e.folio || "")}</h2>
        <span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span>
        <button class="btn" data-close>✕</button>
      </div>
      <div class="doc-body">
        ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
        <div class="doc-contenido">${docEvento(e, c)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrintEv">Imprimir</button>
        <button class="btn" id="bPdfEv">Descargar PDF</button>
        ${e.estado === "borrador" ? `<button class="btn" id="bEditEv">Editar</button>` : ""}
        <div class="spacer"></div>
        ${e.tipo === "cotizacion" && !yaTieneContrato
          ? `<button class="btn" id="bAContrato">Pasar a contrato</button>` : ""}
        ${!e.firmaHotel ? `<button class="btn ok" id="bEvF1">Firmar por el hotel</button>` : ""}
        ${e.firmaHotel && !e.firmaCliente
          ? `<button class="btn primary" id="bEvEnviar">Enviar al cliente</button>
             <button class="btn ok" id="bEvF2">Registrar firma del cliente</button>` : ""}
        ${e.firmaCliente ? `<span class="hint">Aceptado y firmado por el cliente.</span>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrintEv").onclick = () => {
    fijarPagina(false);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);
  };

  const bp = ov.querySelector("#bPdfEv");
  bp.onclick = async () => {
    const antes = bp.textContent;
    bp.disabled = true; bp.textContent = "Generando…";
    try{
      const bytes = await pdfDeDocumento(docEvento(e, c));
      descargarBlob(new Blob([bytes], { type:"application/pdf" }), nombrePdfEvento(e, c));
    }catch(err){
      alert("No se pudo generar el PDF aquí: " + err.message +
            "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }finally{ bp.disabled = false; bp.textContent = antes; }
  };

  const be = ov.querySelector("#bEditEv");
  if (be) be.onclick = () => { ov.remove(); editarEvento(e.id, null, alCerrar); };

  const bc = ov.querySelector("#bAContrato");
  if (bc) bc.onclick = () => { ov.remove(); pasarAContratoBq(e, alCerrar); };

  const f1 = ov.querySelector("#bEvF1");
  if (f1) f1.onclick = () => padFirma("Firma por el hotel",
    { nombre: ejecutivoDeEv(e) || miNombre(), puesto:"Banquetes", celular:"" },
    d => { firmarEvento(e, "hotel", d); ov.remove(); verEvento(e.id, alCerrar); },
    { recordar:true });

  const f2 = ov.querySelector("#bEvF2");
  if (f2) f2.onclick = () => padFirma("Firma de aceptación del cliente",
    { nombre: e.atencion || (c && c.contacto) || "", puesto:"", celular:(c && c.telefono) || "" },
    d => { firmarEvento(e, "cliente", d); ov.remove(); verEvento(e.id, alCerrar); });

  const en = ov.querySelector("#bEvEnviar");
  if (en) en.onclick = () => enviarEvento(e, c);

  if (pedirFirma && !e.firmaHotel && f1) setTimeout(() => f1.click(), 60);
}

function firmarEvento(e, quien, d){
  const fecha = new Date().toISOString();
  const firma = saneaFirma(Object.assign({}, d, { fecha }));
  const c = cliente(e.clienteId);
  const doc = infoTipoEv(e.tipo).name;

  if (quien === "hotel"){
    e.firmaHotel = firma;
    if (e.estado === "borrador") e.estado = "firmado";
    if (c) e.destinatario = { empresa:c.empresa, contacto:c.contacto, ubicacion:c.ubicacion,
                              telefono:c.telefono, email:c.email };
    registrarAuto(e.clienteId, `${doc} ${e.folio} firmada por el hotel`,
      e.titulo || "", ejecutivoDeEv(e));
  } else {
    e.firmaCliente = firma;
    e.estado = "confirmado";
    registrarAuto(e.clienteId, `${doc} ${e.folio} aceptada por el cliente`,
      `Firmó ${d.nombre}.`, ejecutivoDeEv(e));
    // Un evento confirmado es un cliente ganado.
    if (c && !est(c.estatus).won){ c.estatus = "ganado"; c.updatedAt = fecha; }
  }
  e.updatedAt = new Date().toISOString();
  guardar(); render();
}

  const k = saneaEvento(Object.assign({}, cot, {

    folio: folioEvento("contrato", anioEvento(cot)),
    estado:"borrador", firmaHotel:null, firmaCliente:null, enviado:null,
    garantiaPax: String(cot.bloques.reduce((a,b) => Math.max(a, Number(b.pax) || 0), 0) || ""),
    fecha: hoyISO(), createdAt:"", updatedAt:""
  }));
  state.eventos.push(k);
  guardar();
  vista = "contratosbq"; render();
  editarEvento(k.id, null, alCerrar);
}

    (fe ? ` El evento sería el ${fechaTexto(fe)}.` : "") +

    `\n\nQuedo al pendiente de sus comentarios.\n\nSaludos cordiales,\n${firmante}\n${h.nombre}`;

  const anotar = via => {

    e.updatedAt = new Date().toISOString();

    guardar(); render();
  };

  pdfDeDocumento(docEvento(e, c)).then(bytes => {
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" &&
                           navigator.canShare({ files:[file] });

    ov.querySelector("#cuerpoEnvioEv").innerHTML =
      (puedeCompartir
        ? `<div class="note">Con <b>Compartir</b> se va el PDF y el mensaje juntos.</div>
           <p><button class="btn ok" id="evCompartir" style="font-size:15px;padding:10px 16px">
             Compartir el PDF y el mensaje</button></p>`
        : `<div class="note warn">Este navegador no deja mandar el archivo y el mensaje de una
             vez. Descargue el PDF y adjúntelo a mano.</div>`) +
      `<p><button class="btn" id="evBajar">Descargar el PDF</button></p>
       <p class="hint" style="margin:10px 0 4px">O abra el mensaje ya redactado:</p>
       <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <button class="btn" id="evMail" ${(c && c.email) ? "" : "disabled"}>Enviar por correo</button>
         <button class="btn wa" id="evWa" ${(c && c.telefono) ? "" : "disabled"}
           title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button></p>
       <p class="hint">Se guardará como <b>${esc(archivo)}</b></p>`;

    const comp = ov.querySelector("#evCompartir");
    if (comp) comp.onclick = async () => {
      try{
        await navigator.share({ files:[file], title:asunto, text:mensaje });
        anotar("whatsapp"); ov.remove();
      }catch(err){}
    };
    ov.querySelector("#evBajar").onclick = () => descargarBlob(blob, archivo);
    ov.querySelector("#evMail").onclick = () => {
      window.location.href = `mailto:${encodeURIComponent((c && c.email) || "")}` +
        `?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(mensaje)}`;
      anotar("correo"); ov.remove();
    };
    ov.querySelector("#evWa").onclick = () => {
      window.open(waLink((c && c.telefono) || "", mensaje), "_blank", "noopener");
      anotar("whatsapp"); ov.remove();
    };
  }).catch(err => {
    ov.querySelector("#cuerpoEnvioEv").innerHTML =
      `<div class="errbox">No se pudo armar el PDF: ${esc(err.message)}</div>`;
  });
}

/* ==========================================================================
   CALENDARIO

   Un mes a la vista con los eventos de banquetes y las actividades agendadas
   del equipo. Sirve para dos cosas distintas: no encimar dos eventos en el
   mismo salón, y ver de un vistazo la semana de cada quien.
   ========================================================================== */

let mesCal = "";        // "2026-09"; vacío = el mes de hoy

const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
                 "septiembre","octubre","noviembre","diciembre"];

const mesActual = () => mesCal || hoyISO().slice(0, 7);

function mueveMes(n){
  const [a, m] = mesActual().split("-").map(Number);
  const d = new Date(a, m - 1 + n, 1);
  mesCal = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

/** Todo lo que cae en cada día del mes, ya filtrado por lo que esa persona ve. */
function agenda(mes){
  const dias = {};
  const mete = (f, item) => {
    const d = String(f || "").slice(0, 10);
    if (!d.startsWith(mes)) return;
    (dias[d] = dias[d] || []).push(item);
  };

  // Los eventos de banquetes, momento por momento: un mismo evento puede
  // ocupar dos días (la boda y el after de la madrugada siguiente). A quien no
  // le toca ver banquetes tampoco se le asoman por aquí.
  for (const e of veBanquetes() ? state.eventos : []){
    if (!eventoEsMio(e) || e.estado === "cancelado") continue;
    const vistos = new Set();
    for (const b of e.bloques){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(b.fecha) || vistos.has(b.fecha)) continue;
      vistos.add(b.fecha);
      const mismos = e.bloques.filter(x => x.fecha === b.fecha);
      mete(b.fecha, {
        clase: e.tipo === "contrato" ? "ev-contrato" : "ev-cot",
        titulo: e.titulo || nombreCli(e.clienteId),
        detalle: mismos.map(x => [x.horario, x.salon, x.pax ? x.pax + " pax" : ""]
          .filter(Boolean).join(" · ")).join("  |  "),
        pie: `${infoTipoEv(e.tipo).name} ${e.folio} · ${ESTADOS_EV[e.estado].name}`,
        abre: () => verEvento(e.id)
      });
    }
  }

  // Y las actividades agendadas del equipo.
  const mios = new Set(state.clientes.filter(esMio).map(c => c.id));
  const yo = miNombre().trim().toLowerCase();
  for (const a of state.actividades){
    const suya = puedeVerTodo() || mios.has(a.clienteId) ||
      (!!yo && String(a.responsable || "").trim().toLowerCase() === yo);
    if (!suya) continue;
    mete(a.fecha, {
      clase: "ev-act",
      titulo: `${tipoAct(a.tipo).icon} ${a.asunto || tipoAct(a.tipo).name}`,
      detalle: [String(a.fecha).slice(11, 16), nombreCli(a.clienteId)].filter(Boolean).join(" · "),
      pie: a.responsable || "",
      abre: () => abrirCliente(a.clienteId, null, "acts")
    });
  }

  for (const d of Object.keys(dias))
    dias[d].sort((x, y) => String(x.detalle).localeCompare(String(y.detalle)));
  return dias;
}

function renderCalendario(){
  const cont = document.getElementById("tblCalendario");
  const mes = mesActual();
  const [anio, m] = mes.split("-").map(Number);
  const dias = agenda(mes);

  const primero = new Date(anio, m - 1, 1);
  const largo = new Date(anio, m, 0).getDate();
  const arranque = (primero.getDay() + 6) % 7;      // la semana empieza en lunes
  const hoy = hoyISO();

  const celdas = [];
  for (let i = 0; i < arranque; i++) celdas.push(`<div class="cal-d fuera"></div>`);
  for (let d = 1; d <= largo; d++){
    const iso = `${anio}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const items = dias[iso] || [];
    celdas.push(`<div class="cal-d${iso === hoy ? " hoy" : ""}" data-dia="${iso}">
      <div class="cal-n">${d}</div>
      ${items.slice(0, 4).map((x, i) =>
        `<button class="cal-ev ${x.clase}" data-dia="${iso}" data-i="${i}"
           title="${esc([x.titulo, x.detalle, x.pie].filter(Boolean).join(" · "))}"
        >${esc(x.titulo)}</button>`).join("")}
      ${items.length > 4 ? `<button class="cal-mas" data-dia="${iso}">+${items.length - 4} más</button>` : ""}
    </div>`);
  }

  const totalEv = Object.values(dias).flat().filter(x => x.clase !== "ev-act").length;
  const totalAc = Object.values(dias).flat().filter(x => x.clase === "ev-act").length;

  cont.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn sm" id="calAnt" aria-label="Mes anterior">‹</button>
      <b style="font-size:16px;min-width:190px;text-align:center">${
        esc(MESES_L[m-1][0].toUpperCase() + MESES_L[m-1].slice(1))} ${anio}</b>
      <button class="btn sm" id="calSig" aria-label="Mes siguiente">›</button>
      <button class="btn sm" id="calHoy">Hoy</button>
      <span style="flex:1"></span>
      <span class="hint">${totalEv} evento(s) · ${totalAc} actividad(es)</span>
    </div>
    <div class="cal-leyenda">
      <span><i class="ev-contrato"></i> Contratado</span>
      <span><i class="ev-cot"></i> Cotizado</span>
      <span><i class="ev-act"></i> Actividad</span>
    </div>
    <div class="cal-sem">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(x =>
      `<div>${x}</div>`).join("")}</div>
    <div class="cal-rej">${celdas.join("")}</div>`;

  cont.querySelector("#calAnt").onclick = () => { mueveMes(-1); render(); };
  cont.querySelector("#calSig").onclick = () => { mueveMes(1); render(); };
  cont.querySelector("#calHoy").onclick = () => { mesCal = ""; render(); };

  cont.querySelectorAll(".cal-ev").forEach(b => b.onclick = () => {
    const x = (dias[b.dataset.dia] || [])[Number(b.dataset.i)];
    if (x) x.abre();
  });
  cont.querySelectorAll(".cal-mas, .cal-d").forEach(b => b.onclick = ev => {
    if (ev.target.closest(".cal-ev")) return;
    const iso = b.dataset.dia;
    if (!iso || !(dias[iso] || []).length) return;
    diaCalendario(iso, dias[iso]);
  });
}

function diaCalendario(iso, items){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${esc(fechaLarga(iso))}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        ${items.map((x, i) => `<div class="cal-fila" data-i="${i}">
          <span class="cal-punto ${x.clase}"></span>
          <div style="flex:1;min-width:0">
            <b>${esc(x.titulo)}</b>
            ${x.detalle ? `<div class="hint">${esc(x.detalle)}</div>` : ""}
            ${x.pie ? `<div class="hint">${esc(x.pie)}</div>` : ""}
          </div>
          <button class="btn sm">Abrir</button></div>`).join("")}
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);
  ov.querySelectorAll(".cal-fila").forEach(f => f.onclick = () => {
    const x = items[Number(f.dataset.i)];
    ov.remove();
    if (x) x.abre();
  });
}

/* ==========================================================================
   REPORTES

   Lo que de verdad va a entrar, contado en el mes en que ocurre el evento o
   la estancia: contratos de hospedaje aceptados y eventos de banquetes
   confirmados. Lo que sigue en la mesa se cuenta aparte, como pronóstico.
   ========================================================================== */

let repDesde = "", repHasta = "";

const rangoReporte = () => {
  const hoy = new Date();
  const desde = repDesde || `${hoy.getFullYear()}-01-01`;
  const hasta = repHasta || `${hoy.getFullYear()}-12-31`;
  return [desde, hasta];
};

/**
 * Cada renglón de ingreso: de dónde viene, cuánto, de quién y cuándo cae.
 *
 * La fecha que manda es la del evento o la de la estancia, no la de la firma:
 * es cuando el hotel de verdad cobra.
 */
function ingresos(){
  const [desde, hasta] = rangoReporte();
  const filas = [];

  for (const e of veBanquetes() ? state.eventos : []){
    if (!eventoEsMio(e) || e.estado === "cancelado") continue;
    const f = fechaEvento(e);
    if (!f || f < desde || f > hasta) continue;
    // Un contrato manda sobre la cotización de la que salió: si no, se cuenta doble.
    if (e.tipo === "cotizacion" && state.eventos.some(x => x.cotizacionId === e.id)) continue;
    filas.push({
      fecha: f, area: "Banquetes", tipo: infoTipoEv(e.tipo).name,
      folio: e.folio, cliente: nombreCli(e.clienteId),
      concepto: e.titulo || "Evento",
      ejecutivo: ejecutivoDeEv(e) || "Sin asignar",
      monto: cuentasEvento(e).total,
      cerrado: e.estado === "confirmado",
      abre: () => verEvento(e.id)
    });
  }

  for (const k of puedeVer("contratos") ? state.contratos : []){
    if (!contratoEsMio(k)) continue;
    const f = k.fecha;
    if (!f || f < desde || f > hasta) continue;
    filas.push({
      fecha: f, area: "Hospedaje", tipo: infoTipoCt(k.tipo).name,
      folio: k.folio, cliente: nombreCli(k.clienteId),
      concepto: k.titulo || "Hospedaje",
      ejecutivo: ejecutivoDeCt(k) || "Sin asignar",
      monto: cuentasContrato(k).total,
      cerrado: k.estado === "aceptado",
      abre: () => verContrato(k.id)
    });
  }

  return filas.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
}

function renderReportes(){
  const cont = document.getElementById("tblReportes");
  const [desde, hasta] = rangoReporte();
  const filas = ingresos();
  const cerrado = filas.filter(f => f.cerrado);
  const enMesa  = filas.filter(f => !f.cerrado);
  const suma = a => a.reduce((x, f) => x + f.monto, 0);

  // Por ejecutivo
  const porEje = new Map();
  for (const f of filas){
    const k = porEje.get(f.ejecutivo) || { cerrado:0, mesa:0, n:0 };
    k[f.cerrado ? "cerrado" : "mesa"] += f.monto;
    k.n++;
    porEje.set(f.ejecutivo, k);
  }
  const ejes = [...porEje.entries()].sort((a, b) => b[1].cerrado - a[1].cerrado);

  // Por mes, para ver la estacionalidad
  const porMes = new Map();
  for (const f of filas){
    const m = String(f.fecha).slice(0, 7);
    const k = porMes.get(m) || { cerrado:0, mesa:0 };
    k[f.cerrado ? "cerrado" : "mesa"] += f.monto;
    porMes.set(m, k);
  }
  const meses = [...porMes.entries()].sort();
  const tope = Math.max(1, ...meses.map(([, v]) => v.cerrado + v.mesa));

  const areas = [veBanquetes() ? "Banquetes" : null,
                 puedeVer("contratos") ? "Hospedaje" : null].filter(Boolean);
  const porArea = a => areas.map(x =>
    ({ area:x, monto: suma(a.filter(f => f.area === x)) }));

  cont.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <b style="font-size:15px">Reportes de ingreso</b>
      <span style="flex:1"></span>
      <label class="hint">Del</label>
      <input class="field" type="date" id="repD" value="${esc(desde)}">
      <label class="hint">al</label>
      <input class="field" type="date" id="repH" value="${esc(hasta)}">
      <button class="btn" id="repAnio">Este año</button>
      <button class="btn" id="repCsv">Exportar CSV</button>
    </div>
    <div class="note">Cada documento se cuenta en el mes en que <b>ocurre el evento o la
      estancia</b>, no en el que se firmó: es cuando el hotel cobra. Una cotización que ya
      tiene contrato no se cuenta dos veces.</div>

    <div class="kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="k-t">Cerrado</div>
        <div class="k-v">${esc(moneyMN(suma(cerrado)))}</div>
        <div class="k-s">${cerrado.length} documento(s) firmado(s)</div></div>
      <div class="kpi"><div class="k-t">En la mesa</div>
        <div class="k-v">${esc(moneyMN(suma(enMesa)))}</div>
        <div class="k-s">${enMesa.length} sin cerrar</div></div>
      ${porArea(cerrado).map(x => `<div class="kpi"><div class="k-t">${esc(x.area)}</div>
        <div class="k-v">${esc(moneyMN(x.monto))}</div>
        <div class="k-s">cerrado en el periodo</div></div>`).join("")}
    </div>

    <h3 class="sec">Por ejecutivo</h3>
    ${ejes.length ? `<div style="overflow:auto"><table class="data">
      <thead><tr><th>Ejecutivo</th><th class="num">Documentos</th>
        <th class="num">Cerrado</th><th class="num">En la mesa</th><th></th></tr></thead>
      <tbody>${ejes.map(([n, v]) => `<tr>
        <td><b>${esc(n)}</b></td>
        <td class="num">${v.n}</td>
        <td class="num"><b>${esc(moneyMN(v.cerrado))}</b></td>
        <td class="num">${esc(moneyMN(v.mesa))}</td>
        <td style="width:36%"><div class="barra"><i style="width:${
          Math.round(v.cerrado / Math.max(1, ejes[0][1].cerrado) * 100)}%"></i></div></td>
      </tr>`).join("")}
        <tr class="ct-tot"><td><b>Total</b></td><td class="num"><b>${filas.length}</b></td>
          <td class="num"><b>${esc(moneyMN(suma(cerrado)))}</b></td>
          <td class="num"><b>${esc(moneyMN(suma(enMesa)))}</b></td><td></td></tr>
      </tbody></table></div>` : `<div class="vacio">Sin ingresos en el periodo.</div>`}

    ${meses.length ? `<h3 class="sec">Por mes</h3>
      <div class="rep-meses">${meses.map(([m, v]) => `
        <div class="rep-mes" title="${esc(moneyMN(v.cerrado))} cerrado · ${esc(moneyMN(v.mesa))} en la mesa">
          <div class="rep-barras">
            <i class="mesa" style="height:${Math.round(v.mesa / tope * 100)}%"></i>
            <i class="cerr" style="height:${Math.round(v.cerrado / tope * 100)}%"></i>
          </div>
          <div class="rep-et">${esc(MESES_L[Number(m.slice(5,7)) - 1].slice(0,3))}</div>
        </div>`).join("")}</div>` : ""}

    <h3 class="sec">Detalle</h3>
    ${filas.length ? `<div style="overflow:auto"><table class="data">
      <thead><tr><th>Fecha</th><th>Área</th><th>Folio</th><th>Cliente</th><th>Concepto</th>
        <th>Ejecutivo</th><th>Estado</th><th class="num">Monto</th></tr></thead>
      <tbody>${filas.map((f, i) => `<tr class="row-link" data-i="${i}">
        <td class="nowrap">${esc(fechaCorta(f.fecha))}</td>
        <td>${esc(f.area)}</td>
        <td><b>${esc(f.folio || "—")}</b></td>
        <td>${esc(f.cliente)}</td>
        <td>${esc(f.concepto)}</td>
        <td class="nowrap">${esc(f.ejecutivo)}</td>
        <td><span class="estado-chip" style="background:${f.cerrado ? "var(--ok-soft)" : "var(--col)"};
          color:${f.cerrado ? "var(--ok)" : "var(--muted)"}">${f.cerrado ? "Cerrado" : "En la mesa"}</span></td>
        <td class="num nowrap"><b>${esc(moneyMN(f.monto))}</b></td>
      </tr>`).join("")}</tbody></table></div>`
      : `<div class="vacio">Nada que reportar en estas fechas.</div>`}`;

  cont.querySelector("#repD").onchange = e => { repDesde = e.target.value; render(); };
  cont.querySelector("#repH").onchange = e => { repHasta = e.target.value; render(); };
  cont.querySelector("#repAnio").onclick = () => {
    const a = new Date().getFullYear();
    repDesde = `${a}-01-01`; repHasta = `${a}-12-31`; render();
  };
  cont.querySelector("#repCsv").onclick = () => {
    descargar(`ingresos-${desde}-a-${hasta}.csv`, toCSV(
      [["Fecha","Área","Tipo","Folio","Cliente","Concepto","Ejecutivo","Estado","Monto"]]
      .concat(filas.map(f => [f.fecha, f.area, f.tipo, f.folio, f.cliente, f.concepto,
        f.ejecutivo, f.cerrado ? "Cerrado" : "En la mesa", f.monto]))), "text/csv");
  };
  cont.querySelectorAll("tr[data-i]").forEach(tr =>
    tr.onclick = () => filas[Number(tr.dataset.i)].abre());
}

/* ==========================================================================
   PREGUNTARLE A LA IA

   La llave de la IA NO puede vivir aquí: esta página es pública y cualquiera
   podría sacarla y gastar con ella. Se queda en Supabase, en una función
   (supabase/functions/ia) que es la única que habla con el motor y que sólo
   atiende a quien ya entró al CRM. Sin esa función montada, el botón lo
   explica en vez de fallar.

   El motor vive del otro lado: hoy es Google Gemini, y si algún día se cambia
   por otro, aquí no hay nada que tocar mientras conteste en el mismo formato.
   ========================================================================== */

let charlaIA = [];          // la conversación de esta sesión, no se guarda
let pensandoIA = false;
let motorIA = "";           // lo dice la función al terminar, para saber quién contestó

const NOMBRE_MOTOR = { gemini:"Google Gemini" };

const IDEAS_IA = [
  "¿Qué clientes llevan más de un mes sin que nadie los toque?",
  "Resume en qué va mi cartera y qué debería atender primero.",
  "¿Qué convenios están firmados por el hotel y siguen sin firmar por el cliente?",
  "Escríbeme un correo de seguimiento para el cliente que lleva más tiempo en propuesta."
];

const ligaFuncionIA = () => nube.url ? nube.url.replace(/\/+$/, "") + "/functions/v1/ia" : "";

/**
 * Lo que la IA alcanza a ver: exactamente lo mismo que quien pregunta.
 *
 * Se manda un resumen en texto, no la base entera: pesa menos, se lee mejor y
 * —sobre todo— no salen de aquí las firmas ni los PDF escaneados.
 */
function contextoIA(){
  const h = state.ajustes.hotel;
  const u = usuarioActual();
  const cs = state.clientes.filter(esMio);
  const ids = new Set(cs.map(c => c.id));
  const corta = (t, n) => String(t || "").replace(/\s+/g, " ").trim().slice(0, n);
  const lim = (arr, n) => arr.length > n
    ? arr.slice(0, n).concat([`… y ${arr.length - n} más que no caben aquí`]) : arr;

  const desde = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
  const acts = state.actividades
    .filter(a => ids.has(a.clienteId) && String(a.fecha) >= desde)
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));

  const ultima = {};
  for (const a of state.actividades)
    if (!ultima[a.clienteId] || a.fecha > ultima[a.clienteId]) ultima[a.clienteId] = a.fecha;

  // A cada quien se le cuenta lo suyo: banquetes no renta habitaciones, así
  // que ni las tarifas ni los convenios ni los contratos de hospedaje tienen

const INSTRUCCIONES_IA =
  "Eres el asistente del CRM de ventas de un hotel. Contestas en español de México, " +
  "de usted, con frases cortas y sin tecnicismos: quien te lee es personal de ventas, " +
  "no gente de sistemas.\n\n" +
  "Te dan un resumen de lo que esa persona alcanza a ver en el CRM. Contesta apoyándote " +
  "en esos datos y cita nombres y folios concretos cuando existan. Si algo no está en el " +
  "resumen, dilo claramente en vez de inventarlo, y di dónde se captura. No inventes " +
  "tarifas, fechas ni nombres.\n\n" +
  "Cuando te pidan redactar un correo o un mensaje, entrégalo listo para copiar y pegar. " +
  "Cuando te pregunten qué atender primero, da una lista corta y priorizada con el porqué " +
  "de cada punto. No uses tablas ni encabezados de markdown: la respuesta se ve en un " +
  "recuadro chico de texto simple.";

function abrirIA(){
  if (document.getElementById("panelIA")){ cerrarIA(); return; }

  const caja = document.createElement("div");
  caja.id = "panelIA";
  caja.innerHTML = `
    <div class="ia-head">
      <b>Preguntarle a la IA</b>
      <span style="flex:1"></span>
      <button class="btn sm" id="iaLimpiar" title="Empezar de nuevo">Limpiar</button>
      <button class="btn sm" id="iaCerrar" aria-label="Cerrar">✕</button>
    </div>
    <div class="ia-msgs" id="iaMsgs"></div>
    <div class="ia-pie">
      <div class="ia-fila">
        <textarea class="field" id="iaTexto" rows="1"
          placeholder="Pregunte lo que sea sobre su cartera…"></textarea>
        <button class="btn primary" id="iaMandar">Enviar</button>
      </div>
      <p class="ia-nota"><label>
        <input type="checkbox" id="iaConDatos" checked>
        <span>Dejar que vea mis datos del CRM. Se manda un resumen de lo que usted ya ve
          —sin firmas ni archivos— al servicio de inteligencia artificial.</span></label>
        <span id="iaMotor"></span></p>
    </div>`;
  document.body.appendChild(caja);

  const msgs  = caja.querySelector("#iaMsgs");
  const texto = caja.querySelector("#iaTexto");

  function pintar(){
    if (!charlaIA.length){
      msgs.innerHTML = `<div class="ia-vacio">
        Pregúntele lo que quiera sobre su cartera. Por ejemplo:
        ${IDEAS_IA.map(x => `<button class="ia-idea" data-idea="${esc(x)}">${esc(x)}</button>`).join("")}
      </div>`;
      msgs.querySelectorAll("[data-idea]").forEach(b => b.onclick = () => {
        texto.value = b.dataset.idea; mandar();
      });
      return;
    }
    msgs.innerHTML = charlaIA.map(m =>
      `<div class="ia-b ${m.rol}">${esc(m.texto) || "…"}</div>`).join("");
    msgs.scrollTop = msgs.scrollHeight;
    const mt = caja.querySelector("#iaMotor");
    if (mt) mt.textContent = motorIA ? `Contesta ${motorIA}.` : "";
  }
  pintar();

  const crece = () => {
    texto.style.height = "auto";
    texto.style.height = Math.min(texto.scrollHeight, 120) + "px";
  };
  texto.addEventListener("input", crece);
  texto.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); mandar(); }
  });

  caja.querySelector("#iaCerrar").onclick = cerrarIA;
  caja.querySelector("#iaLimpiar").onclick = () => { charlaIA = []; pintar(); texto.focus(); };
  caja.querySelector("#iaMandar").onclick = mandar;
  texto.focus();

  async function mandar(){
    const q = texto.value.trim();
    if (!q || pensandoIA) return;

    const falta = porQueNoHayIA();
    if (falta){
      charlaIA.push({ rol:"yo", texto:q }, { rol:"err", texto:falta });
      texto.value = ""; crece(); pintar();
      return;
    }

    charlaIA.push({ rol:"yo", texto:q });
    const respuesta = { rol:"ia", texto:"" };
    charlaIA.push(respuesta);
    texto.value = ""; crece(); pintar();

    pensandoIA = true;
    caja.querySelector("#iaMandar").disabled = true;
    try{
      await preguntarIA(
        charlaIA.filter(m => m.rol !== "err").map(m =>
          ({ role: m.rol === "yo" ? "user" : "assistant", content: m.texto })).slice(0, -1),
        caja.querySelector("#iaConDatos").checked,
        trozo => { respuesta.texto += trozo; pintar(); });
      if (!respuesta.texto) respuesta.texto = "No me llegó respuesta. Vuelva a intentar.";
    }catch(e){
      charlaIA[charlaIA.length - 1] = { rol:"err", texto:"No se pudo preguntar: " + e.message };
    }finally{
      pensandoIA = false;
      const b = caja.querySelector("#iaMandar");
      if (b) b.disabled = false;
      pintar();
    }
  }
}

function cerrarIA(){
  const c = document.getElementById("panelIA");
