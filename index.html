/* ----- Traducción entre el estado y las filas de la tabla ----- */

const COLECCIONES = ["clientes","actividades","convenios","contratos","eventos","prospectos",
                     "campanas","huespedes","habitaciones","usuarios"];
/** Lo que roles.sql sólo deja escribir al administrador. */
const SOLO_ADMIN = ["ajustes","usuarios","habitaciones"];

function filasDeEstado(){
  const filas = [];
  for (const tipo of COLECCIONES)
    for (const o of state[tipo]) filas.push({ id: tipo + ":" + o.id, tipo, datos: o });
  filas.push({ id:"ajustes:global", tipo:"ajustes", datos: state.ajustes });
  return filas;
}

function estadoDesdeFilas(filas){
  const bruto = { clientes:[], actividades:[], convenios:[], contratos:[], eventos:[],
                  prospectos:[], campanas:[], huespedes:[], habitaciones:[], usuarios:[],
                  ajustes:null };
  for (const f of filas){
    if (f.tipo === "ajustes") bruto.ajustes = f.datos;
    else if (bruto[f.tipo]) bruto[f.tipo].push(f.datos);
  }
  if (!bruto.ajustes) delete bruto.ajustes;
  if (!bruto.usuarios.length) delete bruto.usuarios;
  return sanear(bruto);
}

function marcarSincronizado(filas){
  sincronizado = new Map(filas.map(f => [f.id, JSON.stringify(f.datos)]));
}

/**
 * Un renglón que llegó sin su cliente se cae del estado, y entonces la subida
 * lo vería como desaparecido y mandaría la lápida. Sacarlo de "ya
 * sincronizado" lo deja en paz: no se vuelve a subir, y tampoco se borra.
 */
function olvidarHuerfanos(){
  for (const id of huerfanos) sincronizado.delete(id);
  huerfanos = new Set();
}

/* ----- Bajada y subida ----- */

async function bajar(desde){
  const filtro = desde ? `&actualizado=gt.${encodeURIComponent(desde)}` : "";
  const filas = await api(`/rest/v1/crm_datos?select=id,tipo,datos,actualizado,borrado${filtro}`);
  return filas || [];
}

/**
 * De quién es una fila, para que el servidor pueda repartirlas.
 *
 * Todo cuelga del cliente: sus actividades y sus convenios son de quien lo
 * atiende. El catálogo, los textos, los usuarios y los huéspedes no son de
 * nadie —los necesita todo el equipo— y se quedan sin dueño a propósito.
 */
function duenioDe(fila){
  const deCliente = id => {
    const c = state.clientes.find(x => x.id === id);
    return (c && String(c.ejecutivo || "").trim()) || null;
  };
  if (fila.tipo === "clientes")    return String(fila.datos.ejecutivo || "").trim() || null;
  if (fila.tipo === "actividades") return deCliente(fila.datos.clienteId) ||
                                          String(fila.datos.responsable || "").trim() || null;
  if (fila.tipo === "convenios")   return String(fila.datos.ejecutivo || "").trim() ||
                                          deCliente(fila.datos.clienteId);
  if (fila.tipo === "contratos")   return String(fila.datos.ejecutivo || "").trim() ||
                                          deCliente(fila.datos.clienteId);
  if (fila.tipo === "eventos")     return String(fila.datos.ejecutivo || "").trim() ||
                                          deCliente(fila.datos.clienteId);
  if (fila.tipo === "prospectos")  return String(fila.datos.capturadoPor || "").trim() || null;
  // Las campañas no se reparten: son del área, no de quien las capturó. Sin
  // dueño marcado, el servidor se las entrega a todo marketing.
  return null;
}

async function subir(cambios, borrados){
  if (cambios.length){
    const cuerpo = conDuenio => JSON.stringify(cambios.map(f => {
      const fila = { id:f.id, tipo:f.tipo, datos:f.datos, borrado:false,
        actualizado:new Date().toISOString(), actualizado_por: correoSesion() };
      if (conDuenio) fila.duenio = duenioDe(f);
      return fila;
    }));
    const mandar = c => api("/rest/v1/crm_datos?on_conflict=id", {
      method:"POST",
      headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: cuerpo(c)
    });

    try{
      await mandar(!nube.sinDuenio);
    }catch(e){
      // La columna "duenio" sólo existe si se corrió roles.sql. Sin ella el
      // servidor rechaza la subida entera, así que se vuelve a mandar sin esa
      // columna y se recuerda por lo que dure la sesión: al día siguiente se
      // intenta otra vez, y si para entonces ya corrieron roles.sql, se usa.
      if (!nube.sinDuenio && /duenio/i.test(e.message)){
        nube.sinDuenio = true;
        await mandar(false);
      } else throw e;
    }
  }
  // Un borrado se marca en vez de eliminar la fila: si no, los demás equipos
  // nunca se enterarían de que desapareció.
  if (borrados.length){
    await api("/rest/v1/crm_datos?on_conflict=id", {
      method:"POST",
      headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(borrados.map(id => ({
        id, tipo:String(id).split(":")[0], datos:{}, borrado:true,
        actualizado:new Date().toISOString(), actualizado_por: correoSesion()
      })))
    });
  }
}

/**
 * Recoge del buzón las firmas que dejaron los clientes.
 *
 * El cliente no escribe sobre su convenio —no podría, y no debe—: deposita su
 * firma en crm_firmas y de ahí la levanta el CRM. Se hace en cada
 * sincronización, así que el ejecutivo se entera al minuto siguiente.
 *
 * Devuelve un parte de lo que encontró, no un sí o un no: cuando una firma no
 * se aplica hay que poder decir por qué, o se vuelve un misterio.
 */
async function recogerFirmas(){
  const parte = { hubo:false, buzon:true, pendientes:0, aplicadas:0, notas:[] };
  if (!nubeActiva()){ parte.buzon = false; parte.notas.push("No hay sesión en la nube."); return parte; }

  let filas;
  try{
    filas = await api("/rest/v1/crm_firmas?select=id,convenio_id,token,nombre,puesto,celular,img,creado&aplicada=is.false");
  }catch(e){
    // Sin firmas.sql corrido no existe el buzón. No es un error que reportar:
    // simplemente todavía no se usa esa forma de firmar.
    if (/crm_firmas|schema cache|does not exist|404|PGRST205/i.test(e.message)){
      nube.sinBuzon = true;
      parte.buzon = false;
      parte.notas.push("El buzón de firmas no existe todavía: falta correr firmas.sql en Supabase.");
      return parte;
    }
    parte.notas.push("No se pudo leer el buzón: " + e.message);
    return parte;
  }

  parte.pendientes = (filas || []).length;
  for (const f of filas || []){
    const v = state.convenios.find(x => x.id === f.convenio_id);
    if (!v){
      parte.notas.push(`Hay una firma de ${f.nombre || "un cliente"} para un convenio que este equipo no tiene bajado.`);
      continue;                                  // no se marca: otro equipo la aplicará
    }
    if (v.firmaEmpresa){
      parte.notas.push(`El convenio ${v.folio} ya estaba firmado; se descartó una firma repetida.`);
    } else if (!v.tokenFirma || v.tokenFirma !== f.token){
      // Suele pasar si se rehizo el enlace: el cliente firmó con el viejo.
      parte.notas.push(`La firma de ${f.nombre || "el cliente"} para ${v.folio} llegó con una clave que ya no corresponde. ` +
        "Vuelve a mandarle el enlace.");
    } else {
      cerrarConvenio(v, { nombre:f.nombre, puesto:f.puesto, celular:f.celular,
                          fecha:f.creado || new Date().toISOString(), img:f.img },
        "Firmado por el cliente desde el enlace que se le envió.", "");
      parte.aplicadas++;
      parte.hubo = true;
    }
    try{
      await api(`/rest/v1/crm_firmas?id=eq.${encodeURIComponent(f.id)}`, {
        method:"PATCH", headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({ aplicada:true })
      });
    }catch(e){
      parte.notas.push("La firma se aplicó pero no se pudo marcar como recogida; " +
        "puede volver a aparecer en el siguiente sondeo. " + e.message);
    }
  }
  return parte;
}

/** El botón: busca ahora y cuenta qué pasó. */
async function buscarFirmasAhora(e){
  const b = e.currentTarget, antes = b.textContent;
  b.disabled = true; b.textContent = "Buscando…";
  try{
    const p = await recogerFirmas();
    if (p.hubo) render();
    const cuerpo = !p.buzon
      ? p.notas.join("\n")
      : p.aplicadas
        ? `Se aplicaron ${p.aplicadas} firma(s). Los convenios ya quedaron cerrados.`
        : p.pendientes
          ? `Había ${p.pendientes} firma(s) en el buzón, pero ninguna se pudo aplicar.`
          : "El buzón está vacío: ningún cliente ha firmado desde su enlace todavía.";
    alert(cuerpo + (p.notas.length && p.buzon ? "\n\n" + p.notas.join("\n") : ""));
  }catch(ex){
    alert("No se pudo revisar el buzón: " + ex.message);
  }finally{ b.disabled = false; b.textContent = antes; }
}

function programarSubida(){
  if (!nubeActiva()) return;
  clearTimeout(nube.pendiente);
  nube.pendiente = setTimeout(() => sincronizar().catch(() => {}), 400);
}

let sincronizando = false;
async function sincronizar(){
  if (!nubeActiva() || sincronizando) return;
  sincronizando = true;
  try{
    nube.estado = "sincronizando"; pintarNube();

    // Primero lo de los demás, luego lo propio: así una edición local reciente
    // gana sobre una copia remota vieja del mismo registro.
    const remotas = await bajar(nube.ultimo);
    if (remotas.length){
      const porId = new Map(filasDeEstado().map(f => [f.id, f]));
      const aplicadas = [];
      for (const r of remotas){
        nube.ultimo = !nube.ultimo || r.actualizado > nube.ultimo ? r.actualizado : nube.ultimo;
        const local = porId.get(r.id);
        const mismoQueSincronizado = local && sincronizado.get(r.id) === JSON.stringify(local.datos);
        if (local && !mismoQueSincronizado) continue;   // hay edición local sin subir: no se pisa
        if (r.borrado) porId.delete(r.id);
        else porId.set(r.id, { id:r.id, tipo:r.tipo, datos:r.datos });
        aplicadas.push(r);
      }
      if (aplicadas.length){
        state = estadoDesdeFilas([...porId.values()]);
        olvidarHuerfanos();
        try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
        // Se dan por sincronizadas SÓLO las filas que acaban de llegar. Marcar
        // todas de golpe daba por subido lo que este equipo aún no manda, y el
        // registro recién capturado se quedaba para siempre en esta máquina.
        const llegaron = new Set(aplicadas.map(r => r.id));
        for (const f of filasDeEstado())
          if (llegaron.has(f.id)) sincronizado.set(f.id, JSON.stringify(f.datos));
        for (const r of aplicadas)
          if (r.borrado) sincronizado.delete(r.id);
        render();
      }
    }

    // Las firmas que dejaron los clientes se recogen antes de subir, para que
    // el convenio cerrado viaje a los demás equipos en esta misma tanda.
    if ((await recogerFirmas()).hubo) render();
    // Los registros que dejaron en la liga entran antes de subir, para que
    // viajen a los demás equipos en esta misma tanda.
    if (!nube.sinBuzonAltas && (await recogerAltas()).hubo) render();
    if (resolverFoliosRepetidos()) render();

    const actuales = filasDeEstado();
    const cambios = actuales.filter(f => sincronizado.get(f.id) !== JSON.stringify(f.datos));
    const vivos = new Set(actuales.map(f => f.id));
    const borrados = [...sincronizado.keys()].filter(id => !vivos.has(id));
    if (cambios.length || borrados.length){
      await subir(cambios, borrados);
      marcarSincronizado(actuales);
    }

    nube.estado = "listo";
    nube.sincronizadoEn = new Date().toISOString();
  }catch(e){
    nube.estado = "error";
    nube.error = e.message;
    console.warn("Sincronización:", e.message);
  }finally{
    sincronizando = false;
    pintarNube();
  }
}

/* ----- Sondeo ----- */

function arrancarSondeo(){
  detenerSondeo();
  nube.timer = setInterval(() => {
    // Con un formulario abierto no se toca el estado: alguien está capturando.
    if (document.querySelector(".overlay")) return;
    sincronizar().catch(() => {});
  }, SONDEO_MS);
}
function detenerSondeo(){ clearInterval(nube.timer); nube.timer = null; }

/* ----- Primer enlace: el momento delicado ----- */

async function primeraSincronizacion(){
  const remotas = (await bajar()).filter(f => !f.borrado);
  const hayLocal = state.clientes.length || state.convenios.length || state.huespedes.length;

  if (!remotas.length){
    if (!hayLocal){ marcarSincronizado([]); nube.enlazado = true; guardarNubeCfg(); return; }
    if (!confirm(`La nube está vacía y este equipo tiene ${state.clientes.length} cliente(s).\n\n` +
                 "¿Subir los datos de este equipo para que sean los de todo el hotel?")){
      throw new Error("Enlace cancelado: la nube quedó vacía.");
    }
    marcarSincronizado([]);          // todo se verá como cambio y subirá
    nube.enlazado = true;
    guardarNubeCfg();
    await sincronizar();
    return;
  }

  if (hayLocal){
    if (!confirm(`La nube ya tiene ${remotas.filter(f => f.tipo === "clientes").length} cliente(s).\n\n` +
                 "Este equipo adoptará esos datos y los suyos locales se reemplazarán.\n" +
                 "Si tenías capturas sin subir, expórtalas antes.\n\n¿Continuar?")) {
      throw new Error("Enlace cancelado.");
    }
  }
  state = estadoDesdeFilas(remotas);
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}

  // Se dan por sincronizadas SÓLO las filas que de verdad llegaron. Marcarlo
  // todo dejaba fuera para siempre lo que este equipo puso de su cosecha —el
  // catálogo y, sobre todo, la lista de usuarios— y una nube sin esa lista no
  // sabe quién es quién: con roles.sql corrido no reconoce a nadie, y a quien
  // no reconoce no le entrega nada. El equipo entero se queda con la pantalla
  // vacía, no nada más sin convenios.
  marcarSincronizado(remotas);
  olvidarHuerfanos();
  // Salvo para quien no tiene permiso de escribir esas tablas: a un ejecutivo
  // el servidor le rebotaría el intento y le tumbaría la subida entera.
  if (!esAdmin())
    for (const f of filasDeEstado())
      if (SOLO_ADMIN.includes(f.tipo)) sincronizado.set(f.id, JSON.stringify(f.datos));
  for (const r of remotas)
    nube.ultimo = !nube.ultimo || r.actualizado > nube.ultimo ? r.actualizado : nube.ultimo;
  nube.enlazado = true;
  guardarNubeCfg();
  render();
}

/**
 * Qué me está entregando el servidor a mí, ahora mismo.
 *
 * Cuando alguien dice "no veo los convenios", la pregunta de fondo siempre es
 * la misma: ¿el servidor no se los manda, o sí llegaron y la pantalla los
 * esconde? Esto lo contesta sin tener que abrirle la consola a nadie.
 */
async function revisarPermisos(){
  const yo = correoSesion().trim().toLowerCase();
  let filas, conDuenio = true;
  try{
    filas = await api("/rest/v1/crm_datos?select=id,tipo,duenio,datos&borrado=is.false");
  }catch(e){
    if (!/duenio/i.test(e.message)) throw e;
    conDuenio = false;   // no han corrido roles.sql: no existe la columna
    filas = await api("/rest/v1/crm_datos?select=id,tipo,datos&borrado=is.false");
  }

  const conteo = {};
  for (const f of filas) conteo[f.tipo] = (conteo[f.tipo] || 0) + 1;

  const usuarios = filas.filter(f => f.tipo === "usuarios");
  const mio = usuarios.find(f =>
    String((f.datos || {}).correo || "").trim().toLowerCase() === yo);

  return {
    correo: correoSesion(),
    conDuenio,
    conteo,
    total: filas.length,
    conDuenioN: conDuenio ? filas.filter(f => f.duenio).length : 0,
    usuariosNube: usuarios.length,
    meReconoce: !!mio,
    rolNube: mio ? (mio.datos.rol || "") : "",
    nombreNube: mio ? (mio.datos.nombre || "") : "",
    rolLocal: rolActual(),
    nombreLocal: miNombre()
  };
}

/** Sube la lista de usuarios aunque no haya cambiado. Sólo puede el administrador. */
async function empujarUsuarios(){
  for (const u of state.usuarios) sincronizado.delete("usuarios:" + u.id);
  await sincronizar();
  if (nube.estado === "error") throw new Error(nube.error || "sin detalle");
}

/** Vuelve a traerlo todo desde cero, sin el corte de "sólo lo nuevo". */
async function bajarTodo(){
  nube.ultimo = "";
  await sincronizar();
  if (nube.estado === "error") throw new Error(nube.error || "sin detalle");
}

const NOMBRE_TIPO = { clientes:"clientes", actividades:"actividades", convenios:"convenios",
  prospectos:"prospectos", huespedes:"huéspedes", habitaciones:"tipos de habitación",
  usuarios:"usuarios", ajustes:"ajustes" };

function pantallaPermisos(){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Qué me manda el servidor</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="permCuerpo">
        <div class="note">Preguntando…</div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const cuerpo = ov.querySelector("#permCuerpo");

  revisarPermisos().then(r => {
    const problemas = [];
    // Cero registros y cero usuarios es otra cosa que cero usuarios a secas, y
    // conviene no confundirlas: con roles.sql corrido, a quien no está en la
    // lista el servidor no le entrega NADA —ni el catálogo—, así que la lista
    // tampoco le llega, y de ahí que parezca que la nube no la tiene. Si
    // bajaron filas pero ninguna de usuarios, ahí sí es que la lista nunca se
    // subió.
    if (r.conDuenio && !r.total)
      problemas.push(`<b>Tu correo no está en la lista de usuarios de la nube.</b>
        El servidor no te entregó ni un registro —ni siquiera el catálogo—, que es
        lo que le hace a una cuenta que no da de alta: entra, pero no es del equipo
        de ventas. Está ${esc(r.correo)}, y hay que agregarlo en
        <i>Ajustes → Usuarios y permisos</i> escrito igual.
        <br>La otra explicación, que desde aquí se ve idéntica, es que la lista de
        usuarios nunca haya llegado a la nube; si al equipo entero le pasa lo
        mismo, es ésa.
        ${esAdmin() ? `<br><button class="btn primary sm" id="bSubirUsr"
            style="margin-top:8px">Subir la lista de usuarios ahora</button>`
          : `<br>Pídele a ${esc(nombresDeRol("admin") || "el administrador")} que te
             dé de alta y suba la lista desde aquí mismo.`}`);
    else if (r.conDuenio && !r.usuariosNube)
      problemas.push(`<b>La nube no tiene la lista de usuarios.</b> Corrieron
        <code>roles.sql</code>, y esas reglas leen de esa lista para saber quién es quién.
        Están bajando ${r.total} registro(s) y ni uno es de usuarios: sin esa lista
        el servidor no reconoce a nadie, y a quien no reconoce deja de entregarle
        primero lo que tenga dueño marcado y, con las reglas al día, absolutamente
        todo.
        ${esAdmin() ? `<br><button class="btn primary sm" id="bSubirUsr"
            style="margin-top:8px">Subir la lista de usuarios ahora</button>`
          : `<br>Pídele a ${esc(nombresDeRol("admin") || "el administrador")} que entre y
             lo haga desde aquí mismo.`}`);
    else if (r.conDuenio && !r.meReconoce)
      problemas.push(`<b>Tu correo no está en la lista de usuarios de la nube.</b>
        Está ${esc(r.correo)}, y en la nube hay ${r.usuariosNube}. Hay que agregarlo en
        <i>Ajustes → Usuarios y permisos</i> escrito igual, y volver a guardar.`);
    else if (r.conDuenio && r.rolNube !== r.rolLocal)
      problemas.push(`<b>El servidor te tiene con otro papel.</b> Él dice
        <b>${esc(infoRol(r.rolNube).name)}</b> y este equipo cree que eres
        <b>${esc(infoRol(r.rolLocal).name)}</b>. Manda el del servidor.`);

    cuerpo.innerHTML = `
      ${problemas.length
        ? problemas.map(x => `<div class="note warn">${x}</div>`).join("")
        : `<div class="note" style="border-left:3px solid var(--ok)">
             <b>Todo en orden.</b> El servidor te reconoce y te está mandando lo que te toca.</div>`}

      <div style="overflow:auto"><table class="data">
        <thead><tr><th>Lo que el servidor me entrega</th><th class="num">Registros</th></tr></thead>
        <tbody>${Object.keys(NOMBRE_TIPO).map(t => `<tr>
            <td>${esc(NOMBRE_TIPO[t])}</td>
            <td class="num"><b>${r.conteo[t] || 0}</b></td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${r.total}</b></td></tr></tbody></table></div>

      <div class="note" style="margin-top:14px">
        Entraste como <b>${esc(r.correo)}</b>.
        ${r.conDuenio
          ? `El servidor te tiene como <b>${esc(r.meReconoce ? infoRol(r.rolNube).name : "no registrado")}</b>${
              r.nombreNube ? `, a nombre de <b>${esc(r.nombreNube)}</b>` : ""}.
             Hay ${r.conDuenioN} registro(s) con dueño marcado.`
          : `Todavía no han corrido <code>roles.sql</code>: el servidor le entrega
             todo a cualquiera que entre, y lo que cada quien ve lo decide nada más
             esta pantalla.`}
      </div>

      <p style="margin:14px 0 0"><button class="btn" id="bBajarTodo">Volver a bajar todo</button>
        <span class="hint">Por si algo se quedó sin llegar a este equipo.</span></p>`;

    const bu = cuerpo.querySelector("#bSubirUsr");
    if (bu) bu.onclick = async e => {
      const b = e.currentTarget, antes = b.textContent;
      b.disabled = true; b.textContent = "Subiendo…";
      try{
        await empujarUsuarios();
        alert("Listo: la nube ya tiene la lista de usuarios.\n\n" +
              "Dile al equipo que recargue con Ctrl+F5 y ya verán lo que les toca.");
        ov.remove(); pantallaPermisos();
      }catch(ex){ alert("No se pudo subir: " + ex.message); }
      finally{ b.disabled = false; b.textContent = antes; }
    };

    cuerpo.querySelector("#bBajarTodo").onclick = async e => {
      const b = e.currentTarget, antes = b.textContent;
      b.disabled = true; b.textContent = "Bajando…";
      try{
        await bajarTodo();
        ov.remove(); pantallaPermisos();
      }catch(ex){ alert("No se pudo bajar: " + ex.message); }
      finally{ b.disabled = false; b.textContent = antes; }
    };
  }).catch(e => {
    cuerpo.innerHTML = `<div class="errbox">No se pudo preguntar: ${esc(e.message)}</div>`;
  });
}

function pintarNube(){
  const el = document.getElementById("estadoNube");
  if (!el) return;
  el.style.display = "";

  // Un equipo sin nube se veía exactamente igual que uno conectado, nada más
  // que vacío: no había cómo distinguir "no hay convenios" de "este aparato no
  // está hablando con el hotel". Y como la configuración va por navegador y por
  // dirección, basta abrir la aplicación en otro navegador para caer aquí sin
  // enterarse. Ahora lo dice.
  if (!nube.url || !nube.anon){
    el.innerHTML = `<span class="punto-nube" style="background:var(--warn)"></span>Sólo este equipo`;
    el.title = "Este aparato no está conectado a la nube del hotel.\nClic para saber qué hacer.";
    el.classList.add("conSesion");
    el.onclick = menuSinNube;
    return;
  }
  const mapa = {
    local:          ["Sin conectar", "var(--muted)", "Configurada la nube, falta entrar"],
    sincronizando:  ["Sincronizando…", "var(--accent)", "Enviando y trayendo cambios"],
    listo:          ["En línea", "var(--ok)", (() => {
                      const u = usuarioActual();
                      return "Al día · " + (u ? `${u.nombre} · ${infoRol(u.rol).name}` : correoSesion());
                    })()],
    error:          ["Sin conexión", "var(--bad)", nube.error || "No se pudo sincronizar"]
  };
  const [txt, color, ayuda] = mapa[nube.estado] || mapa.local;
  const u = usuarioActual();
  // Con sesión abierta el chip dice de quién es y abre el menú para salir: en
  // una computadora compartida, cambiar de persona tiene que estar a la mano
  // y no escondido en unos Ajustes que sólo ve el administrador.
  const quien = nube.sesion ? ((u && u.nombre.split(" ")[0]) || correoSesion().split("@")[0]) : "";
  el.innerHTML = `<span class="punto-nube" style="background:${color}"></span>` +
    esc(quien || txt);
  el.title = (quien ? txt + " · " : "") + ayuda + (nube.sesion ? "\nClic para cerrar sesión" : "");
  el.classList.toggle("conSesion", !!nube.sesion);
  el.onclick = nube.sesion ? menuSesion : null;
}

  if (document.getElementById("intro") || document.getElementById("kiosco")) return;

/**
 * Pone el departamento al día antes de dibujar nada.
 *
 * Dos cosas que se ven feo si no: que al cambiar de persona la nueva herede el
 * departamento de la anterior —o uno que ni siquiera alcanza—, y que la
 * pantalla de escoger se quede colgada después de cerrar la sesión.
 */
function ajustarDepto(){
  if (depto && !misDepartamentos().some(d => d.id === depto)) depto = "";
  const ov = document.getElementById("depto");
  if (ov && (!escogeDepto() || depto)) ov.remove();
}

          <label class="lbl">Dirección del proyecto</label>

/**
 * El candado: mientras la aplicación sepa a qué nube conectarse y no haya
 * sesión, el CRM no está en la página.
 *
 * Se llama al poner la pantalla de entrar y al quitarla, y también desde
 * render(), para que no haya manera de dejarlo abierto por descuido.
 */
function candado(){
  // Ni el cliente que viene a firmar ni quien viene de un anuncio entran al
  // CRM: su pantalla es otra cosa y no tienen por qué dar una contraseña que
  // no tienen.
  if (enlaceDeFirma() || enlaceDeAlta()) return false;
  const cerrado = !!(nube.url && nube.anon) && !nube.sesion;
  document.body.classList.toggle("sin-sesion", cerrado);
  if (cerrado && !document.getElementById("entrada")) pantallaEntrada();
  return cerrado;
}

function cerrarEntrada(){
  const ov = document.getElementById("entrada");
  if (ov) ov.remove();
  document.body.classList.remove("sin-sesion");
}

async function arrancarNube(){
  cargarNube();
  // El candado se echa AQUÍ, antes de la animación de entrada y antes de
  // cualquier espera. Si se dejara para después, un equipo con cartera
  // guardada y sin sesión la enseñaría unos segundos —y con "reducir
  // movimiento" no hay animación que la tape—.
  if (nube.url && nube.anon && !nube.sesion && !enlaceDeFirma() && !enlaceDeAlta())
    document.body.classList.add("sin-sesion");
  const invitacion = leerInvitacion();   // se limpia la barra de direcciones ya
  pintarNube();

  // Nada de lo que sigue puede aparecer encima de la animación de entrada:
  // el aviso la congelaría y el logo se quedaría a medio dibujar.
  await entradaLista;

  aplicarInvitacion(invitacion && invitacion.cfg);   // una liga de alta manda sobre lo que hubiera
  pintarNube();

  const pase = invitacion && invitacion.cq;
  if (!nube.url || !nube.anon){
    // Un pase sin dirección de nube no lleva a ninguna parte, y callarlo deja
    // a la persona mirando la pantalla de siempre sin saber qué pasó.
    if (pase) alert("Abre el CRM desde Core Quartz.\n\n" +
                    "Este equipo todavía no tiene configurada la nube, así que el enlace no " +
                    "puede validarse aquí.");
    return;                                     // sin configurar: modo local de siempre
  }

  if (pase){
    try{
      if (!await entrarConCore(pase)) return;
    }catch(ex){
      pantallaEntrada();
      const err = document.getElementById("errEntrar");
      if (err) err.innerHTML = `<div class="errbox">${esc(ex.message)}</div>`;
      return;
    }
  }

  if (!nube.sesion){ pantallaEntrada(); return; }
  // Preguntar "¿adopto los datos de la nube?" sólo tiene sentido la primera
  // vez que este equipo se conecta: después ya son los mismos datos, y volver
  // a preguntarlo en cada arranque es un estorbo diario que además no dice
  // nada. De la segunda vez en adelante se sincroniza y ya.
  (nube.enlazado ? sincronizar() : primeraSincronizacion())
    .then(() => { nube.estado = "listo"; pintarNube(); arrancarSondeo(); })
    .catch(e => {
      nube.estado = "error"; nube.error = e.message; pintarNube();
      if (/401|JWT|token/i.test(e.message)) pantallaEntrada();
    });
}

function fechaTexto(iso){
  if (!iso) return "";
  const d = new Date(iso.slice(0,10) + "T00:00:00");
  if (isNaN(d)) return iso;
  return `${d.getDate()} de ${MESES[d.getMonth()]} del ${d.getFullYear()}`;
}
function fechaCorta(iso){
  if (!iso) return "—";
  const d = new Date((iso.length <= 10 ? iso + "T00:00:00" : iso));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" });
}
function fechaHora(iso){
  if (!iso) return "—";
  const d = new Date((iso.length <= 10 ? iso + "T00:00:00" : iso));
  if (isNaN(d)) return iso;
  return d.toLocaleString("es-MX", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
/** Fecha en el formato de las firmas de la carta: 18 – 08- 2026 */
function fechaFirma(iso){
  if (!iso) return "";
  const d = new Date(iso.slice(0,10) + "T00:00:00");
  if (isNaN(d)) return iso.slice(0,10);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())} – ${p(d.getMonth()+1)} – ${d.getFullYear()}`;
}

/**
 * Lee montos escritos como sea: "$120,000.50", "1.250.000", "89500,75", "(1,200)".
 * El último separador es decimal sólo si deja 1 o 2 dígitos detrás; si deja 3 o
 * más es separador de miles. Sirve igual para formato latino y anglosajón.
 */
function parseMoney(v){
  if (v == null || v === "") return 0;
  if (typeof v === "number") return v;
  const src = String(v).trim();
  const neg = src.includes("-") || /^\(.*\)$/.test(src);
  let s = src.replace(/[^\d.,]/g, "");
  if (!s) return 0;
  const sep = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  if (sep > -1){
    const dec = s.length - sep - 1;
    s = (dec >= 1 && dec <= 2)
      ? s.slice(0, sep).replace(/[.,]/g, "") + "." + s.slice(sep + 1)
      : s.replace(/[.,]/g, "");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -Math.abs(n) : n);
}

/** Acepta 2026-09-04, 04/09/2026, 4-9-26 y los seriales de Excel. */
function parseDate(v){
  if (!v) return "";
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if (/^\d{5}$/.test(s)) return new Date(Date.UTC(1899,11,30) + Number(s)*864e5).toISOString().slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m){
    let [,a,b,y] = m;
    if (y.length === 2) y = "20" + y;
    let dd = +a, mm = +b;
    if (mm > 12 && dd <= 12){ const t = dd; dd = mm; mm = t; }
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
    return `${y}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  }
  const d = new Date(s);
  return isNaN(d) ? "" : d.toISOString().slice(0,10);
}

function matchEstatus(v){

  if (!s) return "contactado";
  const hit = ESTATUS.find(e => e.id === s || e.name.toLowerCase() === s);
  if (hit) return hit.id;
  const reglas = [
    [/gan[oa]|won|cerrad[oa]\s*gan|exito|éxito|firmad/, "ganado"],
    [/perd|lost|cancel|rechaz|declin|no\s*interes/, "perdido"],
    [/cotiz.*enviad|enviad.*cotiz|propuesta\s*enviad/, "cotizacion_enviada"],

    [/propuesta|cotiz|oferta|proposal|quote/, "propuesta"],
    [/contact|seguimiento|llamad|prospec|nuevo|lead|inicial/, "contactado"]
  ];

}

/* ----- CSV ----- */

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const nl = text.indexOf("\n");
  const head = text.slice(0, nl === -1 ? text.length : nl);
  const delim = (head.match(/\t/g)||[]).length > (head.match(/,/g)||[]).length ? "\t"
              : (head.match(/;/g)||[]).length > (head.match(/,/g)||[]).length ? ";" : ",";
  const filas = []; let fila = [], celda = "", comillas = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (comillas){
      if (c === '"'){ if (text[i+1] === '"'){ celda += '"'; i++; } else comillas = false; }
      else celda += c;
      continue;
    }
    if (c === '"') comillas = true;
    else if (c === delim){ fila.push(celda); celda = ""; }
    else if (c === "\n"){ fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else if (c !== "\r") celda += c;
  }
  if (celda !== "" || fila.length){ fila.push(celda); filas.push(fila); }
  return filas.filter(f => f.some(c => String(c).trim() !== ""));
}

const toCSV = filas => filas.map(f => f.map(c => {
  const s = String(c ?? "");
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}).join(",")).join("\r\n");

function descargar(nombre, contenido, mime){
  const blob = new Blob(["\uFEFF" + contenido], { type: (mime||"text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/**
 * Adivina qué columna del archivo corresponde a cada campo. Primero resuelve
 * TODAS las coincidencias exactas y luego las parciales, para que una parcial
 * de otro campo no se lleve una columna que alguien más nombra igualito.
 */
function autoMapear(campos, heads){
  const norm = x => String(x).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
  const hN = heads.map(norm);
  const cands = f => [f.label, f.key, ...(f.aliases || [])].map(norm).filter(Boolean);
  const usados = new Set(), hallado = {};

  for (const f of campos){
    const cs = cands(f);
    for (let i = 0; i < hN.length; i++){
      if (usados.has(i) || !hN[i]) continue;
      if (cs.includes(hN[i])){ hallado[f.key] = i; usados.add(i); break; }
    }
  }
  for (const f of campos){
    if (hallado[f.key] != null) continue;
    const cs = cands(f).filter(x => x.length > 3);
    for (let i = 0; i < hN.length; i++){
      if (usados.has(i) || hN[i].length < 3) continue;
      if (cs.some(x => hN[i].includes(x) || x.includes(hN[i]))){ hallado[f.key] = i; usados.add(i); break; }
    }
  }
  return hallado;
}

/* ----- Lectura de .xlsx -----
   Un .xlsx es un ZIP con XML dentro. Se lee el directorio central, se sacan
   sólo la primera hoja y las cadenas compartidas, y se inflan con
   DecompressionStream, que traen los navegadores modernos. Así no hace falta
   ninguna librería externa. */

async function inflar(datos){
  if (typeof DecompressionStream !== "function")
    throw new Error("Este navegador no puede descomprimir archivos .xlsx.\n\n" +
                    "Guarda la hoja como CSV (Archivo → Guardar como → CSV) y súbela así.");
  const flujo = new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Response(flujo).text();
}

async function abrirZip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("El archivo no parece un .xlsx válido.");

  const total = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const salida = {};
  for (let k = 0; k < total; k++){
    if (off + 46 > buf.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const metodo   = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nLen = dv.getUint16(off + 28, true);
    const eLen = dv.getUint16(off + 30, true);
    const cLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const nombre = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nLen));
    off += 46 + nLen + eLen + cLen;
    if (!/^xl\/(worksheets\/sheet\d+|sharedStrings)\.xml$/.test(nombre)) continue;

    const lnLen = dv.getUint16(local + 26, true);
    const leLen = dv.getUint16(local + 28, true);
    const ini = local + 30 + lnLen + leLen;
    const datos = buf.subarray(ini, ini + compSize);
    salida[nombre] = metodo === 0 ? new TextDecoder().decode(datos) : await inflar(datos);
  }
  return salida;
}

/** "C7" -> 2. Hace falta porque Excel omite las celdas vacías. */
function columnaDe(ref){
  const m = /^([A-Z]+)/.exec(String(ref || ""));
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

async function leerXLSX(archivo){
  const partes = await abrirZip(new Uint8Array(await archivo.arrayBuffer()));
  const dp = new DOMParser();

  let cadenas = [];
  if (partes["xl/sharedStrings.xml"]){
    const sd = dp.parseFromString(partes["xl/sharedStrings.xml"], "application/xml");
    cadenas = [...sd.getElementsByTagName("si")].map(si =>
      [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  }

  const hoja = Object.keys(partes).filter(n => /worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if (!hoja) throw new Error("El archivo no trae ninguna hoja de cálculo.");
  const doc = dp.parseFromString(partes[hoja], "application/xml");
  if (doc.getElementsByTagName("parsererror").length)
    throw new Error("No se pudo leer la hoja de cálculo.");

  const filas = [];
  for (const row of doc.getElementsByTagName("row")){
    const celdas = [];
    for (const c of row.getElementsByTagName("c")){
      const col = columnaDe(c.getAttribute("r"));
      const t = c.getAttribute("t");
      let v = "";
      if (t === "inlineStr") v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      else {
        const ve = c.getElementsByTagName("v")[0];
        v = ve ? ve.textContent : "";
        if (t === "s") v = cadenas[Number(v)] ?? "";
      }
      celdas[col] = v;
    }
    for (let i = 0; i < celdas.length; i++) if (celdas[i] === undefined) celdas[i] = "";
    filas.push(celdas);
  }
  return filas.filter(f => f.some(c => String(c).trim() !== ""));
}

/* ==========================================================================
   GENERACIÓN DE PDF EN EL NAVEGADOR

   Ni mailto: ni wa.me admiten adjuntos: sólo transportan texto. La única vía
   para mandar el archivo junto con el mensaje es navigator.share() con un
   File, así que hace falta un PDF de verdad hecho aquí mismo.

   Se hace en dos pasos: la hoja se rasteriza tal como se ve —vía un
   foreignObject de SVG, que no necesita ninguna librería— y esa imagen se
   envuelve en un PDF mínimo. El resultado es fiel al documento impreso
   porque es literalmente el mismo render; a cambio, su texto no es
   seleccionable.
   ========================================================================== */

const PT_ANCHO = 612, PT_ALTO = 792;      // carta en puntos PostScript
const PX_ANCHO = 816, PX_ALTO = 1056;     // la misma carta a 96 dpi
const ESCALA_PDF = 2;                     // para que no se vea pixelado

/** Convierte un elemento del documento en un JPEG del tamaño de una hoja carta. */
function rasterizarHoja(el){
  return new Promise((resolve, reject) => {
    // Dentro del SVG el medio es "pantalla", así que las reglas de @media print
    // no aplican: la sangría de la hoja se pone aquí a mano.
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    // La hoja se vuelve a colgar de un .doc-body real: los estilos de la carta
    // son selectores descendentes de él, y sin ese ancestro se pierden.
    const clon = el.cloneNode(true);
    clon.style.cssText = "position:relative;border:0;margin:0;padding:0";

    const papel = document.createElement("div");
    papel.className = "doc-body";
    papel.style.cssText = "width:100%;height:100%;padding:16mm 18mm;margin:0;" +
      "box-sizing:border-box;background:#fff;overflow:hidden";
    papel.appendChild(clon);

    const envoltura = document.createElement("div");
    envoltura.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    envoltura.style.cssText = `width:${PX_ANCHO}px;height:${PX_ALTO}px;background:#fff;` +
      `font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    envoltura.innerHTML = `<style>${css}</style>`;
    envoltura.appendChild(papel);

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PX_ANCHO}" height="${PX_ALTO}">` +
      `<foreignObject width="100%" height="100%">` +
      new XMLSerializer().serializeToString(envoltura) + `</foreignObject></svg>`;

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = PX_ANCHO * ESCALA_PDF;
      cv.height = PX_ALTO * ESCALA_PDF;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, 0, 0, cv.width, cv.height);
      try{ resolve(cv.toDataURL("image/jpeg", 0.92)); }
      catch(e){ reject(new Error("El navegador bloqueó la conversión de la hoja a imagen.")); }
    };
    img.onerror = () => reject(new Error("Este navegador no pudo convertir la carta a imagen."));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

const base64ABytes = b64 => {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
};

/** PDF mínimo: una página tamaño carta por imagen, cada una a página completa. */
function pdfDesdeImagenes(dataUrls){
  const enc = new TextEncoder();
  const trozos = [];
  let largo = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; trozos.push(b); largo += b.length; };

  const n = dataUrls.length;
  const objetos = [];                       // desplazamiento de cada objeto
  const idPagina = i => 3 + i * 3;          // página, imagen y contenido por hoja

  push("%PDF-1.4\n");
  const obj = (num, cuerpo, flujo) => {
    objetos[num] = largo;
    push(`${num} 0 obj\n${cuerpo}\n`);
    if (flujo){ push("stream\n"); push(flujo); push("\nendstream\n"); }
    push("endobj\n");
  };

  obj(1, `<< /Type /Catalog /Pages 2 0 R >>`);
  obj(2, `<< /Type /Pages /Kids [${dataUrls.map((_,i) => `${idPagina(i)} 0 R`).join(" ")}] /Count ${n} >>`);

  dataUrls.forEach((url, i) => {
    const bytes = base64ABytes(url.split(",")[1]);
    const pg = idPagina(i), im = pg + 1, ct = pg + 2;
    obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PT_ANCHO} ${PT_ALTO}] ` +
            `/Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(im, `<< /Type /XObject /Subtype /Image /Width ${PX_ANCHO*ESCALA_PDF} ` +
            `/Height ${PX_ALTO*ESCALA_PDF} /ColorSpace /DeviceRGB /BitsPerComponent 8 ` +
            `/Filter /DCTDecode /Length ${bytes.length} >>`, bytes);
    const contenido = `q ${PT_ANCHO} 0 0 ${PT_ALTO} 0 0 cm /Im0 Do Q`;
    obj(ct, `<< /Length ${contenido.length} >>`, enc.encode(contenido));
  });

  const totalObj = 2 + n * 3;
  const inicioXref = largo;
  let xref = `xref\n0 ${totalObj + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= totalObj; i++)
    xref += String(objetos[i]).padStart(10, "0") + " 00000 n \n";
  push(xref);
  push(`trailer\n<< /Size ${totalObj + 1} /Root 1 0 R >>\nstartxref\n${inicioXref}\n%%EOF\n`);

  const salida = new Uint8Array(largo);
  let o = 0;
  for (const t of trozos){ salida.set(t, o); o += t.length; }
  return salida;
}

/** Nombre de archivo sin acentos ni caracteres que molesten al sistema. */
const nombreArchivo = txt => String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70);

/* ----- Consultas ----- */

const cliente     = id => state.clientes.find(c => c.id === id);
const actsDe      = id => state.actividades.filter(a => a.clienteId === id)
                            .sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
const conveniosDe = id => state.convenios.filter(c => c.clienteId === id)
                            .sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
const ultimaAct   = id => actsDe(id)[0] || null;
const nombreCli   = id => (cliente(id) || {}).empresa || "(cliente eliminado)";

function clientesVisibles(){
  const q = filtros.q.trim().toLowerCase();
  return state.clientes.filter(c => {
    if (!esMio(c)) return false;
    if (filtros.ejecutivo && c.ejecutivo !== filtros.ejecutivo) return false;
    if (!q) return true;
    return [c.empresa,c.contacto,c.telefono,c.email,c.ubicacion,c.ejecutivo,c.notas]
      .join(" ").toLowerCase().includes(q);
  });
}

   ========================================================================== */

function render(){
  // Nada de lo que sigue se ve si no hay sesión; se dibuja igual para que al
  // entrar esté listo, pero el candado lo deja fuera de la página.
  candado();
  ajustarDepto();
  // Cada papel ve las suyas. Los Ajustes tocan las tarifas públicas, los textos
  // de los convenios y la conexión de todo el equipo: son del administrador.
  // Y si alguien llegó a una pestaña que no le toca, se le desvía.
  document.querySelectorAll("nav button").forEach(b =>
    b.style.display = puedeVer(b.dataset.view) ? "" : "none");
  if (!puedeVer(vista)) vista = vistasDelRol()[0] || "formulario";

  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.view === vista)));
  document.querySelectorAll(".view").forEach(v =>
    v.id === "v-" + vista ? v.setAttribute("data-on","") : v.removeAttribute("data-on"));

  const buscando = ["tablero","clientes","actividades"].includes(vista);
  const porEjecutivo = vista === "tablero" || vista === "clientes";
  document.getElementById("q").style.display      = buscando ? "" : "none";
  document.getElementById("fEje").style.display   = porEjecutivo ? "" : "none";
  document.getElementById("bNuevo").style.display =
    ["tablero","clientes"].includes(vista) ? "" : "none";
  // Importar y Exportar mueven la cartera entera: quien no la ve, tampoco.
  const conCartera = puedeVer("clientes") ? "" : "none";
  document.getElementById("bImport").style.display = conCartera;
  document.getElementById("bExport").style.display = conCartera;

  renderEjecutivos();
  pintarNube();
  pintarDepto();
  pintarBotonIA();
  pintarAvisos();
  if (vista === "tablero")   { renderKpis(); renderTablero(); }
  if (vista === "clientes")  renderClientes();
  if (vista === "actividades") renderActividades();
  if (vista === "convenios") renderConvenios();
  if (vista === "contratos") renderContratos();
  if (vista === "eventos") renderEventos();
  if (vista === "contratosbq") renderContratosBq();
  if (vista === "campanas") renderCampanas();
  if (vista === "utms") renderUtms();
  if (vista === "calendario") renderCalendario();
  if (vista === "reportes") renderReportes();
  if (vista === "confirmaciones") renderConfirmaciones();
  if (vista === "formulario") renderFormulario();
  if (vista === "ajustes")   renderAjustes();

  // Al final, para que no salga encima de una pantalla a medio dibujar.
  pantallaDepto();
}

function renderEjecutivos(){
  document.getElementById("fEje").innerHTML = opcionesEjecutivos(filtros.ejecutivo, "Todos");
}

function renderKpis(){
  const cs = clientesVisibles();
  const abiertos = cs.filter(c => !est(c.estatus).won && !est(c.estatus).lost);
  const ganados  = cs.filter(c => est(c.estatus).won);
  const ids = new Set(cs.map(c => c.id));
  // Los dos últimos recuadros son los del papel que se lleva cada quien: a
  // ventas le importan los convenios; a banquetes, sus eventos.
  const propios = veHospedaje()
    ? [["Convenios firmados",
        String(state.convenios.filter(v => ids.has(v.clienteId) && v.estado === "firmado_cliente").length),
        "por el cliente"],
       ["Esperando cliente",
        String(state.convenios.filter(v => ids.has(v.clienteId) && v.estado === "firmado_ejecutiva").length),
        "firma pendiente"]]
    : [["Eventos firmados",
        String(state.eventos.filter(e => eventoEsMio(e) && ["firmado","confirmado"].includes(e.estado)).length),
        "contratados"],
       ["En la mesa",
        String(eventosVisibles("cotizacion").filter(e => ["borrador","enviada"].includes(e.estado)).length),
        "cotizaciones sin cerrar"]];

  document.getElementById("kpis").innerHTML = [
    ["Clientes",   String(cs.length),       "en la cartera"],
    ["En proceso", String(abiertos.length), "sin cerrar"],
    ["Ganados",    String(ganados.length),  veHospedaje() ? "convenio cerrado" : "cerrados"],
    ...propios
  ].map(([t,v,s]) => `<div class="kpi"><small>${esc(t)}</small><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join("");
}

function renderTablero(){
  const cs = clientesVisibles();
  const board = document.getElementById("board");
  board.innerHTML = "";

  for (const e of ESTATUS){
    const mios = cs.filter(c => c.estatus === e.id).sort((a,b) => a.empresa.localeCompare(b.empresa, "es"));
    const col = document.createElement("section");
    col.className = "col";
    col.dataset.estatus = e.id;
    col.innerHTML = `
      <div class="col-head">
        <span class="dot" style="background:${e.color}"></span>

    else mios.forEach(c => cont.appendChild(tarjeta(c, e)));

function tarjeta(c, e){
  const el = document.createElement("article");
  el.className = "card";
  el.draggable = true;
  el.dataset.id = c.id;
  el.style.borderLeftColor = e.color;

  const ua = ultimaAct(c.id);
  const n = actsDe(c.id).length;
  const docs = veHospedaje() ? conveniosDe(c.id)
                             : state.eventos.filter(e => e.clienteId === c.id && eventoEsMio(e));
  const firmado = veHospedaje() ? docs.some(v => v.estado === "firmado_cliente")
                                : docs.some(e => ["firmado","confirmado"].includes(e.estado));
  const espera  = veHospedaje() ? docs.some(v => v.estado === "firmado_ejecutiva")
                                : docs.some(e => e.estado === "enviada");
  const i = ESTATUS.findIndex(x => x.id === c.estatus);

  el.innerHTML = `
    <div class="card-title">${esc(c.empresa || "(sin empresa)")}</div>
    <div class="card-sub">${esc([c.contacto, c.ubicacion].filter(Boolean).join(" · ") || "—")}</div>
    <div class="card-row">
      ${c.tarifa ? `<span class="pill oro">${esc(money(c.tarifa))}</span>` : ""}
      ${c.ejecutivo ? `<span class="pill">${esc(c.ejecutivo)}</span>` : ""}
      ${n ? `<span class="pill" title="Actividades registradas">${n} act.</span>` : ""}
      ${firmado ? `<span class="pill good">${veHospedaje() ? "Convenio firmado" : "Evento contratado"}</span>`
                : espera ? `<span class="pill warn">Espera firma</span>` : ""}
    </div>
    ${ua ? `<div class="card-sub" style="margin-top:6px">${tipoAct(ua.tipo).icon} ${esc(ua.asunto || tipoAct(ua.tipo).name)} · ${esc(fechaHora(ua.fecha))}</div>` : ""}
    <div class="card-acts">
      <button data-dir="-1" ${i <= 0 ? "disabled" : ""} title="Estatus anterior">‹</button>
      <button class="wa" data-wa ${c.telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>
      <button data-dir="1" ${i >= ESTATUS.length-1 ? "disabled" : ""} title="Estatus siguiente">›</button>
    </div>`;

  el.addEventListener("dragstart", ev => {
    arrastrando = c.id; el.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", c.id);
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  el.addEventListener("click", ev => {
    if (ev.target.closest("[data-wa]")){ ev.stopPropagation(); abrirWhatsApp(c); return; }
    const b = ev.target.closest("button[data-dir]");
    if (b){
      ev.stopPropagation();
      const destino = ESTATUS[i + Number(b.dataset.dir)];
      if (destino) moverCliente(c.id, destino.id);
      return;
    }
    abrirCliente(c.id);
  });
  return el;
}

function moverCliente(id, estatus){
  const c = cliente(id);
  if (!c || c.estatus === estatus) return;
  c.estatus = estatus;
  c.updatedAt = new Date().toISOString();
  guardar(); render();
}

/* ==========================================================================
   FORMULARIO DE PROSPECCIÓN

   Lo que se llena en un stand, de pie y con prisa: cinco campos y listo. No
   entra a la cartera hasta que alguien lo trabaja, para que un evento de cien
   registros no llene el embudo de gente que nunca contestó.
   ========================================================================== */

let filtroPros = { q:"", evento:"" };
let ultimoEvento = "";      // se repite solo: en una expo todos son del mismo

const prospectosVisibles = () => {
  const yo = miNombre().trim().toLowerCase();
  const mios = p => puedeVerTodo() || veMarketing() ||
    (!!yo && String(p.capturadoPor || "").trim().toLowerCase() === yo);
  const q = filtroPros.q.trim().toLowerCase();
  return state.prospectos.filter(p => {
    if (!mios(p)) return false;
    if (filtroPros.evento && p.evento !== filtroPros.evento) return false;
    if (!q) return true;
    return [p.nombre, p.apellido, p.compania, p.email, p.telefono, p.evento, p.notas]
      .join(" ").toLowerCase().includes(q);
  }).sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
};

const eventosConocidos = () => [...new Set(state.prospectos.map(p => p.evento).filter(Boolean))]
  .sort((a,b) => a.localeCompare(b,"es"));

/** Los mismos campos en la vista y en la ventana de edición. */
const camposProspecto = (p, pre) => `
  <div class="grid">
    <div><label class="lbl">Nombre *</label>
      <input class="field" id="${pre}Nom" value="${esc(p.nombre)}" autocomplete="off"></div>
    <div><label class="lbl">Apellido *</label>
      <input class="field" id="${pre}Ape" value="${esc(p.apellido)}" autocomplete="off"></div>
    <div><label class="lbl">Compañía <span class="hint">(opcional)</span></label>
      <input class="field" id="${pre}Emp" value="${esc(p.compania)}" autocomplete="off"></div>
    <div><label class="lbl">Evento <span class="hint">(opcional)</span></label>
      <input class="field" id="${pre}Evt" value="${esc(p.evento)}" list="listaEventos"
        placeholder="Expo Salud 2026" autocomplete="off"></div>
    <div><label class="lbl">Correo electrónico *</label>
      <input class="field" type="email" id="${pre}Mail" value="${esc(p.email)}"
        autocomplete="off" spellcheck="false" inputmode="email"></div>
    <div><label class="lbl">Número de teléfono *</label>
      <input class="field" type="tel" id="${pre}Tel" value="${esc(p.telefono)}"
        autocomplete="off" inputmode="tel"></div>
    <div class="full"><label class="lbl">Notas <span class="hint">(opcional)</span></label>
      <textarea class="field" id="${pre}Notas" style="min-height:70px">${esc(p.notas)}</textarea></div>
  </div>
  <datalist id="listaEventos">${eventosConocidos().map(e =>
    `<option value="${esc(e)}">`).join("")}</datalist>`;

/**
 * Lee los campos y reclama lo que falte. Devuelve el prospecto o null.
 *
 * Se valida de verdad el correo y el teléfono: un registro de evento sin
 * manera de volver a contactar a la persona no sirve de nada.
 */
function leerProspecto(raiz, pre, cajaErr, base){
  const val = id => raiz.querySelector("#" + pre + id).value.trim();
  const nombre = val("Nom"), apellido = val("Ape");
  const email = val("Mail").toLowerCase(), telefono = val("Tel");
  const faltan = [];

  if (!nombre)   faltan.push("Escribe el nombre.");
  if (!apellido) faltan.push("Escribe el apellido.");
  if (!email)          faltan.push("Escribe el correo electrónico.");
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))
    faltan.push(`"${email}" no parece un correo válido.`);
  if (!telefono)                              faltan.push("Escribe el número de teléfono.");
  else if (telefono.replace(/\D/g,"").length < 10)
    faltan.push("El teléfono debe traer al menos 10 dígitos.");

  cajaErr.innerHTML = faltan.length
    ? `<div class="errbox"><b>Falta esto para guardar:</b><ul>${
        faltan.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
    : "";
  if (faltan.length) return null;

  return saneaProspecto(Object.assign({}, base, {
    nombre, apellido, email, telefono,
    compania: val("Emp"), evento: val("Evt"), notas: val("Notas")
  }));
}

      <span style="flex:1;min-width:240px"><b>¿La tableta la va a llenar el cliente?</b>

      <select class="field" id="fEvento" title="Evento"></select>
      <span style="flex:1"></span>
      <button class="btn" id="bExpPros">Exportar CSV</button>
    </div>

    <div id="listaPros"></div>`;

  const err   = cont.querySelector("#prosErr");
  const aviso = cont.querySelector("#prosOk");
  const CAMPOS = ["npNom","npApe","npEmp","npEvt","npMail","npTel","npNotas"];

  /** La tabla y el selector de eventos, que son lo único que cambia al filtrar. */
  function pintarLista(){
    const ps = prospectosVisibles();
    const eventos = eventosConocidos();
    cont.querySelector("#prosCuenta").textContent = `${ps.length} registro(s)`;

    const sel = cont.querySelector("#fEvento");
    sel.style.display = eventos.length ? "" : "none";
    sel.innerHTML = `<option value="">Todos los eventos</option>` + eventos.map(e =>
      `<option value="${esc(e)}"${e === filtroPros.evento ? " selected" : ""}>${esc(e)}</option>`).join("");

    cont.querySelector("#listaPros").innerHTML = ps.length ? `<table class="data">
      <thead><tr><th>Capturado</th><th>Nombre</th><th>Compañía</th><th>Correo</th>
        <th>Teléfono</th><th>Evento</th>${puedeVerTodo() ? "<th>Capturó</th>" : ""}
        <th>Estado</th><th></th></tr></thead>
      <tbody>${ps.map(p => `<tr data-p="${p.id}">
        <td class="nowrap">${esc(fechaCorta(String(p.fecha).slice(0,10)))}</td>
        <td><b>${esc(nombreProspecto(p))}</b></td>
        <td>${esc(p.compania || "—")}</td>
        <td>${esc(p.email)}</td>
        <td class="nowrap">${esc(p.telefono)}</td>
        <td>${esc(p.evento || "—")}</td>
        ${puedeVerTodo() ? `<td class="nowrap">${esc(p.capturadoPor || "—")}</td>` : ""}
        <td class="nowrap">${p.clienteId
          ? `<span class="pill" style="background:var(--ok-soft);color:var(--ok)">En cartera</span>`
          : `<span class="hint">Sin trabajar</span>`}</td>
        <td class="nowrap">
          ${!p.clienteId && puedeVer("clientes")
            ? `<button class="btn sm primary" data-pasar="${p.id}">Pasar a la cartera</button>` : ""}
          ${p.clienteId && puedeVer("clientes")
            ? `<button class="btn sm" data-vercli="${p.id}">Ver cliente</button>` : ""}
          <button class="btn sm" data-editp="${p.id}">Editar</button>
          <button class="btn sm danger" data-delp="${p.id}">Borrar</button></td>
      </tr>`).join("")}</tbody></table>`
      : `<div class="vacio">${state.prospectos.length
          ? "Ningún registro coincide con la búsqueda."
          : "Todavía no hay registros.<br>El primero se levanta con el formulario de arriba."}</div>`;

    const pros = id => state.prospectos.find(x => x.id === id);
    cont.querySelectorAll("[data-pasar]").forEach(b =>
      b.onclick = () => pasarACartera(pros(b.dataset.pasar)));
    cont.querySelectorAll("[data-vercli]").forEach(b =>
      b.onclick = () => abrirCliente(pros(b.dataset.vercli).clienteId));
    cont.querySelectorAll("[data-editp]").forEach(b =>
      b.onclick = () => editarProspecto(pros(b.dataset.editp), pintarLista));
    cont.querySelectorAll("[data-delp]").forEach(b => b.onclick = () => {
      const p = pros(b.dataset.delp);
      if (!confirm(`¿Borrar el registro de "${nombreProspecto(p)}"?`)) return;
      state.prospectos = state.prospectos.filter(x => x.id !== p.id);
      guardar(); pintarLista();
    });
  }
  pintarLista();

  cont.querySelector("#bGuardarPros").onclick = () => {
    const nuevo = leerProspecto(cont, "np", err, {
      capturadoPor: miNombre(), fecha: ahoraLocal(), createdAt: new Date().toISOString()
    });
    if (!nuevo) return;

    // En un stand es fácil apuntar dos veces a la misma persona.
    const repetido = state.prospectos.find(x => x.email && x.email === nuevo.email);
    if (repetido && !confirm(
        `Ya hay un registro con el correo ${nuevo.email} (${nombreProspecto(repetido)}).\n\n` +
        `¿Guardar de todos modos?`)) return;

    state.prospectos.push(nuevo);
    ultimoEvento = nuevo.evento;      // en una expo se capturan decenas seguidos
    guardar();

    CAMPOS.forEach(id => {
      const el = cont.querySelector("#" + id);
      if (el) el.value = id === "npEvt" ? ultimoEvento : "";

    err.innerHTML = "";

  cont.querySelector("#bKiosco").onclick = abrirKiosco;

  cont.querySelector("#bLimpiarPros").onclick = () => {
    CAMPOS.forEach(id => { const el = cont.querySelector("#" + id); if (el) el.value = ""; });
    err.innerHTML = ""; aviso.textContent = "";

  cont.querySelector("#qPros").oninput = e => { filtroPros.q = e.target.value; pintarLista(); };

  };
}

/* ----- Modo tableta: la pantalla que se le pone enfrente al cliente ----- */

let despierto = null;      // para que la tableta no se apague sola en el stand

/**
 * El modo tableta sobrevive a una recarga.
 *
 * En un stand, el cliente arrastra la pantalla hacia abajo y el navegador
 * recarga; si al volver apareciera el CRM, quedaría la cartera del hotel a la
 * vista de quien pasara. Por eso se apunta aquí y se vuelve a entrar solo.
 */
const KIOSCO_CFG = "crm-hotel-kiosco";

const kioscoGuardado = () => {
  try{
    const c = JSON.parse(localStorage.getItem(KIOSCO_CFG) || "null");
    return c && typeof c === "object" ? c : null;
  }catch(e){ return null; }
};

/** Antes de entregar la tableta se confirma de qué evento es y quién la trae. */
function abrirKiosco(){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Modo tableta</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note">La pantalla se llena completa con el formulario. El cliente
          <b>no ve las pestañas, ni la cartera, ni lo que capturaron otros</b>: sólo sus
          propios datos, y en cuanto los manda la pantalla se limpia para el que sigue.</div>
        <div class="grid">
          <div class="full"><label class="lbl">Evento</label>
            <input class="field" id="kEvt" value="${esc(ultimoEvento)}" list="listaEventosK"
              placeholder="Expo Salud 2026">
            <div class="hint">Se le pone a todo lo que se capture en esta sesión. Se puede dejar vacío.</div></div>
          <div class="full"><label class="lbl">Los registros quedan a nombre de</label>
            ${selectEjecutivo(miNombre(), "kEje")}
            <div class="hint">Quien está atendiendo el stand.</div></div>
        </div>
        <datalist id="listaEventosK">${eventosConocidos().map(e =>
          `<option value="${esc(e)}">`).join("")}</datalist>
        <div class="note warn" style="margin-top:14px"><b>Para salir</b> hay que mantener
          pulsada la esquina de arriba a la derecha dos segundos. Así nadie se sale de
          curioso, pero tampoco hay otra contraseña que recordar.</div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOk">Entregar la tableta</button></div>
    </div>`);

  ov.querySelector("#bOk").onclick = () => {
    ultimoEvento = ov.querySelector("#kEvt").value.trim();
    const quien = ov.querySelector('[name="kEje"]').value.trim();
    ov.remove();
    entrarKiosco(ultimoEvento, quien);
  };
}

function entrarKiosco(evento, quien){
  // Pantalla completa de verdad donde se pueda: en una tableta quita la barra
  // del navegador, y con ella el botón de atrás y la dirección.
  try{
    const el = document.documentElement;
    const pedir = el.requestFullscreen || el.webkitRequestFullscreen;
    if (pedir) Promise.resolve(pedir.call(el)).catch(() => {});
  }catch(e){}
  try{
    if (navigator.wakeLock && navigator.wakeLock.request)
      navigator.wakeLock.request("screen").then(w => { despierto = w; }).catch(() => {});
  }catch(e){}

  try{ localStorage.setItem(KIOSCO_CFG, JSON.stringify({ evento, quien })); }catch(e){}

  const caja = document.createElement("div");
  caja.id = "kiosco";
  document.body.appendChild(caja);
  document.body.classList.add("con-kiosco");
  document.body.style.overflow = "hidden";
  pintarKiosco(caja, evento, quien);
  ponerSalida(caja);
}

function salirKiosco(){
  try{ localStorage.removeItem(KIOSCO_CFG); }catch(e){}
  const caja = document.getElementById("kiosco");
  if (caja) caja.remove();
  document.querySelectorAll(".k-salir,.k-saliendo").forEach(x => x.remove());
  document.body.classList.remove("con-kiosco");
  document.body.style.overflow = "";
  try{ if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  try{ if (despierto){ despierto.release(); despierto = null; } }catch(e){}
  render();
}

/** El botón de salida: hay que mantenerlo pulsado, no basta con tocarlo. */
function ponerSalida(caja){
  const b = document.createElement("button");
  b.className = "k-salir";
  b.type = "button";
  b.textContent = "✕";
  b.title = "Mantén pulsado para salir";
  b.setAttribute("aria-label", "Mantener pulsado para salir del modo tableta");
  document.body.appendChild(b);

  let reloj = null, pista = null;
  const suelta = () => {
    clearTimeout(reloj); reloj = null;
    if (pista){ pista.remove(); pista = null; }
  };
  b.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    pista = document.createElement("div");
    pista.className = "k-saliendo";
    pista.textContent = "Sigue pulsando para salir…";
    document.body.appendChild(pista);
    reloj = setTimeout(() => { suelta(); salirKiosco(); }, 2000);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(e => b.addEventListener(e, suelta));
  caja.dataset.conSalida = "sí";
}

/**
 * Guarda lo que llenó el cliente.
 *
 * Los reclamos van en grande y en su idioma, no en el del sistema. Y un correo
 * repetido aquí NO se pregunta: la pregunta diría el nombre de quien lo capturó
 * antes, y eso es un dato de otra persona en una pantalla que cualquiera está
 * mirando. Se guarda y el equipo lo depura después.
 */
function mandarKiosco(caja, err, evento, quien){
  const val = id => caja.querySelector("#" + id).value.trim();
  const marca = id => caja.querySelector("#" + id).classList.add("err");
  const nombre = val("kNom"), apellido = val("kApe");
  const email = val("kMail").toLowerCase(), telefono = val("kTel");
  const faltan = [];

  caja.querySelectorAll("input").forEach(i => i.classList.remove("err"));
  if (!nombre){   faltan.push("Falta su nombre.");   marca("kNom"); }
  if (!apellido){ faltan.push("Falta su apellido."); marca("kApe"); }
  if (!email){ faltan.push("Falta su correo electrónico."); marca("kMail"); }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    faltan.push("Revise el correo electrónico, parece que le falta algo."); marca("kMail");
  }
  if (!telefono){ faltan.push("Falta su número de teléfono."); marca("kTel"); }
  else if (telefono.replace(/\D/g,"").length < 10){
    faltan.push("El teléfono debe llevar 10 dígitos."); marca("kTel");
  }

  if (faltan.length){
    err.innerHTML = `<div class="k-err"><b>Nos falta un dato:</b>
      <ul>${faltan.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    const primero = caja.querySelector("input.err");
    if (primero) primero.focus();
    err.scrollIntoView({ block:"center", behavior:"smooth" });
    return;
  }

  state.prospectos.push(saneaProspecto({
    nombre, apellido, email, telefono, compania: val("kEmp"),
    evento, capturadoPor: quien, fecha: ahoraLocal(),
    notas: "Lo llenó el cliente en la tableta.",
    createdAt: new Date().toISOString()
  }));
  guardar();
  graciasKiosco(caja, nombre, evento, quien);
}

function graciasKiosco(caja, nombre, evento, quien){
  const h = state.ajustes.hotel;
  caja.innerHTML = `
    <div class="k-hoja">
      <div class="k-marca">${membreteKiosco(h)}</div>
      <div class="k-gracias">
        <div class="k-tick" aria-hidden="true">✓</div>
        <h2>¡Gracias, ${esc(nombre)}!</h2>
        <p>Sus datos quedaron registrados. En breve nos ponemos en contacto.</p>
        <button class="k-enviar" id="kOtro" type="button" style="max-width:340px;margin:0 auto">
          Registrar a otra persona</button>
      </div>
    </div>`;

  const seguir = () => { clearTimeout(reloj); pintarKiosco(caja, evento, quien); };
  caja.querySelector("#kOtro").onclick = seguir;
  // Si nadie toca nada, la pantalla vuelve sola: en un stand la tableta se
  // queda abandonada con el "gracias" de la persona anterior.
  const reloj = setTimeout(seguir, 9000);
}

/**
 * De registro de evento a cliente de la cartera.
 *
 * Aquí se decide el ejecutivo, y por eso no es automático: quien capturó
 * puede ser Banquetes, que no tiene cartera, y el prospecto quedaría en
 * manos de nadie.
 */
function pasarACartera(pr){
  const sugerido = pr.compania || nombreProspecto(pr);
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Pasar a la cartera</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note"><b>${esc(nombreProspecto(pr))}</b>${pr.compania ? " · " + esc(pr.compania) : ""}
          <br>${esc(pr.email)} · ${esc(pr.telefono)}</div>
        <div id="pcErr"></div>
        <div class="grid">
          <div class="full"><label class="lbl">Empresa <span class="hint">(como va en la cartera)</span></label>
            <input class="field" id="pcEmp" value="${esc(sugerido)}"></div>
          <div class="full"><label class="lbl">Ejecutivo de ventas</label>
            ${selectEjecutivo(miNombre(), "pcEje")}
            <div class="hint">Quien lo va a trabajar. Sin ejecutivo, el cliente no le aparece a nadie.</div></div>
        </div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOk">Crear el cliente</button></div>
    </div>`);

  ov.querySelector("#bOk").onclick = () => {
    const empresa = ov.querySelector("#pcEmp").value.trim();
    if (!empresa){
      ov.querySelector("#pcErr").innerHTML =
        `<div class="errbox">Escribe el nombre de la empresa.</div>`;
      return;
    }
    const eje = ov.querySelector('[name="pcEje"]').value.trim();
    const camp = campana(pr.campanaId);
    const c = saneaCliente({
      empresa, contacto: nombreProspecto(pr), telefono: pr.telefono, email: pr.email,
      ejecutivo: eje, estatus: "contactado",
      // De qué campaña salió. Es el eslabón que permite seguirle la pista al
      // dinero: de aquí cuelgan sus convenios, contratos y eventos.
      campanaId: pr.campanaId,
      notas: [camp ? `Llegó por la campaña "${camp.nombre}".`
                   : pr.evento ? `Prospecto levantado en ${pr.evento}.` : "Prospecto de evento.",
              pr.notas].filter(Boolean).join(" "),
      createdAt: new Date().toISOString()
    });
    state.clientes.push(c);
    registrarAuto(c.id, "Alta desde el formulario de prospección",
      [pr.evento ? `Evento: ${pr.evento}.` : "", `Capturado por ${pr.capturadoPor || "—"}.`]
        .filter(Boolean).join(" "), eje || pr.capturadoPor);
    pr.clienteId = c.id;
    pr.updatedAt = new Date().toISOString();
    guardar(); render(); ov.remove();
    abrirCliente(c.id);
  };
}

/* ==========================================================================
   CONFIRMACIONES DE HOSPEDAJE

/** Sello de "ya se mandó", para la carta de un huésped o el enlace de un convenio. */
function selloEnvio(g){
  if (!g.enviado)
    return `<span class="pill" title="Todavía no se manda desde aquí">Sin enviar</span>`;
  const e = g.enviado;
  return `<span class="pill good" title="Enviada por ${esc(VIAS[e.via])} el ${esc(fechaHora(e.fecha))}` +
    `${e.quien ? " por " + esc(e.quien) : ""}">✓ ${esc(VIAS[e.via])} · ${esc(fechaCorta(e.fecha))}</span>`;
}

let soloPendientes = false;
let seleccion = new Set();

/**
 * Marca varias cartas de una vez.
 *
 * Al estrenar el indicador, todo lo mandado antes aparece como pendiente y
 * corregirlo huésped por huésped es media tarde. Se pide la fecha porque el
 * envío fue otro día: poner la de hoy sería una constancia falsa.
 */
function marcarVarias(ids, via){
  const gs = ids.map(id => state.huespedes.find(x => x.id === id)).filter(Boolean);
  if (!gs.length) return;
  const dia = prompt(`¿Qué día se enviaron estas ${gs.length} cartas por ${VIAS[via]}?\n\n` +
                     "Formato AAAA-MM-DD. Déjalo como está si fue hoy.", hoyISO());
  if (dia === null) return;
  const d = String(dia).trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || isNaN(Date.parse(d + "T12:00:00"))){
    alert(`"${d}" no es una fecha válida. Se esperaba algo como ${hoyISO()}.`);
    return;
  }
  // Mediodía para que el cambio de huso no la corra al día anterior.
  const fecha = new Date(d + "T12:00:00").toISOString();
  for (const g of gs) g.enviado = { fecha, via, quien: correoSesion() };
  seleccion.clear();
  guardar(); render();
}

function desmarcarVarias(ids){
  const gs = ids.map(id => state.huespedes.find(x => x.id === id)).filter(Boolean);
  if (!gs.filter(g => g.enviado).length){ alert("Ninguna de las seleccionadas está marcada."); return; }
  if (!confirm(`¿Quitar la marca de enviada a ${gs.length} carta(s)?`)) return;
  for (const g of gs) g.enviado = null;
  seleccion.clear();
  guardar(); render();
}


function renderConfirmaciones(){
  const cont = document.getElementById("tblConfirm");
  const todos = [...state.huespedes].sort((a,b) =>
    String(a.llegada).localeCompare(String(b.llegada)) ||
    nombreCompleto(a).localeCompare(nombreCompleto(b), "es"));
  const enviadas = todos.filter(g => g.enviado).length;
  const gs = soloPendientes ? todos.filter(g => !g.enviado) : todos;
  const visibles = new Set(gs.map(g => g.id));
  for (const id of [...seleccion]) if (!visibles.has(id)) seleccion.delete(id);
  const sel = [...seleccion];

  const cab = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b style="font-size:15px">Cartas de confirmación</b>
      <span class="hint">${todos.length} huésped(es) · una carta por huésped${
        todos.length ? ` · <b>${enviadas} de ${todos.length} enviadas</b>` : ""}</span>
      ${todos.length && enviadas < todos.length
        ? `<button class="btn sm${soloPendientes ? " primary" : ""}" id="bPend">${

      <b>${sel.length} seleccionada(s)</b>

    .replace(/\{\{NOCHES\}\}/g, n === "" ? "" : String(n));

      letter-spacing:.02em">${esc(V(t.confTitulo))}</h1>

    <p><b>${esc(V(t.confSaludo))}</b></p>
    <p style="white-space:pre-wrap">${esc(V(t.confCuerpo))}</p>

    <h2>Detalles de la reservación</h2>
    <div class="doc-campos">
      ${campo("Número de reservación:", g.reservacion)}

    <p style="white-space:pre-wrap">${esc(V(t.confConfirma))}</p>

      ${h.emailReservaciones ? `<div><i>Correo electrónico:</i> ${esc(h.emailReservaciones)}</div>` : ""}
    </div>

    <p style="white-space:pre-wrap">${esc(V(t.confCierre))}</p>

  const ids = lote && lote.length ? lote : [id];

    <div class="modal doc">

        <h2>${varias ? `${gs.length} cartas de confirmación` : "Carta de confirmación"}</h2>
        <button class="btn" data-close>✕</button>

        ${!varias ? selloEnvio(gs[0]) : ""}
        <div class="spacer"></div>
        ${!varias ? `<button class="btn" id="bMailC" ${gs[0].email ? "" : "disabled"}>Enviar por correo</button>
          <button class="btn wa" id="bWaC" ${gs[0].telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrintC").onclick = () => {
    fijarPagina(true);

    window.addEventListener("afterprint", quitar);

  ov.querySelector("#bPdfC").onclick = async e => {
    const b = e.currentTarget, txt = b.textContent;
    b.disabled = true; b.textContent = "Generando…";

  const bm = ov.querySelector("#bMailC");
  if (bm) bm.onclick = () => enviarConfirmacion(gs[0].id, "correo");
  const bw = ov.querySelector("#bWaC");
  if (bw) bw.onclick = () => enviarConfirmacion(gs[0].id, "whatsapp");
