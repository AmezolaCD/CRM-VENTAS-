<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORE · CRM Ventas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpolygon points='60,14 20.16,37 20.16,83 60,106 99.84,83 99.84,37' fill='none' stroke='%2339104e' stroke-width='9'/%3E%3Cg fill='none' stroke='%23b2aa6d' stroke-width='9'%3E%3Cpath d='M60 8 V 30' transform='rotate(0 60 60)'/%3E%3Cpath d='M60 8 V 30' transform='rotate(60 60 60)'/%3E%3Cpath d='M60 8 V 30' transform='rotate(120 60 60)'/%3E%3Cpath d='M60 8 V 30' transform='rotate(180 60 60)'/%3E%3Cpath d='M60 8 V 30' transform='rotate(240 60 60)'/%3E%3Cpath d='M60 8 V 30' transform='rotate(300 60 60)'/%3E%3C/g%3E%3Ccircle cx='60' cy='60' r='16' fill='%2339104e'/%3E%3C/svg%3E">
<style>
  /* Identidad CORE: morado #39104e, oro #b2aa6d y blanco.
     Los tres estados con significado —logrado, pendiente y perdido— usan
     tonos derivados de esa paleta para no perder la lectura. */
  :root{
    --bg:#f2f0f5; --panel:#ffffff; --panel-2:#faf9fc; --col:#eae7ef;
    --text:#2b0d3a; --muted:#6f6279; --line:#e0dbe7;
    --accent:#39104e; --accent-soft:#efe9f4; --ink-solido:#ffffff;
    --logo-morado:#39104e;
    --oro:#b2aa6d; --oro-tinta:#6d6634; --oro-suave:#f4f2e4;
    --ok:#6d6634; --ok-soft:#f2efdf;
    --bad:#a33b3b; --bad-soft:#fbeaea;
    --warn:#8a5a2b; --warn-soft:#f9efe4;
    --shadow:0 1px 2px rgba(57,16,78,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#150a1c; --panel:#211029; --panel-2:#2a1734; --col:#1a0d22;
      --text:#f2ecf6; --muted:#a795b1; --line:#382544;
      --accent:#b98fd6; --accent-soft:#2e1840; --ink-solido:#1a0b23;
      --logo-morado:#cbb0de;
      --oro:#b2aa6d; --oro-tinta:#cec68c; --oro-suave:#2c2a17;
      --ok:#cec68c; --ok-soft:#2c2a17;
      --bad:#f08b8b; --bad-soft:#331616;
      --warn:#d79a5e; --warn-soft:#33210f;
      --shadow:0 1px 2px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#150a1c; --panel:#211029; --panel-2:#2a1734; --col:#1a0d22;
    --text:#f2ecf6; --muted:#a795b1; --line:#382544;
    --accent:#b98fd6; --accent-soft:#2e1840; --ink-solido:#1a0b23;
    --logo-morado:#cbb0de;
    --oro:#b2aa6d; --oro-tinta:#cec68c; --oro-suave:#2c2a17;
    --ok:#cec68c; --ok-soft:#2c2a17;
    --bad:#f08b8b; --bad-soft:#331616;
    --warn:#d79a5e; --warn-soft:#33210f;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }

  /* ---------- Animación de entrada ----------
     Va con pointer-events:none para no tapar nada mientras dura, y se retira
     sola del DOM. Con "reducir movimiento" activado no llega ni a mostrarse. */
  #intro{
    position:fixed; inset:0; z-index:200; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:radial-gradient(circle at 50% 45%, #4a1a63 0%, #2b0b3c 55%, #17061f 100%);
    transition:background .55s ease-out;
  }
  /* Al final el logo no se desvanece: viaja hasta el botón de inicio y se
     tiñe con los colores del encabezado, para que el relevo no se note. */
  #intro.vuelo{background:radial-gradient(circle at 50% 45%, #4a1a6300 0%, #17061f00 100%)}
  #intro svg{width:150px; height:150px; overflow:visible;
    transition:transform .8s cubic-bezier(.6,0,.3,1)}
  #intro.vuelo .marca{opacity:0; transition:opacity .3s ease-out}
  #intro.vuelo .hex{stroke:var(--logo-morado); transition:stroke .55s ease-out .2s}
  #intro.vuelo .flechas{stroke:var(--oro); transition:stroke .55s ease-out .2s}
  #intro.vuelo .nucleo{fill:var(--logo-morado); transition:fill .55s ease-out .2s}
  /* Mientras el logo va en camino, el del encabezado se oculta: si no,
     se verían dos a la vez. */
  .intro-activa .brand .logo{visibility:hidden}
  #intro .hex{
    fill:none; stroke:#b2aa6d; stroke-width:6;
    stroke-dasharray:276; stroke-dashoffset:276;
    animation:intro-trazo .75s cubic-bezier(.4,0,.2,1) .1s forwards;
  }
  #intro .fl{opacity:0; animation:intro-flecha .55s cubic-bezier(.34,1.3,.64,1) forwards}
  #intro .nucleo{
    fill:#b2aa6d; transform:scale(0); transform-origin:60px 60px;
    animation:intro-nucleo .5s cubic-bezier(.34,1.56,.64,1) .95s forwards;
  }
  #intro .marca{
    color:#fff; font-size:26px; font-weight:800; letter-spacing:.42em; text-indent:.42em;
    opacity:0; animation:intro-marca .6s ease-out 1.05s forwards;
  }
  @keyframes intro-trazo{ to{ stroke-dashoffset:0 } }
  @keyframes intro-flecha{ from{ opacity:0; transform:translateY(-26px) } to{ opacity:1; transform:translateY(0) } }
  @keyframes intro-nucleo{ to{ transform:scale(1) } }
  @keyframes intro-marca{ from{ opacity:0; letter-spacing:.75em } to{ opacity:1; letter-spacing:.42em } }
  @keyframes intro-salida{ to{ opacity:0; visibility:hidden } }
  @media (prefers-reduced-motion: reduce){ #intro{ display:none } }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  input,select,textarea,button{font:inherit; color:inherit}

  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; flex:0 0 auto;
  }
  .brand{display:flex; align-items:center; gap:9px; white-space:nowrap;
    background:transparent; border:0; color:inherit; font:inherit;
    padding:5px 9px; margin-left:-9px; border-radius:9px; cursor:pointer}
  .brand:hover{background:var(--col)}
  .brand:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .brand:active{transform:translateY(1px)}
  .brand .logo{transition:transform .15s ease}
  .brand:hover .logo{transform:rotate(-30deg)}
  .brand .logo{width:30px; height:30px; flex:0 0 auto}
  .brand b{font-size:17px; font-weight:800; letter-spacing:.07em}
  .brand i{font-style:normal; color:var(--muted); font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; border-left:1px solid var(--line); padding-left:9px}
  /* Con cinco pestañas la barra ya no cabe en un teléfono: se desliza en vez
     de empujar la página a lo ancho. */
  nav{display:flex; gap:2px; background:var(--col); border-radius:8px; padding:3px;
    min-width:0; max-width:100%; overflow-x:auto; scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent; border:0; border-radius:6px; padding:6px 13px;
    cursor:pointer; color:var(--muted); font-weight:600; white-space:nowrap}
  nav button:hover{color:var(--text)}
  nav button[aria-current="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
  .spacer{flex:1 1 auto}
  #estadoNube{display:inline-flex; align-items:center; gap:6px; cursor:default}
  .punto-nube{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

  .field{background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 10px}
  .field:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .field[readonly]{background:var(--col); color:var(--muted)}
  #q{min-width:200px}
  button.btn{background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); padding:7px 12px; cursor:pointer; white-space:nowrap}
  button.btn:hover{background:var(--col)}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--ink-solido)}
  button.btn.primary:hover{filter:brightness(1.08)}
  button.btn.ok{background:var(--ok); border-color:var(--ok); color:var(--ink-solido)}
  button.btn.ok:hover{filter:brightness(1.08)}
  button.btn.danger{color:var(--bad)}
  button.btn.danger:hover{background:var(--bad-soft)}
  button.btn.wa{color:#25d366}
  .ico-wa{width:18px; height:18px; display:block; margin:0 auto}
  button.btn.wa:has(.ico-wa){padding:6px 11px}
  .card-acts button.wa{display:flex; align-items:center; justify-content:center; padding:3px 0}
  .card-acts button.wa .ico-wa{width:15px; height:15px}
  button.btn.wa:hover{background:rgba(37,211,102,.12)}
  button.btn:disabled{opacity:.45; cursor:not-allowed}
  button.btn.wa:disabled{color:var(--muted); filter:grayscale(1)}
  button.btn.wa:disabled:hover{background:transparent}
  button.btn.sm{padding:3px 8px; font-size:12px}

  main{flex:1 1 auto; min-height:0; display:flex}
  .view{display:none; flex:1 1 auto; min-width:0; min-height:0}
  .view[data-on]{display:flex; flex-direction:column}

  .kpis{display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px 0; flex:0 0 auto}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; min-width:110px}
  .kpi b{display:block; font-size:17px; font-variant-numeric:tabular-nums}
  .kpi small{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em}

  .board-wrap{flex:1 1 auto; overflow-x:auto; overflow-y:hidden; padding:12px 16px 16px; min-height:0}
  #board{display:flex; gap:12px; height:100%; align-items:stretch}
  .col{background:var(--col); border-radius:10px; width:280px; flex:0 0 280px;
    display:flex; flex-direction:column; height:100%}
  .col.drop{outline:2px dashed var(--accent); outline-offset:-2px}
  .col-head{padding:10px 12px 8px; display:flex; align-items:center; gap:8px}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .col-name{font-weight:700; font-size:13px; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .count{background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:20px; padding:1px 8px; font-size:11px; font-variant-numeric:tabular-nums}
  .cards{flex:0 1 auto; overflow-y:auto; padding:0 8px 8px; display:flex; flex-direction:column; gap:8px; min-height:40px}
  .col-foot{padding:2px 8px 10px}
  .add-card{width:100%; text-align:left; background:transparent; border:1px dashed var(--line);
    color:var(--muted); border-radius:6px; padding:7px 10px; cursor:pointer}
  .add-card:hover{background:var(--panel-2); color:var(--text)}
  .empty-col{color:var(--muted); font-size:12px; text-align:center; padding:14px 6px}

  .card{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:6px; padding:9px 10px; box-shadow:var(--shadow); cursor:grab}
  .card:hover{border-color:var(--accent)}
  .card.dragging{opacity:.4}
  .card-title{font-weight:600; margin-bottom:2px; word-break:break-word}
  .card-sub{color:var(--muted); font-size:12px; word-break:break-word}
  .card-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px}
  .pill{font-size:11px; padding:1px 7px; border-radius:20px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted)}
  .pill.strong{background:var(--accent-soft); color:var(--accent); border-color:transparent}
  .pill.good{background:var(--ok-soft); color:var(--ok); border-color:transparent}
  .pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
  .card-acts{display:flex; gap:4px; margin-top:8px}
  .card-acts button{flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:4px; padding:2px 0; cursor:pointer; font-size:12px; line-height:1.6}
  .card-acts button:hover:not(:disabled){background:var(--accent); border-color:var(--accent); color:var(--ink-solido)}
  .card-acts button.wa:hover:not(:disabled){background:#25d366; border-color:#25d366; color:#fff}
  .pill.oro{background:var(--oro-suave); color:var(--oro-tinta); border-color:transparent}
  .card-acts button:disabled{opacity:.3; cursor:default}

  .table-wrap{flex:1 1 auto; overflow:auto; padding:12px 16px 16px; min-height:0}
  table.data{width:100%; border-collapse:collapse; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; overflow:hidden}
  table.data th{text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; padding:9px 10px; border-bottom:1px solid var(--line);
    background:var(--panel-2); position:sticky; top:0; z-index:1; white-space:nowrap}
  table.data td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.data tbody tr:last-child td{border-bottom:0}
  table.data tbody tr:hover{background:var(--panel-2)}
  table.data td.num, table.data th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .row-link{cursor:pointer}
  table.data tr.row-err > td{background:var(--bad-soft)}
  .field.err{border-color:var(--bad); box-shadow:0 0 0 1px var(--bad)}
  .errbox{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);
    border-radius:6px; padding:10px 13px; margin-bottom:14px; font-size:13px}
  .errbox b{display:block; margin-bottom:3px}
  .errbox ul{margin:0; padding-left:18px}
  .errbox li{margin-top:3px}
  tr.off td:not(.selcell){opacity:.45}
  .nowrap{white-space:nowrap}
  .vacio{color:var(--muted); text-align:center; padding:36px 16px}

  .overlay{position:fixed; inset:0; background:rgba(28,8,40,.6); display:flex;
    align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:50}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:640px; box-shadow:0 12px 40px rgba(28,8,40,.4)}
  .modal.wide{max-width:920px}
  .modal.doc{max-width:840px}
  .modal-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
  .modal-head h2{margin:0; font-size:16px; flex:1 1 auto}
  .modal-body{padding:16px 18px}
  .modal-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .grid .full{grid-column:1/-1}
  label.lbl{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600}
  .grid input,.grid select,.grid textarea{width:100%}
  textarea{resize:vertical; min-height:70px}
  textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px}
  .hint{color:var(--muted); font-size:12px}
  .note{background:var(--accent-soft); color:var(--text); border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:14px}
  .note.warn{background:var(--warn-soft)}
  h3.sec{margin:22px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
  h3.sec:first-child{margin-top:0}

  .subtabs{display:flex; gap:2px; background:var(--col); border-radius:8px; padding:3px; margin-bottom:16px}
  .subtabs button{flex:1; background:transparent; border:0; border-radius:6px; padding:7px 10px;
    cursor:pointer; color:var(--muted); font-weight:600}
  .subtabs button[aria-current="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
  .pane{display:none}
  .pane[data-on]{display:block}

  .act{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act-ico{width:30px; height:30px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:15px}
  .act-body{flex:1 1 auto; min-width:0}
  .act-top{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .act-asunto{font-weight:600; word-break:break-word}
  .act-meta{color:var(--muted); font-size:12px}
  .act-notas{white-space:pre-wrap; margin-top:4px; font-size:13px; word-break:break-word}
  .act-del{background:transparent; border:0; color:var(--muted); cursor:pointer; padding:0 4px; flex:0 0 auto}
  .act-del:hover{color:var(--bad)}

  .sign-pad{border:1px dashed var(--line); border-radius:8px; background:var(--panel-2);
    touch-action:none; width:100%; height:170px; display:block; cursor:crosshair}

  /* ---------- Documento (carta-convenio) ---------- */
  .doc-body{padding:30px 40px 34px; font-size:12.4px; line-height:1.5; color:#2b0d3a;
    background:#fff; position:relative; overflow:hidden}
  /* Marca de agua tipo hoja membretada: va como elemento, no como fondo CSS,
     para que también salga al imprimir. */
  .doc-agua{position:absolute; top:90px; left:0; right:0; height:840px;
    display:flex; align-items:center; justify-content:center; pointer-events:none;
    z-index:0; opacity:.05; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .doc-agua svg, .doc-agua img{width:68%; max-width:470px; height:auto; object-fit:contain}
  .doc-contenido{position:relative; z-index:1}
  .doc-logo{max-height:78px; max-width:76%; display:block; margin:0 auto 6px}
  .doc-mono{width:52px; height:52px; margin:0 auto 5px; display:block}
  .doc-wordmark{width:270px; margin:0 auto 6px}
  .doc-wordmark svg{width:100%; height:auto; display:block}
  .doc-hotel{text-align:center; border-bottom:2px solid #39104e; padding-bottom:8px; margin-bottom:3px}
  .doc-regla{height:3px; background:#b2aa6d; margin-bottom:16px}
  .doc-hotel b{font-size:15px; letter-spacing:.04em}
  .doc-hotel div{font-size:11px; color:#6f6279; margin-top:2px}
  .doc-fecha{text-align:right; margin-bottom:14px}
  .doc-dest{margin-bottom:14px}
  .doc-dest b{font-size:13px}
  .doc-body p{margin:0 0 9px; text-align:justify}
  .doc-body h2{font-size:12px; font-weight:700; letter-spacing:.05em; margin:18px 0 6px;
    text-transform:uppercase; color:#39104e; border-bottom:1px solid #e0dbe7; padding-bottom:3px}
  .doc-body table.tar{width:100%; border-collapse:collapse; margin:4px 0 8px; font-size:12px}
  .doc-body table.tar th{background:#39104e; color:#fff; text-align:left; padding:6px 9px;
    font-size:11px; letter-spacing:.02em; border:1px solid #39104e}
  .doc-body table.tar th.num, .doc-body table.tar td.num{text-align:right}
  .doc-body table.tar td{padding:6px 9px; border:1px solid #ddd6e3}
  .doc-body .inc{font-size:11.5px; color:#6d6634; white-space:pre-wrap; margin:0 0 12px;
    padding-left:9px; border-left:3px solid #b2aa6d}
  .doc-body .pol{white-space:pre-wrap; font-size:11.8px; color:#4c3b57; text-align:justify}
  .doc-body .doc-res{margin-top:7px; font-size:12.5px; line-height:1.8}
  .doc-body .doc-res i{color:#6f6279; font-style:normal; display:inline-block; width:74px}
  .doc-cols{display:flex; gap:26px}
  .doc-cols > div{flex:1; min-width:0}
  .doc-cols h3{font-size:11px; letter-spacing:.04em; margin:0 0 4px; color:#39104e; font-weight:700}
  .doc-sub{font-weight:700; margin:12px 0 4px}
  .firmas{display:flex; gap:40px; margin-top:30px}
  .firma{flex:1}
  .firma h4{margin:0 0 6px; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:#39104e}
  .firma .cv{height:62px; display:flex; align-items:flex-end; border-bottom:1px solid #39104e; margin-bottom:5px}
  .firma .cv img{max-height:60px}
  .firma .cv span{color:#a795b1; font-size:11px; padding-bottom:4px}
  .firma .lin{font-size:11.5px; line-height:1.9}
  .firma .lin i{color:#6f6279; font-style:normal; display:inline-block; width:58px}
  .firma .lin u{text-decoration:none; border-bottom:1px solid #c9bfd3; display:inline-block;
    min-width:150px; padding:0 3px}

  .estado-chip{font-size:11px; padding:2px 9px; border-radius:20px; font-weight:600; white-space:nowrap}
  .hoja + .hoja{border-top:1px dashed var(--line); margin-top:18px; padding-top:22px}
  .doc-campos{margin:4px 0 10px}
  .doc-campos div{margin:2px 0}
  .doc-campos i{font-style:normal; color:#6f6279; display:inline-block; min-width:190px}
  .doc-campos b{border-bottom:1px solid #c9bfd3; padding:0 4px; min-width:180px; display:inline-block}
  @media print{
    .hoja{page-break-after:always; padding:16mm 18mm}
    .hoja:last-child{page-break-after:auto}
    .hoja + .hoja{border-top:0; margin-top:0}
  }

  /* Sin esto el tamaño lo decide la impresora de cada quien: el mismo

const nuevoId = p => (p||"x") + Date.now().toString(36) + "-" + (++idCounter);

function cargar(){
  try{
    const raw = localStorage.getItem(STORE);
    if (raw) return sanear(JSON.parse(raw));
  }catch(e){ console.warn("No se pudo leer el almacenamiento local:", e); }

  for (const k of VIEJOS){
    try{
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.clientes) && p.clientes.length) return sanear(p);
      if (p && Array.isArray(p.deals) && p.deals.length){
        const mapa = { prospecto:"contactado", contactado:"contactado", calificado:"propuesta",
                       propuesta:"propuesta", negociacion:"negociacion", ganado:"ganado", perdido:"perdido" };
        return sanear({ clientes: p.deals.map(d => ({
          id: nuevoId("c"), empresa: d.empresa || d.nombre || "", contacto: d.contacto || "",
          telefono: d.telefono || "", email: d.email || "", ubicacion: "",
          tarifa: Number(d.monto) || 0, ejecutivo: d.responsable || "",
          estatus: mapa[d.stage] || "contactado", notas: d.notas || ""
        })) });
      }
    }catch(e){ console.warn("No se pudo migrar " + k + ":", e); }
  }
  return sanear({ clientes: clientesDemo() });
}

function sanear(s){
  s = s || {};
  const out = {
    clientes:     Array.isArray(s.clientes) ? s.clientes.map(saneaCliente) : [],
    actividades:  Array.isArray(s.actividades) ? s.actividades.map(saneaAct) : [],
    convenios:    Array.isArray(s.convenios) ? s.convenios.map(saneaConv) : [],
    huespedes:    Array.isArray(s.huespedes) ? s.huespedes.map(saneaHuesped) : [],
    habitaciones: catalogo(s.habitaciones),
    ajustes: {
      hotel:  Object.assign({}, HOTEL_DEF, (s.ajustes && s.ajustes.hotel) || {}),
      textos: Object.assign({}, TEXTOS_DEF, (s.ajustes && s.ajustes.textos) || {}),
      grupos: saneaGrupos(s.ajustes && s.ajustes.grupos),
      moneda: (s.ajustes && s.ajustes.moneda) || "MXN",
      ladaPais: (s.ajustes && s.ajustes.ladaPais) || "52"
    }
  };
  const ids = new Set(out.clientes.map(c => c.id));
  out.actividades = out.actividades.filter(a => ids.has(a.clienteId));
  out.convenios   = out.convenios.filter(c => ids.has(c.clienteId));
  return out;
}

/**
 * El catálogo por omisión salió de un solo convenio y sólo traía dos tipos.
 * Si lo guardado es exactamente ese catálogo viejo, nadie lo tocó: se
 * reemplaza por el del hotel. Un catálogo ya editado se respeta.
 */
function catalogo(guardadas){
  if (!Array.isArray(guardadas) || !guardadas.length) return HABS_DEF.map(saneaHab);
  const viejo = guardadas.length === 2 &&
    guardadas.some(h => h.nombre === "Sencilla y Doble") &&
    guardadas.some(h => h.nombre === "Care");
  return (viejo ? HABS_DEF : guardadas).map(saneaHab);
}

function saneaAct(a){

function saneaFirma(f){

function saneaConv(c){

    habitaciones:[], incluyeRecovery:false, notas:"", textos:null, grupos:null,
    estado:"borrador", firmaHotel:null, firmaEmpresa:null, createdAt:"", updatedAt:"" }, c || {});
  o.id = o.id || nuevoId("v");

  o.firmaEmpresa = saneaFirma(o.firmaEmpresa);
  o.grupos = saneaGrupos(o.grupos);

    tipoId: h.tipoId || "", codigo: h.codigo || "", nombre: h.nombre || "",
    grupo: GRUPOS.some(g => g.id === h.grupo) ? h.grupo : "deluxe",
    publica: h.publica === null || h.publica === "" || h.publica === undefined ? null : Number(h.publica) || 0,
    convenio: Number(h.convenio) || 0
  }));
  return o;
}

function saneaHuesped(g){
  const o = Object.assign({ id:"", nombre:"", apellidos:"", reservacion:"", llegada:"", salida:"",
    noches:"", email:"", telefono:"", empresa:"", notas:"", createdAt:"", enviado:null }, g || {});
  o.id = o.id || nuevoId("g");
  delete o.habitacion;   // versiones anteriores la guardaban
  o.noches = o.noches === "" || o.noches == null ? "" : Math.max(0, Math.round(Number(o.noches) || 0));
  o.enviado = saneaEnvio(o.enviado);
  return o;
}

/**
 * Constancia de que la carta salió: cuándo, por dónde y desde qué cuenta.
 *
 * Ojo con lo que esto significa de verdad: la aplicación abre el correo o
 * WhatsApp, pero no puede asomarse a ver si el mensaje se mandó o si la
 * persona se arrepintió a media captura. Así que la marca dice "de aquí salió
 * la carta", no "el huésped ya la tiene", y por eso se puede desmarcar a mano.
 */
function saneaEnvio(e){
  if (!e || !e.fecha) return null;
  return { fecha: e.fecha, via: e.via === "whatsapp" ? "whatsapp" : "correo", quien: e.quien || "" };
}

/** El archivo trae nombre y apellidos por separado; la carta los une. */
const nombreCompleto = g => [g.nombre, g.apellidos].map(x => String(x || "").trim()).filter(Boolean).join(" ");

/** Noches capturadas, o las que dan las fechas. */
function nochesDe(g){
  if (g.noches !== "" && g.noches != null) return Number(g.noches);
  if (!g.llegada || !g.salida) return "";
  const d = Math.round((new Date(g.salida + "T00:00:00") - new Date(g.llegada + "T00:00:00")) / 864e5);
  return isNaN(d) || d < 0 ? "" : d;
}

function saneaHab(h){
  const o = Object.assign({ id:"", codigo:"", nombre:"", grupo:"deluxe", publica:null }, h || {});
  o.id = o.id || nuevoId("h");

  o.publica = (o.publica === null || o.publica === "" || o.publica === undefined) ? null : (Number(o.publica) || 0);
  return o;
}

function saneaGrupos(g){
  const out = {};
  for (const k of Object.keys(GRUPOS_DEF))
    out[k] = Object.assign({}, GRUPOS_DEF[k], (g && g[k]) || {});
  return out;
}

/* ==========================================================================
   NUBE: la misma cartera desde cualquier equipo

   El navegador sigue siendo la copia de trabajo —la aplicación abre al
   instante y funciona sin señal— y encima va una sincronización contra
   Supabase. Se sincroniza por entidad: cada cliente, actividad, convenio o
   huésped es una fila, así que dos personas pueden trabajar a la vez mientras
   no toquen el mismo registro.

   Se consulta por sondeo en lugar de websockets: para un equipo de este
   tamaño la diferencia no se nota y evita mantener una conexión viva y su
   protocolo. El sondeo se detiene mientras haya un formulario abierto, para
   no cambiarle los datos a alguien que está capturando.
   ========================================================================== */

const NUBE_CFG    = "crm-hotel-nube";
const NUBE_SESION = "crm-hotel-sesion";
const SONDEO_MS   = 15000;

let nube = { url:"", anon:"", sesion:null, estado:"local", ultimo:"", timer:null, pendiente:null };
let sincronizado = new Map();     // id de fila -> JSON ya confirmado en la nube

const nubeActiva = () => !!(nube.url && nube.anon && nube.sesion);

/**
 * Supabase enseña la dirección del proyecto en varios lados y no siempre igual:
 * en Settings sale limpia, pero en la pantalla de la API sale ya con /rest/v1/
 * pegado. La aplicación arma esas rutas por su cuenta, así que aquí se recorta
 * lo que sobre en vez de dejar que el usuario adivine cuál de las dos era.
 */
const normalizaUrlNube = u =>
  String(u || "").trim()
    .replace(/\/+$/, "")
    .replace(/\/(rest|auth|storage|realtime|functions)\/v\d+$/i, "")
    .replace(/\/+$/, "");
const correoSesion = () => (nube.sesion && nube.sesion.user && nube.sesion.user.email) || "";

function cargarNube(){
  try{
    const c = JSON.parse(localStorage.getItem(NUBE_CFG) || "{}");
    nube.url = normalizaUrlNube(c.url);
    nube.anon = c.anon || "";
  }catch(e){}
  try{ nube.sesion = JSON.parse(localStorage.getItem(NUBE_SESION) || "null"); }catch(e){}
}

function guardarNubeCfg(){
  try{ localStorage.setItem(NUBE_CFG, JSON.stringify({ url:nube.url, anon:nube.anon })); }catch(e){}
}
function guardarSesion(){
  try{
    if (nube.sesion) localStorage.setItem(NUBE_SESION, JSON.stringify(nube.sesion));
    else localStorage.removeItem(NUBE_SESION);
  }catch(e){}
}

/** Llamada a la API con la llave y el token; renueva el token si caducó. */
async function api(ruta, opciones = {}, reintento = true){
  // Una sesión sin token se renueva antes de preguntar. Si no, la petición
  // sale como anónima y el servidor contesta una lista vacía —no un error—,
  // así que la aplicación creería que la nube se quedó sin datos.
  if (reintento && nube.sesion && !nube.sesion.access_token && nube.sesion.refresh_token)
    await renovarSesion();

  const h = Object.assign({
    "apikey": nube.anon,
    "Content-Type": "application/json"
  }, opciones.headers || {});
  if (nube.sesion && nube.sesion.access_token) h["Authorization"] = "Bearer " + nube.sesion.access_token;

  const r = await fetch(nube.url + ruta, Object.assign({}, opciones, { headers: h }));
  if (r.status === 401 && reintento && nube.sesion && nube.sesion.refresh_token){
    if (await renovarSesion()) return api(ruta, opciones, false);
  }
  if (!r.ok){
    let detalle = "";
    try{ const j = await r.json(); detalle = j.message || j.error_description || j.error || JSON.stringify(j); }
    catch(e){ detalle = await r.text().catch(() => ""); }
    throw new Error(`${r.status} · ${detalle || "sin detalle"}`);
  }
  // Al insertar con "return=minimal" el cuerpo viene vacío —a veces con 201,
  // a veces con 204—, así que no se puede pedir JSON a ciegas.
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

async function renovarSesion(){
  try{
    const r = await fetch(nube.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: nube.sesion.refresh_token })
    });
    if (!r.ok) return false;
    nube.sesion = await r.json();
    guardarSesion();
    return true;
  }catch(e){ return false; }
}

/**
 * Traduce lo que contesta el servidor de cuentas.
 *
 * Antes, cualquier fallo se anunciaba como "correo o contraseña incorrectos",
 * y eso mandaba a la gente a reescribir una contraseña que estaba bien cuando
 * lo que faltaba era confirmar la cuenta o corregir la dirección del proyecto.
 * Cada caso tiene que decir qué hacer.
 */
function errorDeEntrada(estado, j, crudo){
  const codigo = String(j.error_code || j.code || j.error || "").toLowerCase();
  const texto  = String(j.msg || j.message || j.error_description || "").toLowerCase();

  if (codigo.includes("email_not_confirmed") || texto.includes("not confirmed"))
    return "La cuenta existe pero está sin confirmar. En Supabase, Authentication → Users, " +
           "bórrala y vuelve a crearla marcando «Auto Confirm User».";
  if (codigo.includes("invalid_credentials") || codigo.includes("invalid_grant") ||
      texto.includes("invalid login"))
    return "Correo o contraseña incorrectos. Si estás seguro de la contraseña, cámbiala en " +
           "Supabase: Authentication → Users → los tres puntos del usuario → Reset password.";
  if (codigo.includes("user_banned")) return "Esa cuenta está bloqueada en Supabase.";
  if (estado === 429)
    return "Demasiados intentos seguidos. Espera un minuto y vuelve a probar.";
  if (estado === 401 || codigo.includes("no api key") || texto.includes("api key"))
    return "La llave pública no corresponde a este proyecto. Revísala en Ajustes → Nube y equipo.";
  if (estado === 404)
    return `La dirección del proyecto no responde a las cuentas (${esc(nube.url)}/auth/v1). ` +
           "Revisa que sea la de tu proyecto, sin nada pegado al final.";

  // Nada conocido: mejor enseñar lo que llegó que inventar un diagnóstico.
  const detalle = (j.msg || j.message || j.error_description || crudo || "").slice(0, 300);
  return `El servidor contestó ${estado}${detalle ? ": " + detalle : " sin explicación"}.`;
}

/* ----- Alta de un equipo nuevo sin dictar nada ----- */

const b64url = t => btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const deB64url = t => atob(t.replace(/-/g, "+").replace(/_/g, "/")
  .padEnd(Math.ceil(t.length / 4) * 4, "="));

/**
 * Una liga que ya trae dentro la dirección y la llave.
 *
 * Va en el fragmento —después del #— a propósito: esa parte no se manda al
 * servidor, así que la llave no queda escrita en los registros de quien
 * hospeda la página. Y al abrirla se borra de la barra de direcciones antes de
 * que alcance a colarse en el historial o en un favorito.
 */
const ligaInvitacion = () =>
  location.origin + location.pathname + "#nube=" +
  b64url(JSON.stringify({ u: nube.url, k: nube.anon }));

function aplicarInvitacion(){
  const m = String(location.hash || "").match(/[#&]nube=([A-Za-z0-9_-]+)/);
  if (!m) return;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}

  let cfg = null;
  try{ cfg = JSON.parse(deB64url(m[1])); }catch(e){}
  const url  = normalizaUrlNube(cfg && cfg.u);
  const anon = String((cfg && cfg.k) || "").trim();
  if (!url || !anon){
    alert("La liga de configuración llegó incompleta.\n\n" +
          "Suele pasar cuando se corta al copiarla o al mandarla por mensaje. " +
          "Pide que te la manden otra vez.");
    return;
  }
  if (nube.url && (nube.url !== url || nube.anon !== anon)){
    if (!confirm("Este equipo ya estaba conectado a otro servidor.\n\n" +
                 "¿Cambiarlo por el de esta liga? Tendrás que volver a entrar.")) return;
    nube.sesion = null;
    guardarSesion();
  }
  nube.url = url;
  nube.anon = anon;
  nube.ultimo = "";
  guardarNubeCfg();
}

/** Deja la liga en el portapapeles, o a la vista si el navegador no deja. */
async function copiarInvitacion(){
  if (!/^https?:$/.test(location.protocol)){
    alert("Esta liga sólo sirve desde la dirección publicada del CRM.\n\n" +
          "Ábrelo desde su dirección de internet, no desde el archivo guardado en el equipo.");
    return;
  }
  const liga = ligaInvitacion();
  try{
    await navigator.clipboard.writeText(liga);
    alert("Liga copiada.\n\nMándala por WhatsApp o correo a quien vaya a usar el CRM. " +
          "Al abrirla, su equipo queda configurado y sólo le pedirá su correo y contraseña.\n\n" +
          "Ojo: quien la reciba puede conectarse al servidor, así que mándala nada más a los del equipo.");
  }catch(e){
    prompt("Copia esta liga y mándala a quien vaya a usar el CRM:", liga);
  }
}

/* ----- Diagnóstico ----- */

/** Lee lo que la llave lleva escrito dentro. No la valida: sólo la traduce. */
function leerLlave(anon){
  try{
    const p = anon.split(".")[1];
    const j = JSON.parse(atob(p.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(p.length/4)*4, "=")));
    return { ref:j.ref || "", rol:j.role || "", vence:j.exp ? new Date(j.exp*1000) : null };
  }catch(e){ return null; }
}

const refDeUrl = url => (String(url).match(/^https:\/\/([^.]+)\.supabase\./i) || [])[1] || "";

/**
 * Revisa la conexión paso por paso y dice en cuál se rompe.
 *
 * Cuando algo falla al entrar, el usuario no tiene modo de saber si el
 * problema es su contraseña, la llave, la dirección o una tabla que nunca se
 * creó: todo se ve igual desde la pantalla de entrada. Peor todavía si hay
 * dos proyectos en la misma cuenta, porque la dirección de uno con la llave
 * del otro parece bien escrita y nunca va a funcionar. Aquí se comprueba cada
 * cosa por separado.
 */
async function probarNube(url, anon){
  const pasos = [];
  const anota = (ok, titulo, detalle) => pasos.push({ ok, titulo, detalle });

  const llave = leerLlave(anon);
  if (!llave){
    anota(false, "La llave no se entiende",
      "No parece una llave de Supabase. Cópiala completa de Project Settings → API, " +
      "renglón «anon public», sin cortarla.");
    return pasos;
  }
  anota(true, "La llave se lee bien", `Es del proyecto <b>${esc(llave.ref)}</b>, permiso <b>${esc(llave.rol)}</b>.`);

  if (llave.rol !== "anon")
    anota(false, `Esa llave no es la pública, es «${esc(llave.rol)}»`,
      llave.rol === "service_role"
        ? "<b>La service_role salta todos los permisos y no debe ir dentro de una página.</b> " +
          "Bórrala de aquí y, por seguridad, revócala en Supabase. Usa la que dice «anon public»."
        : "Usa la que dice «anon public».");

  if (llave.vence && llave.vence < new Date())
    anota(false, "La llave caducó", `Venció el ${esc(fechaCorta(llave.vence.toISOString()))}. Genera una nueva en Supabase.`);

  // Sólo se pueden comparar cuando la dirección es la que reparte Supabase.
  // Quien lo tenga en servidor propio usa su dominio, y eso es legítimo: ahí
  // la comparación no aplica y son las pruebas de abajo las que hablan.
  const refUrl = refDeUrl(url);
  if (!refUrl)
    anota(true, "Dirección propia",
      `No es una de <code>supabase.co</code>, así que no se puede comparar con la llave ` +
      `(que es del proyecto <b>${esc(llave.ref)}</b>).`);
  else if (refUrl !== llave.ref)
    anota(false, "La dirección y la llave son de proyectos distintos",
      `La dirección apunta a <b>${esc(refUrl)}</b> y la llave es de <b>${esc(llave.ref)}</b>. ` +
      "Con dos proyectos en la misma cuenta es fácil mezclarlos. Toma los dos datos de la " +
      "misma pantalla: Project Settings → API del proyecto que quieras usar.");
  else
    anota(true, "La dirección y la llave son del mismo proyecto", esc(refUrl));

  // Servicio de cuentas
  try{
    const r = await fetch(url + "/auth/v1/settings", { headers:{ apikey:anon } });
    if (r.ok){
      const j = await r.json().catch(() => ({}));
      const correoOn = !j.external || j.external.email !== false;
      anota(true, "El servicio de cuentas responde",
        correoOn ? "Acepta entrar con correo y contraseña."
                 : "<b>Pero tiene apagado el acceso por correo.</b> Enciéndelo en " +
                   "Authentication → Sign In / Providers → Email.");
      if (!correoOn) pasos[pasos.length-1].ok = false;
    } else {
      anota(false, `El servicio de cuentas contestó ${r.status}`,
        r.status === 401 ? "La llave no vale para este proyecto."
                         : "Revisa que la dirección sea la del proyecto.");
    }
  }catch(e){
    anota(false, "No se pudo contactar al servicio de cuentas",
      "Sin internet, o la dirección está mal escrita.");
  }

  // La tabla
  try{
    const r = await fetch(url + "/rest/v1/crm_datos?select=id&limit=1", { headers:{ apikey:anon } });
    if (r.ok) anota(true, "La tabla crm_datos existe", "El nube.sql ya se corrió en este proyecto.");
    else {
      const t = await r.text();
      anota(false, `La tabla no responde (${r.status})`,
        /does not exist|not find the table|schema cache/i.test(t)
          ? "<b>Falta correr el <code>nube.sql</code> en este proyecto.</b> " +
            "Ábrelo en el SQL Editor, pégalo completo y dale Run."
          : esc(t.slice(0, 200)));
    }
  }catch(e){
    anota(false, "No se pudo consultar la tabla", esc(e.message));
  }

  return pasos;
}

async function entrar(correo, contrasena){
  let r;
  try{
    r = await fetch(nube.url + "/auth/v1/token?grant_type=password", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ email: String(correo).trim(), password: contrasena })
    });
  }catch(e){
    throw new Error("No se pudo contactar al servidor. Revisa tu internet y que la dirección " +
                    `del proyecto esté bien escrita (${esc(nube.url)}).`);
  }
  const crudo = await r.text();
  let j = {};
  try{ j = JSON.parse(crudo); }catch(e){}
  if (!r.ok) throw new Error(errorDeEntrada(r.status, j, crudo));
  if (!j.access_token) throw new Error("El servidor respondió sin sesión. Vuelve a intentar.");
  nube.sesion = j;
  guardarSesion();
}

function salir(){
  nube.sesion = null;
  guardarSesion();
  detenerSondeo();
  nube.estado = "local";
  render();
  pantallaEntrada();
}

/* ----- Traducción entre el estado y las filas de la tabla ----- */

const COLECCIONES = ["clientes","actividades","convenios","huespedes","habitaciones"];

function filasDeEstado(){
  const filas = [];
  for (const tipo of COLECCIONES)
    for (const o of state[tipo]) filas.push({ id: tipo + ":" + o.id, tipo, datos: o });
  filas.push({ id:"ajustes:global", tipo:"ajustes", datos: state.ajustes });
  return filas;
}

function estadoDesdeFilas(filas){
  const bruto = { clientes:[], actividades:[], convenios:[], huespedes:[], habitaciones:[], ajustes:null };
  for (const f of filas){
    if (f.tipo === "ajustes") bruto.ajustes = f.datos;
    else if (bruto[f.tipo]) bruto[f.tipo].push(f.datos);
  }
  if (!bruto.ajustes) delete bruto.ajustes;
  return sanear(bruto);
}

function marcarSincronizado(filas){
  sincronizado = new Map(filas.map(f => [f.id, JSON.stringify(f.datos)]));
}

/* ----- Bajada y subida ----- */

async function bajar(desde){
  const filtro = desde ? `&actualizado=gt.${encodeURIComponent(desde)}` : "";
  const filas = await api(`/rest/v1/crm_datos?select=id,tipo,datos,actualizado,borrado${filtro}`);
  return filas || [];
}

async function subir(cambios, borrados){
  if (cambios.length){
    await api("/rest/v1/crm_datos?on_conflict=id", {
      method:"POST",
      headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(cambios.map(f => ({
        id:f.id, tipo:f.tipo, datos:f.datos, borrado:false,
        actualizado:new Date().toISOString(), actualizado_por: correoSesion()
      })))
    });
  }
  // Un borrado se marca en vez de eliminar la fila: si no, los demás equipos
  // nunca se enterarían de que desapareció.
  if (borrados.length){
    await api("/rest/v1/crm_datos?on_conflict=id", {
      method:"POST",
      headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(borrados.map(id => ({
        id, tipo:String(id).split(":")[0], datos:{}, borrado:true,
        actualizado:new Date().toISOString(), actualizado_por: correoSesion()
      })))
    });
  }
}

function programarSubida(){
  if (!nubeActiva()) return;
  clearTimeout(nube.pendiente);
  nube.pendiente = setTimeout(() => sincronizar().catch(() => {}), 400);
}

let sincronizando = false;
async function sincronizar(){
  if (!nubeActiva() || sincronizando) return;
  sincronizando = true;
  try{
    nube.estado = "sincronizando"; pintarNube();

    // Primero lo de los demás, luego lo propio: así una edición local reciente
    // gana sobre una copia remota vieja del mismo registro.
    const remotas = await bajar(nube.ultimo);
    if (remotas.length){
      const porId = new Map(filasDeEstado().map(f => [f.id, f]));
      const aplicadas = [];
      for (const r of remotas){
        nube.ultimo = !nube.ultimo || r.actualizado > nube.ultimo ? r.actualizado : nube.ultimo;
        const local = porId.get(r.id);
        const mismoQueSincronizado = local && sincronizado.get(r.id) === JSON.stringify(local.datos);
        if (local && !mismoQueSincronizado) continue;   // hay edición local sin subir: no se pisa
        if (r.borrado) porId.delete(r.id);
        else porId.set(r.id, { id:r.id, tipo:r.tipo, datos:r.datos });
        aplicadas.push(r);
      }
      if (aplicadas.length){
        state = estadoDesdeFilas([...porId.values()]);
        try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
        // Se dan por sincronizadas SÓLO las filas que acaban de llegar. Marcar
        // todas de golpe daba por subido lo que este equipo aún no manda, y el
        // registro recién capturado se quedaba para siempre en esta máquina.
        const llegaron = new Set(aplicadas.map(r => r.id));
        for (const f of filasDeEstado())
          if (llegaron.has(f.id)) sincronizado.set(f.id, JSON.stringify(f.datos));
        for (const r of aplicadas)
          if (r.borrado) sincronizado.delete(r.id);
        render();
      }
    }

    const actuales = filasDeEstado();
    const cambios = actuales.filter(f => sincronizado.get(f.id) !== JSON.stringify(f.datos));
    const vivos = new Set(actuales.map(f => f.id));
    const borrados = [...sincronizado.keys()].filter(id => !vivos.has(id));
    if (cambios.length || borrados.length){
      await subir(cambios, borrados);
      marcarSincronizado(actuales);
    }

    nube.estado = "listo";
    nube.sincronizadoEn = new Date().toISOString();
  }catch(e){
    nube.estado = "error";
    nube.error = e.message;
    console.warn("Sincronización:", e.message);
  }finally{
    sincronizando = false;
    pintarNube();
  }
}

/* ----- Sondeo ----- */

function arrancarSondeo(){
  detenerSondeo();
  nube.timer = setInterval(() => {
    // Con un formulario abierto no se toca el estado: alguien está capturando.
    if (document.querySelector(".overlay")) return;
    sincronizar().catch(() => {});
  }, SONDEO_MS);
}
function detenerSondeo(){ clearInterval(nube.timer); nube.timer = null; }

/* ----- Primer enlace: el momento delicado ----- */

async function primeraSincronizacion(){
  const remotas = (await bajar()).filter(f => !f.borrado);
  const hayLocal = state.clientes.length || state.convenios.length || state.huespedes.length;

  if (!remotas.length){
    if (!hayLocal){ marcarSincronizado([]); return; }
    if (!confirm(`La nube está vacía y este equipo tiene ${state.clientes.length} cliente(s).\n\n` +
                 "¿Subir los datos de este equipo para que sean los de todo el hotel?")){
      throw new Error("Enlace cancelado: la nube quedó vacía.");
    }
    marcarSincronizado([]);          // todo se verá como cambio y subirá
    await sincronizar();
    return;
  }

  if (hayLocal){
    if (!confirm(`La nube ya tiene ${remotas.filter(f => f.tipo === "clientes").length} cliente(s).\n\n` +
                 "Este equipo adoptará esos datos y los suyos locales se reemplazarán.\n" +
                 "Si tenías capturas sin subir, expórtalas antes.\n\n¿Continuar?")) {
      throw new Error("Enlace cancelado.");
    }
  }
  state = estadoDesdeFilas(remotas);
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  marcarSincronizado(filasDeEstado());
  for (const r of remotas)
    nube.ultimo = !nube.ultimo || r.actualizado > nube.ultimo ? r.actualizado : nube.ultimo;
  render();
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoyISO = () => new Date().toISOString().slice(0,10);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const money = n => new Intl.NumberFormat("es-MX",
  { style:"currency", currency: (state && state.ajustes && state.ajustes.moneda) || "MXN",
    maximumFractionDigits:2, minimumFractionDigits:2 }).format(Number(n)||0);

/** "$2,800.00 MN", como en la carta original. */

function fechaTexto(iso){
  if (!iso) return "";
  const d = new Date(iso.slice(0,10) + "T00:00:00");
  if (isNaN(d)) return iso;
  return `${d.getDate()} de ${MESES[d.getMonth()]} del ${d.getFullYear()}`;
}
function fechaCorta(iso){
  if (!iso) return "—";
  const d = new Date((iso.length <= 10 ? iso + "T00:00:00" : iso));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" });
}
function fechaHora(iso){
  if (!iso) return "—";
  const d = new Date((iso.length <= 10 ? iso + "T00:00:00" : iso));
  if (isNaN(d)) return iso;
  return d.toLocaleString("es-MX", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
/** Fecha en el formato de las firmas de la carta: 18 – 08- 2026 */
function fechaFirma(iso){
  if (!iso) return "";
  const d = new Date(iso.slice(0,10) + "T00:00:00");
  if (isNaN(d)) return iso.slice(0,10);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())} – ${p(d.getMonth()+1)} – ${d.getFullYear()}`;
}

/**
 * Lee montos escritos como sea: "$120,000.50", "1.250.000", "89500,75", "(1,200)".
 * El último separador es decimal sólo si deja 1 o 2 dígitos detrás; si deja 3 o
 * más es separador de miles. Sirve igual para formato latino y anglosajón.
 */
function parseMoney(v){
  if (v == null || v === "") return 0;
  if (typeof v === "number") return v;
  const src = String(v).trim();
  const neg = src.includes("-") || /^\(.*\)$/.test(src);
  let s = src.replace(/[^\d.,]/g, "");
  if (!s) return 0;
  const sep = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  if (sep > -1){
    const dec = s.length - sep - 1;
    s = (dec >= 1 && dec <= 2)
      ? s.slice(0, sep).replace(/[.,]/g, "") + "." + s.slice(sep + 1)
      : s.replace(/[.,]/g, "");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -Math.abs(n) : n);
}

/** Acepta 2026-09-04, 04/09/2026, 4-9-26 y los seriales de Excel. */
function parseDate(v){
  if (!v) return "";
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if (/^\d{5}$/.test(s)) return new Date(Date.UTC(1899,11,30) + Number(s)*864e5).toISOString().slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m){
    let [,a,b,y] = m;
    if (y.length === 2) y = "20" + y;
    let dd = +a, mm = +b;
    if (mm > 12 && dd <= 12){ const t = dd; dd = mm; mm = t; }
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
    return `${y}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  }
  const d = new Date(s);
  return isNaN(d) ? "" : d.toISOString().slice(0,10);
}

function matchEstatus(v){
  const s = String(v || "").trim().toLowerCase();
  if (!s) return "contactado";
  const hit = ESTATUS.find(e => e.id === s || e.name.toLowerCase() === s);
  if (hit) return hit.id;
  const reglas = [
    [/gan[oa]|won|cerrad[oa]\s*gan|exito|éxito|firmad/, "ganado"],
    [/perd|lost|cancel|rechaz|declin|no\s*interes/, "perdido"],
    [/cotiz.*enviad|enviad.*cotiz|propuesta\s*enviad/, "cotizacion_enviada"],
    [/negoc|cierre/, "negociacion"],
    [/propuesta|cotiz|oferta|proposal|quote/, "propuesta"],
    [/contact|seguimiento|llamad|prospec|nuevo|lead|inicial/, "contactado"]
  ];
  for (const [re, id] of reglas) if (re.test(s)) return id;
  return "contactado";
}

/** Sustituye los marcadores de los textos de la carta. */
function vars(txt, conv, cli){
  const vig = textoVigencia(conv);
  const anio = (conv.vigenciaHasta || conv.fecha || hoyISO()).slice(0,4);
  return String(txt || "")
    .replace(/\{\{HOTEL\}\}/g,    state.ajustes.hotel.nombre)
    .replace(/\{\{EMPRESA\}\}/g,  (cli && cli.empresa) || "")
    .replace(/\{\{CONTACTO\}\}/g, (cli && cli.contacto) || "")
    .replace(/\{\{VIGENCIA\}\}/g, vig)

function textoVigencia(v){
  const d = v.vigenciaDesde, h = v.vigenciaHasta;
  if (d && h) return `a partir del ${fechaTexto(d)} y hasta el ${fechaTexto(h)}`;
  if (h)      return `a partir de hoy y hasta el ${fechaTexto(h)}`;
  if (d)      return `a partir del ${fechaTexto(d)}`;
  return "según lo acordado";
}

/* ----- CSV ----- */

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const nl = text.indexOf("\n");
  const head = text.slice(0, nl === -1 ? text.length : nl);
  const delim = (head.match(/\t/g)||[]).length > (head.match(/,/g)||[]).length ? "\t"
              : (head.match(/;/g)||[]).length > (head.match(/,/g)||[]).length ? ";" : ",";
  const filas = []; let fila = [], celda = "", comillas = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (comillas){
      if (c === '"'){ if (text[i+1] === '"'){ celda += '"'; i++; } else comillas = false; }
      else celda += c;
      continue;
    }
    if (c === '"') comillas = true;
    else if (c === delim){ fila.push(celda); celda = ""; }
    else if (c === "\n"){ fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else if (c !== "\r") celda += c;
  }
  if (celda !== "" || fila.length){ fila.push(celda); filas.push(fila); }
  return filas.filter(f => f.some(c => String(c).trim() !== ""));
}

const toCSV = filas => filas.map(f => f.map(c => {
  const s = String(c ?? "");
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}).join(",")).join("\r\n");

function descargar(nombre, contenido, mime){
  const blob = new Blob(["\uFEFF" + contenido], { type: (mime||"text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/**
 * Adivina qué columna del archivo corresponde a cada campo. Primero resuelve
 * TODAS las coincidencias exactas y luego las parciales, para que una parcial
 * de otro campo no se lleve una columna que alguien más nombra igualito.
 */
function autoMapear(campos, heads){
  const norm = x => String(x).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
  const hN = heads.map(norm);
  const cands = f => [f.label, f.key, ...(f.aliases || [])].map(norm).filter(Boolean);
  const usados = new Set(), hallado = {};

  for (const f of campos){
    const cs = cands(f);
    for (let i = 0; i < hN.length; i++){
      if (usados.has(i) || !hN[i]) continue;
      if (cs.includes(hN[i])){ hallado[f.key] = i; usados.add(i); break; }
    }
  }
  for (const f of campos){
    if (hallado[f.key] != null) continue;
    const cs = cands(f).filter(x => x.length > 3);
    for (let i = 0; i < hN.length; i++){
      if (usados.has(i) || hN[i].length < 3) continue;
      if (cs.some(x => hN[i].includes(x) || x.includes(hN[i]))){ hallado[f.key] = i; usados.add(i); break; }
    }
  }
  return hallado;
}

/* ----- Lectura de .xlsx -----
   Un .xlsx es un ZIP con XML dentro. Se lee el directorio central, se sacan
   sólo la primera hoja y las cadenas compartidas, y se inflan con
   DecompressionStream, que traen los navegadores modernos. Así no hace falta
   ninguna librería externa. */

async function inflar(datos){
  if (typeof DecompressionStream !== "function")
    throw new Error("Este navegador no puede descomprimir archivos .xlsx.\n\n" +
                    "Guarda la hoja como CSV (Archivo → Guardar como → CSV) y súbela así.");
  const flujo = new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Response(flujo).text();
}

async function abrirZip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("El archivo no parece un .xlsx válido.");

  const total = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const salida = {};
  for (let k = 0; k < total; k++){
    if (off + 46 > buf.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const metodo   = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nLen = dv.getUint16(off + 28, true);
    const eLen = dv.getUint16(off + 30, true);
    const cLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const nombre = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nLen));
    off += 46 + nLen + eLen + cLen;
    if (!/^xl\/(worksheets\/sheet\d+|sharedStrings)\.xml$/.test(nombre)) continue;

    const lnLen = dv.getUint16(local + 26, true);
    const leLen = dv.getUint16(local + 28, true);
    const ini = local + 30 + lnLen + leLen;
    const datos = buf.subarray(ini, ini + compSize);
    salida[nombre] = metodo === 0 ? new TextDecoder().decode(datos) : await inflar(datos);
  }
  return salida;
}

/** "C7" -> 2. Hace falta porque Excel omite las celdas vacías. */
function columnaDe(ref){
  const m = /^([A-Z]+)/.exec(String(ref || ""));
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

async function leerXLSX(archivo){
  const partes = await abrirZip(new Uint8Array(await archivo.arrayBuffer()));
  const dp = new DOMParser();

  let cadenas = [];
  if (partes["xl/sharedStrings.xml"]){
    const sd = dp.parseFromString(partes["xl/sharedStrings.xml"], "application/xml");
    cadenas = [...sd.getElementsByTagName("si")].map(si =>
      [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  }

  const hoja = Object.keys(partes).filter(n => /worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if (!hoja) throw new Error("El archivo no trae ninguna hoja de cálculo.");
  const doc = dp.parseFromString(partes[hoja], "application/xml");
  if (doc.getElementsByTagName("parsererror").length)
    throw new Error("No se pudo leer la hoja de cálculo.");

  const filas = [];
  for (const row of doc.getElementsByTagName("row")){
    const celdas = [];
    for (const c of row.getElementsByTagName("c")){
      const col = columnaDe(c.getAttribute("r"));
      const t = c.getAttribute("t");
      let v = "";
      if (t === "inlineStr") v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      else {
        const ve = c.getElementsByTagName("v")[0];
        v = ve ? ve.textContent : "";
        if (t === "s") v = cadenas[Number(v)] ?? "";
      }
      celdas[col] = v;
    }
    for (let i = 0; i < celdas.length; i++) if (celdas[i] === undefined) celdas[i] = "";
    filas.push(celdas);
  }
  return filas.filter(f => f.some(c => String(c).trim() !== ""));
}

/* ==========================================================================
   GENERACIÓN DE PDF EN EL NAVEGADOR

   Ni mailto: ni wa.me admiten adjuntos: sólo transportan texto. La única vía
   para mandar el archivo junto con el mensaje es navigator.share() con un
   File, así que hace falta un PDF de verdad hecho aquí mismo.

   Se hace en dos pasos: la hoja se rasteriza tal como se ve —vía un
   foreignObject de SVG, que no necesita ninguna librería— y esa imagen se
   envuelve en un PDF mínimo. El resultado es fiel al documento impreso
   porque es literalmente el mismo render; a cambio, su texto no es
   seleccionable.
   ========================================================================== */

const PT_ANCHO = 612, PT_ALTO = 792;      // carta en puntos PostScript
const PX_ANCHO = 816, PX_ALTO = 1056;     // la misma carta a 96 dpi
const ESCALA_PDF = 2;                     // para que no se vea pixelado

/** Convierte un elemento del documento en un JPEG del tamaño de una hoja carta. */
function rasterizarHoja(el){
  return new Promise((resolve, reject) => {
    // Dentro del SVG el medio es "pantalla", así que las reglas de @media print
    // no aplican: la sangría de la hoja se pone aquí a mano.
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    // La hoja se vuelve a colgar de un .doc-body real: los estilos de la carta
    // son selectores descendentes de él, y sin ese ancestro se pierden.
    const clon = el.cloneNode(true);
    clon.style.cssText = "position:relative;border:0;margin:0;padding:0";

    const papel = document.createElement("div");
    papel.className = "doc-body";
    papel.style.cssText = "width:100%;height:100%;padding:16mm 18mm;margin:0;" +
      "box-sizing:border-box;background:#fff;overflow:hidden";
    papel.appendChild(clon);

    const envoltura = document.createElement("div");
    envoltura.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    envoltura.style.cssText = `width:${PX_ANCHO}px;height:${PX_ALTO}px;background:#fff;` +
      `font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    envoltura.innerHTML = `<style>${css}</style>`;
    envoltura.appendChild(papel);

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PX_ANCHO}" height="${PX_ALTO}">` +
      `<foreignObject width="100%" height="100%">` +
      new XMLSerializer().serializeToString(envoltura) + `</foreignObject></svg>`;

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = PX_ANCHO * ESCALA_PDF;
      cv.height = PX_ALTO * ESCALA_PDF;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, 0, 0, cv.width, cv.height);
      try{ resolve(cv.toDataURL("image/jpeg", 0.92)); }
      catch(e){ reject(new Error("El navegador bloqueó la conversión de la hoja a imagen.")); }
    };
    img.onerror = () => reject(new Error("Este navegador no pudo convertir la carta a imagen."));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

const base64ABytes = b64 => {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
};

/** PDF mínimo: una página tamaño carta por imagen, cada una a página completa. */
function pdfDesdeImagenes(dataUrls){
  const enc = new TextEncoder();
  const trozos = [];
  let largo = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; trozos.push(b); largo += b.length; };

  const n = dataUrls.length;
  const objetos = [];                       // desplazamiento de cada objeto
  const idPagina = i => 3 + i * 3;          // página, imagen y contenido por hoja

  push("%PDF-1.4\n");
  const obj = (num, cuerpo, flujo) => {
    objetos[num] = largo;
    push(`${num} 0 obj\n${cuerpo}\n`);
    if (flujo){ push("stream\n"); push(flujo); push("\nendstream\n"); }
    push("endobj\n");
  };

  obj(1, `<< /Type /Catalog /Pages 2 0 R >>`);
  obj(2, `<< /Type /Pages /Kids [${dataUrls.map((_,i) => `${idPagina(i)} 0 R`).join(" ")}] /Count ${n} >>`);

  dataUrls.forEach((url, i) => {
    const bytes = base64ABytes(url.split(",")[1]);
    const pg = idPagina(i), im = pg + 1, ct = pg + 2;
    obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PT_ANCHO} ${PT_ALTO}] ` +
            `/Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(im, `<< /Type /XObject /Subtype /Image /Width ${PX_ANCHO*ESCALA_PDF} ` +
            `/Height ${PX_ALTO*ESCALA_PDF} /ColorSpace /DeviceRGB /BitsPerComponent 8 ` +
            `/Filter /DCTDecode /Length ${bytes.length} >>`, bytes);
    const contenido = `q ${PT_ANCHO} 0 0 ${PT_ALTO} 0 0 cm /Im0 Do Q`;
    obj(ct, `<< /Length ${contenido.length} >>`, enc.encode(contenido));
  });

  const totalObj = 2 + n * 3;
  const inicioXref = largo;
  let xref = `xref\n0 ${totalObj + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= totalObj; i++)
    xref += String(objetos[i]).padStart(10, "0") + " 00000 n \n";
  push(xref);
  push(`trailer\n<< /Size ${totalObj + 1} /Root 1 0 R >>\nstartxref\n${inicioXref}\n%%EOF\n`);

  const salida = new Uint8Array(largo);
  let o = 0;
  for (const t of trozos){ salida.set(t, o); o += t.length; }
  return salida;
}

/** Nombre de archivo sin acentos ni caracteres que molesten al sistema. */
const nombreArchivo = txt => String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70);

  const espera  = convs.some(v => v.estado === "firmado_ejecutiva");
  const i = ESTATUS.findIndex(x => x.id === c.estatus);

  el.innerHTML = `
    <div class="card-title">${esc(c.empresa || "(sin empresa)")}</div>

    <div class="card-acts">

      <button class="wa" data-wa ${c.telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>
      <button data-dir="1" ${i >= ESTATUS.length-1 ? "disabled" : ""} title="Estatus siguiente">›</button>
    </div>`;

  el.addEventListener("dragstart", ev => {
    arrastrando = c.id; el.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", c.id);

  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  el.addEventListener("click", ev => {

      return;

    abrirCliente(c.id);

  return el;
