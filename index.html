<style>
  /* Identidad CORE: morado #39104e, oro #b2aa6d y blanco.
     Los tres estados con significado —logrado, pendiente y perdido— usan
     tonos derivados de esa paleta para no perder la lectura. */
  :root{
    --bg:#f2f0f5; --panel:#ffffff; --panel-2:#faf9fc; --col:#eae7ef;
    --text:#2b0d3a; --muted:#6f6279; --line:#e0dbe7;
    --accent:#39104e; --accent-soft:#efe9f4; --ink-solido:#ffffff;
    --logo-morado:#39104e;
    --oro:#b2aa6d; --oro-tinta:#6d6634; --oro-suave:#f4f2e4;
    --ok:#6d6634; --ok-soft:#f2efdf;
    /* El embudo: cuatro escalones del morado de la casa, de claro a oscuro.
       Son etapas ORDENADAS, no categorías sueltas, así que les toca una rampa
       de un solo tono y no cuatro colores distintos. Los pasos están medidos
       —no escogidos a ojo— para que se distingan entre sí y contra el papel. */
    --emb-1:#ab8fc0; --emb-2:#8258a0; --emb-3:#5a2d78; --emb-4:#39104e;
    --bad:#a33b3b; --bad-soft:#fbeaea;
    --warn:#8a5a2b; --warn-soft:#f9efe4;
    --shadow:0 1px 2px rgba(57,16,78,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#150a1c; --panel:#211029; --panel-2:#2a1734; --col:#1a0d22;
      --text:#f2ecf6; --muted:#a795b1; --line:#382544;
      --accent:#b98fd6; --accent-soft:#2e1840; --ink-solido:#1a0b23;
      --logo-morado:#cbb0de;
      --oro:#b2aa6d; --oro-tinta:#cec68c; --oro-suave:#2c2a17;
      --ok:#cec68c; --ok-soft:#2c2a17;
      --emb-1:#6b4d85; --emb-2:#8460a3; --emb-3:#9e78c0; --emb-4:#b98fd6;
      --bad:#f08b8b; --bad-soft:#331616;
      --warn:#d79a5e; --warn-soft:#33210f;
      --shadow:0 1px 2px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#150a1c; --panel:#211029; --panel-2:#2a1734; --col:#1a0d22;
    --text:#f2ecf6; --muted:#a795b1; --line:#382544;
    --accent:#b98fd6; --accent-soft:#2e1840; --ink-solido:#1a0b23;
    --logo-morado:#cbb0de;
    --oro:#b2aa6d; --oro-tinta:#cec68c; --oro-suave:#2c2a17;
    --ok:#cec68c; --ok-soft:#2c2a17;
    --emb-1:#6b4d85; --emb-2:#8460a3; --emb-3:#9e78c0; --emb-4:#b98fd6;
    --bad:#f08b8b; --bad-soft:#331616;
    --warn:#d79a5e; --warn-soft:#33210f;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }

  /* ---------- Animación de entrada ----------
     Va con pointer-events:none para no tapar nada mientras dura, y se retira
     sola del DOM. Con "reducir movimiento" activado no llega ni a mostrarse. */
  #intro{
    position:fixed; inset:0; z-index:200; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:radial-gradient(circle at 50% 45%, #4a1a63 0%, #2b0b3c 55%, #17061f 100%);
    transition:background .55s ease-out;
  }
  /* Al final el logo no se desvanece: viaja hasta el botón de inicio y se
     tiñe con los colores del encabezado, para que el relevo no se note. */
  #intro.vuelo{background:radial-gradient(circle at 50% 45%, #4a1a6300 0%, #17061f00 100%)}
  #intro svg{width:150px; height:150px; overflow:visible;
    transition:transform .8s cubic-bezier(.6,0,.3,1)}
  #intro.vuelo .marca{opacity:0; transition:opacity .3s ease-out}
  #intro.vuelo .hex{stroke:var(--logo-morado); transition:stroke .55s ease-out .2s}
  #intro.vuelo .flechas{stroke:var(--oro); transition:stroke .55s ease-out .2s}
  #intro.vuelo .nucleo{fill:var(--logo-morado); transition:fill .55s ease-out .2s}
  /* Mientras el logo va en camino, el del encabezado se oculta: si no,
     se verían dos a la vez. */
  .intro-activa .brand .logo{visibility:hidden}
  #intro .hex{
    fill:none; stroke:#b2aa6d; stroke-width:6;
    stroke-dasharray:276; stroke-dashoffset:276;
    animation:intro-trazo .75s cubic-bezier(.4,0,.2,1) .1s forwards;
  }
  #intro .fl{opacity:0; animation:intro-flecha .55s cubic-bezier(.34,1.3,.64,1) forwards}
  #intro .nucleo{
    fill:#b2aa6d; transform:scale(0); transform-origin:60px 60px;
    animation:intro-nucleo .5s cubic-bezier(.34,1.56,.64,1) .95s forwards;
  }
  #intro .marca{
    color:#fff; font-size:26px; font-weight:800; letter-spacing:.42em; text-indent:.42em;
    opacity:0; animation:intro-marca .6s ease-out 1.05s forwards;
  }
  @keyframes intro-trazo{ to{ stroke-dashoffset:0 } }
  @keyframes intro-flecha{ from{ opacity:0; transform:translateY(-26px) } to{ opacity:1; transform:translateY(0) } }
  @keyframes intro-nucleo{ to{ transform:scale(1) } }
  @keyframes intro-marca{ from{ opacity:0; letter-spacing:.75em } to{ opacity:1; letter-spacing:.42em } }
  @keyframes intro-salida{ to{ opacity:0; visibility:hidden } }
  @media (prefers-reduced-motion: reduce){ #intro{ display:none } }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  input,select,textarea,button{font:inherit; color:inherit}

  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; flex:0 0 auto;
  }
  .brand{display:flex; align-items:center; gap:9px; white-space:nowrap;
    background:transparent; border:0; color:inherit; font:inherit;
    padding:5px 9px; margin-left:-9px; border-radius:9px; cursor:pointer}
  .brand:hover{background:var(--col)}
  .brand:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .brand:active{transform:translateY(1px)}
  .brand .logo{transition:transform .15s ease}
  .brand:hover .logo{transform:rotate(-30deg)}
  .brand .logo{width:30px; height:30px; flex:0 0 auto}
  .brand b{font-size:17px; font-weight:800; letter-spacing:.07em}
  .brand i{font-style:normal; color:var(--muted); font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; border-left:1px solid var(--line); padding-left:9px}
  /* Con cinco pestañas la barra ya no cabe en un teléfono: se desliza en vez
     de empujar la página a lo ancho. */
  nav{display:flex; gap:2px; background:var(--col); border-radius:8px; padding:3px;
    min-width:0; max-width:100%; overflow-x:auto; scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent; border:0; border-radius:6px; padding:6px 13px;
    cursor:pointer; color:var(--muted); font-weight:600; white-space:nowrap}
  nav button:hover{color:var(--text)}
  nav button[aria-current="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
  .spacer{flex:1 1 auto}
  .firma-previa{background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:8px; text-align:center}
  .firma-previa img{max-height:86px; max-width:100%}
  #estadoNube{display:inline-flex; align-items:center; gap:6px; cursor:default;
    border:1px solid var(--line); font:inherit; font-size:12px}
  #estadoNube.conSesion{cursor:pointer}
  #estadoNube.conSesion:hover{background:var(--panel-2)}
  .pill.aviso{display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:0;
    background:var(--ok-soft); color:var(--ok); font-weight:600; animation:latir 2s ease-in-out 3}
  .pill.aviso:hover{filter:brightness(1.06)}
  @keyframes latir{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion: reduce){ .pill.aviso{animation:none} }
  .punto-nube{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

  .field{background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 10px}
  .field:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .field[readonly]{background:var(--col); color:var(--muted)}
  #q{min-width:200px}
  /* También `a.btn`: el aviso de la pantalla de firma ofrece avisarle al hotel
     por WhatsApp, y eso es un enlace, no un botón. Sin esto salía como un
     enlace azul subrayado en medio de un recuadro de error. */
  button.btn, a.btn{background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); padding:7px 12px; cursor:pointer; white-space:nowrap;
    text-decoration:none; display:inline-block}
  button.btn:hover, a.btn:hover{background:var(--col)}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--ink-solido)}
  button.btn.primary:hover{filter:brightness(1.08)}
  button.btn.ok{background:var(--ok); border-color:var(--ok); color:var(--ink-solido)}
  button.btn.ok:hover{filter:brightness(1.08)}
  button.btn.danger{color:var(--bad)}
  button.btn.danger:hover{background:var(--bad-soft)}
  button.btn.wa{color:#25d366}
  .ico-wa{width:18px; height:18px; display:block; margin:0 auto}
  button.btn.wa:has(.ico-wa){padding:6px 11px}
  .card-acts button.wa{display:flex; align-items:center; justify-content:center; padding:3px 0}
  .card-acts button.wa .ico-wa{width:15px; height:15px}
  button.btn.wa:hover{background:rgba(37,211,102,.12)}
  button.btn:disabled{opacity:.45; cursor:not-allowed}
  button.btn.wa:disabled{color:var(--muted); filter:grayscale(1)}
  button.btn.wa:disabled:hover{background:transparent}
  button.btn.sm{padding:3px 8px; font-size:12px}

  main{flex:1 1 auto; min-height:0; display:flex}
  .view{display:none; flex:1 1 auto; min-width:0; min-height:0}
  .view[data-on]{display:flex; flex-direction:column}

  .kpis{display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px 0; flex:0 0 auto}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; min-width:110px}
  .kpi b{display:block; font-size:17px; font-variant-numeric:tabular-nums}
  .kpi small{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em}

  .board-wrap{flex:1 1 auto; overflow-x:auto; overflow-y:hidden; padding:12px 16px 16px; min-height:0}
  #board{display:flex; gap:12px; height:100%; align-items:stretch}
  .col{background:var(--col); border-radius:10px; width:280px; flex:0 0 280px;
    display:flex; flex-direction:column; height:100%}
  .col.drop{outline:2px dashed var(--accent); outline-offset:-2px}
  .col-head{padding:10px 12px 8px; display:flex; align-items:center; gap:8px}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .col-name{font-weight:700; font-size:13px; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .count{background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:20px; padding:1px 8px; font-size:11px; font-variant-numeric:tabular-nums}
  .cards{flex:0 1 auto; overflow-y:auto; padding:0 8px 8px; display:flex; flex-direction:column; gap:8px; min-height:40px}
  .col-foot{padding:2px 8px 10px}
  .add-card{width:100%; text-align:left; background:transparent; border:1px dashed var(--line);
    color:var(--muted); border-radius:6px; padding:7px 10px; cursor:pointer}
  .add-card:hover{background:var(--panel-2); color:var(--text)}
  .empty-col{color:var(--muted); font-size:12px; text-align:center; padding:14px 6px}

  .card{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:6px; padding:9px 10px; box-shadow:var(--shadow); cursor:grab}
  .card:hover{border-color:var(--accent)}
  .card.dragging{opacity:.4}
  .card-title{font-weight:600; margin-bottom:2px; word-break:break-word}
  .card-sub{color:var(--muted); font-size:12px; word-break:break-word}
  .card-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px}
  .pill{font-size:11px; padding:1px 7px; border-radius:20px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted)}
  .pill.strong{background:var(--accent-soft); color:var(--accent); border-color:transparent}
  .pill.good{background:var(--ok-soft); color:var(--ok); border-color:transparent}
  .pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
  .card-acts{display:flex; gap:4px; margin-top:8px}
  .card-acts button{flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:4px; padding:2px 0; cursor:pointer; font-size:12px; line-height:1.6}
  .card-acts button:hover:not(:disabled){background:var(--accent); border-color:var(--accent); color:var(--ink-solido)}
  .card-acts button.wa:hover:not(:disabled){background:#25d366; border-color:#25d366; color:#fff}
  .pill.oro{background:var(--oro-suave); color:var(--oro-tinta); border-color:transparent}
  .card-acts button:disabled{opacity:.3; cursor:default}

  .table-wrap{flex:1 1 auto; overflow:auto; padding:12px 16px 16px; min-height:0}
  table.data{width:100%; border-collapse:collapse; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; overflow:hidden}
  table.data th{text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; padding:9px 10px; border-bottom:1px solid var(--line);
    background:var(--panel-2); position:sticky; top:0; z-index:1; white-space:nowrap}
  table.data td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.data tbody tr:last-child td{border-bottom:0}
  table.data tbody tr:hover{background:var(--panel-2)}
  table.data td.num, table.data th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .row-link{cursor:pointer}
  table.data tr.row-err > td{background:var(--bad-soft)}
  /* Un campo con algo que hay que mirar antes de guardar. */
  .field.campo-err{border-color:var(--bad); background:var(--bad-soft)}
  .field.err{border-color:var(--bad); box-shadow:0 0 0 1px var(--bad)}
  .errbox{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);
    border-radius:6px; padding:10px 13px; margin-bottom:14px; font-size:13px}
  .errbox b{display:block; margin-bottom:3px}
  .errbox ul{margin:0; padding-left:18px}
  .errbox li{margin-top:3px}
  tr.off td:not(.selcell){opacity:.45}
  .nowrap{white-space:nowrap}
  .vacio{color:var(--muted); text-align:center; padding:36px 16px}
  .panel-form{background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; padding:16px 18px}
  /* Preguntarle a la IA: botón flotante y su panel */
  #bIA{position:fixed; right:20px; bottom:20px; z-index:400; width:56px; height:56px;
    border-radius:50%; border:0; cursor:pointer; background:var(--accent); color:#fff;
    box-shadow:0 6px 22px rgba(57,16,78,.34); display:flex; align-items:center;
    justify-content:center; transition:transform .12s ease, box-shadow .12s ease}
  #bIA:hover{transform:translateY(-2px); box-shadow:0 9px 26px rgba(57,16,78,.42)}
  #bIA svg{width:26px; height:26px; display:block}
  #panelIA{position:fixed; right:20px; bottom:20px; z-index:401; width:400px;
    max-width:calc(100vw - 32px); height:min(620px, calc(100vh - 40px));
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.28); display:flex; flex-direction:column; overflow:hidden}
  #panelIA .ia-head{display:flex; align-items:center; gap:8px; padding:12px 14px;

    white-space:pre-wrap; word-wrap:break-word}
  .ia-b.yo{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px}
  .ia-b.ia{align-self:flex-start; background:var(--panel-2); border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .ia-b.err{align-self:stretch; background:var(--bad-soft); color:var(--bad);
    border:1px solid var(--bad); max-width:100%}

  .ia-idea{display:block; width:100%; text-align:left; margin-top:6px; font-size:12.5px;

  /* Calendario */
  .cal-leyenda{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted);

  .cal-leyenda span{display:inline-flex; align-items:center; gap:6px}

  /* Reportes */

  /* Modo tableta: la pantalla que se le pone enfrente al cliente en un stand.
     No hereda nada del tema de la aplicación —siempre claro, siempre sobre
     blanco— porque el que la va a llenar no es del equipo y no tiene por qué
     encontrarse la aplicación en oscuro ni ver un solo dato de nadie más. */
  /* Con la tableta entregada, el CRM no se tapa: se quita. Encima no bastaba
     —el teclado y el lector de pantalla seguían llegando a las pestañas de
     atrás—, y lo que no está dibujado no se alcanza de ninguna manera. */
  body.con-kiosco > header, body.con-kiosco > main{display:none !important}
  /* Lo mismo con la pantalla de entrar. Tapar el CRM con un recuadro encima no
     es proteger nada: la cartera seguía dibujada debajo, al alcance del teclado,
     del lector de pantalla y de cerrar el recuadro. Mientras no haya sesión, la
     aplicación no está en la página. */
  body.sin-sesion > header, body.sin-sesion > main{display:none !important}
  body.sin-sesion #bIA, body.sin-sesion #panelIA{display:none !important}
  /* La pantalla de departamento: pocas cosas y grandes, que es lo único que
     hay que hacer en ella. */
  .dep-grid{display:grid; gap:12px; grid-template-columns:1fr 1fr; margin-top:20px}
  @media(max-width:560px){ .dep-grid{grid-template-columns:1fr} }
  .dep-card{display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 16px; color:inherit; font:inherit; transition:border-color .15s, transform .15s}
  .dep-card:hover, .dep-card:focus-visible{border-color:var(--oro); transform:translateY(-2px)}
  .dep-card .dep-ico{font-size:26px; line-height:1}
  .dep-card b{display:block; margin:8px 0 4px; font-size:16px}
  .dep-card small{color:var(--muted); display:block; line-height:1.45}
  #kiosco{position:fixed; inset:0; z-index:9000; overflow-y:auto;
    background:#f6f4f8; color:#241031; -webkit-overflow-scrolling:touch;
    font-size:17px; display:flex; flex-direction:column; align-items:center}
  #kiosco *{box-sizing:border-box}
  .k-hoja{width:100%; max-width:760px; padding:20px 22px 40px}
  .k-marca{text-align:center; margin-bottom:6px}
  .k-marca .k-wordmark{width:min(260px,68vw); margin:0 auto}
  .k-marca .k-wordmark svg{width:100%; height:auto; display:block}
  .k-marca .k-mono{width:64px; height:64px; margin:0 auto 6px; display:block}
  .k-titulo{text-align:center; font-size:26px; font-weight:700; margin:12px 0 4px;
    color:#39104e; letter-spacing:.01em}
  .k-sub{text-align:center; color:#5d4a6b; margin:0 0 14px; font-size:15px}
  .k-evento{display:block; text-align:center; margin:0 auto 16px; font-size:14px;
    background:#ece7f1; color:#4a3559; border-radius:999px; padding:6px 16px; width:max-content;
    max-width:100%}
  .k-campo{margin-bottom:13px}
  .k-campo label{display:block; font-size:15px; font-weight:600; margin-bottom:6px; color:#3b2a49}
  .k-campo .opc{font-weight:400; color:#7a6a87}
  .k-campo input{width:100%; font-size:20px; padding:12px 14px; border-radius:10px;
    border:1.5px solid #cfc6d8; background:#fff; color:#241031; -webkit-appearance:none}
  .k-campo input:focus{outline:none; border-color:#39104e; box-shadow:0 0 0 3px #39104e22}
  .k-campo input.err{border-color:#b3261e; background:#fdf3f2}
  .k-fila{display:flex; gap:14px}
  .k-fila > *{flex:1 1 0; min-width:0}
  .k-enviar{width:100%; font-size:21px; font-weight:700; padding:16px; border:0;
    border-radius:12px; background:#39104e; color:#fff; margin-top:8px; cursor:pointer}
  .k-enviar:active{background:#2a0c3a}
  .k-err{background:#fdecea; color:#8c1d18; border:1px solid #e6b4b0; border-radius:10px;

  /* La salida se esconde a plena vista y pide mantener pulsado: un visitante
     curioso no sale por accidente, y el ejecutivo no tiene otra clave que perder. */
  .k-salir{position:fixed; top:0; right:0; width:62px; height:62px; border:0; z-index:9001;
    background:transparent; color:#b8abc4; font-size:17px; cursor:pointer;

    align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:50}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:10px;

  .modal-head h2{margin:0; font-size:16px; flex:1 1 auto}
  .modal-body{padding:16px 18px}
  .modal-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .grid .full{grid-column:1/-1}

  /* ----- Opciones que se prenden -----------------------------------------
     Un grupo de "escoge varias". La casilla DE VERDAD sigue dentro, nada más
     que escondida: así el teclado, el lector de pantalla y el propio navegador
     siguen marcando, desmarcando y mandando el formulario. Con un <div> y un
     onclick habría que reimplementar todo eso a mano, y saldría peor.

     El escogido se pinta como .pill.strong, que es como esta aplicación ya
     dice "esto está marcado". Así se ve parte del CRM y no pegado con cinta, y
     funciona en claro y en oscuro sin tocar nada, porque son variables. */
  .opciones{display:flex; flex-wrap:wrap; gap:8px}
  .opciones label{cursor:pointer}
  /* Fuera de la vista pero DENTRO del formulario: opacity y no display:none,
     para que siga recibiendo el foco del teclado. El width:0 además anula el
     .grid input{width:100%} de más arriba, que si no la estiraría. */
  .opciones input{position:absolute; width:0; height:0; margin:0; opacity:0}
  .opciones input + span{
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 15px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel-2); color:var(--muted);
    font-size:13.5px; font-weight:600; line-height:1.2;
    /* Que "De productos / comida" no se parta en tres renglones. */
    white-space:nowrap;
    transition:background .12s, border-color .12s, color .12s}
  /* La palomita ocupa su lugar SIEMPRE, marcada o no: si apareciera sólo al
     escoger, la píldora cambiaría de ancho y la fila daría un brinco. Y va
     porque lo marcado no puede distinguirse SÓLO por el color. */
  .opciones .tic{visibility:hidden; font-style:normal; font-size:12px}
  .opciones label:hover input + span{border-color:var(--accent)}
  .opciones input:focus-visible + span{outline:2px solid var(--accent); outline-offset:2px}
  .opciones input:checked + span{
    background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
  .opciones input:checked + span .tic{visibility:visible}
  .note{background:var(--accent-soft); color:var(--text); border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:14px}
  .note.warn{background:var(--warn-soft)}
  h3.sec{margin:22px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
  h3.sec:first-child{margin-top:0}

  .subtabs button{flex:1; background:transparent; border:0; border-radius:6px; padding:7px 10px;
    cursor:pointer; color:var(--muted); font-weight:600}

  .act{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}

  /* ---------- Documento (carta-convenio) ---------- */
  .doc-body{padding:30px 40px 34px; font-size:12.4px; line-height:1.5; color:#2b0d3a;
    background:#fff; position:relative; overflow:hidden}
  /* Marca de agua tipo hoja membretada: va como elemento, no como fondo CSS,
     para que también salga al imprimir. */
  /* La página que abre el cliente. El CRM ocupa la pantalla completa y no se
     desplaza —las columnas del tablero se desplazan solas—, pero un documento
     de varias páginas sí tiene que poder recorrerse de arriba abajo. */

<!-- ==========================================================================
     LA NUBE DEL HOTEL

     Las dos líneas que hay que llenar para que el CRM no se configure equipo
     por equipo. Con esto puesto, quien abra la liga cae directo en la pantalla
     de contraseña y no ve absolutamente nada hasta entrar.

       url : la dirección del proyecto de Supabase
       anon: la llave pública (anon / publishable), NUNCA la de service_role

     La llave 'anon' está hecha para viajar al navegador de cualquiera que abra
     la página, y por sí sola no alcanza ni una fila: quien manda es la sesión
     y las reglas de roles.sql. Aun así, esto se llena únicamente con el
     repositorio en privado.

     Vacío, la aplicación se comporta como siempre: cada equipo se configura con
     su liga de alta, o trabaja suelto en modo local.
     ========================================================================== -->
<script>
window.CORE_NUBE = { url:"", anon:"" };
</script>

<!-- ==========================================================================
     EL SEGURO DE ARRANQUE

     Va aparte y antes del script grande a propósito: si estuviera dentro, se
     moriría con él, que es justo cuando hace falta.

     Hace dos cosas, las dos para que una pantalla morada no se quede nunca
     más callada:

       1. A los 6 segundos, si el logo de entrada sigue ahí, lo quita. Pase lo
          que pase con el resto de la aplicación.
       2. Si algo revienta mientras arranca, enseña QUÉ fue —el mensaje y el
          renglón— en una caja que se puede leer y copiar, en vez de dejar al
          ejecutivo mirando un logo eterno sin saber a quién avisarle.

     En cuanto la aplicación termina de arrancar llama a CORE_ARRANCO() y este
     equipo se hace a un lado: de ahí en adelante los errores los atiende la
     aplicación, no esta caja.
     ========================================================================== -->
<script>
(function seguroDeArranque(){
  "use strict";

  var arranco = false;
  window.CORE_ARRANCO = function(){ arranco = true; };

  function quitarEntrada(){
    var el = document.getElementById("intro");
    if (el && el.parentNode) el.remove();
    var raiz = document.documentElement;
    if (raiz && raiz.classList) raiz.classList.remove("intro-activa");
  }

  /* 1 · El seguro. */
  setTimeout(function(){ if (!arranco) quitarEntrada(); }, 6000);

  /* 2 · Qué fue. */
  function avisar(detalle){
    if (arranco) return;                                  // ya arrancó: no es cosa de aquí
    if (document.getElementById("core-falla")) return;    // con un aviso basta
    quitarEntrada();

    var caja = document.createElement("div");
    caja.id = "core-falla";
    caja.setAttribute("style",
      "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;" +
      "justify-content:center;padding:20px;background:rgba(15,10,30,.92);" +
      "font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif");

    var tarjeta = document.createElement("div");
    tarjeta.setAttribute("style",
      "max-width:560px;width:100%;background:#fff;color:#1a1a2e;border-radius:14px;" +
      "padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45)");

    var titulo = document.createElement("div");
    titulo.setAttribute("style","font-size:18px;font-weight:700;margin-bottom:8px");
    titulo.textContent = "CORE no pudo abrir";

    var texto = document.createElement("p");
    texto.setAttribute("style","margin:0 0 12px");
    texto.textContent =
      "Algo falló al arrancar. Tus datos siguen guardados en este equipo y en " +
      "la nube: no se perdió nada. Copia el aviso de abajo y mándalo para que " +
      "se corrija.";

    var pre = document.createElement("pre");
    pre.setAttribute("style",
      "margin:0 0 14px;padding:10px 12px;background:#f3f2f8;border-radius:10px;" +
      "font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;" +
      "white-space:pre-wrap;word-break:break-word;max-height:30vh;overflow:auto");
    pre.textContent = detalle;

    var fila = document.createElement("div");
    fila.setAttribute("style","display:flex;gap:8px;flex-wrap:wrap");

    function boton(etiqueta, principal, alHacer){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = etiqueta;
      b.setAttribute("style",
        "appearance:none;border:1px solid " + (principal ? "#5b3fd6" : "#c9c7d6") + ";" +
        "background:" + (principal ? "#5b3fd6" : "#fff") + ";" +
        "color:" + (principal ? "#fff" : "#1a1a2e") + ";" +
        "border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer");
      b.addEventListener("click", alHacer);
      return b;
    }

    fila.appendChild(boton("Copiar el aviso", true, function(){
      var t = "CORE no pudo abrir\n" + detalle;
      var listo = function(){ this.textContent = "Copiado"; };
      try{
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(t).then(listo.bind(this), function(){});
          return;
        }
      }catch(e){}
      try{
        var a = document.createElement("textarea");
        a.value = t; document.body.appendChild(a); a.select();
        document.execCommand("copy"); a.remove();
        listo.call(this);
      }catch(e){}
    }));

    fila.appendChild(boton("Volver a intentar", false, function(){ location.reload(); }));

    tarjeta.appendChild(titulo);
    tarjeta.appendChild(texto);
    tarjeta.appendChild(pre);
    tarjeta.appendChild(fila);
    caja.appendChild(tarjeta);
    (document.body || document.documentElement).appendChild(caja);
  }

  window.addEventListener("error", function(ev){
    var m = (ev && ev.message) || (ev && ev.error && ev.error.message) || "error desconocido";
    var d = m;
    if (ev && ev.lineno) d += "\nrenglón " + ev.lineno + (ev.colno ? ", columna " + ev.colno : "");
    if (ev && ev.error && ev.error.stack) d += "\n" + ev.error.stack;
    avisar(d);
  });

  window.addEventListener("unhandledrejection", function(ev){
    var r = ev && ev.reason;
    avisar("Promesa sin atender: " + ((r && (r.stack || r.message)) || String(r)));
  });
})();
</script>

   usuario pide correo y nombre por separado —el correo es con el que entra,
   el nombre es con el que aparece en la cartera— y hay que escribirlos igual.

/* El departamento escogido en esta sesión. No se guarda en el equipo a
   propósito: la pantalla de escoger es lo primero que ve quien alcanza más de
   uno, cada vez que entra.
   
   Pero sí se recuerda mientras la pestaña siga abierta, en sessionStorage, que
   se borra sola al cerrarla. Eso es lo que hace que RECARGAR no cuente como
   volver a entrar: el botón CORE recarga la página, y sin esto le sacaría la
   pantalla de escoger departamento cada vez. Se guarda junto con el correo de
   quien lo escogió, para que si entra otra persona no herede el de la anterior. */
const DEPTO_SESION = "crm-hotel-depto";
let depto = "";

function ponDepto(d){
  depto = d || "";
  /* El filtro por persona es de la otra área: si se queda puesto, al cambiar
     de departamento la lista sale vacía y no hay manera de adivinar por qué. */
  filtros.ejecutivo = "";
  try{
    if (depto) sessionStorage.setItem(DEPTO_SESION,
      JSON.stringify({ correo: correoSesion(), depto }));
    else sessionStorage.removeItem(DEPTO_SESION);
  }catch(e){}
}

function deptoRecordado(){
  try{
    const d = JSON.parse(sessionStorage.getItem(DEPTO_SESION) || "null");
    if (!d || !d.depto) return "";
    return String(d.correo || "") === correoSesion() ? d.depto : "";
  }catch(e){ return ""; }
}

/** ¿A esta persona le toca ver los eventos de banquetes? */
const veBanquetes = () => puedeVer("eventos");
/** ¿Y las campañas? */
const veMarketing = () => puedeVer("campanas");
/* Banquetes no renta habitaciones, así que el hospedaje no le toca en ningún
   lado: ni la pestaña de convenios, ni la ficha del cliente, ni el tablero,
   ni los avisos, ni lo que se le cuenta a la IA. */
const veHospedaje = () => puedeVer("convenios");
/**
 * ¿La pantalla se está viendo desde banquetes?
 *
 * La cartera es la misma para ventas y para banquetes, pero no la trabajan
 * igual: la tarifa de un cliente, su etapa del convenio y quién lo atiende son
 * de hospedaje, y a banquetes no le dicen nada. Así que en banquetes esas
 * columnas enseñan OTRA cosa —su propia etapa y su propio ejecutivo—, y quién
 * manda lo decide esto, en un solo lugar.
 *
 * El `!veHospedaje()` no es de adorno: marketing tampoco lleva hospedaje —y
 * aunque nunca alcanza la cartera, con sólo `veBanquetes()` esto diría que
 * sí—. Y quien abre el archivo sin nube alcanza todo: no hay departamentos
 * que separar y todo se queda como siempre.
 */
const enBanquetes = () => veBanquetes() && !veHospedaje();
/** Los departamentos que alcanza quien está viendo la pantalla. */
const misDepartamentos = () =>
  DEPARTAMENTOS.filter(d => (DEPTOS_ROL[rolActual()] || []).includes(d.id));
/**
 * ¿Hay que preguntarle a esta persona en cuál quiere entrar?
 *
 * Sin nube no hay sesión ni papeles: quien abre el archivo en su equipo es
 * dueño de todo y no hay departamentos que separar, así que no se le pregunta.
 */
const escogeDepto = () => nubeActiva() && misDepartamentos().length > 1;
const deptoActual = () => DEPARTAMENTOS.find(d => d.id === depto) || null;

/**
 * En cuál departamento está trabajando quien ve la pantalla, ahora mismo.
 *
 * Quien alcanza más de uno lo escogió al entrar. Quien alcanza uno solo —un
 * ejecutivo, la gerencia de banquetes— no escoge nada y es ése, aunque nunca
 * haya visto la pantalla de escoger. Y quien abre el archivo sin nube no tiene
 * departamentos que separar: devuelve vacío y no se filtra nada, que es como
 * trabajaba el CRM antes de los papeles.
 */
function miDepto(){
  if (depto) return depto;
  const ds = misDepartamentos();
  return ds.length === 1 ? ds[0].id : "";
}

/**
 * Los papeles que no llevan bitácora.
 *
 * La administración y la dirección no hacen llamadas ni visitas a nombre
 * suyo: miran el trabajo de los demás. Ponerlas en el filtro por persona es
 * ofrecer una opción que siempre sale vacía.
 *
 * Es sólo la LISTA. Si alguna vez quedó una actividad a su nombre, se sigue
 * viendo en la bitácora como cualquier otra: lo que se quita es el nombre del
 * menú, no el renglón.
 */
const NO_LLEVAN_BITACORA = ["admin", "direccion"];

const nombresSinBitacora = () => new Set(state.usuarios
  .filter(u => NO_LLEVAN_BITACORA.includes(u.rol))
  .map(u => String(u.nombre || "").trim().toLowerCase()).filter(Boolean));

/** Los nombres de quienes trabajan en un departamento. */
function nombresDelDepto(id){
  if (!id) return nombresEquipo();
  return [...new Set(state.usuarios
    .filter(u => (DEPTOS_ROL[u.rol] || []).includes(id))
    .map(u => String(u.nombre || "").trim()).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b,"es"));
}

/**
 * Quienes NO son del departamento en el que se está, por su nombre.
 *
 * Sirve para no mezclar la bitácora de un área con la de otra. Se va por la
 * negativa a propósito: lo que aparece a nombre de alguien que no está dado de
 * alta NO se esconde. Eso es de antes de los papeles, o de alguien que se fue,
 * y esconderlo lo dejaría sin que nadie lo viera nunca.
 *
 * La administración y la dirección alcanzan los tres departamentos, así que
 * nunca salen en esta lista: su trabajo se ve desde cualquiera de ellos.
 */
function otrosDepartamentos(){
  const d = miDepto();
  if (!d) return new Set();
  return new Set(state.usuarios
    .filter(u => !(DEPTOS_ROL[u.rol] || []).includes(d))
    .map(u => String(u.nombre || "").trim().toLowerCase()).filter(Boolean));
}

/**
 * Las pestañas de esta persona, ya acotadas al departamento en el que está.
 *
 * Los Ajustes no son de ningún departamento —son del administrador—, así que
 * no se le quitan por haber escogido uno.
 */
function vistasDelRol(){
  const base = VISTAS_ROL[rolActual()] || VISTAS_ROL.ejecutivo;
  const d = escogeDepto() ? deptoActual() : null;
  const vs = d ? base.filter(v => v === "ajustes" || d.vistas.includes(v)) : base;
  /* Los certificados no se esconden por departamento sino por PERSONA. A quien
     no los puede emitir no se le enseña la pestaña: para esa cuenta es como si
     no existiera. */
  return puedeCertificados() ? vs : vs.filter(v => v !== "certificados");
}
const puedeVer = v => vistasDelRol().includes(v);

function saneaUsuario(u){
  const o = Object.assign({ id:"", correo:"", nombre:"", rol:"ejecutivo", firma:null }, u || {});
  o.id = o.id || nuevoId("u");
  o.correo = String(o.correo).trim().toLowerCase();
  o.nombre = String(o.nombre).trim();
  if (!ROLES.some(r => r.id === o.rol)) o.rol = "ejecutivo";
  o.firma = saneaFirma(o.firma);      // la que dejó guardada para no volver a trazarla
  /* Emitir certificados no es cosa del PAPEL sino de la persona: un certificado
     es una cortesía que cuesta dinero, y el hotel escoge a quién se lo deja a
     mano. Por eso es una palomita en la ficha y no un rol nuevo.

     Sólo existe cuando está prendida: un campo nuevo en todas las fichas las
     haría verse editadas y volverían a subirse enteras. */
  if (o.certificados) o.certificados = true; else delete o.certificados;
  return o;
}

/**
 * ¿Esta persona puede emitir certificados de cortesía?
 *
 * La administración siempre. Los demás, sólo si alguien les prendió la
 * palomita en Ajustes → Usuarios. Quien no puede ni ve la pestaña.
 */
const puedeCertificados = () => {
  if (!nubeActiva()) return true;          // suelto, en una sola máquina, manda quien la usa
  if (esAdmin()) return true;
  const u = usuarioActual();
  return !!(u && u.certificados);
};

/**
 * La firma del ejecutivo se traza una vez y se vuelve a usar.
 *
 * Vive en la ficha del usuario, no en el equipo: aquí se trabaja desde
 * computadoras compartidas y cada quien debe traer la suya a donde entre.
 * Sin nube no hay usuario a quién colgarla, y entonces se queda nada más en
 * esta máquina —y se borra al cerrar sesión, para no dejarle a nadie una
 * firma ajena a la mano.
 */
const FIRMA_LOCAL = "crm-hotel-firma";

function firmaGuardada(){
  const u = usuarioActual();
  if (u && u.firma && u.firma.img) return u.firma;
  try{
    const f = JSON.parse(localStorage.getItem(FIRMA_LOCAL) || "null");
    return f && f.img ? f : null;
  }catch(e){ return null; }
}

function guardarFirmaPropia(d){
  const f = { nombre:d.nombre || "", puesto:d.puesto || "", celular:d.celular || "", img:d.img };
  const u = usuarioActual();
  if (u){ u.firma = f; guardar(); }
  /* Y también en este equipo, aunque tenga ficha. Con roles.sql corrido el
     renglón de usuarios sólo lo escribe el administrador, así que la ficha de
     un ejecutivo NO viaja a la nube: si la firma viviera nada más ahí, se
     perdería en cuanto se volviera a bajar la lista de usuarios. Se borra al
     cerrar sesión, como antes, para no dejarle una firma ajena a la mano al
     siguiente que use la computadora. */
  try{ localStorage.setItem(FIRMA_LOCAL, JSON.stringify(f)); }catch(e){}
}

function olvidarFirmaPropia(){
  const u = usuarioActual();
  if (u){ u.firma = null; guardar(); }
  try{ localStorage.removeItem(FIRMA_LOCAL); }catch(e){}
}

/** El usuario de la sesión, buscado por el correo con el que entró. */
function usuarioActual(){
  const c = correoSesion().trim().toLowerCase();
  if (!c) return null;
  return state.usuarios.find(u => u.correo === c) || null;
}

/**
 * Sin nube no hay sesión, y entonces no hay a quién limitarle nada: quien
 * abre la aplicación en su equipo es dueño de sus propios datos. Con nube,
 * un correo que no está dado de alta entra como ejecutivo sin cartera, que
 * es lo prudente: mejor que no vea nada a que lo vea todo por descuido.
 */
function rolActual(){
  if (!nubeActiva()) return "admin";
  const u = usuarioActual();
  return u ? u.rol : "ejecutivo";
}

const miNombre    = () => { const u = usuarioActual(); return u ? u.nombre : ""; };
const esAdmin     = () => rolActual() === "admin";
/* Las dos gerencias ven el trabajo de todo el equipo; lo que cambia entre
   ellas es qué pestañas alcanzan, no cuánto ven dentro de ellas. */
const puedeVerTodo = () =>
  ["admin","direccion","gerente","gte_banquetes","gte_marketing"].includes(rolActual());

/**
 * ¿Este cliente es mío POR VENTAS? La regla de siempre, intacta.
 *
 * Se saca aparte porque hay quien la necesita sola: los eventos de banquetes
 * cuelgan del cliente, y si usaran la regla ampliada de abajo, una ejecutiva
 * vería los eventos de sus compañeras nada más porque el cliente todavía no
 * tiene dueño en banquetes.
 */
function esMioPorVentas(c){
  if (puedeVerTodo()) return true;
  const yo = miNombre().trim().toLowerCase();
  return !!yo && String((c || {}).ejecutivo || "").trim().toLowerCase() === yo;
}

/** ¿Este cliente es de quien está viendo la pantalla? */
function esMio(c){
  if (puedeVerTodo()) return true;
  const yo = miNombre().trim().toLowerCase();
  if (!yo) return false;
  const suyo = k => String((c || {})[k] || "").trim().toLowerCase() === yo;
  /* Lo de siempre va PRIMERO y no se toca: hasta hoy una ejecutiva de
     banquetes veía los clientes que traían su nombre en el campo de ventas, y
     quitárselo la dejaría sin cartera de un día para otro. Lo de abajo sólo
     suma. */
  if (suyo("ejecutivo")) return true;
  return enBanquetes() ? alcanceBanquetes(c, suyo) : false;
}

/**
 * Qué cartera alcanza quien trabaja en banquetes.
 *
 * Lo escogió Marco: lo suyo y lo que nadie de banquetes ha tomado, para que
 * pueda levantar un cliente nuevo sin esperar a que se lo pasen. Lo que ya
 * lleva una compañera no le sale; la gerencia de banquetes sigue viendo todo.
 *
 * Vive aquí sola para poder cambiar de opinión en un renglón: «toda la
 * cartera» sería `return true` y «sólo los suyos», `suyo("ejecutivoBq")`.
 */
const alcanceBanquetes = (c, suyo) =>
  suyo("ejecutivoBq") || !String((c || {}).ejecutivoBq || "").trim();

/** Los nombres del equipo dado de alta: los únicos que deben poder elegirse. */
const nombresEquipo = () => [...new Set(state.usuarios.map(u => String(u.nombre || "").trim())
  .filter(Boolean))].sort((a,b) => a.localeCompare(b,"es"));

/**
 * Nombres escritos en la cartera o en la bitácora que no son de nadie del
 * equipo: quedan de una importación, de un ejemplo o de un dedazo. Importan
 * porque esos clientes no los ve ningún ejecutivo, así que hay que enseñarlos
 * aparte en vez de esconderlos.
 */
function nombresSinDuenio(){
  const equipo = new Set(nombresEquipo().map(n => n.toLowerCase()));
  return [...new Set([
      ...state.clientes.map(c => c.ejecutivo),
      ...state.actividades.map(a => a.responsable)
    ].map(x => String(x || "").trim()).filter(Boolean)
     .filter(n => !equipo.has(n.toLowerCase())))]
    .sort((a,b) => a.localeCompare(b,"es"));
}

/** Cuánto arrastra un nombre suelto, para poder decírselo al administrador. */
const cuantoTiene = nombre => {
  const n = nombre.trim().toLowerCase();
  const igual = x => String(x || "").trim().toLowerCase() === n;
  return { clientes:    state.clientes.filter(c => igual(c.ejecutivo)).length,
           actividades: state.actividades.filter(a => igual(a.responsable)).length };
};

/** Las opciones de los filtros por ejecutivo, iguales en tablero y actividades. */
/**
 * Quienes TRABAJAN un área: los de ese departamento, menos los mandos.
 *
 * La administración y la dirección alcanzan los tres departamentos, pero no
 * llevan cartera ni trabajan leads. Sin esta resta, «Marco Ramírez» sale como
 * ejecutivo de banquetes —y peor, puede quedarse apuntado como el que atendió
 * a un cliente que nadie atendió—.
 */
function nombresQueTrabajan(area){
  const mandos = nombresSinBitacora();
  return nombresDelDepto(area).filter(n => !mandos.has(n.trim().toLowerCase()));
}

/** ¿Este nombre es de alguien que trabaja banquetes? */
const esDeBanquetes = n => {
  const x = String(n || "").trim().toLowerCase();
  return !!x && nombresQueTrabajan("banquetes").some(y => y.toLowerCase() === x);
};

/**
 * La lista para filtrar por persona.
 *
 * Con `soloMiDepto` sólo salen los del departamento en el que se está: la
 * gerencia de ventas no tiene por qué filtrar por la gente de banquetes ni por
 * la de marketing, y verlos en la lista hace pensar que sí alcanza su trabajo.
 */
function opcionesEjecutivos(valor, todos, soloMiDepto){
  const op = n => `<option value="${esc(n)}"${n === valor ? " selected" : ""}>${esc(n)}</option>`;
  const cab = `<option value="">${esc(todos)}</option>`;
  if (!puedeVerTodo()){                 // un ejecutivo sólo se tiene a sí mismo
    const yo = miNombre().trim();
    return cab + (yo ? op(yo) : "");
  }
  const equipo = soloMiDepto ? nombresQueTrabajan(miDepto()) : nombresEquipo();
  const sueltos = nombresSinDuenio();
  /* Si lo que está filtrado ya no sale en la lista, se le agrega de todos
     modos: sin eso el select se vería en "todos" mientras el filtro sigue
     puesto, y la pantalla estaría mintiendo. */
  const v = String(valor || "").trim();
  const falta = v && !equipo.some(n => n === v) && !sueltos.some(n => n === v);
  return cab + equipo.map(op).join("") + (falta ? op(v) : "") +
    (sueltos.length ? `<optgroup label="Sin dar de alta">${sueltos.map(op).join("")}</optgroup>` : "");
}

/**
 * El ejecutivo de un cliente se escoge de la lista, no se escribe: un nombre
 * con una letra de más deja al cliente sin dueño y nadie lo vuelve a ver.
 */
function selectEjecutivo(valor, nombreCampo, deArea){
  const v = String(valor || "").trim(), vb = v.toLowerCase();
  /* Con un área, sólo los de esa área: un lead de salones no se le manda a
     alguien de hospedaje nada más porque estaba en la lista. Si el que ya
     estaba puesto no es de ahí, se conserva de todos modos —abajo, como
     "suelto"—, porque perderlo callando sería peor que ofrecerlo de más. */
  /* Y sin la dirección ni la administración: alcanzan las tres áreas, pero no
     trabajan leads ni llevan cartera. Ofrecerlos es ofrecer un callejón. */
  const equipo = deArea ? nombresQueTrabajan(deArea) : nombresEquipo();
  const suelto = v && !equipo.some(n => n.toLowerCase() === vb);
  return `<select class="field" name="${nombreCampo || "ejecutivo"}">
      <option value=""${v ? "" : " selected"}>— Sin asignar —</option>
      ${equipo.map(n => `<option value="${esc(n)}"${n.toLowerCase() === vb ? " selected" : ""}>${esc(n)}</option>`).join("")}
      ${suelto ? `<option value="${esc(v)}" selected>${esc(v)}${
          deArea ? " · de otra área" : " · sin dar de alta"}</option>` : ""}
    </select>`;
}

/* ----- Escoger un cliente -----------------------------------------------
   El mismo desplegable con la cartera entera estaba copiado en cinco
   editores. Ahora es uno solo, y además trae con qué buscar: con unas decenas
   de clientes abrir la lista y leerla a ojo ya es incómodo, y con cientos es
   un estorbo diario.

   Lo importante de cómo está hecho: el `<select>` SE QUEDA, con su mismo id y
   su mismo valor —el id del cliente—. El buscador nada más acorta la lista.
   Así los cinco lugares que lo leen al guardar, el aviso en rojo de «falta el
   cliente» y el auto‑llenado del ejecutivo —que escucha su `change`— siguen
   funcionando sin tocarles una línea.
   -------------------------------------------------------------------------- */

/** Una opción del desplegable. `sufijo` es lo que va después del nombre. */
const opcionCliente = (c, sel, sufijo) =>
  `<option value="${esc(c.id)}"${c.id === sel ? " selected" : ""}>${esc(c.empresa)}${
    sufijo && c[sufijo] ? " · " + esc(c[sufijo]) : ""}</option>`;

/** La cartera completa, por nombre. NO `clientesVisibles()`: ésa aplica el
    buscador del encabezado y el filtro por persona, y dentro de un formulario
    la lista se encogería sola sin que nadie entienda por qué. */
const clientesParaEscoger = () =>
  [...state.clientes].sort((a, b) => a.empresa.localeCompare(b.empresa, "es"));

/**
 * El campo de búsqueda más el desplegable de siempre.
 *
 * `opc.vacio` pone la opción «— Selecciona un cliente —» (así es en los
 * documentos; en el diálogo de actividad no, porque ahí siempre hay uno).
 * `opc.sufijo` es qué se enseña después del nombre: el contacto o el
 * ejecutivo, según de qué sirva en esa pantalla.
 */
function buscadorCliente(valorId, idCampo, opc){
  const o = Object.assign({ vacio:true, sufijo:"contacto", estilo:"" }, opc || {});
  const lista = clientesParaEscoger();
  return `<input class="field busca-cli" data-para="${idCampo}" type="search"
        placeholder="Escriba para buscar entre ${lista.length} clientes…"
        autocomplete="off" style="margin-bottom:6px">
    <select class="field" id="${idCampo}"${o.estilo ? ` style="${o.estilo}"` : ""}
        data-vacio="${o.vacio ? 1 : 0}" data-sufijo="${esc(o.sufijo)}">
      ${o.vacio ? `<option value="">— Selecciona un cliente —</option>` : ""}
      ${lista.map(c => opcionCliente(c, valorId, o.sufijo)).join("")}
    </select>
    <div class="hint" data-cuenta="${idCampo}"></div>`;
}

/**
 * Le amarra el buscador a su desplegable. Se llama desde `modal()`, una sola
 * vez, así que cualquier formulario que traiga el componente lo recibe sin
 * repetir nada —y el que se agregue mañana, también—.
 *
 * La lista se vuelve a armar en vez de esconder opciones con CSS: esconder un
 * `<option>` no funciona igual en todos los navegadores, y aquí se trabaja
 * también desde el celular.
 */
function armarBuscadoresCliente(ov){
  ov.querySelectorAll(".busca-cli").forEach(campo => {
    const sel = ov.querySelector("#" + campo.dataset.para);
    if (!sel) return;
    const conVacio = sel.dataset.vacio === "1";
    const sufijo = sel.dataset.sufijo || "";
    const cuenta = ov.querySelector(`[data-cuenta="${campo.dataset.para}"]`);
    campo.addEventListener("input", () => {
      const q = mismoNombre(campo.value);
      const todos = clientesParaEscoger();
      const hallados = !q ? todos : todos.filter(c =>
        mismoNombre(c.empresa).includes(q) || mismoNombre(c.contacto).includes(q));
      /* Se conserva lo que ya estaba escogido si sigue en la lista; y si queda
         uno solo, se escoge solo, que es a lo que va el que está buscando. */
      const antes = sel.value;
      const sigue = hallados.some(c => c.id === antes) ? antes
                  : (hallados.length === 1 ? hallados[0].id : "");
      sel.innerHTML = (conVacio ? `<option value="">— Selecciona un cliente —</option>` : "") +
        hallados.map(c => opcionCliente(c, sigue, sufijo)).join("");
      sel.value = sigue;
      if (sel.value !== antes) sel.dispatchEvent(new Event("change"));
      if (cuenta) cuenta.textContent = !q ? ""
        : hallados.length === 1 ? "Uno solo: ya quedó escogido."
        : hallados.length ? `${hallados.length} clientes coinciden.`
        : "Ninguno coincide. Borre la búsqueda para ver todos.";
    });
  });
}

/**
 * Avisa cuando la animación de entrada ya terminó.
 *
 * Un confirm() o un alert() del navegador congelan la página entera, animación
 * incluida: si la nube pregunta algo mientras la entrada corre, el logo se
 * queda tieso a medio dibujar detrás del aviso. Así que lo que tenga que
 * preguntar espera a que la entrada acabe.
 *
 * El plazo de respaldo es por si la entrada no llega a avisar —no se muestra,
 * falla, la quitan—: más vale preguntar tarde que no preguntar nunca.
 */
let terminarEntrada;
const entradaLista = new Promise(r => { terminarEntrada = r; setTimeout(r, 3500); });

/* ==========================================================================

   ========================================================================== */

let idCounter = 0;

const ESTADOS_CAMP = {

   ========================================================================== */

/* Las dos hojas. El id es el que viaja en los datos; el prefijo es el de su

/* Y qué clase de tomas. Aquí sí varias a la vez: una orden puede pedir foto de
