/* ==========================================================================
   CALENDARIO

   Un mes a la vista con los eventos de banquetes y las actividades agendadas
   del equipo. Sirve para dos cosas distintas: no encimar dos eventos en el
   mismo salón, y ver de un vistazo la semana de cada quien.
   ========================================================================== */

let mesCal = "";        // "2026-09"; vacío = el mes de hoy

const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
                 "septiembre","octubre","noviembre","diciembre"];

const mesActual = () => mesCal || hoyISO().slice(0, 7);

function mueveMes(n){
  const [a, m] = mesActual().split("-").map(Number);
  const d = new Date(a, m - 1 + n, 1);
  mesCal = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

/** Todo lo que cae en cada día del mes, ya filtrado por lo que esa persona ve. */
function agenda(mes){
  const dias = {};
  const mete = (f, item) => {
    const d = String(f || "").slice(0, 10);
    if (!d.startsWith(mes)) return;
    (dias[d] = dias[d] || []).push(item);
  };

  // Los eventos de banquetes, momento por momento: un mismo evento puede
  // ocupar dos días (la boda y el after de la madrugada siguiente). A quien no
  // le toca ver banquetes tampoco se le asoman por aquí.
  for (const e of veBanquetes() ? state.eventos : []){
    if (!eventoEsMio(e) || e.estado === "cancelado") continue;
    const vistos = new Set();
    for (const b of e.bloques){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(b.fecha) || vistos.has(b.fecha)) continue;
      vistos.add(b.fecha);
      const mismos = e.bloques.filter(x => x.fecha === b.fecha);
      mete(b.fecha, {
        clase: e.tipo === "contrato" ? "ev-contrato" : "ev-cot",
        titulo: e.titulo || nombreCli(e.clienteId),
        detalle: mismos.map(x => [x.horario, x.salon, x.pax ? x.pax + " pax" : ""]
          .filter(Boolean).join(" · ")).join("  |  "),
        pie: `${infoTipoEv(e.tipo).name} ${e.folio} · ${ESTADOS_EV[e.estado].name}`,
        abre: () => verEvento(e.id)
      });
    }
  }

  // Y las actividades agendadas del equipo.
  const mios = new Set(state.clientes.filter(esMio).map(c => c.id));
  const yo = miNombre().trim().toLowerCase();
  for (const a of state.actividades){
    const suya = puedeVerTodo() || mios.has(a.clienteId) ||
      (!!yo && String(a.responsable || "").trim().toLowerCase() === yo);
    if (!suya) continue;
    mete(a.fecha, {
      clase: "ev-act",
      titulo: `${tipoAct(a.tipo).icon} ${a.asunto || tipoAct(a.tipo).name}`,
      detalle: [String(a.fecha).slice(11, 16), nombreCli(a.clienteId)].filter(Boolean).join(" · "),
      pie: a.responsable || "",
      abre: () => abrirCliente(a.clienteId, null, "acts")
    });
  }

  for (const d of Object.keys(dias))
    dias[d].sort((x, y) => String(x.detalle).localeCompare(String(y.detalle)));
  return dias;
}

function renderCalendario(){
  const cont = document.getElementById("tblCalendario");
  const mes = mesActual();
  const [anio, m] = mes.split("-").map(Number);
  const dias = agenda(mes);

  const primero = new Date(anio, m - 1, 1);
  const largo = new Date(anio, m, 0).getDate();
  const arranque = (primero.getDay() + 6) % 7;      // la semana empieza en lunes
  const hoy = hoyISO();

  const celdas = [];
  for (let i = 0; i < arranque; i++) celdas.push(`<div class="cal-d fuera"></div>`);
  for (let d = 1; d <= largo; d++){
    const iso = `${anio}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const items = dias[iso] || [];
    celdas.push(`<div class="cal-d${iso === hoy ? " hoy" : ""}" data-dia="${iso}">
      <div class="cal-n">${d}</div>
      ${items.slice(0, 4).map((x, i) =>
        `<button class="cal-ev ${x.clase}" data-dia="${iso}" data-i="${i}"
           title="${esc([x.titulo, x.detalle, x.pie].filter(Boolean).join(" · "))}"
        >${esc(x.titulo)}</button>`).join("")}
      ${items.length > 4 ? `<button class="cal-mas" data-dia="${iso}">+${items.length - 4} más</button>` : ""}
    </div>`);
  }

  const totalEv = Object.values(dias).flat().filter(x => x.clase !== "ev-act").length;
  const totalAc = Object.values(dias).flat().filter(x => x.clase === "ev-act").length;

  cont.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn sm" id="calAnt" aria-label="Mes anterior">‹</button>
      <b style="font-size:16px;min-width:190px;text-align:center">${
        esc(MESES_L[m-1][0].toUpperCase() + MESES_L[m-1].slice(1))} ${anio}</b>
      <button class="btn sm" id="calSig" aria-label="Mes siguiente">›</button>
      <button class="btn sm" id="calHoy">Hoy</button>
      <span style="flex:1"></span>
      <span class="hint">${totalEv} evento(s) · ${totalAc} actividad(es)</span>
    </div>
    <div class="cal-leyenda">
      <span><i class="ev-contrato"></i> Contratado</span>
      <span><i class="ev-cot"></i> Cotizado</span>
      <span><i class="ev-act"></i> Actividad</span>
    </div>
    <div class="cal-sem">${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(x =>
      `<div>${x}</div>`).join("")}</div>
    <div class="cal-rej">${celdas.join("")}</div>`;

  cont.querySelector("#calAnt").onclick = () => { mueveMes(-1); render(); };
  cont.querySelector("#calSig").onclick = () => { mueveMes(1); render(); };
  cont.querySelector("#calHoy").onclick = () => { mesCal = ""; render(); };

  cont.querySelectorAll(".cal-ev").forEach(b => b.onclick = () => {
    const x = (dias[b.dataset.dia] || [])[Number(b.dataset.i)];
    if (x) x.abre();
  });
  cont.querySelectorAll(".cal-mas, .cal-d").forEach(b => b.onclick = ev => {
    if (ev.target.closest(".cal-ev")) return;
    const iso = b.dataset.dia;
    if (!iso || !(dias[iso] || []).length) return;
    diaCalendario(iso, dias[iso]);
  });
}

function diaCalendario(iso, items){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${esc(fechaLarga(iso))}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        ${items.map((x, i) => `<div class="cal-fila" data-i="${i}">
          <span class="cal-punto ${x.clase}"></span>
          <div style="flex:1;min-width:0">
            <b>${esc(x.titulo)}</b>
            ${x.detalle ? `<div class="hint">${esc(x.detalle)}</div>` : ""}
            ${x.pie ? `<div class="hint">${esc(x.pie)}</div>` : ""}
          </div>
          <button class="btn sm">Abrir</button></div>`).join("")}
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);
  ov.querySelectorAll(".cal-fila").forEach(f => f.onclick = () => {
    const x = items[Number(f.dataset.i)];
    ov.remove();
    if (x) x.abre();
  });
}

/* ==========================================================================
   REPORTES

   Lo que de verdad va a entrar, contado en el mes en que ocurre el evento o
   la estancia: contratos de hospedaje aceptados y eventos de banquetes
   confirmados. Lo que sigue en la mesa se cuenta aparte, como pronóstico.
   ========================================================================== */

let repDesde = "", repHasta = "";

const rangoReporte = () => {
  const hoy = new Date();
  const desde = repDesde || `${hoy.getFullYear()}-01-01`;
  const hasta = repHasta || `${hoy.getFullYear()}-12-31`;
  return [desde, hasta];
};

/**
 * Cada renglón de ingreso: de dónde viene, cuánto, de quién y cuándo cae.
 *
 * La fecha que manda es la del evento o la de la estancia, no la de la firma:
 * es cuando el hotel de verdad cobra.
 */
function ingresos(){
  const [desde, hasta] = rangoReporte();
  const filas = [];

  for (const e of veBanquetes() ? state.eventos : []){
    if (!eventoEsMio(e) || e.estado === "cancelado") continue;
    const f = fechaEvento(e);
    if (!f || f < desde || f > hasta) continue;
    // Un contrato manda sobre la cotización de la que salió: si no, se cuenta doble.
    if (e.tipo === "cotizacion" && state.eventos.some(x => x.cotizacionId === e.id)) continue;
    filas.push({
      fecha: f, area: "Banquetes", tipo: infoTipoEv(e.tipo).name,
      folio: e.folio, cliente: nombreCli(e.clienteId),
      concepto: e.titulo || "Evento",
      ejecutivo: ejecutivoDeEv(e) || "Sin asignar",
      monto: cuentasEvento(e).total,
      cerrado: e.estado === "confirmado",
      abre: () => verEvento(e.id)
    });
  }

  for (const k of puedeVer("contratos") ? state.contratos : []){
    if (!contratoEsMio(k)) continue;
    const f = k.fecha;
    if (!f || f < desde || f > hasta) continue;
    filas.push({
      fecha: f, area: "Hospedaje", tipo: infoTipoCt(k.tipo).name,
      folio: k.folio, cliente: nombreCli(k.clienteId),
      concepto: k.titulo || "Hospedaje",
      ejecutivo: ejecutivoDeCt(k) || "Sin asignar",
      monto: cuentasContrato(k).total,
      cerrado: k.estado === "aceptado",
      abre: () => verContrato(k.id)
    });
  }

  return filas.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
}

function renderReportes(){
  const cont = document.getElementById("tblReportes");
  const [desde, hasta] = rangoReporte();
  const filas = ingresos();
  const cerrado = filas.filter(f => f.cerrado);
  const enMesa  = filas.filter(f => !f.cerrado);
  const suma = a => a.reduce((x, f) => x + f.monto, 0);

  // Por ejecutivo
  const porEje = new Map();
  for (const f of filas){
    const k = porEje.get(f.ejecutivo) || { cerrado:0, mesa:0, n:0 };
    k[f.cerrado ? "cerrado" : "mesa"] += f.monto;
    k.n++;
    porEje.set(f.ejecutivo, k);
  }
  const ejes = [...porEje.entries()].sort((a, b) => b[1].cerrado - a[1].cerrado);

  // Por mes, para ver la estacionalidad
  const porMes = new Map();
  for (const f of filas){
    const m = String(f.fecha).slice(0, 7);
    const k = porMes.get(m) || { cerrado:0, mesa:0 };
    k[f.cerrado ? "cerrado" : "mesa"] += f.monto;
    porMes.set(m, k);
  }
  const meses = [...porMes.entries()].sort();
  const tope = Math.max(1, ...meses.map(([, v]) => v.cerrado + v.mesa));

  const areas = [veBanquetes() ? "Banquetes" : null,
                 puedeVer("contratos") ? "Hospedaje" : null].filter(Boolean);
  const porArea = a => areas.map(x =>
    ({ area:x, monto: suma(a.filter(f => f.area === x)) }));

  cont.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <b style="font-size:15px">Reportes de ingreso</b>
      <span style="flex:1"></span>
      <label class="hint">Del</label>
      <input class="field" type="date" id="repD" value="${esc(desde)}">
      <label class="hint">al</label>
      <input class="field" type="date" id="repH" value="${esc(hasta)}">
      <button class="btn" id="repAnio">Este año</button>
      <button class="btn" id="repCsv">Exportar CSV</button>
      <button class="btn" id="repDesg" title="Qué lleva cada paquete y cuánto cuesta cada cosa"
        >Desglose de paquetes</button>
    </div>
    <div class="note">Cada documento se cuenta en el mes en que <b>ocurre el evento o la
      estancia</b>, no en el que se firmó: es cuando el hotel cobra. Una cotización que ya
      tiene contrato no se cuenta dos veces.</div>

    <div class="kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="k-t">Cerrado</div>
        <div class="k-v">${esc(moneyMN(suma(cerrado)))}</div>
        <div class="k-s">${cerrado.length} documento(s) firmado(s)</div></div>
      <div class="kpi"><div class="k-t">En la mesa</div>
        <div class="k-v">${esc(moneyMN(suma(enMesa)))}</div>
        <div class="k-s">${enMesa.length} sin cerrar</div></div>
      ${porArea(cerrado).map(x => `<div class="kpi"><div class="k-t">${esc(x.area)}</div>
        <div class="k-v">${esc(moneyMN(x.monto))}</div>
        <div class="k-s">cerrado en el periodo</div></div>`).join("")}
    </div>

    <h3 class="sec">Por ejecutivo</h3>
    ${ejes.length ? `<div style="overflow:auto"><table class="data">
      <thead><tr><th>Ejecutivo</th><th class="num">Documentos</th>
        <th class="num">Cerrado</th><th class="num">En la mesa</th><th></th></tr></thead>
      <tbody>${ejes.map(([n, v]) => `<tr>
        <td><b>${esc(n)}</b></td>
        <td class="num">${v.n}</td>
        <td class="num"><b>${esc(moneyMN(v.cerrado))}</b></td>
        <td class="num">${esc(moneyMN(v.mesa))}</td>
        <td style="width:36%"><div class="barra"><i style="width:${
          Math.round(v.cerrado / Math.max(1, ejes[0][1].cerrado) * 100)}%"></i></div></td>
      </tr>`).join("")}
        <tr class="ct-tot"><td><b>Total</b></td><td class="num"><b>${filas.length}</b></td>
          <td class="num"><b>${esc(moneyMN(suma(cerrado)))}</b></td>
          <td class="num"><b>${esc(moneyMN(suma(enMesa)))}</b></td><td></td></tr>
      </tbody></table></div>` : `<div class="vacio">Sin ingresos en el periodo.</div>`}

    ${meses.length ? `<h3 class="sec">Por mes</h3>
      <div class="rep-meses">${meses.map(([m, v]) => `
        <div class="rep-mes" title="${esc(moneyMN(v.cerrado))} cerrado · ${esc(moneyMN(v.mesa))} en la mesa">
          <div class="rep-barras">
            <i class="mesa" style="height:${Math.round(v.mesa / tope * 100)}%"></i>
            <i class="cerr" style="height:${Math.round(v.cerrado / tope * 100)}%"></i>
          </div>
          <div class="rep-et">${esc(MESES_L[Number(m.slice(5,7)) - 1].slice(0,3))}</div>
        </div>`).join("")}</div>` : ""}

    <h3 class="sec">Detalle</h3>
    ${filas.length ? `<div style="overflow:auto"><table class="data">
      <thead><tr><th>Fecha</th><th>Área</th><th>Folio</th><th>Cliente</th><th>Concepto</th>
        <th>Ejecutivo</th><th>Estado</th><th class="num">Monto</th></tr></thead>
      <tbody>${filas.map((f, i) => `<tr class="row-link" data-i="${i}">
        <td class="nowrap">${esc(fechaCorta(f.fecha))}</td>
        <td>${esc(f.area)}</td>
        <td><b>${esc(f.folio || "—")}</b></td>
        <td>${esc(f.cliente)}</td>
        <td>${esc(f.concepto)}</td>
        <td class="nowrap">${esc(f.ejecutivo)}</td>
        <td><span class="estado-chip" style="background:${f.cerrado ? "var(--ok-soft)" : "var(--col)"};
          color:${f.cerrado ? "var(--ok)" : "var(--muted)"}">${f.cerrado ? "Cerrado" : "En la mesa"}</span></td>
        <td class="num nowrap"><b>${esc(moneyMN(f.monto))}</b></td>
      </tr>`).join("")}</tbody></table></div>`
      : `<div class="vacio">Nada que reportar en estas fechas.</div>`}`;

  cont.querySelector("#repD").onchange = e => { repDesde = e.target.value; render(); };
  cont.querySelector("#repH").onchange = e => { repHasta = e.target.value; render(); };
  cont.querySelector("#repAnio").onclick = () => {
    const a = new Date().getFullYear();
    repDesde = `${a}-01-01`; repHasta = `${a}-12-31`; render();
  };
  cont.querySelector("#repCsv").onclick = () => {
    descargar(`ingresos-${desde}-a-${hasta}.csv`, toCSV(
      [["Fecha","Área","Tipo","Folio","Cliente","Concepto","Ejecutivo","Estado","Monto"]]
      .concat(filas.map(f => [f.fecha, f.area, f.tipo, f.folio, f.cliente, f.concepto,
        f.ejecutivo, f.cerrado ? "Cerrado" : "En la mesa", f.monto]))), "text/csv");
  };
  /**
   * El desglose, que es CONTROL INTERNO.
   *
   * Un renglón por concepto de cada paquete cotizado en el periodo, con sus
   * cifras. Vive aquí y en la captura; en la cotización que se le manda al
   * cliente van los conceptos sin un solo número. Por eso es un archivo
   * aparte y no una columna más del de ingresos: se baja a propósito.
   */
  cont.querySelector("#repDesg").onclick = () => {
    const ren = [];
    for (const e of veBanquetes() ? state.eventos : []){
      if (!eventoEsMio(e) || e.estado === "cancelado") continue;
      const f = fechaEvento(e);
      if (!f || f < desde || f > hasta) continue;
      if (e.tipo === "cotizacion" && state.eventos.some(x => x.cotizacionId === e.id)) continue;
      for (const l of e.lineas || []){
        for (const d of l.partes || [])
          ren.push([f, e.folio, nombreCli(e.clienteId), ejecutivoDeEv(e) || "Sin asignar",
                    infoTipoEv(e.tipo).name, e.estado === "confirmado" ? "Cerrado" : "En la mesa",
                    l.servicio, l.cantidad, l.precio,
                    d.concepto, d.unitario, d.cantidad, d.unitario * d.cantidad]);
      }
    }
    if (!ren.length){
      alert("No hay ningún paquete con desglose en este periodo.");
      return;
    }
    descargar(`desglose-de-paquetes-${desde}-a-${hasta}.csv`, toCSV(
      [["Fecha","Folio","Cliente","Ejecutivo","Tipo","Estado","Paquete","Invitados",
        "Precio por persona","Concepto","Unitario","Cantidad","Subtotal"]].concat(ren)),
      "text/csv");
  };

  cont.querySelectorAll("tr[data-i]").forEach(tr =>
    tr.onclick = () => filas[Number(tr.dataset.i)].abre());
}

/* ==========================================================================
   PREGUNTARLE A LA IA

   La llave de la IA NO puede vivir aquí: esta página es pública y cualquiera
   podría sacarla y gastar con ella. Se queda en Supabase, en una función
   (supabase/functions/ia) que es la única que habla con el motor y que sólo
   atiende a quien ya entró al CRM. Sin esa función montada, el botón lo
   explica en vez de fallar.

   El motor vive del otro lado: hoy es Google Gemini, y si algún día se cambia
   por otro, aquí no hay nada que tocar mientras conteste en el mismo formato.
   ========================================================================== */

let charlaIA = [];          // la conversación de esta sesión, no se guarda
let pensandoIA = false;
let motorIA = "";           // lo dice la función al terminar, para saber quién contestó

const NOMBRE_MOTOR = { gemini:"Google Gemini" };

const IDEAS_IA = [
  "¿Qué clientes llevan más de un mes sin que nadie los toque?",
  "Resume en qué va mi cartera y qué debería atender primero.",
  "¿Qué convenios están firmados por el hotel y siguen sin firmar por el cliente?",
  "Escríbeme un correo de seguimiento para el cliente que lleva más tiempo en propuesta."
];

const ligaFuncionIA = () => nube.url ? nube.url.replace(/\/+$/, "") + "/functions/v1/ia" : "";

/**
 * Lo que la IA alcanza a ver: exactamente lo mismo que quien pregunta.
 *
 * Se manda un resumen en texto, no la base entera: pesa menos, se lee mejor y
 * —sobre todo— no salen de aquí las firmas ni los PDF escaneados.
 */
function contextoIA(){
  const h = state.ajustes.hotel;
  const u = usuarioActual();
  const cs = state.clientes.filter(esMio);
  const ids = new Set(cs.map(c => c.id));
  const corta = (t, n) => String(t || "").replace(/\s+/g, " ").trim().slice(0, n);
  const lim = (arr, n) => arr.length > n
    ? arr.slice(0, n).concat([`… y ${arr.length - n} más que no caben aquí`]) : arr;

  const desde = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
  const acts = state.actividades
    .filter(a => ids.has(a.clienteId) && String(a.fecha) >= desde)
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));

  const ultima = {};
  for (const a of state.actividades)
    if (!ultima[a.clienteId] || a.fecha > ultima[a.clienteId]) ultima[a.clienteId] = a.fecha;

  // A cada quien se le cuenta lo suyo: banquetes no renta habitaciones, así
  // que ni las tarifas ni los convenios ni los contratos de hospedaje tienen
  // por qué salir de aquí —y en cambio sus eventos sí—.
  const hosp = veHospedaje(), banq = veBanquetes();

  return [
`HOTEL: ${h.nombre} · ${h.ciudad} · tel ${h.telefono}`,
`HOY: ${hoyISO()}`,
`QUIEN PREGUNTA: ${(u && u.nombre) || correoSesion()} · ${u ? infoRol(u.rol).name : "sin papel"}`,
`ALCANCE: ${puedeVerTodo() ? "ve la cartera de todo el equipo" : "ve sólo su propia cartera"}` +
  (hosp ? "" : ". No lleva hospedaje: nada de habitaciones, convenios ni contratos de estancia"),
"",
...(hosp ? [
`TIPOS DE HABITACIÓN Y TARIFA PÚBLICA (${state.habitaciones.length}):`,
...state.habitaciones.map(x =>
  `- ${x.codigo || "—"} ${x.nombre} · ${x.publica === null ? "N/A" : moneyMN(x.publica)}`),
""] : []),
`CLIENTES (${cs.length}):`,
...lim(cs.map(c =>
  /* La etapa y el ejecutivo del departamento desde el que se pregunta: a
     banquetes no le sirve que la IA le conteste con el embudo de hospedaje. */
  `- ${c.empresa} · contacto ${c.contacto || "—"} · ${
     (estatusSiHay(estatusDeCli(c)) || {}).name || "sin tratar"}` +
  ` · ejecutivo ${ejecutivoDeCli(c) || "sin asignar"}` +
  (hosp && c.tarifa ? ` · tarifa ${moneyMN(c.tarifa)}` : "") +
  (c.ubicacion ? ` · ${c.ubicacion}` : "") +
  ` · última actividad ${ultima[c.id] ? String(ultima[c.id]).slice(0,10) : "nunca"}` +
  (c.notas ? ` · notas: ${corta(c.notas, 160)}` : "")), 120),
"",
...(hosp ? [
`CONVENIOS (${state.convenios.filter(convenioEsMio).length}):`,
...lim(state.convenios.filter(convenioEsMio).map(v =>
  `- ${v.folio} · ${nombreCli(v.clienteId)} · ${ESTADOS_CONV[v.estado].name}` +
  ` · del ${v.vigenciaDesde || "?"} al ${v.vigenciaHasta || "?"}` +
  (v.externo ? " · registrado desde un documento externo" : "") +
  (v.habitaciones.length
    ? ` · ${v.habitaciones.map(x => `${x.codigo || x.nombre} ${moneyMN(x.convenio)}`).join(", ")}`
    : "")), 60),
"",
`CONTRATOS Y COTIZACIONES DE HOSPEDAJE (${state.contratos.filter(contratoEsMio).length}):`,
...lim(state.contratos.filter(contratoEsMio).map(k =>
  `- ${k.folio} · ${infoTipoCt(k.tipo).name} · ${nombreCli(k.clienteId)} · ${ESTADOS_CT[k.estado].name}` +
  ` · fecha ${k.fecha} · total ${money(cuentasContrato(k).total, k.moneda)}` +
  (k.titulo ? ` · ${k.titulo}` : "")), 60),
""] : []),
...(banq ? [
`EVENTOS DE BANQUETES (${state.eventos.filter(eventoEsMio).length}):`,
...lim(state.eventos.filter(eventoEsMio).map(e =>
  `- ${e.folio} · ${e.tipo === "contrato" ? "contrato" : "cotización"} · ${nombreCli(e.clienteId)}` +
  ` · ${ESTADOS_EV[e.estado].name} · ${corta(e.titulo, 70) || "sin título"}` +
  ` · fecha ${fechaEvento(e) || "sin fecha"}` +
  ` · ${e.bloques.reduce((a, b) => Math.max(a, Number(b.pax) || 0), 0) || "?"} pax` +
  ` · total ${moneyMN(cuentasEvento(e).total)}` +
  ` · ejecutivo ${ejecutivoDeEv(e) || "sin asignar"}`), 60),
""] : []),
`ACTIVIDAD DE LOS ÚLTIMOS 60 DÍAS (${acts.length}):`,
...lim(acts.map(a =>
  `- ${String(a.fecha).slice(0,10)} · ${tipoAct(a.tipo).name} · ${nombreCli(a.clienteId)}` +
  ` · ${a.responsable || "—"} · ${corta(a.asunto, 90)}` +
  (a.notas ? ` · ${corta(a.notas, 120)}` : "")), 150),
"",
`PROSPECTOS DE EVENTOS (${prospectosVisibles().length}):`,
...lim(prospectosVisibles().map(x =>
  `- ${nombreProspecto(x)} · ${x.compania || "sin compañía"} · ${x.email} · ${x.telefono}` +
  (x.evento ? ` · ${x.evento}` : "") + (x.clienteId ? " · ya en cartera" : "")), 60)
  ].join("\n");
}

const INSTRUCCIONES_IA =
  "Eres el asistente del CRM de ventas de un hotel. Contestas en español de México, " +
  "de usted, con frases cortas y sin tecnicismos: quien te lee es personal de ventas, " +
  "no gente de sistemas.\n\n" +
  "Te dan un resumen de lo que esa persona alcanza a ver en el CRM. Contesta apoyándote " +
  "en esos datos y cita nombres y folios concretos cuando existan. Si algo no está en el " +
  "resumen, dilo claramente en vez de inventarlo, y di dónde se captura. No inventes " +
  "tarifas, fechas ni nombres.\n\n" +
  "Cuando te pidan redactar un correo o un mensaje, entrégalo listo para copiar y pegar. " +
  "Cuando te pregunten qué atender primero, da una lista corta y priorizada con el porqué " +
  "de cada punto. No uses tablas ni encabezados de markdown: la respuesta se ve en un " +
  "recuadro chico de texto simple.";

function abrirIA(){
  if (document.getElementById("panelIA")){ cerrarIA(); return; }

  const caja = document.createElement("div");
  caja.id = "panelIA";
  caja.innerHTML = `
    <div class="ia-head">
      <b>Preguntarle a la IA</b>
      <span style="flex:1"></span>
      <button class="btn sm" id="iaLimpiar" title="Empezar de nuevo">Limpiar</button>
      <button class="btn sm" id="iaCerrar" aria-label="Cerrar">✕</button>
    </div>
    <div class="ia-msgs" id="iaMsgs"></div>
    <div class="ia-pie">
      <div class="ia-fila">
        <textarea class="field" id="iaTexto" rows="1"
          placeholder="Pregunte lo que sea sobre su cartera…"></textarea>
        <button class="btn primary" id="iaMandar">Enviar</button>
      </div>
      <p class="ia-nota"><label>
        <input type="checkbox" id="iaConDatos" checked>
        <span>Dejar que vea mis datos del CRM. Se manda un resumen de lo que usted ya ve
          —sin firmas ni archivos— al servicio de inteligencia artificial.</span></label>
        <span id="iaMotor"></span></p>
    </div>`;
  document.body.appendChild(caja);

  const msgs  = caja.querySelector("#iaMsgs");
  const texto = caja.querySelector("#iaTexto");

  function pintar(){
    if (!charlaIA.length){
      msgs.innerHTML = `<div class="ia-vacio">
        Pregúntele lo que quiera sobre su cartera. Por ejemplo:
        ${IDEAS_IA.map(x => `<button class="ia-idea" data-idea="${esc(x)}">${esc(x)}</button>`).join("")}
      </div>`;
      msgs.querySelectorAll("[data-idea]").forEach(b => b.onclick = () => {
        texto.value = b.dataset.idea; mandar();
      });
      return;
    }
    msgs.innerHTML = charlaIA.map(m =>
      `<div class="ia-b ${m.rol}">${esc(m.texto) || "…"}</div>`).join("");
    msgs.scrollTop = msgs.scrollHeight;
    const mt = caja.querySelector("#iaMotor");
    if (mt) mt.textContent = motorIA ? `Contesta ${motorIA}.` : "";
  }
  pintar();

  const crece = () => {
    texto.style.height = "auto";
    texto.style.height = Math.min(texto.scrollHeight, 120) + "px";
  };
  texto.addEventListener("input", crece);
  texto.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); mandar(); }
  });

  caja.querySelector("#iaCerrar").onclick = cerrarIA;
  caja.querySelector("#iaLimpiar").onclick = () => { charlaIA = []; pintar(); texto.focus(); };
  caja.querySelector("#iaMandar").onclick = mandar;
  texto.focus();

  async function mandar(){
    const q = texto.value.trim();
    if (!q || pensandoIA) return;

    const falta = porQueNoHayIA();
    if (falta){
      charlaIA.push({ rol:"yo", texto:q }, { rol:"err", texto:falta });
      texto.value = ""; crece(); pintar();
      return;
    }

    charlaIA.push({ rol:"yo", texto:q });
    const respuesta = { rol:"ia", texto:"" };
    charlaIA.push(respuesta);
    texto.value = ""; crece(); pintar();

    pensandoIA = true;
    caja.querySelector("#iaMandar").disabled = true;
    try{
      await preguntarIA(
        charlaIA.filter(m => m.rol !== "err").map(m =>
          ({ role: m.rol === "yo" ? "user" : "assistant", content: m.texto })).slice(0, -1),
        caja.querySelector("#iaConDatos").checked,
        trozo => { respuesta.texto += trozo; pintar(); });
      if (!respuesta.texto) respuesta.texto = "No me llegó respuesta. Vuelva a intentar.";
    }catch(e){
      charlaIA[charlaIA.length - 1] = { rol:"err", texto:"No se pudo preguntar: " + e.message };
    }finally{
      pensandoIA = false;
      const b = caja.querySelector("#iaMandar");
      if (b) b.disabled = false;
      pintar();
    }
  }
}

function cerrarIA(){
  const c = document.getElementById("panelIA");
  if (c) c.remove();
}

/** Si algo falta, se dice con todas sus letras en vez de fallar callado. */
function porQueNoHayIA(){
  if (!nube.url || !nube.anon)
    return "Este equipo no está conectado a la nube del hotel, y la IA vive ahí. " +
           "Toque el chip de arriba a la derecha para conectarlo.";
  if (!nube.sesion || !nube.sesion.access_token)
    return "Hay que entrar con su correo y contraseña para poder preguntar.";
  return "";
}

/**
 * Le pregunta a la función de Supabase, que es la que tiene la llave.
 *
 * La respuesta llega por pedazos para que el texto aparezca conforme se
 * escribe, en vez de dejar el recuadro en blanco medio minuto.
 */
async function preguntarIA(mensajes, conDatos, alLlegar){
  const r = await fetch(ligaFuncionIA(), {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + nube.sesion.access_token,
      "apikey": nube.anon
    },
    body: JSON.stringify({
      mensajes,
      instrucciones: INSTRUCCIONES_IA,
      contexto: conDatos ? contextoIA() : ""
    })
  });

  if (!r.ok){
    const t = await r.text().catch(() => "");
    if (r.status === 404)
      throw new Error("la función de IA no está montada en Supabase todavía. " +
        "Sistemas tiene que subir supabase/functions/ia (viene explicado en IA.md).");
    if (r.status === 401 || r.status === 403)
      throw new Error("la nube no aceptó la sesión. Cierre sesión y vuelva a entrar.");
    throw new Error(`${r.status} · ${String(t).slice(0, 300) || "sin detalle"}`);
  }
  if (!r.body) throw new Error("este navegador no puede leer la respuesta por pedazos.");

  const lector = r.body.getReader();
  const deco = new TextDecoder();
  let resto = "";
  for (;;){
    const { value, done } = await lector.read();
    if (done) break;
    resto += deco.decode(value, { stream:true });
    const lineas = resto.split("\n");
    resto = lineas.pop();
    for (const l of lineas){
      if (!l.trim()) continue;
      let d;
      try{ d = JSON.parse(l); }catch(e){ continue; }
      if (d.error) throw new Error(d.error);
      if (d.t) alLlegar(d.t);
      if (d.motor) motorIA = NOMBRE_MOTOR[d.motor] || d.motor;
    }
  }
}

function pintarBotonIA(){
  const b = document.getElementById("bIA");
  if (!b) return;
  // Se enseña siempre que haya sesión: si algo falta, el propio panel lo explica.
  b.style.display = nube.sesion ? "flex" : "none";
  b.onclick = abrirIA;
}

/* ==========================================================================
   LA PÁGINA DEL CLIENTE

   El cliente no tiene cuenta ni tiene por qué tenerla: abre un enlace, lee su
   convenio y firma. Esta parte de la aplicación se enciende cuando el enlace
   trae "#firmar=..." y no enseña nada del CRM — ni tablero, ni cartera, ni
   pestañas—: sólo su documento.

   El enlace lleva la clave del convenio, y esa clave es lo único que abre ese
   convenio y ningún otro. La firma no se guarda encima del documento: se deja
   en un buzón aparte (crm_firmas) donde el visitante sólo puede depositar, no
   leer ni corregir. El CRM la recoge de ahí y la aplica. Así, aunque alguien
   estuviera de mirón, no podría leer convenios ajenos ni alterar el suyo.
   ========================================================================== */

/**
 * Los documentos que se firman desde fuera, y en qué se diferencian.
 *
 * Antes esto eran dos, y el código preguntaba `esContrato ? … : …` en seis
 * lugares distintos. Con un tercero —las órdenes de trabajo, que firma el
 * director— esa pregunta ya no alcanza: cada rama habría que abrirla a tres, y
 * el día que alguien agregue una y olvide otra, el enlace abre el documento
 * equivocado. Aquí se dice UNA VEZ en qué se diferencian y el resto no
 * pregunta.
 *
 * Todo lo que hay dentro son funciones a propósito: así este objeto se puede
 * declarar donde se lee mejor, sin depender de dónde estén definidas las que
 * llama.
 */
const DOCS_FIRMABLES = {
  convenios: {
    // En el buzón el convenio va PELADO, sin tipo adelante, como se mandó
    // siempre. Cambiarlo rompería las firmas que ya están en camino.
    prefijo: "",
    campoFirma: "firmaEmpresa",
    lista: () => state.convenios,
    sanea: d => saneaConv(d),
    abriendo: () => "su convenio",
    comoSeLlama: () => "carta-convenio",
    destinatario: v => v.destinatario || {},
    cuerpo: (v, c) => cuerpoConvenio(v, c),
    pdf: (v, c) => pdfDeConvenio(v, c),
    nombrePdf: (v, c) => nombrePdfConvenio(v, c),
    aplica: (v, firma) => cerrarConvenio(v, firma,
      "Firmado por el cliente desde el enlace que se le envió.", "")
  },
  contratos: {
    prefijo: "contratos:",
    campoFirma: "firmaCliente",
    lista: () => state.contratos,
    sanea: d => saneaContrato(d),
    abriendo: () => "su documento",
    comoSeLlama: v => infoTipoCt(v.tipo).name.toLowerCase(),
    destinatario: v => v.destinatario || {},
    cuerpo: (v, c) => cuerpoContrato(v, c),
    pdf: (v, c) => pdfDeDocumento(cuerpoContrato(v, c)),
    nombrePdf: (v, c) => nombrePdfContrato(v, c),
    aplica: (v, firma, f) => {
      v.firmaCliente = saneaFirma(firma);
      v.estado = "aceptado";
      /* La clave deja de servir en cuanto se firma: el enlace anda por
         WhatsApp y por correo, y un documento firmado no tiene por qué seguir
         abriéndose desde fuera. Igual que en los convenios. */
      v.tokenFirma = "";
      v.avisado = false;          // que el ejecutivo se entere al volver
      v.updatedAt = new Date().toISOString();
      registrarAuto(v.clienteId, `${infoTipoCt(v.tipo).name} ${v.folio} aceptada por el cliente`,
        `Firmó ${(f && f.nombre) || "el cliente"} desde el enlace que se le envió.`, ejecutivoDeCt(v));
      guardar();
    }
  },
  odts: {
    prefijo: "odts:",
    campoFirma: "firmaDirector",
    lista: () => state.odts,
    sanea: d => saneaOdt(d),
    abriendo: () => "la orden de trabajo",
    comoSeLlama: o => "orden de " + infoTipoOdt(o.tipo).name.toLowerCase(),
    // Una orden no va dirigida a un cliente: la pide un área del hotel.
    destinatario: () => ({}),
    cuerpo: o => cuerpoOdt(o),
    pdf: o => pdfDeDocumento(cuerpoOdt(o)),
    nombrePdf: o => nombrePdfOdt(o),
    aplica: (o, firma) => cerrarOdt(o, firma)
  }
};

const infoDoc = t => DOCS_FIRMABLES[t] || DOCS_FIRMABLES.convenios;

/**
 * De qué documento es una firma del buzón.
 *
 * El buzón guarda 'contratos:k123' y 'odts:o123', pero el convenio va pelado
 * —'v123'— porque así se mandó desde el primer día. Un prefijo que no
 * reconozcamos se trata como convenio, que es lo que era antes de que hubiera
 * prefijos.
 */
function docDelBuzon(crudo){
  const t = String(crudo || "");
  const i = t.indexOf(":");
  if (i > 0 && DOCS_FIRMABLES[t.slice(0, i)])
    return { tipo: t.slice(0, i), id: t.slice(i + 1) };
  return { tipo: "convenios", id: t };
}

const enlaceDeFirma = () => {
  const m = String(location.hash || "").match(/[#&]firmar=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try{
    const d = JSON.parse(deB64url(m[1]));
    if (!(d && d.v && d.t && d.u && d.k)) return null;
    /* Los enlaces que ya andan circulando no traen el tipo, y no hay que
       romperlos: cuando se generaron, lo único que se firmaba así era un
       convenio. */
    d.d = DOCS_FIRMABLES[d.d] ? d.d : "convenios";
    return d;
  }catch(e){ return null; }
};

function pantallaFirmaCliente(datos){
  // Se suelta la página a mano, además de por clase.
  //
  // El CRM fija el alto a la pantalla y esconde lo que sobra, porque son sus
  // columnas las que se desplazan. Un convenio de tres páginas necesita lo
  // contrario. Va en el propio elemento y no sólo en la hoja de estilos porque
  // esta pantalla la abre gente de fuera, en el teléfono que sea, y si una
  // regla se cuela por encima el cliente se queda sin poder llegar a firmar.
  document.documentElement.classList.add("modo-firma");
  document.documentElement.classList.remove("intro-activa");
  for (const el of [document.documentElement, document.body]){
    el.style.setProperty("height", "auto", "important");
    el.style.setProperty("min-height", "100%", "important");
    el.style.setProperty("max-height", "none", "important");
    el.style.setProperty("overflow", "visible", "important");
    el.style.setProperty("display", "block", "important");
    el.style.setProperty("position", "static", "important");
  }
  document.body.innerHTML = `<div id="firmaCliente"></div>`;
  const caja = document.getElementById("firmaCliente");
  const aviso = (clase, html) => { caja.innerHTML = `<div class="note ${clase}">${html}</div>`; };

  const info = infoDoc(datos.d);
  const comoSeLlama = info.abriendo();

  aviso("", "Abriendo " + comoSeLlama + "…");

  const pedir = (ruta, opciones = {}) => fetch(datos.u + ruta, Object.assign({}, opciones, {
    headers: Object.assign({
      apikey: datos.k, "Content-Type":"application/json", "x-firma-token": datos.t
    }, opciones.headers || {})
  }));

  /* El id en crm_datos SIEMPRE lleva su tipo adelante —'convenios:v1'—, aunque
     en el buzón de firmas el convenio vaya pelado. Son dos tablas distintas y
     cada una tiene su costumbre. */
  pedir(`/rest/v1/crm_datos?select=id,datos&id=eq.${
      encodeURIComponent(datos.d + ":" + datos.v)}`)
    .then(async r => {
      const txt = await r.text();
      if (!r.ok) throw new Error(`${r.status} · ${txt.slice(0,200)}`);
      const filas = JSON.parse(txt || "[]");
      if (!filas.length) throw new Error("vacio");
      return info.sanea(filas[0].datos);
    })
    .then(v => dibujarParaFirmar(caja, v, datos, pedir))
    .catch(e => {
      if (String(e.message) === "vacio")
        aviso("warn", `<b>Este enlace ya no sirve.</b><br><br>Puede ser que el documento ya se
          haya firmado, o que le hayan mandado un enlace nuevo. Pídale al hotel que se lo
          reenvíe.`);
      else if (/401|403|permission|policy/i.test(e.message)){
        // Mismo criterio que al firmar: se le dice, no se le encarga.
        console.error("No se pudo abrir el documento: " + e.message);
        aviso("warn", `<b>No es nada que usted haya hecho mal.</b><br><br>Al hotel le falta
          habilitar las firmas en su sistema, y hasta que lo haga este enlace no abre.
          No hace falta que usted haga nada más.`);
      }
      else
        aviso("warn", `<b>No se pudo abrir ${comoSeLlama}.</b><br>${esc(e.message)}
          <br><br>Revise su conexión y vuelva a abrir el enlace.`);
    });
}

function dibujarParaFirmar(caja, v, datos, pedir){
  const h = state.ajustes.hotel;
  const info = infoDoc(datos.d);
  /* Cómo se llama el papel que quien firma tiene enfrente. Un contrato de
     hospedaje puede ser cotización o contrato, y decirle "convenio" a lo que
     dice CONTRATO en el encabezado confunde a cualquiera. */
  const comoSeLlama = info.comoSeLlama(v);
  const dest = info.destinatario(v);
  const c = { empresa: v._empresa || dest.empresa || "",
              contacto: dest.contacto || "",
              ubicacion: dest.ubicacion || "",
              telefono: dest.telefono || "",
              email: dest.email || "" };
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  caja.innerHTML = `
    <div class="note"><b>Revise su ${esc(comoSeLlama)} y fírmela al final.</b>
      No hace falta instalar nada ni crear ninguna cuenta. Si prefiere firmarla en papel,
      use <i>Descargar en PDF</i> y devuélvasela a su ejecutivo.</div>
    <p style="text-align:right;margin:0 0 12px">
      <button class="btn" id="bBajarCli">Descargar en PDF</button></p>
    <div class="doc-body hoja-cliente">
      ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
      <div class="doc-contenido">${info.cuerpo(v, c)}</div>
    </div>
    <div id="zonaFirma" style="max-width:520px;margin:26px auto 0"></div>`;

  caja.querySelector("#bBajarCli").onclick = async e => {
    const b = e.currentTarget, antes = b.textContent;
    b.disabled = true; b.textContent = "Generando…";
    try{
      const bytes = await info.pdf(v, c);
      descargarBlob(new Blob([bytes], { type:"application/pdf" }), info.nombrePdf(v, c));
    }catch(err){ alert("No se pudo generar el PDF: " + err.message + "\n\nUse Imprimir del navegador."); }
    finally{ b.disabled = false; b.textContent = antes; }
  };

  const zona = caja.querySelector("#zonaFirma");
  if (v[info.campoFirma]){
    zona.innerHTML = `<div class="note"><b>Esto ya está firmado.</b> No hay nada más
      que hacer; conserve el PDF para sus registros.</div>`;
    return;
  }

  /* Al cliente no se le pide NADA más que firmar.

     Antes esto eran tres campos vacíos y el nombre era obligatorio: no se
     podía firmar sin escribirlo. Pero el hotel ya tiene esos datos —los
     capturó su ejecutivo en el destinatario, y van congelados dentro del
     propio documento—, así que se le estaba pidiendo lo que ya se sabe.

     Ahora ve un renglón con de quién es la firma que está dando, y los campos
     sólo aparecen si le pica a «Corregir». Es el mismo par que usa la firma
     capturada en la oficina (ver las llamadas a padFirma), para que las dos
     maneras de firmar digan lo mismo.

     Si no hay nada que poner —una orden de trabajo, que no va dirigida a un
     cliente— los campos arrancan destapados; siguen sin ser obligatorios. */
  const quienFirma = { nombre: c.contacto || "", celular: c.telefono || "" };
  const resumen = [quienFirma.nombre, quienFirma.celular].filter(Boolean).join(" · ");

  zona.innerHTML = `
    <h3 class="sec">Su firma</h3>
    ${resumen ? `<p class="hint" style="margin:0 0 10px">Firma como
      <b style="color:var(--text)">${esc(resumen)}</b>
      <button class="btn sm" type="button" id="cfCorregir"
        style="margin-left:6px">Corregir</button></p>` : ""}
    <div class="grid" id="cfDatos"${resumen ? ` style="display:none"` : ""}>
      <div class="full"><label class="lbl">Nombre completo</label>
        <input class="field" id="cfNombre" style="width:100%" autocomplete="name"
          value="${esc(quienFirma.nombre)}"></div>
      <div><label class="lbl">Puesto</label><input class="field" id="cfPuesto" style="width:100%"></div>
      <div><label class="lbl">Celular</label><input class="field" id="cfCel" style="width:100%"
        inputmode="tel" value="${esc(quienFirma.celular)}"></div>
    </div>
    <label class="lbl" style="margin-top:10px;display:block">Firme con el dedo o el ratón</label>
    <canvas class="sign-pad" id="pad"></canvas>
    <p><button class="btn sm" id="cfBorrar">Borrar y volver a firmar</button></p>
    <div id="cfErr"></div>
    <p><button class="btn ok" id="cfOk" style="width:100%;font-size:16px;padding:12px">
      Firmar</button></p>
    <p class="hint">Al firmar, su firma queda registrada con la fecha y la hora.</p>`;

  const limpiar = prepararPad(zona.querySelector("#pad"));
  zona.querySelector("#cfBorrar").onclick = limpiar;

  const bCorregir = zona.querySelector("#cfCorregir");
  if (bCorregir) bCorregir.onclick = () => {
    zona.querySelector("#cfDatos").style.display = "";   // vuelve a su .grid
    bCorregir.remove();
    zona.querySelector("#cfNombre").focus();
  };

  zona.querySelector("#cfOk").onclick = async e => {
    const err = zona.querySelector("#cfErr");
    const nombre = zona.querySelector("#cfNombre").value.trim();
    const pad = zona.querySelector("#pad");
    // Lo único que se le exige es la firma, que es lo que vino a hacer.
    if (!pad.dataset.trazado){ err.innerHTML = `<div class="errbox">Falta su firma.</div>`; return; }
    err.innerHTML = "";
    const b = e.currentTarget, antes = b.textContent;
    b.disabled = true; b.textContent = "Enviando…";
    try{
      const r = await pedir("/rest/v1/crm_firmas", {
        method:"POST",
        headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({
          // El buzón guarda el documento con su tipo adelante, salvo el
          // convenio, que va pelado como se mandó siempre. Lo dice el
          // descriptor; aquí no se decide nada.
          convenio_id: info.prefijo + datos.v, token: datos.t, nombre,
          puesto: zona.querySelector("#cfPuesto").value.trim(),
          celular: zona.querySelector("#cfCel").value.trim(),
          /* Sobre fondo blanco, no transparente. Una firma transparente se ve
             bien en la pantalla y sale como un borrón al imprimir el PDF; la
             del ejecutivo ya pasaba por aquí y la del cliente no. */
          img: padAPng(pad)
        })
      });
      if (!r.ok) throw new Error(`${r.status} · ${(await r.text()).slice(0,200)}`);
      caja.innerHTML = `<div class="note" style="border-left:3px solid var(--ok)">
        <b>Listo${nombre ? ", " + esc(nombre) : ""}. Su ${esc(comoSeLlama)} quedó
        firmada.</b><br><br>
        El hotel ya fue notificado. Si quiere guardar una copia, vuelva a abrir este enlace
        antes de cerrarlo y use <i>Descargar en PDF</i>.</div>`;
      window.scrollTo(0, 0);
    }catch(ex){
      /* Lo que ve aquí es un CLIENTE del hotel, no un técnico.

         No se le enseña el error crudo del servidor —«new row violates
         row-level security policy for table crm_firmas» es lo que vio un
         cliente de verdad—, no se le pide que avise a nadie y no se le
         encarga nada: se le dice qué pasó, de quién es, y ya.

         A quien le toca arreglarlo se lo dice el renglón «Buzón de firmas»
         de Ajustes → Nube y equipo → Probar conexión, sin que ningún cliente
         se tenga que topar con esto para que el hotel se entere. */
      const m = String(ex.message || "");
      console.error("No se pudo depositar la firma: " + m);
      const deRegla = /401|403|permission|policy|42501|row-level/i.test(m);
      err.innerHTML = deRegla
        ? `<div class="note warn" style="margin:0"><b>No es nada que usted haya hecho
           mal.</b> Al hotel le falta habilitar las firmas en su sistema, y hasta que lo
           haga esta pantalla no puede recibir la suya. No hace falta que usted haga
           nada más.</div>`
        : `<div class="errbox"><b>No se pudo registrar la firma en este momento.</b>
           Puede ser la conexión. Su firma no se borró: vuelva a darle a <i>Firmar</i>
           en un momento.</div>`;
      b.disabled = false; b.textContent = antes;
    }
  };
}

/* ==========================================================================
   LAS ÓRDENES DE TRABAJO · la pantalla

   Lo que se hace aquí no es capturar —eso lo hace el jefe que pide, desde su
   enlace—: es REPARTIR y DAR SEGUIMIENTO. De un vistazo hay que poder ver qué
   está detenido esperando la firma del director, qué no tiene quién lo trabaje,
   y qué ya se entregó.
   ========================================================================== */

let filtroOdt = { q:"", tipo:"", estado:"", sinAsignar:false };

/** ¿A esta persona le toca ver las órdenes de trabajo? */
const veOdts = () => puedeVer("odts");


/* ==========================================================================
   CERTIFICADOS DE CORTESÍA · la pantalla

   Lo que hay que poder hacer de un vistazo: ver cuáles andan vigentes, cuál se
   le dio a quién y con qué folio, y emitir uno nuevo sin que el número se
   repita. Lo demás —el formato, las condiciones, la redacción de la fecha—
   sale solo, que es justamente lo que no pasaba cuando se hacían a mano.
   ========================================================================== */

function renderCertificados(){
  const cont = document.getElementById("tblCertificados");
  const q = String(filtros.q || "").toLowerCase();
  const cs = state.certificados
    .filter(c => !q || (c.folio + " " + c.paraQuien + " " + tituloCert(c) +
                        " " + infoTipoCert(c.tipo).name).toLowerCase().includes(q))
    .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const repetidos = cs.filter(c => c.folioRepetido);

  const cab = avisoFoliosRepetidos(SERIES_FOLIO.certificados, repetidos) +
    `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <b style="font-size:15px">Certificados de cortesía</b>
      <span class="hint">${cs.length} en total</span>
      <span style="flex:1"></span>
      <button class="btn primary" id="bNuevoCert">+ Nuevo certificado</button></div>
    <div class="note">Una cortesía con folio del hotel. El número lo reparte el servidor, así
      que <b>no se repite</b> aunque dos personas emitan al mismo tiempo, y la fecha de validez
      se redacta sola. Una vez emitido ya no se edita —su folio anda impreso—: se marca como
      usado o se cancela.</div>`;

  if (!cs.length){
    cont.innerHTML = cab + `<div class="vacio">Todavía no hay certificados.<br>
      Se crean con el botón de arriba.</div>`;
    cont.querySelector("#bNuevoCert").onclick = () => editarCertificado(null);
    return;
  }

  cont.innerHTML = cab + `<table class="data">
    <thead><tr><th>Folio</th><th>Tipo</th><th>A nombre de</th><th>Vigencia</th>
      <th>Estado</th><th>Emitido</th><th></th></tr></thead>
    <tbody>${cs.map(c => {
      const e = ESTADOS_CERT[c.estado] || ESTADOS_CERT.borrador;
      return `<tr class="row-link" data-id="${c.id}">
        <td><b>${esc(c.folio || "—")}</b>${c.folioRepetido
          ? ` <span class="pill" style="background:var(--bad-soft);color:var(--bad)"
               title="Otro certificado del hotel tiene este mismo folio">repetido</span>` : ""}</td>
        <td class="nowrap">${esc(infoTipoCert(c.tipo).name)}</td>
        <td>${esc(c.paraQuien || "—")}<div class="hint">${esc(tituloCert(c))}</div></td>
        <td class="nowrap">${esc(vigenciaCert(c) || "—")}</td>
        <td><span class="estado-chip" style="background:${e.bg};color:${e.fg}">${esc(e.name)}</span></td>
        <td class="nowrap">${c.emitidoEn
          ? esc(fechaCorta(c.emitidoEn)) + `<div class="hint">${esc(c.emitidoPor || "")}</div>`
          : "—"}</td>
        <td class="nowrap"><button class="btn sm" data-ver="${c.id}">Ver</button></td>
      </tr>`;
    }).join("")}</tbody></table>`;

  cont.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", ev => {
    const v = ev.target.closest("[data-ver]");
    if (v){ ev.stopPropagation(); verCertificado(v.dataset.ver); return; }
    const c = state.certificados.find(x => x.id === tr.dataset.id);
    if (c && c.estado === "borrador") editarCertificado(c.id); else verCertificado(tr.dataset.id);
  }));
  engancharRenumTodos(cont, SERIES_FOLIO.certificados, cs, repetidos);
  cont.querySelector("#bNuevoCert").onclick = () => editarCertificado(null);
}

/** Capturar o corregir uno que todavía es borrador. */
function editarCertificado(id){
  const nuevo = !id;
  const c = nuevo ? saneaCertificado({}) : state.certificados.find(x => x.id === id);
  if (!c) return;
  if (!nuevo && c.estado !== "borrador"){ verCertificado(c.id); return; }

  const opc = Object.entries(TIPOS_CERT).map(([k, t]) =>
    `<option value="${k}"${k === c.tipo ? " selected" : ""}>${esc(t.name)}</option>`).join("");

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${nuevo ? "Nuevo certificado" : "Certificado " + esc(c.folio || "")}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
       <div class="cert-captura">
        <div class="cert-campos">
        <div class="grid">
          <div><label class="lbl">Tipo de cortesía</label>
            <select class="field" id="ceTipo" style="width:100%">${opc}</select></div>
          <div><label class="lbl">Cliente</label>
            <input class="field" id="ceQuien" style="width:100%" value="${esc(c.paraQuien)}"
              placeholder="Se teclea: una persona, una empresa o un evento"></div>
          <div><label class="lbl">Válido desde</label>
            <input class="field" id="ceDesde" type="date" style="width:100%" value="${esc(c.desde)}"></div>
          <div><label class="lbl">Válido hasta</label>
            <input class="field" id="ceHasta" type="date" style="width:100%" value="${esc(c.hasta)}"></div>
          <div class="full"><label class="lbl">Lo que dice en grande</label>
            <textarea class="field" id="ceTitulo" style="width:100%;height:54px"
              >${esc(tituloCert(c))}</textarea>
            <div class="hint">Dos renglones: arriba el servicio, abajo «DE CORTESÍA».
              Entre los dos va la rayita del machote.</div></div>
          <div class="full"><label class="lbl">Información de la cortesía</label>
            <textarea class="field" id="ceCond" style="width:100%;height:84px"
              >${esc(condicionesCert(c))}</textarea>
            <div class="hint">Los dos se llenan solos al escoger el tipo, y se pueden corregir.
              El contacto y la firma salen de <i>Ajustes → Hotel</i>.</div></div>
          <div class="full"><label class="lbl">Nota interna</label>
            <input class="field" id="ceNotas" style="width:100%" value="${esc(c.notas)}"
              placeholder="Por qué se dio. No sale impresa."></div>
        </div>
        <div id="ceErr" style="margin-top:10px"></div>
        </div>

        <div class="cert-previa" style="--z:.42">
          <label class="lbl">Así va a salir</label>
          <div class="cert-mini" id="cePrevia"></div>
          <div id="ceFalta"></div>
        </div>
       </div>
      </div>
      <div class="modal-foot">
        ${!nuevo ? `<button class="btn danger" id="ceBorrar">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="ceGuardar">Guardar borrador</button>
        <button class="btn primary" id="ceEmitir">Emitir con folio</button>
      </div>
    </div>`);

  const q = sel => ov.querySelector(sel);

  /* Escoger el tipo LLENA los dos textos, no los sugiere nada más.

     Antes iban como sugerencia gris y había que escribirlos, o dejarlos
     vacíos y confiar en que al imprimir saliera el del tipo. Eso es pedirle a
     alguien que teclee lo que la aplicación ya sabe —y es exactamente de
     donde salían las tres redacciones distintas de la misma condición en el
     PowerPoint—. Ahora se escoge el servicio y los textos aparecen escritos,
     listos para corregir si ese certificado trae algo especial.

     Lo que sí se cuida: no pisar lo que alguien haya escrito: sólo se reescribe lo que esté
     vacío o siga siendo, palabra por palabra, el texto del tipo anterior. Así
     cambiar de tipo por equivocación no borra una redacción hecha a mano. */
  let tipoAnterior = c.tipo;
  q("#ceTipo").onchange = e => {
    const antes = infoTipoCert(tipoAnterior), ahora = infoTipoCert(e.target.value);
    const campo = (sel, viejo, nuevoTexto) => {
      const el = q(sel), v = el.value.trim();
      if (!v || v === viejo) el.value = nuevoTexto;
    };
    campo("#ceTitulo", antes.titulo, ahora.titulo);
    campo("#ceCond", antes.condiciones, ahora.condiciones);
    tipoAnterior = e.target.value;
  };

  /* Lo tecleado, tal cual, SIN tocar el certificado ni el estado. La vista
     previa lo necesita a cada rato y un borrador a medias no tiene nada que
     hacer en la cartera hasta que alguien le pique a Guardar. */
  const leerCampos = () => ({
    tipo:        q("#ceTipo").value,
    paraQuien:   q("#ceQuien").value.trim(),
    desde:       q("#ceDesde").value,
    hasta:       q("#ceHasta").value,
    titulo:      q("#ceTitulo").value.trim(),
    condiciones: q("#ceCond").value.trim(),
    notas:       q("#ceNotas").value.trim()
  });

  const recoger = () => {
    Object.assign(c, leerCampos());
    c.updatedAt = new Date().toISOString();
    if (nuevo && !state.certificados.includes(c)) state.certificados.push(c);
  };

  /* -----------------------------------------------------------------------
     La hoja, mientras se captura.

     Marco dijo que el certificado «sigue sin insertar la imagen»: la estaba
     buscando AQUÍ, y aquí no había nada que ver —la foto sólo aparecía
     después de guardar—. Se pinta con las MISMAS funciones de la hoja de
     verdad, así que lo que se ve capturando es literalmente lo que se
     imprime. `fondosCert` guarda la foto por tipo, así que sólo la primera
     cuesta algo.
     ----------------------------------------------------------------------- */
  let turnoPrevia = 0, tiempoPrevia = null;

  async function pintarPrevia(){
    const mio = ++turnoPrevia;
    const copia = saneaCertificado(Object.assign({}, c, leerCampos()));
    const fondo = await fondoCertificado(copia.tipo);
    if (mio !== turnoPrevia || !ov.isConnected) return;   // llegó tarde: ya hay otra
    q("#cePrevia").innerHTML =
      `<div class="cert-marco">${cuerpoCertificado(copia, fondo)}</div>`;
    q("#ceFalta").innerHTML = avisoPendientesCert(copia.tipo, "ceIrAjustes");
    const ir = q("#ceIrAjustes");
    if (ir) ir.onclick = () => {
      ov.remove();
      vista = "ajustes"; render();
      const campo = document.getElementById("hDirector");
      if (campo){ campo.scrollIntoView({ block:"center", behavior:"smooth" }); campo.focus(); }
    };
  }

  /* Antirrebote: tecleando un nombre largo no se vuelve a armar la hoja en
     cada letra. */
  const repintar = () => { clearTimeout(tiempoPrevia); tiempoPrevia = setTimeout(pintarPrevia, 120); };
  ["#ceTipo", "#ceQuien", "#ceDesde", "#ceHasta", "#ceTitulo", "#ceCond"].forEach(sel => {
    q(sel).addEventListener("input", repintar);
    q(sel).addEventListener("change", repintar);
  });
  pintarPrevia();

  q("#ceGuardar").onclick = () => { recoger(); guardar(); render(); ov.remove(); };

  const bb = q("#ceBorrar");
  if (bb) bb.onclick = () => {
    if (!confirm("¿Eliminar este borrador? No se puede deshacer.")) return;
    state.certificados = state.certificados.filter(x => x.id !== c.id);
    guardar(); render(); ov.remove();
  };

  q("#ceEmitir").onclick = async e => {
    recoger();
    if (!c.paraQuien){
      q("#ceErr").innerHTML = `<div class="errbox">Falta el cliente al que va dirigido.</div>`;
      return;
    }
    if (!c.hasta){
      q("#ceErr").innerHTML = `<div class="errbox">Falta hasta cuándo vale. Un certificado
        sin fecha de vencimiento no se puede dar por terminado nunca.</div>`;
      return;
    }
    const b = e.currentTarget, antes = b.textContent;
    b.disabled = true; b.textContent = "Pidiendo el folio…";
    const folio = await folioParaFirmar(c, "certificados", "CE", anioCertificado(c),
                                        () => folioCertificado(anioCertificado(c), c.id));
    b.disabled = false; b.textContent = antes;
    /* Sin número garantizado NO se emite. Es la regla que pidió Marco y es la
       misma de los convenios: un folio adivinado es exactamente como se
       repitieron los del PowerPoint. Y como no se apartó nada, tampoco se
       gastó un número. */
    if (!folio){ alert(AVISO_SIN_CONTADOR); return; }
    c.folio = folio;
    c.estado = "emitido";
    c.emitidoPor = miNombre() || correoSesion();
    c.emitidoEn = new Date().toISOString();
    c.updatedAt = c.emitidoEn;
    guardar(); render(); ov.remove();
    verCertificado(c.id);
  };
}

/** Verlo como va a quedar, bajarlo y marcarlo. */
function verCertificado(id){
  const c = state.certificados.find(x => x.id === id);
  if (!c) return;
  const e = ESTADOS_CERT[c.estado] || ESTADOS_CERT.borrador;

  const ov = modal(`
    <div class="modal" style="max-width:720px">
      <div class="modal-head"><h2>Certificado ${esc(c.folio || "sin folio")}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 10px">
          <span class="estado-chip" style="background:${e.bg};color:${e.fg}">${esc(e.name)}</span>
          <span class="hint" style="margin-left:8px">${esc(infoTipoCert(c.tipo).name)}${
            c.emitidoEn ? " · emitido el " + esc(fechaCorta(c.emitidoEn)) +
            (c.emitidoPor ? " por " + esc(c.emitidoPor) : "") : ""}</span></p>
        <div id="ceVista" style="height:530px;overflow:hidden"><p class="hint">Dibujando…</p></div>
        ${c.notas ? `<p class="hint" style="margin-top:10px"><b>Nota interna:</b>
          ${esc(c.notas)}</p>` : ""}
      </div>
      <div class="modal-foot">
        ${c.estado === "emitido" ? `<button class="btn" id="ceUsado">Marcar como usado</button>
          <button class="btn danger" id="ceCancelar">Cancelar certificado</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cerrar</button>
        <button class="btn primary" id="cePdf">Descargar en PDF</button>
      </div>
    </div>`);

  (async () => {
    const caja = ov.querySelector("#ceVista");
    const fondo = await fondoCertificado(c.tipo);
    if (!ov.isConnected) return;
    // La hoja mide 816 px; .cert-mini la encoge Y encoge el lugar que ocupa.
    caja.innerHTML = `<div class="cert-mini" style="--z:.49">
      <div class="cert-marco">${cuerpoCertificado(c, fondo)}</div></div>
      ${avisoPendientesCert(c.tipo, "cvIrAjustes")}`;

/**
 * A quién se le puede asignar una orden.
 *
 * A marketing, y a la coordinadora NO. Ella reparte; si se pudiera asignar a
 * sí misma, la columna dejaría de decir quién lo está trabajando —que es lo
 * único que esa columna tiene que decir—.
 */
function quienesTrabajanOdts(){
  /* Fuera dos grupos. La dirección y la administración alcanzan los tres
     departamentos, pero no trabajan encargos: es la misma exclusión que ya
     hace selectEjecutivo con nombresSinBitacora(). Y fuera la coordinación,
     que reparte. */
  const fuera = nombresSinBitacora();
  for (const u of state.usuarios)
    if (u.rol === "gte_marketing") fuera.add(String(u.nombre || "").trim().toLowerCase());
  return nombresDelDepto("marketing")
    .filter(n => !fuera.has(String(n).trim().toLowerCase()));
}

const odtsVisibles = () => {
  const q = filtroOdt.q.trim().toLowerCase();
  return state.odts.filter(o => {
    if (filtroOdt.tipo && o.tipo !== filtroOdt.tipo) return false;
    if (filtroOdt.estado && o.estado !== filtroOdt.estado) return false;
    if (filtroOdt.sinAsignar && String(o.asignadoA || "").trim()) return false;
    if (!q) return true;
    return [o.folio, o.departamento, o.solicitante, o.email, o.objetivo,
            o.elementos, o.notas, o.asignadoA].join(" ").toLowerCase().includes(q);
  }).sort((a, b) => String(b.fecha || b.createdAt).localeCompare(String(a.fecha || a.createdAt)));
};

/**
 * Si las órdenes están entrando o no.
 *
 * Sin esto, el día que el buzón no esté montado los jefes de área llenarían el
 * formulario, verían "gracias", y nada llegaría. Nadie se enteraría hasta que
 * alguien preguntara por qué marketing no ha hecho su pieza.
 */
function tiraOdts(){
  if (!nubeActiva()) return "";
  if (nube.sinBuzonOdts)
    return `<div class="note warn"><b>El buzón de órdenes todavía no está montado.</b>
      Las que se levanten desde la liga no van a llegar. Se corre <code>odts.sql</code> en
      Supabase; el paso a paso está en <b>ODTS.md</b>.</div>`;
  return "";
}

/**
 * La liga que se les reparte a los jefes de área.
 *
 * Es una sola y fija, como la del lobby. Se copia aquí y se manda por correo o
 * por WhatsApp a recepción, ama de llaves, alimentos y bebidas, ventas,
 * banquetes y mantenimiento.
 */
async function copiarLigaOdt(){
  const t = tokenOdt();
  if (!t){
    alert("Todavía no hay clave para esta liga.\n\n" +
          "La crea el administrador: pídele que entre a Ajustes una vez y la publique.");
    return;
  }
  /* Antes aquí decía «sincroniza y vuelve a intentarlo»: mandar a hacer a mano
     algo que el botón puede hacer solo. Ahora lo hace —y sólo si después de
     eso la clave sigue sin estar, se dice, y se dice POR QUÉ—. */
  if (!(await clavePublicada(t))){
    try{ await sincronizar(); }catch(e){}
    if (!(await clavePublicada(t))){
      alert(nube.estado === "error" || !navigator.onLine
        ? "No se pudo confirmar la clave con el servidor: revisa la conexión y vuelve a " +
          "intentarlo.\n\nLa liga no se copió para que no repartas una que no abre."
        : "La clave de esta liga todavía no está en el servidor, así que la liga no " +
          "abriría.\n\nLa publica el administrador: pídele que entre al CRM una vez. " +
          "Es una sola vez, y a partir de ahí la liga sirve para siempre.");
      return;
    }
  }
  const liga = ligaDeOdt();
  const ok = () => alert("Liga copiada.\n\nMándasela a los jefes de área: con ella levantan " +
                         "sus órdenes y las firman, sin cuenta ni contraseña.");
  if (navigator.clipboard) navigator.clipboard.writeText(liga).then(ok, () => prompt("Copia la liga:", liga));
  else prompt("Copia la liga:", liga);
}

/* El almacén de marketing, aparte del de los convenios firmados. */
const DEPOSITO_ODTS = "odts";

/**
 * De YouTube y de Vimeo se puede enseñar el video sin salir del CRM. De lo
 * demás —Drive, Dropbox, WeTransfer— no: cada uno tiene su propia manera de
 * bloquear que lo metan en una ventana ajena, y un recuadro en blanco se ve
 * peor que un botón honesto.
 */
function videoEmbebible(url){
  const u = String(url || "");
  let m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if (m) return "https://www.youtube.com/embed/" + m[1];
  m = u.match(/vimeo\.com\/(?:video\/)?(\d{6,})/);
  if (m) return "https://player.vimeo.com/video/" + m[1];
  return "";
}

            <button class="btn sm" data-verent="${i}" style="flex:1">Ver</button>
            ${mia ? `<button class="btn sm" data-quitent="${i}">✕</button>` : ""}
          </div>
        </div>`).join("")}</div>`
    : `<p class="hint">Todavía no se ha subido nada.</p>`) +
    (mia && o.estado !== "cancelada" ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="bEntArchivo">Subir el producto</button>
      <button class="btn" id="bEntEnlace">Pegar el enlace de un video</button>
      ${o.entregas.length && o.estado !== "entregada"
        ? `<button class="btn ok" id="bEntListo">Marcar como entregada</button>` : ""}
    </div>
    <p class="hint" style="margin-top:6px">Las imágenes, los PDF y los videos de hasta
      ${pesoLegible(MAX_ENTREGA_ODT)} se suben y se ven aquí. Lo que pese más —un master de
      edición— va por enlace, con su portada.</p>` : "");

  caja.querySelectorAll("[data-verent]").forEach(b =>
    b.onclick = () => verEntrega(o, +b.dataset.verent));
  caja.querySelectorAll("[data-quitent]").forEach(b =>
    b.onclick = () => {
      if (!confirm("¿Quitar esta entrega de la orden?")) return;
      o.entregas.splice(+b.dataset.quitent, 1);
      o.updatedAt = new Date().toISOString();
      guardar(); pintaEntregas(ov, o); render();
    });

  // La portada de cada entrega, traída del almacén sin trabar la pantalla.
  o.entregas.forEach((x, i) => {
    const ruta = x.clase === "enlace" ? x.portada : (/^image\//.test(x.tipoMime) ? x.ruta : "");
    if (!ruta || !nubeActiva()) return;

  const bE = caja.querySelector("#bEntEnlace");
  if (bE) bE.onclick = () => subirEntrega(o, ov, "enlace");
  const bL = caja.querySelector("#bEntListo");

    o.estado = "entregada";
    o.updatedAt = new Date().toISOString();
    guardar(); render(); ov.remove(); verOdt(o.id);
  };

  const x = o.entregas[i];

    return verEscaneado({ archivo:x.nombre, ruta:x.ruta, tipoMime:x.tipoMime, quien:x.quien },

    const nombre = q("#enNombre").value.trim();
    if (!nubeActiva()) return falla("Hace falta estar conectado a la nube para guardar archivos.");

    const b = ev.currentTarget, antes = b.textContent;
    b.disabled = true; b.textContent = "Guardando…";
    try{
      if (esEnlace){
        const url = q("#enUrl").value.trim();
        if (!/^https?:\/\/\S+$/i.test(url)){
          falla("Pega la dirección completa del video, la que empieza con <b>https://</b>.");
          b.disabled = false; b.textContent = antes; return;
        }
        let portada = "";
        const f = q("#enPortada").files[0];
        if (f){
          if (f.size > MAX_ENTREGA_ODT){
            falla(`La portada pesa ${pesoLegible(f.size)} y el tope son ${pesoLegible(MAX_ENTREGA_ODT)}.`);
            b.disabled = false; b.textContent = antes; return;
          }
          portada = await subirEscaneo(f, DEPOSITO_ODTS);
        }
        o.entregas.push(saneaEntrega({ clase:"enlace", nombre: nombre || "Video", url, portada,
          cuando: new Date().toISOString(), quien: miNombre() }));
      } else {
        const f = q("#enArchivo").files[0];
        if (!f){
          falla("Escoge el archivo.");
          b.disabled = false; b.textContent = antes; return;
        }
        if (f.size > MAX_ENTREGA_ODT){
          falla(`El archivo pesa ${pesoLegible(f.size)} y el tope son ${pesoLegible(MAX_ENTREGA_ODT)}.<br>
            Si es un master de edición, usa el botón del enlace y sube una portada.`);
          b.disabled = false; b.textContent = antes; return;
        }
        const ruta = await subirEscaneo(f, DEPOSITO_ODTS);
        o.entregas.push(saneaEntrega({ clase:"archivo", nombre: nombre || f.name, ruta,
          tipoMime: f.type, tam: f.size,
          cuando: new Date().toISOString(), quien: miNombre() }));
      }
      o.updatedAt = new Date().toISOString();
      guardar(); render();
      ov.remove();
      pintaEntregas(padre, o);
    }catch(err){
      falla("No se pudo guardar.<br><span class=\"hint\">" + esc(err.message) + "</span><br>" +
            "Si dice <i>Bucket not found</i>, falta correr <code>odts.sql</code>.");
      b.disabled = false; b.textContent = antes;
    }
  };
}

/**
 * El enlace que se le manda al cliente para que firme en su pantalla.
 *
 * Sirve para un convenio o para un contrato. El tipo viaja en 'd'; los enlaces
 * que ya se mandaron no lo traen, y ésos se siguen leyendo como convenios, que
 * es lo único que existía cuando se generaron.
 */
const ligaFirma = (doc, tipo) =>
  location.origin + location.pathname + "#firmar=" +
  /* Una versión atrás esto llevaba dentro el teléfono del hotel, para que el
     cliente pudiera avisar si la firma fallaba. Se quitó: al cliente no se le
     encarga nada. Las ligas que ya andan circulando lo traen y no pasa nada,
     porque el lector ignora lo que no usa. */
  b64url(JSON.stringify({ v: doc.id, d: DOCS_FIRMABLES[tipo] ? tipo : "convenios",
                          t: doc.tokenFirma, u: nube.url, k: nube.anon }));

/** Cómo se llama ese documento en el buzón de firmas. */
const idEnBuzon = (doc, tipo) => infoDoc(tipo).prefijo + doc.id;

const puedeMandarLiga = () => !!(nube.url && nube.anon);

/* ==========================================================================
   NO SE REPARTE UN ENLACE QUE NO VA A FUNCIONAR

   Un cliente de verdad leyó su convenio, lo firmó con el dedo, y al mandarlo
   le salió un error de base de datos: al servidor le faltaba la regla que lo
   deja depositar su firma. El ejecutivo le había mandado un enlace que nunca
   pudo funcionar, y nadie podía saberlo hasta que el cliente se topó con eso.

   Eso es lo que se cierra aquí. Antes de ponerle a nadie un enlace de firma en
   la mano se le pregunta al servidor si el buzón está montado. Si no lo está,
   el enlace NO se ofrece y se dice por qué, en la pantalla del ejecutivo, que
   es quien puede hacer algo al respecto.

   Se pregunta una vez por sesión: la respuesta no cambia sola, y el ejecutivo
   no tiene por qué esperar a una consulta cada vez que manda un documento.
   ========================================================================== */
/* Sólo se recuerda el SÍ.

   Un «no» es una tarea pendiente, y en cuanto alguien corra firmas.sql deja de
   ser verdad. Si se guardara, el aviso seguiría saliendo hasta que el ejecutivo
   recargara la página — y nadie recarga una página para ver si un aviso se fue.
   Un «sí» no se deshace solo, así que ése sí se guarda. */
let _buzonOk = false;

async function buzonMontado(){
  if (!nubeActiva()) return true;          // sin nube no se ofrecen enlaces
  if (_buzonOk) return true;
  try{
    const r = await fetch(nube.url + "/rest/v1/rpc/crm_buzon_ok", {
      method:"POST",
      headers:{ apikey: nube.anon, "Content-Type":"application/json",
        Authorization: "Bearer " + ((nube.sesion && nube.sesion.access_token) || nube.anon) },
      body: "{}"
    });
    // 404: ni siquiera existe la pregunta, así que firmas.sql no se ha corrido.
    _buzonOk = r.status !== 404 && (await r.text()).trim() === "true";
  }catch(e){
    /* Si falló la red no se estorba: el ejecutivo puede estar sin señal, y
       eso no es razón para quitarle el enlace. Se vuelve a preguntar luego. */
    return true;
  }
  return _buzonOk;
}

/** Lo que ve el EJECUTIVO cuando el enlace no tiene a dónde llegar. */
const avisoSinBuzon = () => `
  <div class="note warn" id="avisoSinBuzon"><b>El enlace de firma todavía NO funciona.</b>
    Si se lo mandas, el cliente va a leer el documento, lo va a firmar con el dedo
    y su firma <b>no se va a poder registrar</b>. Al servidor le falta el buzón de firmas.
    <p style="margin:10px 0 0"><button class="btn primary" type="button"
      onclick="panelCorrerSql('firmas')">Arreglar esto</button></p>
    <p class="hint" style="margin:10px 0 0">Son dos minutos y lo puede hacer quien tenga la
      cuenta de Supabase. Mientras tanto este documento <b>sí se puede cerrar</b>: mándale el
      PDF y, cuando te lo devuelva firmado, súbelo con <i>Subir uno firmado</i>; o si firma
      delante de ti, usa <i>Registrar firma del cliente</i>. Queda igual de cerrado.</p></div>`;

/* ==========================================================================
   ARREGLAR EL BUZÓN SIN SALIR DEL CRM

   Antes esto decía «hay que correr firmas.sql completo», y ahí se acababa la
   ayuda: a quien lo lee le tocaba encontrar el archivo, abrirlo, seleccionarlo
   entero y pegarlo. Ese «seleccionarlo entero» es justo donde se rompió la vez
   pasada —un pegado cortado dejó el buzón cerrado—, así que ya no pasa por las
   manos de nadie: el botón trae el archivo del propio servidor del CRM, donde
   se publica junto al index.html, y lo deja en el portapapeles COMPLETO.

   Y al final se vuelve a preguntar, ahí mismo. Sin eso, el que lo corre se
   queda sin saber si sirvió.
   ========================================================================== */
/**
 * El mismo SQL, sin un solo comentario.
 *
 * Los archivos son de 150 a 360 renglones y la mayor parte son explicaciones.
 * Eso importa porque el pegado SE HA CORTADO TRES VECES —el de las ODTs,
 * firmas.sql y folios.sql— y lo que queda del lado de allá es un archivo a
 * medias. Sin comentarios la mayoría cabe de sobra.
 *
 * `senia` es algo que ese archivo TIENE que traer. Si al terminar no aparece,
 * se manda el archivo tal cual: más vale largo que mutilado.
 */
function sqlSinComentarios(texto, senia){
  const sinBloques = String(texto).replace(/^[ \t]*\/\*[\s\S]*?\*\/[ \t]*$/gm, "");
  const lineas = sinBloques.split("\n")
    .filter(l => l.trim() && !l.trim().startsWith("--"));
  const corto = lineas.join("\n") + "\n";
  const sano = /^begin;/.test(corto) &&
               /commit;/.test(corto) &&
               corto.includes(senia) &&
               corto.trim().endsWith("as resultado;");
  return sano ? corto : String(texto);
}

/** ¿El contador de folios está montado? */

    return true;
