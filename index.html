<style>
  /* Identidad CORE: morado #39104e, oro #b2aa6d y blanco.
     Los tres estados con significado —logrado, pendiente y perdido— usan
     tonos derivados de esa paleta para no perder la lectura. */
  :root{
    --bg:#f2f0f5; --panel:#ffffff; --panel-2:#faf9fc; --col:#eae7ef;
    --text:#2b0d3a; --muted:#6f6279; --line:#e0dbe7;
    --accent:#39104e; --accent-soft:#efe9f4; --ink-solido:#ffffff;
    --logo-morado:#39104e;
    --oro:#b2aa6d; --oro-tinta:#6d6634; --oro-suave:#f4f2e4;
    --ok:#6d6634; --ok-soft:#f2efdf;
    --bad:#a33b3b; --bad-soft:#fbeaea;
    --warn:#8a5a2b; --warn-soft:#f9efe4;
    --shadow:0 1px 2px rgba(57,16,78,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#150a1c; --panel:#211029; --panel-2:#2a1734; --col:#1a0d22;
      --text:#f2ecf6; --muted:#a795b1; --line:#382544;
      --accent:#b98fd6; --accent-soft:#2e1840; --ink-solido:#1a0b23;
      --logo-morado:#cbb0de;
      --oro:#b2aa6d; --oro-tinta:#cec68c; --oro-suave:#2c2a17;
      --ok:#cec68c; --ok-soft:#2c2a17;
      --bad:#f08b8b; --bad-soft:#331616;
      --warn:#d79a5e; --warn-soft:#33210f;
      --shadow:0 1px 2px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#150a1c; --panel:#211029; --panel-2:#2a1734; --col:#1a0d22;
    --text:#f2ecf6; --muted:#a795b1; --line:#382544;
    --accent:#b98fd6; --accent-soft:#2e1840; --ink-solido:#1a0b23;
    --logo-morado:#cbb0de;
    --oro:#b2aa6d; --oro-tinta:#cec68c; --oro-suave:#2c2a17;
    --ok:#cec68c; --ok-soft:#2c2a17;
    --bad:#f08b8b; --bad-soft:#331616;
    --warn:#d79a5e; --warn-soft:#33210f;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }

  /* ---------- Animación de entrada ----------
     Va con pointer-events:none para no tapar nada mientras dura, y se retira
     sola del DOM. Con "reducir movimiento" activado no llega ni a mostrarse. */
  #intro{
    position:fixed; inset:0; z-index:200; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:radial-gradient(circle at 50% 45%, #4a1a63 0%, #2b0b3c 55%, #17061f 100%);
    transition:background .55s ease-out;
  }
  /* Al final el logo no se desvanece: viaja hasta el botón de inicio y se
     tiñe con los colores del encabezado, para que el relevo no se note. */
  #intro.vuelo{background:radial-gradient(circle at 50% 45%, #4a1a6300 0%, #17061f00 100%)}
  #intro svg{width:150px; height:150px; overflow:visible;
    transition:transform .8s cubic-bezier(.6,0,.3,1)}
  #intro.vuelo .marca{opacity:0; transition:opacity .3s ease-out}
  #intro.vuelo .hex{stroke:var(--logo-morado); transition:stroke .55s ease-out .2s}
  #intro.vuelo .flechas{stroke:var(--oro); transition:stroke .55s ease-out .2s}
  #intro.vuelo .nucleo{fill:var(--logo-morado); transition:fill .55s ease-out .2s}
  /* Mientras el logo va en camino, el del encabezado se oculta: si no,
     se verían dos a la vez. */
  .intro-activa .brand .logo{visibility:hidden}
  #intro .hex{
    fill:none; stroke:#b2aa6d; stroke-width:6;
    stroke-dasharray:276; stroke-dashoffset:276;
    animation:intro-trazo .75s cubic-bezier(.4,0,.2,1) .1s forwards;
  }
  #intro .fl{opacity:0; animation:intro-flecha .55s cubic-bezier(.34,1.3,.64,1) forwards}
  #intro .nucleo{
    fill:#b2aa6d; transform:scale(0); transform-origin:60px 60px;
    animation:intro-nucleo .5s cubic-bezier(.34,1.56,.64,1) .95s forwards;
  }
  #intro .marca{
    color:#fff; font-size:26px; font-weight:800; letter-spacing:.42em; text-indent:.42em;
    opacity:0; animation:intro-marca .6s ease-out 1.05s forwards;
  }
  @keyframes intro-trazo{ to{ stroke-dashoffset:0 } }
  @keyframes intro-flecha{ from{ opacity:0; transform:translateY(-26px) } to{ opacity:1; transform:translateY(0) } }
  @keyframes intro-nucleo{ to{ transform:scale(1) } }
  @keyframes intro-marca{ from{ opacity:0; letter-spacing:.75em } to{ opacity:1; letter-spacing:.42em } }
  @keyframes intro-salida{ to{ opacity:0; visibility:hidden } }
  @media (prefers-reduced-motion: reduce){ #intro{ display:none } }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  input,select,textarea,button{font:inherit; color:inherit}

  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; flex:0 0 auto;
  }
  .brand{display:flex; align-items:center; gap:9px; white-space:nowrap;
    background:transparent; border:0; color:inherit; font:inherit;
    padding:5px 9px; margin-left:-9px; border-radius:9px; cursor:pointer}
  .brand:hover{background:var(--col)}
  .brand:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .brand:active{transform:translateY(1px)}
  .brand .logo{transition:transform .15s ease}
  .brand:hover .logo{transform:rotate(-30deg)}
  .brand .logo{width:30px; height:30px; flex:0 0 auto}
  .brand b{font-size:17px; font-weight:800; letter-spacing:.07em}
  .brand i{font-style:normal; color:var(--muted); font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; border-left:1px solid var(--line); padding-left:9px}
  /* Con cinco pestañas la barra ya no cabe en un teléfono: se desliza en vez
     de empujar la página a lo ancho. */
  nav{display:flex; gap:2px; background:var(--col); border-radius:8px; padding:3px;
    min-width:0; max-width:100%; overflow-x:auto; scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent; border:0; border-radius:6px; padding:6px 13px;
    cursor:pointer; color:var(--muted); font-weight:600; white-space:nowrap}
  nav button:hover{color:var(--text)}
  nav button[aria-current="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
  .spacer{flex:1 1 auto}
  .firma-previa{background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:8px; text-align:center}
  .firma-previa img{max-height:86px; max-width:100%}
  #estadoNube{display:inline-flex; align-items:center; gap:6px; cursor:default;
    border:1px solid var(--line); font:inherit; font-size:12px}
  #estadoNube.conSesion{cursor:pointer}
  #estadoNube.conSesion:hover{background:var(--panel-2)}
  .pill.aviso{display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:0;
    background:var(--ok-soft); color:var(--ok); font-weight:600; animation:latir 2s ease-in-out 3}
  .pill.aviso:hover{filter:brightness(1.06)}
  @keyframes latir{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion: reduce){ .pill.aviso{animation:none} }
  .punto-nube{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

  .field{background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:7px 10px}
  .field:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .field[readonly]{background:var(--col); color:var(--muted)}
  #q{min-width:200px}
  button.btn{background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); padding:7px 12px; cursor:pointer; white-space:nowrap}
  button.btn:hover{background:var(--col)}
  button.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--ink-solido)}
  button.btn.primary:hover{filter:brightness(1.08)}
  button.btn.ok{background:var(--ok); border-color:var(--ok); color:var(--ink-solido)}
  button.btn.ok:hover{filter:brightness(1.08)}
  button.btn.danger{color:var(--bad)}
  button.btn.danger:hover{background:var(--bad-soft)}
  button.btn.wa{color:#25d366}
  .ico-wa{width:18px; height:18px; display:block; margin:0 auto}
  button.btn.wa:has(.ico-wa){padding:6px 11px}
  .card-acts button.wa{display:flex; align-items:center; justify-content:center; padding:3px 0}
  .card-acts button.wa .ico-wa{width:15px; height:15px}
  button.btn.wa:hover{background:rgba(37,211,102,.12)}
  button.btn:disabled{opacity:.45; cursor:not-allowed}
  button.btn.wa:disabled{color:var(--muted); filter:grayscale(1)}
  button.btn.wa:disabled:hover{background:transparent}
  button.btn.sm{padding:3px 8px; font-size:12px}

  main{flex:1 1 auto; min-height:0; display:flex}
  .view{display:none; flex:1 1 auto; min-width:0; min-height:0}
  .view[data-on]{display:flex; flex-direction:column}

  .kpis{display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px 0; flex:0 0 auto}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; min-width:110px}
  .kpi b{display:block; font-size:17px; font-variant-numeric:tabular-nums}
  .kpi small{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em}

  .board-wrap{flex:1 1 auto; overflow-x:auto; overflow-y:hidden; padding:12px 16px 16px; min-height:0}
  #board{display:flex; gap:12px; height:100%; align-items:stretch}
  .col{background:var(--col); border-radius:10px; width:280px; flex:0 0 280px;
    display:flex; flex-direction:column; height:100%}
  .col.drop{outline:2px dashed var(--accent); outline-offset:-2px}
  .col-head{padding:10px 12px 8px; display:flex; align-items:center; gap:8px}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .col-name{font-weight:700; font-size:13px; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .count{background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:20px; padding:1px 8px; font-size:11px; font-variant-numeric:tabular-nums}
  .cards{flex:0 1 auto; overflow-y:auto; padding:0 8px 8px; display:flex; flex-direction:column; gap:8px; min-height:40px}
  .col-foot{padding:2px 8px 10px}
  .add-card{width:100%; text-align:left; background:transparent; border:1px dashed var(--line);
    color:var(--muted); border-radius:6px; padding:7px 10px; cursor:pointer}
  .add-card:hover{background:var(--panel-2); color:var(--text)}
  .empty-col{color:var(--muted); font-size:12px; text-align:center; padding:14px 6px}

  .card{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:6px; padding:9px 10px; box-shadow:var(--shadow); cursor:grab}
  .card:hover{border-color:var(--accent)}
  .card.dragging{opacity:.4}
  .card-title{font-weight:600; margin-bottom:2px; word-break:break-word}
  .card-sub{color:var(--muted); font-size:12px; word-break:break-word}
  .card-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px}
  .pill{font-size:11px; padding:1px 7px; border-radius:20px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--muted)}
  .pill.strong{background:var(--accent-soft); color:var(--accent); border-color:transparent}
  .pill.good{background:var(--ok-soft); color:var(--ok); border-color:transparent}
  .pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
  .card-acts{display:flex; gap:4px; margin-top:8px}
  .card-acts button{flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--muted);
    border-radius:4px; padding:2px 0; cursor:pointer; font-size:12px; line-height:1.6}
  .card-acts button:hover:not(:disabled){background:var(--accent); border-color:var(--accent); color:var(--ink-solido)}
  .card-acts button.wa:hover:not(:disabled){background:#25d366; border-color:#25d366; color:#fff}
  .pill.oro{background:var(--oro-suave); color:var(--oro-tinta); border-color:transparent}
  .card-acts button:disabled{opacity:.3; cursor:default}

  .table-wrap{flex:1 1 auto; overflow:auto; padding:12px 16px 16px; min-height:0}
  table.data{width:100%; border-collapse:collapse; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; overflow:hidden}
  table.data th{text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; padding:9px 10px; border-bottom:1px solid var(--line);
    background:var(--panel-2); position:sticky; top:0; z-index:1; white-space:nowrap}
  table.data td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.data tbody tr:last-child td{border-bottom:0}
  table.data tbody tr:hover{background:var(--panel-2)}
  table.data td.num, table.data th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .row-link{cursor:pointer}
  table.data tr.row-err > td{background:var(--bad-soft)}
  /* Un campo con algo que hay que mirar antes de guardar. */
  .field.campo-err{border-color:var(--bad); background:var(--bad-soft)}
  .field.err{border-color:var(--bad); box-shadow:0 0 0 1px var(--bad)}
  .errbox{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);
    border-radius:6px; padding:10px 13px; margin-bottom:14px; font-size:13px}
  .errbox b{display:block; margin-bottom:3px}
  .errbox ul{margin:0; padding-left:18px}
  .errbox li{margin-top:3px}
  tr.off td:not(.selcell){opacity:.45}
  .nowrap{white-space:nowrap}
  .vacio{color:var(--muted); text-align:center; padding:36px 16px}
  .panel-form{background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; padding:16px 18px}
  /* Preguntarle a la IA: botón flotante y su panel */
  #bIA{position:fixed; right:20px; bottom:20px; z-index:400; width:56px; height:56px;
    border-radius:50%; border:0; cursor:pointer; background:var(--accent); color:#fff;
    box-shadow:0 6px 22px rgba(57,16,78,.34); display:flex; align-items:center;
    justify-content:center; transition:transform .12s ease, box-shadow .12s ease}
  #bIA:hover{transform:translateY(-2px); box-shadow:0 9px 26px rgba(57,16,78,.42)}
  #bIA svg{width:26px; height:26px; display:block}
  #panelIA{position:fixed; right:20px; bottom:20px; z-index:401; width:400px;
    max-width:calc(100vw - 32px); height:min(620px, calc(100vh - 40px));
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.28); display:flex; flex-direction:column; overflow:hidden}
  #panelIA .ia-head{display:flex; align-items:center; gap:8px; padding:12px 14px;
    border-bottom:1px solid var(--line); background:var(--panel-2)}
  #panelIA .ia-head b{font-size:14px}
  #panelIA .ia-msgs{flex:1; overflow-y:auto; padding:14px; display:flex;
    flex-direction:column; gap:10px}
  .ia-b{max-width:88%; padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.5;
    white-space:pre-wrap; word-wrap:break-word}
  .ia-b.yo{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px}
  .ia-b.ia{align-self:flex-start; background:var(--panel-2); border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .ia-b.err{align-self:stretch; background:var(--bad-soft); color:var(--bad);
    border:1px solid var(--bad); max-width:100%}
  .ia-b b{font-weight:700}
  .ia-vacio{color:var(--muted); font-size:13px; text-align:center; padding:18px 6px}
  .ia-idea{display:block; width:100%; text-align:left; margin-top:6px; font-size:12.5px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; cursor:pointer; color:var(--text)}
  .ia-idea:hover{border-color:var(--accent)}
  #panelIA .ia-pie{border-top:1px solid var(--line); padding:10px 12px; background:var(--panel-2)}
  #panelIA .ia-fila{display:flex; gap:8px; align-items:flex-end}
  #panelIA textarea{flex:1; resize:none; min-height:38px; max-height:120px; font-size:13.5px}
  .ia-nota{font-size:11px; color:var(--muted); margin:7px 0 0; line-height:1.4}
  .ia-nota label{display:flex; gap:6px; align-items:flex-start; cursor:pointer}
  @media (max-width:560px){
    #panelIA{right:0; bottom:0; width:100vw; max-width:100vw; height:100dvh;
      border-radius:0; border:0}
    #bIA{right:14px; bottom:14px}
  }
  body.con-kiosco #bIA, body.con-kiosco #panelIA{display:none !important}
  /* Calendario */
  .cal-leyenda{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted);
    margin-bottom:10px}
  .cal-leyenda span{display:inline-flex; align-items:center; gap:6px}
  .cal-leyenda i, .cal-punto{width:10px; height:10px; border-radius:3px; display:inline-block}
  .ev-contrato{background:var(--ok)}
  .ev-cot{background:var(--accent)}
  .ev-act{background:var(--warn)}
  .cal-sem{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px}
  .cal-sem div{font-size:11px; font-weight:700; color:var(--muted); text-align:center;
    text-transform:uppercase; letter-spacing:.04em}
  .cal-rej{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-d{min-height:104px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:5px 5px 6px; cursor:pointer; overflow:hidden}
  .cal-d.fuera{background:transparent; border-color:transparent; cursor:default}
  .cal-d.hoy{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
  .cal-n{font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:3px}
  .cal-d.hoy .cal-n{color:var(--accent)}
  .cal-ev{display:block; width:100%; text-align:left; font-size:11px; line-height:1.3;
    border:0; border-radius:5px; padding:3px 5px; margin-bottom:3px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff}
  .cal-ev.ev-contrato{background:var(--ok); color:var(--ok-ink,#2b0d3a)}
  .cal-ev.ev-cot{background:var(--accent)}
  .cal-ev.ev-act{background:var(--warn-soft); color:var(--warn)}
  .cal-mas{border:0; background:transparent; color:var(--muted); font-size:11px;
    cursor:pointer; padding:1px 4px}
  .cal-fila{display:flex; gap:10px; align-items:center; padding:9px 4px; cursor:pointer;
    border-bottom:1px solid var(--line)}
  .cal-fila:hover{background:var(--panel-2)}
  .cal-fila .cal-punto{flex:none; margin-top:2px}
  @media (max-width:760px){
    .cal-d{min-height:74px}
    .cal-ev{font-size:10px}
  }

  /* Reportes */
  .barra{background:var(--col); border-radius:999px; height:9px; overflow:hidden}
  .barra i{display:block; height:100%; background:var(--accent); border-radius:999px}
  .rep-meses{display:flex; gap:8px; align-items:flex-end; height:150px; padding:10px 0 0;
    overflow-x:auto}
  .rep-mes{flex:1 0 34px; display:flex; flex-direction:column; align-items:center; height:100%}
  .rep-barras{flex:1; width:100%; display:flex; gap:2px; align-items:flex-end;
    justify-content:center}
  .rep-barras i{display:block; width:12px; border-radius:3px 3px 0 0; min-height:2px}
  .rep-barras .cerr{background:var(--accent)}
  .rep-barras .mesa{background:var(--col)}
  .rep-et{font-size:10.5px; color:var(--muted); margin-top:5px; text-transform:capitalize}

  .doc-contenido .cl{margin:9px 0; text-align:justify; font-size:11.5px; line-height:1.55}
  .doc-contenido .cl b{color:#39104e}
  .ct-serv{margin:6px 0 10px; padding-left:20px}
  .ct-serv li{margin-top:3px; font-weight:600}
  .ct-mon{font-weight:700; font-size:11.5px; letter-spacing:.02em; margin:8px 0}
  .doc-contenido .ct-tot td{border-top:1.5px solid #39104e; background:#f6f3f8}

  /* Modo tableta: la pantalla que se le pone enfrente al cliente en un stand.
     No hereda nada del tema de la aplicación —siempre claro, siempre sobre
     blanco— porque el que la va a llenar no es del equipo y no tiene por qué
     encontrarse la aplicación en oscuro ni ver un solo dato de nadie más. */
  /* Con la tableta entregada, el CRM no se tapa: se quita. Encima no bastaba
     —el teclado y el lector de pantalla seguían llegando a las pestañas de
     atrás—, y lo que no está dibujado no se alcanza de ninguna manera. */
  body.con-kiosco > header, body.con-kiosco > main{display:none !important}
  /* Lo mismo con la pantalla de entrar. Tapar el CRM con un recuadro encima no
     es proteger nada: la cartera seguía dibujada debajo, al alcance del teclado,
     del lector de pantalla y de cerrar el recuadro. Mientras no haya sesión, la
     aplicación no está en la página. */
  body.sin-sesion > header, body.sin-sesion > main{display:none !important}
  body.sin-sesion #bIA, body.sin-sesion #panelIA{display:none !important}
  /* La pantalla de departamento: pocas cosas y grandes, que es lo único que
     hay que hacer en ella. */
  .dep-grid{display:grid; gap:12px; grid-template-columns:1fr 1fr; margin-top:20px}
  @media(max-width:560px){ .dep-grid{grid-template-columns:1fr} }
  .dep-card{display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 16px; color:inherit; font:inherit; transition:border-color .15s, transform .15s}
  .dep-card:hover, .dep-card:focus-visible{border-color:var(--oro); transform:translateY(-2px)}
  .dep-card .dep-ico{font-size:26px; line-height:1}
  .dep-card b{display:block; margin:8px 0 4px; font-size:16px}
  .dep-card small{color:var(--muted); display:block; line-height:1.45}
  #kiosco{position:fixed; inset:0; z-index:9000; overflow-y:auto;
    background:#f6f4f8; color:#241031; -webkit-overflow-scrolling:touch;
    font-size:17px; display:flex; flex-direction:column; align-items:center}
  #kiosco *{box-sizing:border-box}
  .k-hoja{width:100%; max-width:760px; padding:20px 22px 40px}
  .k-marca{text-align:center; margin-bottom:6px}
  .k-marca .k-wordmark{width:min(260px,68vw); margin:0 auto}
  .k-marca .k-wordmark svg{width:100%; height:auto; display:block}
  .k-marca .k-mono{width:64px; height:64px; margin:0 auto 6px; display:block}
  .k-titulo{text-align:center; font-size:26px; font-weight:700; margin:12px 0 4px;
    color:#39104e; letter-spacing:.01em}
  .k-sub{text-align:center; color:#5d4a6b; margin:0 0 14px; font-size:15px}
  .k-evento{display:block; text-align:center; margin:0 auto 16px; font-size:14px;
    background:#ece7f1; color:#4a3559; border-radius:999px; padding:6px 16px; width:max-content;
    max-width:100%}
  .k-campo{margin-bottom:13px}
  .k-campo label{display:block; font-size:15px; font-weight:600; margin-bottom:6px; color:#3b2a49}
  .k-campo .opc{font-weight:400; color:#7a6a87}
  .k-campo input{width:100%; font-size:20px; padding:12px 14px; border-radius:10px;
    border:1.5px solid #cfc6d8; background:#fff; color:#241031; -webkit-appearance:none}
  .k-campo input:focus{outline:none; border-color:#39104e; box-shadow:0 0 0 3px #39104e22}
  .k-campo input.err{border-color:#b3261e; background:#fdf3f2}
  .k-fila{display:flex; gap:14px}
  .k-fila > *{flex:1 1 0; min-width:0}
  .k-enviar{width:100%; font-size:21px; font-weight:700; padding:16px; border:0;
    border-radius:12px; background:#39104e; color:#fff; margin-top:8px; cursor:pointer}
  .k-enviar:active{background:#2a0c3a}
  .k-err{background:#fdecea; color:#8c1d18; border:1px solid #e6b4b0; border-radius:10px;
    padding:12px 14px; margin-bottom:16px; font-size:15px}
  .k-err ul{margin:6px 0 0; padding-left:20px}
  .k-aviso{margin-top:18px; font-size:12.5px; line-height:1.5; color:#6b5a79; text-align:center}
  /* La salida se esconde a plena vista y pide mantener pulsado: un visitante
     curioso no sale por accidente, y el ejecutivo no tiene otra clave que perder. */
  .k-salir{position:fixed; top:0; right:0; width:62px; height:62px; border:0; z-index:9001;
    background:transparent; color:#b8abc4; font-size:17px; cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .k-salir:active{color:#39104e}
  .k-saliendo{position:fixed; top:14px; right:74px; z-index:9001; font-size:13px;
    color:#39104e; background:#fff; border:1px solid #d9d0e1; border-radius:999px;
    padding:5px 12px}
  .k-gracias{text-align:center; padding:40px 10px}
  .k-gracias .k-tick{font-size:64px; line-height:1; margin-bottom:10px}
  .k-gracias h2{font-size:28px; margin:0 0 8px; color:#39104e}
  .k-gracias p{margin:0 0 26px; color:#5d4a6b; font-size:16px}
  @media (max-width:560px){
    .k-fila{display:block}
    .k-titulo{font-size:22px}
  }

  .overlay{position:fixed; inset:0; background:rgba(28,8,40,.6); display:flex;
    align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; z-index:50}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:640px; box-shadow:0 12px 40px rgba(28,8,40,.4)}
  .modal.wide{max-width:920px}
  .modal.doc{max-width:840px}
  .modal-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
  .modal-head h2{margin:0; font-size:16px; flex:1 1 auto}
  .modal-body{padding:16px 18px}
  .modal-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .grid .full{grid-column:1/-1}
  label.lbl{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600}
  .grid input,.grid select,.grid textarea{width:100%}
  textarea{resize:vertical; min-height:70px}
  textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px}
  .hint{color:var(--muted); font-size:12px}
  .note{background:var(--accent-soft); color:var(--text); border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:14px}
  .note.warn{background:var(--warn-soft)}
  h3.sec{margin:22px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted)}
  h3.sec:first-child{margin-top:0}

  .subtabs{display:flex; gap:2px; background:var(--col); border-radius:8px; padding:3px; margin-bottom:16px}
  .subtabs button{flex:1; background:transparent; border:0; border-radius:6px; padding:7px 10px;
    cursor:pointer; color:var(--muted); font-weight:600}
  .subtabs button[aria-current="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
  .pane{display:none}
  .pane[data-on]{display:block}

  .act{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act-ico{width:30px; height:30px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:15px}
  .act-body{flex:1 1 auto; min-width:0}
  .act-top{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
  .act-asunto{font-weight:600; word-break:break-word}
  .act-meta{color:var(--muted); font-size:12px}
  .act-notas{white-space:pre-wrap; margin-top:4px; font-size:13px; word-break:break-word}
  .act-del{background:transparent; border:0; color:var(--muted); cursor:pointer; padding:0 4px; flex:0 0 auto}
  .act-del:hover{color:var(--bad)}

  .cod{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em;
    color:var(--muted); background:var(--panel-2); border-radius:4px; padding:1px 5px; margin:1px 0}
  .cod.rec{color:var(--ok); background:var(--ok-soft)}

  .sign-pad{border:1px dashed var(--line); border-radius:8px; background:#fff;
    touch-action:none; width:100%; height:170px; display:block; cursor:crosshair}
  @media (max-width:640px){ .sign-pad{height:200px} }

  /* ---------- Documento (carta-convenio) ---------- */
  .doc-body{padding:30px 40px 34px; font-size:12.4px; line-height:1.5; color:#2b0d3a;
    background:#fff; position:relative; overflow:hidden}
  /* Marca de agua tipo hoja membretada: va como elemento, no como fondo CSS,
     para que también salga al imprimir. */
  /* La página que abre el cliente. El CRM ocupa la pantalla completa y no se
     desplaza —las columnas del tablero se desplazan solas—, pero un documento
     de varias páginas sí tiene que poder recorrerse de arriba abajo. */
  html.modo-firma, html.modo-firma body{
    height:auto; min-height:100%; overflow:visible; display:block; background:var(--bg)}
  #firmaCliente{max-width:860px; margin:0 auto; padding:16px 12px 70px}
  #firmaCliente .hoja-cliente{border-radius:10px; box-shadow:var(--shadow); margin:0 0 20px}
  /* El convenio es papel y va sobre .doc-body, que trae su propio blanco y su
     propia tinta: así se lee igual traiga el teléfono el tema que traiga. */
  #firmaCliente .doc-body table.tar{font-size:11.5px}
  @media (max-width:640px){
    #firmaCliente .hoja-cliente{padding:18px 15px 20px; font-size:13px}
    #firmaCliente .doc-cols, #firmaCliente .firmas{flex-direction:column; gap:16px}
    #firmaCliente .doc-body table.tar{font-size:11px}
    #firmaCliente .doc-body table.tar th, #firmaCliente .doc-body table.tar td{padding:5px 6px}
  }

  .doc-agua{position:absolute; top:90px; left:0; right:0; height:840px;
    display:flex; align-items:center; justify-content:center; pointer-events:none;
    z-index:0; opacity:.05; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .doc-agua svg, .doc-agua img{width:68%; max-width:470px; height:auto; object-fit:contain}
  .doc-contenido{position:relative; z-index:1}
  .doc-logo{max-height:78px; max-width:76%; display:block; margin:0 auto 6px}
  .doc-mono{width:52px; height:52px; margin:0 auto 5px; display:block}
  .doc-wordmark{width:270px; margin:0 auto 6px}
  .doc-wordmark svg{width:100%; height:auto; display:block}
  .doc-hotel{text-align:center; border-bottom:2px solid #39104e; padding-bottom:8px; margin-bottom:3px}
  .doc-regla{height:3px; background:#b2aa6d; margin-bottom:16px}
  .doc-hotel b{font-size:15px; letter-spacing:.04em}
  .doc-hotel div{font-size:11px; color:#6f6279; margin-top:2px}
  .doc-fecha{text-align:right; margin-bottom:14px}
  .doc-dest{margin-bottom:14px}
  .doc-dest b{font-size:13px}
  .doc-body p{margin:0 0 9px; text-align:justify}
  .doc-body h2{font-size:12px; font-weight:700; letter-spacing:.05em; margin:18px 0 6px;
    text-transform:uppercase; color:#39104e; border-bottom:1px solid #e0dbe7; padding-bottom:3px}
  .doc-body table.tar{width:100%; border-collapse:collapse; margin:4px 0 8px; font-size:12px}
  .doc-body table.tar th{background:#39104e; color:#fff; text-align:left; padding:6px 9px;
    font-size:11px; letter-spacing:.02em; border:1px solid #39104e}
  .doc-body table.tar th.num, .doc-body table.tar td.num{text-align:right}
  .doc-body table.tar td{padding:6px 9px; border:1px solid #ddd6e3}
  .doc-body .inc{font-size:11.5px; color:#6d6634; white-space:pre-wrap; margin:0 0 12px;
    padding-left:9px; border-left:3px solid #b2aa6d}
  .doc-body .pol{white-space:pre-wrap; font-size:11.8px; color:#4c3b57; text-align:justify}
  .doc-body .doc-res{margin-top:7px; font-size:12.5px; line-height:1.8}
  .doc-body .doc-res i{color:#6f6279; font-style:normal; display:inline-block; width:74px}
  .doc-cols{display:flex; gap:26px}
  .doc-cols > div{flex:1; min-width:0}
  .doc-cols h3{font-size:11px; letter-spacing:.04em; margin:0 0 4px; color:#39104e; font-weight:700}
  .doc-sub{font-weight:700; margin:12px 0 4px}

const misDepartamentos = () =>

/**

 *
 * Sin nube no hay sesión ni papeles: quien abre el archivo en su equipo es
 * dueño de todo y no hay departamentos que separar, así que no se le pregunta.
 */
const escogeDepto = () => nubeActiva() && misDepartamentos().length > 1;
const deptoActual = () => DEPARTAMENTOS.find(d => d.id === depto) || null;

/**
 * Las pestañas de esta persona, ya acotadas al departamento en el que está.
 *
 * Los Ajustes no son de ningún departamento —son del administrador—, así que
 * no se le quitan por haber escogido uno.
 */
function vistasDelRol(){
  const base = VISTAS_ROL[rolActual()] || VISTAS_ROL.ejecutivo;
  const d = escogeDepto() ? deptoActual() : null;
  return d ? base.filter(v => v === "ajustes" || d.vistas.includes(v)) : base;
}
const puedeVer = v => vistasDelRol().includes(v);

function saneaUsuario(u){
  const o = Object.assign({ id:"", correo:"", nombre:"", rol:"ejecutivo", firma:null }, u || {});
  o.id = o.id || nuevoId("u");
  o.correo = String(o.correo).trim().toLowerCase();
  o.nombre = String(o.nombre).trim();
  if (!ROLES.some(r => r.id === o.rol)) o.rol = "ejecutivo";
  o.firma = saneaFirma(o.firma);      // la que dejó guardada para no volver a trazarla
  return o;
}

/**
 * La firma del ejecutivo se traza una vez y se vuelve a usar.
 *
 * Vive en la ficha del usuario, no en el equipo: aquí se trabaja desde
 * computadoras compartidas y cada quien debe traer la suya a donde entre.
 * Sin nube no hay usuario a quién colgarla, y entonces se queda nada más en
 * esta máquina —y se borra al cerrar sesión, para no dejarle a nadie una
 * firma ajena a la mano.
 */
const FIRMA_LOCAL = "crm-hotel-firma";

function firmaGuardada(){
  const u = usuarioActual();
  if (u) return u.firma && u.firma.img ? u.firma : null;
  try{
    const f = JSON.parse(localStorage.getItem(FIRMA_LOCAL) || "null");
    return f && f.img ? f : null;
  }catch(e){ return null; }
}

function guardarFirmaPropia(d){
  const f = { nombre:d.nombre || "", puesto:d.puesto || "", celular:d.celular || "", img:d.img };
  const u = usuarioActual();
  if (u){ u.firma = f; guardar(); }
  else try{ localStorage.setItem(FIRMA_LOCAL, JSON.stringify(f)); }catch(e){}
}

function olvidarFirmaPropia(){
  const u = usuarioActual();
  if (u){ u.firma = null; guardar(); }
  else try{ localStorage.removeItem(FIRMA_LOCAL); }catch(e){}
}

/** El usuario de la sesión, buscado por el correo con el que entró. */
function usuarioActual(){
  const c = correoSesion().trim().toLowerCase();
  if (!c) return null;
  return state.usuarios.find(u => u.correo === c) || null;
}

/**
 * Sin nube no hay sesión, y entonces no hay a quién limitarle nada: quien
 * abre la aplicación en su equipo es dueño de sus propios datos. Con nube,
 * un correo que no está dado de alta entra como ejecutivo sin cartera, que
 * es lo prudente: mejor que no vea nada a que lo vea todo por descuido.
 */
function rolActual(){
  if (!nubeActiva()) return "admin";
  const u = usuarioActual();
  return u ? u.rol : "ejecutivo";
}

const miNombre    = () => { const u = usuarioActual(); return u ? u.nombre : ""; };
const esAdmin     = () => rolActual() === "admin";
/* Las dos gerencias ven el trabajo de todo el equipo; lo que cambia entre
   ellas es qué pestañas alcanzan, no cuánto ven dentro de ellas. */
const puedeVerTodo = () =>
  ["admin","direccion","gerente","gte_banquetes","gte_marketing"].includes(rolActual());

/** ¿Este cliente es de quien está viendo la pantalla? */
function esMio(c){
  if (puedeVerTodo()) return true;
  const yo = miNombre().trim().toLowerCase();
  return !!yo && String(c.ejecutivo || "").trim().toLowerCase() === yo;
}

/** Los nombres del equipo dado de alta: los únicos que deben poder elegirse. */
const nombresEquipo = () => [...new Set(state.usuarios.map(u => String(u.nombre || "").trim())
  .filter(Boolean))].sort((a,b) => a.localeCompare(b,"es"));

/**
 * Nombres escritos en la cartera o en la bitácora que no son de nadie del
 * equipo: quedan de una importación, de un ejemplo o de un dedazo. Importan
 * porque esos clientes no los ve ningún ejecutivo, así que hay que enseñarlos
 * aparte en vez de esconderlos.
 */
function nombresSinDuenio(){
  const equipo = new Set(nombresEquipo().map(n => n.toLowerCase()));
  return [...new Set([
      ...state.clientes.map(c => c.ejecutivo),
      ...state.actividades.map(a => a.responsable)
    ].map(x => String(x || "").trim()).filter(Boolean)
     .filter(n => !equipo.has(n.toLowerCase())))]
    .sort((a,b) => a.localeCompare(b,"es"));
}

/** Cuánto arrastra un nombre suelto, para poder decírselo al administrador. */
const cuantoTiene = nombre => {
  const n = nombre.trim().toLowerCase();
  const igual = x => String(x || "").trim().toLowerCase() === n;
  return { clientes:    state.clientes.filter(c => igual(c.ejecutivo)).length,
           actividades: state.actividades.filter(a => igual(a.responsable)).length };
};

/** Las opciones de los filtros por ejecutivo, iguales en tablero y actividades. */
function opcionesEjecutivos(valor, todos){
  const op = n => `<option value="${esc(n)}"${n === valor ? " selected" : ""}>${esc(n)}</option>`;
  const cab = `<option value="">${esc(todos)}</option>`;
  if (!puedeVerTodo()){                 // un ejecutivo sólo se tiene a sí mismo
    const yo = miNombre().trim();
    return cab + (yo ? op(yo) : "");
  }
  const sueltos = nombresSinDuenio();
  return cab + nombresEquipo().map(op).join("") +
    (sueltos.length ? `<optgroup label="Sin dar de alta">${sueltos.map(op).join("")}</optgroup>` : "");
}

/**
 * El ejecutivo de un cliente se escoge de la lista, no se escribe: un nombre
 * con una letra de más deja al cliente sin dueño y nadie lo vuelve a ver.
 */
function selectEjecutivo(valor, nombreCampo){
  const v = String(valor || "").trim(), vb = v.toLowerCase();
  const equipo = nombresEquipo();
  const suelto = v && !equipo.some(n => n.toLowerCase() === vb);
  return `<select class="field" name="${nombreCampo || "ejecutivo"}">
      <option value=""${v ? "" : " selected"}>— Sin asignar —</option>
      ${equipo.map(n => `<option value="${esc(n)}"${n.toLowerCase() === vb ? " selected" : ""}>${esc(n)}</option>`).join("")}
      ${suelto ? `<option value="${esc(v)}" selected>${esc(v)} · sin dar de alta</option>` : ""}
    </select>`;
}

/**

const entradaLista = new Promise(r => { terminarEntrada = r; setTimeout(r, 3500); });

/**
 * Lo que el último sanear() dejó fuera por no encontrarle cliente.
 *
 * Importa por una razón: con el servidor repartiendo por dueño, a alguien le
 * puede llegar una actividad o un evento suyo colgando de un cliente que no
 * alcanza a ver. Ese renglón se aparta —sin su cliente no sirve de nada—,
 * pero NO es un borrado. Si la sincronización lo confundiera con uno, este
 * equipo le daría de baja a todo el hotel un registro que ni siquiera puede
 * abrir. Por eso se anotan aquí y se sacan de la lista de "ya sincronizado".
 */
let huerfanos = new Set();

const nuevoId = p => (p||"x") + Date.now().toString(36) + "-" + (++idCounter);

/**
 * Si había datos guardados y aun así no se pudieron leer, NO se sigue como si
 * el equipo estuviera en blanco.
 *
 * Caer a los clientes de ejemplo y volver a guardar encima pisaría la cartera
 * de verdad por un error de programación, sin que nadie se enterara. Se avisa
 * y se deja el almacenamiento intacto para poder recuperarlo.
 */
let cargaRota = false;

function cargar(){
  const raw0 = (() => { try{ return localStorage.getItem(STORE); }catch(e){ return null; } })();
  try{
    if (raw0) return sanear(JSON.parse(raw0));
  }catch(e){
    cargaRota = true;
    console.error("No se pudo leer el almacenamiento local:", e);
    setTimeout(() => alert(
      "No se pudieron leer los datos guardados en este equipo.\n\n" +
      "No se borró nada: siguen ahí. Avísale a sistemas y no captures nada todavía, " +
      "para no escribir encima.\n\nDetalle: " + e.message), 400);
    return sanear({});
  }

  for (const k of VIEJOS){
    try{
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.clientes) && p.clientes.length) return sanear(p);
      if (p && Array.isArray(p.deals) && p.deals.length){
        const mapa = { prospecto:"contactado", contactado:"contactado", calificado:"propuesta",
                       propuesta:"propuesta", negociacion:"negociacion", ganado:"ganado", perdido:"perdido" };
        return sanear({ clientes: p.deals.map(d => ({
          id: nuevoId("c"), empresa: d.empresa || d.nombre || "", contacto: d.contacto || "",
          telefono: d.telefono || "", email: d.email || "", ubicacion: "",
          tarifa: Number(d.monto) || 0, ejecutivo: d.responsable || "",
          estatus: mapa[d.stage] || "contactado", notas: d.notas || ""
        })) });
      }
    }catch(e){ console.warn("No se pudo migrar " + k + ":", e); }
  }
  return sanear({ clientes: clientesDemo() });
}

function sanear(s){
  s = s || {};
  const out = {
    clientes:     Array.isArray(s.clientes) ? s.clientes.map(saneaCliente) : [],
    actividades:  Array.isArray(s.actividades) ? s.actividades.map(saneaAct) : [],
    convenios:    Array.isArray(s.convenios) ? s.convenios.map(saneaConv) : [],
    prospectos:   Array.isArray(s.prospectos) ? s.prospectos.map(saneaProspecto) : [],
    contratos:    Array.isArray(s.contratos) ? s.contratos.map(saneaContrato) : [],
    eventos:      Array.isArray(s.eventos) ? s.eventos.map(saneaEvento) : [],
    campanas:     Array.isArray(s.campanas) ? s.campanas.map(saneaCampana) : [],
    huespedes:    Array.isArray(s.huespedes) ? s.huespedes.map(saneaHuesped) : [],
    usuarios:     Array.isArray(s.usuarios) ? s.usuarios.map(saneaUsuario) : USUARIOS_DEF.map(saneaUsuario),
    habitaciones: catalogo(s.habitaciones),
    ajustes: {
      hotel:  Object.assign({}, HOTEL_DEF, (s.ajustes && s.ajustes.hotel) || {}),
      textos: Object.assign({}, TEXTOS_DEF, (s.ajustes && s.ajustes.textos) || {}),
      grupos: saneaGrupos(s.ajustes && s.ajustes.grupos),
      moneda: (s.ajustes && s.ajustes.moneda) || "MXN",
      ladaPais: (s.ajustes && s.ajustes.ladaPais) || "52"
    }
  };
  const ids = new Set(out.clientes.map(c => c.id));
  huerfanos = new Set();
  const conCliente = (tipo, arr) => arr.filter(o => {
    if (ids.has(o.clienteId)) return true;
    huerfanos.add(tipo + ":" + o.id);
    return false;
  });
  out.actividades = conCliente("actividades", out.actividades);
  out.convenios   = conCliente("convenios",   out.convenios);
  out.contratos   = conCliente("contratos",   out.contratos);
  out.eventos     = conCliente("eventos",     out.eventos);
  // Un prospecto no cuelga de ningún cliente: si al que se pasó se borró, el
  // registro del evento se queda, nada más sin liga.
  out.prospectos.forEach(p => { if (p.clienteId && !ids.has(p.clienteId)) p.clienteId = ""; });
  return out;
}

/**
 * El catálogo por omisión salió de un solo convenio y sólo traía dos tipos.
 * Si lo guardado es exactamente ese catálogo viejo, nadie lo tocó: se
 * reemplaza por el del hotel. Un catálogo ya editado se respeta.
 */
function catalogo(guardadas){
  if (!Array.isArray(guardadas) || !guardadas.length) return HABS_DEF.map(saneaHab);
  const viejo = guardadas.length === 2 &&
    guardadas.some(h => h.nombre === "Sencilla y Doble") &&
    guardadas.some(h => h.nombre === "Care");
  return (viejo ? HABS_DEF : guardadas).map(saneaHab);
}

function saneaCliente(c){

    createdAt:"", updatedAt:"" }, c || {});

  o.tarifa = Number(o.tarifa) || 0;

  o.campanaId = String(o.campanaId || "");

function saneaFirma(f){

/**
 * Un prospecto levantado en un evento.
 *
 * No es todavía un cliente: es un nombre y un teléfono apuntados de prisa en
 * un stand. Se guarda aparte y pasa a la cartera cuando alguien lo trabaja,
 * para que un evento con cien registros no llene el embudo de gente que nunca
 * contestó.
 */
/* ==========================================================================
   MARKETING

   Una campaña es lo que el hotel sale a hacer para que llegue gente: un
   anuncio en redes, una búsqueda pagada, una feria. Lo que interesa medir es
   cuánto costó y qué trajo, así que de aquí cuelgan los prospectos.

   Los canales no son texto libre a propósito: si cada quien escribe "face",
   "Facebook" y "FB", ningún reporte cuadra nunca.
   ========================================================================== */


/** Un gasto del mes: así se captura como lo cobra la plataforma. */
function saneaGasto(g){
  const o = Object.assign({ mes:"", monto:0, nota:"" }, g || {});
  o.mes = String(o.mes || "").slice(0, 7);      // AAAA-MM
  o.monto = Number(o.monto) || 0;
  o.nota = String(o.nota || "").trim();
  return o;
}

function saneaCampana(c){
  const o = Object.assign({ id:"", nombre:"", canal:"meta", objetivo:"",
    desde:"", hasta:"", presupuesto:0, gastos:[], estado:"borrador",
    responsable:"", notas:"", utmSource:"", utmMedium:"", utmCampaign:"",
    createdAt:"", updatedAt:"" }, c || {});
  o.id = o.id || nuevoId("mk");
  for (const k of ["nombre","objetivo","responsable","notas","utmSource","utmMedium","utmCampaign"])
    o[k] = String(o[k] || "").trim();
  o.canal = CANALES.some(x => x.id === o.canal) ? o.canal : "otro";
  o.estado = ESTADOS_CAMP[o.estado] ? o.estado : "borrador";
  o.desde = String(o.desde || "").slice(0, 10);
  o.hasta = String(o.hasta || "").slice(0, 10);
  o.presupuesto = Number(o.presupuesto) || 0;
  o.gastos = Array.isArray(o.gastos) ? o.gastos.map(saneaGasto).filter(g => g.mes) : [];
  return o;
}

/** Lo gastado de verdad, que es lo que cuenta contra el presupuesto. */
const gastoCampana = c => (c.gastos || []).reduce((a, g) => a + (Number(g.monto) || 0), 0);

/**
 * La etiqueta de campaña que viaja en la liga.
 *
 * Sale del nombre si nadie escribió una: minúsculas, sin acentos y con guiones,
 * porque una UTM con espacios o acentos llega partida y no hay reporte que la
 * junte después.
 */
function etiquetaUtm(c){
  if (c.utmCampaign) return c.utmCampaign;
  return String(c.nombre || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "campana";
}

function saneaProspecto(p){
  const o = Object.assign({ id:"", nombre:"", apellido:"", compania:"", email:"", telefono:"",
    evento:"", notas:"", capturadoPor:"", fecha:"", clienteId:"",
    canal:"", campanaId:"", utm:null, createdAt:"", updatedAt:"" }, p || {});
  o.id = o.id || nuevoId("p");
  for (const k of ["nombre","apellido","compania","email","telefono","evento","notas","capturadoPor"])
    o[k] = String(o[k] || "").trim();
  o.email = o.email.toLowerCase();
  o.clienteId = String(o.clienteId || "");
  o.fecha = String(o.fecha || "").slice(0, 16);
  // De dónde llegó. Vacío en los que se capturan a mano, que es lo normal en
  // una feria; lo llena solo el formulario público cuando entra por una liga.
  o.canal = CANALES.some(x => x.id === o.canal) ? o.canal : "";
  o.campanaId = String(o.campanaId || "");
  o.utm = o.utm && typeof o.utm === "object"
    ? { source:String(o.utm.source || ""), medium:String(o.utm.medium || ""),
        campaign:String(o.utm.campaign || ""), content:String(o.utm.content || ""),

}

function saneaBloqueEv(b){

function saneaLineaEv(l){

    conServicio:CON_SERVICIO_DEF }, l || {});

/**
 * Un documento de banquetes: la cotización de un evento o su contrato.
 *
 * Los dos viven en la misma lista porque el contrato sale de la cotización
 * —mismos bloques, mismas cuentas— y así no hay que recapturarlo todo.
 */
function saneaEvento(e){
  const o = Object.assign({ id:"", folio:"", clienteId:"", ejecutivo:"", tipo:"cotizacion",
    titulo:"", atencion:"", fecha:"", vigencia:"", bloques:[], servicios:"", lineas:[],
    iva:IVA_BANQ, cargoServicio:SERV_BANQ, observaciones:"", cotizacionId:"",
    anticipo:"", fechaLimitePago:"", garantiaPax:"",
    estado:"borrador", firmaHotel:null, firmaCliente:null, enviado:null, destinatario:null,
    firmaManual:null, externo:false, createdAt:"", updatedAt:"" }, e || {});
  o.id = o.id || nuevoId("e");
  if (!TIPOS_EVENTO.some(t => t.id === o.tipo)) o.tipo = "cotizacion";
  if (!ESTADOS_EV[o.estado]) o.estado = "borrador";
  for (const k of ["folio","clienteId","ejecutivo","titulo","atencion","fecha","vigencia",
                   "servicios","observaciones","cotizacionId","fechaLimitePago","garantiaPax"])
    o[k] = String(o[k] || "").trim();
  o.iva = o.iva === "" || o.iva === null || o.iva === undefined ? IVA_BANQ : (Number(o.iva) || 0);
  o.cargoServicio = o.cargoServicio === "" || o.cargoServicio === null ||
    o.cargoServicio === undefined ? SERV_BANQ : (Number(o.cargoServicio) || 0);
  o.anticipo = o.anticipo === "" ? "" : (Number(o.anticipo) || 0);
  o.bloques = (Array.isArray(o.bloques) ? o.bloques : []).map(saneaBloqueEv);
  o.lineas  = (Array.isArray(o.lineas)  ? o.lineas  : []).map(saneaLineaEv);
  o.externo = !!o.externo;
  o.firmaHotel   = saneaFirma(o.firmaHotel);
  o.firmaCliente = saneaFirma(o.firmaCliente);
  o.firmaManual  = saneaManual(o.firmaManual);
  o.enviado      = saneaEnvio(o.enviado);
  o.destinatario = o.destinatario && o.destinatario.empresa
    ? { empresa:o.destinatario.empresa || "", contacto:o.destinatario.contacto || "",
        ubicacion:o.destinatario.ubicacion || "", telefono:o.destinatario.telefono || "",
        email:o.destinatario.email || "" }
    : null;
  return o;
}

/**
 * Las cuentas del evento.
 *
 * Cada renglón paga IVA; el cargo por servicio sólo lo pagan los de alimentos
 * y bebidas, que es como lo cobra el hotel.
 */
function cuentasEvento(e){
  const pIva  = (Number(e.iva) || 0) / 100;
  const pServ = (Number(e.cargoServicio) || 0) / 100;
  const lineas = e.lineas.map(l => {
    const subtotal = (Number(l.cantidad) || 0) * (Number(l.precio) || 0);
    const iva  = subtotal * pIva;
    const serv = l.conServicio ? subtotal * pServ : 0;
    return Object.assign({}, l, { subtotal, iva, serv, total: subtotal + iva + serv });
  });
  const suma = k => lineas.reduce((a, l) => a + l[k], 0);
  return { lineas, subtotal:suma("subtotal"), iva:suma("iva"), serv:suma("serv"),
           total:suma("total") };
}

/** La fecha en que ocurre el evento: la primera de sus bloques, o la del documento. */
function fechaEvento(e){
  const fs = e.bloques.map(b => b.fecha).filter(f => /^\d{4}-\d{2}-\d{2}$/.test(f)).sort();
  return fs[0] || (/^\d{4}-\d{2}-\d{2}$/.test(e.fecha) ? e.fecha : "");
}

const ejecutivoDeEv = e => String(e.ejecutivo || "").trim() ||
  String((cliente(e.clienteId) || {}).ejecutivo || "").trim();

function saneaContrato(k){
  const o = Object.assign({ id:"", folio:"", clienteId:"", ejecutivo:"", tipo:"cotizacion",
    titulo:"", fecha:"", vigencia:"", moneda:"MXN", tipoCambio:"", impuestos:IMPUESTOS_DEF,
    hospedaje:[], eventos:[], adicionales:[], notas:"",
    estado:"borrador", firmaHotel:null, firmaCliente:null, enviado:null, destinatario:null,
    firmaManual:null, externo:false, createdAt:"", updatedAt:"" }, k || {});
  o.externo = !!o.externo;
  o.firmaManual = saneaManual(o.firmaManual);
  o.id = o.id || nuevoId("k");
  if (!TIPOS_CONTRATO.some(t => t.id === o.tipo)) o.tipo = "cotizacion";
  if (!ESTADOS_CT[o.estado]) o.estado = "borrador";
  for (const kk of ["folio","clienteId","ejecutivo","titulo","fecha","vigencia","tipoCambio","notas"])
    o[kk] = String(o[kk] || "").trim();
  o.moneda = String(o.moneda || "MXN").trim().toUpperCase() || "MXN";
  o.impuestos = o.impuestos === "" || o.impuestos === null || o.impuestos === undefined
    ? IMPUESTOS_DEF : (Number(o.impuestos) || 0);
  o.hospedaje   = (Array.isArray(o.hospedaje)   ? o.hospedaje   : []).map(saneaLineaHosp);
  o.eventos     = (Array.isArray(o.eventos)     ? o.eventos     : []).map(saneaLineaEvento);
  o.adicionales = (Array.isArray(o.adicionales) ? o.adicionales : []).map(saneaLineaExtra);
  o.firmaHotel   = saneaFirma(o.firmaHotel);
  o.firmaCliente = saneaFirma(o.firmaCliente);
  o.enviado      = saneaEnvio(o.enviado);
  o.destinatario = o.destinatario && o.destinatario.empresa
    ? { empresa:o.destinatario.empresa || "", contacto:o.destinatario.contacto || "",
        ubicacion:o.destinatario.ubicacion || "", telefono:o.destinatario.telefono || "",
        email:o.destinatario.email || "" }
    : null;
  return o;
}

/** Lo que cuesta cada renglón y lo que suma todo, con y sin impuestos. */
function cuentasContrato(k){
  const factor = 1 + (Number(k.impuestos) || 0) / 100;
  const lineas = k.hospedaje.map(l => {
    const subtotal = (Number(l.noches) || 0) * (Number(l.precio) || 0);
    return Object.assign({}, l, { subtotal, total: subtotal * factor });
  });
  return {
    lineas,
    noches:   lineas.reduce((a, l) => a + (Number(l.noches) || 0), 0),
    subtotal: lineas.reduce((a, l) => a + l.subtotal, 0),
    total:    lineas.reduce((a, l) => a + l.total, 0)
  };
}

function saneaConv(c){

function saneaHuesped(g){

function saneaEnvio(e){

/** Constancia de que el cliente lo firmó en papel y alguien subió el escaneado. */
/**
 * La constancia de un documento firmado en papel.
 *
 * El escaneado puede estar en dos lugares, y por eso hay dos campos:
 *
 *   ruta: vive en el almacén del proyecto (Supabase Storage). Es lo normal.
 *   pdf : viene incrustado en el propio registro, en base64. Así empezó, y
 *         así se quedaron los que se subieron antes; cabe mientras sean pocos,
 *         porque el navegador corta cerca de los 5 MB. Se pueden mudar desde
 *         Ajustes sin perder nada.
 */
function saneaManual(m){
  if (!m || !m.fecha) return null;
  return { fecha:m.fecha, quien:m.quien || "", archivo:m.archivo || "",
           pdf: typeof m.pdf === "string" ? m.pdf : "",
           ruta: typeof m.ruta === "string" ? m.ruta : "",
           tam: Number(m.tam) || 0,
           tipoMime: m.tipoMime || "" };
}

/** ¿Este documento trae escaneado, esté donde esté? */
const traeEscaneo = m => !!(m && (m.pdf || m.ruta));

/** Clave del enlace de firma: larga y al azar, para que no se pueda adivinar. */
function nuevoToken(){
  const b = new Uint8Array(18);
  crypto.getRandomValues(b);
  return [...b].map(x => x.toString(36).padStart(2,"0")).join("").slice(0, 28);
}

/** Noches capturadas, o las que dan las fechas. */
function nochesDe(g){
  if (g.noches !== "" && g.noches != null) return Number(g.noches);
  if (!g.llegada || !g.salida) return "";
  const d = Math.round((new Date(g.salida + "T00:00:00") - new Date(g.llegada + "T00:00:00")) / 864e5);
  return isNaN(d) || d < 0 ? "" : d;
}

function saneaHab(h){

function saneaGrupos(g){

  for (const k of Object.keys(GRUPOS_DEF))
    out[k] = Object.assign({}, GRUPOS_DEF[k], (g && g[k]) || {});

}

/* ==========================================================================
   NUBE: la misma cartera desde cualquier equipo

   El navegador sigue siendo la copia de trabajo —la aplicación abre al
   instante y funciona sin señal— y encima va una sincronización contra
   Supabase. Se sincroniza por entidad: cada cliente, actividad, convenio o
   huésped es una fila, así que dos personas pueden trabajar a la vez mientras
   no toquen el mismo registro.

   Se consulta por sondeo en lugar de websockets: para un equipo de este
   tamaño la diferencia no se nota y evita mantener una conexión viva y su
   protocolo. El sondeo se detiene mientras haya un formulario abierto, para
   no cambiarle los datos a alguien que está capturando.
   ========================================================================== */

const NUBE_CFG    = "crm-hotel-nube";
const NUBE_SESION = "crm-hotel-sesion";
const SONDEO_MS   = 15000;

let nube = { url:"", anon:"", sesion:null, estado:"local", ultimo:"", timer:null, pendiente:null };
let sincronizado = new Map();     // id de fila -> JSON ya confirmado en la nube

const nubeActiva = () => !!(nube.url && nube.anon && nube.sesion);

/**
 * Supabase enseña la dirección del proyecto en varios lados y no siempre igual:
 * en Settings sale limpia, pero en la pantalla de la API sale ya con /rest/v1/
 * pegado. La aplicación arma esas rutas por su cuenta, así que aquí se recorta
 * lo que sobre en vez de dejar que el usuario adivine cuál de las dos era.
 */
const normalizaUrlNube = u =>
  String(u || "").trim()
    .replace(/\/+$/, "")
    .replace(/\/(rest|auth|storage|realtime|functions)\/v\d+$/i, "")
    .replace(/\/+$/, "");
const correoSesion = () => (nube.sesion && nube.sesion.user && nube.sesion.user.email) || "";

/**
 * La nube del hotel, para que un equipo nuevo no tenga que configurarse.
 *
 * Con esto puesto, quien abra la liga cae directo en la pantalla de contraseña:
 * la aplicación ya sabe con qué servidor hablar y no enseña absolutamente nada
 * hasta que alguien entre. Sin esto, un equipo sin configurar sigue abriendo en
 * modo local, que es como se trabaja el archivo suelto.
 *
 * La llave 'anon' está hecha para ser pública —viaja al navegador de cualquiera
 * que abra la página— y por sí sola no alcanza nada: quien manda es la sesión
 * y las reglas de roles.sql. Aun así, esto sólo se llena con el repositorio en
 * privado.
 */
const NUBE_DEF = Object.assign({ url:"", anon:"" }, window.CORE_NUBE || {});

function cargarNube(){
  try{
    const c = JSON.parse(localStorage.getItem(NUBE_CFG) || "{}");
    nube.url = normalizaUrlNube(c.url);
    nube.anon = c.anon || "";
    nube.enlazado = !!c.enlazado;
  }catch(e){}
  // Equipo nuevo: adopta la nube del hotel sin preguntar nada.
  if (!nube.url && !nube.anon && NUBE_DEF.url && NUBE_DEF.anon){
    nube.url = normalizaUrlNube(NUBE_DEF.url);
    nube.anon = NUBE_DEF.anon;
    nube.enlazado = false;
    guardarNubeCfg();
  }
  try{ nube.sesion = JSON.parse(localStorage.getItem(NUBE_SESION) || "null"); }catch(e){}
}

function guardarNubeCfg(){
  try{ localStorage.setItem(NUBE_CFG,
    JSON.stringify({ url:nube.url, anon:nube.anon, enlazado:!!nube.enlazado })); }catch(e){}
}
function guardarSesion(){
  try{
    if (nube.sesion) localStorage.setItem(NUBE_SESION, JSON.stringify(nube.sesion));
    else localStorage.removeItem(NUBE_SESION);
  }catch(e){}
}

/** Llamada a la API con la llave y el token; renueva el token si caducó. */
async function api(ruta, opciones = {}, reintento = true){
  // Una sesión sin token se renueva antes de preguntar. Si no, la petición
  // sale como anónima y el servidor contesta una lista vacía —no un error—,
  // así que la aplicación creería que la nube se quedó sin datos.
  if (reintento && nube.sesion && !nube.sesion.access_token && nube.sesion.refresh_token)
    await renovarSesion();

  const h = Object.assign({
    "apikey": nube.anon,
    "Content-Type": "application/json"
  }, opciones.headers || {});
  if (nube.sesion && nube.sesion.access_token) h["Authorization"] = "Bearer " + nube.sesion.access_token;

  const r = await fetch(nube.url + ruta, Object.assign({}, opciones, { headers: h }));
  if (r.status === 401 && reintento && nube.sesion && nube.sesion.refresh_token){
    if (await renovarSesion()) return api(ruta, opciones, false);
  }
  if (!r.ok){
    let detalle = "";
    try{ const j = await r.json(); detalle = j.message || j.error_description || j.error || JSON.stringify(j); }
    catch(e){ detalle = await r.text().catch(() => ""); }
    throw new Error(`${r.status} · ${detalle || "sin detalle"}`);
  }
  // Al insertar con "return=minimal" el cuerpo viene vacío —a veces con 201,
  // a veces con 204—, así que no se puede pedir JSON a ciegas.
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

async function renovarSesion(){
  try{
    const r = await fetch(nube.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: nube.sesion.refresh_token })
    });
    if (!r.ok) return false;
    nube.sesion = await r.json();
    guardarSesion();
    return true;
  }catch(e){ return false; }
}

/**
 * Traduce lo que contesta el servidor de cuentas.
 *
 * Antes, cualquier fallo se anunciaba como "correo o contraseña incorrectos",
 * y eso mandaba a la gente a reescribir una contraseña que estaba bien cuando
 * lo que faltaba era confirmar la cuenta o corregir la dirección del proyecto.
 * Cada caso tiene que decir qué hacer.
 */
function errorDeEntrada(estado, j, crudo){
  const codigo = String(j.error_code || j.code || j.error || "").toLowerCase();
  const texto  = String(j.msg || j.message || j.error_description || "").toLowerCase();

  if (codigo.includes("email_not_confirmed") || texto.includes("not confirmed"))
    return "La cuenta existe pero está sin confirmar. En Supabase, Authentication → Users, " +
           "bórrala y vuelve a crearla marcando «Auto Confirm User».";
  if (codigo.includes("invalid_credentials") || codigo.includes("invalid_grant") ||
      texto.includes("invalid login"))
    return "Correo o contraseña incorrectos. Si estás seguro de la contraseña, cámbiala en " +
           "Supabase: Authentication → Users → los tres puntos del usuario → Reset password.";
  if (codigo.includes("user_banned")) return "Esa cuenta está bloqueada en Supabase.";
  if (estado === 429)
    return "Demasiados intentos seguidos. Espera un minuto y vuelve a probar.";
  if (estado === 401 || codigo.includes("no api key") || texto.includes("api key"))
    return "La llave pública no corresponde a este proyecto. Revísala en Ajustes → Nube y equipo.";
  if (estado === 404)
    return `La dirección del proyecto no responde a las cuentas (${esc(nube.url)}/auth/v1). ` +
           "Revisa que sea la de tu proyecto, sin nada pegado al final.";

  // Nada conocido: mejor enseñar lo que llegó que inventar un diagnóstico.
  const detalle = (j.msg || j.message || j.error_description || crudo || "").slice(0, 300);
  return `El servidor contestó ${estado}${detalle ? ": " + detalle : " sin explicación"}.`;
}

/* ----- Alta de un equipo nuevo sin dictar nada ----- */

const b64url = t => btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const deB64url = t => atob(t.replace(/-/g, "+").replace(/_/g, "/")
  .padEnd(Math.ceil(t.length / 4) * 4, "="));

/**
 * Una liga que ya trae dentro la dirección y la llave.
 *
 * Va en el fragmento —después del #— a propósito: esa parte no se manda al
 * servidor, así que la llave no queda escrita en los registros de quien
 * hospeda la página. Y al abrirla se borra de la barra de direcciones antes de
 * que alcance a colarse en el historial o en un favorito.
 */
const ligaInvitacion = () =>
  location.origin + location.pathname + "#nube=" +
  b64url(JSON.stringify({ u: nube.url, k: nube.anon }));

/**
 * Saca del enlace la configuración y, si viene, el pase de Core Quartz, y
 * borra el fragmento de la barra de direcciones.
 *
 * Se hace de inmediato, antes que ninguna otra cosa: mientras esté a la vista
 * puede acabar en un favorito o en el historial, y ahí van la llave y el pase.
 * Aplicarlo —que puede preguntar algo— es aparte y sí puede esperar.
 *
 * Devuelve `{ cfg, cq }`: `cfg` es la configuración de nube de siempre y `cq`
 * el token de un solo uso con el que Core Quartz manda a alguien ya
 * identificado. Cualquiera de los dos puede venir sin el otro.
 */
function leerInvitacion(){
  const hash = String(location.hash || "");
  const m  = hash.match(/[#&]nube=([A-Za-z0-9_-]+)/);
  const mc = hash.match(/[#&]cq=([A-Za-z0-9_.\-~%]+)/);
  if (!m && !mc) return null;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  let cfg = null;
  if (m){ try{ cfg = JSON.parse(deB64url(m[1])); }catch(e){ cfg = {}; } }
  let cq = null;
  if (mc){ try{ cq = decodeURIComponent(mc[1]); }catch(e){ cq = mc[1]; } }
  return { cfg, cq };
}

function aplicarInvitacion(cfg){
  if (!cfg) return;
  const url  = normalizaUrlNube(cfg && cfg.u);
  const anon = String((cfg && cfg.k) || "").trim();
  if (!url || !anon){
    alert("La liga de configuración llegó incompleta.\n\n" +
          "Suele pasar cuando se corta al copiarla o al mandarla por mensaje. " +
          "Pide que te la manden otra vez.");
    return;
  }
  if (nube.url && (nube.url !== url || nube.anon !== anon)){
    if (!confirm("Este equipo ya estaba conectado a otro servidor.\n\n" +
                 "¿Cambiarlo por el de esta liga? Tendrás que volver a entrar.")) return;
    nube.sesion = null;
    guardarSesion();
  }
  const otroServidor = nube.url !== url || nube.anon !== anon;
  nube.url = url;
  nube.anon = anon;
  nube.ultimo = "";
  if (otroServidor) nube.enlazado = false;   // servidor distinto: enlace nuevo
  guardarNubeCfg();
}

/** Deja la liga en el portapapeles, o a la vista si el navegador no deja. */
async function copiarInvitacion(){
  if (!/^https?:$/.test(location.protocol)){
    alert("Esta liga sólo sirve desde la dirección publicada del CRM.\n\n" +
          "Ábrelo desde su dirección de internet, no desde el archivo guardado en el equipo.");
    return;
  }
  const liga = ligaInvitacion();
  try{
    await navigator.clipboard.writeText(liga);
    alert("Liga copiada.\n\nMándala por WhatsApp o correo a quien vaya a usar el CRM. " +
          "Al abrirla, su equipo queda configurado y sólo le pedirá su correo y contraseña.\n\n" +
          "Ojo: quien la reciba puede conectarse al servidor, así que mándala nada más a los del equipo.");
  }catch(e){
    prompt("Copia esta liga y mándala a quien vaya a usar el CRM:", liga);
  }
}

/* ----- Diagnóstico ----- */

/** Lee lo que la llave lleva escrito dentro. No la valida: sólo la traduce. */
function leerLlave(anon){
  try{
    const p = anon.split(".")[1];
    const j = JSON.parse(atob(p.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(p.length/4)*4, "=")));
    return { ref:j.ref || "", rol:j.role || "", vence:j.exp ? new Date(j.exp*1000) : null };
  }catch(e){ return null; }
}

const refDeUrl = url => (String(url).match(/^https:\/\/([^.]+)\.supabase\./i) || [])[1] || "";

/**
 * Revisa la conexión paso por paso y dice en cuál se rompe.
 *
 * Cuando algo falla al entrar, el usuario no tiene modo de saber si el
 * problema es su contraseña, la llave, la dirección o una tabla que nunca se
 * creó: todo se ve igual desde la pantalla de entrada. Peor todavía si hay
 * dos proyectos en la misma cuenta, porque la dirección de uno con la llave
 * del otro parece bien escrita y nunca va a funcionar. Aquí se comprueba cada
 * cosa por separado.
 */
async function probarNube(url, anon){
  const pasos = [];
  const anota = (ok, titulo, detalle) => pasos.push({ ok, titulo, detalle });

  const llave = leerLlave(anon);
  if (!llave){
    anota(false, "La llave no se entiende",
      "No parece una llave de Supabase. Cópiala completa de Project Settings → API, " +
      "renglón «anon public», sin cortarla.");
    return pasos;
  }
  anota(true, "La llave se lee bien", `Es del proyecto <b>${esc(llave.ref)}</b>, permiso <b>${esc(llave.rol)}</b>.`);

  if (llave.rol !== "anon")
    anota(false, `Esa llave no es la pública, es «${esc(llave.rol)}»`,
      llave.rol === "service_role"
        ? "<b>La service_role salta todos los permisos y no debe ir dentro de una página.</b> " +
          "Bórrala de aquí y, por seguridad, revócala en Supabase. Usa la que dice «anon public»."
        : "Usa la que dice «anon public».");

  if (llave.vence && llave.vence < new Date())
    anota(false, "La llave caducó", `Venció el ${esc(fechaCorta(llave.vence.toISOString()))}. Genera una nueva en Supabase.`);

  // Sólo se pueden comparar cuando la dirección es la que reparte Supabase.
  // Quien lo tenga en servidor propio usa su dominio, y eso es legítimo: ahí
  // la comparación no aplica y son las pruebas de abajo las que hablan.
  const refUrl = refDeUrl(url);
  if (!refUrl)
    anota(true, "Dirección propia",
      `No es una de <code>supabase.co</code>, así que no se puede comparar con la llave ` +
      `(que es del proyecto <b>${esc(llave.ref)}</b>).`);
  else if (refUrl !== llave.ref)
    anota(false, "La dirección y la llave son de proyectos distintos",
      `La dirección apunta a <b>${esc(refUrl)}</b> y la llave es de <b>${esc(llave.ref)}</b>. ` +
      "Con dos proyectos en la misma cuenta es fácil mezclarlos. Toma los dos datos de la " +
      "misma pantalla: Project Settings → API del proyecto que quieras usar.");
  else
    anota(true, "La dirección y la llave son del mismo proyecto", esc(refUrl));

  // Servicio de cuentas
  try{
    const r = await fetch(url + "/auth/v1/settings", { headers:{ apikey:anon } });
    if (r.ok){
      const j = await r.json().catch(() => ({}));
      const correoOn = !j.external || j.external.email !== false;
      anota(true, "El servicio de cuentas responde",
        correoOn ? "Acepta entrar con correo y contraseña."
                 : "<b>Pero tiene apagado el acceso por correo.</b> Enciéndelo en " +
                   "Authentication → Sign In / Providers → Email.");
      if (!correoOn) pasos[pasos.length-1].ok = false;
    } else {
      anota(false, `El servicio de cuentas contestó ${r.status}`,
        r.status === 401 ? "La llave no vale para este proyecto."
                         : "Revisa que la dirección sea la del proyecto.");
    }
  }catch(e){
    anota(false, "No se pudo contactar al servicio de cuentas",
      "Sin internet, o la dirección está mal escrita.");
  }

  // El buzón donde los clientes dejan su firma
  try{
    const r = await fetch(url + "/rest/v1/crm_firmas?select=id&limit=1", { headers:{ apikey:anon } });
    if (r.status === 404 || r.status === 406)
      anota(true, "El enlace de firma no está habilitado",
        "Es opcional. Para que los clientes puedan firmar en su pantalla, corre " +
        "<code>firmas.sql</code> en el SQL Editor de Supabase.");
    else
      anota(true, "El buzón de firmas existe", "Los clientes pueden firmar desde su enlace.");
  }catch(e){ /* si falla la red ya se dijo arriba */ }

  // La tabla
  try{
    const r = await fetch(url + "/rest/v1/crm_datos?select=id&limit=1", { headers:{ apikey:anon } });
    if (r.ok) anota(true, "La tabla crm_datos existe", "El nube.sql ya se corrió en este proyecto.");
    else {
      const t = await r.text();
      anota(false, `La tabla no responde (${r.status})`,
        /does not exist|not find the table|schema cache/i.test(t)
          ? "<b>Falta correr el <code>nube.sql</code> en este proyecto.</b> " +
            "Ábrelo en el SQL Editor, pégalo completo y dale Run."
          : esc(t.slice(0, 200)));
    }
  }catch(e){
    anota(false, "No se pudo consultar la tabla", esc(e.message));
  }

  return pasos;
}

async function entrar(correo, contrasena){
  let r;
  try{
    r = await fetch(nube.url + "/auth/v1/token?grant_type=password", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ email: String(correo).trim(), password: contrasena })
    });
  }catch(e){
    throw new Error("No se pudo contactar al servidor. Revisa tu internet y que la dirección " +
                    `del proyecto esté bien escrita (${esc(nube.url)}).`);
  }
  const crudo = await r.text();
  let j = {};
  try{ j = JSON.parse(crudo); }catch(e){}
  if (!r.ok) throw new Error(errorDeEntrada(r.status, j, crudo));
  if (!j.access_token) throw new Error("El servidor respondió sin sesión. Vuelve a intentar.");
  nube.sesion = j;
  guardarSesion();
}

/**
 * Entrar con el pase de un solo uso que emite Core Quartz (PRD R5).
 *
 * El portal ya comprobó quién es y le pidió a Supabase un enlace mágico; aquí
 * sólo se canjea su `token_hash`. La sesión que sale es **del CRM**: el mismo
 * objeto, guardado en el mismo lugar que el acceso con contraseña. No se
 * comparten tokens entre aplicaciones.
 *
 * Si en este navegador quedó abierta la sesión de **otra** persona, primero se
 * va por el camino de «Cerrar sesión»: sube lo que tenga pendiente y borra su
 * copia local. Si no logra subirlo, pregunta, y si dice que no, aquí no se
 * abre nada: más vale quedarse fuera que perderle capturas a alguien.
 */
async function entrarConCore(tokenHash){
  const correoAnterior = correoSesion().trim().toLowerCase();

  // Primero se canjea el pase, pero **sin instalarlo**: hasta no saber de
  // quién es no se puede decidir si hay que despedir a quien estaba, y
  // despedirlo a ciegas le borraría la cartera a alguien que sólo volvió a
  // entrar desde el portal.
  let r;
  try{
    r = await fetch(nube.url + "/auth/v1/verify", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ type:"magiclink", token_hash: tokenHash })
    });
  }catch(e){
    throw new Error("No se pudo contactar al servidor para validar tu entrada. " +
                    "Revisa tu internet y vuelve a abrir el CRM desde Core Quartz.");
  }
  let j = {};
  try{ j = JSON.parse(await r.text()); }catch(e){}
  if (!r.ok || !j.access_token)
    throw new Error("El enlace ya se usó; entra desde Core Quartz otra vez");

  const correoNuevo = String((j.user && j.user.email) || "").trim().toLowerCase();

  // Es otra persona: el camino de «Cerrar sesión», y todavía con la sesión de
  // quien se va puesta, que es la única que puede subir lo suyo.
  if (correoAnterior && correoNuevo && correoAnterior !== correoNuevo){
    await salir();
    if (nube.sesion) return false;       // se arrepintió en el aviso: no se sigue
  }

  nube.sesion = j;
  guardarSesion();
  const ov = document.getElementById("entrada");
  if (ov) ov.remove();                   // `salir()` la deja puesta; ya no hace falta
  return true;
}

/**
 * Cerrar sesión, pensado para una computadora compartida.
 *
 * No basta con olvidar el token: la copia de trabajo de quien se va sigue en
 * el navegador, y quien entre después la vería completa aunque el servidor no
 * le entregue ni una fila. Así que se borra, y el siguiente que entre la baja
 * de nuevo desde la nube.
 *
 * Antes de borrar se intenta subir lo que quede pendiente. Si no se logra, se
 * pregunta: perder capturas por cerrar sesión sería el peor final posible.
 */
async function salir(){
  if (nubeActiva()){
    const faltan = () => filasDeEstado()
      .filter(f => sincronizado.get(f.id) !== JSON.stringify(f.datos)).length;
    if (faltan()){
      try{ await sincronizar(); }catch(e){}
      if (faltan() && !confirm(
        `Quedan ${faltan()} cambio(s) de este equipo sin subir y no se pudo conectar ` +
        "con la nube.\n\nSi cierras la sesión ahora se pierden.\n\n¿Cerrar de todos modos?"))
        return;
    }
  }

  detenerSondeo();
  nube.sesion = null;
  nube.ultimo = "";
  try{ localStorage.removeItem(FIRMA_LOCAL); }catch(e){}
  nube.enlazado = false;      // el que entre después baja todo otra vez
  nube.estado = "local";
  guardarSesion();
  guardarNubeCfg();

  // La cartera del que se va no se queda esperando al siguiente.
  sincronizado = new Map();
  state = sanear({});
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  vista = "tablero";
  filtros = { q:"", ejecutivo:"" };
  seleccion = new Set();

  render();
  pantallaEntrada();
}
