/* ----- Traducción entre el estado y las filas de la tabla ----- */

const COLECCIONES = ["clientes","actividades","convenios","contratos","eventos","prospectos",
                     "campanas","odts","huespedes","habitaciones","usuarios","certificados",
                     "serviciosBq"];
/**
 * Lo que roles.sql sólo deja escribir al administrador.
 *
 * `serviciosBq` está aquí aunque el servidor no lo exija —un tipo nuevo cae en
 * el `else true` de las reglas—, y es a propósito: sólo la administración ve
 * la pantalla de Ajustes, así que nadie más lo edita, y estar en esta lista es
 * lo que hace que en los demás equipos la copia del servidor gane en vez de
 * quedarse congelada con la de antes. Es el mismo trato que el catálogo de
 * habitaciones.
 */
const SOLO_ADMIN = ["ajustes","usuarios","habitaciones","serviciosBq"];

function filasDeEstado(){
  const filas = [];
  for (const tipo of COLECCIONES)
    for (const o of state[tipo]) filas.push({ id: tipo + ":" + o.id, tipo, datos: o });
  filas.push({ id:"ajustes:global", tipo:"ajustes", datos: state.ajustes });
  return filas;
}

function estadoDesdeFilas(filas){
  /* Ojo: esta lista se escribe a mano y tiene que traer TODAS las de
     COLECCIONES. Un tipo que falte aquí no da error: `bruto[f.tipo]` sale
     undefined y las filas se tiran en silencio, que es la peor manera de
     perder datos —nadie se entera hasta que alguien pregunta por lo suyo—. */
  const bruto = { clientes:[], actividades:[], convenios:[], contratos:[], eventos:[],
                  prospectos:[], campanas:[], odts:[], huespedes:[], habitaciones:[],
                  usuarios:[], certificados:[], serviciosBq:[], ajustes:null };
  for (const f of filas){
    if (f.tipo === "ajustes") bruto.ajustes = f.datos;
    else if (bruto[f.tipo]) bruto[f.tipo].push(f.datos);
  }
  if (!bruto.ajustes) delete bruto.ajustes;
  if (!bruto.usuarios.length) delete bruto.usuarios;
  return sanear(bruto);
}

function marcarSincronizado(filas){
  sincronizado = new Map(filas.map(f => [f.id, JSON.stringify(f.datos)]));
}

/**
 * Un renglón que llegó sin su cliente se cae del estado, y entonces la subida
 * lo vería como desaparecido y mandaría la lápida. Sacarlo de "ya
 * sincronizado" lo deja en paz: no se vuelve a subir, y tampoco se borra.
 */
function olvidarHuerfanos(){
  for (const id of huerfanos) sincronizado.delete(id);
  huerfanos = new Set();
}

/* ----- Bajada y subida ----- */

async function bajar(desde){
  const filtro = desde ? `&actualizado=gt.${encodeURIComponent(desde)}` : "";
  /* `order=id`: sin esto el servidor devuelve las filas como se le acomode
     —y una fila editada cambia de lugar—, así que un equipo recién enlazado
     recibía el catálogo en un orden distinto del de todos los demás. Quien
     manda el orden del catálogo es el campo `orden` de cada habitación; esto
     nada más quita una fuente de desorden gratuita. */
  const filas = await api(`/rest/v1/crm_datos?select=id,tipo,datos,actualizado,borrado${filtro}&order=id.asc`);
  return filas || [];
}

/**
 * De quién es una fila, para que el servidor pueda repartirlas.
 *
 * Todo cuelga del cliente: sus actividades y sus convenios son de quien lo
 * atiende. El catálogo, los textos, los usuarios y los huéspedes no son de
 * nadie —los necesita todo el equipo— y se quedan sin dueño a propósito.
 */
function duenioDe(fila){
  const deCliente = id => {
    const c = state.clientes.find(x => x.id === id);
    return (c && String(c.ejecutivo || "").trim()) || null;
  };
  if (fila.tipo === "clientes")    return String(fila.datos.ejecutivo || "").trim() || null;
  if (fila.tipo === "actividades") return deCliente(fila.datos.clienteId) ||
                                          String(fila.datos.responsable || "").trim() || null;
  if (fila.tipo === "convenios")   return String(fila.datos.ejecutivo || "").trim() ||
                                          deCliente(fila.datos.clienteId);
  if (fila.tipo === "contratos")   return String(fila.datos.ejecutivo || "").trim() ||
                                          deCliente(fila.datos.clienteId);
  if (fila.tipo === "eventos")     return String(fila.datos.ejecutivo || "").trim() ||
                                          deCliente(fila.datos.clienteId);
  /* Manda el asignado sobre el que lo capturó. Son cosas distintas: capturar
     es teclear, asignar es trabajarlo. Y de este renglón sale la columna
     `duenio` con la que roles.sql reparte, así que sin esto el ejecutivo al
     que se le asigna un lead NO LO RECIBIRÍA del servidor: lo seguiría viendo
     quien lo tecleó, que muchas veces es marketing y no tiene cartera. */
  if (fila.tipo === "prospectos")  return String(fila.datos.asignadoA || "").trim() ||
                                          String(fila.datos.capturadoPor || "").trim() || null;
  /* Las campañas y las órdenes de trabajo no se reparten: son del área, no de
     quien las capturó. Sin dueño marcado, el servidor se las entrega a todo
     marketing.

     En las ODT esto NO es un descuido, aunque tengan un asignado. Si el dueño
     fuera el asignado, la regla de roles.sql dejaría que sólo él la
     reescribiera, y el día que Pedro tocara una de Sidney el servidor le
     rebotaría la subida ENTERA —PostgREST manda el lote en un solo POST, así
     que un renglón rechazado se lleva a los demás—. A quién le toca trabajarla
     se guarda dentro del renglón: es un dato, no un permiso. */
  return null;
}

/**
 * Manda un puñado de renglones, y si el servidor los rechaza, los parte.
 *
 * ESTO ES EL CORAZÓN DEL ASUNTO. PostgREST traduce el lote a un
 * `insert ... on conflict do update` ÚNICO, así que un solo renglón rechazado
 * aborta la instrucción entera: no sube ése, y no suben los demás.
 *
 * Y con las reglas de roles.sql eso pasa de verdad: a un ejecutivo se le
 * rechaza un renglón que el servidor ya tiene A NOMBRE DE OTRO. Bastaba con
 * que Carmen tuviera bajado un convenio de Eduardo —de antes de que se
 * corrieran los papeles— para que desde ese día no le subiera NADA. Fue
 * exactamente lo que pasó con CV-2026-011.
 *
 * Así que: se intenta el montón entero, que es lo normal y sigue siendo UN
 * viaje. Si rebota, se parte en dos y se reintenta cada mitad, y así hasta el
 * renglón solo. Lo bueno entra, lo malo queda aislado y con nombre.
 *
 * Un renglón malo entre cien son unos siete viajes de más, no cien.
 */
async function mandarLote(filas, parte, yaRebotado){
  if (!filas.length) return;

  // Con yaRebotado se salta el intento completo: quien llama YA vio rebotar
  // este mismo montón y repetirlo tal cual sólo gastaría otro viaje. Un
  // renglón solo siempre se intenta, porque solo nunca se ha intentado.
  if (!yaRebotado || filas.length === 1){
    try{
      await api("/rest/v1/crm_datos?on_conflict=id", {
        method:"POST",
        headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify(filas)
      });
      for (const f of filas) parte.subidos.push(f.id);
      return;
    }catch(e){
      /* Un renglón solo que rebota ya no se parte más: es el culpable. Se
         apunta con su motivo y se sigue con los demás, que es justo lo que
         antes no pasaba. */
      if (filas.length === 1){
        parte.rechazados.push({ id: filas[0].id, tipo: filas[0].tipo, motivo: e.message });
        return;
      }
      /* Un error que no es del renglón —se cayó la red, caducó la sesión— no
         se arregla partiendo: partir haría N peticiones para fallar N veces.
         Se deja salir y la sincronización lo reporta como lo que es. */
      if (!esRechazoDeFila(e)) throw e;
    }
  }

  const mitad = Math.ceil(filas.length / 2);
  await mandarLote(filas.slice(0, mitad), parte);
  await mandarLote(filas.slice(mitad), parte);
}

/**
 * ¿El servidor rechazó ESTE renglón, o se cayó todo?
 *
 * Partir un lote sólo sirve para lo primero. Si lo que falló fue la red o la
 * sesión, partir multiplica el fracaso por el número de renglones.
 */
function esRechazoDeFila(e){
  const m = String((e && e.message) || "");
  return /row-level security|violates|check constraint|duplicate key|permission denied|42501|23514|23505|\b40[0-9]\b/i.test(m);
}

/**
 * Sube lo que cambió y devuelve el parte de lo que entró y lo que no.
 *
 * Ya no es "todo o nada": ver mandarLote(). Lo que el servidor rechace se
 * queda sin marcar como sincronizado, así que se vuelve a intentar en la
 * siguiente vuelta —sin estorbarle a lo demás— y se le dice a la persona.
 */
async function subir(cambios, borrados){
  const parte = { subidos: [], rechazados: [] };

  if (cambios.length){
    const arma = conDuenio => cambios.map(f => {
      const fila = { id:f.id, tipo:f.tipo, datos:f.datos, borrado:false,
        actualizado:new Date().toISOString(), actualizado_por: correoSesion() };
      if (conDuenio) fila.duenio = duenioDe(f);
      return fila;
    });

    /* La columna "duenio" sólo existe si se corrió roles.sql. Eso se prueba
       ANTES de ponerse a partir: sin la columna rebota todo, y partir un lote
       que va a rebotar entero no averigua nada. */
    if (!nube.sinDuenio){
      try{
        await api("/rest/v1/crm_datos?on_conflict=id", {
          method:"POST",
          headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify(arma(true))
        });
        for (const f of cambios) parte.subidos.push(f.id);
      }catch(e){
        // Sin la columna se recuerda por lo que dure la sesión: al día
        // siguiente se intenta otra vez, y si ya corrieron roles.sql, se usa.
        if (/duenio/i.test(e.message)){
          // Fue la columna, no un renglón: se vuelve a intentar el montón
          // entero sin ella, y sólo si ESO rebota se empieza a partir.
          nube.sinDuenio = true;
          await mandarLote(arma(false), parte);
        } else {
          if (!esRechazoDeFila(e)) throw e;
          await mandarLote(arma(true), parte, true);   // ya rebotó: directo a partir
        }
      }
    } else {
      await mandarLote(arma(false), parte);
    }
  }

  // Un borrado se marca en vez de eliminar la fila: si no, los demás equipos
  // nunca se enterarían de que desapareció. Va por el mismo camino, porque un
  // borrado también se puede rechazar por no ser de uno.
  if (borrados.length){
    await mandarLote(borrados.map(id => ({
      id, tipo:String(id).split(":")[0], datos:{}, borrado:true,
      actualizado:new Date().toISOString(), actualizado_por: correoSesion()
    })), parte);
  }
  return parte;
}

/**
 * Recoge del buzón las firmas que dejaron los clientes.
 *
 * El cliente no escribe sobre su convenio —no podría, y no debe—: deposita su
 * firma en crm_firmas y de ahí la levanta el CRM. Se hace en cada
 * sincronización, así que el ejecutivo se entera al minuto siguiente.
 *
 * Devuelve un parte de lo que encontró, no un sí o un no: cuando una firma no
 * se aplica hay que poder decir por qué, o se vuelve un misterio.
 */
async function recogerFirmas(){
  const parte = { hubo:false, buzon:true, pendientes:0, aplicadas:0, notas:[] };
  if (!nubeActiva()){ parte.buzon = false; parte.notas.push("No hay sesión en la nube."); return parte; }

  let filas;
  try{
    filas = await api("/rest/v1/crm_firmas?select=id,convenio_id,token,nombre,puesto,celular,img,creado&aplicada=is.false");
  }catch(e){
    // Sin firmas.sql corrido no existe el buzón. No es un error que reportar:
    // simplemente todavía no se usa esa forma de firmar.
    if (/crm_firmas|schema cache|does not exist|404|PGRST205/i.test(e.message)){
      nube.sinBuzon = true;
      parte.buzon = false;
      parte.notas.push("El buzón de firmas no existe todavía: falta correr firmas.sql en Supabase.");
      return parte;
    }
    parte.notas.push("No se pudo leer el buzón: " + e.message);
    return parte;
  }

  parte.pendientes = (filas || []).length;
  for (const f of filas || []){
    /* El buzón guarda el documento con su tipo adelante —'contratos:k123',
       'odts:o123'—; un convenio va pelado, como se mandó siempre. */
    const { tipo, id } = docDelBuzon(f.convenio_id);
    const info = infoDoc(tipo);
    const v = info.lista().find(x => x.id === id);
    if (!v){
      parte.notas.push(`Hay una firma de ${f.nombre || "un cliente"} para un documento que este equipo no tiene bajado.`);
      continue;                                  // no se marca: otro equipo la aplicará
    }
    const firma = { nombre:f.nombre, puesto:f.puesto, celular:f.celular,
                    fecha:f.creado || new Date().toISOString(), img:f.img };
    if (v[info.campoFirma]){
      parte.notas.push(`${v.folio} ya estaba firmado; se descartó una firma repetida.`);
    } else if (!v.tokenFirma || v.tokenFirma !== f.token){
      // Suele pasar si se rehizo el enlace: firmaron con el viejo.
      parte.notas.push(`La firma de ${f.nombre || "el cliente"} para ${v.folio} llegó con una clave que ya no corresponde. ` +
        "Vuelve a mandarle el enlace.");
    } else {
      info.aplica(v, firma, f);
      parte.aplicadas++;
      parte.hubo = true;
    }
    try{
      await api(`/rest/v1/crm_firmas?id=eq.${encodeURIComponent(f.id)}`, {
        method:"PATCH", headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({ aplicada:true })
      });
    }catch(e){
      parte.notas.push("La firma se aplicó pero no se pudo marcar como recogida; " +
        "puede volver a aparecer en el siguiente sondeo. " + e.message);
    }
  }
  return parte;
}

/** El botón: busca ahora y cuenta qué pasó. */
async function buscarFirmasAhora(e){
  const b = e.currentTarget, antes = b.textContent;
  b.disabled = true; b.textContent = "Buscando…";
  try{
    const p = await recogerFirmas();
    if (p.hubo) render();
    const cuerpo = !p.buzon
      ? p.notas.join("\n")
      : p.aplicadas
        ? `Se aplicaron ${p.aplicadas} firma(s). Los convenios ya quedaron cerrados.`
        : p.pendientes
          ? `Había ${p.pendientes} firma(s) en el buzón, pero ninguna se pudo aplicar.`
          : "El buzón está vacío: ningún cliente ha firmado desde su enlace todavía.";
    alert(cuerpo + (p.notas.length && p.buzon ? "\n\n" + p.notas.join("\n") : ""));
  }catch(ex){
    alert("No se pudo revisar el buzón: " + ex.message);
  }finally{ b.disabled = false; b.textContent = antes; }
}

function programarSubida(){
  if (!nubeActiva()) return;
  clearTimeout(nube.pendiente);
  nube.pendiente = setTimeout(() => sincronizar().catch(() => {}), 400);
}

/**
 * ¿Hay algo abierto, ahora mismo, que alguien pueda estar llenando?
 *
 * Importa porque al aplicar lo que baja la sincronización REEMPLAZA el estado
 * (`state = estadoDesdeFilas(...)`), y el formulario abierto se queda con el
 * objeto de antes en la mano: al guardar escribe en un objeto que ya nadie
 * mira, la pantalla dice «Guardado ✓» y lo tecleado se pierde sin un ruido.
 *
 * Esto ya se cuidaba, pero preguntando por `.overlay` —o sea, sólo por las
 * ventanas—. **Ajustes no es una ventana: es una pantalla entera**, y por ahí
 * se colaba. Marco lo reportó con el nombre de quien firma los certificados:
 * lo escribía, decía Guardado, y al rato no estaba. Le pasaba a TODO lo de
 * esa pantalla —los datos del hotel, el catálogo, la lista de usuarios—.
 */
const hayFormularioAbierto = () =>
  !!document.querySelector(".overlay") || (vista === "ajustes" && ajustesEnPantalla);

/**
 * Una captura de VERDAD abierta. Es el guardián del PRIMER enlace, y tiene
 * que ser más angosto que el de arriba por dos razones concretas:
 *
 *   · el primer enlace se hace desde Ajustes —la persona está justo ahí,
 *     queriéndolo—, y el botón recoge el formulario antes de enlazar;
 *   · y se hace otra vez al entrar, con la pantalla de acceso encima, que es
 *     un `.overlay` ella misma.
 *
 * Contando esas dos, el equipo no se enlazaría nunca. Lo que sí tiene que
 * detenerlo es una cotización o un certificado a medio llenar.
 */
const hayCapturaAbierta = () =>
  [...document.querySelectorAll(".overlay")].some(o => o.id !== "entrada");

/**
 * Ponerse al día por el camino que toque.
 *
 * Antes de enlazar hay que pasar por `primeraSincronizacion` —es la que
 * pregunta si se adoptan los datos de la nube—; después, por la de siempre.
 * Existe porque el primer enlace ahora se puede posponer, y quien lo reintente
 * no tiene por qué saber cuál de las dos le toca.
 */
const ponerseAlDia = () => nube.enlazado ? sincronizar() : primeraSincronizacion();

let sincronizando = false;
async function sincronizar(){
  if (!nubeActiva() || sincronizando) return;
  sincronizando = true;
  try{
    nube.estado = "sincronizando"; pintarNube();

    /* Lo que este equipo puede escribir en el servidor. Se calcula aquí arriba
       porque hace falta en las dos mitades: al bajar, para saber qué cambio
       local vale la pena proteger, y al subir, para no mandar lo que el
       servidor rebotaría. */
    const puedeTodo = esAdmin();
    const deMiIncumbencia = f => puedeTodo || !SOLO_ADMIN.includes(f.tipo);

    // Primero lo de los demás, luego lo propio: así una edición local reciente
    // gana sobre una copia remota vieja del mismo registro.
    const remotas = await bajar(nube.ultimo);
    /* Con algo abierto se MIRA pero no se toca, igual que en el sondeo. Y
       `nube.ultimo` NO se mueve: estas filas no se aplicaron, así que la
       vuelta de después tiene que volver a pedirlas. Subir sí se sube —lo que
       esta persona ya guardó no tiene por qué esperar a que cierre—. */
    if (remotas.length && hayFormularioAbierto()){
      nube.hayQueBajar = true;
    } else if (remotas.length){
      nube.hayQueBajar = false;
      const porId = new Map(filasDeEstado().map(f => [f.id, f]));
      const aplicadas = [];
      for (const r of remotas){
        nube.ultimo = !nube.ultimo || r.actualizado > nube.ultimo ? r.actualizado : nube.ultimo;
        /* Esto se borró aquí y la lápida todavía no sube. Si se dejara entrar,
           la siguiente vuelta lo metería de nuevo —y el borrado se desharía
           solo delante de la persona que acaba de hacerlo—. */
        if (tumbas.has(r.id) && !r.borrado) continue;

        /* UNA LÁPIDA NO ES UN CONFLICTO: ES UNA INSTRUCCIÓN.
           Y por eso se atiende ANTES de las protecciones de abajo.

           Abajo hay una regla que dice «si aquí hay una edición sin subir, no
           la pises». Para una lápida esa regla era mortal, porque la edición
           sin subir que creía estar protegiendo no existía: `sincronizado` es
           un Map en memoria y arranca VACÍO en cada recarga, así que TODO lo
           que ya estaba aquí parece recién editado. Resultado, las dos mitades
           de lo que reportó Marco:

             · la lápida se saltaba SIEMPRE —no a veces: siempre, en cada
               vuelta y en cada equipo—, así que el borrado no llegaba a nadie;

             · y el renglón, al verse como edición sin subir, se volvía a
               MANDAR con borrado:false. Eso resucitaba al cliente en el
               servidor y se lo devolvía hasta a quien lo había borrado. «Al
               tiempo vuelve a aparecer».

           Si de verdad hubiera una edición local sin subir sobre algo que otro
           borró, gana el borrado. Es lo deliberado de los dos, y nada se
           pierde: el renglón sigue en el servidor marcado como borrado, y la
           bitácora guarda lo que decía. */
        if (r.borrado){
          porId.delete(r.id);
          aplicadas.push(r);
          continue;
        }

        const local = porId.get(r.id);
        const mismoQueSincronizado = local && sincronizado.get(r.id) === JSON.stringify(local.datos);

        /* Si lo de aquí y lo del servidor son IDÉNTICOS no hay conflicto que
           proteger: se apunta como sincronizado y se sigue.

           Son dos renglones y destraban media aplicación. `sincronizado` es un
           Map en memoria: al recargar queda vacío, y sin esto TODO lo que ya
           existe aquí parecía una edición local sin subir. Consecuencias, las
           dos malas: no entraba nada de lo que cambiaron los demás sobre esos
           registros, y este equipo volvía a mandar su estado completo en cada
           recarga —arrastrando en cada intento el renglón que el servidor le
           rechaza—. Ahora, tras recargar, todo lo que nadie tocó queda marcado
           en la primera vuelta. */
        if (local && !mismoQueSincronizado &&
            JSON.stringify(local.datos) === JSON.stringify(r.datos)){
          sincronizado.set(r.id, JSON.stringify(local.datos));
          continue;
        }

        /* Hay edición local sin subir: no se pisa. PERO sólo si este equipo de
           verdad la puede subir.

           El catálogo de habitaciones, los ajustes y la lista de usuarios los
           escribe únicamente el administrador —`SOLO_ADMIN`—, y la subida de
           aquí abajo ni los intenta. Un cambio local en ellos no es una
           edición que proteger: es un rezago. Y protegerlo los CONGELABA para
           siempre: `sincronizado` arranca vacío al recargar, así que bastaba
           con que el administrador cambiara una tarifa una vez para que el
           renglón se viera distinto, se saltara, nunca se aplicara y nunca se
           marcara. En el equipo del ejecutivo la tarifa vieja se quedaba para
           el resto de los tiempos —y lo mismo el alta de un compañero nuevo—. */
        if (local && !mismoQueSincronizado && deMiIncumbencia(local)) continue;
        porId.set(r.id, { id:r.id, tipo:r.tipo, datos:r.datos });
        aplicadas.push(r);
      }
      if (aplicadas.length){
        state = estadoDesdeFilas([...porId.values()]);
        /* Lo que se cayó aquí se cayó porque el servidor mandó su lápida, no
           porque alguien de este equipo lo borrara. No se vuelve a tumbar. */
        alDiaSinTumbar(false);
        olvidarHuerfanos();
        try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
        // Se dan por sincronizadas SÓLO las filas que acaban de llegar. Marcar
        // todas de golpe daba por subido lo que este equipo aún no manda, y el
        // registro recién capturado se quedaba para siempre en esta máquina.
        const llegaron = new Set(aplicadas.map(r => r.id));
        for (const f of filasDeEstado())
          if (llegaron.has(f.id)) sincronizado.set(f.id, JSON.stringify(f.datos));
        for (const r of aplicadas)
          if (r.borrado) sincronizado.delete(r.id);
        render();
      }
    }

    // Las firmas que dejaron los clientes se recogen antes de subir, para que
    // el convenio cerrado viaje a los demás equipos en esta misma tanda.
    if ((await recogerFirmas()).hubo) render();
    // Los registros que dejaron en la liga entran antes de subir, para que
    // viajen a los demás equipos en esta misma tanda.
    if (!nube.sinBuzonAltas && (await recogerAltas()).hubo) render();
    // Y los de WhatsApp, que entran por el mismo camino y son los que más se
    // perdían: los anuncios del hotel son de mensajes.
    if (!nube.sinBuzonWa && (await recogerWhatsApp()).hubo) render();
    // Y las órdenes que levantaron los jefes de área desde su liga.
    if (!nube.sinBuzonOdts && (await recogerOdts()).hubo) render();
    if (resolverFoliosRepetidos()) render();

    const actuales = filasDeEstado();
    /* Lo que roles.sql sólo deja escribir al administrador ni se intenta
       mandar. No es una cortesía con el servidor: PostgREST sube el lote
       ENTERO en un solo POST, así que UN renglón rebotado tumba la subida
       completa —y con ella el contrato que acaban de firmar—. Bastaba con que
       un ejecutivo guardara su firma, que se escribe en su ficha de usuario,
       para que desde ese momento no le subiera absolutamente nada más.
       La protección ya existía, pero sólo al enlazar el equipo por primera
       vez; hacía falta en cada vuelta. */
    const cambios = actuales.filter(f =>
      deMiIncumbencia(f) && sincronizado.get(f.id) !== JSON.stringify(f.datos));
    const vivos = new Set(actuales.map(f => f.id));
    /* Las lápidas salen de lo APUNTADO, no de deducirlas de `sincronizado`:
       ése arranca vacío al recargar, y por eso un borrado se deshacía solo.

       Se conserva además la deducción vieja como red: lo que el servidor nos
       dio y aquí ya no vive, también se tumba. Una lápida de más no hace daño
       —el renglón ya estaba muerto—; una de menos es el defecto. */
    const borrados = [...new Set([...tumbas, ...sincronizado.keys()])].filter(id =>
      !vivos.has(id) && deMiIncumbencia({ tipo: String(id).split(":")[0] }));
    nube.rechazados = [];
    if (cambios.length || borrados.length){
      const parte = await subir(cambios, borrados);

      /* Antes esto era marcarSincronizado(actuales): si el POST no lanzaba, se
         daba TODO por subido. Con subida parcial eso mentiría, y un renglón
         rechazado quedaría marcado como si hubiera entrado —o sea, no se
         volvería a intentar nunca—. Se marca sólo lo que el servidor aceptó.
         Lo rechazado se queda pendiente para la vuelta siguiente, sin
         estorbarle a lo demás. */
      const entraron = new Set(parte.subidos);
      for (const f of actuales)
        if (entraron.has(f.id)) sincronizado.set(f.id, JSON.stringify(f.datos));
      for (const id of parte.subidos)
        if (!vivos.has(id)){
          sincronizado.delete(id);
          /* La lápida llegó: ya no hay nada que recordar. Si hubiera rebotado
             se queda apuntada y se reintenta en la vuelta siguiente, sin
             estorbarle al resto. */
          tumbas.delete(id);
        }
      guardarTumbas();
      nube.rechazados = parte.rechazados;
    }

    nube.estado = nube.rechazados.length ? "rechazado" : "listo";
    nube.sincronizadoEn = new Date().toISOString();
  }catch(e){
    nube.estado = "error";
    nube.error = e.message;
    console.warn("Sincronización:", e.message);
  }finally{
    sincronizando = false;
    pintarNube();
  }
}

/* ----- Sondeo ----- */

/**
 * Lo que cambió en el catálogo mientras alguien tiene un formulario abierto.
 *
 * `{ [tipoId]: { nombre, antes, ahora } }`, o null si no ha cambiado nada.
 * Lo llena el sondeo y lo leen los editores para avisar.
 */
let tarifasCambiadas = null;

/**
 * El sondeo, con un formulario abierto: MIRAR SIN TOCAR.
 *
 * Antes, con cualquier formulario abierto el sondeo se saltaba entero. Y no
 * era un descuido: al aplicar lo que baja, la sincronización REEMPLAZA el
 * estado (`state = estadoDesdeFilas(...)`), y el editor abierto tiene en la
 * mano el objeto de antes; si se le cambia el estado debajo, ese objeto queda
 * huérfano y al guardar se perdería sin decir nada.
 *
 * Pero saltárselo tenía su propio costo, y es el que Marco señaló: un
 * ejecutivo armando un convenio podía pasar media hora sin enterarse de que
 * cambió una tarifa, y cotizar contra un precio que ya no existe.
 *
 * Así que ahora se pregunta igual, pero sólo se MIRA: no se toca `state`, no
 * se repinta nada. Si cambió una tarifa se apunta, y el editor abierto lo
 * dice. Lo que baje se aplica por el camino de siempre en cuanto se cierre el
 * formulario.
 */
async function mirarSinTocar(){
  if (!nubeActiva()) return;
  let filas;
  try{ filas = await bajar(nube.ultimo); }catch(e){ return; }
  if (!filas || !filas.length) return;

  /* `nube.ultimo` NO se mueve aquí a propósito: estas filas no se aplicaron.
     Moverlo haría que la sincronización de verdad —la de cuando se cierre el
     formulario— no las volviera a pedir, y se perderían. */
  const cat = filas.filter(f => f.tipo === "habitaciones" && !f.borrado);
  if (!cat.length) return;

  const mios = new Map(state.habitaciones.map(h => [h.id, h]));
  const cambios = {};
  for (const f of cat){
    const id = String(f.id).split(":")[1];
    const mio = mios.get(id);
    const ahora = (f.datos || {}).publica;
    if (!mio || ahora === undefined || ahora === null) continue;
    if (Number(mio.publica) === Number(ahora)) continue;
    cambios[id] = { nombre: mio.nombre, antes: mio.publica, ahora };
  }
  if (!Object.keys(cambios).length) return;
  tarifasCambiadas = Object.assign(tarifasCambiadas || {}, cambios);
  avisarTarifas();
}

/** Pinta el aviso en los editores que estén abiertos y lo esperen. */
function avisarTarifas(){
  document.querySelectorAll("[data-aviso-tarifas]").forEach(el => {
    if (!tarifasCambiadas){ el.innerHTML = ""; return; }
    const lista = Object.values(tarifasCambiadas)
      .map(c => `${esc(c.nombre)} pasó de ${money(c.antes)} a ${money(c.ahora)}`);
    el.innerHTML = `<div class="note warn" style="margin:0 0 10px">
      <b>Las tarifas del catálogo cambiaron mientras tenías esto abierto.</b><br>
      ${lista.join("<br>")}
      <p style="margin:10px 0 0"><button class="btn" data-actualizar-tarifas>Actualizar
        precios</button> <span class="hint">Se conserva lo que ya tecleaste; sólo cambia la
        tarifa pública y el descuento.</span></p></div>`;
  });
}

function arrancarSondeo(){
  detenerSondeo();
  nube.timer = setInterval(() => {
    /* Con un formulario abierto no se aplica nada —ver mirarSinTocar—, pero sí
       se pregunta: enterarse no mueve nada de su sitio. */
    if (hayFormularioAbierto()){ mirarSinTocar().catch(() => {}); return; }
    ponerseAlDia().catch(() => {});
  }, SONDEO_MS);
}
function detenerSondeo(){ clearInterval(nube.timer); nube.timer = null; }

/* ----- Primer enlace: el momento delicado ----- */

async function primeraSincronizacion(){
  /* Con una captura abierta, el primer enlace ESPERA.
     Adoptar la nube reemplaza el estado entero, y el formulario abierto se
     queda con el objeto de antes en la mano: al guardar, lo tecleado se
     perdería sin decir nada. Pasa de verdad cuando se vence la sesión con una
     cotización abierta y hay que volver a entrar. Se reintenta solo al
     cerrarse el formulario, igual que la sincronización de siempre. */
  if (hayCapturaAbierta()){ nube.hayQueBajar = true; return; }

  const remotas = (await bajar()).filter(f => !f.borrado);
  const hayLocal = state.clientes.length || state.convenios.length || state.huespedes.length;

  if (!remotas.length){
    if (!hayLocal){ marcarSincronizado([]); nube.enlazado = true; guardarNubeCfg(); return; }
    if (!confirm(`La nube está vacía y este equipo tiene ${state.clientes.length} cliente(s).\n\n` +
                 "¿Subir los datos de este equipo para que sean los de todo el hotel?")){
      throw new Error("Enlace cancelado: la nube quedó vacía.");
    }
    marcarSincronizado([]);          // todo se verá como cambio y subirá
    nube.enlazado = true;
    guardarNubeCfg();
    await sincronizar();
    return;
  }

  if (hayLocal){
    if (!confirm(`La nube ya tiene ${remotas.filter(f => f.tipo === "clientes").length} cliente(s).\n\n` +
                 "Este equipo adoptará esos datos y los suyos locales se reemplazarán.\n" +
                 "Si tenías capturas sin subir, expórtalas antes.\n\n¿Continuar?")) {
      throw new Error("Enlace cancelado.");
    }
  }
  state = estadoDesdeFilas(remotas);
  /* Adoptar la nube reemplaza lo local. Eso NO es borrar: sin esto, el primer
     guardar tumbaría toda la cartera que este equipo tenía y la subiría como
     borrada. */
  alDiaSinTumbar(true);
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}

  // Se dan por sincronizadas SÓLO las filas que de verdad llegaron. Marcarlo
  // todo dejaba fuera para siempre lo que este equipo puso de su cosecha —el
  // catálogo y, sobre todo, la lista de usuarios— y una nube sin esa lista no
  // sabe quién es quién: con roles.sql corrido no reconoce a nadie, y a quien
  // no reconoce no le entrega nada. El equipo entero se queda con la pantalla
  // vacía, no nada más sin convenios.
  marcarSincronizado(remotas);
  olvidarHuerfanos();
  // Salvo para quien no tiene permiso de escribir esas tablas: a un ejecutivo
  // el servidor le rebotaría el intento y le tumbaría la subida entera.
  if (!esAdmin())
    for (const f of filasDeEstado())
      if (SOLO_ADMIN.includes(f.tipo)) sincronizado.set(f.id, JSON.stringify(f.datos));
  for (const r of remotas)
    nube.ultimo = !nube.ultimo || r.actualizado > nube.ultimo ? r.actualizado : nube.ultimo;
  nube.enlazado = true;
  guardarNubeCfg();
  render();
}

/**
 * Qué me está entregando el servidor a mí, ahora mismo.
 *
 * Cuando alguien dice "no veo los convenios", la pregunta de fondo siempre es
 * la misma: ¿el servidor no se los manda, o sí llegaron y la pantalla los
 * esconde? Esto lo contesta sin tener que abrirle la consola a nadie.
 */
async function revisarPermisos(){
  const yo = correoSesion().trim().toLowerCase();
  let filas, conDuenio = true;
  try{
    filas = await api("/rest/v1/crm_datos?select=id,tipo,duenio,datos&borrado=is.false");
  }catch(e){
    if (!/duenio/i.test(e.message)) throw e;
    conDuenio = false;   // no han corrido roles.sql: no existe la columna
    filas = await api("/rest/v1/crm_datos?select=id,tipo,datos&borrado=is.false");
  }

  const conteo = {};
  for (const f of filas) conteo[f.tipo] = (conteo[f.tipo] || 0) + 1;

  const usuarios = filas.filter(f => f.tipo === "usuarios");
  const mio = usuarios.find(f =>
    String((f.datos || {}).correo || "").trim().toLowerCase() === yo);

  return {
    correo: correoSesion(),
    conDuenio,
    conteo,
    total: filas.length,
    conDuenioN: conDuenio ? filas.filter(f => f.duenio).length : 0,
    usuariosNube: usuarios.length,
    meReconoce: !!mio,
    rolNube: mio ? (mio.datos.rol || "") : "",
    nombreNube: mio ? (mio.datos.nombre || "") : "",
    rolLocal: rolActual(),
    nombreLocal: miNombre()
  };
}

/** Sube la lista de usuarios aunque no haya cambiado. Sólo puede el administrador. */
async function empujarUsuarios(){
  for (const u of state.usuarios) sincronizado.delete("usuarios:" + u.id);
  await sincronizar();
  if (nube.estado === "error") throw new Error(nube.error || "sin detalle");
}

/** Vuelve a traerlo todo desde cero, sin el corte de "sólo lo nuevo". */
async function bajarTodo(){
  nube.ultimo = "";
  await sincronizar();
  if (nube.estado === "error") throw new Error(nube.error || "sin detalle");
}

const NOMBRE_TIPO = { clientes:"clientes", actividades:"actividades", convenios:"convenios",
  prospectos:"prospectos", huespedes:"huéspedes", habitaciones:"tipos de habitación",
  usuarios:"usuarios", ajustes:"ajustes", odts:"órdenes de trabajo",
  certificados:"certificados", serviciosBq:"servicios de banquetes" };

function pantallaPermisos(){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Qué me manda el servidor</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="permCuerpo">
        <div class="note">Preguntando…</div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const cuerpo = ov.querySelector("#permCuerpo");

  revisarPermisos().then(r => {
    const problemas = [];
    // Cero registros y cero usuarios es otra cosa que cero usuarios a secas, y
    // conviene no confundirlas: con roles.sql corrido, a quien no está en la
    // lista el servidor no le entrega NADA —ni el catálogo—, así que la lista
    // tampoco le llega, y de ahí que parezca que la nube no la tiene. Si
    // bajaron filas pero ninguna de usuarios, ahí sí es que la lista nunca se
    // subió.
    if (r.conDuenio && !r.total)
      problemas.push(`<b>Tu correo no está en la lista de usuarios de la nube.</b>
        El servidor no te entregó ni un registro —ni siquiera el catálogo—, que es
        lo que le hace a una cuenta que no da de alta: entra, pero no es del equipo
        de ventas. Está ${esc(r.correo)}, y hay que agregarlo en
        <i>Ajustes → Usuarios y permisos</i> escrito igual.
        <br>La otra explicación, que desde aquí se ve idéntica, es que la lista de
        usuarios nunca haya llegado a la nube; si al equipo entero le pasa lo
        mismo, es ésa.
        ${esAdmin() ? `<br><button class="btn primary sm" id="bSubirUsr"
            style="margin-top:8px">Subir la lista de usuarios ahora</button>`
          : `<br>Pídele a ${esc(nombresDeRol("admin") || "el administrador")} que te
             dé de alta y suba la lista desde aquí mismo.`}`);
    else if (r.conDuenio && !r.usuariosNube)
      problemas.push(`<b>La nube no tiene la lista de usuarios.</b> Corrieron
        <code>roles.sql</code>, y esas reglas leen de esa lista para saber quién es quién.
        Están bajando ${r.total} registro(s) y ni uno es de usuarios: sin esa lista
        el servidor no reconoce a nadie, y a quien no reconoce deja de entregarle
        primero lo que tenga dueño marcado y, con las reglas al día, absolutamente
        todo.
        ${esAdmin() ? `<br><button class="btn primary sm" id="bSubirUsr"
            style="margin-top:8px">Subir la lista de usuarios ahora</button>`
          : `<br>Pídele a ${esc(nombresDeRol("admin") || "el administrador")} que entre y
             lo haga desde aquí mismo.`}`);
    else if (r.conDuenio && !r.meReconoce)
      problemas.push(`<b>Tu correo no está en la lista de usuarios de la nube.</b>
        Está ${esc(r.correo)}, y en la nube hay ${r.usuariosNube}. Hay que agregarlo en
        <i>Ajustes → Usuarios y permisos</i> escrito igual, y volver a guardar.`);
    else if (r.conDuenio && r.rolNube !== r.rolLocal)
      problemas.push(`<b>El servidor te tiene con otro papel.</b> Él dice
        <b>${esc(infoRol(r.rolNube).name)}</b> y este equipo cree que eres
        <b>${esc(infoRol(r.rolLocal).name)}</b>. Manda el del servidor.`);

    cuerpo.innerHTML = `
      ${problemas.length
        ? problemas.map(x => `<div class="note warn">${x}</div>`).join("")
        : `<div class="note" style="border-left:3px solid var(--ok)">
             <b>Todo en orden.</b> El servidor te reconoce y te está mandando lo que te toca.</div>`}

      <div style="overflow:auto"><table class="data">
        <thead><tr><th>Lo que el servidor me entrega</th><th class="num">Registros</th></tr></thead>
        <tbody>${Object.keys(NOMBRE_TIPO).map(t => `<tr>
            <td>${esc(NOMBRE_TIPO[t])}</td>
            <td class="num"><b>${r.conteo[t] || 0}</b></td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${r.total}</b></td></tr></tbody></table></div>

      <div class="note" style="margin-top:14px">
        Entraste como <b>${esc(r.correo)}</b>.
        ${r.conDuenio
          ? `El servidor te tiene como <b>${esc(r.meReconoce ? infoRol(r.rolNube).name : "no registrado")}</b>${
              r.nombreNube ? `, a nombre de <b>${esc(r.nombreNube)}</b>` : ""}.
             Hay ${r.conDuenioN} registro(s) con dueño marcado.`
          : `Todavía no han corrido <code>roles.sql</code>: el servidor le entrega
             todo a cualquiera que entre, y lo que cada quien ve lo decide nada más
             esta pantalla.`}
      </div>

      <p style="margin:14px 0 0"><button class="btn" id="bBajarTodo">Volver a bajar todo</button>
        <span class="hint">Por si algo se quedó sin llegar a este equipo.</span></p>`;

    const bu = cuerpo.querySelector("#bSubirUsr");
    if (bu) bu.onclick = async e => {
      const b = e.currentTarget, antes = b.textContent;
      b.disabled = true; b.textContent = "Subiendo…";
      try{
        await empujarUsuarios();
        alert("Listo: la nube ya tiene la lista de usuarios.\n\n" +
              "Dile al equipo que recargue con Ctrl+F5 y ya verán lo que les toca.");
        ov.remove(); pantallaPermisos();
      }catch(ex){ alert("No se pudo subir: " + ex.message); }
      finally{ b.disabled = false; b.textContent = antes; }
    };

    cuerpo.querySelector("#bBajarTodo").onclick = async e => {
      const b = e.currentTarget, antes = b.textContent;
      b.disabled = true; b.textContent = "Bajando…";
      try{
        await bajarTodo();
        ov.remove(); pantallaPermisos();
      }catch(ex){ alert("No se pudo bajar: " + ex.message); }
      finally{ b.disabled = false; b.textContent = antes; }
    };
  }).catch(e => {
    cuerpo.innerHTML = `<div class="errbox">No se pudo preguntar: ${esc(e.message)}</div>`;
  });
}

/** Los nombres de quienes tienen cierto papel, para poder decir a quién acudir. */
const nombresDeRol = rol => state.usuarios.filter(u => u.rol === rol && u.nombre)
  .map(u => u.nombre).join(" o ");

/* ----- Interfaz ----- */

function pintarNube(){
  const el = document.getElementById("estadoNube");
  if (!el) return;
  el.style.display = "";

  // Un equipo sin nube se veía exactamente igual que uno conectado, nada más
  // que vacío: no había cómo distinguir "no hay convenios" de "este aparato no
  // está hablando con el hotel". Y como la configuración va por navegador y por
  // dirección, basta abrir la aplicación en otro navegador para caer aquí sin
  // enterarse. Ahora lo dice.
  if (!nube.url || !nube.anon){
    el.innerHTML = `<span class="punto-nube" style="background:var(--warn)"></span>Sólo este equipo`;
    el.title = "Este aparato no está conectado a la nube del hotel.\nClic para saber qué hacer.";
    el.classList.add("conSesion");
    el.onclick = menuSinNube;
    return;
  }
  const mapa = {
    local:          ["Sin conectar", "var(--muted)", "Configurada la nube, falta entrar"],
    sincronizando:  ["Sincronizando…", "var(--accent)", "Enviando y trayendo cambios"],
    listo:          ["En línea", "var(--ok)", (() => {
                      const u = usuarioActual();
                      return "Al día · " + (u ? `${u.nombre} · ${infoRol(u.rol).name}` : correoSesion());
                    })()],
    /* Un renglón que el SERVIDOR rechaza no es falta de internet, y decirle
       "Sin conexión" manda a la persona a revisar su módem mientras el
       convenio se queda sin subir. Estado propio, y clic para ver cuál. */
    rechazado:      ["Falta subir " + nube.rechazados.length, "var(--warn)",
                     "El servidor no aceptó " + nube.rechazados.length +
                     (nube.rechazados.length === 1 ? " registro" : " registros") +
                     ".\nLo demás sí subió. Clic para ver cuáles."],
    error:          ["Sin conexión", "var(--bad)", nube.error || "No se pudo sincronizar"]
  };
  const [txt, color, ayuda] = mapa[nube.estado] || mapa.local;
  const u = usuarioActual();
  // Con sesión abierta el chip dice de quién es y abre el menú para salir: en
  // una computadora compartida, cambiar de persona tiene que estar a la mano
  // y no escondido en unos Ajustes que sólo ve el administrador.
  const quien = nube.sesion ? ((u && u.nombre.split(" ")[0]) || correoSesion().split("@")[0]) : "";
  /* Con sesión el chip enseña el nombre, no el estado. Para lo rechazado eso
     no alcanza: quedaría sólo el punto de color, y de eso justamente se trata
     —que se vea—. Así que el nombre se acompaña de la cuenta. */
  const etiqueta = nube.rechazados.length ? (quien ? quien + " · " + txt : txt) : (quien || txt);
  el.innerHTML = `<span class="punto-nube" style="background:${color}"></span>` +
    esc(etiqueta);
  el.title = (quien ? txt + " · " : "") + ayuda + (nube.sesion ? "\nClic para cerrar sesión" : "");
  el.classList.toggle("conSesion", !!nube.sesion);
  /* Lo rechazado gana sobre el menú de sesión: es lo urgente, y es lo que la
     persona está tratando de entender cuando le pica al chip. */
  el.onclick = nube.rechazados.length ? menuRechazados : (nube.sesion ? menuSesion : null);
}

/**
 * Qué se quedó sin subir, y por qué.
 *
 * Antes esto no existía: un renglón rechazado dejaba un console.warn y un chip
 * que decía "Sin conexión". Nadie podía saber cuál era ni qué hacer.
 *
 * Se nombra por folio o por nombre, no por el id interno: "CV-2026-004, de
 * Eduardo Lara" le dice algo a quien lo lee; "convenios:v9" no.
 */
function menuRechazados(){
  const comoSeLlama = r => {
    const [tipo, id] = String(r.id).split(":");
    const lista = { clientes:state.clientes, convenios:state.convenios, contratos:state.contratos,
                    eventos:state.eventos, actividades:state.actividades, huespedes:state.huespedes,
                    prospectos:state.prospectos, campanas:state.campanas, odts:state.odts }[tipo];
    const x = lista && lista.find(y => y.id === id);
    if (!x) return { titulo: tipoLegible(tipo), sub: "" };
    const titulo = x.folio || nombreCompleto(x) || x.nombre || x.titulo || tipoLegible(tipo);
    const duenio = duenioDe({ tipo, datos:x }) || "";
    return { titulo, sub: duenio ? "a nombre de " + duenio : "" };
  };
  const porQue = m =>
    /row-level security|42501|permission denied/i.test(m)
      ? "El servidor no te deja escribir este registro. Casi siempre es porque allá está a " +
        "nombre de otra persona: quien lo tenga a su nombre sí puede guardarlo, o un " +
        "administrador puede reasignarlo."
      : /check constraint|23514/i.test(m) ? "El registro no cumple una regla del servidor."
      : /duplicate key|23505/i.test(m)    ? "Ya existe otro registro con esa clave."
      : m;

/**
 * El candado: mientras la aplicación sepa a qué nube conectarse y no haya
 * sesión, el CRM no está en la página.
 *
 * Se llama al poner la pantalla de entrar y al quitarla, y también desde
 * render(), para que no haya manera de dejarlo abierto por descuido.
 */
function candado(){
  // Ni el cliente que viene a firmar ni quien viene de un anuncio entran al
  // CRM: su pantalla es otra cosa y no tienen por qué dar una contraseña que
  // no tienen.
  if (enlaceDeFirma() || enlaceDeAlta() || enlaceDeOdt()) return false;
  const cerrado = !!(nube.url && nube.anon) && !nube.sesion;
  document.body.classList.toggle("sin-sesion", cerrado);
  if (cerrado && !document.getElementById("entrada")) pantallaEntrada();
  return cerrado;
}

function cerrarEntrada(){
  const ov = document.getElementById("entrada");
  if (ov) ov.remove();
  document.body.classList.remove("sin-sesion");
}

async function arrancarNube(){
  cargarNube();
  // El candado se echa AQUÍ, antes de la animación de entrada y antes de
  // cualquier espera. Si se dejara para después, un equipo con cartera
  // guardada y sin sesión la enseñaría unos segundos —y con "reducir
  // movimiento" no hay animación que la tape—.
  if (nube.url && nube.anon && !nube.sesion && !enlaceDeFirma() && !enlaceDeAlta())
    document.body.classList.add("sin-sesion");
  const invitacion = leerInvitacion();   // se limpia la barra de direcciones ya
  pintarNube();

  // Nada de lo que sigue puede aparecer encima de la animación de entrada:
  // el aviso la congelaría y el logo se quedaría a medio dibujar.
  await entradaLista;

  aplicarInvitacion(invitacion && invitacion.cfg);   // una liga de alta manda sobre lo que hubiera
  pintarNube();

  const pase = invitacion && invitacion.cq;
  if (!nube.url || !nube.anon){
    // Un pase sin dirección de nube no lleva a ninguna parte, y callarlo deja
    // a la persona mirando la pantalla de siempre sin saber qué pasó.
    if (pase) alert("Abre el CRM desde Core Quartz.\n\n" +
                    "Este equipo todavía no tiene configurada la nube, así que el enlace no " +
                    "puede validarse aquí.");
    return;                                     // sin configurar: modo local de siempre
  }

  if (pase){
    try{
      if (!await entrarConCore(pase)) return;
    }catch(ex){
      pantallaEntrada();
      const err = document.getElementById("errEntrar");
      if (err) err.innerHTML = `<div class="errbox">${esc(ex.message)}</div>`;
      return;
    }
  }

  if (!nube.sesion){ pantallaEntrada(); return; }
  // Preguntar "¿adopto los datos de la nube?" sólo tiene sentido la primera
  // vez que este equipo se conecta: después ya son los mismos datos, y volver
  // a preguntarlo en cada arranque es un estorbo diario que además no dice
  // nada. De la segunda vez en adelante se sincroniza y ya.
  ponerseAlDia()
    .then(() => { nube.estado = "listo"; pintarNube(); arrancarSondeo(); })
    .catch(e => {
      nube.estado = "error"; nube.error = e.message; pintarNube();
      if (/401|JWT|token/i.test(e.message)) pantallaEntrada();
    });
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoyISO = () => new Date().toISOString().slice(0,10);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

    maximumFractionDigits:2, minimumFractionDigits:2 }).format(Number(n)||0);

/** Para poder escribir "LOS PRECIOS SON EN PESOS MEXICANOS (MXN)" como en el machote. */
const MONEDAS = { MXN:"pesos mexicanos", USD:"dólares americanos", EUR:"euros", CAD:"dólares canadienses" };
const nombreMoneda = cod => (MONEDAS[String(cod || "").toUpperCase()] || String(cod || "")).toUpperCase();

const moneyMN = n => money(n) + " MN";

function fechaTexto(iso){
  if (!iso) return "";
  const d = new Date(iso.slice(0,10) + "T00:00:00");
  if (isNaN(d)) return iso;
  return `${d.getDate()} de ${MESES[d.getMonth()]} del ${d.getFullYear()}`;
}
function fechaCorta(iso){
  if (!iso) return "—";
  const d = new Date((iso.length <= 10 ? iso + "T00:00:00" : iso));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" });
}
function fechaHora(iso){
  if (!iso) return "—";
  const d = new Date((iso.length <= 10 ? iso + "T00:00:00" : iso));
  if (isNaN(d)) return iso;
  return d.toLocaleString("es-MX", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
/** Fecha en el formato de las firmas de la carta: 18 – 08- 2026 */
function fechaFirma(iso){
  if (!iso) return "";
  const d = new Date(iso.slice(0,10) + "T00:00:00");
  if (isNaN(d)) return iso.slice(0,10);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())} – ${p(d.getMonth()+1)} – ${d.getFullYear()}`;
}

/**
 * Lee montos escritos como sea: "$120,000.50", "1.250.000", "89500,75", "(1,200)".
 * El último separador es decimal sólo si deja 1 o 2 dígitos detrás; si deja 3 o
 * más es separador de miles. Sirve igual para formato latino y anglosajón.
 */
function parseMoney(v){
  if (v == null || v === "") return 0;
  if (typeof v === "number") return v;
  const src = String(v).trim();
  const neg = src.includes("-") || /^\(.*\)$/.test(src);
  let s = src.replace(/[^\d.,]/g, "");
  if (!s) return 0;
  const sep = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  if (sep > -1){
    const dec = s.length - sep - 1;
    s = (dec >= 1 && dec <= 2)
      ? s.slice(0, sep).replace(/[.,]/g, "") + "." + s.slice(sep + 1)
      : s.replace(/[.,]/g, "");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -Math.abs(n) : n);
}

/** Acepta 2026-09-04, 04/09/2026, 4-9-26 y los seriales de Excel. */
function parseDate(v){
  if (!v) return "";
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if (/^\d{5}$/.test(s)) return new Date(Date.UTC(1899,11,30) + Number(s)*864e5).toISOString().slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m){
    let [,a,b,y] = m;
    if (y.length === 2) y = "20" + y;
    let dd = +a, mm = +b;
    if (mm > 12 && dd <= 12){ const t = dd; dd = mm; mm = t; }
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
    return `${y}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
  }
  const d = new Date(s);
  return isNaN(d) ? "" : d.toISOString().slice(0,10);
}

function matchEstatus(v){
  const s = String(v || "").trim().toLowerCase();
  if (!s) return "contactado";
  const hit = ESTATUS.find(e => e.id === s || e.name.toLowerCase() === s);
  if (hit) return hit.id;
  const reglas = [
    [/gan[oa]|won|cerrad[oa]\s*gan|exito|éxito|firmad/, "ganado"],
    [/perd|lost|cancel|rechaz|declin|no\s*interes/, "perdido"],
    [/cotiz.*enviad|enviad.*cotiz|propuesta\s*enviad/, "cotizacion_enviada"],
    [/negoc|cierre/, "negociacion"],
    [/propuesta|cotiz|oferta|proposal|quote/, "propuesta"],
    [/contact|seguimiento|llamad|prospec|nuevo|lead|inicial/, "contactado"]
  ];
  for (const [re, id] of reglas) if (re.test(s)) return id;
  return "contactado";
}

/** La lada que usa el hotel cuando el cliente no tiene la suya. */
const ladaHotel = () =>
  String((state && state.ajustes && state.ajustes.ladaPais) || "52").replace(/\D/g, "") || "52";

/**
 * El enlace de WhatsApp, con la lada que le toca a ESE número.
 *
 * Tijuana está pegada a San Diego y el hotel tiene mucho cliente americano. Un
 * número de diez dígitos se ve igual en los dos países, así que adivinar no es
 * una opción: la lada se pregunta una vez en la ficha del cliente.
 *
 * Cuatro reglas, en este orden:
 *
 *   1. Si el teléfono trae "+", se respeta tal cual: ya viene con su país.
 *   2. Diez dígitos → se le pone la lada del cliente, o la del hotel si no
 *      tiene una suya.
 *   3. Once dígitos que empiezan con 1: AQUÍ ESTÁ EL ENREDO. "1 + diez" es a
 *      la vez el formato viejo de los celulares mexicanos (+52 1 664…) y el
 *      de Estados Unidos y Canadá (+1 619…). Escritos así son idénticos, y por
 *      eso se pregunta el país en la ficha:
 *        · con lada 52 → es el formato viejo: se le quita el 1 y se le pone 52.
 *        · con cualquier otra → ya está completo y no se toca.
 *      Antes esto se decidía con la lada DEL HOTEL, que es 52 para todos, así
 *      que a un cliente de San Diego se le mandaba el mensaje a un número
 *      ajeno en Tijuana.
 *   4. Cualquier otra cosa más larga ya trae su lada: no se toca.
 */
function waLink(tel, texto, lada){
  const crudo = String(tel || "").trim();
  let d = crudo.replace(/\D/g, "");
  if (!d) return "";
  const suya = String(lada || "").replace(/\D/g, "") || ladaHotel();

  if (crudo.startsWith("+")){
    // Tal como lo capturaron: quien escribió el + sabe de dónde es.
  } else if (d.length === 10){
    d = suya + d;
  } else if (d.length === 11 && d[0] === "1" && suya === "52"){
    d = "52" + d.slice(1);
  }
  return "https://wa.me/" + d + (texto ? "?text=" + encodeURIComponent(texto) : "");
}

/** La lada de un cliente, de un huésped o de quien sea que tenga ficha. */
const ladaDe = o => String((o && o.lada) || "").replace(/\D/g, "") || ladaHotel();

function abrirWhatsApp(c){
  if (!c) return;
  const url = waLink(c.telefono,
    `Hola${c.contacto ? " " + c.contacto.split(" ")[0] : ""}, le escribo de ${state.ajustes.hotel.nombre}.`,
    ladaDe(c));
  if (!url){ alert("Este cliente no tiene teléfono registrado."); return; }
  window.open(url, "_blank", "noopener");
}

/** Sustituye los marcadores de los textos de la carta. */
function vars(txt, conv, cli){
  const vig = textoVigencia(conv);
  const anio = (conv.vigenciaHasta || conv.fecha || hoyISO()).slice(0,4);
  return String(txt || "")
    .replace(/\{\{HOTEL\}\}/g,    state.ajustes.hotel.nombre)
    .replace(/\{\{EMPRESA\}\}/g,  (cli && cli.empresa) || "")
    .replace(/\{\{CONTACTO\}\}/g, (cli && cli.contacto) || "")
    .replace(/\{\{VIGENCIA\}\}/g, vig)
    .replace(/\{\{ANIO\}\}/g,     anio);
}

function textoVigencia(v){
  const d = v.vigenciaDesde, h = v.vigenciaHasta;
  if (d && h) return `a partir del ${fechaTexto(d)} y hasta el ${fechaTexto(h)}`;
  if (h)      return `a partir de hoy y hasta el ${fechaTexto(h)}`;
  if (d)      return `a partir del ${fechaTexto(d)}`;
  return "según lo acordado";
}

/* ----- CSV ----- */

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const nl = text.indexOf("\n");
  const head = text.slice(0, nl === -1 ? text.length : nl);
  const delim = (head.match(/\t/g)||[]).length > (head.match(/,/g)||[]).length ? "\t"
              : (head.match(/;/g)||[]).length > (head.match(/,/g)||[]).length ? ";" : ",";
  const filas = []; let fila = [], celda = "", comillas = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (comillas){
      if (c === '"'){ if (text[i+1] === '"'){ celda += '"'; i++; } else comillas = false; }
      else celda += c;
      continue;
    }
    if (c === '"') comillas = true;
    else if (c === delim){ fila.push(celda); celda = ""; }
    else if (c === "\n"){ fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else if (c !== "\r") celda += c;
  }
  if (celda !== "" || fila.length){ fila.push(celda); filas.push(fila); }
  return filas.filter(f => f.some(c => String(c).trim() !== ""));
}

const toCSV = filas => filas.map(f => f.map(c => {
  const s = String(c ?? "");
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}).join(",")).join("\r\n");

function descargar(nombre, contenido, mime){
  const blob = new Blob(["\uFEFF" + contenido], { type: (mime||"text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/**
 * Adivina qué columna del archivo corresponde a cada campo. Primero resuelve
 * TODAS las coincidencias exactas y luego las parciales, para que una parcial
 * de otro campo no se lleve una columna que alguien más nombra igualito.
 */
function autoMapear(campos, heads){
  const norm = x => String(x).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
  const hN = heads.map(norm);
  const cands = f => [f.label, f.key, ...(f.aliases || [])].map(norm).filter(Boolean);
  const usados = new Set(), hallado = {};

  for (const f of campos){
    const cs = cands(f);
    for (let i = 0; i < hN.length; i++){
      if (usados.has(i) || !hN[i]) continue;
      if (cs.includes(hN[i])){ hallado[f.key] = i; usados.add(i); break; }
    }
  }
  for (const f of campos){
    if (hallado[f.key] != null) continue;
    const cs = cands(f).filter(x => x.length > 3);
    for (let i = 0; i < hN.length; i++){
      if (usados.has(i) || hN[i].length < 3) continue;
      if (cs.some(x => hN[i].includes(x) || x.includes(hN[i]))){ hallado[f.key] = i; usados.add(i); break; }
    }
  }
  return hallado;
}

/* ----- Lectura de .xlsx -----
   Un .xlsx es un ZIP con XML dentro. Se lee el directorio central, se sacan
   sólo la primera hoja y las cadenas compartidas, y se inflan con
   DecompressionStream, que traen los navegadores modernos. Así no hace falta
   ninguna librería externa. */

async function inflar(datos){
  if (typeof DecompressionStream !== "function")
    throw new Error("Este navegador no puede descomprimir archivos .xlsx.\n\n" +
                    "Guarda la hoja como CSV (Archivo → Guardar como → CSV) y súbela así.");
  const flujo = new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Response(flujo).text();
}

async function abrirZip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("El archivo no parece un .xlsx válido.");

  const total = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const salida = {};
  for (let k = 0; k < total; k++){
    if (off + 46 > buf.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const metodo   = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nLen = dv.getUint16(off + 28, true);
    const eLen = dv.getUint16(off + 30, true);
    const cLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const nombre = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nLen));
    off += 46 + nLen + eLen + cLen;
    if (!/^xl\/(worksheets\/sheet\d+|sharedStrings)\.xml$/.test(nombre)) continue;

    const lnLen = dv.getUint16(local + 26, true);
    const leLen = dv.getUint16(local + 28, true);
    const ini = local + 30 + lnLen + leLen;
    const datos = buf.subarray(ini, ini + compSize);
    salida[nombre] = metodo === 0 ? new TextDecoder().decode(datos) : await inflar(datos);
  }
  return salida;
}

/** "C7" -> 2. Hace falta porque Excel omite las celdas vacías. */
function columnaDe(ref){
  const m = /^([A-Z]+)/.exec(String(ref || ""));
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

async function leerXLSX(archivo){
  const partes = await abrirZip(new Uint8Array(await archivo.arrayBuffer()));
  const dp = new DOMParser();

  let cadenas = [];
  if (partes["xl/sharedStrings.xml"]){
    const sd = dp.parseFromString(partes["xl/sharedStrings.xml"], "application/xml");
    cadenas = [...sd.getElementsByTagName("si")].map(si =>
      [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  }

  const hoja = Object.keys(partes).filter(n => /worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if (!hoja) throw new Error("El archivo no trae ninguna hoja de cálculo.");
  const doc = dp.parseFromString(partes[hoja], "application/xml");
  if (doc.getElementsByTagName("parsererror").length)
    throw new Error("No se pudo leer la hoja de cálculo.");

  const filas = [];
  for (const row of doc.getElementsByTagName("row")){
    const celdas = [];
    for (const c of row.getElementsByTagName("c")){
      const col = columnaDe(c.getAttribute("r"));
      const t = c.getAttribute("t");
      let v = "";
      if (t === "inlineStr") v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      else {
        const ve = c.getElementsByTagName("v")[0];
        v = ve ? ve.textContent : "";
        if (t === "s") v = cadenas[Number(v)] ?? "";
      }
      celdas[col] = v;
    }
    for (let i = 0; i < celdas.length; i++) if (celdas[i] === undefined) celdas[i] = "";
    filas.push(celdas);
  }
  return filas.filter(f => f.some(c => String(c).trim() !== ""));
}

/* ==========================================================================
   GENERACIÓN DE PDF EN EL NAVEGADOR

   Ni mailto: ni wa.me admiten adjuntos: sólo transportan texto. La única vía
   para mandar el archivo junto con el mensaje es navigator.share() con un
   File, así que hace falta un PDF de verdad hecho aquí mismo.

   Se hace en dos pasos: la hoja se rasteriza tal como se ve —vía un
   foreignObject de SVG, que no necesita ninguna librería— y esa imagen se
   envuelve en un PDF mínimo. El resultado es fiel al documento impreso
   porque es literalmente el mismo render; a cambio, su texto no es
   seleccionable.
   ========================================================================== */

const PT_ANCHO = 612, PT_ALTO = 792;      // carta en puntos PostScript
const PX_ANCHO = 816, PX_ALTO = 1056;     // la misma carta a 96 dpi
const ESCALA_PDF = 2;                     // para que no se vea pixelado

/** Convierte un elemento del documento en un JPEG del tamaño de una hoja carta. */
function rasterizarHoja(el, op){
  /* `sangrada` es para el certificado de cortesía: su imagen de fondo llega
     hasta la orilla, así que la hoja no lleva margen. Una carta normal sí lo
     lleva, y por eso es lo que sigue pasando sin pedir nada. */
  const relleno = (op && op.sangrada) ? "0" : "16mm 18mm";
  return new Promise((resolve, reject) => {
    // Dentro del SVG el medio es "pantalla", así que las reglas de @media print
    // no aplican: la sangría de la hoja se pone aquí a mano.
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    // La hoja se vuelve a colgar de un .doc-body real: los estilos de la carta
    // son selectores descendentes de él, y sin ese ancestro se pierden.
    const clon = el.cloneNode(true);
    clon.style.cssText = "position:relative;border:0;margin:0;padding:0";

    const papel = document.createElement("div");
    papel.className = "doc-body";
    papel.style.cssText = `width:100%;height:100%;padding:${relleno};margin:0;` +
      "box-sizing:border-box;background:#fff;overflow:hidden";
    papel.appendChild(clon);

    const envoltura = document.createElement("div");
    envoltura.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    envoltura.style.cssText = `width:${PX_ANCHO}px;height:${PX_ALTO}px;background:#fff;` +
      `font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    envoltura.innerHTML = `<style>${css}</style>`;
    envoltura.appendChild(papel);

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PX_ANCHO}" height="${PX_ALTO}">` +
      `<foreignObject width="100%" height="100%">` +
      new XMLSerializer().serializeToString(envoltura) + `</foreignObject></svg>`;

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = PX_ANCHO * ESCALA_PDF;
      cv.height = PX_ALTO * ESCALA_PDF;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, 0, 0, cv.width, cv.height);
      try{ resolve(cv.toDataURL("image/jpeg", 0.92)); }
      catch(e){ reject(new Error("El navegador bloqueó la conversión de la hoja a imagen.")); }
    };
    img.onerror = () => reject(new Error("Este navegador no pudo convertir la carta a imagen."));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

const base64ABytes = b64 => {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
};

/** PDF mínimo: una página tamaño carta por imagen, cada una a página completa. */
function pdfDesdeImagenes(dataUrls){
  const enc = new TextEncoder();
  const trozos = [];
  let largo = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; trozos.push(b); largo += b.length; };

  const n = dataUrls.length;
  const objetos = [];                       // desplazamiento de cada objeto
  const idPagina = i => 3 + i * 3;          // página, imagen y contenido por hoja

  push("%PDF-1.4\n");
  const obj = (num, cuerpo, flujo) => {
    objetos[num] = largo;
    push(`${num} 0 obj\n${cuerpo}\n`);
    if (flujo){ push("stream\n"); push(flujo); push("\nendstream\n"); }
    push("endobj\n");
  };

  obj(1, `<< /Type /Catalog /Pages 2 0 R >>`);
  obj(2, `<< /Type /Pages /Kids [${dataUrls.map((_,i) => `${idPagina(i)} 0 R`).join(" ")}] /Count ${n} >>`);

  dataUrls.forEach((url, i) => {
    const bytes = base64ABytes(url.split(",")[1]);
    const pg = idPagina(i), im = pg + 1, ct = pg + 2;
    obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PT_ANCHO} ${PT_ALTO}] ` +
            `/Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(im, `<< /Type /XObject /Subtype /Image /Width ${PX_ANCHO*ESCALA_PDF} ` +
            `/Height ${PX_ALTO*ESCALA_PDF} /ColorSpace /DeviceRGB /BitsPerComponent 8 ` +
            `/Filter /DCTDecode /Length ${bytes.length} >>`, bytes);
    const contenido = `q ${PT_ANCHO} 0 0 ${PT_ALTO} 0 0 cm /Im0 Do Q`;
    obj(ct, `<< /Length ${contenido.length} >>`, enc.encode(contenido));
  });

  const totalObj = 2 + n * 3;
  const inicioXref = largo;
  let xref = `xref\n0 ${totalObj + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= totalObj; i++)
    xref += String(objetos[i]).padStart(10, "0") + " 00000 n \n";
  push(xref);
  push(`trailer\n<< /Size ${totalObj + 1} /Root 1 0 R >>\nstartxref\n${inicioXref}\n%%EOF\n`);

  const salida = new Uint8Array(largo);
  let o = 0;
  for (const t of trozos){ salida.set(t, o); o += t.length; }
  return salida;
}

/** Nombre de archivo sin acentos ni caracteres que molesten al sistema. */
const nombreArchivo = txt => String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70);

const cliente     = id => state.clientes.find(c => c.id === id);
const actsDe      = id => state.actividades.filter(a => a.clienteId === id)

                            .sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
/**

 */
const actsVisiblesDe = id => {

/* ----- Lo que una columna dice en cada departamento -----------------------
   El cliente lleva dos etapas y dos ejecutivos: los de ventas y los de
   banquetes. Cuál par se lee lo decide el departamento en el que se está, y se
   decide AQUÍ, en un solo lugar: si cada pantalla lo preguntara por su cuenta,

   -------------------------------------------------------------------------- */
const campoEstatus   = () => enBanquetes() ? "estatusBq"   : "estatus";
const campoEjecutivo = () => enBanquetes() ? "ejecutivoBq" : "ejecutivo";
const estatusDeCli   = c => String((c || {})[campoEstatus()]   || "");
const ejecutivoDeCli = c => String((c || {})[campoEjecutivo()] || "").trim();
/** La etapa, o nada. `est()` no sirve aquí: para lo vacío inventa
    «Contactado», y en banquetes vacío quiere decir que nadie lo ha tratado. */
const estatusSiHay = id => ESTATUS.find(e => e.id === id) || null;
/** La columna de más que lleva el tablero de banquetes: los que nadie tomó. */
const SIN_TRATAR = { id:"", name:"Sin tratar", color:"var(--panel-2)", ink:"var(--muted)" };
const columnasEstatus = () => enBanquetes() ? [SIN_TRATAR, ...ESTATUS] : ESTATUS;
/** Lo que banquetes le ha vendido a un cliente: sus eventos ya confirmados. */
const vendidoBq = evs => (evs || []).filter(e => e.estado === "confirmado")
  .reduce((a, e) => a + cuentasEvento(e).total, 0);

function clientesVisibles(){
  const q = filtros.q.trim().toLowerCase();
  return state.clientes.filter(c => {
    if (!esMio(c)) return false;
    /* Por el ejecutivo que se está VIENDO: en banquetes se busca y se filtra
       por lo que dice la pantalla, no por el dueño de ventas que no sale. */
    if (filtros.ejecutivo && ejecutivoDeCli(c) !== filtros.ejecutivo) return false;
    if (!q) return true;
    return [c.empresa,c.contacto,c.telefono,c.email,c.ubicacion,ejecutivoDeCli(c),c.notas]
      .join(" ").toLowerCase().includes(q);
  });
}

   RENDER
   ========================================================================== */

function render(){
  // Nada de lo que sigue se ve si no hay sesión; se dibuja igual para que al
  // entrar esté listo, pero el candado lo deja fuera de la página.
  candado();
  ajustarDepto();
  // Cada papel ve las suyas. Los Ajustes tocan las tarifas públicas, los textos
  // de los convenios y la conexión de todo el equipo: son del administrador.
  // Y si alguien llegó a una pestaña que no le toca, se le desvía.
  document.querySelectorAll("nav button").forEach(b =>
    b.style.display = puedeVer(b.dataset.view) ? "" : "none");
  if (!puedeVer(vista)) vista = vistasDelRol()[0] || "formulario";

  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.view === vista)));
  document.querySelectorAll(".view").forEach(v =>
    v.id === "v-" + vista ? v.setAttribute("data-on","") : v.removeAttribute("data-on"));

  const buscando = ["tablero","clientes","actividades","certificados"].includes(vista);
  const porEjecutivo = vista === "tablero" || vista === "clientes";
  document.getElementById("q").style.display      = buscando ? "" : "none";
  document.getElementById("fEje").style.display   = porEjecutivo ? "" : "none";
  document.getElementById("bNuevo").style.display =
    ["tablero","clientes"].includes(vista) ? "" : "none";
  // Importar y Exportar mueven la cartera entera: quien no la ve, tampoco.
  const conCartera = puedeVer("clientes") ? "" : "none";
  document.getElementById("bImport").style.display = conCartera;
  document.getElementById("bExport").style.display = conCartera;

  renderEjecutivos();
  pintarNube();
  pintarDepto();
  pintarBotonIA();
  pintarAvisos();
  if (vista === "tablero")   { renderKpis(); renderTablero(); }
  if (vista === "clientes")  renderClientes();
  if (vista === "actividades") renderActividades();
  if (vista === "convenios") renderConvenios();
  if (vista === "contratos") renderContratos();
  if (vista === "eventos") renderEventos();
  if (vista === "contratosbq") renderContratosBq();
  if (vista === "mktdash") renderMktDash();
  if (vista === "campanas") renderCampanas();
  if (vista === "odts") renderOdts();
  if (vista === "calendario") renderCalendario();
  if (vista === "reportes") renderReportes();
  if (vista === "confirmaciones") renderConfirmaciones();
  if (vista === "certificados") renderCertificados();
  if (vista === "leads") renderLeads();
  if (vista === "formulario") renderFormulario();
  /* Los Ajustes son una pantalla entera de campos que se llenan a mano —la
     lista de usuarios, el catálogo de habitaciones, los datos del hotel— y que
     NO se guardan solos: se guardan con el botón de abajo. Volver a dibujarla
     mientras alguien la está llenando le borra lo que lleva escrito sin
     decirle nada, y después el botón guarda lo viejo: parece que no sirve.
     Pasaba de verdad, cada vez que el sondeo traía algo de otro equipo —el
     papel que acababan de escoger se regresaba solo a "Ejecutivo de ventas"—.

     Así que mientras siga ahí, esta pantalla no se vuelve a dibujar sola. Se
     dibuja al entrar, y cuando el propio panel lo pide después de guardar. */
  if (vista === "ajustes"){ if (!ajustesEnPantalla) renderAjustes(); }
  else if (ajustesEnPantalla){
    /* Se salió de Ajustes. Mientras estuvo ahí no se aplicó nada de lo que
       bajó —ver `hayFormularioAbierto`—, así que éste es el momento de
       ponerse al día, igual que al cerrarse la última ventana. */
    ajustesEnPantalla = false;
    if (nube.hayQueBajar) setTimeout(() => ponerseAlDia().catch(() => {}), 0);
  }

  // Al final, para que no salga encima de una pantalla a medio dibujar.
  pantallaDepto();
}

function renderKpis(){
  const cs = clientesVisibles();
  /* La etapa del departamento en el que se está. En banquetes puede no haber
     ninguna —nadie lo ha tratado—, y entonces el cliente cuenta en «Clientes»
     pero no en «En proceso», que es lo honesto. En ventas siempre hay etapa,
     así que los números son los mismos de siempre. */
  const etapa    = c => estatusSiHay(estatusDeCli(c));
  const abiertos = cs.filter(c => { const e = etapa(c); return e && !e.won && !e.lost; });
  const ganados  = cs.filter(c => (etapa(c) || {}).won);
  const ids = new Set(cs.map(c => c.id));
  // Los dos últimos recuadros son los del papel que se lleva cada quien: a
  // ventas le importan los convenios; a banquetes, sus eventos.
  const propios = veHospedaje()
    ? [["Convenios firmados",
        String(state.convenios.filter(v => ids.has(v.clienteId) && v.estado === "firmado_cliente").length),
        "por el cliente"],
       ["Esperando cliente",
        String(state.convenios.filter(v => ids.has(v.clienteId) && v.estado === "firmado_ejecutiva").length),
        "firma pendiente"]]
    : [["Eventos firmados",
        String(state.eventos.filter(e => eventoEsMio(e) && ["firmado","confirmado"].includes(e.estado)).length),
        "contratados"],
       ["En la mesa",
        String(eventosVisibles("cotizacion").filter(e => ["borrador","enviada"].includes(e.estado)).length),
        "cotizaciones sin cerrar"]];

  document.getElementById("kpis").innerHTML = [
    ["Clientes",   String(cs.length),       "en la cartera"],
    ["En proceso", String(abiertos.length), "sin cerrar"],
    ["Ganados",    String(ganados.length),  veHospedaje() ? "convenio cerrado" : "cerrados"],
    ...propios
  ].map(([t,v,s]) => `<div class="kpi"><small>${esc(t)}</small><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join("");
}

function renderTablero(){
  const cs = clientesVisibles();

  board.innerHTML = "";

  /* En banquetes hay una columna de más, al principio: los clientes que
     nadie de banquetes ha tomado. Sin ella no tendrían dónde salir —su etapa
     está vacía a propósito— y el tablero escondería media cartera. */
  for (const e of columnasEstatus()){
    const mios = cs.filter(c => estatusDeCli(c) === e.id).sort((a,b) => a.empresa.localeCompare(b.empresa, "es"));
    const col = document.createElement("section");
    col.className = "col";
    col.dataset.estatus = e.id;
    col.innerHTML = `
      <div class="col-head">
        <span class="dot" style="background:${e.color}"></span>
        <span class="col-name">${esc(e.name)}</span>
        <span class="count">${mios.length}</span>
      </div>
      <div class="cards"></div>
      <div class="col-foot"><button class="add-card" data-estatus="${e.id}">+ Agregar cliente</button></div>`;

    const cont = col.querySelector(".cards");
    if (!mios.length) cont.innerHTML = `<div class="empty-col">Sin clientes</div>`;
