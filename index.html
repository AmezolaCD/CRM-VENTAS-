/** Sello de "ya se mandó" para la tabla y para la carta abierta. */
function selloEnvio(g){
  if (!g.enviado)
    return `<span class="pill" title="Todavía no se manda desde aquí">Sin enviar</span>`;
  const e = g.enviado;
  return `<span class="pill good" title="Enviada por ${esc(VIAS[e.via])} el ${esc(fechaHora(e.fecha))}` +
    `${e.quien ? " por " + esc(e.quien) : ""}">✓ ${esc(VIAS[e.via])} · ${esc(fechaCorta(e.fecha))}</span>`;
}

let soloPendientes = false;
let seleccion = new Set();

/**
 * Marca varias cartas de una vez.
 *
 * Al estrenar el indicador, todo lo mandado antes aparece como pendiente y
 * corregirlo huésped por huésped es media tarde. Se pide la fecha porque el
 * envío fue otro día: poner la de hoy sería una constancia falsa.
 */
function marcarVarias(ids, via){
  const gs = ids.map(id => state.huespedes.find(x => x.id === id)).filter(Boolean);
  if (!gs.length) return;
  const dia = prompt(`¿Qué día se enviaron estas ${gs.length} cartas por ${VIAS[via]}?\n\n` +
                     "Formato AAAA-MM-DD. Déjalo como está si fue hoy.", hoyISO());
  if (dia === null) return;
  const d = String(dia).trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || isNaN(Date.parse(d + "T12:00:00"))){
    alert(`"${d}" no es una fecha válida. Se esperaba algo como ${hoyISO()}.`);
    return;
  }
  // Mediodía para que el cambio de huso no la corra al día anterior.
  const fecha = new Date(d + "T12:00:00").toISOString();
  for (const g of gs) g.enviado = { fecha, via, quien: correoSesion() };
  seleccion.clear();
  guardar(); render();
}

function desmarcarVarias(ids){
  const gs = ids.map(id => state.huespedes.find(x => x.id === id)).filter(Boolean);
  if (!gs.filter(g => g.enviado).length){ alert("Ninguna de las seleccionadas está marcada."); return; }
  if (!confirm(`¿Quitar la marca de enviada a ${gs.length} carta(s)?`)) return;
  for (const g of gs) g.enviado = null;
  seleccion.clear();
  guardar(); render();
}


function renderConfirmaciones(){
  const cont = document.getElementById("tblConfirm");
  const todos = [...state.huespedes].sort((a,b) =>
    String(a.llegada).localeCompare(String(b.llegada)) ||
    nombreCompleto(a).localeCompare(nombreCompleto(b), "es"));
  const enviadas = todos.filter(g => g.enviado).length;
  const gs = soloPendientes ? todos.filter(g => !g.enviado) : todos;
  const visibles = new Set(gs.map(g => g.id));
  for (const id of [...seleccion]) if (!visibles.has(id)) seleccion.delete(id);
  const sel = [...seleccion];

  const cab = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b style="font-size:15px">Cartas de confirmación</b>
      <span class="hint">${todos.length} huésped(es) · una carta por huésped${
        todos.length ? ` · <b>${enviadas} de ${todos.length} enviadas</b>` : ""}</span>
      ${todos.length && enviadas < todos.length
        ? `<button class="btn sm${soloPendientes ? " primary" : ""}" id="bPend">${
             soloPendientes ? "Ver todas" : `Sólo pendientes (${todos.length - enviadas})`}</button>` : ""}
      <span style="flex:1"></span>
      <button class="btn primary" id="bImpHuesp">Importar huéspedes</button>
      <button class="btn" id="bAddHuesp">+ Capturar uno</button>
      ${todos.length ? `<button class="btn" id="bImprimirTodas">Imprimir ${
          soloPendientes ? "las pendientes" : "todas"}</button>
        <button class="btn danger" id="bLimpiarHuesp">Vaciar lista</button>` : ""}
    </div>` + (sel.length ? `
    <div class="note" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b>${sel.length} seleccionada(s)</b>
      <span class="hint">Marcarlas como enviadas por:</span>
      <button class="btn sm" id="bMarcaCorreo">Correo</button>
      <button class="btn sm wa" id="bMarcaWa" title="WhatsApp" aria-label="WhatsApp">${ICONO_WA}</button>
      <span style="flex:1"></span>
      <button class="btn sm" id="bDesmarca">Quitar la marca</button>
      <button class="btn sm" id="bNada">Deseleccionar</button>
    </div>` : "");

  if (!todos.length){
    cont.innerHTML = cab + `<div class="vacio">Todavía no hay huéspedes cargados.<br>
      Importa un <b>.xlsx</b> o un CSV: se genera una carta por cada renglón,
      aunque dos huéspedes compartan habitación.</div>`;
  } else if (!gs.length){
    cont.innerHTML = cab + `<div class="vacio">No queda ninguna pendiente:
      las ${todos.length} cartas ya se enviaron.</div>`;
  } else {
    cont.innerHTML = cab + `<table class="data">
      <thead><tr><th style="width:30px"><input type="checkbox" id="selTodas"
          title="Seleccionar todas las de la lista"${sel.length === gs.length ? " checked" : ""}></th>
        <th>Huésped</th><th>Reservación</th><th>Llegada</th><th>Salida</th>
        <th class="num">Noches</th><th>Empresa</th><th>Envío</th><th></th></tr></thead>
      <tbody>${gs.map(g => `<tr class="row-link" data-g="${g.id}">
        <td><input type="checkbox" data-sel="${g.id}"${seleccion.has(g.id) ? " checked" : ""}
             aria-label="Seleccionar a ${esc(nombreCompleto(g))}"></td>
        <td><b>${esc(nombreCompleto(g))}</b></td>
        <td>${esc(g.reservacion || "—")}</td>
        <td class="nowrap">${esc(fechaCorta(g.llegada))}</td>
        <td class="nowrap">${esc(fechaCorta(g.salida))}</td>
        <td class="num">${esc(nochesDe(g) === "" ? "—" : nochesDe(g))}</td>
        <td>${esc(g.empresa || "—")}</td>
        <td class="nowrap">${selloEnvio(g)}</td>
        <td class="nowrap">
          <button class="btn sm" data-vercarta="${g.id}">Ver carta</button>
          <button class="btn sm" data-mail="${g.id}" ${g.email ? "" : "disabled"}>Correo</button>
          <button class="btn sm wa" data-wa2="${g.id}" ${g.telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>
        </td></tr>`).join("")}</tbody></table>`;
  }

  const bP = cont.querySelector("#bPend");
  if (bP) bP.onclick = () => { soloPendientes = !soloPendientes; seleccion.clear(); render(); };

  cont.querySelectorAll("[data-sel]").forEach(ch => ch.addEventListener("click", e => {
    e.stopPropagation();            // la casilla no abre la ficha del huésped
    if (ch.checked) seleccion.add(ch.dataset.sel); else seleccion.delete(ch.dataset.sel);
    render();
  }));
  const st = cont.querySelector("#selTodas");
  if (st) st.onclick = e => {
    e.stopPropagation();
    seleccion = st.checked ? new Set(gs.map(g => g.id)) : new Set();
    render();
  };
  const bmc = cont.querySelector("#bMarcaCorreo");
  if (bmc){
    bmc.onclick = () => marcarVarias(sel, "correo");
    cont.querySelector("#bMarcaWa").onclick = () => marcarVarias(sel, "whatsapp");
    cont.querySelector("#bDesmarca").onclick = () => desmarcarVarias(sel);
    cont.querySelector("#bNada").onclick = () => { seleccion.clear(); render(); };
  }

  cont.querySelector("#bImpHuesp").onclick = importarHuespedes;
  cont.querySelector("#bAddHuesp").onclick = () => editarHuesped(null);
  const bT = cont.querySelector("#bImprimirTodas");
  if (bT) bT.onclick = () => verConfirmacion(null, gs.map(g => g.id));
  const bL = cont.querySelector("#bLimpiarHuesp");
  if (bL) bL.onclick = () => {
    if (!confirm(`¿Vaciar la lista de ${todos.length} huésped(es)? Las cartas ya impresas no se tocan.`)) return;
    state.huespedes = []; soloPendientes = false; seleccion.clear(); guardar(); render();
  };
  cont.querySelectorAll("tr[data-g]").forEach(tr => tr.addEventListener("click", e => {
    const v = e.target.closest("[data-vercarta]"), m = e.target.closest("[data-mail]"), w = e.target.closest("[data-wa2]");
    if (v){ e.stopPropagation(); verConfirmacion(v.dataset.vercarta); return; }
    if (m){ e.stopPropagation(); enviarConfirmacion(m.dataset.mail, "correo"); return; }
    if (w){ e.stopPropagation(); enviarConfirmacion(w.dataset.wa2, "whatsapp"); return; }
    editarHuesped(tr.dataset.g);
  }));
}

/** Arma el cuerpo de una carta. Se reutiliza para ver una o imprimir todas. */
function cartaConfirmacion(g){
  const h = state.ajustes.hotel, t = state.ajustes.textos;
  const n = nochesDe(g);
  const V = txt => String(txt || "")
    .replace(/\{\{HOTEL\}\}/g, h.nombre)
    .replace(/\{\{CIUDAD\}\}/g, h.ciudad)
    .replace(/\{\{HUESPED\}\}/g, nombreCompleto(g) || "____________________")
    .replace(/\{\{RESERVACION\}\}/g, g.reservacion || "")
    .replace(/\{\{LLEGADA\}\}/g, fechaTexto(g.llegada))
    .replace(/\{\{SALIDA\}\}/g, fechaTexto(g.salida))
    .replace(/\{\{NOCHES\}\}/g, n === "" ? "" : String(n));

  const campo = (etq, val) => `<div><i>${esc(etq)}</i> <b>${esc(val || "____________________")}</b></div>`;

  return `
    <div class="doc-hotel">
      ${h.logo ? `<img class="doc-logo" src="${esc(h.logo)}" alt="${esc(h.nombre)}">`
        : esQuartz(h.nombre) ? `<div class="doc-wordmark">${logoQuartz(MORADO_QUARTZ)}</div>`
        : `<div class="doc-mono">${monogramaQ(MORADO_QUARTZ)}</div><b>${esc(h.nombre)}</b>`}
      <div>${esc(h.direccion)}</div>
      <div>Tel. ${esc(h.telefono)}</div>
    </div>
    <div class="doc-regla"></div>
    <div class="doc-fecha">${esc(h.ciudad)} a ${esc(fechaTexto(hoyISO()))}</div>

    <h1 style="font-size:16px;text-align:center;margin:14px 0 16px;color:#39104e;
      letter-spacing:.02em">${esc(V(t.confTitulo))}</h1>

    <p><b>${esc(V(t.confSaludo))}</b></p>
    <p style="white-space:pre-wrap">${esc(V(t.confCuerpo))}</p>

    <h2>Detalles de la reservación</h2>
    <div class="doc-campos">
      ${campo("Número de reservación:", g.reservacion)}
      ${campo("Fecha de llegada:", fechaTexto(g.llegada))}
      ${campo("Fecha de salida:", fechaTexto(g.salida))}
      ${campo("Número de noches:", n === "" ? "" : String(n))}
      ${g.empresa ? campo("Empresa:", g.empresa) : ""}
    </div>

    <p style="white-space:pre-wrap">${esc(V(t.confConfirma))}</p>
    <p style="white-space:pre-wrap">${esc(V(t.confContacto))}</p>

    <div class="doc-campos">
      <div><b style="border:0;padding:0">${esc(h.nombre)}</b></div>
      <div>${esc(h.direccion)}</div>
      ${h.telReservaciones ? `<div><i>Teléfono:</i> ${esc(h.telReservaciones)}</div>` : ""}
      ${h.emailReservaciones ? `<div><i>Correo electrónico:</i> ${esc(h.emailReservaciones)}</div>` : ""}
    </div>

    <p style="white-space:pre-wrap">${esc(V(t.confCierre))}</p>
    <p style="margin-top:18px">Atentamente,</p>
    <p><b>${esc(h.nombre)}</b></p>
    ${g.notas ? `<p class="hint" style="margin-top:14px">${esc(g.notas)}</p>` : ""}`;
}

/** Una carta, o varias en lote si se pasa una lista de ids. */
function verConfirmacion(id, lote){
  const ids = lote && lote.length ? lote : [id];
  const gs = ids.map(x => state.huespedes.find(g => g.id === x)).filter(Boolean);
  if (!gs.length) return;
  const varias = gs.length > 1;
  const h = state.ajustes.hotel;
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>${varias ? `${gs.length} cartas de confirmación` : "Carta de confirmación"}</h2>
        <button class="btn" data-close>✕</button>
      </div>
      <div class="doc-body">
        ${gs.map(g => `<div class="hoja" style="position:relative">
            ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
            <div class="doc-contenido">${cartaConfirmacion(g)}</div>
          </div>`).join("")}
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrintC">${varias ? "Imprimir las " + gs.length : "Imprimir"}</button>
        <button class="btn" id="bPdfC">${varias ? `Descargar las ${gs.length} en un PDF` : "Descargar PDF"}</button>
        ${!varias ? selloEnvio(gs[0]) : ""}
        <div class="spacer"></div>
        ${!varias ? `<button class="btn" id="bMailC" ${gs[0].email ? "" : "disabled"}>Enviar por correo</button>
          <button class="btn wa" id="bWaC" ${gs[0].telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrintC").onclick = () => {
    fijarPagina(true);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);
  };
  ov.querySelector("#bPdfC").onclick = async e => {
    const b = e.currentTarget, txt = b.textContent;
    b.disabled = true; b.textContent = "Generando…";
    try{
      descargarBlob(new Blob([await pdfDeHuespedes(gs)], { type:"application/pdf" }), nombrePdf(gs));
    }catch(err){
      alert("No se pudo generar el PDF: " + err.message +
            "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }
    b.disabled = false; b.textContent = txt;
  };

  const bm = ov.querySelector("#bMailC");
  if (bm) bm.onclick = () => enviarConfirmacion(gs[0].id, "correo");
  const bw = ov.querySelector("#bWaC");
  if (bw) bw.onclick = () => enviarConfirmacion(gs[0].id, "whatsapp");
}

/** Arma el PDF de una o varias confirmaciones sin abrir ninguna ventana. */
async function pdfDeHuespedes(gs){
  const h = state.ajustes.hotel;
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);
  const caja = document.createElement("div");
  caja.innerHTML = gs.map(g => `<div class="hoja" style="position:relative">
      ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
      <div class="doc-contenido">${cartaConfirmacion(g)}</div></div>`).join("");
  const imgs = [];
  for (const hoja of caja.querySelectorAll(".hoja")) imgs.push(await rasterizarHoja(hoja));
  return pdfDesdeImagenes(imgs);
}

/* --------------------------------------------------------------------------
   El convenio no cabe en una hoja: hay que paginarlo

   La confirmación es una carta de una página, así que basta con rasterizarla
   tal cual. El convenio son tres o cuatro, y el navegador sólo sabe partirlo
   al imprimir —no al dibujar—, así que aquí se hace a mano: se mide dónde
   termina cada bloque, se decide en cuál cortar sin partirlo a la mitad, se
   dibuja el documento entero de una vez y esa tira se reparte en hojas.
   -------------------------------------------------------------------------- */

const MM = 96 / 25.4;                        // milímetros a píxeles de pantalla
const MARGEN_X = Math.round(18 * MM);
const MARGEN_Y = Math.round(16 * MM);
const ALTO_UTIL = PX_ALTO - MARGEN_Y * 2;

/** Rasteriza el documento completo, de ancho fijo y alto libre. */
function rasterizarTira(html, alto){
  return new Promise((resolve, reject) => {
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    // Se arma como DOM y se serializa: dentro del SVG el contenido tiene que
    // ser XML bien formado, y el HTML escrito a mano —<br>, <img> sin cerrar—
    // no lo es. El serializador se encarga.
    // El papel va aparte de la envoltura: la tipografía base se hereda, pero si
    // se pusiera en el mismo elemento pisaría al tamaño propio de .doc-body y
    // el texto se acomodaría distinto de como se midió.
    const papel = document.createElement("div");
    papel.className = "doc-body";
    papel.style.cssText = `width:100%;margin:0;padding:0 ${MARGEN_X}px;` +
      `box-sizing:border-box;background:#fff`;
    papel.innerHTML = html;

    const envoltura = document.createElement("div");
    envoltura.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    envoltura.style.cssText = `width:${PX_ANCHO}px;height:${alto}px;background:#fff;` +
      `font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    const est = document.createElement("style");
    est.textContent = css;
    envoltura.appendChild(est);
    envoltura.appendChild(papel);

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PX_ANCHO}" height="${alto}">` +
      `<foreignObject width="100%" height="100%">` +
      new XMLSerializer().serializeToString(envoltura) + `</foreignObject></svg>`;

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = PX_ANCHO * ESCALA_PDF;
      cv.height = alto * ESCALA_PDF;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv);
    };
    img.onerror = () => reject(new Error("Este navegador no pudo convertir el convenio a imagen."));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

/**
 * Dónde cortar. Se recorre bloque por bloque: si el siguiente ya no cabe en la
 * hoja, la hoja termina antes de él. Un bloque más alto que la hoja entera
 * —no debería haberlo— se deja pasar para no quedarse en un ciclo sin fin.
 */
function cortesDe(caja){
  const bloques = [...caja.children].filter(el => el.className !== "doc-agua");
  const cortes = [0];
  let inicio = 0;
  for (let i = 0; i < bloques.length; i++){
    const el = bloques[i];
    const arriba = el.offsetTop, abajo = arriba + el.offsetHeight;
    if (abajo - inicio <= ALTO_UTIL || arriba <= inicio) continue;
    // Un título no se queda solo al pie de una hoja con su texto en la siguiente.
    let corte = arriba;
    const previo = bloques[i-1];
    if (previo && /^H[23]$/.test(previo.tagName) && previo.offsetTop > inicio)
      corte = previo.offsetTop;
    cortes.push(corte);
    inicio = corte;
  }
  return cortes;
}

/** PDF de la carta-convenio, ya paginada. */
async function pdfDeConvenio(v, c){
  const h = state.ajustes.hotel;
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  // Se mide con el documento colocado de verdad —fuera de la vista, pero con
  // el ancho real— porque de otro modo no hay alturas que consultar.
  // Se mide con la misma envoltura que después se dibuja —misma tipografía
  // base, mismo ancho, mismo .doc-body— o los renglones se acomodan distinto y
  // los cortes caen donde no deben.
  const medidor = document.createElement("div");
  medidor.style.cssText = `position:fixed;left:-10000px;top:0;width:${PX_ANCHO}px;` +
    `background:#fff;visibility:hidden;` +
    `font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
  medidor.innerHTML = `<div class="doc-body" style="width:100%;margin:0;` +
    `padding:0 ${MARGEN_X}px;box-sizing:border-box">` +
    `<div class="doc-contenido">${cuerpoConvenio(v, c)}</div></div>`;
  document.body.appendChild(medidor);

  let cortes, alto, html;
  try{
    const cont = medidor.firstElementChild.firstElementChild;
    alto = Math.max(cont.scrollHeight, ALTO_UTIL);
    cortes = cortesDe(cont);
    html = `<div class="doc-contenido" style="position:relative">` +
           (agua ? `<div class="doc-agua">${agua}</div>` : "") +
           cuerpoConvenio(v, c) + `</div>`;
  } finally { medidor.remove(); }

  const tira = await rasterizarTira(html, alto);

  const hojas = [];
  for (let i = 0; i < cortes.length; i++){
    const desde = cortes[i] * ESCALA_PDF;
    const hasta = Math.min((i + 1 < cortes.length ? cortes[i+1] : alto) * ESCALA_PDF, tira.height);
    const cv = document.createElement("canvas");
    cv.width = PX_ANCHO * ESCALA_PDF;
    cv.height = PX_ALTO * ESCALA_PDF;
    const g = cv.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
    const recorte = Math.min(hasta - desde, ALTO_UTIL * ESCALA_PDF);
    if (recorte > 0)
      g.drawImage(tira, 0, desde, cv.width, recorte, 0, MARGEN_Y * ESCALA_PDF, cv.width, recorte);
    hojas.push(cv.toDataURL("image/jpeg", 0.92));
  }
  return pdfDesdeImagenes(hojas);
}

const nombrePdfConvenio = (v, c) =>
  "Convenio-" + nombreArchivo([v.folio, c && c.empresa].filter(Boolean).join(" ")) + ".pdf";

function nombrePdf(gs){
  if (gs.length === 1){
    const g = gs[0];
    return "Confirmacion-" + nombreArchivo([g.reservacion, nombreCompleto(g)].filter(Boolean).join(" ")) + ".pdf";
  }
  return `Confirmaciones-${gs.length}-${hoyISO()}.pdf`;
}

function mensajeConfirmacion(g){
  const h = state.ajustes.hotel;
  const n = nochesDe(g);
  return `Estimado(a) ${nombreCompleto(g)}:\n\n` +
    `Adjuntamos su carta de confirmación de hospedaje en ${h.nombre}.\n\n` +
    (g.reservacion ? `Reservación: ${g.reservacion}\n` : "") +
    (g.llegada ? `Llegada: ${fechaTexto(g.llegada)}\n` : "") +
    (g.salida ? `Salida: ${fechaTexto(g.salida)}\n` : "") +
    (n !== "" ? `Noches: ${n}\n` : "") +
    `\nCualquier duda, con gusto le atendemos.\n\n${h.nombre}\n` +
    (h.telReservaciones ? h.telReservaciones + "\n" : "") + (h.emailReservaciones || "");
}

/**
 * Ni mailto: ni wa.me admiten adjuntos, así que hay dos caminos: si el equipo
 * soporta compartir archivos, el PDF y el mensaje salen juntos por la hoja del
 * sistema; si no, se descarga el PDF y se abre la app con el mensaje listo.
 */
function enviarConfirmacion(id, via){
  const g = state.huespedes.find(x => x.id === id);
  if (!g) return;
  const h = state.ajustes.hotel;
  const n = nochesDe(g);
  if (via === "correo" && !g.email){ alert("Este huésped no tiene correo registrado."); return; }
  if (via === "whatsapp" && !g.telefono){ alert("Este huésped no tiene teléfono registrado."); return; }

  const asunto = `Confirmación de hospedaje · ${h.nombre}${g.reservacion ? " · Reservación " + g.reservacion : ""}`;
  const cuerpo = mensajeConfirmacion(g);
  const destino = via === "correo" ? "correo" : "WhatsApp";
  const archivo = nombrePdf([g]);

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Enviar por ${esc(destino)}</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="cuerpoEnvio">
        <p class="hint">Preparando el PDF de la carta…</p>
      </div>
      <div class="modal-foot"><div class="spacer"></div><button class="btn" data-close>Cerrar</button></div>
    </div>`);

  pdfDeHuespedes([g]).then(bytes => {
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" && navigator.canShare({ files:[file] });

    ov.querySelector("#cuerpoEnvio").innerHTML = puedeCompartir
      ? `<div class="note"><b>La carta ya está lista.</b> Al compartir, el PDF y el mensaje
           van juntos: elige ${esc(destino)} en la lista que abra el sistema.</div>
         <p><button class="btn ok" id="bCompartir" style="font-size:15px;padding:10px 16px">
            Compartir carta y mensaje</button></p>
         <p class="hint">¿Prefieres hacerlo a mano?</p>
         <p style="display:flex;gap:8px;flex-wrap:wrap">
           <button class="btn" id="bBajar">Descargar el PDF</button>
           <button class="btn" id="bAbrir">Abrir ${esc(destino)} con el mensaje</button></p>`
      : `<div class="note warn"><b>Este equipo no puede adjuntar archivos desde el navegador.</b>
           Ni el correo ni WhatsApp aceptan adjuntos por enlace, así que se hace en dos pasos:
           se descarga el PDF y lo adjuntas al abrir ${esc(destino)}.
           <br><br>En un celular sí sale todo junto de una vez.</div>
         <p><button class="btn ok" id="bBajarAbrir" style="font-size:15px;padding:10px 16px">
            Descargar el PDF y abrir ${esc(destino)}</button></p>
         <p class="hint">Se guardará como <b>${esc(archivo)}</b></p>`;

    const bajar = () => descargarBlob(blob, archivo);
    const abrir = () => {
      if (via === "correo")
        window.location.href = `mailto:${encodeURIComponent(g.email)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
      else window.open(waLink(g.telefono, cuerpo), "_blank", "noopener");
      marcarEnviada(g.id, via);
    };

    const bc = ov.querySelector("#bCompartir");
    if (bc) bc.onclick = async () => {
      try{
        await navigator.share({ files:[file], text: cuerpo, title: asunto });
        marcarEnviada(g.id, via);
        ov.remove();
      }
      catch(err){ if (err && err.name !== "AbortError") alert("No se pudo compartir: " + err.message); }
    };
    const bb = ov.querySelector("#bBajar"); if (bb) bb.onclick = bajar;   // bajar no es enviar
    const ba = ov.querySelector("#bAbrir"); if (ba) ba.onclick = abrir;
    const bba = ov.querySelector("#bBajarAbrir");
    if (bba) bba.onclick = () => { bajar(); setTimeout(abrir, 600); ov.remove(); };
  }).catch(err => {
    ov.querySelector("#cuerpoEnvio").innerHTML =
      `<div class="note warn"><b>No se pudo generar el PDF aquí.</b> ${esc(err.message)}
        <br><br>Usa <i>Ver carta → Imprimir / Guardar PDF</i> y adjúntalo a mano.</div>
       <p><button class="btn" id="bAbrir2">Abrir ${esc(destino)} con el mensaje</button></p>`;
    ov.querySelector("#bAbrir2").onclick = () => {
      if (via === "correo")
        window.location.href = `mailto:${encodeURIComponent(g.email)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
      else window.open(waLink(g.telefono, cuerpo), "_blank", "noopener");
      marcarEnviada(g.id, via);
    };
  });
}

function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function editarHuesped(id){
  const existente = id ? state.huespedes.find(g => g.id === id) : null;
  const g = existente || saneaHuesped({});
  const campos = CAMPOS_HUESPED.map(f => {
    const ancho = (f.key === "notas") ? " full" : "";
    const val = g[f.key] ?? "";
    const ctl = f.key === "notas"
      ? `<textarea class="field" name="notas">${esc(val)}</textarea>`
      : `<input class="field" type="${f.tipo === "fecha" ? "date" : "text"}" name="${f.key}" value="${esc(val)}">`;
    return `<div class="${ancho.trim()}"><label class="lbl">${esc(f.label)}</label>${ctl}</div>`;
  }).join("");

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${existente ? "Editar huésped" : "Nuevo huésped"}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body"><form id="fG"><div class="grid">${campos}</div>
        <p class="hint">Si dejas <b>Noches</b> en blanco se calcula con las fechas.</p></form>
        ${existente ? `<div class="note" style="margin:14px 0 0;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
          <span>Carta de confirmación:</span> ${selloEnvio(g)}
          <span style="flex:1"></span>
          <button class="btn sm" id="bMarcaEnv" type="button">${
            g.enviado ? "Marcar como no enviada" : "Marcar como enviada"}</button>
        </div>
        <p class="hint" style="margin:6px 0 0">La marca se pone sola al mandarla desde aquí.
          Se puede corregir a mano: la aplicación abre tu correo o WhatsApp, pero no alcanza a
          ver si de verdad le diste enviar.</p>` : ""}</div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDelG">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkG">Guardar</button>
      </div>
    </div>`);

  const bME = ov.querySelector("#bMarcaEnv");
  if (bME) bME.onclick = () => {
    if (g.enviado){
      if (!confirm(`¿Quitar la marca de enviada de "${nombreCompleto(g)}"?`)) return;
      g.enviado = null; guardar(); render(); ov.remove(); editarHuesped(g.id);
      return;
    }
    const via = confirm(`¿Por dónde se envió la carta de "${nombreCompleto(g)}"?\n\n` +
      "Aceptar = correo\nCancelar = WhatsApp") ? "correo" : "whatsapp";
    marcarEnviada(g.id, via);
    ov.remove(); editarHuesped(g.id);
  };

  const form = ov.querySelector("#fG");
  form.querySelector('[name="nombre"]').focus();
  form.addEventListener("submit", e => { e.preventDefault(); ok(); });
  ov.querySelector("#bOkG").onclick = ok;
  const bd = ov.querySelector("#bDelG");
  if (bd) bd.onclick = () => {
    if (!confirm(`¿Eliminar a "${nombreCompleto(g)}" de la lista?`)) return;
    state.huespedes = state.huespedes.filter(x => x.id !== g.id);
    guardar(); render(); ov.remove();
  };

  function ok(){
    const fd = new FormData(form);
    const o = Object.assign({}, g);
    for (const f of CAMPOS_HUESPED) o[f.key] = (fd.get(f.key) ?? "").toString().trim();
    if (!o.nombre){ alert("El nombre del huésped es obligatorio."); return; }
    if (o.llegada && o.salida && o.salida < o.llegada){ alert("La salida no puede ser anterior a la llegada."); return; }
    if (existente) Object.assign(g, saneaHuesped(o));
    else { o.id = nuevoId("g"); o.createdAt = new Date().toISOString(); state.huespedes.push(saneaHuesped(o)); }
    guardar(); render(); ov.remove();
  }
}

    try{ money(0); }

    r.readAsDataURL(f);
  });
  const bQ = p.querySelector("#bQuitarLogo");
  if (bQ) bQ.onclick = () => {
    if (!confirm("¿Quitar el logotipo? La carta volverá a usar el monograma Q.")) return;
    recogerAjustes(); h.logo = ""; guardar(); renderAjustes();
  };

  p.querySelector("#bAddHab").onclick = () => {
    recogerAjustes();
    state.habitaciones.push(saneaHab({ nombre:"Nuevo tipo", grupo:"deluxe", publica:null }));
    guardar(); renderAjustes();
  };
  p.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const id = b.dataset.del;
    const usos = state.convenios.filter(v => v.habitaciones.some(x => x.tipoId === id)).length;
    if (usos && !confirm(`Este tipo aparece en ${usos} convenio(s). Los convenios ya guardados conservan su copia. ¿Eliminarlo del catálogo?`)) return;
    recogerAjustes();
    state.habitaciones = state.habitaciones.filter(x => x.id !== id);
    guardar(); renderAjustes();
  });
  p.querySelector("#bResetTextos").onclick = () => {
    if (!confirm("Se restaurarán todos los textos de la carta a los originales. ¿Continuar?")) return;
    a.textos = Object.assign({}, TEXTOS_DEF);
    a.grupos = saneaGrupos(null);
    guardar(); renderAjustes();
  };
  (function nubeAjustes(){
    const est = p.querySelector("#nbEstado");
    const linea = !nube.url || !nube.anon
      ? ["Este equipo trabaja solo: los datos no salen de este navegador.", "var(--muted)"]
      : !nube.sesion
        ? ["Servidor configurado, pero nadie ha entrado en este equipo.", "var(--bad)"]
        : [`Conectado como ${correoSesion()}.` + (nube.estado === "error" ? ` Último error: ${nube.error || ""}` : ""),
           nube.estado === "error" ? "var(--bad)" : "var(--ok)"];
    // Qué tiene este equipo y qué falta por mandar. Sin esto, "no aparece en
    // los demás" obliga a ir a Supabase a contar filas para saber de qué lado
    // está el problema.
    let detalle = "";
    if (nube.sesion){
      const filas = filasDeEstado();
      const cuenta = t => filas.filter(f => f.tipo === t).length;
      const faltan = filas.filter(f => sincronizado.get(f.id) !== JSON.stringify(f.datos)).length;
      detalle = `<div style="margin-top:6px">En este equipo:
        <b>${cuenta("clientes")}</b> cliente(s),
        <b>${cuenta("actividades")}</b> actividad(es),
        <b>${cuenta("convenios")}</b> convenio(s),
        <b>${cuenta("huespedes")}</b> huésped(es).` +
        (faltan ? ` <b style="color:var(--bad)">Faltan ${faltan} por subir.</b>`
                : ` <b>Todo subido</b>${nube.sincronizadoEn
                     ? " · última vez " + esc(fechaHora(nube.sincronizadoEn)) : ""}.`) +
        `</div>`;
    }
    est.innerHTML = `<div class="note" style="border-left:3px solid ${linea[1]}">${esc(linea[0])}${detalle}</div>`;
    p.querySelector("#bNbEntrar").style.display = (nube.url && nube.anon) ? "" : "none";
    p.querySelector("#bNbSalir").style.display  = nube.sesion ? "" : "none";
    p.querySelector("#bNbTodo").style.display   = nube.sesion ? "" : "none";
    p.querySelector("#bNbLiga").style.display   = (nube.url && nube.anon) ? "" : "none";
    p.querySelector("#bNbQuitar").style.display = (nube.url || nube.anon) ? "" : "none";

    p.querySelector("#bNbGuardar").onclick = () => {
      const url  = normalizaUrlNube(p.querySelector("#nbUrl").value);
      const anon = p.querySelector("#nbAnon").value.trim();
      if (!url || !anon){ alert("Hacen falta la dirección del proyecto y la llave pública."); return; }
      if (!/^https:\/\//.test(url)){ alert("La dirección debe empezar con https://"); return; }
      recogerAjustes(); guardar();
      const cambio = url !== nube.url || anon !== nube.anon;
      nube.url = url; nube.anon = anon;
      guardarNubeCfg();
      if (cambio){ nube.sesion = null; guardarSesion(); nube.ultimo = ""; detenerSondeo(); }
      renderAjustes();
      arrancarNube();
    };
    p.querySelector("#bNbProbar").onclick = async e => {
      const url  = normalizaUrlNube(p.querySelector("#nbUrl").value);
      const anon = p.querySelector("#nbAnon").value.trim();
      if (!url || !anon){ alert("Escribe primero la dirección y la llave."); return; }
      const b = e.currentTarget, antes = b.textContent;
      b.disabled = true; b.textContent = "Revisando…";
      est.innerHTML = `<div class="note">Revisando la conexión…</div>`;
      try{
        const pasos = await probarNube(url, anon);
        const fallan = pasos.filter(x => !x.ok);
        est.innerHTML = `<div class="note" style="border-left:3px solid ${
            fallan.length ? "var(--bad)" : "var(--ok)"}">
          <b>${fallan.length ? "Encontré " + fallan.length + " problema(s):"
                             : "Todo en orden. Ya puedes entrar."}</b>
          <ul style="margin:8px 0 0;padding-left:18px">${pasos.map(x =>
            `<li style="margin-top:5px"><b>${x.ok ? "✓" : "✗"} ${x.titulo}</b>${
              x.detalle ? "<br>" + x.detalle : ""}</li>`).join("")}</ul></div>`;
      }catch(ex){
        est.innerHTML = `<div class="errbox">No se pudo completar la revisión: ${esc(ex.message)}</div>`;
      }finally{ b.disabled = false; b.textContent = antes; }
    };

    p.querySelector("#bNbLiga").onclick = copiarInvitacion;

    p.querySelector("#bNbTodo").onclick = async e => {
      if (!nubeActiva()){ alert("Primero hay que entrar a la nube."); return; }
      const filas = filasDeEstado();
      const cuenta = t => filas.filter(f => f.tipo === t).length;
      if (!confirm(`Se volverán a mandar a la nube los ${filas.length} registros de este equipo:\n\n` +
                   `· ${cuenta("clientes")} cliente(s)\n· ${cuenta("actividades")} actividad(es)\n` +
                   `· ${cuenta("convenios")} convenio(s)\n· ${cuenta("huespedes")} huésped(es)\n\n` +
                   "Sirve cuando algo capturado aquí no aparece en los demás equipos.\n" +
                   "No borra nada de la nube: lo que otros hayan subido se queda.\n\n¿Continuar?")) return;
      const b = e.currentTarget, antes = b.textContent;
      b.disabled = true; b.textContent = "Subiendo…";
      try{
        // Con el registro de lo ya sincronizado en blanco, todo lo de este
        // equipo se ve como cambio y vuelve a salir. Los borrados se calculan
        // contra ese mismo registro, así que vaciarlo no da de baja nada.
        sincronizado = new Map();
        await sincronizar();
        if (nube.estado === "error") throw new Error(nube.error || "sin detalle");
        alert(`Listo: se mandaron ${filas.length} registros.\n\n` +
              "En los demás equipos aparecen en menos de un minuto, o al recargar.");
      }catch(ex){
        alert("No se pudo subir: " + ex.message);
      }finally{ b.disabled = false; b.textContent = antes; renderAjustes(); }
    };

    p.querySelector("#bNbEntrar").onclick = () => { detenerSondeo(); pantallaEntrada(); };
    p.querySelector("#bNbSalir").onclick = () => {
      if (!confirm("Se cerrará la sesión en este equipo. Los datos ya sincronizados se quedan en la nube.")) return;
      salir();
    };
    p.querySelector("#bNbQuitar").onclick = () => {
      if (!confirm("Este equipo dejará de sincronizar y volverá a guardar sólo aquí.\n\n" +
                   "Los datos que ya están en la nube no se borran. ¿Continuar?")) return;
      detenerSondeo();
      nube.url = ""; nube.anon = ""; nube.sesion = null; nube.ultimo = ""; nube.estado = "local";
      sincronizado = new Map();
      guardarNubeCfg(); guardarSesion();
      pintarNube(); renderAjustes();
    };
  })();

  p.querySelector("#bGuardarAj").onclick = () => {
    recogerAjustes();
    guardar(); renderAjustes();
    const ok = document.getElementById("ajOk");
    if (ok){ ok.textContent = "Guardado ✓"; setTimeout(() => { if (ok) ok.textContent = ""; }, 2500); }
  };
}

/**
 * El navegador imprime su propio encabezado y pie —URL, fecha, número de
 * página— siempre que la hoja tenga margen. Con margen cero no le queda sitio
 * y los omite, así que los márgenes reales los pone el contenido.
 *
 * Sólo se puede hacer cuando cada página es un bloque propio (.hoja), como en
 * las confirmaciones. En un documento que fluye varias páginas, como el
 * convenio, la segunda hoja arrancaría pegada al borde del papel: ahí se
 * conserva el margen de página y el pie del navegador se apaga desde el
 * diálogo de impresión.
 */
function fijarPagina(sinMargenDeHoja){
  let el = document.getElementById("reglaPagina");
  if (!el){ el = document.createElement("style"); el.id = "reglaPagina"; document.head.appendChild(el); }
  el.textContent = sinMargenDeHoja
    ? "@page{ size: letter; margin: 0; }"
    : "@page{ size: letter; margin: 16mm 18mm; }";
}

function modal(html){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = html;
  ov.addEventListener("click", e => {
    if (e.target === ov || e.target.closest("[data-close]")) ov.remove();
  });
  document.body.appendChild(ov);
  return ov;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    const ovs = document.querySelectorAll(".overlay");
    if (ovs.length) ovs[ovs.length-1].remove();
  }
});

        <div class="pane" id="p-acts"></div>
        <div class="pane" id="p-convs"></div>

      <div class="modal-foot" id="footCli">
        ${existente ? `<button class="btn danger" id="bDel">Eliminar cliente</button>` : ""}

/* ----- Bitácora de los ejecutivos ----- */

/**
 * Las actividades siempre estuvieron ahí, pero encerradas en la ficha de cada
 * cliente: para saber qué hizo alguien en la semana había que abrir cliente
 * por cliente. Esta vista las junta todas y las mira desde el otro lado, por
 * quien las hizo.
 */
let filtroAct = { periodo:"30", ejecutivo:"", tipo:"", desde:"", hasta:"" };

const PERIODOS = [
  { id:"hoy",  name:"Hoy" },
  { id:"7",    name:"Últimos 7 días" },
  { id:"30",   name:"Últimos 30 días" },
  { id:"mes",  name:"Este mes" },
  { id:"todo", name:"Todo" },
  { id:"rango",name:"Entre dos fechas" }
];

/** Los dos extremos del periodo elegido, como AAAA-MM-DD. */
function rangoActivo(){
  const hoy = hoyISO();
  const menos = n => {
    const d = new Date(hoy + "T12:00:00");
    d.setDate(d.getDate() - n);
    return d.toISOString().slice(0,10);
  };
  switch (filtroAct.periodo){
    case "hoy":  return [hoy, hoy];
    case "7":    return [menos(6), hoy];
    case "30":   return [menos(29), hoy];
    case "mes":  return [hoy.slice(0,7) + "-01", hoy];
    case "rango":return [filtroAct.desde || "0000-01-01", filtroAct.hasta || "9999-12-31"];
    default:     return ["0000-01-01", "9999-12-31"];
  }
}

function actividadesVisibles(){
  const [desde, hasta] = rangoActivo();
  const q = filtros.q.trim().toLowerCase();
  return state.actividades.filter(a => {
    const dia = String(a.fecha || "").slice(0,10);
    if (dia < desde || dia > hasta) return false;
    if (filtroAct.ejecutivo && (a.responsable || "") !== filtroAct.ejecutivo) return false;
    if (filtroAct.tipo && a.tipo !== filtroAct.tipo) return false;
    if (!q) return true;
    return [a.asunto, a.notas, a.responsable, nombreCli(a.clienteId), tipoAct(a.tipo).name]
      .join(" ").toLowerCase().includes(q);
  }).sort((x,y) => String(y.fecha).localeCompare(String(x.fecha)));
}

/** Todo el que aparezca como responsable, más los ejecutivos de la cartera. */
const ejecutivosConocidos = () => [...new Set([
  ...state.actividades.map(a => a.responsable),
  ...state.clientes.map(c => c.ejecutivo)
].map(x => String(x || "").trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b,"es"));

function renderActividades(){
  const cont = document.getElementById("tblAct");
  const as = actividadesVisibles();
  const [desde, hasta] = rangoActivo();

  const opciones = (lista, val, todos) =>
    `<option value="">${esc(todos)}</option>` + lista.map(([v,n]) =>
      `<option value="${esc(v)}"${v===val?" selected":""}>${esc(n)}</option>`).join("");

  const filtrosHtml = `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b style="font-size:15px">Actividad de los ejecutivos</b>
      <select class="field" id="fPeriodo" title="Periodo">${PERIODOS.map(x =>
        `<option value="${x.id}"${x.id===filtroAct.periodo?" selected":""}>${esc(x.name)}</option>`).join("")}</select>
      ${filtroAct.periodo === "rango" ? `
        <input class="field" type="date" id="fDesde" value="${esc(filtroAct.desde)}" title="Desde">
        <span class="hint">a</span>
        <input class="field" type="date" id="fHasta" value="${esc(filtroAct.hasta)}" title="Hasta">` : ""}
      <select class="field" id="fEjeAct" title="Ejecutivo">${
        opciones(ejecutivosConocidos().map(x => [x,x]), filtroAct.ejecutivo, "Todos los ejecutivos")}</select>
      <select class="field" id="fTipoAct" title="Tipo">${
        opciones(TIPOS_ACT.map(t => [t.id, t.icon + " " + t.name]), filtroAct.tipo, "Todos los tipos")}</select>
      <span style="flex:1"></span>
      <button class="btn primary" id="bNuevaAct">+ Registrar actividad</button>
      <button class="btn" id="bExpAct">Exportar CSV</button>
    </div>`;

  // El resumen es lo que se mira primero: cuánto hizo cada quien y de qué tipo.
  const porEje = new Map();
  for (const a of as){
    const k = (a.responsable || "").trim() || "(sin responsable)";
    if (!porEje.has(k)) porEje.set(k, { total:0, tipos:{}, ultima:"" });
    const r = porEje.get(k);
    r.total++;
    r.tipos[a.tipo] = (r.tipos[a.tipo] || 0) + 1;
    if (String(a.fecha) > r.ultima) r.ultima = String(a.fecha);
  }
  const filas = [...porEje.entries()].sort((x,y) => y[1].total - x[1].total);

  const resumen = !as.length ? "" : `
    <table class="data" style="margin-bottom:16px">
      <thead><tr><th>Ejecutivo</th>${TIPOS_ACT.map(t =>
        `<th class="num">${t.icon} ${esc(t.name)}</th>`).join("")}
        <th class="num">Total</th><th>Última</th></tr></thead>
      <tbody>${filas.map(([nombre, r]) => `<tr>
        <td><b>${esc(nombre)}</b></td>
        ${TIPOS_ACT.map(t => `<td class="num">${r.tipos[t.id] || "—"}</td>`).join("")}
        <td class="num"><b>${r.total}</b></td>
        <td class="nowrap hint">${esc(fechaHora(r.ultima))}</td></tr>`).join("")}
        ${filas.length > 1 ? `<tr><td><b>Todos</b></td>
          ${TIPOS_ACT.map(t => `<td class="num"><b>${as.filter(a => a.tipo === t.id).length || "—"}</b></td>`).join("")}
          <td class="num"><b>${as.length}</b></td><td></td></tr>` : ""}
      </tbody></table>`;

  const rotulo = filtroAct.periodo === "todo" ? "en toda la bitácora"
    : `del ${fechaCorta(desde)} al ${fechaCorta(hasta)}`;

  if (!as.length){
    cont.innerHTML = filtrosHtml + `<div class="vacio">Sin actividades registradas ${esc(rotulo)}.<br>
      Cambia el periodo o registra una nueva.</div>`;
  } else {
    cont.innerHTML = filtrosHtml + resumen + `
      <p class="hint" style="margin:0 0 8px">${as.length} actividad(es) ${esc(rotulo)}.
        Haz clic en un renglón para abrirla.</p>
      <table class="data">
        <thead><tr><th>Fecha y hora</th><th>Ejecutivo</th><th>Tipo</th><th>Cliente</th>
          <th>Asunto</th><th>Notas</th></tr></thead>
        <tbody>${as.map(a => `<tr class="row-link" data-a="${a.id}">
          <td class="nowrap">${esc(fechaHora(a.fecha))}</td>
          <td class="nowrap">${esc(a.responsable || "—")}</td>
          <td class="nowrap">${tipoAct(a.tipo).icon} ${esc(tipoAct(a.tipo).name)}</td>
          <td>${esc(nombreCli(a.clienteId))}</td>
          <td><b>${esc(a.asunto || "—")}</b></td>
          <td class="hint" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
              title="${esc(a.notas)}">${esc(a.notas || "")}</td></tr>`).join("")}
        </tbody></table>`;
  }

  cont.querySelector("#fPeriodo").onchange = e => { filtroAct.periodo = e.target.value; render(); };
  const fd = cont.querySelector("#fDesde"), fh = cont.querySelector("#fHasta");
  if (fd) fd.onchange = e => { filtroAct.desde = e.target.value; render(); };
  if (fh) fh.onchange = e => { filtroAct.hasta = e.target.value; render(); };
  cont.querySelector("#fEjeAct").onchange  = e => { filtroAct.ejecutivo = e.target.value; render(); };
  cont.querySelector("#fTipoAct").onchange = e => { filtroAct.tipo = e.target.value; render(); };
  cont.querySelector("#bNuevaAct").onclick = nuevaActividadSuelta;
  cont.querySelector("#bExpAct").onclick = () => exportarActividades(as);
  cont.querySelectorAll("tr[data-a]").forEach(tr => tr.onclick = () => {
    const a = state.actividades.find(x => x.id === tr.dataset.a);
    if (a) modalActividad(a.clienteId, a.id);
  });
}

/** Registrar sin venir de la ficha de un cliente: primero hay que elegirlo. */
function nuevaActividadSuelta(){
  if (!state.clientes.length){
    alert("Primero da de alta un cliente: toda actividad va ligada a uno.");
    return;
  }
  const lista = [...state.clientes].sort((a,b) => a.empresa.localeCompare(b.empresa,"es"));
  const ov = modal(`
    <div class="modal" style="max-width:460px">
      <div class="modal-head"><h2>¿Con qué cliente?</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <label class="lbl">Cliente</label>
        <select class="field" id="selCli" style="width:100%">${lista.map(c =>
          `<option value="${esc(c.id)}">${esc(c.empresa)}${c.ejecutivo ? " · " + esc(c.ejecutivo) : ""}</option>`).join("")}</select>
        <p class="hint" style="margin:10px 0 0">La actividad queda también en la ficha de ese cliente.</p>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bSigue">Continuar</button></div>
    </div>`);
  ov.querySelector("#bSigue").onclick = () => {
    const id = ov.querySelector("#selCli").value;
    ov.remove();
    modalActividad(id, null);
  };
}

function exportarActividades(as){
  if (!as.length){ alert("No hay actividades que exportar con estos filtros."); return; }
  descargar(`actividades-${hoyISO()}.csv`, toCSV(
    [["Fecha y hora","Ejecutivo","Tipo","Cliente","Asunto","Notas"]].concat(
      as.map(a => [fechaHora(a.fecha), a.responsable, tipoAct(a.tipo).name,
                   nombreCli(a.clienteId), a.asunto, a.notas]))), "text/csv");
}

/* ----- Editor de convenio ----- */

function editarConvenio(id, clientePre, alCerrar){
  const existente = id ? state.convenios.find(v => v.id === id) : null;

  if (existente && existente.estado !== "borrador"){
    alert("Este convenio ya está firmado y no se puede editar.\n\nSe abrirá la carta en modo lectura.");
    verConvenio(existente.id, alCerrar);
    return;
  }

  const finAnio = new Date().getFullYear() + "-12-31";
  const v = existente || saneaConv({
    clienteId: clientePre || "",
    folio: "CV-" + new Date().getFullYear() + "-" + String(state.convenios.length + 1).padStart(3,"0"),
    fecha: hoyISO(),
    vigenciaDesde: hoyISO(),
    vigenciaHasta: finAnio,
    textos: Object.assign({}, state.ajustes.textos)
  });

  // En borrador la tarifa pública se refresca desde el catálogo; el precio convenio se conserva.
  const previos = new Map(v.habitaciones.map(h => [h.tipoId, h.convenio]));
  const filas = state.habitaciones.map(h => ({
    tipoId:h.id, codigo:h.codigo, nombre:h.nombre, grupo:h.grupo, publica:h.publica,
    convenio: previos.has(h.id) ? previos.get(h.id) : ""
  }));

  const bloque = gid => {
    const fs = filas.filter(f => f.grupo === gid);
    if (!fs.length) return `<p class="hint">No hay habitaciones de este bloque en el catálogo (pestaña Ajustes).</p>`;
    return `<table class="data"><thead><tr>
        <th style="width:44px"></th><th style="width:80px">Clave</th><th>Tipo de habitación</th>
        <th class="num" style="width:150px">Tarifa pública</th>
        <th class="num" style="width:170px">Tarifa convenio</th><th class="num" style="width:100px">Dcto.</th>
      </tr></thead><tbody>${fs.map(f => {
        const on = f.convenio !== "" && f.convenio !== null;
        return `<tr data-tipo="${f.tipoId}"${on ? "" : ' class="off"'}>
        <td class="selcell"><input type="checkbox" class="sel"${on ? " checked" : ""}
              title="Incluir esta habitación en el convenio"></td>
        <td>${f.codigo ? `<span class="pill">${esc(f.codigo)}</span>` : ""}</td>
        <td><b>${esc(f.nombre)}</b></td>
        <td class="num">${f.publica === null ? `<b>N/A</b>` : `<b>${esc(moneyMN(f.publica))}</b>`}
          <div class="hint">fija</div></td>
        <td class="num"><input class="field conv" inputmode="decimal" data-pub="${f.publica === null ? "" : f.publica}"
              value="${on ? esc(f.convenio) : ""}" placeholder="—" style="width:100%;text-align:right"
              ${on ? "" : "disabled"}></td>
        <td class="num desc">—</td></tr>`; }).join("")}</tbody></table>`;
  };

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${existente ? "Editar convenio" : "Nuevo convenio"}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="grid">
          <div class="full"><label class="lbl">Cliente</label>
            <select class="field" id="cCli">
              <option value="">— Selecciona un cliente —</option>
              ${[...state.clientes].sort((a,b)=>a.empresa.localeCompare(b.empresa,"es")).map(c =>
                `<option value="${c.id}"${c.id===v.clienteId?" selected":""}>${esc(c.empresa)}${c.contacto?" · "+esc(c.contacto):""}</option>`).join("")}
            </select></div>
          <div><label class="lbl">Folio</label><input class="field" id="cFolio" value="${esc(v.folio)}"></div>
          <div><label class="lbl">Fecha de la carta</label><input class="field" type="date" id="cFecha" value="${esc(v.fecha)}"></div>
          <div><label class="lbl">Vigencia desde</label><input class="field" type="date" id="cDesde" value="${esc(v.vigenciaDesde)}"></div>
          <div><label class="lbl">Vigencia hasta</label><input class="field" type="date" id="cHasta" value="${esc(v.vigenciaHasta)}"></div>
        </div>

        <h3 class="sec">Bloque ${esc(infoGrupo("deluxe").nombre)}</h3>
        <div id="cErr"></div>
        <div class="note">Marca las habitaciones que entran en este convenio. La <b>tarifa pública</b>
          viene del catálogo y no se edita aquí; <b>toda habitación marcada necesita su tarifa convenio</b>.</div>
        <div>${bloque("deluxe")}</div>

        <h3 class="sec">Bloque ${esc(infoGrupo("recovery").nombre)}</h3>
        <p><label><input type="checkbox" id="cRec" ${v.incluyeRecovery ? "checked" : ""}>
          Considerar también habitaciones ${esc(infoGrupo("recovery").nombre)} en este convenio</label></p>
        <div id="bRecovery" ${v.incluyeRecovery ? "" : 'style="display:none"'}>${bloque("recovery")}</div>

        <h3 class="sec">Observaciones internas</h3>
        <p class="hint" style="margin-top:0">No se imprimen en la carta; son notas para el equipo.</p>
        <textarea class="field" id="cNotas" style="width:100%;min-height:80px">${esc(v.notas)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDel">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="bOk">Guardar borrador</button>
        <button class="btn ok" id="bFirmar">Guardar y firmar</button>
      </div>
    </div>`);

  const recalcular = () => ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
    const inp = tr.querySelector(".conv");
    const sel = tr.querySelector(".sel").checked;
    const pub = inp.dataset.pub === "" ? null : Number(inp.dataset.pub);
    const celda = tr.querySelector(".desc");
    const val = inp.value.trim();
    if (!sel || !val || pub === null || !pub){ celda.textContent = "—"; celda.style.color = ""; return; }
    const pct = Math.round((1 - parseMoney(val)/pub) * 100);
    celda.textContent = (pct >= 0 ? "-" : "+") + Math.abs(pct) + "%";
    celda.style.color = pct < 0 ? "var(--bad)" : "var(--muted)";
  });

  /** La casilla manda: sin marcar, la tarifa ni se captura. */
  function sincroniza(tr, foco){
    const sel = tr.querySelector(".sel").checked;
    const inp = tr.querySelector(".conv");
    inp.disabled = !sel;
    tr.classList.toggle("off", !sel);
    if (!sel){
      inp.value = "";
      tr.classList.remove("row-err");
      inp.classList.remove("err");
    } else if (foco) inp.focus();
    recalcular();
  }

  ov.addEventListener("change", e => {
    if (e.target.classList.contains("sel")) sincroniza(e.target.closest("tr"), true);
  });
  ov.addEventListener("input", e => {
    if (!e.target.classList.contains("conv")) return;
    e.target.classList.remove("err");
    e.target.closest("tr").classList.remove("row-err");
    recalcular();
  });
  recalcular();

  ov.querySelector("#cRec").onchange = e => {
    ov.querySelector("#bRecovery").style.display = e.target.checked ? "" : "none";
    validar();          // al apagarlo desaparece su reclamo, al prenderlo aparece
  };

  const bDel = ov.querySelector("#bDel");
  if (bDel) bDel.onclick = () => {
    if (!confirm("¿Eliminar este convenio? Esta acción no se puede deshacer.")) return;
    state.convenios = state.convenios.filter(x => x.id !== v.id);
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  ov.querySelector("#bOk").onclick = () => { if (recoger()){ ov.remove(); if (alCerrar) alCerrar(); } };
  ov.querySelector("#bFirmar").onclick = () => {
    if (!recoger()) return;
    ov.remove();
    verConvenio(v.id, alCerrar, true);
  };

  /** Filas que cuentan: las de un bloque vigente (Recovery sólo si está activo). */
  function filasVigentes(){
    const incRec = ov.querySelector("#cRec").checked;
    return [...ov.querySelectorAll("tr[data-tipo]")].map(tr => {
      const cat = state.habitaciones.find(h => h.id === tr.dataset.tipo);
      if (!cat || (cat.grupo === "recovery" && !incRec)) return null;
      return { tr, cat, sel: tr.querySelector(".sel").checked, val: tr.querySelector(".conv").value.trim() };
    }).filter(Boolean);
  }

  function pintaErrores(lista){
    const caja = ov.querySelector("#cErr");
    caja.innerHTML = lista.length
      ? `<div class="errbox"><b>Falta esto para poder continuar:</b><ul>${
          lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      : "";
  }

  /**
   * Devuelve las habitaciones listas para guardar, o null si algo falta.
   * Reglas: al menos una habitación marcada; toda marcada con su tarifa
   * convenio; y si el bloque Recovery está activo, al menos una de ese bloque.
   */
  function validar(){
    ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
      tr.classList.remove("row-err");
      tr.querySelector(".conv").classList.remove("err");
    });

    const vigentes = filasVigentes();
    const marcadas = vigentes.filter(f => f.sel);
    const sinTarifa = marcadas.filter(f => parseMoney(f.val) <= 0);
    const problemas = [];

    if (!marcadas.length)
      problemas.push("Marca al menos un tipo de habitación para este convenio.");

    if (sinTarifa.length){
      problemas.push("Captura la tarifa convenio de: " +
        sinTarifa.map(f => f.cat.codigo || f.cat.nombre).join(", ") + ".");
      sinTarifa.forEach(f => {
        f.tr.classList.add("row-err");
        f.tr.querySelector(".conv").classList.add("err");
      });
    }

    const rec = infoGrupo("recovery").nombre;
    if (ov.querySelector("#cRec").checked && !marcadas.some(f => f.cat.grupo === "recovery"))
      problemas.push(`Activaste el bloque ${rec}: marca al menos una habitación de ese bloque con su tarifa, o desactívalo.`);

    pintaErrores(problemas);
    if (problemas.length){
      const primera = ov.querySelector("tr.row-err") || ov.querySelector("#cErr");
      if (primera) primera.scrollIntoView({ block:"center", behavior:"smooth" });
      return null;
    }
    return marcadas.map(f => ({
      tipoId: f.cat.id, codigo: f.cat.codigo, nombre: f.cat.nombre, grupo: f.cat.grupo,
      publica: f.cat.publica, convenio: parseMoney(f.val)
    }));
  }

  function recoger(){
    const cid = ov.querySelector("#cCli").value;
    if (!cid){
      pintaErrores(["Selecciona el cliente del convenio."]);
      ov.querySelector("#cCli").focus();
      return false;
    }

    const habs = validar();
    if (!habs) return false;

    const desde = ov.querySelector("#cDesde").value, hasta = ov.querySelector("#cHasta").value;
    if (desde && hasta && hasta < desde){
      pintaErrores(['La vigencia "hasta" no puede ser anterior a "desde".']);
      return false;
    }
    pintaErrores([]);

    Object.assign(v, {
      clienteId: cid,
      folio: ov.querySelector("#cFolio").value.trim(),
      fecha: ov.querySelector("#cFecha").value || hoyISO(),
      vigenciaDesde: desde, vigenciaHasta: hasta,
      incluyeRecovery: ov.querySelector("#cRec").checked,
      habitaciones: habs,
      notas: ov.querySelector("#cNotas").value.trim(),
      grupos: saneaGrupos(state.ajustes.grupos),
      updatedAt: new Date().toISOString()
    });
    if (!existente){ v.createdAt = new Date().toISOString(); state.convenios.push(v); }
    guardar(); render();
    return true;
  }
}

/* ----- La carta-convenio ----- */

/** Cuerpo de la carta-convenio. Se usa para verla, imprimirla y armar el PDF. */
function cuerpoConvenio(v, c){
  const h = state.ajustes.hotel;
  const t = v.textos;
  const T = k => vars(t[k], v, c);

  const tablaGrupo = gid => {
    const hs = v.habitaciones.filter(x => x.grupo === gid);
    if (!hs.length) return "";
    const g = infoGrupo(gid, v);
    return `<table class="tar"><thead><tr>
        <th>${esc(g.nombre)} / ${esc(h.nombre)}</th>
        <th class="num" style="width:150px">Tarifa pública</th>
        <th class="num" style="width:150px">Tarifa convenio</th></tr></thead>
      <tbody>${hs.map(x => `<tr>
        <td>${esc(x.nombre)}</td>
        <td class="num">${x.publica === null ? "N/A" : esc(moneyMN(x.publica))}</td>
        <td class="num"><b>${esc(moneyMN(x.convenio))}</b></td></tr>`).join("")}</tbody></table>
      ${g.incluye ? `<div class="inc">${esc(g.incluye)}</div>` : ""}`;
  };

  const bloqueFirma = (f, titulo, nombreDef, puestoDef, celDef) => `
    <div class="firma">
      <h4>${esc(titulo)}</h4>
      <div class="cv">${f ? `<img src="${f.img}" alt="Firma">` : `<span>Pendiente de firma</span>`}</div>
      <div class="lin">
        <i>Nombre</i> <u>${esc(f ? f.nombre : (nombreDef || ""))}</u><br>
        <i>Puesto</i> <u>${esc(f ? f.puesto : (puestoDef || ""))}</u><br>
        <i>Fecha</i> <u>${esc(f ? fechaFirma(f.fecha) : "")}</u><br>
        <i>Celular</i> <u>${esc(f ? f.celular : (celDef || ""))}</u>
      </div>
    </div>`;

  return `      <div class="doc-hotel">
        ${h.logo
          ? `<img class="doc-logo" src="${esc(h.logo)}" alt="${esc(h.nombre)}">`
          : esQuartz(h.nombre)
            ? `<div class="doc-wordmark">${logoQuartz(MORADO_QUARTZ)}</div>`
            : `<div class="doc-mono">${monogramaQ(MORADO_QUARTZ)}</div><b>${esc(h.nombre)}</b>`}
        <div>${esc(h.direccion)}</div>
        <div>Tel. ${esc(h.telefono)}</div>
      </div>
      <div class="doc-regla"></div>

      <div class="doc-fecha">${esc(h.ciudad)} a ${esc(fechaTexto(v.fecha))}</div>

      <div class="doc-dest">
        <b>${esc((c && c.empresa) || "—")}</b><br>
        ${c && c.ubicacion ? esc(c.ubicacion) + "<br>" : ""}
        ${c && c.telefono ? "Tel: " + esc(c.telefono) + "<br>" : ""}
        ${c && c.email ? "Email: " + esc(c.email) : ""}
      </div>

      <p style="white-space:pre-wrap">${esc(T("saludo"))}</p>

      ${tablaGrupo("deluxe")}
      ${v.incluyeRecovery ? tablaGrupo("recovery") : ""}

function verConvenio(id, alCerrar, pedirFirma){
  const v = state.convenios.find(x => x.id === id);
  if (!v) return;
  const c = cliente(v.clienteId);
  const h = state.ajustes.hotel;
  const ec = ESTADOS_CONV[v.estado];
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>Convenio ${esc(v.folio || "")}</h2>
        <span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span>
        <button class="btn" data-close>✕</button>
      </div>
      <div class="doc-body">
        ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
        <div class="doc-contenido">${cuerpoConvenio(v, c)}</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrint">Imprimir</button>
        <button class="btn" id="bPdfC">Descargar PDF</button>
        ${v.estado === "borrador" ? `<button class="btn" id="bEdit">Editar</button>` : ""}
        <div class="spacer"></div>
        ${!v.firmaHotel ? `<button class="btn ok" id="bF1">Firmar como ejecutivo</button>` : ""}
        ${v.firmaHotel && !v.firmaEmpresa ? `<button class="btn" id="bEnviar">Enviar al cliente</button>
          <button class="btn ok" id="bF2">Registrar firma del cliente</button>` : ""}
        ${v.firmaEmpresa ? `<span class="hint">Convenio cerrado. El cliente pasó a <b>Ganado</b>.</span>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrint").onclick = () => {
    fijarPagina(false);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);   // respaldo si el navegador no dispara afterprint
  };
  const bp = ov.querySelector("#bPdfC");
  bp.onclick = async () => {
    const antes = bp.textContent;
    bp.disabled = true; bp.textContent = "Generando…";
    try{
      const bytes = await pdfDeConvenio(v, c);
      descargarBlob(new Blob([bytes], { type:"application/pdf" }), nombrePdfConvenio(v, c));
    }catch(err){
      alert("No se pudo generar el PDF aquí: " + err.message + "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }finally{ bp.disabled = false; bp.textContent = antes; }
  };

  const bEdit = ov.querySelector("#bEdit");
  if (bEdit) bEdit.onclick = () => { ov.remove(); editarConvenio(v.id, null, alCerrar); };

  const f1 = ov.querySelector("#bF1");
  if (f1) f1.onclick = () => padFirma("Firma del ejecutivo de ventas",
    { nombre:(c && c.ejecutivo) || "", puesto:"Ejecutivo de ventas", celular:"" },
    d => { firmar(v, "hotel", d); ov.remove(); verConvenio(v.id, alCerrar); });

  const f2 = ov.querySelector("#bF2");
  if (f2) f2.onclick = () => padFirma("Firma del cliente",
    { nombre:(c && c.contacto) || "", puesto:"", celular:(c && c.telefono) || "" },
    d => { firmar(v, "empresa", d); ov.remove(); verConvenio(v.id, alCerrar); });

  const env = ov.querySelector("#bEnviar");
  if (env) env.onclick = () => enviarConvenio(v, c);

  if (pedirFirma && !v.firmaHotel && f1) setTimeout(() => f1.click(), 60);
}

/** Aplica la firma y empuja al cliente por el embudo. */
function firmar(v, quien, d){
  const fecha = new Date().toISOString();
  const c = cliente(v.clienteId);
  const f = { nombre:d.nombre, puesto:d.puesto, celular:d.celular, fecha, img:d.img };

  if (quien === "hotel"){
    v.firmaHotel = f;
    v.estado = "firmado_ejecutiva";
    if (c && !est(c.estatus).lost){ c.estatus = "cotizacion_enviada"; c.updatedAt = fecha; }
    registrarAuto(v.clienteId, `Convenio ${v.folio} firmado por el ejecutivo`,
      `Firmado por ${d.nombre}. Listo para enviarse al cliente.\nEl cliente pasó a "Cotización enviada".`, d.nombre);
  } else {
    if (!v.firmaHotel){ alert("Primero debe firmar el ejecutivo de ventas."); return; }
    v.firmaEmpresa = f;
    v.estado = "firmado_cliente";
    if (c){
      c.estatus = "ganado";
      c.updatedAt = fecha;
      const precios = v.habitaciones.map(x => Number(x.convenio)).filter(n => n > 0);
      if (precios.length) c.tarifa = Math.min(...precios);
    }
    registrarAuto(v.clienteId, `Convenio ${v.folio} firmado por el cliente`,
      `Firmado por ${d.nombre}. El cliente pasó automáticamente a "Ganado".`, (c && c.ejecutivo) || "");
  }
  v.updatedAt = fecha;
  guardar(); render();
}

function enviarConvenio(v, c){
  const h = state.ajustes.hotel;
  const asunto = `Carta-convenio ${v.folio} · ${h.nombre}`;
  const cuerpo = `Estimado(a) ${(c && c.contacto) || ""}:\n\n` +
    `Adjunto la carta-convenio ${v.folio} de ${h.nombre}, vigente ` +
    `${textoVigencia(v)}, ya firmada por nuestra parte.\n\n` +
    `Le suplicamos hacerla llegar debidamente firmada de aceptación para proceder con la carga ` +
    `de tarifas en nuestro sistema de reservaciones.\n\nSaludos cordiales,\n` +
    `${(v.firmaHotel && v.firmaHotel.nombre) || (c && c.ejecutivo) || ""}\n${h.nombre}`;
  const archivo = nombrePdfConvenio(v, c);

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Enviar convenio al cliente</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="cuerpoEnvioC">
        <p class="hint">Preparando el PDF del convenio…</p>
      </div>
      <div class="modal-foot"><div class="spacer"></div><button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const paso3 = `<p class="hint" style="margin-top:16px">Cuando el cliente la devuelva firmada,
      regresa a la carta y usa <i>Registrar firma del cliente</i>: pasará a <b>Ganado</b> solo.</p>`;

  const anotar = via => {
    registrarAuto(v.clienteId, `Convenio ${v.folio} enviado por ${via}`,
      `Enviado a ${via === "correo" ? (c && c.email) : (c && c.telefono)}.`, (c && c.ejecutivo) || "");
    guardar(); render();
  };
  const abrirCorreo = () => {
    window.location.href = `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
    anotar("correo");
  };
  const abrirWa = () => { window.open(waLink(c.telefono, cuerpo), "_blank", "noopener"); anotar("WhatsApp"); };

  pdfDeConvenio(v, c).then(bytes => {
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" && navigator.canShare({ files:[file] });
    const bajar = () => descargarBlob(blob, archivo);

    ov.querySelector("#cuerpoEnvioC").innerHTML = (puedeCompartir
      ? `<div class="note"><b>El convenio ya está listo.</b> Al compartir, el PDF firmado y el
           mensaje van juntos: elige correo o WhatsApp en la lista que abra el sistema.</div>
         <p><button class="btn ok" id="cCompartir" style="font-size:15px;padding:10px 16px">
            Compartir convenio y mensaje</button></p>
         <p class="hint">¿Prefieres hacerlo a mano?</p>`
      : `<div class="note warn"><b>Este equipo no puede adjuntar archivos desde el navegador.</b>
           Ni el correo ni WhatsApp aceptan adjuntos por enlace, así que se hace en dos pasos:
           se descarga el PDF y lo adjuntas al abrir el correo o WhatsApp.
           <br><br>En un celular sí sale todo junto de una vez.</div>`) +
      `<p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <button class="btn" id="cBajar">Descargar el PDF</button>
         <button class="btn" id="cMail" ${(c && c.email) ? "" : "disabled"}>Abrir correo con el mensaje</button>
         <button class="btn wa" id="cWa" ${(c && c.telefono) ? "" : "disabled"}
           title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button></p>
       <p class="hint">Se guardará como <b>${esc(archivo)}</b></p>` + paso3;

    const bc = ov.querySelector("#cCompartir");
    if (bc) bc.onclick = async () => {
      try{
        await navigator.share({ files:[file], text: cuerpo, title: asunto });
        anotar("correo o WhatsApp");
        ov.remove();
      }catch(err){ if (err && err.name !== "AbortError") alert("No se pudo compartir: " + err.message); }
    };
    ov.querySelector("#cBajar").onclick = bajar;
    const m = ov.querySelector("#cMail");
    if (m && !m.disabled) m.onclick = () => { if (!puedeCompartir) bajar(); setTimeout(abrirCorreo, puedeCompartir ? 0 : 600); };
    const w = ov.querySelector("#cWa");
    if (w && !w.disabled) w.onclick = () => { if (!puedeCompartir) bajar(); setTimeout(abrirWa, puedeCompartir ? 0 : 600); };
  }).catch(err => {
    ov.querySelector("#cuerpoEnvioC").innerHTML =
      `<div class="note warn"><b>No se pudo generar el PDF aquí.</b> ${esc(err.message)}
        <br><br>Usa <i>Imprimir / Guardar PDF</i> en la carta y adjúntalo a mano.</div>
       <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <button class="btn" id="cVer">Abrir la carta</button>
         <button class="btn" id="cMail2" ${(c && c.email) ? "" : "disabled"}>Abrir correo con el mensaje</button>
         <button class="btn wa" id="cWa2" ${(c && c.telefono) ? "" : "disabled"}
           title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button></p>` + paso3;
    ov.querySelector("#cVer").onclick = () => { ov.remove(); verConvenio(v.id); };
    const m2 = ov.querySelector("#cMail2"); if (m2 && !m2.disabled) m2.onclick = abrirCorreo;
    const w2 = ov.querySelector("#cWa2");   if (w2 && !w2.disabled) w2.onclick = abrirWa;
  });
}

/** Lienzo de firma: ratón, dedo o lápiz. */
function padFirma(titulo, def, alFirmar){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${esc(titulo)}</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="grid" style="margin-bottom:14px">
          <div class="full"><label class="lbl">Nombre</label>
            <input class="field" id="fNombre" value="${esc(def.nombre||"")}" placeholder="Nombre completo"></div>
          <div><label class="lbl">Puesto</label>
            <input class="field" id="fPuesto" value="${esc(def.puesto||"")}"></div>
          <div><label class="lbl">Celular</label>
            <input class="field" id="fCel" value="${esc(def.celular||"")}"></div>
        </div>
        <label class="lbl">Firma (traza con el ratón o el dedo)</label>
        <canvas class="sign-pad" id="pad"></canvas>
        <p class="hint" style="margin-top:6px">Una vez firmado, el convenio ya no se puede editar.</p>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bClear">Borrar trazo</button>
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn ok" id="bOk">Firmar</button>
      </div>
    </div>`);

  const cv = ov.querySelector("#pad");
  const ctx = cv.getContext("2d");
  let trazando = false, huboTrazo = false, last = null;

  // Se dimensiona en píxeles físicos para que la firma no salga pixelada al imprimir.
  requestAnimationFrame(() => {
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width  = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#39104e";
  });

  const punto = ev => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
  cv.addEventListener("pointerdown", ev => {
    ev.preventDefault(); trazando = true; huboTrazo = true;
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    last = punto(ev);
  });
  cv.addEventListener("pointermove", ev => {
    if (!trazando) return;
    const p = punto(ev);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const fin = () => { trazando = false; };
  cv.addEventListener("pointerup", fin);
  cv.addEventListener("pointercancel", fin);
  cv.addEventListener("pointerleave", fin);

  ov.querySelector("#bClear").onclick = () => { ctx.clearRect(0,0,cv.width,cv.height); huboTrazo = false; };
  ov.querySelector("#bOk").onclick = () => {
    const nombre = ov.querySelector("#fNombre").value.trim();
    if (!nombre){ alert("Escribe el nombre de quien firma."); return; }
    if (!huboTrazo){ alert("Falta trazar la firma."); return; }
    // Fondo blanco: un PNG transparente se ve mal al imprimir.
    const out = document.createElement("canvas");
    out.width = cv.width; out.height = cv.height;
    const o = out.getContext("2d");
    o.fillStyle = "#fff"; o.fillRect(0,0,out.width,out.height);
    o.drawImage(cv, 0, 0);
    ov.remove();
    alFirmar({ nombre,
      puesto: ov.querySelector("#fPuesto").value.trim(),
      celular: ov.querySelector("#fCel").value.trim(),
      img: out.toDataURL("image/png") });
  };
}

function abrirImportar(){
  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>Importar clientes</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note">Sube un <b>CSV</b> (o TSV) con la primera fila de encabezados. Desde Excel o
          Google Sheets usa <i>Archivo → Descargar → CSV</i>. También puedes pegar las filas abajo.
          Esto importa <b>clientes</b>; actividades y convenios se capturan dentro de cada ficha.</div>
        <p><input type="file" id="file" class="field" accept=".csv,.tsv,.txt,text/csv,text/plain"></p>
        <p class="hint">o pega aquí las filas (con su fila de encabezados):</p>
        <textarea id="paste" class="field" style="width:100%"
          placeholder="Empresa,Contacto,Teléfono,Correo,Ubicación,Estatus&#10;ACME,Ana López,5512345678,ana@acme.mx,Tijuana,Propuesta"></textarea>
        <div id="mapArea"></div>
      </div>
      <div class="modal-foot"><span class="hint" id="impInfo"></span><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="doImport" disabled>Importar</button></div>
    </div>`);

  let filas = null, heads = [];

  ov.querySelector("#file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => preparar(String(r.result));
    r.onerror = () => alert("No se pudo leer el archivo.");
    r.readAsText(f, "utf-8");
  });
  ov.querySelector("#paste").addEventListener("input", e => {
    const t = e.target.value.trim();
    if (t.length > 10) preparar(t); else limpiar();
  });

  function limpiar(){
    filas = null;
    ov.querySelector("#mapArea").innerHTML = "";
    ov.querySelector("#impInfo").textContent = "";
    ov.querySelector("#doImport").disabled = true;
  }

  function preparar(texto){
    const todo = parseCSV(texto);
    if (todo.length < 2){ limpiar(); ov.querySelector("#impInfo").textContent = "Hacen falta encabezados y al menos una fila."; return; }
    heads = todo[0].map(x => String(x).trim());
    filas = todo.slice(1);

    const hallado = autoMapear(CAMPOS_CLIENTE, heads);

    const cuerpo = CAMPOS_CLIENTE.map(f => {
      const g = hallado[f.key] != null ? hallado[f.key] : -1;
      const opts = [`<option value="-1">— ignorar —</option>`].concat(
        heads.map((x,i) => `<option value="${i}"${i===g?" selected":""}>${esc(x || "(columna "+(i+1)+")")}</option>`)).join("");
      const ej = g > -1 ? ((filas.find(r => String(r[g]||"").trim()) || [])[g] || "") : "";
      return `<tr><td><b>${esc(f.label)}</b>${f.req ? ' <span style="color:var(--bad)">*</span>' : ""}</td>
        <td><select class="field" data-f="${f.key}" style="width:100%">${opts}</select></td>
        <td class="hint" data-p="${f.key}" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ej)}</td></tr>`;
    }).join("");

    ov.querySelector("#mapArea").innerHTML = `
      <h3 class="sec">Relaciona tus columnas</h3>
      <p class="hint" style="margin-top:0">Ya adiviné el mapeo según tus encabezados. Corrige lo que haga falta.</p>
      <div style="max-height:42vh;overflow:auto"><table class="data">
        <thead><tr><th>Campo del CRM</th><th>Columna de tu archivo</th><th>Ejemplo</th></tr></thead>
        <tbody>${cuerpo}</tbody></table></div>
      <p style="margin:12px 0 0"><label><input type="checkbox" id="replace">
        Reemplazar la cartera actual (borra clientes, actividades y convenios existentes)</label></p>`;

    ov.querySelectorAll("#mapArea select").forEach(sel => sel.addEventListener("change", () => {
      const i = Number(sel.value);
      ov.querySelector(`[data-p="${sel.dataset.f}"]`).textContent =
        i > -1 ? ((filas.find(r => String(r[i]||"").trim()) || [])[i] || "") : "";
    }));

    ov.querySelector("#impInfo").textContent = `${filas.length} filas · ${heads.length} columnas detectadas`;
    ov.querySelector("#doImport").disabled = false;
  }

  ov.querySelector("#doImport").onclick = () => {
    if (!filas) return;
    const map = {};
    ov.querySelectorAll("#mapArea select").forEach(s => map[s.dataset.f] = Number(s.value));
    const reemplazar = ov.querySelector("#replace") && ov.querySelector("#replace").checked;
    if (reemplazar && !confirm("Se borrarán TODOS los clientes actuales junto con sus actividades y convenios. ¿Continuar?")) return;

    const nuevos = [];
    for (const r of filas){
      const o = {};
      for (const f of CAMPOS_CLIENTE){
        const i = map[f.key];
        const val = String((i > -1 ? r[i] : "") ?? "").trim();
        if (f.key === "tarifa") o.tarifa = parseMoney(val);
        else if (f.key === "estatus") o.estatus = matchEstatus(val);
        else o[f.key] = val;
      }
      if (!o.empresa && !o.contacto && !o.telefono && !o.email) continue;
      if (!o.empresa) o.empresa = o.contacto || o.email || "(sin nombre)";
      o.id = nuevoId("c");
      o.createdAt = new Date().toISOString();
      nuevos.push(saneaCliente(o));
    }
    if (!nuevos.length){ alert("No se encontraron filas con datos utilizables. Revisa el mapeo."); return; }

    if (reemplazar){ state.clientes = nuevos; state.actividades = []; state.convenios = []; }
    else state.clientes = state.clientes.concat(nuevos);
    guardar(); render(); ov.remove();
    alert(`Se importaron ${nuevos.length} clientes.`);
  };
}
