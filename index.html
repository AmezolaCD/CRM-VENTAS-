async function recogerAltas(){
  const parte = { hubo:false, buzon:true, pendientes:0, aplicadas:0, notas:[] };
  if (!nubeActiva()){ parte.buzon = false; return parte; }

  let filas;
  try{
    filas = await api("/rest/v1/crm_altas?select=id,nombre,apellido,email,telefono,compania,interes,utm,creado&aplicada=is.false");
  }catch(e){
    if (/crm_altas|schema cache|does not exist|404|PGRST205/i.test(e.message)){
      nube.sinBuzonAltas = true;
      parte.buzon = false;
      parte.notas.push("El buzón de registros no existe todavía: falta correr prospectos.sql en Supabase.");
      return parte;
    }
    parte.notas.push("No se pudo leer el buzón de registros: " + e.message);
    return parte;
  }

  parte.pendientes = (filas || []).length;
  const aplicadas = [];
  for (const f of filas || []){
    const utm = f.utm || {};
    const etiqueta = String(utm.campaign || "").trim().toLowerCase();
    const c = etiqueta
      ? state.campanas.find(x => etiquetaUtm(x).toLowerCase() === etiqueta)
      : null;
    // El canal sale de la campaña si se reconoció; si no, de utm_source.
    const canal = c ? c.canal
      : (CANALES.find(x => x.utm === String(utm.source || "").toLowerCase()) || {}).id || "";

    state.prospectos.push(saneaProspecto({
      nombre: f.nombre, apellido: f.apellido, email: f.email, telefono: f.telefono,
      compania: f.compania,
      evento: String(f.interes || "").trim(),
      notas: "Se registró desde la liga del hotel.",
      capturadoPor: c ? c.responsable : "",
      fecha: String(f.creado || new Date().toISOString()).slice(0, 16),
      canal, campanaId: c ? c.id : "",
      utm: { source:utm.source, medium:utm.medium, campaign:utm.campaign,
             content:utm.content, term:utm.term },
      createdAt: new Date().toISOString()
    }));
    aplicadas.push(f.id);
    parte.aplicadas++;
    if (etiqueta && !c)
      parte.notas.push(`Llegó un registro de la campaña "${utm.campaign}", que este equipo no tiene dada de alta.`);
  }

  if (aplicadas.length){
    // Se marcan DESPUÉS de crearlos: si se cortara la luz entre una cosa y la
    // otra, más vale recoger dos veces al mismo que perderlo.
    try{
      await api(`/rest/v1/crm_altas?id=in.(${aplicadas.join(",")})`, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify({ aplicada: true })
      });
    }catch(e){
      parte.notas.push("Se recogieron los registros pero no se pudieron marcar: " + e.message);
    }
    parte.hubo = true;
    guardar();
  }
  return parte;
}


/* ==========================================================================
   LO QUE META NOS CUENTA DE LOS ANUNCIOS

   El gasto se captura a mano, mes por mes, y así va a seguir: esto NO lo
   pisa. Lo que hace es traer, al lado, lo que dice Meta —por día y por
   campaña— para que cuando los dos números no cuadren, se vea.

   El acceso de Meta no vive aquí. Vive en los secretos de Supabase y lo usa
   únicamente la función meta-sync, del lado del servidor. Esta página es
   pública: cualquier cosa que se guardara en ella se puede leer.
   ========================================================================== */

/* Las cifras de Meta NO viven en state ni pasan por COLECCIONES, a propósito.
   No son documentos del hotel: son copia de lo que Meta ya tiene. Si entraran
   al costal de la sincronización, cada equipo intentaría subirlas de regreso a
   crm_datos, las reglas rechazarían el lote ENTERO y el hotel se quedaría sin
   sincronizar nada. Se piden cuando hacen falta y se quedan aquí, en la
   memoria de esta pestaña. */
/* Cuántos días hacia atrás se le piden a Meta al sincronizar.
   Siete es lo de diario: Meta corrige sus cifras unos días después y con eso
   basta para ir al corriente. Pero la primera vez —o cuando alguien quiere ver
   de dónde viene el año— hacen falta más, y una campaña que no gastó en la
   semana no devuelve un solo renglón: por eso se puede escoger. El tope son 92
   días, que es lo que aguanta la función sin ahogarse. */
let metaDias = 7;
let metaMetricas = null;     // una fila por campaña de Meta y día
let metaObjetos = [];        // el catálogo: id de Meta → nombre
let metaSync = null;         // el último renglón de la bitácora
let metaError = "";    // no se pudieron LEER las cifras que ya estaban
let metaFallo = "";    // no se pudieron TRAER las nuevas de Meta
let metaPidiendo = null;
/* Cuántas cifras se bajan de una vez. Ochenta y tantos objetos por un año dan
   unos treinta mil renglones, así que el tope viejo de veinte mil los cortaba
   sin decir nada y el tablero contaba de menos. Si se llega al tope se avisa,
   que es lo único peor que quedarse corto: quedarse corto en silencio. */
const TOPE_CIFRAS = 60000;
let metaCortado = false;

const hayMeta = () => nubeActiva() && !nube.sinMeta;
const ligaFuncionMeta = () =>
  nube.url ? nube.url.replace(/\/+$/, "") + "/functions/v1/meta-sync" : "";

/** ¿Ese error quiere decir que meta.sql todavía no se corre? */
const faltaMetaSql = m =>
  /crm_meta|PGRST2\d\d|schema cache|does not exist|relation|404/i.test(String(m));

/**
 * Las cifras de Meta que ya están guardadas, para un periodo.
 *
 * Trae también el catálogo de nombres y la última anotación de la bitácora,
 * que es lo único que le dice a una persona si la conexión sigue viva.
 */
async function pedirMeta(desde, hasta){
  if (!hayMeta()) return null;
  try{
    const [met, obj, bit] = await Promise.all([
      /* Bajan LOS DOS NIVELES: campañas y conjuntos de anuncios. Antes se
         filtraba a campañas aquí; ya no, porque el hotel trabaja con los
         conjuntos —una campaña de Meta que mezcla bodas y catering, aquí son
         dos cosas—. Quién suma qué lo decide metricasMeta, que sabe de
         padres e hijos; este lado nada más los trae. */
      api("/rest/v1/crm_meta_metricas?select=nivel,objeto,fecha,gasto,impresiones,clics,leads,moneda"
          + "&fecha=gte." + desde + "&fecha=lte." + hasta + "&limit=" + TOPE_CIFRAS),
      api("/rest/v1/crm_meta_objetos?select=nivel,objeto,nombre,estado,padre&limit=4000"),
      api("/rest/v1/crm_meta_sync?select=cuando,quien,cuenta,desde,hasta,filas,ok,detalle"
          + "&order=cuando.desc&limit=1")
    ]);
    metaError = "";
    metaCortado = Array.isArray(met) && met.length >= TOPE_CIFRAS;
    metaObjetos = Array.isArray(obj) ? obj : [];
    metaSync = Array.isArray(bit) && bit.length ? bit[0] : null;
    return Array.isArray(met) ? met : [];
  }catch(e){
    if (faltaMetaSql(e.message)){ nube.sinMeta = true; metaError = ""; }
    else metaError = e.message;
    return null;
  }
}

/**
 * Una llamada a la función del servidor, la única que sabe el acceso.
 *
 * El token de entrada dura una hora. Lo mismo que hace api() con la cartera hay
 * que hacerlo aquí: si el servidor contesta que la sesión ya no vale, se renueva
 * y se vuelve a llamar UNA vez. Sin esto, dejar el CRM abierto un rato y apretar
 * Sincronizar contestaba «401» —un número que no le dice nada a nadie— aunque
 * todo estuviera bien puesto.
 */
async function llamaMeta(cuerpo, reintento = true){
  if (!nubeActiva()) throw new Error("Sin conexión a la nube.");

  /* Una sesión guardada puede venir sin token y sólo con el permiso de
     renovarlo. Si se llama así, se manda "Bearer undefined" y Supabase contesta
     401 sin decir por qué. Es la misma precaución que toma api(). */
  if (reintento && nube.sesion && !nube.sesion.access_token && nube.sesion.refresh_token)
    await renovarSesion();

  const r = await fetch(ligaFuncionMeta(), {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + nube.sesion.access_token,
      "apikey": nube.anon
    },
    body: JSON.stringify(cuerpo)
  });

  if (r.status === 401 && reintento && nube.sesion && nube.sesion.refresh_token){
    if (await renovarSesion()) return llamaMeta(cuerpo, false);
  }

  const j = await r.json().catch(() => ({}));
  /* Nuestra función contesta en 'error'; el portón de Supabase, que atiende
     antes, contesta en 'message' o en 'msg'. Leer nada más el nuestro dejaba al
     usuario con un número pelón cuando el que se quejaba era el portón. */
  const dijo = j.error || j.message || j.msg || "";

  if (r.status === 404)
    throw new Error("La función meta-sync todavía no está subida a Supabase. " +
      "Se sube una vez, pegando el archivo en Edge Functions. Viene en META.md.");

  /* Un 401 que no sale de nuestra función lo pone Supabase antes de llegar a
     ella, y casi siempre es el interruptor de "Verify JWT". */
  if (r.status === 401 && !j.error)
    throw new Error("Supabase rechazó la sesión antes de llegar a la función" +
      (dijo ? ` («${dijo}»)` : "") + ". Primero cierre sesión y vuelva a entrar. " +
      "Si sigue igual, en Supabase → Edge Functions → meta-sync → Settings, apague " +
      "«Verify JWT»: la función comprueba la sesión y el papel por su cuenta, así que " +
      "no se abre nada. Viene explicado en META.md.");

  if (!r.ok) throw new Error(dijo || ("El servidor contestó " + r.status + "."));
  return j;
}

/** El renglón del catálogo de un id de Meta, sea campaña o conjunto. */
const objetoMeta = id => metaObjetos.find(x => String(x.objeto) === String(id)) || null;

/** El nombre que Meta le puso a eso, si lo sabemos. */
const nombreMeta = id => {
  const o = objetoMeta(id);
  return o && o.nombre ? o.nombre : String(id);
};

/**
 * De qué campaña de Meta cuelga un conjunto de anuncios.
 *
 * Vacío si es una campaña —no cuelga de nadie— o si todavía no se ha bajado
 * el catálogo. De aquí sale la regla que impide contar el mismo gasto dos
 * veces, así que un vacío significa "no sabemos", nunca "no tiene padre".
 */
const padreDe = id => {
  const o = objetoMeta(id);
  return o && o.padre ? String(o.padre) : "";
};

/** ¿Ese id de Meta es un conjunto de anuncios? */
const esConjunto = id => {
  const o = objetoMeta(id);
  return !!(o && String(o.nivel || "") === "conjunto");
};

/**
 * Lo que Meta dice de una campaña del CRM, sumando las suyas.
 *
 * Devuelve null cuando la campaña no está enlazada o cuando no hay ni un día
 * con datos: null es "no sabemos", y se pinta con una raya. Un cero aquí
 * sería otra cosa —"no se gastó"— y no es lo que está pasando.
 */
/**
 * Las cifras de Meta, ordenadas una vez, para no recorrerlas por campaña.
 *
 * La pantalla de campañas pregunta una vez por renglón, y con los conjuntos de
 * anuncios los renglones pasan de diecinueve a ochenta y tantos sobre decenas
 * de miles de cifras. Recorrerlas ochenta veces se siente en la máquina de
 * quien lo usa. Se arma al bajar y se tira cada vez que algo cambia.
 *
 * Y aquí se calcula LA RESTA, que es el corazón de todo esto: cuánto de lo que
 * Meta le cobró a una campaña, un día, ya se está enseñando en alguno de sus
 * conjuntos.
 */
let metaIndice = null;

function indiceMeta(){
  if (metaIndice) return metaIndice;

  const porObjeto = new Map();
  for (const f of metaMetricas || []){
    const k = String(f.objeto);
    if (!porObjeto.has(k)) porObjeto.set(k, []);
    porObjeto.get(k).push(f);
  }

  /* Los conjuntos que alguna campaña del CRM ya está cobrando por su cuenta.
     Se mira en TODAS las campañas, no en una: el peso que ya se contó en un
     renglón de la pantalla no se puede volver a contar en otro. */
  const tomados = new Set();
  for (const c of state.campanas)
    for (const id of c.metaIds || []) if (esConjunto(id)) tomados.add(String(id));

  /* ¿De todos ellos sabemos de qué campaña cuelgan? Si de alguno no —porque
     el catálogo no alcanzó a bajar—, no se puede restar, y sin restar el mismo
     peso se contaría dos veces. En ese caso se cuenta SÓLO por campaña, como
     antes: se pierde el detalle, que se nota, en vez de inflar la inversión,
     que no se nota y es lo que hace tomar una decisión equivocada. */
  let completo = true;
  for (const id of tomados) if (!padreDe(id)){ completo = false; break; }

  const resta = new Map();
  if (completo)
    for (const id of tomados)
      for (const f of porObjeto.get(id) || []){
        const k = padreDe(id) + "|" + String(f.fecha || "").slice(0, 10);
        const a = resta.get(k) || { gasto:0, impresiones:0, clics:0, leads:0 };
        a.gasto       += Number(f.gasto) || 0;
        a.impresiones += Number(f.impresiones) || 0;
        a.clics       += Number(f.clics) || 0;
        a.leads       += Number(f.leads) || 0;
        resta.set(k, a);
      }

  metaIndice = { porObjeto, resta, completo };
  return metaIndice;
}

/**
 * Lo que Meta dice de una campaña del CRM, sumando las suyas.
 *
 * Devuelve null cuando la campaña no está enlazada o cuando no hay ni un día
 * con datos: null es "no sabemos", y se pinta con una raya. Un cero aquí
 * sería otra cosa —"no se gastó"— y no es lo que está pasando.
 *
 * ------------------------------------------------------------------------
 * EL GASTO DE UN CONJUNTO YA VIENE DENTRO DEL DE SU CAMPAÑA.
 *
 * Meta no los suma: los desglosa. Si el hotel tiene enlazada la campaña en un
 * renglón y uno de sus conjuntos en otro, sumar los dos tal cual infla la
 * inversión —y con ella el costo por lead y el retorno, que son las dos cifras
 * con las que alguien decide dónde gastar el mes que entra—.
 *
 * La regla: un conjunto se suma entero; una campaña se suma MENOS los
 * conjuntos suyos que estén enlazados en cualquier campaña del CRM, DÍA POR
 * DÍA.
 *
 * Día por día y no al final, porque los dos conviven en la misma tabla: los
 * días de antes de traer los conjuntos no tienen desglose y la campaña vale
 * entera, y los de después sí lo tienen y a la campaña le queda lo que sobra.
 * Restando al final, un rango que cruce las dos épocas saldría mal. Y por eso
 * tampoco se desenlaza la campaña al traer sus conjuntos: eso borraría de la
 * pantalla todos los meses de historia que sólo existen a nivel de campaña.
 *
 * Se acota en cero porque Meta redondea cada nivel por su cuenta: unos
 * centavos al revés pintarían un gasto negativo, que no existe.
 */
function metricasMeta(c, desde, hasta){
  const ids = (c.metaIds || []).map(String);
  if (!metaMetricas || !ids.length) return null;
  const ix = indiceMeta();
  let gasto = 0, impresiones = 0, clics = 0, leads = 0, moneda = "", dias = 0;
  let desglosados = 0;
  for (const id of ids){
    const conj = esConjunto(id);
    if (conj && !ix.completo) continue;   // sin saber de quién cuelga, no se cuenta
    for (const f of ix.porObjeto.get(id) || []){
      const d = String(f.fecha || "").slice(0, 10);
      if (desde && d < desde) continue;
      if (hasta && d > hasta) continue;
      let g  = Number(f.gasto) || 0,       im = Number(f.impresiones) || 0,
          cl = Number(f.clics) || 0,       le = Number(f.leads) || 0;
      if (!conj){
        const r = ix.resta.get(id + "|" + d);
        if (r){
          g  = Math.max(0, g  - r.gasto);
          im = Math.max(0, im - r.impresiones);
          cl = Math.max(0, cl - r.clics);
          le = Math.max(0, le - r.leads);
          desglosados++;
        }
      }
      gasto += g; impresiones += im; clics += cl; leads += le;
      moneda = moneda || String(f.moneda || "");
      dias++;
    }
  }
  return dias ? { gasto: Math.round(gasto * 100) / 100, impresiones, clics, leads,
                  moneda, dias, desglosados } : null;
}

/**
 * La casilla del gasto según Meta, al lado del capturado a mano.
 *
 * Los dos se enseñan, nunca se pisan. Cuando no cuadran por más de un 10%
 * se marca: casi siempre es que falta capturar un mes, o que la campaña del
 * CRM está enlazada a menos campañas de Meta de las que en realidad corrió.
 */
function celdaMeta(c, gastoManual, desde, hasta){
  if (!(c.metaIds || []).length)
    return `<span class="hint" title="Esta campaña todavía no está enlazada con Meta">—</span>`;
  const m = metricasMeta(c, desde, hasta);
  if (!m)
    return `<span class="hint" title="Meta no reportó gasto de esta campaña en el periodo">—</span>`;
  /* El ≠ compara lo capturado a mano con lo que dice Meta, y eso sólo tiene
     sentido cuando las dos cifras hablan de lo mismo. Si a esta campaña ya se
     le restó lo que se enseña en sus conjuntos, aquí sale un residual y allá
     está el gasto entero del mes: marcarlas como que no cuadran sería gritar
     por algo que está bien. */
  const dispar = !m.desglosados && gastoManual && m.gasto &&
    Math.abs(m.gasto - gastoManual) / Math.max(m.gasto, gastoManual) > 0.10;
  /* Cuando parte del gasto ya se está enseñando en sus conjuntos, aquí sale
     sólo lo que sobra. Sin decirlo, una campaña que ayer traía cincuenta mil y
     hoy trae dos mil parece un error del CRM. */
  const desglose = m.desglosados
    ? ` <span class="hint" title="Este gasto ya se está enseñando en sus conjuntos de anuncios, que están aquí como campañas aparte. Aquí sale sólo lo que no cayó en ninguno, para no cobrarlo dos veces.">· desglosada</span>`
    : "";
  return esc(moneyMN(m.gasto)) + (dispar
    ? ` <b style="color:var(--warn)" title="No cuadra con lo capturado a mano (${
        esc(moneyMN(gastoManual))}). Revise si falta capturar un mes.">≠</b>` : "") + desglose;
}

/** "hace 3 horas", que es como lo diría una persona. */
function haceCuanto(iso){
  const t = Date.parse(iso || "");
  if (!t) return "";
  const min = Math.round((Date.now() - t) / 60000);
  if (min < 2) return "hace un momento";
  if (min < 60) return "hace " + min + " minutos";
  const h = Math.round(min / 60);
  if (h < 24) return "hace " + h + (h === 1 ? " hora" : " horas");
  const d = Math.round(h / 24);
  return "hace " + d + (d === 1 ? " día" : " días");
}

/**
 * La tira de estado de la conexión con Meta.
 *
 * Es lo único de toda esta entrega que le sirve a alguien que no sabe qué es
 * un token: dice si sigue viva, de cuándo son las cifras y, si se cayó, por
 * qué. Sin esto, el día que el acceso caduque las cifras se congelarían y
 * nadie se enteraría hasta la junta.
 */
function tiraMeta(){
  if (!nubeActiva())
    return `<div class="note" style="margin-bottom:12px">Sin conexión a la nube, el gasto
      se captura a mano. Traerlo de Meta lo hace el servidor.</div>`;
  if (nube.sinMeta)
    return `<div class="note warn" style="margin-bottom:12px">
      <b>Meta todavía no está conectado.</b> Se conecta una vez: se corre
      <code>meta.sql</code> en Supabase y se sube la función <code>meta-sync</code>.
      Mientras tanto el gasto se captura a mano, como hasta hoy, y todo lo demás
      funciona igual. El paso a paso está en <b>META.md</b>.</div>`;

  const s = metaSync;
  const huecas = campanasHuecasDeMeta().length;
  const bien = s && s.ok;
  const punto = !s ? "○" : bien ? "●" : "▲";
  const color = !s ? "var(--muted)" : bien ? "var(--ok)" : "var(--bad)";
  const dicho = !s
    ? "Nunca se ha traído nada todavía."
    : bien
      ? "Al día · " + esc(haceCuanto(s.cuando)) +
        (s.filas ? " · " + s.filas + " días de cifras" : "")
      : "La última vez falló " + esc(haceCuanto(s.cuando));

  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <span style="color:${color};font-size:13px">${punto}</span>
      <b>Meta Ads</b>
      <span class="hint">${dicho}</span>
      ${s && s.cuenta ? `<span class="hint">· ${esc(s.cuenta)}</span>` : ""}
      <span style="flex:1"></span>
      <span class="hint" id="metaDicho"></span>
      ${huecas ? `<button class="btn sm" id="bMetaLimpia"
        title="Las que entraron solas y nunca tuvieron gasto, presupuesto ni prospectos">
        Quitar ${huecas} sin movimiento</button>` : ""}
      <label class="hint" for="metaDias">Traer</label>
      <select class="field" id="metaDias" style="width:auto;padding:4px 8px">
        ${[[7, "7 días"], [30, "30 días"], [92, "3 meses"]].map(([n, t]) =>
          `<option value="${n}"${n === metaDias ? " selected" : ""}>${t}</option>`).join("")}
      </select>
      <button class="btn sm" id="bMetaSync">Sincronizar</button>
    </div>
    ${s && !s.ok && s.detalle ? `<div class="errbox" style="margin-bottom:12px">
      ${esc(s.detalle)}</div>` : ""}
    ${metaError ? `<div class="errbox" style="margin-bottom:12px">
      No se pudieron leer las cifras de Meta.<br>
      <span class="hint">${esc(metaError)}</span></div>` : ""}
    ${metaFallo ? `<div class="errbox" style="margin-bottom:12px">
      No se pudo traer lo de Meta.<br>
      <span class="hint">${esc(metaFallo)}</span></div>` : ""}
    ${metaCortado ? `<div class="note warn" style="margin-bottom:12px">
      <b>Son demasiadas cifras para un solo jalón.</b> Se trajeron las primeras y las
      demás se quedaron fuera, así que la inversión de esta pantalla sale <b>de menos</b>.
      Escoja un periodo más corto arriba, en el tablero de marketing.</div>` : ""}
    ${(metaMetricas && !indiceMeta().completo) ? `<div class="note warn" style="margin-bottom:12px">
      <b>Falta saber de qué campaña cuelga algún conjunto de anuncios.</b> Mientras tanto
      se cuenta <b>sólo por campaña</b>, como antes, para no cobrar el mismo peso dos veces.
      Con volver a apretar <b>Sincronizar</b> se arregla.</div>` : ""}`;
}

/**
 * Cuántas campañas de Meta se pueden traer de una sola sincronizada.
 *
 * Una cuenta publicitaria con cientos de campañas activas no tiene por qué
 * poder llenar la cartera del hotel de un botonazo. Si se pasa, se dice.
 */
const TOPE_TRAER = 80;

/** Para comparar nombres sin que estorben acentos, mayúsculas ni dobles espacios. */
const mismoNombre = n => String(n || "").trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ");

/**
 * Trae al CRM las campañas de Meta que de verdad están corriendo.
 *
 * "Corriendo" quiere decir QUE GASTARON en el periodo que se acaba de traer, y
 * no lo que Meta llama ACTIVE. Los dos no son lo mismo y la diferencia se paga
 * caro: una campaña con su interruptor encendido pero con todos sus conjuntos
 * de anuncios apagados sigue saliendo ACTIVE, aunque lleve dos años sin mover
 * un peso. Con la primera regla se trajeron diecinueve campañas de las cuales
 * una sola estaba viva, y quien lleva las redes lo notó de inmediato.
 *
 * El gasto no miente: si Meta cobró, la campaña corrió.
 *
 * Los otros dos cuidados, que son la mitad de esta función:
 *
 *   1. Si su id de Meta ya está enlazado en alguna campaña, NO se toca. Es lo
 *      que hace que sincronizar diez veces no deje diez copias.
 *   2. Si hay una capturada a mano con el mismo nombre y sin enlace, se le pone
 *      el enlace en vez de crear otra al lado. Es el caso de quien ya tenía
 *      "Bodas verano 2026" antes de conectar Meta.
 *
 * Lo que NO hace, también a propósito: no borra, no apaga y no renombra. El
 * estado y el nombre de una campaña del CRM son del hotel; si en Meta la pausan
 * o le cambian el nombre, aquí se queda como está, porque así la conoce la
 * gente que la trabaja.
 */
function traeCampanasDeMeta(lista, gastaron){
  const corrieron = gastaron instanceof Set ? gastaron : new Set();
  const activas = (lista || []).filter(c =>
    String(c.id || "").trim() && corrieron.has(String(c.id)));

  const enlazados = new Set();
  for (const c of state.campanas) for (const id of c.metaIds || []) enlazados.add(String(id));

  const porNombre = new Map();
  for (const c of state.campanas)
    if (!(c.metaIds || []).length) porNombre.set(mismoNombre(c.nombre), c);

  let nuevas = 0, enlazadas = 0, cortadas = 0;
  for (const m of activas){
    const id = String(m.id);
    if (enlazados.has(id)) continue;

    const ya = porNombre.get(mismoNombre(m.nombre));
    if (ya){
      ya.metaIds = [id];
      ya.updatedAt = new Date().toISOString();
      enlazados.add(id);
      porNombre.delete(mismoNombre(m.nombre));
      enlazadas++;
      continue;
    }

    if (nuevas >= TOPE_TRAER){ cortadas++; continue; }

    const c = saneaCampana({
      nombre: String(m.nombre || "").slice(0, 120) || "(sin nombre en Meta)",
      canal: "meta",
      estado: /^ACTIVE$/i.test(String(m.estado || "")) ? "activa" : "pausada",
      metaIds: [id],
      origen: "meta",
      responsable: miNombre(),
      notas: "Se trajo de Meta el " + fechaTexto(hoyISO()) + "."
    });
    c.createdAt = new Date().toISOString();
    state.campanas.push(c);
    enlazados.add(id);
    nuevas++;
  }

  if (nuevas || enlazadas) guardar();
  return { nuevas, enlazadas, cortadas, activas: activas.length };
}

/**
 * Trae al CRM los CONJUNTOS DE ANUNCIOS que de verdad corrieron.
 *
 * Es el nivel con el que trabaja el hotel. Una campaña de Meta puede mezclar
 * bodas y catering; en el CRM ésas son dos cosas distintas, con su propio
 * presupuesto y sus propios prospectos, y hasta que no se separan no se puede
 * decir cuál de las dos está dejando dinero.
 *
 * Misma regla que arriba —gastó, no "está activa"— y los mismos tres cuidados.
 *
 * La campaña padre NO se desenlaza. Se pensó y estaba mal: sus meses de
 * historia existen nada más a nivel de campaña, y desenlazarla los borraría de
 * la pantalla de un jalón. Lo que impide contar el mismo peso dos veces está
 * en metricasMeta, que le resta a cada campaña, día por día, lo que ya se está
 * enseñando en sus conjuntos.
 */
function traeConjuntosDeMeta(lista, gastaron){
  const corrieron = gastaron instanceof Set ? gastaron : new Set();
  const activos = (lista || []).filter(c =>
    String(c.id || "").trim() && corrieron.has(String(c.id)));

  const enlazados = new Set();
  for (const c of state.campanas) for (const id of c.metaIds || []) enlazados.add(String(id));

  const porNombre = new Map();
  for (const c of state.campanas)
    if (!(c.metaIds || []).length) porNombre.set(mismoNombre(c.nombre), c);

  let nuevas = 0, enlazadas = 0, cortadas = 0;
  for (const m of activos){
    const id = String(m.id);
    if (enlazados.has(id)) continue;

    const ya = porNombre.get(mismoNombre(m.nombre));
    if (ya){
      ya.metaIds = [id];
      ya.updatedAt = new Date().toISOString();
      enlazados.add(id);
      porNombre.delete(mismoNombre(m.nombre));
      enlazadas++;
      continue;
    }

    if (nuevas >= TOPE_TRAER){ cortadas++; continue; }

    const dePadre = nombreMeta(String(m.padre || ""));
    const c = saneaCampana({
      nombre: String(m.nombre || "").slice(0, 120) || "(sin nombre en Meta)",
      canal: "meta",
      estado: /^ACTIVE$/i.test(String(m.estado || "")) ? "activa" : "pausada",
      metaIds: [id],
      origen: "meta",
      responsable: miNombre(),
      notas: "Conjunto de anuncios" + (m.padre ? ' de la campaña «' + dePadre + '»' : "") +
             ". Se trajo de Meta el " + fechaTexto(hoyISO()) + "."
    });
    c.createdAt = new Date().toISOString();
    state.campanas.push(c);
    enlazados.add(id);
    nuevas++;
  }

  if (nuevas || enlazadas) guardar();
  return { nuevas, enlazadas, cortadas, activas: activos.length };
}

/**
 * Las campañas que trajo la sincronización y resultaron cascarón vacío.
 *
 * Son las que entraron con la regla vieja —la de "activa en Meta"— y nunca
 * tuvieron nada: ni gasto de Meta, ni gasto capturado, ni presupuesto, ni un
 * prospecto, ni un cliente. Borrarlas no pierde un solo dato, y si alguna vuelve
 * a correr se trae sola en la siguiente sincronización.
 *
 * Lo capturado por una persona NUNCA entra aquí, aunque esté igual de vacío: si
 * alguien se tomó la molestia de escribirlo, se queda.
 */
function campanasHuecasDeMeta(){
  /* "Sin movimiento" se juzga contra las cifras QUE ESTÁN CARGADAS, y ésas son
     las del periodo del tablero de marketing. Con un periodo corto, un conjunto
     que gastó el mes pasado se vería hueco y se ofrecería quitarlo. Con
     diecinueve campañas casi no se notaba; con ochenta y tantos conjuntos sería
     ofrecer borrar medio Meta. Así que no se ofrece nada hasta tener un año
     completo cargado. */
  const [d, h] = rangoMkt();
  const largo = (Date.parse(h) - Date.parse(d)) / 86400000;
  if (!(largo >= 300)) return [];
  const conGasto = new Set((metaMetricas || [])
    .filter(f => (Number(f.gasto) || 0) > 0).map(f => String(f.objeto)));
  return state.campanas.filter(c => {
    const laTrajoMeta = c.origen === "meta" || /^Se trajo de Meta/.test(String(c.notas || ""));
    if (!laTrajoMeta) return false;
    if (gastoCampana(c) || Number(c.presupuesto) || 0) return false;
    if ((c.metaIds || []).some(id => conGasto.has(String(id)))) return false;
    if (state.prospectos.some(p => p.campanaId === c.id)) return false;
    if (state.clientes.some(x => x.campanaId === c.id)) return false;
    return true;
  });
}

/**
 * Pide las cifras si todavía no se han pedido, y vuelve a pintar cuando lleguen.
 *
 * Se llama desde las dos pantallas que las enseñan. Se pregunta UNA vez: si el
 * servidor contestó vacío, vacío se queda hasta que alguien sincronice, en vez
 * de estar preguntando en cada dibujo.
 */
function cargaMeta(vuelveAPintar){
  if (metaMetricas !== null || !hayMeta() || metaPidiendo) return;
  const [d, h] = rangoMkt();
  metaPidiendo = pedirMeta(d, h).then(r => {
    metaPidiendo = null;
    metaMetricas = r || [];
    metaIndice = null;
    vuelveAPintar();
  });
}

/** Engancha el botón de la tira. Se llama desde cada pantalla que la pinta. */
function enganchaTiraMeta(cont, alTerminar){
  const b = cont.querySelector("#bMetaSync");
  if (!b) return;
  const limpia = cont.querySelector("#bMetaLimpia");
  if (limpia) limpia.onclick = () => {
    const fuera = campanasHuecasDeMeta();
    if (!fuera.length) return;
    if (!confirm(`Se van a quitar ${fuera.length} campaña(s) que entraron solas y nunca ` +
      "tuvieron gasto, presupuesto ni prospectos:\n\n" +
      fuera.slice(0, 12).map(c => "· " + c.nombre).join("\n") +
      (fuera.length > 12 ? `\n· …y ${fuera.length - 12} más` : "") +
      "\n\nSi alguna vuelve a correr en Meta, se trae sola en la siguiente " +
      "sincronización.\n\n¿Quitarlas?")) return;
    const ids = new Set(fuera.map(c => c.id));
    state.campanas = state.campanas.filter(c => !ids.has(c.id));
    guardar();
    if (alTerminar) alTerminar();
  };

  const cuantos = cont.querySelector("#metaDias");
  if (cuantos) cuantos.onchange = () => { metaDias = Number(cuantos.value) || 7; };

  b.onclick = async () => {
    const dicho = cont.querySelector("#metaDicho");
    if (cuantos) metaDias = Number(cuantos.value) || 7;
    b.disabled = true;
    const antes = b.textContent;
    b.textContent = "Trayendo…";
    try{
      const j = await llamaMeta({ accion: "sincroniza", dias: metaDias });
      const partes = [j.filas
        ? j.filas + " días de cifras, del " + j.desde + " al " + j.hasta
        : "Meta no reportó gasto en esos días"];

      /* Y de paso, las campañas que corrieron. Se pregunta aquí y no en cada
         dibujo de la pantalla: traer cosas a la cartera es una acción, y las
         acciones se hacen cuando alguien aprieta un botón.

         El orden importa: primero se leen las cifras que se acaban de guardar
         —ésas dicen QUIÉN GASTÓ en el periodo—, y hasta entonces se pide el
         catálogo, que nada más pone los nombres. Al revés se traería lo que
         Meta llama activo, que no es lo mismo que estar corriendo. */
      try{
        const recien = (await pedirMeta(j.desde, j.hasta)) || [];
        const gastaron = new Set(recien
          .filter(f => (Number(f.gasto) || 0) > 0)
          .map(f => String(f.objeto)));
        const cat = await llamaMeta({ accion: "catalogo" });
        /* Se traen los CONJUNTOS DE ANUNCIOS, no las campañas: es el nivel con
           el que trabaja el hotel. Si el servidor todavía es el viejo y no los
           manda, se cae de vuelta a las campañas en vez de no traer nada. */
        const r = (cat.conjuntos && cat.conjuntos.length)
          ? traeConjuntosDeMeta(cat.conjuntos, gastaron)
          : traeCampanasDeMeta(cat.campanas, gastaron);
        if (r.nuevas) partes.push(r.nuevas + (r.nuevas === 1
          ? " campaña nueva de Meta" : " campañas nuevas de Meta"));
        if (r.enlazadas) partes.push(r.enlazadas + (r.enlazadas === 1
          ? " ya capturada se enlazó" : " ya capturadas se enlazaron"));
        if (r.cortadas) partes.push("faltaron " + r.cortadas +
          ", que no caben de una vez; vuelva a sincronizar");
      }catch(e){
        /* Que no se puedan traer las campañas no invalida las cifras, que es
           lo que se vino a buscar. Se dice y ya. */
        partes.push("(no se pudo traer la lista de campañas: " + e.message + ")");
      }

      if (dicho) dicho.textContent = partes.join(" · ");
      metaMetricas = null;              // se vuelve a leer con lo recién bajado
      metaError = ""; metaFallo = "";
    }catch(e){
      /* Si falla, NO se toca una sola cifra de las que ya estaban: un cero se
         leería como "no gastamos" y lo viejo se lee como "esto es de antier",
         que es la verdad. */
      metaFallo = e.message;
    }finally{
      b.disabled = false; b.textContent = antes;
      if (alTerminar) alTerminar();
    }
  };
}

/* ==========================================================================
   EL TABLERO DE MARKETING

   Contesta tres preguntas, en este orden: cuántos llegaron, cuánto costó
   traerlos, y cuánto dejaron.

   Lo del dinero no sale de aquí. Marketing no alcanza la cartera —así lo
   decidió el hotel—, así que el ingreso lo suma el servidor y devuelve nada
   más el resultado: crm_ingresos_campana, en marketing.sql. Sin ese archivo
   corrido, el tablero enseña lo demás y dice por qué falta el dinero.
   ========================================================================== */

let mkDesde = "", mkHasta = "";
/* Lo que contestó el servidor la última vez. No va en state ni en el
   almacenamiento: son cuentas de otro, se piden cuando hacen falta. */
let mkIngresos = null, mkIngresosError = "";
/* La pregunta que ya va en camino. Dibujar el tablero dos veces seguidas
   —entrar y cambiar de pestaña— no tiene por qué preguntarle dos veces al
   servidor: la segunda se cuelga de la primera. */
let mkPidiendo = null;

const rangoMkt = () => {
  const a = new Date().getFullYear();
  return [mkDesde || `${a}-01-01`, mkHasta || `${a}-12-31`];
};

/** ¿Está montada la función que suma el dinero? */
const hayIngresos = () => nubeActiva() && !nube.sinIngresos;

/**
 * El ingreso por campaña, del servidor.
 *
 * Devuelve null mientras no se sepa. Un error no tumba el tablero: se anota y
 * el resto sigue, que es lo que de verdad usa marketing todos los días.
 */
async function pedirIngresos(){
  if (!hayIngresos()) return null;
  const [desde, hasta] = rangoMkt();
  try{
    const r = await api("/rest/v1/rpc/crm_ingresos_campana", {
      method:"POST",
      body: JSON.stringify({ p_desde: desde, p_hasta: hasta })
    });
    mkIngresosError = "";
    return Array.isArray(r) ? r : [];
  }catch(e){
    if (/crm_ingresos_campana|schema cache|PGRST202|does not exist|404/i.test(e.message)){
      nube.sinIngresos = true;
      mkIngresosError = "";
    } else {
      mkIngresosError = e.message;
    }
    return null;
  }
}

/**
 * ¿Esta persona tiene bajado ese tipo de documento?
 *
 * No es lo mismo que puedeVer(): esa pregunta se acota al departamento en el
 * que está parada, y administración metida en marketing no tiene enfrente la
 * pestaña de actividades aunque la bitácora sí le baje. Para el embudo manda
 * lo que alcanza su papel, no la pestaña donde anda.
 */
const alcanzaPorPapel = v => (VISTAS_ROL[rolActual()] || VISTAS_ROL.ejecutivo).includes(v);

/**
 * El embudo, de arriba abajo.
 *
 *   Lead      · todo el que dejó sus datos
 *   Contactado· ya tiene al menos una actividad registrada
 *   En cartera· alguien lo pasó a cliente
 *   Cerrado   · ese cliente firmó algo
 *
 * El último escalón necesita la cartera, así que para marketing sale del
 * resumen del servidor; para ventas y dirección, de lo que ya tienen bajado.
 */
function embudoMkt(){
  const [desde, hasta] = rangoMkt();
  const enRango = f => { const d = String(f || "").slice(0,10); return d >= desde && d <= hasta; };

  const leads = state.prospectos.filter(p => enRango(p.fecha));
  const ids = new Set(leads.map(p => p.clienteId).filter(Boolean));

  // "Contactado" se mide con la bitácora, que es la que dice si alguien hizo
  // algo. Marketing no la ve, así que para ellos el escalón no aplica y se
  // omite en vez de mentir con un cero.
  const conActividad = alcanzaPorPapel("actividades")
    ? leads.filter(p => p.clienteId &&
        state.actividades.some(a => a.clienteId === p.clienteId)).length
    : null;

  let cerrados = null;
  if (mkIngresos) cerrados = mkIngresos.reduce((a, r) => a + (Number(r.cierres) || 0), 0);
  else if (alcanzaPorPapel("contratos") || alcanzaPorPapel("eventos"))
    cerrados = state.clientes.filter(c => ids.has(c.id) && (
      state.contratos.some(k => k.clienteId === c.id && k.estado === "aceptado") ||
      state.eventos.some(e => e.clienteId === c.id && e.estado === "confirmado"))).length;

  return [
    { et:"Leads",      n:leads.length, ayuda:"Dejaron sus datos" },
    { et:"Contactados", n:conActividad, ayuda:"Ya tienen actividad registrada" },
    { et:"En cartera", n:ids.size,     ayuda:"Alguien los pasó a cliente" },
    { et:"Cerrados",   n:cerrados,     ayuda:"Firmaron convenio, contrato o evento" }
  ];
}

/** Lo que cada campaña costó y trajo, en un solo renglón por campaña. */
function filasMkt(){
  const [desde, hasta] = rangoMkt();
  /* El servidor contesta un renglón por campaña Y MES, y puede reservar el
     monto de un mes y no el de otro: un agosto recién empezado, con un solo
     cierre, no tiene por qué borrar el dinero de julio. Por eso se cuentan los
     meses reservados aparte: si son todos, la campaña sale con raya; si son
     algunos, sale lo que sí se puede y la cifra se marca como parcial. */
  const porCamp = new Map();
  for (const r of mkIngresos || []){
    const k = porCamp.get(r.campana_id) || { cierres:0, ingreso:0, meses:0, ocultos:0 };
    k.cierres += Number(r.cierres) || 0;
    k.meses++;
    if (r.suprimido) k.ocultos++;
    else k.ingreso += Number(r.ingreso) || 0;
    porCamp.set(r.campana_id, k);
  }

  return campanasVisibles().map(c => {
    const gasto = (c.gastos || [])
      .filter(g => g.mes >= desde.slice(0,7) && g.mes <= hasta.slice(0,7))
      .reduce((a, g) => a + (Number(g.monto) || 0), 0);
    const leads = state.prospectos.filter(p => p.campanaId === c.id &&
      String(p.fecha || "").slice(0,10) >= desde &&
      String(p.fecha || "").slice(0,10) <= hasta).length;
    const ing = porCamp.get(c.id) || null;
    const callado = !!(ing && ing.ocultos === ing.meses);
    return {
      c, gasto, leads,
      meta: metricasMeta(c, desde, hasta),
      cpl: (leads && gasto) ? gasto / leads : null,
      cierres: ing ? ing.cierres : null,
      ingreso: ing && !callado ? ing.ingreso : null,
      suprimido: callado,
      parcial: !!(ing && ing.ocultos && !callado),
      roas: (ing && !callado && gasto) ? ing.ingreso / gasto : null
    };
  });
}

/* ----- La carta-convenio ----- */

/**
 * De quién es un convenio.
 *
 * Manda lo que diga el propio convenio: a veces lo levanta un ejecutivo para
 * un cliente que atiende otro. Si no dice nada —los de antes no lo decían—,
 * es del dueño del cliente.
 */
const ejecutivoDe = v => String(v.ejecutivo || "").trim() ||
  String((cliente(v.clienteId) || {}).ejecutivo || "").trim();

const convenioEsMio = v => puedeVerTodo() ||
  (!!miNombre().trim() && ejecutivoDe(v).toLowerCase() === miNombre().trim().toLowerCase()) ||
  esMio(cliente(v.clienteId) || {});

/** Cuerpo de la carta-convenio. Se usa para verla, imprimirla y armar el PDF. */
function cuerpoConvenio(v, c){
  // En la página del cliente no hay cartera que consultar: el destinatario
  // viene congelado dentro del propio convenio.
  if (!(c && c.empresa) && v.destinatario) c = v.destinatario;
  const h = state.ajustes.hotel;
  const t = v.textos;
  const T = k => vars(t[k], v, c);

  /**
   * Lo que va debajo de la tabla de un bloque.
   *
   * Con desayunos escogidos en el convenio, la línea de desayuno sale de ahí.
   * Y si el texto del bloque —el de Ajustes— también habla de desayuno, se le
   * quita esa parte: el bloque Deluxe dice "Incluye desayuno americano" desde
   * siempre, y un convenio con Bariátrico escogido habría impreso las dos
   * cosas. Un documento que se contradice a sí mismo delante del cliente es
   * peor que no tener la función.
   *
   * Sin desayunos escogidos no cambia nada: el texto del bloque sale igual que
   * siempre.
   */
  const incluyeDelBloque = (g, gid, v) => {
    const suyos = (gid === "deluxe" && v.desayunos && v.desayunos.length) ? v.desayunos : null;
    const texto = String(g.incluye || "")
      .split("\n")
      .filter(l => !(suyos && /desayuno/i.test(l)))
      .join("\n").trim();
    return (texto ? `<div class="inc">${esc(texto)}</div>` : "") +
      (suyos ? `<div class="inc">Desayuno incluido: ${esc(listaDesayunos(suyos))}</div>` : "");
  };

  /* La tabla y su «incluye» se piden por separado porque en Recovery no van
     juntos: Marco los quiere DESPUÉS de las dos columnas de servicios. En
     Deluxe sí se piden pegados, como siempre. Los dos llevan la misma
     condición —que el convenio traiga habitaciones de ese bloque—, y por eso
     `incluyeDeGrupo` la repite: sin ella, las palomitas de Recovery saldrían
     en convenios que ni siquiera tienen tabla de Recovery. */
  const incluyeDeGrupo = gid => {
    if (!v.habitaciones.some(x => x.grupo === gid)) return "";
    return incluyeDelBloque(infoGrupo(gid, v), gid, v);
  };

  const tablaGrupo = (gid, conIncluye) => {
    const hs = v.habitaciones.filter(x => x.grupo === gid);
    if (!hs.length) return "";
    const g = infoGrupo(gid, v);
    return `<table class="tar"><thead><tr>
        <th>${esc(g.nombre)} / ${esc(h.nombre)}</th>
        <th class="num" style="width:150px">Tarifa pública</th>
        <th class="num" style="width:150px">Tarifa convenio</th></tr></thead>
      <tbody>${hs.map(x => `<tr>
        <td>${esc(x.nombre)}</td>
        <td class="num">${x.publica === null ? "N/A" : esc(moneyMN(x.publica))}</td>
        <td class="num"><b>${esc(moneyMN(x.convenio))}</b></td></tr>`).join("")}</tbody></table>
      ${conIncluye ? incluyeDelBloque(g, gid, v) : ""}`;
  };

  const bloqueFirma = (f, titulo, nombreDef, puestoDef, celDef) => `
    <div class="firma">
      <h4>${esc(titulo)}</h4>
      <div class="cv">${f ? `<img src="${f.img}" alt="Firma">` : `<span>Pendiente de firma</span>`}</div>
      <div class="lin">
        <i>Nombre</i> <u>${esc(f ? f.nombre : (nombreDef || ""))}</u><br>
        <i>Puesto</i> <u>${esc(f ? f.puesto : (puestoDef || ""))}</u><br>
        <i>Fecha</i> <u>${esc(f ? fechaFirma(f.fecha) : "")}</u><br>
        <i>Celular</i> <u>${esc(f ? f.celular : (celDef || ""))}</u>
      </div>
    </div>`;

  return `      <div class="doc-hotel">
        ${h.logo
          ? `<img class="doc-logo" src="${esc(h.logo)}" alt="${esc(h.nombre)}">`

const anioContrato = k => String(k.fecha || hoyISO()).slice(0, 4) ||
  String(new Date().getFullYear());

/** Mismo criterio que el del convenio, con su propia serie: CT-2026-001. */
function folioContrato(anio, excluirId){
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^CT-" + a + "-(\\d+)$", "i");
  const usados = new Set(state.contratos
    .filter(k => k.id !== excluirId)
    .map(k => String(k.folio || "").trim().toUpperCase()));
  let n = Math.max(0, ...state.contratos
    .filter(k => k.id !== excluirId)
    .map(k => Number((re.exec(String(k.folio || "").trim()) || [])[1]) || 0)) + 1;
  let f;
  do { f = `CT-${a}-${String(n++).padStart(3, "0")}`; } while (usados.has(f));
  return f;
}

const folioCtAutomatico = f => /^CT-\d{4}-\d+$/i.test(String(f || "").trim());

/* El año de un certificado es el de su vigencia, no el de hoy: uno que se
   emite en diciembre para el año que entra lleva el año que entra. */
const anioCertificado = c =>
  String(c.desde || c.hasta || c.createdAt || new Date().toISOString()).slice(0, 4);

/**
 * El siguiente folio de certificado CON LO QUE ESTE EQUIPO TIENE BAJADO.
 *
 * Es el camino de respaldo, el que se usa cuando el CRM trabaja suelto, sin
 * nube. Con nube el número lo reparte el contador del hotel y punto: aquí no
 * se adivina, porque adivinar es exactamente como se repitieron los folios en
 * el PowerPoint.
 */
function folioCertificado(anio, excluirId){
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^CE-" + a + "-(\\d+)$", "i");
  const usados = new Set(state.certificados
    .filter(c => c.id !== excluirId)
    .map(c => String(c.folio || "").trim().toUpperCase()));
  let n = Math.max(0, ...state.certificados
    .filter(c => c.id !== excluirId)
    .map(c => Number((re.exec(String(c.folio || "").trim()) || [])[1]) || 0)) + 1;
  let f;
  do { f = `CE-${a}-${String(n++).padStart(3, "0")}`; } while (usados.has(f));
  return f;
}

                 title="Otro documento del hotel tiene este mismo folio">repetido</span>` : ""}</td>

        </tr>`;
      }).join("")}</tbody></table>`;

    cont.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", ev => {
