   CAMPAÑAS
   ========================================================================== */

const campanasVisibles = () => state.campanas
  .slice()
  .sort((a, b) => String(b.desde || b.createdAt).localeCompare(String(a.desde || a.createdAt)));

const campana = id => state.campanas.find(c => c.id === id) || null;
const nombreCampana = id => (campana(id) || {}).nombre || "";

/** Los prospectos que trajo una campaña. Es el número que importa. */
const leadsDeCampana = id => state.prospectos.filter(p => p.campanaId === id).length;

/**
 * De qué campaña de Meta viene esta campaña del CRM, para su columna.
 *
 * Sale del catálogo cada vez que se pinta, no se guarda: en Meta renombran las
 * campañas cada temporada, y un nombre guardado aquí envejecería mal sin que
 * nadie se diera cuenta.
 */
function deQueCampana(c){
  const ids = (c.metaIds || []).map(String).filter(esConjunto);
  if (!ids.length) return "";
  const padres = [...new Set(ids.map(padreDe).filter(Boolean).map(nombreMeta))];
  return padres.join(" · ");
}

/**
 * ¿Esta campaña del CRM es una campaña de Meta a la que ya se le trajeron sus
 * conjuntos de anuncios?
 *
 * Ésas son las que estorban en la lista: en esta cuenta el presupuesto se
 * asigna POR CONJUNTO —cada uno trae su "diario, no compartido"—, así que el
 * renglón de la campaña no representa una decisión de nadie. Su gasto residual,
 * sus prospectos y su ingreso siguen contando en el tablero de marketing; lo
 * único que cambia es que no ocupan un renglón entre las cosas que sí se
 * manejan.
 *
 * Las dos condiciones importan. Sin la segunda, una campaña a la que todavía no
 * se le han traído los conjuntos desaparecería sin nada que la reemplace, y su
 * gasto se quedaría sin representar en ninguna parte.
 */
function laTapanSusConjuntos(c){
  const mios = (c.metaIds || []).map(String).filter(id => !esConjunto(id));
  if (!mios.length) return false;
  const padre = new Set(mios);
  for (const otra of state.campanas){
    if (otra === c) continue;
    for (const id of otra.metaIds || [])
      if (esConjunto(id) && padre.has(padreDe(String(id)))) return true;
  }
  return false;
}

/**
 * ¿Meta no le reporta un peso a esta campaña en el periodo?
 *
 * Si Meta no cobró, no corrió. Es la misma regla con la que ya se decide cuáles
 * traer, aplicada ahora a lo que se enseña: una campaña que sale con raya en
 * «Según Meta» está apagada, y ocupa un renglón entre las que sí se manejan.
 *
 * Dos límites, y los dos importan:
 *
 *   · SÓLO LO DE META. Una expo, un referido o algo capturado a mano no tienen
 *     por qué aparecer en Meta nunca, y esconderlas por eso sería absurdo.
 *   · SIN CIFRAS CARGADAS NO SE ESCONDE NADA. Mientras la consulta va en camino
 *     —o si el servidor no contestó— todo saldría con raya, y la pantalla se
 *     vaciaría entera por algo que no tiene que ver con las campañas.
 */
function sinGastoEnMeta(c, desde, hasta){
  const deMeta = (c.metaIds || []).length || c.origen === "meta";
  if (!deMeta) return false;
  if (!metaMetricas || !metaMetricas.length) return false;
  const m = metricasMeta(c, desde, hasta);
  return !m || !m.gasto;
}

/* Qué enseña la pantalla de Campañas. Arranca en los conjuntos, que es lo que
   se quiere ver de diario, y no se guarda a propósito: el logo CORE recarga, y
   al recargar conviene volver a lo de siempre. */
let verCampanas = "conjuntos";

function renderCampanas(){
  const cont = document.getElementById("tblCampanas");
  const todas = campanasVisibles();

  /* El filtro vive AQUÍ y no en campanasVisibles(), que la comparten esta
     pantalla, la de UTMs y el tablero de marketing. Si se escondieran allá,
     saldrían también de los totales —con su inversión, sus prospectos y su
     ingreso— y el costo por lead de arriba dejaría de cuadrar. Esta lista es
     para trabajar; el tablero es para las cuentas, y ahí no se esconde nada. */
  const [mDesde, mHasta] = rangoMkt();
  /* Se esconden dos cosas: las campañas de Meta que ya se desglosaron en sus
     conjuntos, y todo lo de Meta que no gastó en el periodo —que es lo mismo
     que decir que está apagado—. */
  const desglosadas = todas.filter(laTapanSusConjuntos);
  const apagadas = todas.filter(c =>
    !desglosadas.includes(c) && sinGastoEnMeta(c, mDesde, mHasta));
  const tapadas = desglosadas.concat(apagadas);
  const cs = verCampanas === "todas"
    ? todas : todas.filter(c => !tapadas.includes(c));
  const leadsTapados = tapadas.reduce((a, c) => a + leadsDeCampana(c.id), 0);

  const conMeta = cs.some(c => (c.metaIds || []).length);
  const conPadre = cs.some(c => deQueCampana(c));

  const cab = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <b style="font-size:15px">Campañas</b>
      <span class="hint">${cs.length} en total</span>
      ${tapadas.length ? `<label class="hint" for="verCamp">Ver</label>
        <select class="field" id="verCamp" style="width:auto;padding:4px 8px">
          <option value="conjuntos"${verCampanas === "conjuntos" ? " selected" : ""}>Conjuntos de anuncios</option>
          <option value="todas"${verCampanas === "todas" ? " selected" : ""}>Todas</option>
        </select>` : ""}
      <span style="flex:1"></span>
      <button class="btn primary" id="bNuevaCamp">+ Nueva campaña</button></div>
    ${tiraMeta()}
    ${(tapadas.length && verCampanas !== "todas") ? `<div class="note">
      <b>${tapadas.length === 1 ? "Hay una campaña escondida" :
           "Hay " + tapadas.length + " campañas escondidas"}:</b>
      ${[desglosadas.length ? (desglosadas.length === 1
           ? "una que ya se desglosó en sus conjuntos de anuncios"
           : desglosadas.length + " que ya se desglosaron en sus conjuntos de anuncios") : "",
         apagadas.length ? (apagadas.length === 1
           ? "una a la que Meta no le reporta gasto en este periodo"
           : apagadas.length + " a las que Meta no les reporta gasto en este periodo") : ""]
        .filter(Boolean).join(" y ")}.
      ${leadsTapados ? `<b>${tapadas.length === 1 ? "Trae" : "Traen"} ${leadsTapados}
        prospecto${leadsTapados === 1 ? "" : "s"}</b> —las ligas de los anuncios todavía
        apuntan a ${tapadas.length === 1 ? "ella" : "ellas"}—, y sigue${
          tapadas.length === 1 ? "" : "n"}` : (tapadas.length === 1 ? "Sigue" : "Siguen")}
      contando en el tablero de marketing.
      <button class="btn sm" id="bVerTapadas" style="margin-left:8px">Verlas</button></div>` : ""}
    <div class="note">Una campaña es lo que el hotel sale a hacer para que llegue gente.
      Lo que se mide es <b>cuánto costó y qué trajo</b>, así que de aquí cuelgan los
      prospectos: la liga que se genera en <i>Atribución &amp; UTMs</i> es la que los amarra.</div>`;

  if (!cs.length && tapadas.length){
    /* Todo quedó escondido. El vacío de siempre diría "todavía no hay
       campañas", que sería mentira y mandaría a capturar lo que ya existe. */
    cont.innerHTML = cab + `<div class="vacio">Ninguna campaña gastó en este periodo.<br>
      <span class="hint">Las ${tapadas.length} que hay están escondidas. Apriete
      <b>Sincronizar</b> para traer más días, o cambie <b>Ver</b> a <i>Todas</i>.</span></div>`;
  } else if (!cs.length){
    cont.innerHTML = cab + (hayMeta()
      ? `<div class="vacio">Todavía no hay campañas.<br>
          <span class="hint">Apriete <b>Sincronizar</b> y se traen solas las que Meta
          tenga activas, ya enlazadas. Las de otros canales —Google, una expo, un
          convenio con una agencia— se capturan con <b>+ Nueva campaña</b>.</span></div>`
      : `<div class="vacio">Todavía no hay campañas.</div>`);
  } else {
    cont.innerHTML = cab + `<table class="data">
      <thead><tr><th>Campaña</th>${conPadre
          ? `<th title="La campaña de Meta de la que cuelga este conjunto de anuncios">Campaña de Meta</th>`
          : ""}<th>Canal</th><th>Periodo</th>
        <th class="num">Presupuesto</th><th class="num">Gastado</th>
        ${conMeta ? `<th class="num" title="Lo que dice Meta en el mismo periodo">Según Meta</th>` : ""}
        <th class="num">Leads</th><th>Estado</th><th>Responsable</th></tr></thead>
      <tbody>${cs.map(c => {
        const ec = ESTADOS_CAMP[c.estado], gasto = gastoCampana(c);
        const sobre = c.presupuesto && gasto > c.presupuesto;
        return `<tr class="row-link" data-id="${c.id}">
          <td><b>${esc(c.nombre || "(sin nombre)")}</b>${c.objetivo
            ? `<div class="hint">${esc(c.objetivo)}</div>` : ""}</td>
          ${conPadre ? `<td>${deQueCampana(c)
            ? esc(deQueCampana(c)) : `<span class="hint">—</span>`}</td>` : ""}
          <td>${esc(infoCanal(c.canal).name)}</td>
          <td class="nowrap">${c.desde ? esc(fechaCorta(c.desde)) : "—"}${
            c.hasta ? " → " + esc(fechaCorta(c.hasta)) : ""}</td>
          <td class="num nowrap">${c.presupuesto ? esc(moneyMN(c.presupuesto)) : "—"}</td>
          <td class="num nowrap"${sobre ? ' style="color:var(--bad)"' : ""}>${
            gasto ? esc(moneyMN(gasto)) : "—"}${sobre ? " ⚠" : ""}</td>
          ${conMeta ? `<td class="num nowrap">${celdaMeta(c, gasto, mDesde, mHasta)}</td>` : ""}
          <td class="num">${leadsDeCampana(c.id) || "—"}</td>
          <td><span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span></td>
          <td class="nowrap">${esc(c.responsable || "—")}</td>
        </tr>`;
      }).join("")}</tbody></table>`;

    cont.querySelectorAll("tr[data-id]").forEach(tr =>
      tr.addEventListener("click", () => editarCampana(tr.dataset.id)));
  }

  const selVer = cont.querySelector("#verCamp");
  if (selVer) selVer.onchange = e => { verCampanas = e.target.value; renderCampanas(); };
  const bVer = cont.querySelector("#bVerTapadas");
  if (bVer) bVer.onclick = () => { verCampanas = "todas"; renderCampanas(); };

  enganchaTiraMeta(cont, () => renderCampanas());
  cargaMeta(() => { if (vista === "campanas") renderCampanas(); });
  cont.querySelector("#bNuevaCamp").onclick = () => editarCampana(null);
}

            <input class="field" id="mkObjetivo" value="${esc(c.objetivo)}"

          <b>manda siempre</b> y no se pisa, porque es lo que de verdad se pagó.</div>
        <div style="overflow:auto"><table class="data"><thead><tr>
          <th>Mes</th><th class="num">Monto</th><th>Nota</th><th></th></tr></thead>
          <tbody id="mkGastos">${(c.gastos.length ? c.gastos : []).map(filaGasto).join("")}</tbody></table></div>
        <p style="margin:8px 0 0"><button class="btn sm" id="bAddGasto">+ Agregar mes</button>
          <span class="hint" id="mkTotalGasto"></span></p>

        <h3 class="sec">Enlace con Meta</h3>
        <div class="note">Una campaña del hotel suele ser <b>dos o tres campañas de Meta</b>
          —prospección y remarketing—, así que se pueden enlazar varias: el gasto y las

        <div class="grid">

        <h3 class="sec">La liga para el anuncio</h3>
        <div class="note">Es la liga que se pega <b>en este anuncio</b>. Quien la abra llega al
          formulario del hotel, y el prospecto entra ya amarrado aquí: por eso cada conjunto
          necesita la suya, y no la de su campaña.</div>
        <div class="grid">
          <div class="full"><label class="lbl">utm_content
            <span class="hint">qué pieza (opcional, no se guarda)</span></label>

        </div>
        <div id="mkLiga" style="margin-top:8px"></div>

          <b>La liga todavía no está lista del lado del hotel.</b> Falta correr
          <code>prospectos.sql</code> una vez en Supabase. Mientras tanto se puede armar,
          pero quien la abra no va a poder mandar sus datos.</div>` : ""}

        <h3 class="sec">Notas</h3>

        <button class="btn primary" id="bOkCamp">Guardar</button></div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  const cuerpoGastos = q("#mkGastos");

  const sumaGastos = () => [...cuerpoGastos.querySelectorAll("tr[data-gasto]")]
    .reduce((a, tr) => a + (parseMoney(tr.querySelector(".g-monto").value) || 0), 0);
  const pintaTotal = () => {
    const t = sumaGastos(), pre = parseMoney(q("#mkPresupuesto").value) || 0;
    q("#mkTotalGasto").innerHTML = t
      ? `Gastado: <b>${esc(moneyMN(t))}</b>` + (pre
          ? ` de ${esc(moneyMN(pre))}` + (t > pre
              ? ` · <b style="color:var(--bad)">se pasó por ${esc(moneyMN(t - pre))}</b>` : "")
          : "")
      : "";
  };

    tr.querySelector("[data-quitag]").onclick = () => { tr.remove(); pintaTotal(); };
    tr.querySelector(".g-monto").addEventListener("input", pintaTotal);
  };
  cuerpoGastos.querySelectorAll("tr[data-gasto]").forEach(enganchaFila);

  q("#bAddGasto").onclick = () => {
    cuerpoGastos.insertAdjacentHTML("beforeend", filaGasto(saneaGasto({ mes: hoyISO().slice(0, 7) })));
    enganchaFila(cuerpoGastos.lastElementChild);
    pintaTotal();
  };
  q("#mkPresupuesto").addEventListener("input", pintaTotal);
  pintaTotal();

  /* ---- El enlace con Meta ----
     Se trabaja sobre una copia: si la persona cancela el formulario, la
     campaña se queda como estaba. */
  let metaIds = (c.metaIds || []).slice();
  const cajaMeta = q("#mkMetaLista");
  const dichoMeta = q("#mkMetaDicho");

  const pintaEnlace = () => {
    if (!metaIds.length){
      cajaMeta.innerHTML = `<span class="hint">Todavía no está enlazada.
        Sin enlace, el gasto de esta campaña sale sólo de lo capturado a mano.</span>`;
      return;
    }
    cajaMeta.innerHTML = metaIds.map(id => `<span class="estado-chip"
      style="background:var(--col);color:var(--text);margin:0 6px 6px 0;display:inline-block">
      ${esc(nombreMeta(id))} <span class="hint">${esc(id)}</span>
      <a href="#" data-quitameta="${esc(id)}" style="margin-left:6px">✕</a></span>`).join("");
    cajaMeta.querySelectorAll("[data-quitameta]").forEach(a => a.onclick = ev => {
      ev.preventDefault();
      metaIds = metaIds.filter(x => x !== a.dataset.quitameta);
      pintaEnlace();
    });
  };
  pintaEnlace();

  q("#bMetaEscoger").onclick = async () => {
    const b = q("#bMetaEscoger");
    b.disabled = true; dichoMeta.textContent = "Preguntándole a Meta…";
    let lista = [];
    try{
      const j = await llamaMeta({ accion: "catalogo" });
      lista = (j.campanas || []).map(x => Object.assign({ nivel: "campana" }, x))
        .concat((j.conjuntos || []).map(x => Object.assign({ nivel: "conjunto" }, x)));
      dichoMeta.textContent = "";
    }catch(e){
      /* Si no se puede preguntar en este momento, se ofrece lo que ya se
         conocía de la última vez: es mejor que dejar a la persona sin poder
         enlazar nada. */
      lista = metaObjetos.map(o => ({ id: o.objeto, nombre: o.nombre, estado: o.estado,
                                      nivel: o.nivel, padre: o.padre }));
      dichoMeta.textContent = lista.length
        ? "No se pudo preguntar ahorita; ésta es la lista de la última vez."
        : e.message;
    }finally{ b.disabled = false; }

    if (!lista.length){ pintaEnlace(); return; }

    /* Separados por nivel, y los conjuntos con el nombre de su campaña
       debajo. Revueltos no se entiende nada: en Meta los dos se llaman igual
       de feo y no hay manera de distinguir uno del otro de un vistazo. */
    const opcion = x => `<label style="display:block;padding:3px 0">
        <input type="checkbox" value="${esc(x.id)}"${metaIds.includes(String(x.id)) ? " checked" : ""}>
        ${esc(x.nombre || "(sin nombre)")}
        <span class="hint">${esc(x.estado || "")} · ${esc(x.id)}${
          x.padre ? " · de " + esc(nombreMeta(String(x.padre))) : ""}</span></label>`;
    const camps = lista.filter(x => x.nivel !== "conjunto");
    const conjs = lista.filter(x => x.nivel === "conjunto");

    cajaMeta.innerHTML = `<div class="note" style="margin:0 0 8px">Enlace una campaña
        <b>o</b> sus conjuntos de anuncios, no las dos cosas: el gasto de los conjuntos ya
        viene dentro del de su campaña, y contarlo dos veces descuadra el costo por lead.</div>
      <div style="max-height:230px;overflow:auto;border:1px solid var(--line);
        border-radius:8px;padding:8px">
      ${camps.length ? `<div class="hint" style="font-weight:700;margin:2px 0 4px">
        Campañas de Meta</div>${camps.map(opcion).join("")}` : ""}
      ${conjs.length ? `<div class="hint" style="font-weight:700;margin:10px 0 4px">
        Conjuntos de anuncios</div>${conjs.map(opcion).join("")}` : ""}
    </div>
    <p style="margin:8px 0 0"><button class="btn sm primary" id="bMetaListo">Listo</button></p>`;
    cajaMeta.querySelector("#bMetaListo").onclick = () => {
      metaIds = [...cajaMeta.querySelectorAll("input:checked")].map(i => i.value);
      pintaEnlace();
    };
  };

  /* ---- La liga del anuncio ----
     Vive aquí, en la carta de la campaña, y no en una pantalla aparte: la liga
     es DE esta campaña, y con los conjuntos de anuncios cada renglón necesita
     la suya. Tenerla al lado del nombre es lo que hace evidente que la de la
     campaña vieja no sirve para un conjunto. */
  const pintaLiga = () => {
    const caja = q("#mkLiga");
    if (!caja) return;
    const k = infoCanal(q("#mkCanal").value);
    const nombre = q("#mkNombre").value.trim() || c.nombre;
    const utm = {
      source:   q("#mkSource").value.trim()   || k.utm,
      medium:   q("#mkMedium").value.trim()   || k.medio,
      campaign: q("#mkCampaign").value.trim() || etiquetaUtm({ nombre }),
      content:  q("#mkContent").value.trim()
    };
    const liga = ligaDeAlta(utm);
    const sitio = String(state.ajustes.hotel.sitio || "").trim();
    const alSitio = sitio ? armaLiga(sitio, utm) : "";

    /* Una liga que se ve bien y no sirve es peor que ninguna: se pega en el
       anuncio, se paga el anuncio, y los prospectos simplemente no llegan. */
    const sinClave = !claveAltaPublicada()
      ? `<div class="note warn" id="utmSinClave" style="margin-top:10px">
           <b>${liga ? "Esta liga todavía no sirve." : "Todavía no se puede armar la liga."}</b>
           La clave que la abre no ha llegado al servidor, así que quien la abra no va a
           poder registrarse.
           ${esAdmin()
             ? `<br><br><button class="btn sm primary" id="bPublicarClave">Publicarla ahora</button>`
             : `<br><br>Pídele al administrador que entre al CRM y abra la carta de cualquier
                campaña: la clave se publica desde su cuenta, una sola vez, y a partir de ahí
                todas las ligas funcionan —ésta y las que armes después—.`}
         </div>`
      : "";

    caja.innerHTML = (liga
      ? `<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
           <textarea class="field mono" id="utmLiga" readonly rows="2"
             style="flex:1;min-width:260px">${esc(liga)}</textarea>
           <button class="btn primary" id="bCopiarUtm">Copiar</button></div>
         <div class="hint" id="utmAviso" style="margin-top:6px"></div>`
      : "") + sinClave +
      (alSitio
        ? `<p class="hint" style="margin:12px 0 4px">O la que lleva a la página del hotel
             —para que la campaña se amarre, esa página tiene que mandar a la gente a la liga
             de arriba <b>conservando las etiquetas</b>—:</p>
           <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
             <textarea class="field mono" id="utmLigaSitio" readonly rows="2"
               style="flex:1;min-width:260px">${esc(alSitio)}</textarea>
             <button class="btn" id="bCopiarSitio">Copiar</button></div>`
        : `<p class="hint" style="margin:12px 0 0">Si el anuncio lleva a la página del hotel en
             vez de al formulario, escríbela en <i>Ajustes → Datos del hotel</i> y aquí sale
             también esa liga, con sus etiquetas.</p>`);

    const pub = q("#bPublicarClave");
    if (pub) pub.onclick = async () => {
      pub.disabled = true; pub.textContent = "Publicando…";
      try{ await sincronizar(); }catch(e){}
      await clavePublicada(tokenAlta());
      pintaLiga();
    };

    /* Si salió el cartel, se le pregunta al servidor y se vuelve a pintar:
       recién recargada la página no se sabe nada, y el cartel aparecería con
       la clave perfectamente publicada. Si resulta que sí está, el segundo
       pintado ya no entra aquí —la respuesta queda guardada—. */
    if (sinClave) clavePublicada(tokenAlta()).then(hay => { if (hay) pintaLiga(); });

    const copiar = (boton, texto, area) => {
      const b = q(boton);
      if (!b) return;
      b.onclick = async () => {
        try{
          await navigator.clipboard.writeText(texto);
          if (q("#utmAviso")) q("#utmAviso").textContent = "Copiada. Ya se puede pegar en el anuncio.";
        }catch(e){
          // Sin permiso de portapapeles: se selecciona para que la copien a mano.
          if (q(area)) q(area).select();
          if (q("#utmAviso")) q("#utmAviso").textContent = "Quedó seleccionada: cópiala con Ctrl+C.";
        }
      };
    };
    copiar("#bCopiarUtm", liga, "#utmLiga");
    copiar("#bCopiarSitio", alSitio, "#utmLigaSitio");
  };

  ["#mkSource","#mkMedium","#mkCampaign","#mkContent","#mkNombre"]
    .forEach(sel => { const el = q(sel); if (el) el.addEventListener("input", pintaLiga); });

  // Los marcadores de posición siguen al canal, para que se vea qué va a salir.
  q("#mkCanal").addEventListener("change", () => {
    const k = infoCanal(q("#mkCanal").value);
    q("#mkSource").placeholder = k.utm;
    q("#mkMedium").placeholder = k.medio;
    pintaLiga();
  });

  pintaLiga();

  if (existente) q("#bDelCamp").onclick = () => {
    const n = leadsDeCampana(c.id);
    if (!confirm(`¿Eliminar la campaña "${c.nombre}"?` +
      (n ? `\n\nLos ${n} prospecto(s) que trajo se quedan, pero pierden de qué campaña vinieron.` : "") +
      "\n\nEsta acción no se puede deshacer.")) return;
    state.campanas = state.campanas.filter(x => x.id !== c.id);
    for (const p of state.prospectos) if (p.campanaId === c.id) p.campanaId = "";
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  q("#bOkCamp").onclick = () => {
    const nombre = q("#mkNombre").value.trim();
    if (!nombre){
      q("#campErr").innerHTML = `<div class="errbox">La campaña necesita un nombre.</div>`;
      q("#mkNombre").focus();
      return;
    }
    const desde = q("#mkDesde").value, hasta = q("#mkHasta").value;
    if (desde && hasta && hasta < desde){
      q("#campErr").innerHTML = `<div class="errbox">La fecha "hasta" no puede ser anterior a "desde".</div>`;
      return;
    }

    Object.assign(c, {
      nombre,
      canal: q("#mkCanal").value,
      estado: q("#mkEstado").value,
      objetivo: q("#mkObjetivo").value.trim(),
      desde, hasta,
      presupuesto: parseMoney(q("#mkPresupuesto").value) || 0,
      responsable: q('[name="mkResp"]').value.trim(),
      notas: q("#mkNotas").value.trim(),
      utmSource: q("#mkSource").value.trim(),
      utmMedium: q("#mkMedium").value.trim(),
      utmCampaign: q("#mkCampaign").value.trim(),
      metaIds,
      gastos: [...cuerpoGastos.querySelectorAll("tr[data-gasto]")].map(tr => saneaGasto({
        mes: tr.querySelector(".g-mes").value,
        monto: parseMoney(tr.querySelector(".g-monto").value) || 0,
        nota: tr.querySelector(".g-nota").value
      })).filter(g => g.mes),
      updatedAt: new Date().toISOString()
    });
    if (!existente){ c.createdAt = new Date().toISOString(); state.campanas.push(c); }
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };
}


/* ==========================================================================
   ATRIBUCIÓN & UTMs

   Una UTM es una etiqueta que viaja pegada a la liga de un anuncio. Cuando
   alguien la abre, la página sabe de dónde vino, y de ahí sale a qué campaña
   se le apunta el lead.

   Todo el chiste es que se escriban IGUAL siempre. "Facebook", "facebook" y
   "FB" son tres canales distintos para cualquier reporte, y ahí se acaba la
   medición. Por eso aquí no se escriben a mano: se arman.
   ========================================================================== */


/** Junta la liga con sus etiquetas, sin dejar parámetros vacíos. */
function armaLiga(base, utm){
  const limpio = String(base || "").trim();
  if (!limpio) return "";
  const pares = Object.entries(utm)
    .filter(([, v]) => String(v || "").trim())
    .map(([k, v]) => `utm_${k}=${encodeURIComponent(String(v).trim())}`);
  if (!pares.length) return limpio;
  return limpio + (limpio.includes("?") ? "&" : "?") + pares.join("&");
}

/* ==========================================================================
   LA LIGA PÚBLICA DE REGISTRO

   Quien vio un anuncio abre esta liga y deja sus datos. No tiene cuenta ni
   tiene por qué tenerla, así que esta pantalla no es el CRM: es un formulario
   con el membrete del hotel y nada más.

   Lo que deja cae en un buzón —prospectos.sql— del que el CRM lo recoge. El
   visitante no lee nada: ni la cartera, ni el buzón, ni siquiera lo que él
   mismo acaba de escribir.

   La campaña viaja en la propia dirección, en las etiquetas utm_. Por eso la
   liga se arma desde Atribución & UTMs y no se escribe a mano.
   ========================================================================== */

/* ==========================================================================
   LA LIGA DE LAS ÓRDENES DE TRABAJO

   Una sola y fija, que marketing le reparte a los jefes de área. Quien la abre
   no entra al CRM: escoge la hoja, la llena, adjunta lo que haga falta, firma
   con el dedo y termina.

   Es una clave PROPIA, no la de la liga del lobby: esa va pegada en los
   anuncios de Facebook y la ve cualquiera, y no tiene por qué servir para
   levantar órdenes de trabajo. Dos públicos, dos claves, y revocar una no
   tumba la otra.
   ========================================================================== */

/**
 * La dirección del servidor, metida en la liga.
 *
 * Quien abre la liga del lobby o la de las órdenes está en SU teléfono, donde
 * el CRM nunca se ha abierto: no tiene guardada la dirección del proyecto ni
 * la llave pública, y sin eso no hay a quién preguntarle nada —ni la lista de
 * departamentos, ni a dónde mandar lo que llenó—.
 *
 * La liga de firma siempre lo llevó dentro (ver ligaFirma, el `u` y el `k`).
 * Estas dos no, y por eso sólo servían en un equipo que ya tuviera el CRM
 * configurado. Ahora las tres hacen lo mismo.
 *
 * La llave que viaja es la `anon`, la pública, la misma que ya va en la liga
 * de firma y en cualquier página que use Supabase desde el navegador: por sí
 * sola no alcanza ni un renglón, porque quien manda son las reglas del
 * servidor. La de service_role no sale de Supabase nunca.
 */
const servidorEnLiga = () =>
  (nube.url && nube.anon) ? "&s=" + b64url(JSON.stringify({ u:nube.url, k:nube.anon })) : "";

/** Lo contrario: sacarlo de la dirección al abrirla. */
function servidorDeLaLiga(){
  const m = String(location.hash || "").match(/[#&]s=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try{
    const c = JSON.parse(deB64url(m[1]));
    const url = normalizaUrlNube(c && c.u), anon = String((c && c.k) || "").trim();
    return (url && anon) ? { url, anon } : null;
  }catch(e){ return null; }
}

/**
 * Deja puesta la dirección que venía en la liga, si este equipo no tenía una.
 *
 * NO se guarda en el navegador: quien llena el formulario no es del equipo, y
 * dejarle la configuración del hotel guardada sería tratarlo como si lo fuera.
 * Dura lo que dure la pestaña abierta, que es lo que hace falta.
 *
 * Si el equipo YA tenía servidor, gana el suyo: es alguien del hotel abriendo
 * su propia liga, y cambiárselo por lo que trajera una dirección pegada sería
 * dejar que una liga vieja le mueva a dónde se conecta.
 */
function usarServidorDeLaLiga(){
  if (nube.url && nube.anon) return;
  const c = servidorDeLaLiga();
  if (!c) return;
  nube.url = c.url;
  nube.anon = c.anon;
}

/** ¿La dirección trae la liga de las órdenes? */
function enlaceDeOdt(){
  const m = String(location.hash || "").match(/[#&]odt=([A-Za-z0-9_-]+)/);
  return m ? { token: m[1] } : null;
}

/**
 * La clave de la liga. La inventa el administrador y nadie más.
 *
 * Por lo mismo que la de altas: la clave vive en los ajustes, y con roles.sql
 * corrido los ajustes sólo los escribe el administrador. Si la inventara
 * marketing se quedaría en esa computadora, el servidor nunca la conocería, y
 * la liga repartida rebotaría a todos los jefes de área.
 */
function tokenOdt(){
  const h = state.ajustes.hotel;
  if (!h.tokenOdt && (!nubeActiva() || esAdmin())){
    h.tokenOdt = nuevoToken();
    guardar();
  }
  return h.tokenOdt || "";
}

/* ----- ¿Una clave pública ya llegó al servidor? -------------------------
   Las ligas que se reparten —la de las ODTs y la de registro de campañas—
   se abren con una clave que vive en el renglón de ajustes. Si ese renglón
   no está en el servidor, la liga rebota, así que antes de repartirla hay
   que estar seguro.

   Lo que había preguntaba por `sincronizado`, un mapa EN MEMORIA que se
   vacía en cada recarga; y a quien no es administrador podía no llenársele
   nunca, porque los ajustes no los sube —son SOLO_ADMIN—. O sea que el
   botón podía negarse para siempre con la clave perfectamente publicada, y
   justo a quien usa esa liga: marketing.

   Ahora se le pregunta al servidor, que es el único que lo sabe de verdad.
   Una clave publicada no se despublica sola, así que basta una vez por
   sesión.
   ------------------------------------------------------------------------ */
const clavesEnElServidor = new Set();

async function clavePublicada(token){
  const t = String(token || "").trim();
  if (!t) return false;
  if (!nubeActiva()) return true;      // sin nube no hay liga pública que valga
  if (clavesEnElServidor.has(t)) return true;
  try{
    const filas = await api("/rest/v1/crm_datos?id=eq." +
      encodeURIComponent("ajustes:global") + "&select=id,datos");
    /* Se busca el renglón por su id en vez de dar por hecho que viene solo:
       el filtro lo pone el servidor, y confiar en la posición es confiar en
       que nadie cambie nunca la consulta. */
    const fila = (filas || []).find(f => f.id === "ajustes:global");
    const hay = !!fila && JSON.stringify(fila.datos || {}).includes(t);
    if (hay) clavesEnElServidor.add(t);
    return hay;
  }catch(e){ return false; }
}

/** Lo que ya se sabe sin preguntar, para pintar sin esperar al servidor. */
const claveYaConfirmada = t =>
  !!t && (clavesEnElServidor.has(t) ||
          String(sincronizado.get("ajustes:global") || "").includes(t));


const ligaDeOdt = () => {
  const t = tokenOdt();
  return t ? location.origin + location.pathname + "#odt=" + t + servidorEnLiga() : "";
};

/* Hasta tres archivos de referencia, de 5 MB cada uno. El tope es del lado del
   servidor también —un check en la tabla—, porque el navegador se puede
   saltar: quien conozca la clave puede mandar lo que quiera con curl.

   Éstos viajan DENTRO del renglón del buzón, no por el almacén, porque el
   visitante no tiene permiso de escribir ahí. Por eso su tope no depende del
   plan de Supabase sino de lo que es razonable meter en una sola petición. */
const MAX_ADJUNTO_ODT = 5 * 1024 * 1024;
const MAX_ADJUNTOS_ODT = 3;

/* Lo que entrega marketing SÍ va al almacén, y ahí el tope lo pone el plan.
   En el gratuito ningún archivo pasa de 50 MB y un video no cabía; con el Pro
   caben cientos de GB. 200 MB es un punto intermedio a propósito: alcanza de
   sobra para un spot en buena calidad y evita que alguien suba por error el
   archivo de edición de 4 GB. Tiene que coincidir con el file_size_limit del
   balde en odts.sql, y ninguno de los dos puede pasar el tope global que hay
   en Storage → Settings del proyecto. */
const MAX_ENTREGA_ODT = 200 * 1024 * 1024;

/**
 * Deja la orden en el buzón.
 *
 * Con return=minimal, igual que las altas: el visitante no tiene permiso de
 * LEER la tabla, y si la petición pidiera de vuelta el renglón, el servidor la
 * rechazaría entera aunque la orden estuviera bien.
 */
async function depositarOdt(token, tipo, datos, firma, adjuntos){
  const r = await fetch(nube.url + "/rest/v1/crm_odts", {
    method: "POST",
    headers: { apikey: nube.anon, "Content-Type": "application/json",
               "Prefer": "return=minimal" },
    body: JSON.stringify({ token, tipo, datos, firma, adjuntos, aplicada: false })
  });
  if (!r.ok){
    const detalle = await r.text().catch(() => "");
    // La clave mala va PRIMERO: el aviso de que la regla lo rechazó nombra la
    // tabla, así que preguntar antes por la tabla haría que una clave inventada
    // se reportara como "falta montarlo" y nadie entendería nada.
    if (/row-level security/i.test(detalle))
      throw new Error("Esta liga ya no está vigente. Pídele una nueva a marketing.");
    if (/crm_odts_cabe|check constraint/i.test(detalle))
      throw new Error("Los archivos pesan de más para mandarlos juntos. Quita alguno.");
    if (/schema cache|PGRST205|does not exist/i.test(detalle))
      throw new Error("La liga todavía no está lista del lado del hotel.");
    throw new Error(detalle || ("Error " + r.status));
  }
}

/**
 * Una opción que se prende: una píldora que se pinta al escogerla.
 *
 * La casilla de verdad va dentro, escondida por CSS: así el teclado y el
 * navegador siguen haciendo su trabajo y lo único que cambia es cómo se ve.
 * Ver la clase .opciones en la hoja de estilos.
 *
 * Nació para la hoja audiovisual de las ODTs y ahora la usan también los
 * desayunos del convenio; por eso ya no se llama opcionOdt.
 */
const pildora = (dentro, texto) =>
  `<label>${dentro}<span><i class="tic">✓</i>${esc(texto)}</span></label>`;

/**
 * Baja la lista de departamentos con su jefe, para el desplegable.
 *
 * Esto NO se puede sacar del estado, aunque el administrador la edite en
 * Ajustes: esta pantalla corre en el teléfono de alguien que nunca ha entrado
 * al CRM, así que su `state` trae nada más los valores compilados en este
 * archivo. Por eso hay un RPC —el único de todo el proyecto que se puede
 * llamar sin cuenta— que la entrega a cambio de la clave de la liga. Ver el
 * punto 2b de odts.sql, donde está explicado por qué no abre nada.
 *
 * Si no contesta, devuelve lista vacía y el formulario vuelve a la caja de
 * texto de siempre: que el hotel no haya corrido el archivo todavía no puede
 * dejar a un jefe de área sin poder pedir nada.
 *
 * Pero SÍ dice por qué. Caerse callado a la caja de texto deja a quien la abre
 * pensando que así es el formulario, y a marketing sin enterarse de que falta
 * un paso del montaje. Por eso devuelve también el motivo, y el formulario lo
 * enseña en un renglón chico.
 */
async function jefesDeLaLiga(token){
  /* Se mira la dirección y la llave pública, NO nubeActiva(): ésa exige sesión
     y quien abre la liga nunca tiene una. Es la misma pareja de datos con la
     que depositarOdt manda la orden. */
  if (!nube.url || !nube.anon) return { lista:[], motivo:"sin-nube" };
  try{
    const r = await fetch(nube.url + "/rest/v1/rpc/crm_odt_jefes", {
      method: "POST",
      headers: { apikey: nube.anon, "Content-Type": "application/json",
                 "Accept": "application/json" },
      body: JSON.stringify({ p_token: token })
    });
    if (!r.ok){
      const detalle = await r.text().catch(() => "");
      /* Que la función no exista y que el servidor esté de malas son dos cosas
         distintas: la primera la arregla el hotel corriendo odts.sql, la
         segunda se arregla sola. Decirlas iguales manda a alguien a correr un
         archivo que ya corrió. */
      return { lista:[], motivo: /PGRST202|PGRST205|not find the function|does not exist|404/i
                 .test(detalle + " " + r.status) ? "sin-funcion" : "sin-respuesta" };
    }
    const crudo = await r.json();
    const lista = saneaJefes(Array.isArray(crudo) ? crudo : []);
    return { lista, motivo: lista.length ? "" : "sin-lista" };
  }catch(e){ return { lista:[], motivo:"sin-respuesta" }; }
}

/**
 * Por qué no salió la lista de departamentos.
 *
 * Se le dice a quien está llenando la hoja, no a un técnico: él no puede
 * arreglarlo y no tiene por qué saber qué es un RPC. Lo que sí necesita es
 * saber que escribirlo a mano está bien y que no es culpa suya. El dato de
 * qué falta va entre paréntesis, para que cuando le reenvíe la captura a
 * marketing, marketing sepa qué hacer.
 */
const AVISO_SIN_JEFES = {
  "sin-funcion":   "Escribe tu departamento y tu nombre a mano: el hotel todavía no " +
                   "termina de montar la lista (falta correr odts.sql en Supabase).",
  "sin-lista":     "Escribe tu departamento y tu nombre a mano: la lista del hotel todavía " +
                   "no ha subido al servidor (marketing tiene que sincronizar).",
  "sin-respuesta": "Escribe tu departamento y tu nombre a mano: no se pudo consultar la " +
                   "lista del hotel en este momento.",
  /* Sin servidor NO es "no pasa nada": es que la liga llegó cortada. Pasa
     cuando alguien la reenvía y el mensajero se come la mitad de la dirección,
     que es justo lo que les quitamos de encima al meter el servidor dentro. */
  "sin-nube":      "Escribe tu departamento y tu nombre a mano: esta liga llegó incompleta. " +
                   "Pídele a marketing que te la vuelva a mandar."
};

/** Los campos de cada hoja, en el orden en que están impresos. */
function camposOdt(tipo, jefes, motivo){
  /* Con la lista abajo, el departamento se escoge y el nombre sale solo: se
     acaban «A y B», «AYB» y «Alimentos y bebidas» como tres departamentos, y
     se acaba el nombre inventado por descuido. Sin la lista —el hotel no ha
     corrido odts.sql, o el servidor no contestó— se teclea como antes, que es
     peor pero funciona. */
  const comun1 = (jefes && jefes.length ? `
    <div><label class="lbl">Tu departamento *</label>
      <select class="field" id="odDepto" style="width:100%">
        <option value="">— Escoge —</option>
        ${jefes.map(j => `<option value="${esc(j.depto)}">${esc(j.depto)}</option>`).join("")}
      </select></div>
    <div><label class="lbl">Quién firma</label>
      <div class="field" id="odQuien" data-fijo="1"
        style="width:100%;display:flex;align-items:center;min-height:38px;color:var(--muted)"
        >Escoge tu departamento</div>
      <p class="hint" style="margin:4px 0 0">Lo pone el hotel. Si no es quien debería firmar,
        avísale a marketing.</p></div>` : `
    <div><label class="lbl">Tu departamento *</label>
      <input class="field" id="odDepto" style="width:100%" autocomplete="organization"></div>
    <div><label class="lbl">Tu nombre *</label>
      <input class="field" id="odQuien" style="width:100%" autocomplete="name"></div>
    ${AVISO_SIN_JEFES[motivo]
      ? `<p class="hint full" id="odSinLista" style="margin:-4px 0 0">${
           esc(AVISO_SIN_JEFES[motivo])}</p>` : ""}`) + `
    <div class="full"><label class="lbl">Tu correo *</label>
      <input class="field" id="odMail" type="email" style="width:100%" autocomplete="email"></div>
    <div class="full"><label class="lbl">¿Para qué es? *</label>
      <textarea class="field" id="odObj" rows="2" style="width:100%"
        placeholder="Qué quieres lograr con esta pieza"></textarea></div>`;

  const propios = tipo === "audiovisual" ? `
    <div><label class="lbl">Duración</label>
      <input class="field" id="odDur" style="width:100%" placeholder="30 segundos"></div>
    <div><label class="lbl">¿Qué se produce?</label>

/**
 * La pantalla que ve el jefe de área que abre la liga.
 *
 * Primero escoge la hoja, porque las dos preguntan cosas distintas y enseñarle
 * las dos juntas sería pedirle que ignore la mitad.
 */
function pantallaOdtPublica(datos){
  document.documentElement.classList.add("modo-firma");
  document.documentElement.classList.remove("intro-activa");
  for (const el of [document.documentElement, document.body]){
    el.style.setProperty("height", "auto", "important");
    el.style.setProperty("min-height", "100%", "important");
    el.style.setProperty("max-height", "none", "important");
    el.style.setProperty("overflow", "visible", "important");
    el.style.setProperty("display", "block", "important");
    el.style.setProperty("position", "static", "important");
  }
  document.body.innerHTML = `<div id="firmaCliente"></div>`;
  const caja = document.getElementById("firmaCliente");

  /* La lista de departamentos se pide UNA vez, mientras la persona todavía
     está escogiendo qué hoja quiere. Para cuando pica una, ya llegó, y nadie
     vio una pantalla esperando. Si no llega, `jefes` se queda vacío y el
     formulario sale con la caja de texto de siempre. */
  let jefes = [], porQueNo = "";
  const bajando = jefesDeLaLiga(datos.token)
    .then(r => { jefes = r.lista; porQueNo = r.motivo; });

  const escoger = () => {
    caja.innerHTML = `
      <div class="note"><b>Solicitud a marketing.</b> Escoge qué necesitas. No hace falta
        instalar nada ni crear ninguna cuenta.</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px">
        ${TIPOS_ODT.map(t => `
          <button class="btn" data-tipo="${t.id}"
            style="flex:1;min-width:220px;padding:20px;text-align:left;font-size:15px">
            <div style="font-size:28px">${t.icono}</div>
            <b>${esc(t.name)}</b>
            <div class="hint" style="margin-top:4px">${esc(t.sub)}</div>
          </button>`).join("")}
      </div>`;
    caja.querySelectorAll("[data-tipo]").forEach(b =>
      b.onclick = () => llenar(b.dataset.tipo));
  };

  const llenar = async tipo => {
    const t = infoTipoOdt(tipo);
    await bajando;                 // ya llegó, o ya se supo que no va a llegar
    caja.innerHTML = `
      <p><button class="btn sm" id="odVolver">← Cambiar de solicitud</button></p>
      <div class="note"><b>${t.icono} Solicitud ${esc(t.name.toLowerCase())}.</b>
        Lo que lleva asterisco hace falta. Al final firmas con el dedo y se manda.</div>
      <div class="grid">${camposOdt(tipo, jefes, porQueNo)}</div>

      <h3 class="sec">Archivos de referencia</h3>
      <p class="hint">Hasta ${MAX_ADJUNTOS_ODT} archivos de ${pesoLegible(MAX_ADJUNTO_ODT)}
        cada uno: una foto de ejemplo, el logotipo, un PDF con los textos. Opcional.</p>
      <input class="field" id="odFiles" type="file" multiple style="width:100%"
        accept="image/*,application/pdf">
      <div id="odFilesLista"></div>

      <h3 class="sec">Tu firma</h3>
      <p class="hint">Firmas como jefe del departamento que lo pide. Después marketing le
        consigue la firma de dirección.</p>
      <div class="grid">
        <div><label class="lbl">Tu puesto</label>
          <input class="field" id="odPuesto" style="width:100%"></div>
        <div><label class="lbl">Tu celular</label>
          <input class="field" id="odCel" style="width:100%" inputmode="tel"></div>
      </div>
      <canvas class="sign-pad" id="pad"></canvas>
      <p><button class="btn sm" id="odBorrar">Borrar y volver a firmar</button></p>
      <div id="odErr"></div>
      <p><button class="btn ok" id="odOk" style="width:100%;font-size:16px;padding:12px">
        Mandar la solicitud</button></p>
      <p class="hint" id="odVersion" style="text-align:center;margin-top:18px;opacity:.55">
        CORE ${esc(VERSION)}</p>`;

    const q = sel => caja.querySelector(sel);
    const limpiar = prepararPad(q("#pad"));
    q("#odBorrar").onclick = limpiar;
    q("#odVolver").onclick = escoger;

    /* Quién firma. Con lista, sale del departamento y no se puede teclear;
       sin lista, es la caja de texto de siempre y esto no hace nada. */
    const fijo = q("#odQuien") && q("#odQuien").dataset.fijo;
    const quienFirma = () => fijo ? jefeDe(q("#odDepto").value, jefes)
                                  : q("#odQuien").value.trim();
    if (fijo) q("#odDepto").onchange = () => {
      const n = quienFirma();
      q("#odQuien").textContent = n || "Escoge tu departamento";
      q("#odQuien").style.color = n ? "var(--text)" : "var(--muted)";
      q("#odQuien").style.fontWeight = n ? "600" : "400";
    };

    /* Se revisa el peso AL ESCOGER y no al mandar: enterarse de que no cabe
       después de llenar toda la hoja es enterarse tarde. */
    let archivos = [];
    q("#odFiles").onchange = ev => {
      const malos = [];
      archivos = [...ev.target.files].filter(f => {
        if (f.size > MAX_ADJUNTO_ODT){ malos.push(f.name + " (" + pesoLegible(f.size) + ")"); return false; }
        return true;
      }).slice(0, MAX_ADJUNTOS_ODT);
      q("#odFilesLista").innerHTML =
        (archivos.length ? `<p class="hint">Van a ir: ${archivos.map(f =>
            esc(f.name) + " · " + esc(pesoLegible(f.size))).join(", ")}</p>` : "") +
        (malos.length ? `<div class="errbox">Estos pesan más de ${pesoLegible(MAX_ADJUNTO_ODT)}
          y no se pueden mandar:
          ${esc(malos.join(", "))}.<br>Mándalos por correo, o sube una versión más chica.</div>` : "") +
        ([...ev.target.files].length > MAX_ADJUNTOS_ODT
          ? `<p class="hint">Sólo se mandan los primeros ${MAX_ADJUNTOS_ODT}.</p>` : "");
    };

    q("#odOk").onclick = async ev => {
      const err = q("#odErr");
      const val = id => (q("#" + id) || {}).value || "";
      const falta = [];
      if (!val("odDepto").trim()) falta.push("tu departamento");
      if (!quienFirma())          falta.push(fijo ? "escoger un departamento de la lista" : "tu nombre");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(val("odMail").trim())) falta.push("un correo válido");
      if (!val("odObj").trim())   falta.push("para qué es");
      if (!val("odEntrega"))      falta.push("para cuándo la necesitas");
      if (!q("#pad").dataset.trazado) falta.push("tu firma");
      if (falta.length){
        err.innerHTML = `<div class="errbox">Falta ${esc(falta.join(", "))}.</div>`;
        err.scrollIntoView({ behavior:"smooth", block:"center" });
        return;
      }
      err.innerHTML = "";
      const b = ev.currentTarget, antes = b.textContent;
      b.disabled = true; b.textContent = "Mandando…";
      try{
        const d = {
          departamento: val("odDepto").trim(), solicitante: quienFirma(),
          email: val("odMail").trim(), objetivo: val("odObj").trim(),
          elementos: val("odElem").trim(), notas: val("odNotas").trim(),
          fechaEntrega: val("odEntrega"), fecha: hoyISO()
        };
        if (tipo === "audiovisual"){
          Object.assign(d, {
            duracion: val("odDur").trim(), formato: val("odFormato"),
            audio: q("#odAudio").checked, vozOff: q("#odVoz").checked,
            tomas: [...caja.querySelectorAll(".odToma:checked")].map(x => x.value),
            lugar: val("odLugar").trim(), dia: val("odDia"), hora: val("odHora"),
            plataformas: val("odPlat").trim() });
        } else {
          Object.assign(d, { salida: val("odSalida"), medidas: val("odMedidas").trim(),
                             informacion: val("odInfo").trim() });
        }
        const adj = [];
        for (const f of archivos)
          adj.push({ nombre: f.name, tipoMime: f.type, tam: f.size, b64: await comoDataURL(f) });

        await depositarOdt(datos.token, tipo, d, {
          nombre: d.solicitante, puesto: val("odPuesto").trim(),
          celular: val("odCel").trim(), img: padAPng(q("#pad")),
          fecha: new Date().toISOString()
        }, adj);

        caja.innerHTML = `<div class="note" style="border-left:3px solid var(--ok)">
          <b>Listo, ${esc(d.solicitante)}. Tu solicitud ya llegó a marketing.</b><br><br>
          Ellos le consiguen la firma de dirección y te avisan. Si necesitas otra cosa,
          vuelve a abrir esta misma liga.</div>`;
        window.scrollTo(0, 0);
      }catch(ex){
        err.innerHTML = `<div class="errbox">No se pudo mandar.<br>${esc(ex.message)}
          <br><br>Inténtalo de nuevo, o avísale a marketing.</div>`;
        b.disabled = false; b.textContent = antes;
      }
    };
  };

  escoger();
}

/** Un archivo, como texto, para que quepa dentro del renglón del buzón. */
const comoDataURL = f => new Promise((ok, mal) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result));
  r.onerror = () => mal(new Error("No se pudo leer " + f.name));
  r.readAsDataURL(f);
});

/** ¿La dirección trae una liga de registro? */
function enlaceDeAlta(){
  const m = String(location.hash || "").match(/[#&]alta=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  const p = new URLSearchParams(String(location.search || "").replace(/^\?/, ""));
  const h = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  const dame = k => (p.get("utm_" + k) || h.get("utm_" + k) || "").trim();
  return {
    token: m[1],
    utm: { source:dame("source"), medium:dame("medium"), campaign:dame("campaign"),
           content:dame("content"), term:dame("term") }
  };
}

/**
 * La clave de la liga pública de registro. Es UNA sola para todo el hotel.
 *
 * La inventa el administrador y nadie más, aunque la liga la arme marketing.
 * La clave vive en los ajustes, y con roles.sql corrido los ajustes sólo los
 * escribe el administrador: si la inventara marketing, se quedaría en esa
 * computadora, el servidor nunca la conocería, y la liga pegada en el anuncio
 * rebotaría a todo el que la abriera. Peor: el día que el administrador
 * abriera la pantalla se inventaría OTRA, y la primera quedaría muerta para
 * siempre sin que nadie supiera por qué.
 *
 * Sin nube no hay servidor a quién avisarle y cualquiera la crea, como antes.
 */
function tokenAlta(){
  const h = state.ajustes.hotel;
  if (!h.tokenAlta && (!nubeActiva() || esAdmin())){
    h.tokenAlta = nuevoToken();
    guardar();
  }
  return h.tokenAlta || "";
}

/**
 * ¿La clave de la liga ya está en el servidor?
 *
 * La liga de alta no lleva nada dentro: lleva una clave, y el servidor sólo
 * deja depositar a quien traiga la que él tiene guardada. La clave vive en los
 * ajustes del hotel, y con roles.sql corrido los ajustes SÓLO los escribe el
 * administrador. Así que marketing puede armar una liga preciosa, pegarla en
 * el anuncio, y que todo el que la abra se estrelle —sin que nadie del hotel
 * se entere hasta que alguien pregunte por qué no llegan prospectos—.
 *
 * Se pregunta contra lo último que el servidor aceptó, que es justo lo que
 * tiene. Sin nube no hay liga pública que valga y la pregunta no aplica.
 */
const claveAltaPublicada = () => !nubeActiva() || claveYaConfirmada(tokenAlta());

/** La dirección de esta misma aplicación, sin lo que traiga pegado. */
const ligaDeAltaBase = () => {
  const t = tokenAlta();
  return t ? location.origin + location.pathname + "#alta=" + t + servidorEnLiga() : "";
};

/** La liga de registro ya con las etiquetas de una campaña. */
function ligaDeAlta(utm){
  const pares = Object.entries(utm || {})
    .filter(([, v]) => String(v || "").trim())
    .map(([k, v]) => `utm_${k}=${encodeURIComponent(String(v).trim())}`);
  const base = ligaDeAltaBase();
  return base ? base + (pares.length ? "&" + pares.join("&") : "") : "";
}

/**
 * Deja el registro en el buzón.
 *
 * Va con return=minimal a propósito: el visitante no tiene permiso de LEER la
 * tabla —ni lo suyo—, y si la petición pidiera de vuelta el renglón guardado,
 * el servidor la rechazaría entera aunque el registro estuviera bien.
 */
async function depositarAlta(token, datos){
  const r = await fetch(nube.url + "/rest/v1/crm_altas", {
    method: "POST",
    headers: { apikey: nube.anon, "Content-Type": "application/json",
               "Prefer": "return=minimal" },
    body: JSON.stringify(Object.assign({ token, aplicada: false }, datos))
  });
  if (!r.ok){
    const detalle = await r.text().catch(() => "");
    // La clave mala va PRIMERO: el aviso de que la regla lo rechazó nombra la
    // tabla, así que si se preguntara antes por la tabla, una clave inventada
    // se reportaría como "falta montar el buzón" y nadie entendería nada.
    if (/row-level security/i.test(detalle))
      throw new Error("Esta liga ya no está vigente. Pídele una nueva a quien te la mandó.");
    if (/schema cache|PGRST205|does not exist/i.test(detalle))
      throw new Error("La liga todavía no está lista del lado del hotel.");
    throw new Error(detalle || ("Error " + r.status));
  }
}

/**
 * La pantalla que ve quien abre la liga.

 * respeta el membrete del hotel y ya sabe reclamar en el idioma de quien la

function pantallaAltaPublica(datos){

async function mandarAlta(caja, err, datos){
  const val = id => caja.querySelector("#" + id).value.trim();
  const marca = id => caja.querySelector("#" + id).classList.add("err");
  const faltan = [];

  // Las mismas reglas que la tableta: un registro sin manera de volver a
  // contactar a la persona no sirve de nada.
  if (!val("kNom")){ faltan.push("su nombre"); marca("kNom"); }
  if (!val("kApe")){ faltan.push("su apellido"); marca("kApe"); }
  const email = val("kMail").toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){
    faltan.push("un correo electrónico válido"); marca("kMail");
  }
  if (val("kTel").replace(/\D/g, "").length < 10){
    faltan.push("un teléfono de 10 dígitos"); marca("kTel");
  }
  if (faltan.length){
    err.innerHTML = `<div class="k-err"><b>Nos falta un dato:</b>
      <ul>${faltan.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    err.scrollIntoView({ block:"center", behavior:"smooth" });
    return;
  }

  const b = caja.querySelector("#kEnviar");
  b.disabled = true; b.textContent = "Enviando…"; err.innerHTML = "";
  try{
    await depositarAlta(datos.token, {
      nombre: val("kNom"), apellido: val("kApe"), email,
      telefono: val("kTel"), compania: val("kEmp"),
      interes: "", utm: datos.utm
    });
    caja.querySelector(".k-hoja").innerHTML = `
      <div class="k-marca">${membreteKiosco(state.ajustes.hotel)}</div>
      <div class="k-gracias"><div class="k-tick">✓</div>
        <h1 class="k-titulo">¡Gracias!</h1>
        <p class="k-sub">Ya tenemos sus datos. Alguien del hotel le contacta muy pronto.</p></div>`;
  }catch(ex){
    err.innerHTML = `<div class="k-err">${esc(ex.message)}</div>`;
    b.disabled = false; b.textContent = "Enviar mis datos";
  }
}

/**
 * Recoge del buzón lo que dejaron en la liga y lo vuelve prospecto.
 *
 * La campaña se resuelve por la etiqueta utm_campaign, que es la que el CRM
 * mismo generó. Si no la reconoce, el prospecto entra igual: más vale un lead
 * sin campaña que un lead perdido.
 */
/**
 * Recoge los mensajes de WhatsApp que dejó el proveedor y los vuelve leads.
 *
 * Calcada de recogerAltas(), que hace lo mismo con la liga pública. La
 * diferencia está en de dónde sale la campaña:
 *
 *   El mensaje trae el id DEL ANUNCIO. De ahí se sube al conjunto —que es el
 *   `padre` del anuncio en el catálogo de Meta— y del conjunto a la campaña
 *   del CRM que lo tenga enlazado. Tres saltos, y si falla cualquiera se
 *   guarda el lead SIN campaña en vez de adivinar una.
 *
 * Y un cuidado que no tiene la otra: alguien que escribe tres veces es una
 * persona, no tres. Si ya hay un prospecto con ese teléfono sin pasar a la
 * cartera, el mensaje se le anexa a las notas.
 */
async function recogerWhatsApp(){
  const parte = { hubo:false, buzon:true, pendientes:0, aplicadas:0, notas:[] };
  if (!nubeActiva()){ parte.buzon = false; return parte; }

  let filas;
  try{
    filas = await api("/rest/v1/crm_wa?select=id,mensaje_id,telefono,perfil,texto,tipo,"
                      + "referral,conjunto,campana_id,recibido"
                      + "&aplicada=is.false&order=recibido.asc&limit=200");
  }catch(e){
    if (/crm_wa|schema cache|does not exist|404|PGRST205/i.test(e.message)){
      nube.sinBuzonWa = true;
      parte.buzon = false;
      parte.notas.push("El buzón de WhatsApp no existe todavía: falta correr whatsapp.sql en Supabase.");
      return parte;
    }
    parte.notas.push("No se pudo leer el buzón de WhatsApp: " + e.message);
    return parte;
  }

  parte.pendientes = (filas || []).length;
  const aplicadas = [];
  for (const f of filas || []){
    const r = f.referral || {};
    /* La campaña viene resuelta desde el servidor, que es el único que ve el
       catálogo de Meta Y las campañas: el catálogo sólo lo lee marketing y las
       campañas no le bajan a ventas, así que resolverlo aquí dejaría sin
       campaña a todo lead que recogiera una cuenta de ventas. Lo de abajo es
       la red por si la función todavía es la vieja. */
    const camp = campana(f.campana_id) || campanaDelAnuncio(r.source_id);
    const tel = String(f.telefono || "").replace(/\D/g, "");

    /* El titular del anuncio dice qué venía buscando mejor que cualquier otra
       cosa: es lo que la persona leyó antes de escribir. */
    const dePublicidad = r.headline ? ` Venía del anuncio «${String(r.headline).slice(0,120)}».` : "";
    const linea = (String(f.texto || "").trim() || "(sin texto)");

    const ya = tel ? state.prospectos.find(p =>
      !p.clienteId && String(p.telefono || "").replace(/\D/g, "") === tel) : null;

    if (ya){
      ya.notas = [ya.notas, "Escribió otra vez por WhatsApp: «" + linea + "»"]
        .filter(Boolean).join(" ").slice(0, 2000);
      if (!ya.campanaId && camp) ya.campanaId = camp.id;
      ya.updatedAt = new Date().toISOString();
    } else {
      state.prospectos.push(saneaProspecto({
        nombre: String(f.perfil || "").trim() || "(sin nombre)",
        telefono: tel,
        canal: camp ? camp.canal : "meta",
        campanaId: camp ? camp.id : "",
        capturadoPor: camp ? camp.responsable : "",
        fecha: String(f.recibido || new Date().toISOString()).slice(0, 16).replace("T", " "),
        notas: "Escribió por WhatsApp: «" + linea + "»." + dePublicidad,
        createdAt: new Date().toISOString()
      }));
    }

    aplicadas.push(f.id);
    parte.aplicadas++;
    if (r.source_id && !camp)
      parte.notas.push("Llegó un mensaje del anuncio " + r.source_id +
        ", que todavía no está enlazado a ninguna campaña. Éste entra sin ella; " +
        "sincronizando Meta, los siguientes ya salen amarrados.");
  }

  if (aplicadas.length){
    // Se marcan DESPUÉS de crearlos, como en el otro buzón: si se cortara la
    // luz entre una cosa y la otra, más vale recoger dos veces al mismo que
    // perderlo.
    try{
      await api(`/rest/v1/crm_wa?id=in.(${aplicadas.join(",")})`, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify({ aplicada: true })
      });
    }catch(e){
      parte.notas.push("Se recogieron los mensajes pero no se pudieron marcar: " + e.message);
    }
    parte.hubo = true;
    guardar();
  }
  return parte;
}

/**
 * De qué campaña del CRM es un anuncio de Meta.
 *
 * Anuncio → su conjunto → la campaña del CRM que tenga ese conjunto enlazado.
 * Si el anuncio no está en el catálogo todavía —porque no se ha sincronizado
 * Meta desde que se creó—, devuelve null y el lead se guarda sin campaña. No
 * se adivina: un lead colgado de la campaña equivocada ensucia el costo por
 * lead de las dos.
 */
function campanaDelAnuncio(idAnuncio){
  const id = String(idAnuncio || "").trim();
  if (!id) return null;
  const conjunto = padreDe(id);
  if (!conjunto) return null;
  return state.campanas.find(c =>
    (c.metaIds || []).some(x => String(x) === conjunto)) || null;
}

/**
 * Recoge del buzón las órdenes que levantaron los jefes de área.
 *
 * Calcada de recogerAltas(), con DOS cuidados que aquélla no necesita:
 *
 * 1. NO DUPLICAR. Recoger es "at-least-once" a propósito: se crean primero y
 *    se marcan después, porque si se corta la luz en medio más vale recoger
 *    dos veces que perder lo que alguien capturó. En los prospectos eso deja
 *    un registro repetido y ya; aquí subiría los archivos otra vez y gastaría
 *    folio. Por eso cada orden recuerda de qué renglón salió.
 *
 * 2. LOS ARCHIVOS NO SE QUEDAN EN EL RENGLÓN. Vienen como texto porque el
 *    visitante no tiene permiso de escribir en el almacén, pero de aquí en
 *    adelante viven en el almacén: el registro entero se replica a cada equipo
 *    en cada sincronización, y tres PDF incrustados harían lenta la aplicación
 *    de todo el hotel.
 */
async function recogerOdts(){
  const parte = { hubo:false, buzon:true, pendientes:0, aplicadas:0, notas:[] };
  if (!nubeActiva()){ parte.buzon = false; return parte; }

  let filas;
  try{
    filas = await api("/rest/v1/crm_odts?select=id,tipo,datos,firma,adjuntos,creado"
                      + "&aplicada=is.false&order=creado.asc&limit=50");
  }catch(e){
    if (/crm_odts|schema cache|does not exist|404|PGRST205/i.test(e.message)){
      nube.sinBuzonOdts = true;
      parte.buzon = false;
      parte.notas.push("El buzón de órdenes no existe todavía: falta correr odts.sql en Supabase.");
      return parte;
    }
    parte.notas.push("No se pudo leer el buzón de órdenes: " + e.message);
    return parte;
  }

  parte.pendientes = (filas || []).length;
  const aplicadas = [];
  for (const f of filas || []){
    const marca = String(f.id);

    // Ya la habíamos recogido: se marca y se sigue, sin crear nada ni subir nada.
    if (state.odts.some(o => o.origenId === marca)){ aplicadas.push(f.id); continue; }

    const d = f.datos || {};
    const tipo = TIPOS_ODT.some(t => t.id === f.tipo) ? f.tipo : "diseno";
    const t = infoTipoOdt(tipo);

    /* El folio se aparta AQUÍ y no en el formulario: el contador es un RPC que
       pide sesión, y quien llena la hoja no tiene ninguna. Dos series, una por
       hoja: una orden de video y una de diseño no compiten por el número. */
    const anio = String(d.fecha || hoyISO()).slice(0, 4);
    let folio = "";
    try{ folio = await apartarFolio("odt_" + tipo, t.prefijo, anio); }catch(e){}
    if (!folio) folio = folioLocalOdt(tipo, anio);

    /* Los adjuntos, al almacén. La ruta es DETERMINISTA —sale del renglón del
       buzón— para que si esto se corre dos veces el segundo intento pise el
       mismo archivo en vez de dejar basura suelta que nadie va a limpiar. */
    const adjuntos = [];
    for (let i = 0; i < (f.adjuntos || []).length && i < MAX_ADJUNTOS_ODT; i++){
      const a = f.adjuntos[i] || {};
      if (!a.b64) continue;
      try{
        const blob = await (await fetch(a.b64)).blob();
        const ext = (String(a.nombre || "").match(/\.([A-Za-z0-9]{1,8})$/) || [, "bin"])[1].toLowerCase();
        const ruta = `ref/${marca}/${i}.${ext}`;
        await subirEscaneo(new File([blob], a.nombre || ("archivo." + ext),
                                    { type: a.tipoMime || blob.type }),
                           DEPOSITO_ODTS, ruta);
        adjuntos.push(saneaAdjunto({ nombre:a.nombre, ruta, tipoMime:a.tipoMime, tam:a.tam }));
      }catch(e){
        /* Perder el archivo es malo; perder la orden es peor. Entra sin él y se
           dice, que es mejor que rebotarle la solicitud a quien ya la firmó. */
        parte.notas.push(`No se pudo guardar el archivo "${a.nombre || "sin nombre"}" de ` +
          `${d.solicitante || "la orden"}: ${e.message}`);
      }
    }

    /* El nombre se vuelve a sacar de NUESTRA lista, no de lo que venía en la
       petición. El formulario ya lo pone solo, pero el formulario corre en el
       navegador de alguien más y un navegador se salta con curl: quien tenga
       la clave puede mandar el departamento de banquetes con el nombre que se
       le ocurra. Aquí el departamento manda y el nombre se confirma.

       Si el departamento no está en la lista —una orden vieja, o uno que el
       administrador borró después— se queda el que venía: perder el dato sería
       peor que tenerlo sin confirmar.

       Esto cierra el hueco del NOMBRE. No cierra el de la FIRMA: el trazo del
       dedo lo hace quien sea que tenga la liga, y eso es el trato de siempre de
       las ligas sin contraseña. Está dicho así en ODTS.md. */
    const jefe = jefeDe(d.departamento) || d.solicitante
              || (f.firma && f.firma.nombre) || "";

    state.odts.push(saneaOdt(Object.assign({}, d, {
      tipo, folio, origenId: marca,
      estado: "por_director",
      solicitante: jefe,
      firmaJefe: f.firma && f.firma.img
        ? Object.assign({}, f.firma, jefe ? { nombre: jefe } : {})
        : null,
      tokenFirma: nuevoToken(),      // el enlace que se le manda al director
      adjuntos,
      fecha: d.fecha || String(f.creado || "").slice(0, 10) || hoyISO(),
      createdAt: f.creado || new Date().toISOString()
    })));

    aplicadas.push(f.id);
    parte.aplicadas++;
  }

  if (aplicadas.length){
    // Se marcan DESPUÉS de crearlas, como en los otros buzones: si se cortara
    // la luz en medio, más vale recoger dos veces que perder la orden. El
    // origenId de arriba es lo que hace que recoger dos veces no duplique.
    try{
      await api(`/rest/v1/crm_odts?id=in.(${aplicadas.join(",")})`, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify({ aplicada: true })
      });
    }catch(e){
      parte.notas.push("Se recogieron las órdenes pero no se pudieron marcar: " + e.message);
    }
    parte.hubo = true;
    guardar();
  }
  return parte;
}

/**
 * El folio cuando no hay contador en el servidor.
 *
 * Cuenta con lo que este equipo tiene bajado, que es lo mismo que hace el de
 * los convenios. Si dos equipos recogieran a la vez podrían repetirlo; con
 * folios.sql corrido eso no pasa, porque el servidor reparte el turno.
 */
function folioLocalOdt(tipo, anio){
  const pre = infoTipoOdt(tipo).prefijo;
  const usados = state.odts
    .map(o => (String(o.folio || "").match(new RegExp("^" + pre + "-" + anio + "-(\\d+)$")) || [])[1])
    .filter(Boolean).map(Number);
  const n = (usados.length ? Math.max(...usados) : 0) + 1;
  return `${pre}-${anio}-${String(n).padStart(3, "0")}`;
}
