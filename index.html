function tarjeta(c, e){
  const el = document.createElement("article");
  el.className = "card";
  el.draggable = true;
  el.dataset.id = c.id;
  el.style.borderLeftColor = e.color;

  const ua = ultimaAct(c.id);
  const n = actsVisiblesDe(c.id).length;
  const docs = veHospedaje() ? conveniosDe(c.id)
                             : state.eventos.filter(e => e.clienteId === c.id && eventoEsMio(e));
  const firmado = veHospedaje() ? docs.some(v => v.estado === "firmado_cliente")
                                : docs.some(e => ["firmado","confirmado"].includes(e.estado));
  const espera  = veHospedaje() ? docs.some(v => v.estado === "firmado_ejecutiva")
                                : docs.some(e => e.estado === "enviada");
  /* Con la etapa vacía —nadie de banquetes lo ha tratado— sale -1, y entonces
     «‹» queda deshabilitada y «›» lleva a la primera: una sola picada mueve a
     Contactado al que nadie había tomado. Sale solo, sin un caso aparte. */
  const i = ESTATUS.findIndex(x => x.id === estatusDeCli(c));
  const bq = enBanquetes();
  const vendido = bq ? vendidoBq(docs) : 0;

  el.innerHTML = `
    <div class="card-title">${esc(c.empresa || "(sin empresa)")}</div>
    <div class="card-sub">${esc([c.contacto, c.ubicacion].filter(Boolean).join(" · ") || "—")}</div>
    <div class="card-row">
      ${bq ? (vendido ? `<span class="pill oro" title="Eventos confirmados">${esc(money(vendido))}</span>` : "")
           : (c.tarifa ? `<span class="pill oro">${esc(money(c.tarifa))}</span>` : "")}
      ${ejecutivoDeCli(c) ? `<span class="pill">${esc(ejecutivoDeCli(c))}</span>` : ""}
      ${n ? `<span class="pill" title="Actividades registradas">${n} act.</span>` : ""}
      ${firmado ? `<span class="pill good">${veHospedaje() ? "Convenio firmado" : "Evento contratado"}</span>`
                : espera ? `<span class="pill warn">Espera firma</span>` : ""}
    </div>
    ${ua ? `<div class="card-sub" style="margin-top:6px">${tipoAct(ua.tipo).icon} ${esc(ua.asunto || tipoAct(ua.tipo).name)} · ${esc(fechaHora(ua.fecha))}</div>` : ""}
    <div class="card-acts">
      <button data-dir="-1" ${i <= 0 ? "disabled" : ""} title="Estatus anterior">‹</button>
      <button class="wa" data-wa ${c.telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>
      <button data-dir="1" ${i >= ESTATUS.length-1 ? "disabled" : ""} title="Estatus siguiente">›</button>
    </div>`;

  el.addEventListener("dragstart", ev => {
    arrastrando = c.id; el.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", c.id);
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  el.addEventListener("click", ev => {
    if (ev.target.closest("[data-wa]")){ ev.stopPropagation(); abrirWhatsApp(c); return; }
    const b = ev.target.closest("button[data-dir]");
    if (b){
      ev.stopPropagation();
      const destino = ESTATUS[i + Number(b.dataset.dir)];
      if (destino) moverCliente(c.id, destino.id);
      return;
    }
    abrirCliente(c.id);
  });
  return el;
}

function moverCliente(id, estatus){
  const c = cliente(id);
  /* Se mueve la etapa del departamento en el que se está. Arrastrar una
     tarjeta en banquetes NO le mueve el embudo a ventas, que era justo la
     queja: una boda confirmada le cerraba el convenio a quien ni se enteró. */
  const k = campoEstatus();
  if (!c || String(c[k] || "") === estatus) return;
  c[k] = estatus;
  if (!c[k]) delete c[k];          // «Sin tratar» es la ausencia del campo
  c.updatedAt = new Date().toISOString();
  guardar(); render();
}

/* ==========================================================================
   LEADS

   Todo lo que llega, en una sola lista, para repartirlo.

   El Formulario sigue siendo la captura de prospección en eventos, con su
   tableta. Esto es lo otro: la cola de trabajo. Lo que importa aquí no es
   capturar sino DECIDIR —de qué área es y quién lo trabaja—, porque un lead
   sin dueño es un lead que nadie contesta.
   ========================================================================== */

let filtroLeads = { q:"", campana:"", area:"", sinAsignar:false };

function leadsVisibles(){
  const q = filtroLeads.q.trim().toLowerCase();
  return state.prospectos.filter(p => {
    if (!leadEsMio(p)) return false;
    if (filtroLeads.campana && p.campanaId !== filtroLeads.campana) return false;
    if (filtroLeads.area && p.area !== filtroLeads.area) return false;
    if (filtroLeads.sinAsignar && String(p.asignadoA || "").trim()) return false;
    if (!q) return true;
    return [p.nombre, p.apellido, p.compania, p.email, p.telefono, p.evento, p.notas,
            nombreCampanaDe(p)].join(" ").toLowerCase().includes(q);
  }).sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
}

/** De qué campaña del CRM vino, por su nombre. */
const nombreCampanaDe = p => {
  const c = campana(p.campanaId);
  return c ? c.nombre : "";
};

/**
 * Si los mensajes de WhatsApp están entrando o no.
 *
 * Sin esto, el día que el webhook se caiga los leads simplemente dejarían de
 * llegar y nadie se enteraría: no hay error que ver, sólo ausencia. Y la
 * ausencia de leads se confunde con una mala racha.
 */
function tiraWhatsApp(){
  if (!nubeActiva()) return "";
  if (nube.sinBuzonWa)
    return `<div class="note warn"><b>WhatsApp todavía no está conectado.</b>
      Los mensajes que entran por los anuncios se capturan a mano, con el botón de arriba.
      Para que entren solos se corre <code>whatsapp.sql</code> en Supabase y se sube la
      función <code>wa-hook</code>. El paso a paso está en <b>WHATSAPP.md</b>.</div>`;
  if (!waSync) return "";
  /* Corrido whatsapp.sql pero sin un solo mensaje todavía, no hay nada que
     decir: una tira que dijera "el último mensaje entró" sin decir cuándo se
     lee como una frase cortada, y peor, como si ya estuviera entrando algo. */
  if (!waSync.cuando) return "";
  const bien = waSync.ok;
  return `<div class="note" style="border-left:3px solid ${bien ? "var(--ok)" : "var(--bad)"}">
    <b>WhatsApp</b> · ${bien ? "el último mensaje entró " + esc(haceCuanto(waSync.cuando))
      : "la última vez falló " + esc(haceCuanto(waSync.cuando))}
    ${!bien && waSync.detalle ? `<br><span class="hint">${esc(waSync.detalle)}</span>` : ""}</div>`;
}

/* La última anotación de la bitácora del webhook. Se lee una vez por pantalla,
   no en cada dibujo: es informativa, no manda sobre nada. */
let waSync = null;
let waPidiendo = null;

function cargaWhatsApp(vuelveAPintar){
  if (waSync !== null || !nubeActiva() || nube.sinBuzonWa || waPidiendo) return;
  waPidiendo = api("/rest/v1/crm_wa_log?select=cuando,evento,ok,detalle&order=cuando.desc&limit=1")
    .then(r => {
      waPidiendo = null;
      waSync = Array.isArray(r) && r.length ? r[0] : { cuando:"", ok:true, detalle:"" };
      vuelveAPintar();
    })
    .catch(e => {
      waPidiendo = null;
      if (/crm_wa|schema cache|does not exist|404|PGRST205/i.test(e.message)) nube.sinBuzonWa = true;
      waSync = { cuando:"", ok:true, detalle:"" };
      vuelveAPintar();
    });
}

          <td>${c ? esc(c.nombre) : `<span class="hint">${esc(p.evento || "—")}</span>`}${
            padre ? `<div class="hint">${esc(padre)}</div>` : ""}</td>
          <td class="nowrap">${a ? esc(a.name) : `<span class="hint">—</span>`}</td>
          <td class="nowrap">${p.asignadoA

            : `<span class="hint" style="color:var(--bad)">Sin asignar</span>`}</td>
          <td class="nowrap">${p.clienteId
            ? `<span class="pill" style="background:var(--ok-soft);color:var(--ok)">En cartera</span>`
            : `<span class="hint">Sin trabajar</span>`}</td>
          <td class="nowrap"><button class="btn sm primary" data-asig="${p.id}">${
            p.asignadoA ? "Reasignar" : "Asignar"}</button></td>
        </tr>`;
      }).join("")}</tbody></table></div>`;
  }

  const q = sel => cont.querySelector(sel);
  q("#qLeads").oninput = e => {
    filtroLeads.q = e.target.value;
    renderLeads();
    const c = cont.querySelector("#qLeads");
    c.focus(); c.setSelectionRange(c.value.length, c.value.length);
  };
  q("#fLeadCamp").onchange = e => { filtroLeads.campana = e.target.value; renderLeads(); };
  q("#fLeadArea").onchange = e => { filtroLeads.area = e.target.value; renderLeads(); };
  const bSin = q("#bSoloSin");
  if (bSin) bSin.onclick = () => { filtroLeads.sinAsignar = !filtroLeads.sinAsignar; renderLeads(); };
  q("#bLeadWa").onclick = () => leadDeWhatsApp();
  q("#bCsvLeads").onclick = () => {
    const cab = ["Llegó","Nombre","Compañía","Teléfono","Correo","Campaña","Área",
                 "Asignado a","Capturó","Estado","Notas"];
    descargar(`leads-${hoyISO()}.csv`, toCSV([cab].concat(ls.map(p =>
      [p.fecha, nombreProspecto(p), p.compania, p.telefono, p.email,
       nombreCampanaDe(p), (infoArea(p.area) || {}).name || "", p.asignadoA,
       p.capturadoPor, p.clienteId ? "En cartera" : "Sin trabajar", p.notas]))), "text/csv");
  };
  cont.querySelectorAll("[data-asig]").forEach(b =>
    b.onclick = () => asignarLead(b.dataset.asig));

  cargaWhatsApp(() => { if (vista === "leads") renderLeads(); });
}

/**
 * Repartir un lead: de qué área es, y quién lo trabaja.
 *
 * Los dos juntos y en ese orden, porque el área manda sobre la lista de
 * ejecutivos: un lead de salones sólo se le puede pasar a alguien de
 * banquetes. Meta no dice de qué es —sus anuncios traen "conversaciones", no
 * intenciones—, así que lo decide quien reparte, leyendo lo que pidió.
 */
function asignarLead(id){
  const p = state.prospectos.find(x => x.id === id);
  if (!p) return;

  const ov = modal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-head"><h2>Asignar el lead</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note"><b>${esc(nombreProspecto(p))}</b>${p.telefono
          ? " · " + esc(p.telefono) : ""}${nombreCampanaDe(p)
          ? `<br><span class="hint">Llegó por ${esc(nombreCampanaDe(p))}</span>` : ""}
          ${p.evento || p.notas ? `<br><span class="hint">${esc(
            [p.evento, p.notas].filter(Boolean).join(" · "))}</span>` : ""}</div>
        <div class="grid">
          <div class="full"><label class="lbl">¿De qué es?</label>
            <select class="field" id="alArea">
              <option value="">— Escoja —</option>
              ${AREAS_LEAD.map(a => `<option value="${a.id}"${
                a.id === p.area ? " selected" : ""}>${esc(a.name)} · ${esc(a.ayuda)}</option>`).join("")}
            </select></div>
          <div class="full"><label class="lbl">¿Quién lo trabaja?</label>
            <div id="alQuien"></div>
            <div class="hint">Sólo salen los del área escogida.</div></div>
        </div>
        <div id="alErr"></div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkAsig">Asignar</button></div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  const pintaQuien = () => {
    const area = q("#alArea").value;
    q("#alQuien").innerHTML = area
      ? selectEjecutivo(p.asignadoA, "alEje", area)
      : `<span class="hint">Primero escoja de qué es.</span>`;
  };
  pintaQuien();
  q("#alArea").onchange = pintaQuien;

  q("#bOkAsig").onclick = () => {
    const area = q("#alArea").value;
    const eje = (q('[name="alEje"]') || {}).value || "";
    if (!area || !eje.trim()){
      q("#alErr").innerHTML = `<div class="errbox">Hace falta el área y el ejecutivo:
        sin los dos, el lead se queda sin dueño y nadie lo contesta.</div>`;
      return;
    }
    p.area = area;
    p.asignadoA = eje.trim();
    p.updatedAt = new Date().toISOString();
    guardar(); render(); ov.remove();
  };
}

/**
 * Un lead de WhatsApp, a mano y en diez segundos.
 *
 * Los anuncios del hotel son de mensajes, y Meta NO entrega esas
 * conversaciones por su API: para eso el número tendría que estar en la Cloud
 * API. Mientras tanto, quien contesta el teléfono lo mete aquí con lo mínimo
 * —quién es, su teléfono y de qué anuncio venía— y el lead deja de perderse.
 */
function leadDeWhatsApp(){
  const cs = campanasVisibles();
  const ov = modal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-head"><h2>Lead de WhatsApp</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note">Para el que escribió por WhatsApp desde un anuncio. Con el
          teléfono y la campaña basta: lo demás se completa después.</div>
        <div class="grid">
          <div><label class="lbl">Nombre</label>
            <input class="field" id="waNom" placeholder="Como se presentó"></div>
          <div><label class="lbl">Teléfono</label>
            <input class="field" id="waTel" inputmode="tel" placeholder="6641234567"></div>
          <div class="full"><label class="lbl">¿De qué anuncio venía?</label>
            <select class="field" id="waCamp">
              <option value="">— No sé / no venía de uno —</option>
              ${cs.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}
            </select></div>
          <div class="full"><label class="lbl">¿Qué pidió?</label>
            <select class="field" id="waArea">
              <option value="">— Escoja —</option>
              ${AREAS_LEAD.map(a => `<option value="${a.id}">${esc(a.name)} · ${esc(a.ayuda)}</option>`).join("")}
            </select></div>
          <div class="full"><label class="lbl">Nota <span class="hint">opcional</span></label>
            <input class="field" id="waNota" placeholder="Pidió salón para 150 el 14 de febrero"></div>
        </div>
        <div id="waErr"></div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkWa">Guardar</button></div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  q("#bOkWa").onclick = () => {
    const nombre = q("#waNom").value.trim();
    const tel = q("#waTel").value.trim();
    if (!nombre && !tel){
      q("#waErr").innerHTML = `<div class="errbox">Hace falta al menos el nombre o el
        teléfono: sin uno de los dos no hay a quién volverle a hablar.</div>`;
      return;
    }
    const camp = campana(q("#waCamp").value);
    state.prospectos.push(saneaProspecto({
      nombre: nombre || "(sin nombre)",
      telefono: tel,
      canal: camp ? camp.canal : "meta",
      campanaId: camp ? camp.id : "",
      area: q("#waArea").value,
      capturadoPor: miNombre(),
      fecha: ahoraLocal(),
      notas: ["Escribió por WhatsApp.", q("#waNota").value.trim()].filter(Boolean).join(" "),
      createdAt: new Date().toISOString()
    }));
    guardar(); render(); ov.remove();
  };
  q("#waNom").focus();
}

/* ==========================================================================
   FORMULARIO DE PROSPECCIÓN

   Lo que se llena en un stand, de pie y con prisa: cinco campos y listo. No
   entra a la cartera hasta que alguien lo trabaja, para que un evento de cien
   registros no llene el embudo de gente que nunca contestó.
   ========================================================================== */

let filtroPros = { q:"", evento:"" };
let ultimoEvento = "";      // se repite solo: en una expo todos son del mismo

/** ¿Este lead es de quien está viendo la pantalla? */
const leadEsMio = p => {
  const yo = miNombre().trim().toLowerCase();
  if (puedeVerTodo() || veMarketing()) return true;
  if (!yo) return false;
  // El asignado primero: es quien lo trabaja. Y quien lo capturó lo sigue
  // viendo, porque de otro modo perdería de vista lo que él mismo levantó.
  return String(p.asignadoA || "").trim().toLowerCase() === yo ||
         String(p.capturadoPor || "").trim().toLowerCase() === yo;
};

const prospectosVisibles = () => {
  const mios = leadEsMio;
  const q = filtroPros.q.trim().toLowerCase();
  return state.prospectos.filter(p => {
    if (!mios(p)) return false;
    if (filtroPros.evento && p.evento !== filtroPros.evento) return false;
    if (!q) return true;
    return [p.nombre, p.apellido, p.compania, p.email, p.telefono, p.evento, p.notas]
      .join(" ").toLowerCase().includes(q);
  }).sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
};

const eventosConocidos = () => [...new Set(state.prospectos.map(p => p.evento).filter(Boolean))]
  .sort((a,b) => a.localeCompare(b,"es"));

/** Los mismos campos en la vista y en la ventana de edición. */
const camposProspecto = (p, pre) => `
  <div class="grid">
    <div><label class="lbl">Nombre *</label>
      <input class="field" id="${pre}Nom" value="${esc(p.nombre)}" autocomplete="off"></div>
    <div><label class="lbl">Apellido *</label>
      <input class="field" id="${pre}Ape" value="${esc(p.apellido)}" autocomplete="off"></div>
    <div><label class="lbl">Compañía <span class="hint">(opcional)</span></label>
      <input class="field" id="${pre}Emp" value="${esc(p.compania)}" autocomplete="off"></div>
    <div><label class="lbl">Evento <span class="hint">(opcional)</span></label>
      <input class="field" id="${pre}Evt" value="${esc(p.evento)}" list="listaEventos"
        placeholder="Expo Salud 2026" autocomplete="off"></div>
    <div><label class="lbl">Correo electrónico *</label>
      <input class="field" type="email" id="${pre}Mail" value="${esc(p.email)}"
        autocomplete="off" spellcheck="false" inputmode="email"></div>
    <div><label class="lbl">Número de teléfono *</label>
      <input class="field" type="tel" id="${pre}Tel" value="${esc(p.telefono)}"
        autocomplete="off" inputmode="tel"></div>
    <div class="full"><label class="lbl">Notas <span class="hint">(opcional)</span></label>
      <textarea class="field" id="${pre}Notas" style="min-height:70px">${esc(p.notas)}</textarea></div>
  </div>
  <datalist id="listaEventos">${eventosConocidos().map(e =>
    `<option value="${esc(e)}">`).join("")}</datalist>`;

/**
 * Lee los campos y reclama lo que falte. Devuelve el prospecto o null.
 *
 * Se valida de verdad el correo y el teléfono: un registro de evento sin
 * manera de volver a contactar a la persona no sirve de nada.
 */
function leerProspecto(raiz, pre, cajaErr, base){
  const val = id => raiz.querySelector("#" + pre + id).value.trim();
  const nombre = val("Nom"), apellido = val("Ape");
  const email = val("Mail").toLowerCase(), telefono = val("Tel");
  const faltan = [];

  if (!nombre)   faltan.push("Escribe el nombre.");
  if (!apellido) faltan.push("Escribe el apellido.");
  if (!email)          faltan.push("Escribe el correo electrónico.");
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))
    faltan.push(`"${email}" no parece un correo válido.`);
  if (!telefono)                              faltan.push("Escribe el número de teléfono.");
  else if (telefono.replace(/\D/g,"").length < 10)
    faltan.push("El teléfono debe traer al menos 10 dígitos.");

  cajaErr.innerHTML = faltan.length
    ? `<div class="errbox"><b>Falta esto para guardar:</b><ul>${
        faltan.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
    : "";
  if (faltan.length) return null;

  return saneaProspecto(Object.assign({}, base, {
    nombre, apellido, email, telefono,
    compania: val("Emp"), evento: val("Evt"), notas: val("Notas")
  }));
}

/**
 * La lista se repinta sola, aparte del formulario.
 *
 * Si buscar volviera a dibujar la pantalla entera, se borraría lo que se
 * estuviera capturando en ese momento — que es justo lo que no puede pasar
 * con una persona enfrente esperando.
 */
function renderFormulario(){
  const cont = document.getElementById("tblFormulario");
  const vacio = saneaProspecto({ evento: ultimoEvento });

  cont.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <b style="font-size:15px">Prospección en eventos</b>
      <span class="hint" id="prosCuenta"></span>
    </div>

    <div class="note">Para levantar contactos en una expo, una feria o un evento del hotel.
      Se guarda aquí, no en la cartera: cuando alguno valga la pena trabajarlo, se le da
      <i>Pasar a la cartera</i> y se vuelve un cliente con su ejecutivo.</div>

    <div class="panel-form">
      <h3 class="sec" style="margin-top:0">Nuevo registro</h3>
      <div id="prosErr"></div>
      ${camposProspecto(vacio, "np")}
      <p style="margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn primary" id="bGuardarPros">Guardar registro</button>
        <button class="btn" id="bLimpiarPros">Limpiar</button>
        <span class="hint" id="prosOk"></span></p>
    </div>

    <div class="note" style="margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span style="flex:1;min-width:240px"><b>¿La tableta la va a llenar el cliente?</b>
        El <i>modo tableta</i> deja la pantalla completa con nada más el formulario:
        sin pestañas, sin la cartera y sin los registros de los demás.</span>
      <button class="btn primary" id="bKiosco">Abrir modo tableta</button>
    </div>

    <div style="display:flex;gap:8px;align-items:center;margin:22px 0 12px;flex-wrap:wrap">
      <input class="field" id="qPros" type="search" value="${esc(filtroPros.q)}"
        placeholder="Buscar nombre, correo, teléfono…" autocomplete="off" style="min-width:240px">
      <select class="field" id="fEvento" title="Evento"></select>
      <span style="flex:1"></span>
      <button class="btn" id="bExpPros">Exportar CSV</button>
    </div>

    <div id="listaPros"></div>`;

  const err   = cont.querySelector("#prosErr");
  const aviso = cont.querySelector("#prosOk");
  const CAMPOS = ["npNom","npApe","npEmp","npEvt","npMail","npTel","npNotas"];

  /** La tabla y el selector de eventos, que son lo único que cambia al filtrar. */
  function pintarLista(){
    const ps = prospectosVisibles();
    const eventos = eventosConocidos();
    cont.querySelector("#prosCuenta").textContent = `${ps.length} registro(s)`;

    const sel = cont.querySelector("#fEvento");
    sel.style.display = eventos.length ? "" : "none";
    sel.innerHTML = `<option value="">Todos los eventos</option>` + eventos.map(e =>
      `<option value="${esc(e)}"${e === filtroPros.evento ? " selected" : ""}>${esc(e)}</option>`).join("");

    cont.querySelector("#listaPros").innerHTML = ps.length ? `<table class="data">
      <thead><tr><th>Capturado</th><th>Nombre</th><th>Compañía</th><th>Correo</th>
        <th>Teléfono</th><th>Evento</th>${puedeVerTodo() ? "<th>Capturó</th>" : ""}
        <th>Estado</th><th></th></tr></thead>
      <tbody>${ps.map(p => `<tr data-p="${p.id}">
        <td class="nowrap">${esc(fechaCorta(String(p.fecha).slice(0,10)))}</td>
        <td><b>${esc(nombreProspecto(p))}</b></td>
        <td>${esc(p.compania || "—")}</td>
        <td>${esc(p.email)}</td>
        <td class="nowrap">${esc(p.telefono)}</td>
        <td>${esc(p.evento || "—")}</td>
        ${puedeVerTodo() ? `<td class="nowrap">${esc(p.capturadoPor || "—")}</td>` : ""}
        <td class="nowrap">${p.clienteId
          ? `<span class="pill" style="background:var(--ok-soft);color:var(--ok)">En cartera</span>`
          : `<span class="hint">Sin trabajar</span>`}</td>
        <td class="nowrap">
          ${!p.clienteId && puedeVer("clientes")
            ? `<button class="btn sm primary" data-pasar="${p.id}">Pasar a la cartera</button>` : ""}
          ${p.clienteId && puedeVer("clientes")
            ? `<button class="btn sm" data-vercli="${p.id}">Ver cliente</button>` : ""}
          <button class="btn sm" data-editp="${p.id}">Editar</button>
          <button class="btn sm danger" data-delp="${p.id}">Borrar</button></td>
      </tr>`).join("")}</tbody></table>`
      : `<div class="vacio">${state.prospectos.length
          ? "Ningún registro coincide con la búsqueda."
          : "Todavía no hay registros.<br>El primero se levanta con el formulario de arriba."}</div>`;

    const pros = id => state.prospectos.find(x => x.id === id);
    cont.querySelectorAll("[data-pasar]").forEach(b =>
      b.onclick = () => pasarACartera(pros(b.dataset.pasar)));
    cont.querySelectorAll("[data-vercli]").forEach(b =>
      b.onclick = () => abrirCliente(pros(b.dataset.vercli).clienteId));
    cont.querySelectorAll("[data-editp]").forEach(b =>
      b.onclick = () => editarProspecto(pros(b.dataset.editp), pintarLista));
    cont.querySelectorAll("[data-delp]").forEach(b => b.onclick = () => {
      const p = pros(b.dataset.delp);
      if (!confirm(`¿Borrar el registro de "${nombreProspecto(p)}"?`)) return;
      state.prospectos = state.prospectos.filter(x => x.id !== p.id);
      guardar(); pintarLista();
    });
  }
  pintarLista();

  cont.querySelector("#bGuardarPros").onclick = () => {
    const nuevo = leerProspecto(cont, "np", err, {
      capturadoPor: miNombre(), fecha: ahoraLocal(), createdAt: new Date().toISOString()
    });
    if (!nuevo) return;

    // En un stand es fácil apuntar dos veces a la misma persona.
    const repetido = state.prospectos.find(x => x.email && x.email === nuevo.email);
    if (repetido && !confirm(
        `Ya hay un registro con el correo ${nuevo.email} (${nombreProspecto(repetido)}).\n\n` +
        `¿Guardar de todos modos?`)) return;

    state.prospectos.push(nuevo);
    ultimoEvento = nuevo.evento;      // en una expo se capturan decenas seguidos
    guardar();

    CAMPOS.forEach(id => {
      const el = cont.querySelector("#" + id);
      if (el) el.value = id === "npEvt" ? ultimoEvento : "";
    });
    err.innerHTML = "";
    aviso.textContent = `Guardado: ${nombreProspecto(nuevo)}.`;
    pintarLista();
    cont.querySelector("#npNom").focus();
  };

  cont.querySelector("#bKiosco").onclick = abrirKiosco;

  cont.querySelector("#bLimpiarPros").onclick = () => {
    CAMPOS.forEach(id => { const el = cont.querySelector("#" + id); if (el) el.value = ""; });
    err.innerHTML = ""; aviso.textContent = "";
    cont.querySelector("#npNom").focus();
  };

  cont.querySelector("#qPros").oninput = e => { filtroPros.q = e.target.value; pintarLista(); };
  cont.querySelector("#fEvento").onchange = e => { filtroPros.evento = e.target.value; pintarLista(); };

  cont.querySelector("#bExpPros").onclick = () => {
    const cab = ["Fecha","Nombre","Apellido","Compañía","Correo","Teléfono","Evento",
                 "Capturó","En cartera","Notas"];
    descargar(`prospectos-${hoyISO()}.csv`, toCSV([cab].concat(prospectosVisibles().map(p =>
      [p.fecha, p.nombre, p.apellido, p.compania, p.email, p.telefono, p.evento,
       p.capturadoPor, p.clienteId ? "Sí" : "No", p.notas]))), "text/csv");
  };
}

/* ----- Modo tableta: la pantalla que se le pone enfrente al cliente ----- */

let despierto = null;      // para que la tableta no se apague sola en el stand

/**
 * El modo tableta sobrevive a una recarga.
 *
 * En un stand, el cliente arrastra la pantalla hacia abajo y el navegador
 * recarga; si al volver apareciera el CRM, quedaría la cartera del hotel a la
 * vista de quien pasara. Por eso se apunta aquí y se vuelve a entrar solo.
 */
const KIOSCO_CFG = "crm-hotel-kiosco";

const kioscoGuardado = () => {
  try{
    const c = JSON.parse(localStorage.getItem(KIOSCO_CFG) || "null");
    return c && typeof c === "object" ? c : null;
  }catch(e){ return null; }
};

/** Antes de entregar la tableta se confirma de qué evento es y quién la trae. */
function abrirKiosco(){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Modo tableta</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note">La pantalla se llena completa con el formulario. El cliente
          <b>no ve las pestañas, ni la cartera, ni lo que capturaron otros</b>: sólo sus
          propios datos, y en cuanto los manda la pantalla se limpia para el que sigue.</div>
        <div class="grid">
          <div class="full"><label class="lbl">Evento</label>
            <input class="field" id="kEvt" value="${esc(ultimoEvento)}" list="listaEventosK"
              placeholder="Expo Salud 2026">
            <div class="hint">Se le pone a todo lo que se capture en esta sesión. Se puede dejar vacío.</div></div>
          <div class="full"><label class="lbl">Los registros quedan a nombre de</label>
            ${selectEjecutivo(miNombre(), "kEje")}
            <div class="hint">Quien está atendiendo el stand.</div></div>
        </div>
        <datalist id="listaEventosK">${eventosConocidos().map(e =>
          `<option value="${esc(e)}">`).join("")}</datalist>
        <div class="note warn" style="margin-top:14px"><b>Para salir</b> hay que mantener
          pulsada la esquina de arriba a la derecha dos segundos. Así nadie se sale de
          curioso, pero tampoco hay otra contraseña que recordar.</div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOk">Entregar la tableta</button></div>
    </div>`);

  ov.querySelector("#bOk").onclick = () => {
    ultimoEvento = ov.querySelector("#kEvt").value.trim();
    const quien = ov.querySelector('[name="kEje"]').value.trim();
    ov.remove();
    entrarKiosco(ultimoEvento, quien);
  };
}

function entrarKiosco(evento, quien){
  // Pantalla completa de verdad donde se pueda: en una tableta quita la barra
  // del navegador, y con ella el botón de atrás y la dirección.
  try{
    const el = document.documentElement;
    const pedir = el.requestFullscreen || el.webkitRequestFullscreen;
    if (pedir) Promise.resolve(pedir.call(el)).catch(() => {});
  }catch(e){}
  try{
    if (navigator.wakeLock && navigator.wakeLock.request)
      navigator.wakeLock.request("screen").then(w => { despierto = w; }).catch(() => {});
  }catch(e){}

  try{ localStorage.setItem(KIOSCO_CFG, JSON.stringify({ evento, quien })); }catch(e){}

  const caja = document.createElement("div");
  caja.id = "kiosco";
  document.body.appendChild(caja);
  document.body.classList.add("con-kiosco");
  document.body.style.overflow = "hidden";
  pintarKiosco(caja, evento, quien);
  ponerSalida(caja);
}

function salirKiosco(){
  try{ localStorage.removeItem(KIOSCO_CFG); }catch(e){}
  const caja = document.getElementById("kiosco");
  if (caja) caja.remove();
  document.querySelectorAll(".k-salir,.k-saliendo").forEach(x => x.remove());
  document.body.classList.remove("con-kiosco");
  document.body.style.overflow = "";
  try{ if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  try{ if (despierto){ despierto.release(); despierto = null; } }catch(e){}
  render();
}

/** El botón de salida: hay que mantenerlo pulsado, no basta con tocarlo. */
function ponerSalida(caja){
  const b = document.createElement("button");
  b.className = "k-salir";
  b.type = "button";
  b.textContent = "✕";
  b.title = "Mantén pulsado para salir";
  b.setAttribute("aria-label", "Mantener pulsado para salir del modo tableta");
  document.body.appendChild(b);

  let reloj = null, pista = null;
  const suelta = () => {
    clearTimeout(reloj); reloj = null;
    if (pista){ pista.remove(); pista = null; }
  };
  b.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    pista = document.createElement("div");
    pista.className = "k-saliendo";
    pista.textContent = "Sigue pulsando para salir…";
    document.body.appendChild(pista);
    reloj = setTimeout(() => { suelta(); salirKiosco(); }, 2000);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(e => b.addEventListener(e, suelta));
  caja.dataset.conSalida = "sí";
}

/**
 * Guarda lo que llenó el cliente.
 *
 * Los reclamos van en grande y en su idioma, no en el del sistema. Y un correo
 * repetido aquí NO se pregunta: la pregunta diría el nombre de quien lo capturó
 * antes, y eso es un dato de otra persona en una pantalla que cualquiera está
 * mirando. Se guarda y el equipo lo depura después.
 */
function mandarKiosco(caja, err, evento, quien){
  const val = id => caja.querySelector("#" + id).value.trim();
  const marca = id => caja.querySelector("#" + id).classList.add("err");
  const nombre = val("kNom"), apellido = val("kApe");
  const email = val("kMail").toLowerCase(), telefono = val("kTel");
  const faltan = [];

  caja.querySelectorAll("input").forEach(i => i.classList.remove("err"));
  if (!nombre){   faltan.push("Falta su nombre.");   marca("kNom"); }
  if (!apellido){ faltan.push("Falta su apellido."); marca("kApe"); }
  if (!email){ faltan.push("Falta su correo electrónico."); marca("kMail"); }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    faltan.push("Revise el correo electrónico, parece que le falta algo."); marca("kMail");
  }
  if (!telefono){ faltan.push("Falta su número de teléfono."); marca("kTel"); }
  else if (telefono.replace(/\D/g,"").length < 10){
    faltan.push("El teléfono debe llevar 10 dígitos."); marca("kTel");
  }

  if (faltan.length){
    err.innerHTML = `<div class="k-err"><b>Nos falta un dato:</b>
      <ul>${faltan.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    const primero = caja.querySelector("input.err");
    if (primero) primero.focus();
    err.scrollIntoView({ block:"center", behavior:"smooth" });
    return;
  }

  state.prospectos.push(saneaProspecto({
    nombre, apellido, email, telefono, compania: val("kEmp"),
    evento, capturadoPor: quien, fecha: ahoraLocal(),
    notas: "Lo llenó el cliente en la tableta.",
    createdAt: new Date().toISOString()
  }));
  guardar();
  graciasKiosco(caja, nombre, evento, quien);
}

function graciasKiosco(caja, nombre, evento, quien){

  caja.innerHTML = `

      <div class="k-gracias">
        <div class="k-tick" aria-hidden="true">✓</div>

  const reloj = setTimeout(seguir, 9000);
}

   CONFIRMACIONES DE HOSPEDAJE

/** Sello de "ya se mandó", para la carta de un huésped o el enlace de un convenio. */
function selloEnvio(g){
  if (!g.enviado)
    return `<span class="pill" title="Todavía no se manda desde aquí">Sin enviar</span>`;
  const e = g.enviado;
  return `<span class="pill good" title="Enviada por ${esc(VIAS[e.via])} el ${esc(fechaHora(e.fecha))}` +
    `${e.quien ? " por " + esc(e.quien) : ""}">✓ ${esc(VIAS[e.via])} · ${esc(fechaCorta(e.fecha))}</span>`;
}

let soloPendientes = false;
let seleccion = new Set();

/**
 * Marca varias cartas de una vez.
 *
 * Al estrenar el indicador, todo lo mandado antes aparece como pendiente y
 * corregirlo huésped por huésped es media tarde. Se pide la fecha porque el
 * envío fue otro día: poner la de hoy sería una constancia falsa.
 */
function marcarVarias(ids, via){
  const gs = ids.map(id => state.huespedes.find(x => x.id === id)).filter(Boolean);
  if (!gs.length) return;
  const dia = prompt(`¿Qué día se enviaron estas ${gs.length} cartas por ${VIAS[via]}?\n\n` +
                     "Formato AAAA-MM-DD. Déjalo como está si fue hoy.", hoyISO());
  if (dia === null) return;
  const d = String(dia).trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || isNaN(Date.parse(d + "T12:00:00"))){
    alert(`"${d}" no es una fecha válida. Se esperaba algo como ${hoyISO()}.`);
    return;
  }
  // Mediodía para que el cambio de huso no la corra al día anterior.
  const fecha = new Date(d + "T12:00:00").toISOString();
  for (const g of gs) g.enviado = { fecha, via, quien: correoSesion() };
  seleccion.clear();
  guardar(); render();
}

function desmarcarVarias(ids){
  const gs = ids.map(id => state.huespedes.find(x => x.id === id)).filter(Boolean);
  if (!gs.filter(g => g.enviado).length){ alert("Ninguna de las seleccionadas está marcada."); return; }
  if (!confirm(`¿Quitar la marca de enviada a ${gs.length} carta(s)?`)) return;
  for (const g of gs) g.enviado = null;
  seleccion.clear();
  guardar(); render();
}


function renderConfirmaciones(){
  const cont = document.getElementById("tblConfirm");
  const todos = [...state.huespedes].sort((a,b) =>
    String(a.llegada).localeCompare(String(b.llegada)) ||
    nombreCompleto(a).localeCompare(nombreCompleto(b), "es"));
  const enviadas = todos.filter(g => g.enviado).length;
  const gs = soloPendientes ? todos.filter(g => !g.enviado) : todos;
  const visibles = new Set(gs.map(g => g.id));
  for (const id of [...seleccion]) if (!visibles.has(id)) seleccion.delete(id);
  const sel = [...seleccion];

  const cab = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b style="font-size:15px">Cartas de confirmación</b>
      <span class="hint">${todos.length} huésped(es) · una carta por huésped${
        todos.length ? ` · <b>${enviadas} de ${todos.length} enviadas</b>` : ""}</span>
      ${todos.length && enviadas < todos.length
        ? `<button class="btn sm${soloPendientes ? " primary" : ""}" id="bPend">${
             soloPendientes ? "Ver todas" : `Sólo pendientes (${todos.length - enviadas})`}</button>` : ""}
      <span style="flex:1"></span>
      <button class="btn primary" id="bImpHuesp">Importar huéspedes</button>
      <button class="btn" id="bAddHuesp">+ Capturar uno</button>
      ${todos.length ? `<button class="btn" id="bImprimirTodas">Imprimir ${
          soloPendientes ? "las pendientes" : "todas"}</button>
        <button class="btn danger" id="bLimpiarHuesp">Vaciar lista</button>` : ""}
    </div>` + (sel.length ? `
    <div class="note" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b>${sel.length} seleccionada(s)</b>
      <span class="hint">Marcarlas como enviadas por:</span>
      <button class="btn sm" id="bMarcaCorreo">Correo</button>
      <button class="btn sm wa" id="bMarcaWa" title="WhatsApp" aria-label="WhatsApp">${ICONO_WA}</button>
      <span style="flex:1"></span>
      <button class="btn sm" id="bDesmarca">Quitar la marca</button>
      <button class="btn sm" id="bNada">Deseleccionar</button>
    </div>` : "");

  if (!todos.length){
    cont.innerHTML = cab + `<div class="vacio">Todavía no hay huéspedes cargados.<br>
      Importa un <b>.xlsx</b> o un CSV: se genera una carta por cada renglón,
      aunque dos huéspedes compartan habitación.</div>`;
  } else if (!gs.length){
    cont.innerHTML = cab + `<div class="vacio">No queda ninguna pendiente:
      las ${todos.length} cartas ya se enviaron.</div>`;
  } else {
    cont.innerHTML = cab + `<table class="data">
      <thead><tr><th style="width:30px"><input type="checkbox" id="selTodas"
          title="Seleccionar todas las de la lista"${sel.length === gs.length ? " checked" : ""}></th>
        <th>Huésped</th><th>Reservación</th><th>Llegada</th><th>Salida</th>
        <th class="num">Noches</th><th>Empresa</th><th>Envío</th><th></th></tr></thead>
      <tbody>${gs.map(g => `<tr class="row-link" data-g="${g.id}">
        <td><input type="checkbox" data-sel="${g.id}"${seleccion.has(g.id) ? " checked" : ""}
             aria-label="Seleccionar a ${esc(nombreCompleto(g))}"></td>
        <td><b>${esc(nombreCompleto(g))}</b></td>
        <td>${esc(g.reservacion || "—")}</td>
        <td class="nowrap">${esc(fechaCorta(g.llegada))}</td>
        <td class="nowrap">${esc(fechaCorta(g.salida))}</td>
        <td class="num">${esc(nochesDe(g) === "" ? "—" : nochesDe(g))}</td>
        <td>${esc(g.empresa || "—")}</td>
        <td class="nowrap">${selloEnvio(g)}</td>
        <td class="nowrap">
          <button class="btn sm" data-vercarta="${g.id}">Ver carta</button>
          <button class="btn sm" data-mail="${g.id}" ${g.email ? "" : "disabled"}>Correo</button>
          <button class="btn sm wa" data-wa2="${g.id}" ${g.telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>
        </td></tr>`).join("")}</tbody></table>`;
  }

  const bP = cont.querySelector("#bPend");
  if (bP) bP.onclick = () => { soloPendientes = !soloPendientes; seleccion.clear(); render(); };

  cont.querySelectorAll("[data-sel]").forEach(ch => ch.addEventListener("click", e => {
    e.stopPropagation();            // la casilla no abre la ficha del huésped
    if (ch.checked) seleccion.add(ch.dataset.sel); else seleccion.delete(ch.dataset.sel);
    render();
  }));
  const st = cont.querySelector("#selTodas");
  if (st) st.onclick = e => {
    e.stopPropagation();
    seleccion = st.checked ? new Set(gs.map(g => g.id)) : new Set();
    render();
  };
  const bmc = cont.querySelector("#bMarcaCorreo");
  if (bmc){
    bmc.onclick = () => marcarVarias(sel, "correo");

    cont.querySelector("#bDesmarca").onclick = () => desmarcarVarias(sel);
    cont.querySelector("#bNada").onclick = () => { seleccion.clear(); render(); };

  if (bT) bT.onclick = () => verConfirmacion(null, gs.map(g => g.id));
  const bL = cont.querySelector("#bLimpiarHuesp");
  if (bL) bL.onclick = () => {
    if (!confirm(`¿Vaciar la lista de ${todos.length} huésped(es)? Las cartas ya impresas no se tocan.`)) return;
    state.huespedes = []; soloPendientes = false; seleccion.clear(); guardar(); render();
  };
  cont.querySelectorAll("tr[data-g]").forEach(tr => tr.addEventListener("click", e => {
    const v = e.target.closest("[data-vercarta]"), m = e.target.closest("[data-mail]"), w = e.target.closest("[data-wa2]");
    if (v){ e.stopPropagation(); verConfirmacion(v.dataset.vercarta); return; }
    if (m){ e.stopPropagation(); enviarConfirmacion(m.dataset.mail, "correo"); return; }
    if (w){ e.stopPropagation(); enviarConfirmacion(w.dataset.wa2, "whatsapp"); return; }
    editarHuesped(tr.dataset.g);
  }));
}

/** Arma el cuerpo de una carta. Se reutiliza para ver una o imprimir todas. */
function cartaConfirmacion(g){
  const h = state.ajustes.hotel, t = state.ajustes.textos;
  const n = nochesDe(g);
  const V = txt => String(txt || "")
    .replace(/\{\{HOTEL\}\}/g, h.nombre)
    .replace(/\{\{CIUDAD\}\}/g, h.ciudad)
    .replace(/\{\{HUESPED\}\}/g, nombreCompleto(g) || "____________________")
    .replace(/\{\{RESERVACION\}\}/g, g.reservacion || "")
    .replace(/\{\{LLEGADA\}\}/g, fechaTexto(g.llegada))
    .replace(/\{\{SALIDA\}\}/g, fechaTexto(g.salida))
    .replace(/\{\{NOCHES\}\}/g, n === "" ? "" : String(n));

  const campo = (etq, val) => `<div><i>${esc(etq)}</i> <b>${esc(val || "____________________")}</b></div>`;

  return `
    <div class="doc-hotel">
      ${h.logo ? `<img class="doc-logo" src="${esc(h.logo)}" alt="${esc(h.nombre)}">`

/** Una carta, o varias en lote si se pasa una lista de ids. */
function verConfirmacion(id, lote){
  const ids = lote && lote.length ? lote : [id];
  const gs = ids.map(x => state.huespedes.find(g => g.id === x)).filter(Boolean);
  if (!gs.length) return;
  const varias = gs.length > 1;
  const h = state.ajustes.hotel;
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>${varias ? `${gs.length} cartas de confirmación` : "Carta de confirmación"}</h2>
        <button class="btn" data-close>✕</button>
      </div>
      <div class="doc-body">
        ${gs.map(g => `<div class="hoja" style="position:relative">
            ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
            <div class="doc-contenido">${cartaConfirmacion(g)}</div>
          </div>`).join("")}
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrintC">${varias ? "Imprimir las " + gs.length : "Imprimir"}</button>
        <button class="btn" id="bPdfC">${varias ? `Descargar las ${gs.length} en un PDF` : "Descargar PDF"}</button>
        ${!varias ? selloEnvio(gs[0]) : ""}
        <div class="spacer"></div>
        ${!varias ? `<button class="btn" id="bMailC" ${gs[0].email ? "" : "disabled"}>Enviar por correo</button>
          <button class="btn wa" id="bWaC" ${gs[0].telefono ? "" : "disabled"} title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrintC").onclick = () => {
    fijarPagina(true);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);
  };
  ov.querySelector("#bPdfC").onclick = async e => {
    const b = e.currentTarget, txt = b.textContent;
    b.disabled = true; b.textContent = "Generando…";
    try{
      descargarBlob(new Blob([await pdfDeHuespedes(gs)], { type:"application/pdf" }), nombrePdf(gs));
    }catch(err){
      alert("No se pudo generar el PDF: " + err.message +
            "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }
    b.disabled = false; b.textContent = txt;
  };

  const bm = ov.querySelector("#bMailC");
  if (bm) bm.onclick = () => enviarConfirmacion(gs[0].id, "correo");
  const bw = ov.querySelector("#bWaC");
  if (bw) bw.onclick = () => enviarConfirmacion(gs[0].id, "whatsapp");
}

/** Arma el PDF de una o varias confirmaciones sin abrir ninguna ventana. */
async function pdfDeHuespedes(gs){
  const h = state.ajustes.hotel;
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);
  const caja = document.createElement("div");
  caja.innerHTML = gs.map(g => `<div class="hoja" style="position:relative">
      ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
      <div class="doc-contenido">${cartaConfirmacion(g)}</div></div>`).join("");
  const imgs = [];
  for (const hoja of caja.querySelectorAll(".hoja")) imgs.push(await rasterizarHoja(hoja));
  return pdfDesdeImagenes(imgs);
}

/* ==========================================================================
   LA HOJA DEL CERTIFICADO

   Es la única hoja del CRM que va A SANGRE: la foto del servicio llega hasta
   la orilla del papel, como en el PowerPoint del hotel. Por eso no usa el
   margen de las demás y se arma con medidas absolutas.

   Las medidas salen de medir el archivo que se hacía a mano: hoja vertical,
   el título en una columna a la izquierda, la firma a media hoja, las
   condiciones abajo y el folio chiquito en la esquina. Aquí van en píxeles de
   hoja carta a 96 dpi, que es el lienzo con el que trabaja el rasterizador.
   ========================================================================== */

/* El fondo tiene que ser data URL: dentro del SVG que rasteriza la hoja no se
   resuelven direcciones externas. Se trae una vez por tipo y se recuerda. */
const fondosCert = new Map();
/* Y si no se pudo traer, POR QUÉ. Antes el fallo se tragaba en silencio y la
   hoja salía con el morado del hotel sin decir nada: se veía igual que «todavía
   no subo las fotos», que es otra cosa completamente distinta. Guardar el
   motivo convierte un misterio en una foto de pantalla. */
const motivosCert = new Map();
/* Cuándo se intentó la última vez que falló. Un fallo NO es para siempre: si
   las fotos se publican con la pestaña abierta, a los treinta segundos se
   vuelve a probar en vez de quedarse con el morado hasta que alguien recargue. */
const reintentoCert = new Map();
const ESPERA_FONDO_MS = 30000;

/**
 * Una pasada: pide el archivo y lo convierte a data URL, o explica por qué no.
 *
 * `modo` es el trato con el almacén del navegador. Y ahí estaba el defecto que
 * reportó Marco: esto pedía con `cache:"force-cache"`, que quiere decir «usa lo
 * que tengas guardado, sin volver a preguntar» —y el navegador guarda TAMBIÉN
 * las respuestas 404—. Él abrió Certificados cuando la función ya existía pero
 * las cinco fotos todavía no se publicaban; ese 404 se le quedó guardado y
 * desde entonces se lo devolvía su propio navegador, sin preguntarle nunca más
 * al servidor. Ni recargando se componía.
 */
async function traerFondo(ruta, modo){
  try{
    const r = await fetch(ruta, modo ? { cache: modo } : undefined);
    if (!r.ok) return { motivo: "el servidor contestó " + r.status };
    const blob = await r.blob();
    if (!/^image\//.test(blob.type))
      return { motivo: "lo que llegó no es una imagen (" + (blob.type || "sin tipo") + ")" };
    const dato = await new Promise((ok, mal) => {
      const fr = new FileReader();
      fr.onload = () => ok(String(fr.result));
      fr.onerror = () => mal(new Error("no se pudo leer el archivo"));
      fr.readAsDataURL(blob);
    });
    return { dato };
  }catch(e){ return { motivo: (e && e.message) || "no se pudo pedir el archivo" }; }
}

async function fondoCertificado(tipo){
  const ruta = infoTipoCert(tipo).imagen;
  if (fondosCert.get(ruta)) return fondosCert.get(ruta);
  /* Falló hace poco: no se machaca al servidor en cada repintado. */
  if (fondosCert.has(ruta) && Date.now() - (reintentoCert.get(ruta) || 0) < ESPERA_FONDO_MS)
    return null;

  const uno = await traerFondo(ruta, null);
  /* `null`, nunca `undefined`: «no hay foto» es una respuesta, y quien la
     recibe la compara. */
  let dato = uno.dato || null, motivo = uno.motivo;
  /* Segundo intento SALTÁNDOSE el almacén del navegador. Es lo que cura solo a
     quien traiga un 404 viejo pegado, sin que tenga que limpiar nada ni
     enterarse de que esto existe. */
  if (!dato){
    const otra = await traerFondo(ruta, "reload");
    if (otra.dato) dato = otra.dato; else motivo = otra.motivo || motivo;
  }

  fondosCert.set(ruta, dato);
  motivosCert.set(ruta, dato ? "" : (motivo || "no se encontró " + ruta));
  reintentoCert.set(ruta, dato ? 0 : Date.now());
  return dato;
}

/** Por qué no se pudo traer la foto de este tipo. Vacío si sí se trajo. */
const motivoFondoCert = tipo => motivosCert.get(infoTipoCert(tipo).imagen) || "";
/** La dirección exacta que intentó, para poder abrirla y salir de dudas. */
const rutaFondoCert = tipo => {
  try{ return new URL(infoTipoCert(tipo).imagen, location.href).href; }
  catch(e){ return infoTipoCert(tipo).imagen; }
};

/**
 * El aviso de lo que le falta a esta hoja para estar completa.
 *
 * Son las dos cosas que no se ven hasta que el certificado ya está impreso y
 * en la mano de un huésped: que la foto no cargó, y que nadie capturó quién
 * firma —y entonces el renglón de la firma sale en blanco—.
 */
function pendientesCert(tipo){
  const faltas = [];
  const porque = motivoFondoCert(tipo);
  if (porque) faltas.push({ que:"foto",
    texto:"No se pudo traer la imagen de este tipo de certificado: " + porque +
          ". Mientras tanto sale el fondo del hotel.",
    liga: rutaFondoCert(tipo) });
  if (!String(state.ajustes.hotel.director || "").trim()) faltas.push({ que:"firma",
    texto:"Falta quién firma: el renglón de la firma va a salir en blanco. " +
          "Se captura una sola vez en Ajustes → Datos del hotel." });
  return faltas;
}

/** El aviso pintado, con su botón a Ajustes. `id` es para enganchar el botón. */
const avisoPendientesCert = (tipo, id) => {
  const f = pendientesCert(tipo);
  if (!f.length) return "";
  return `<div class="note warn" style="margin-top:10px">
    ${f.map(x => `<div>${esc(x.texto)}${x.liga
      ? `<br><a href="${esc(x.liga)}" target="_blank" rel="noopener">${esc(x.liga)}</a>` : ""}</div>`).join("")}
    ${f.some(x => x.que === "firma")
      ? `<button class="btn sm" id="${id}" style="margin-top:8px">Ir a Ajustes</button>` : ""}
  </div>`;
};

/**
 * El certificado, listo para rasterizar o para enseñar en pantalla.
 *
 * `fondo` es el data URL de la foto, o null. Sin foto no se ve roto: queda el
 * morado del hotel con su monograma, que es un certificado perfectamente
 * presentable mientras llegan las imágenes.
 */
function cuerpoCertificado(c, fondo){
  const h = state.ajustes.hotel;
  const t = infoTipoCert(c.tipo);
  const con = contactoCert(c);
  const vig = vigenciaCert(c);
  /* El título va en dos renglones con una raya en medio, como el machote:
     arriba el servicio, abajo «DE CORTESÍA». Se captura como un solo texto
     con salto de línea, así que quien lo corrija no tiene que pelearse con
     dos campos. */
  const lineas = tituloCert(c).split("\n").map(x => x.trim()).filter(Boolean);
  const sinFoto = `background:radial-gradient(120% 120% at 70% 20%, #5b4178 0%, ` +
                  `${MORADO_QUARTZ} 60%, #2b1c3e 100%)`;
  return `
    <div class="cert">
      <div class="cert-foto" style="${fondo
        ? `background-image:url('${fondo}');background-size:cover;background-position:center`
        : sinFoto}">
        ${t.marca ? `<div class="cert-marca">${esc(t.marca)}</div>` : ""}
        <div class="cert-panel">
          <div class="cert-t1">${esc(lineas[0] || "")}</div>
          ${lineas.length > 1 ? `<div class="cert-raya"></div>
            <div class="cert-t2">${lineas.slice(1).map(esc).join("<br>")}</div>` : ""}
        </div>
        ${c.paraQuien ? `<div class="cert-cliente">${esc(c.paraQuien)}</div>` : ""}
      </div>

      <div class="cert-abajo">
        <div class="cert-agua">${monogramaQ(MORADO_QUARTZ)}</div>
        <div class="cert-marcaHotel">${h.logo
          ? `<img src="${esc(h.logo)}" alt="">` : logoQuartz(MORADO_QUARTZ)}</div>
        <div class="cert-firma">
          <div class="cert-f1">${esc(h.director || "")}</div>
          <div class="cert-f2">${esc(h.puestoDirector || "")}</div>
        </div>
        <div class="cert-pie">
          ${vig ? `<b>Fecha de validez: ${esc(vig)}</b><br>` : ""}
          ${esc(condicionesCert(c))}
          ${(con.email || con.tel) ? `<br>${esc(con.email)}${
            con.email && con.tel ? " " : ""}${con.tel ? "Cel. " + esc(con.tel) : ""}` : ""}
        </div>
        <div class="cert-folio">No. Folio: <b>${esc(c.folio || "")}</b></div>
      </div>
    </div>`;
}

/** El PDF: una sola hoja, a sangre, sin librerías. */
async function pdfDeCertificado(c){
  const caja = document.createElement("div");
  caja.innerHTML = cuerpoCertificado(c, await fondoCertificado(c.tipo));
  return pdfDesdeImagenes([await rasterizarHoja(caja.firstElementChild, { sangrada:true })]);
}

const nombrePdfCert = c =>
  "Certificado-" + nombreArchivo([c.folio, infoTipoCert(c.tipo).corto,
                                  c.paraQuien].filter(Boolean).join(" ")) + ".pdf";

/* --------------------------------------------------------------------------
   El convenio no cabe en una hoja: hay que paginarlo

   La confirmación es una carta de una página, así que basta con rasterizarla
   tal cual. El convenio son tres o cuatro, y el navegador sólo sabe partirlo
   al imprimir —no al dibujar—, así que aquí se hace a mano: se mide dónde
   termina cada bloque, se decide en cuál cortar sin partirlo a la mitad, se
   dibuja el documento entero de una vez y esa tira se reparte en hojas.
   -------------------------------------------------------------------------- */

const MM = 96 / 25.4;                        // milímetros a píxeles de pantalla
const MARGEN_X = Math.round(18 * MM);
const MARGEN_Y = Math.round(16 * MM);
const ALTO_UTIL = PX_ALTO - MARGEN_Y * 2;

/** Rasteriza el documento completo, de ancho fijo y alto libre. */
function rasterizarTira(html, alto){
  return new Promise((resolve, reject) => {
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    // Se arma como DOM y se serializa: dentro del SVG el contenido tiene que
    // ser XML bien formado, y el HTML escrito a mano —<br>, <img> sin cerrar—
    // no lo es. El serializador se encarga.
    // El papel va aparte de la envoltura: la tipografía base se hereda, pero si
    // se pusiera en el mismo elemento pisaría al tamaño propio de .doc-body y
    // el texto se acomodaría distinto de como se midió.
    const papel = document.createElement("div");
    papel.className = "doc-body";
    papel.style.cssText = `width:100%;margin:0;padding:0 ${MARGEN_X}px;` +
      `box-sizing:border-box;background:#fff`;
    papel.innerHTML = html;

    const envoltura = document.createElement("div");
    envoltura.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    envoltura.style.cssText = `width:${PX_ANCHO}px;height:${alto}px;background:#fff;` +
      `font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    const est = document.createElement("style");
    est.textContent = css;
    envoltura.appendChild(est);
    envoltura.appendChild(papel);

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PX_ANCHO}" height="${alto}">` +
      `<foreignObject width="100%" height="100%">` +
      new XMLSerializer().serializeToString(envoltura) + `</foreignObject></svg>`;

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = PX_ANCHO * ESCALA_PDF;
      cv.height = alto * ESCALA_PDF;
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv);
    };
    img.onerror = () => reject(new Error("Este navegador no pudo convertir el convenio a imagen."));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

/**
 * Dónde cortar. Se recorre bloque por bloque: si el siguiente ya no cabe en la
 * hoja, la hoja termina antes de él. Un bloque más alto que la hoja entera
 * —no debería haberlo— se deja pasar para no quedarse en un ciclo sin fin.
 */
function cortesDe(caja){
  const bloques = [...caja.children].filter(el => el.className !== "doc-agua");
  const cortes = [0];
  let inicio = 0;
  for (let i = 0; i < bloques.length; i++){
    const el = bloques[i];
    const arriba = el.offsetTop, abajo = arriba + el.offsetHeight;
    if (abajo - inicio <= ALTO_UTIL || arriba <= inicio) continue;
    // Un título no se queda solo al pie de una hoja con su texto en la siguiente.
    let corte = arriba;
    const previo = bloques[i-1];
    if (previo && /^H[23]$/.test(previo.tagName) && previo.offsetTop > inicio)
      corte = previo.offsetTop;
    cortes.push(corte);
    inicio = corte;
  }
  return cortes;
}

/** PDF de la carta-convenio, ya paginada. */
const pdfDeConvenio = (v, c) => pdfDeDocumento(cuerpoConvenio(v, c));

/**
 * Cualquier documento del hotel a PDF: convenio, contrato o lo que venga.
 *
 * Recibe el cuerpo ya armado en HTML y se encarga de lo de siempre —medir,
 * partir en hojas y rasterizar—, que no tiene nada que ver con qué documento
 * sea. Antes esto vivía dentro del convenio y había que copiarlo para reusarlo.
 */
async function pdfDeDocumento(cuerpo){
  const h = state.ajustes.hotel;
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  // Se mide con el documento colocado de verdad —fuera de la vista, pero con
  // el ancho real— porque de otro modo no hay alturas que consultar.
  // Se mide con la misma envoltura que después se dibuja —misma tipografía
  // base, mismo ancho, mismo .doc-body— o los renglones se acomodan distinto y
  // los cortes caen donde no deben.
  const medidor = document.createElement("div");
  medidor.style.cssText = `position:fixed;left:-10000px;top:0;width:${PX_ANCHO}px;` +
    `background:#fff;visibility:hidden;` +
    `font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
  medidor.innerHTML = `<div class="doc-body" style="width:100%;margin:0;` +
    `padding:0 ${MARGEN_X}px;box-sizing:border-box">` +
    `<div class="doc-contenido">${cuerpo}</div></div>`;
  document.body.appendChild(medidor);

  let cortes, alto, html;
  try{
    const cont = medidor.firstElementChild.firstElementChild;
    alto = Math.max(cont.scrollHeight, ALTO_UTIL);
    cortes = cortesDe(cont);
    html = `<div class="doc-contenido" style="position:relative">` +
           (agua ? `<div class="doc-agua">${agua}</div>` : "") +
           cuerpo + `</div>`;
  } finally { medidor.remove(); }

  const tira = await rasterizarTira(html, alto);

  const hojas = [];
  for (let i = 0; i < cortes.length; i++){
    const desde = cortes[i] * ESCALA_PDF;
    const hasta = Math.min((i + 1 < cortes.length ? cortes[i+1] : alto) * ESCALA_PDF, tira.height);
    const cv = document.createElement("canvas");
    cv.width = PX_ANCHO * ESCALA_PDF;
    cv.height = PX_ALTO * ESCALA_PDF;
    const g = cv.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
    const recorte = Math.min(hasta - desde, ALTO_UTIL * ESCALA_PDF);
    if (recorte > 0)
      g.drawImage(tira, 0, desde, cv.width, recorte, 0, MARGEN_Y * ESCALA_PDF, cv.width, recorte);
    hojas.push(cv.toDataURL("image/jpeg", 0.92));
  }
  return pdfDesdeImagenes(hojas);
}

const nombrePdfConvenio = (v, c) =>
  "Convenio-" + nombreArchivo([v.folio || "sin-folio", c && c.empresa].filter(Boolean).join(" ")) + ".pdf";

function nombrePdf(gs){
  if (gs.length === 1){
    const g = gs[0];
    return "Confirmacion-" + nombreArchivo([g.reservacion, nombreCompleto(g)].filter(Boolean).join(" ")) + ".pdf";
  }
  return `Confirmaciones-${gs.length}-${hoyISO()}.pdf`;
}

function mensajeConfirmacion(g){
  const h = state.ajustes.hotel;
  const n = nochesDe(g);
  return `Estimado(a) ${nombreCompleto(g)}:\n\n` +
    `Adjuntamos su carta de confirmación de hospedaje en ${h.nombre}.\n\n` +
    (g.reservacion ? `Reservación: ${g.reservacion}\n` : "") +
    (g.llegada ? `Llegada: ${fechaTexto(g.llegada)}\n` : "") +
    (g.salida ? `Salida: ${fechaTexto(g.salida)}\n` : "") +
    (n !== "" ? `Noches: ${n}\n` : "") +
    `\nCualquier duda, con gusto le atendemos.\n\n${h.nombre}\n` +
    (h.telReservaciones ? h.telReservaciones + "\n" : "") + (h.emailReservaciones || "");
}

/**
 * Ni mailto: ni wa.me admiten adjuntos, así que hay dos caminos: si el equipo
 * soporta compartir archivos, el PDF y el mensaje salen juntos por la hoja del
 * sistema; si no, se descarga el PDF y se abre la app con el mensaje listo.
 */
function enviarConfirmacion(id, via){
  const g = state.huespedes.find(x => x.id === id);
  if (!g) return;
  const h = state.ajustes.hotel;
  const n = nochesDe(g);
  if (via === "correo" && !g.email){ alert("Este huésped no tiene correo registrado."); return; }
  if (via === "whatsapp" && !g.telefono){ alert("Este huésped no tiene teléfono registrado."); return; }

  const asunto = `Confirmación de hospedaje · ${h.nombre}${g.reservacion ? " · Reservación " + g.reservacion : ""}`;
  const cuerpo = mensajeConfirmacion(g);
  const destino = via === "correo" ? "correo" : "WhatsApp";
  const archivo = nombrePdf([g]);

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Enviar por ${esc(destino)}</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="cuerpoEnvio">
        <p class="hint">Preparando el PDF de la carta…</p>
      </div>
      <div class="modal-foot"><div class="spacer"></div><button class="btn" data-close>Cerrar</button></div>
    </div>`);

  pdfDeHuespedes([g]).then(bytes => {
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" && navigator.canShare({ files:[file] });

    ov.querySelector("#cuerpoEnvio").innerHTML = puedeCompartir
      ? `<div class="note"><b>La carta ya está lista.</b> Al compartir, el PDF y el mensaje
           van juntos: elige ${esc(destino)} en la lista que abra el sistema.</div>
         <p><button class="btn ok" id="bCompartir" style="font-size:15px;padding:10px 16px">
            Compartir carta y mensaje</button></p>
         <p class="hint">¿Prefieres hacerlo a mano?</p>
         <p style="display:flex;gap:8px;flex-wrap:wrap">
           <button class="btn" id="bBajar">Descargar el PDF</button>
           <button class="btn" id="bAbrir">Abrir ${esc(destino)} con el mensaje</button></p>`
      : `<div class="note warn"><b>Este equipo no puede adjuntar archivos desde el navegador.</b>
           Ni el correo ni WhatsApp aceptan adjuntos por enlace, así que se hace en dos pasos:
           se descarga el PDF y lo adjuntas al abrir ${esc(destino)}.
           <br><br>En un celular sí sale todo junto de una vez.</div>
         <p><button class="btn ok" id="bBajarAbrir" style="font-size:15px;padding:10px 16px">
            Descargar el PDF y abrir ${esc(destino)}</button></p>
         <p class="hint">Se guardará como <b>${esc(archivo)}</b></p>`;

    const bajar = () => descargarBlob(blob, archivo);
    const abrir = () => {
      if (via === "correo")
        window.location.href = `mailto:${encodeURIComponent(g.email)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
      else window.open(waLink(g.telefono, cuerpo, ladaDe(g)), "_blank", "noopener");
      marcarEnviada(g.id, via);
    };

    const bc = ov.querySelector("#bCompartir");
    if (bc) bc.onclick = async () => {
      try{
        await navigator.share({ files:[file], text: cuerpo, title: asunto });
        marcarEnviada(g.id, via);
        ov.remove();
      }
      catch(err){ if (err && err.name !== "AbortError") alert("No se pudo compartir: " + err.message); }
    };
    const bb = ov.querySelector("#bBajar"); if (bb) bb.onclick = bajar;   // bajar no es enviar
    const ba = ov.querySelector("#bAbrir"); if (ba) ba.onclick = abrir;
    const bba = ov.querySelector("#bBajarAbrir");
    if (bba) bba.onclick = () => { bajar(); setTimeout(abrir, 600); ov.remove(); };
  }).catch(err => {
    ov.querySelector("#cuerpoEnvio").innerHTML =
      `<div class="note warn"><b>No se pudo generar el PDF aquí.</b> ${esc(err.message)}
        <br><br>Usa <i>Ver carta → Imprimir / Guardar PDF</i> y adjúntalo a mano.</div>
       <p><button class="btn" id="bAbrir2">Abrir ${esc(destino)} con el mensaje</button></p>`;
    ov.querySelector("#bAbrir2").onclick = () => {
      if (via === "correo")
        window.location.href = `mailto:${encodeURIComponent(g.email)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
      else window.open(waLink(g.telefono, cuerpo, ladaDe(g)), "_blank", "noopener");
      marcarEnviada(g.id, via);
    };
  });
}

function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function editarHuesped(id){
  const existente = id ? state.huespedes.find(g => g.id === id) : null;
  const g = existente || saneaHuesped({});
  const campos = CAMPOS_HUESPED.map(f => {
    const ancho = (f.key === "notas") ? " full" : "";
    const val = g[f.key] ?? "";
    const ctl = f.key === "notas"
      ? `<textarea class="field" name="notas">${esc(val)}</textarea>`
      : `<input class="field" type="${f.tipo === "fecha" ? "date" : "text"}" name="${f.key}" value="${esc(val)}">`;
    return `<div class="${ancho.trim()}"><label class="lbl">${esc(f.label)}</label>${ctl}</div>`;
  }).join("");

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${existente ? "Editar huésped" : "Nuevo huésped"}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body"><form id="fG"><div class="grid">${campos}</div>
        <p class="hint">Si dejas <b>Noches</b> en blanco se calcula con las fechas.</p></form>
        ${existente ? `<div class="note" style="margin:14px 0 0;display:flex;gap:10px;
            align-items:center;flex-wrap:wrap">
          <span>Carta de confirmación:</span> ${selloEnvio(g)}
          <span style="flex:1"></span>
          <button class="btn sm" id="bMarcaEnv" type="button">${
            g.enviado ? "Marcar como no enviada" : "Marcar como enviada"}</button>
        </div>
        <p class="hint" style="margin:6px 0 0">La marca se pone sola al mandarla desde aquí.
          Se puede corregir a mano: la aplicación abre tu correo o WhatsApp, pero no alcanza a
          ver si de verdad le diste enviar.</p>` : ""}</div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDelG">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkG">Guardar</button>
      </div>
    </div>`);

  const bME = ov.querySelector("#bMarcaEnv");
  if (bME) bME.onclick = () => {
    if (g.enviado){
      if (!confirm(`¿Quitar la marca de enviada de "${nombreCompleto(g)}"?`)) return;
      g.enviado = null; guardar(); render(); ov.remove(); editarHuesped(g.id);
      return;
    }
    const via = confirm(`¿Por dónde se envió la carta de "${nombreCompleto(g)}"?\n\n` +
      "Aceptar = correo\nCancelar = WhatsApp") ? "correo" : "whatsapp";
    marcarEnviada(g.id, via);
    ov.remove(); editarHuesped(g.id);
  };

  const form = ov.querySelector("#fG");
  form.querySelector('[name="nombre"]').focus();
  form.addEventListener("submit", e => { e.preventDefault(); ok(); });
  ov.querySelector("#bOkG").onclick = ok;
  const bd = ov.querySelector("#bDelG");
  if (bd) bd.onclick = () => {
    if (!confirm(`¿Eliminar a "${nombreCompleto(g)}" de la lista?`)) return;
    state.huespedes = state.huespedes.filter(x => x.id !== g.id);
    guardar(); render(); ov.remove();
  };

  function ok(){
    const fd = new FormData(form);
    const o = Object.assign({}, g);
    for (const f of CAMPOS_HUESPED) o[f.key] = (fd.get(f.key) ?? "").toString().trim();
    if (!o.nombre){ alert("El nombre del huésped es obligatorio."); return; }
    if (o.llegada && o.salida && o.salida < o.llegada){ alert("La salida no puede ser anterior a la llegada."); return; }
    if (existente) Object.assign(g, saneaHuesped(o));
    else { o.id = nuevoId("g"); o.createdAt = new Date().toISOString(); state.huespedes.push(saneaHuesped(o)); }
    guardar(); render(); ov.remove();
  }
}

/** Cambia de dueño todo lo que traiga un nombre: clientes y bitácora a la vez. */
function reasignarEjecutivo(de, a){
  const n = String(de || "").trim().toLowerCase();
  if (!n) return 0;
  let tocados = 0;
  state.clientes.forEach(c => {
    if (String(c.ejecutivo || "").trim().toLowerCase() === n){ c.ejecutivo = a; tocados++; }
  });
  state.actividades.forEach(x => {
    if (String(x.responsable || "").trim().toLowerCase() === n){ x.responsable = a; tocados++; }
  });
  if (tocados) guardar();
  return tocados;
}

      <div class="grid">${GRUPOS.map(g => `

        ${areaTexto("confCuerpo", "Párrafo principal", 90)}
        ${areaTexto("confConfirma", "Párrafo de confirmación", 80)}

      <div class="grid">
        <div><label class="lbl">Columna izquierda · título</label>
          <input class="field" data-t="recoveryCol1Titulo" value="${esc(t.recoveryCol1Titulo)}"></div>
        <div><label class="lbl">Columna derecha · título</label>
          <input class="field" data-t="recoveryCol2Titulo" value="${esc(t.recoveryCol2Titulo)}"></div>
        <div><textarea class="field mono" data-t="recoveryCol1" style="width:100%;min-height:170px">${esc(t.recoveryCol1)}</textarea></div>
        <div><textarea class="field mono" data-t="recoveryCol2" style="width:100%;min-height:170px">${esc(t.recoveryCol2)}</textarea></div>

      <p style="margin:18px 0 40px">

        <button class="btn" id="bResetTextos">Restaurar textos originales</button>

      <p class="hint" style="margin:0 0 40px">Versión <b>${esc(VERSION)}</b>.
        Si alguien del equipo ve algo distinto, compara este número: quiere decir que
