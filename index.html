    </div>`;

  const p = document.getElementById("panelAjustes");

  // Las filas de usuarios se pintan aquí, como el catálogo de habitaciones.
  const nombresCartera = [...new Set(state.clientes.map(c => c.ejecutivo).filter(Boolean))].sort();
  const cuerpoUsr = p.querySelector("#tUsr tbody");
  if (cuerpoUsr) cuerpoUsr.innerHTML = state.usuarios.map(u => `<tr data-u="${u.id}">
      <td><input class="field" data-uk="correo" value="${esc(u.correo)}" type="email"
            style="width:100%" autocomplete="off" spellcheck="false"></td>
      <td><input class="field" data-uk="nombre" value="${esc(u.nombre)}" list="listaEje"
            style="width:100%" placeholder="Como aparece en la cartera"></td>
      <td><select class="field" data-uk="rol" style="width:100%">${ROLES.map(r =>
            `<option value="${r.id}"${r.id === u.rol ? " selected" : ""}>${esc(r.name)}</option>`).join("")}</select>
        <div class="hint">${esc(infoRol(u.rol).ayuda)}</div></td>
      <td style="text-align:center"><input type="checkbox" data-uk="certificados"
            title="Puede emitir certificados de cortesía"${u.certificados ? " checked" : ""}></td>
      <td><button class="btn sm danger" data-delu="${u.id}">Quitar</button></td></tr>`).join("") +
    `<datalist id="listaEje">${nombresCartera.map(n => `<option value="${esc(n)}">`).join("")}</datalist>`;

  /* Se comprueba de verdad, preguntándole al servidor: que `folios.sql` no
     esté corrido era invisible hasta que algo salía mal. */
  (async () => {
    const caja = p.querySelector("#estadoFolios");
    if (!caja) return;
    if (!nubeActiva()){
      caja.innerHTML = `<div class="note warn">Este equipo no está conectado a la nube,
        así que no se puede comprobar el contador.</div>`;
      return;
    }
    caja.innerHTML = `<p class="hint">Preguntándole al servidor…</p>`;
    const anio = new Date().getFullYear();
    let alto = null;
    try{
      const filas = await api(`/rest/v1/crm_folios?tipo=eq.convenios&anio=eq.${anio}` +
        `&select=folio,numero&order=numero.desc&limit=1`);
      alto = (filas && filas[0]) || {};
    }catch(e){
      caja.innerHTML = `<div class="note warn"><b>El contador no está montado.</b>
        Mientras no lo esté, cada computadora cuenta con lo que tiene bajado, y dos que no
        ven lo mismo toman el mismo folio.<br><br>
        Se arregla corriendo <code>folios.sql</code> en el SQL Editor de Supabase, una vez.
        <p style="margin:10px 0 0"><button class="btn primary" type="button"
          onclick="panelCorrerSql('folios')">Montarlo ahora</button></p>
        <span class="hint">${esc(e.message)}</span></div>`;
      return;
    }
    caja.innerHTML = `<div class="note" style="border-left:3px solid var(--ok)">
      <b>El contador está montado y contestando.</b>
      ${alto.folio ? `El último convenio del hotel en ${anio} es el <b>${esc(alto.folio)}</b>;
        al siguiente que se firme le tocará el ${esc("CV-" + anio + "-" +
        String(Number(alto.numero) + 1).padStart(3, "0"))}.`
      : `Todavía no se ha apartado ningún folio de convenio en ${anio}.`}</div>`;
  })();

  /* Los departamentos que piden cosas a marketing, con su firmante. Se pintan
     por posición y no por id porque no tienen id: son dos palabras, no una
     entidad del CRM. El índice basta mientras no se repinte a media edición,
     que es lo mismo que hacen las filas de habitaciones. */
  const cuerpoJefes = p.querySelector("#tJefes tbody");
  if (cuerpoJefes) cuerpoJefes.innerHTML = h.jefes.map((j, i) => `<tr data-j="${i}">
      <td><input class="field" data-jk="depto" value="${esc(j.depto)}" style="width:100%"
            placeholder="Como lo conocen en el hotel"></td>
      <td><input class="field" data-jk="jefe" value="${esc(j.jefe)}" style="width:100%"
            placeholder="Nombre completo"></td>
      <td><button class="btn sm danger" data-delj="${i}">Quitar</button></td></tr>`).join("");

  /**
   * Los nombres que quedaron escritos y no son de nadie del equipo. Salen de
   * importaciones viejas o de los clientes de ejemplo. Mientras estén así, esos
   * clientes no aparecen en la pantalla de ningún ejecutivo, de modo que hay
   * que enseñarlos y dejar cambiarlos de dueño de un jalón.
   */
  function pintarHuerfanos(){
    const caja = p.querySelector("#huerfanos");
    if (!caja) return;
    const sueltos = nombresSinDuenio();
    if (!sueltos.length){
      caja.innerHTML = `<div class="note"><b>Todos los clientes tienen dueño.</b>
        Cada nombre escrito en la cartera corresponde a alguien de la tabla de arriba.</div>`;
      return;
    }
    const equipo = nombresEquipo();
    caja.innerHTML = `
      <h3 class="sec">Nombres que no son de nadie</h3>
      <div class="note warn"><b>Estos clientes no los ve ningún ejecutivo.</b>
        El nombre escrito en su ficha no coincide con nadie de la tabla de arriba.
        Escoja a quién se los pasa y guarde.</div>
      <div style="overflow:auto"><table class="data">
        <thead><tr><th>Nombre escrito</th><th class="num">Clientes</th>
          <th class="num">Actividades</th><th>Pasárselos a</th><th></th></tr></thead>
        <tbody>${sueltos.map(n => {
          const q = cuantoTiene(n);
          return `<tr>
            <td><b>${esc(n)}</b></td>
            <td class="num">${q.clientes}</td>
            <td class="num">${q.actividades}</td>
            <td><select class="field" data-dest="${esc(n)}" style="width:100%">
              <option value="">— Escoja —</option>
              ${equipo.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join("")}
              <option value="::nadie::">Dejarlos sin asignar</option></select></td>
            <td><button class="btn sm primary" data-mover="${esc(n)}">Reasignar</button></td></tr>`;
        }).join("")}</tbody></table></div>`;

    caja.querySelectorAll("[data-mover]").forEach(b => b.onclick = () => {
      const de = b.dataset.mover;
      const sel = caja.querySelector(`[data-dest="${CSS.escape(de)}"]`);
      const elegido = sel ? sel.value : "";
      if (!elegido){ alert("Escoja primero a quién se le pasan."); return; }
      const a = elegido === "::nadie::" ? "" : elegido;
      const q = cuantoTiene(de);
      if (!confirm(`Pasar ${q.clientes} cliente(s) y ${q.actividades} actividad(es) de ` +
                   `“${de}” a ${a ? `“${a}”` : "nadie"}?`)) return;
      reasignarEjecutivo(de, a);
      pintarHuerfanos();
      renderEjecutivos();
    });
  }
  pintarHuerfanos();


  /** Vuelca el formulario al estado. Se llama también antes de agregar o
      eliminar una fila: si no, al repintar se perdía lo que estuviera escrito. */
  function recogerAjustes(){
    /* Lo primero, SIEMPRE: volver a apuntar al estado vivo. Si algo lo
       reemplazó con esta pantalla abierta, escribir en las referencias de
       cuando se dibujó no guarda nada —y encima dice que sí—. */
    a = state.ajustes; t = a.textos; h = a.hotel;

    h.nombre    = p.querySelector("#hNombre").value.trim() || "Hotel";
    h.direccion = p.querySelector("#hDir").value.trim();
    h.telefono  = p.querySelector("#hTel").value.trim();
    h.ciudad    = p.querySelector("#hCiudad").value.trim();
    h.telReservaciones   = p.querySelector("#hTelRes").value.trim();
    h.emailReservaciones = p.querySelector("#hMailRes").value.trim();
    h.telSpa         = p.querySelector("#hTelSpa").value.trim();
    h.emailSpa       = p.querySelector("#hMailSpa").value.trim();
    h.director       = p.querySelector("#hDirector").value.trim();
    h.puestoDirector = p.querySelector("#hPuestoDir").value.trim();
    h.sitio = p.querySelector("#hSitio").value.trim();
    h.marcaAgua = p.querySelector("#hAgua").value;
    p.querySelectorAll("[data-legal]").forEach(i => { h[i.dataset.legal] = i.value.trim(); });
    a.ladaPais  = p.querySelector("#hLada").value.replace(/\D/g,"") || "52";

    const mon = p.querySelector("#hMoneda").value.trim().toUpperCase() || "MXN";
    const antes = a.moneda;
    a.moneda = mon;
    try{ money(0); }
    catch(err){ a.moneda = antes; alert(`El código de moneda "${mon}" no es válido; se dejó ${antes}.`); }

    p.querySelectorAll("[data-t]").forEach(el => { a.textos[el.dataset.t] = el.value; });
    p.querySelectorAll("[data-g]").forEach(el => {
      if (!a.grupos[el.dataset.g]) return;
      a.grupos[el.dataset.g][el.dataset.gk] = el.dataset.gk === "nombre" ? el.value.trim() : el.value;
    });
    p.querySelectorAll("#tUsr tr[data-u]").forEach(tr => {
      const u = state.usuarios.find(x => x.id === tr.dataset.u);
      if (!u) return;
      u.correo = tr.querySelector('[data-uk="correo"]').value.trim().toLowerCase();
      u.nombre = tr.querySelector('[data-uk="nombre"]').value.trim();
      u.rol    = tr.querySelector('[data-uk="rol"]').value;
      /* Emitir certificados es de la persona, no del papel: un certificado es
         una cortesía que cuesta dinero y el hotel escoge a quién se lo deja a
         mano. La administración siempre puede, con palomita o sin ella. */
      u.certificados = tr.querySelector('[data-uk="certificados"]').checked;
    });
    state.usuarios = state.usuarios.filter(u => u.correo || u.nombre).map(saneaUsuario);

    h.jefes = saneaJefes([...p.querySelectorAll("#tJefes tr[data-j]")].map(tr => ({
      depto: tr.querySelector('[data-jk="depto"]').value,
      jefe:  tr.querySelector('[data-jk="jefe"]').value
    })));

    /* Las DOS tablas del catálogo, en el orden en que salen en pantalla: un
       solo selector las recorre en orden del documento —primero los paquetes,
       luego los sueltos— y de ahí sale el `orden` de toda la lista. */
    p.querySelectorAll("#tSrv tr[data-sb], #tSrvS tr[data-sb]").forEach((tr, i) => {
      const x = state.serviciosBq.find(y => y.id === tr.dataset.sb);
      if (!x) return;
      x.orden       = i;
      x.nombre      = tr.querySelector('[data-sk="nombre"]').value.trim();
      x.familia     = tr.querySelector('[data-sk="familia"]').value.trim();
      x.precio      = parseMoney(tr.querySelector('[data-sk="precio"]').value);
      x.conServicio = tr.querySelector('[data-sk="conServicio"]').checked;
      x.esPaquete   = tr.querySelector('[data-sk="esPaquete"]').checked;
    });
    /* OJO: aquí NO se tiran los que todavía no tienen nombre. `recogerAjustes`
       corre también al agregar, al mover y al eliminar otro renglón, y
       tirarlos aquí hacía que agregar dos servicios seguidos borrara el
       primero antes de poder escribirle nada. Se tiran al guardar, que es
       cuando alguien dice que terminó —ver #bGuardarAj—. */

    p.querySelectorAll("#tHab tr[data-id]").forEach((tr, i) => {
      const x = state.habitaciones.find(y => y.id === tr.dataset.id);
      if (!x) return;
      /* El lugar que ocupa, tal como quedó en pantalla. Es lo que hace que el
         orden viaje: sin esto, mover un renglón no cambiaba ningún dato y por
         lo tanto no había nada que subir. */
      x.orden = i;
      x.codigo  = tr.querySelector('[data-k="codigo"]').value.trim().toUpperCase();
      x.nombre  = tr.querySelector('[data-k="nombre"]').value.trim() || "Sin nombre";
      x.grupo   = tr.querySelector('[data-k="grupo"]').value;
      const pub = tr.querySelector('[data-k="publica"]').value.trim();
      x.publica = pub === "" ? null : parseMoney(pub);
    });
  }

  p.querySelector("#hLogo").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const MAX = 400 * 1024;   // el almacenamiento del navegador es limitado
    if (f.size > MAX){
      alert(`La imagen pesa ${Math.round(f.size/1024)} KB y el límite es 400 KB.\n\n` +
            "Guárdala más chica (un PNG de unos 600 px de ancho basta) o usa un SVG.");
      e.target.value = "";
      return;
    }
    const r = new FileReader();
    r.onload = () => { recogerAjustes(); h.logo = String(r.result); guardar(); renderAjustes(); };
    r.onerror = () => alert("No se pudo leer la imagen.");
    r.readAsDataURL(f);
  });
  const bQ = p.querySelector("#bQuitarLogo");

  /* ---------------------------------------------------------------------
     Cargar la lista de golpe.

     El kit de banquetes del hotel y la lista del proveedor de audiovisual
     traen más de cien renglones entre los dos, y cambian cada enero. Teclear
     eso a mano una vez al año no es trabajo de nadie; y escribirlo dentro de
     la aplicación tampoco, porque este archivo es público y porque entonces
     actualizar un precio dependería de que alguien publique una versión.
     Se pega o se escoge un archivo, y ya.
     --------------------------------------------------------------------- */
  function cargarServicios(texto, reemplazar){
    const filas = parseCSV(String(texto || ""));
    const leidos = [];
    for (const f of filas){
      const nombre = String(f[0] || "").trim();
      if (!nombre) continue;
      // Un encabezado no es un servicio.
      if (/^(servicio|nombre|concepto)$/i.test(nombre) && !parseMoney(f[1])) continue;
      const serv = String(f[2] == null ? "" : f[2]).trim().toLowerCase();
      const paq  = String(f[5] == null ? "" : f[5]).trim().toLowerCase();
      leidos.push({ nombre, precio: parseMoney(f[1]),
        /* Vacío quiere decir «sí»: los alimentos y las bebidas son la mayor
           parte de la lista y son justo los que lo llevan. */
        conServicio: serv === "" ? true : /^(s[ií]|si|1|true|x)$/.test(serv),
        /* La cuarta columna es opcional: un archivo de tres columnas —los que
           ya se hayan cargado— sigue entrando igual, nada más sin agrupar. */
        familia: String(f[3] == null ? "" : f[3]).trim(),
        /* La quinta columna es el desglose del paquete, y es opcional: los
           renglones separados por `;` y cada uno `concepto|unitario|cantidad`.
           Feo de leer, sí; pero el archivo se baja ya escrito con «Bajar la
           lista», que es como se mantiene, y así no hay un segundo formato
           que aprender. */
        partes: String(f[4] == null ? "" : f[4]).split(";")
          .map(t => t.split("|"))
          .filter(t => (t[0] || "").trim())
          .map(t => ({ concepto:t[0].trim(), unitario:parseMoney(t[1]),
                       cantidad:Number(String(t[2] || "").trim()) || 0 })),
        /* La sexta columna dice si es un paquete, y va al final justamente
           para que un archivo de los de antes —de tres, cuatro o cinco
           columnas— siga entrando igual. Cuando no viene, `esPaquete` se queda
           sin decidir y lo deduce `saneaServicioBq`: es paquete si trae
           desglose o si su familia empieza con «Paquete». */
        esPaquete: paq === "" ? undefined : /^(s[ií]|si|1|true|x|paquete)$/.test(paq) });
    }
    if (!leidos.length) return { leidos:0 };

    let nuevos = 0, cambiados = 0;
    if (reemplazar){
      state.serviciosBq = leidos.map((x, i) => saneaServicioBq(Object.assign({ orden:i }, x)));
      nuevos = leidos.length;
    } else {
      for (const x of leidos){
        const ya = state.serviciosBq.find(y => y.nombre.toLowerCase() === x.nombre.toLowerCase());
        if (ya){
          if (ya.precio !== x.precio || ya.conServicio !== x.conServicio ||
              (x.familia && ya.familia !== x.familia) ||
              (x.esPaquete !== undefined && !!ya.esPaquete !== x.esPaquete) ||
              (x.partes.length && JSON.stringify(ya.partes) !== JSON.stringify(x.partes))) cambiados++;
          ya.precio = x.precio; ya.conServicio = x.conServicio;
          // Sin la columna, el archivo no opina: se queda como estaba puesto.
          if (x.esPaquete !== undefined) ya.esPaquete = x.esPaquete;
          // Una familia vacía en el archivo no borra la que ya tenía puesta.
          if (x.familia) ya.familia = x.familia;
          // Un desglose vacío tampoco: para quitarlo se vacía en la pantalla.
          if (x.partes.length) ya.partes = x.partes.map(saneaParteBq);
        } else {
          state.serviciosBq.push(saneaServicioBq(x)); nuevos++;
        }
      }
      state.serviciosBq.forEach((x, i) => { x.orden = i; });
    }
    return { leidos: leidos.length, nuevos, cambiados };
  }

     */
    p.querySelector("#bCompFirmas").onclick = async e => {
      const firmas = firmasDelEstado();
      if (!firmas.length){ alert("No hay ninguna firma trazada todavía."); return; }
      const antes = firmas.reduce((a, f) => a + pesoTexto(f.img), 0);
      if (!confirm(`Hay ${firmas.length} firma(s) trazada(s) y ocupan ${enKB(antes)} ` +
        "en este navegador.\n\nCompactarlas recorta el blanco que les sobra alrededor " +
        "y baja la resolución a la que se imprimen. La firma se ve igual; lo que se " +
        "quita es papel en blanco.\n\nPrimero se baja un respaldo completo. ¿Continuar?"))
        return;

      respaldoJSON();
      const b = e.currentTarget, texto = b.textContent;
      b.disabled = true;
      let cambiadas = 0, despues = 0;
      try{
        for (let i = 0; i < firmas.length; i++){
          b.textContent = `Compactando ${i + 1} de ${firmas.length}…`;
          const nueva = await compactarUnaFirma(firmas[i].img);
          if (nueva){ firmas[i].img = nueva; cambiadas++; }
          despues += pesoTexto(firmas[i].img);
        }
        alert(cambiadas
          ? `Listo: ${cambiadas} firma(s) compactada(s).\n\n` +
            `Antes ocupaban ${enKB(antes)} y ahora ${enKB(despues)}: ` +
            `se liberaron ${enKB(antes - despues)}.`
          : "Ninguna se pudo achicar: ya estaban al tamaño bueno.");
      }catch(err){
        /* Cada firma se compacta por su cuenta, así que cortarse a la mitad
           deja unas chicas y otras como estaban: ninguna a medias. Por eso se
           guarda lo que alcanzó —en el `finally`— en vez de tirarlo. */
        alert("Se interrumpió a la mitad: " + ((err && err.message) || err) +
              `\n\nSe compactaron ${cambiadas} y las demás quedaron como estaban. ` +
              "Puedes volver a darle.");
      }finally{
        b.disabled = false; b.textContent = texto;
        if (cambiadas){ guardar(); renderAjustes(); }
      }
    };

    p.querySelector("#bNbArchivos").onclick = async e => {
      if (!nubeActiva()){ alert("Primero hay que entrar a la nube."); return; }
      const pend = escaneosIncrustados();
      const mb = pend.reduce((a, x) => a + (x.m.pdf || "").length, 0) / 1024 / 1024;
      if (!confirm(`Se subirán al almacén del proyecto ${pend.length} escaneado(s), ` +
                   `unos ${mb.toFixed(1)} MB que hoy ocupan lugar en el navegador de cada ` +
                   "equipo.\n\nLos documentos no cambian: lo único que cambia es dónde se " +
                   "guarda el archivo.\n\n¿Continuar?")) return;

      const b = e.currentTarget, antes = b.textContent;
      b.disabled = true;
      try{
        const hechos = await mudarEscaneos((n, total) => {
          b.textContent = `Subiendo ${n + 1} de ${total}…`;
        });
        await sincronizar().catch(() => {});
        alert(`Listo: se mudaron ${hechos} escaneado(s).\n\n` +
              "El navegador de este equipo quedó libre, y el de los demás en cuanto " +
              "se sincronicen.");
      }catch(ex){
        alert(nube.sinDeposito
          ? "El almacén del proyecto todavía no existe.\n\n" +
            "Hay que correr archivos.sql una vez en el SQL Editor de Supabase. " +
            "Lo que alcanzó a subirse antes del error se quedó bien guardado."
          : "No se pudieron mudar todos: " + ex.message +
            "\n\nLo que ya subió se quedó bien; vuelve a darle para continuar.");
      }finally{ b.disabled = false; b.textContent = antes; renderAjustes(); }
    };

    p.querySelector("#bNbEntrar").onclick = () => { detenerSondeo(); pantallaEntrada(); };
    p.querySelector("#bNbSalir").onclick = () => {
      if (!confirm("Se cerrará la sesión en este equipo. Los datos ya sincronizados se quedan en la nube.")) return;
      salir();
    };
    p.querySelector("#bNbQuitar").onclick = () => {
      if (!confirm("Este equipo dejará de sincronizar y volverá a guardar sólo aquí.\n\n" +
                   "Los datos que ya están en la nube no se borran. ¿Continuar?")) return;
      detenerSondeo();
      nube.url = ""; nube.anon = ""; nube.sesion = null; nube.ultimo = "";
      nube.estado = "local"; nube.enlazado = false;
      sincronizado = new Map();
      guardarNubeCfg(); guardarSesion();
      pintarNube(); renderAjustes();
    };
  })();

  p.querySelector("#bGuardarAj").onclick = () => {
    recogerAjustes();
    /* Un servicio sin nombre en la lista desplegable es un renglón en blanco
       que nadie entiende. Agregar uno y arrepentirse es normal: se descarta
       aquí, al guardar, y no antes. */
    state.serviciosBq = state.serviciosBq.filter(x => x.nombre);
    guardar(); renderAjustes();
    const ok = document.getElementById("ajOk");
    if (ok){ ok.textContent = "Guardado ✓"; setTimeout(() => { if (ok) ok.textContent = ""; }, 2500); }
  };
}

/**
 * El navegador imprime su propio encabezado y pie —URL, fecha, número de
 * página— siempre que la hoja tenga margen. Con margen cero no le queda sitio
 * y los omite, así que los márgenes reales los pone el contenido.
 *
 * Sólo se puede hacer cuando cada página es un bloque propio (.hoja), como en
 * las confirmaciones. En un documento que fluye varias páginas, como el
 * convenio, la segunda hoja arrancaría pegada al borde del papel: ahí se
 * conserva el margen de página y el pie del navegador se apaga desde el
 * diálogo de impresión.
 */
function fijarPagina(sinMargenDeHoja){
  let el = document.getElementById("reglaPagina");
  if (!el){ el = document.createElement("style"); el.id = "reglaPagina"; document.head.appendChild(el); }
  el.textContent = sinMargenDeHoja
    ? "@page{ size: letter; margin: 0; }"
    : "@page{ size: letter; margin: 16mm 18mm; }";
}

function modal(html){
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = html;
  ov.addEventListener("click", e => {
    if (e.target === ov || e.target.closest("[data-close]")) ov.remove();
  });
  document.body.appendChild(ov);
  armarBuscadoresCliente(ov);
  /* Al cerrarse el ÚLTIMO formulario se sincroniza de una vez, en lugar de
     esperar hasta quince segundos más. Mientras hubo algo abierto el sondeo
     sólo miró —ver mirarSinTocar—, así que aquí es donde de verdad entra lo
     que cambiaron los demás. */
  new MutationObserver((m, obs) => {
    if (ov.isConnected) return;
    obs.disconnect();
    if (!document.querySelector(".overlay")){
      tarifasCambiadas = null;
      ponerseAlDia().catch(() => {});
    }
  }).observe(document.body, { childList: true });
  return ov;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    const ovs = document.querySelectorAll(".overlay");
    if (ovs.length) ovs[ovs.length-1].remove();
  }
});

/* ----- Ficha del cliente ----- */

function abrirCliente(id, estatusInicial, pane){
  const existente = id ? cliente(id) : null;
  // Un cliente nuevo nace de quien lo está capturando: si naciera sin dueño,
  // el propio ejecutivo dejaría de verlo en cuanto cerrara la ventana.
  /* Nacido en banquetes, es de banquetes: suyo es ese par, y el de ventas se
     queda en blanco porque ventas no lo ha trabajado. Sin dueño de ventas el
     renglón sube sin `duenio` —nadie lo rebota— y en pantalla no le sale a
     ningún ejecutivo de hospedaje, que es lo correcto: no es suyo. */
  const c = existente || (enBanquetes()
    ? saneaCliente({ estatus:"contactado", ejecutivo:"",
                     estatusBq: estatusInicial || "contactado", ejecutivoBq: miNombre() })
    : saneaCliente({ estatus: estatusInicial || "contactado", ejecutivo: miNombre() }));

  /* En banquetes no se le piden los datos de hospedaje: ni la tarifa, ni la
     etapa del convenio, ni el ejecutivo de ventas. Abajo van los suyos. */
  const campos = CAMPOS_CLIENTE
    .filter(f => !(enBanquetes() && ["tarifa","ejecutivo","estatus"].includes(f.key)))
    .map(f => {
    const val = f.key === "tarifa" ? (Number(c.tarifa) ? c.tarifa : "") : (c[f.key] ?? "");
    const ancho = (f.key === "notas" || f.key === "ubicacion") ? " full" : "";
    let ctl;
    if (f.type === "textarea") ctl = `<textarea class="field" name="${f.key}">${esc(val)}</textarea>`;
    else if (f.type === "estatus") ctl = `<select class="field" name="estatus">${
        ESTATUS.map(e => `<option value="${e.id}"${e.id===c.estatus?" selected":""}>${esc(e.name)}</option>`).join("")}</select>`;
    else if (f.type === "money") ctl = `<input class="field" type="text" inputmode="decimal" name="tarifa" value="${esc(val)}" placeholder="0.00">`;
    else if (f.type === "lada"){
      const suya = String(val || "");
      const conocida = !suya || LADAS.some(x => x.id === suya);
      ctl = `<select class="field" name="lada" style="max-width:100%">
          <option value=""${!suya ? " selected" : ""}>La del hotel (+${esc(ladaHotel())})</option>
          ${LADAS.map(x => `<option value="${x.id}"${x.id === suya ? " selected" : ""}>${esc(x.name)}</option>`).join("")}
          <option value="otra"${conocida ? "" : " selected"}>Otra…</option>
        </select>
        <input class="field" name="ladaOtra" inputmode="numeric" placeholder="Lada, sólo números"
          value="${conocida ? "" : esc(suya)}" style="margin-top:6px${conocida ? ";display:none" : ""}">
        <div class="hint">Se antepone a los teléfonos de 10 dígitos. Si el teléfono ya se
          capturó con su + adelante, manda ése.</div>`;
    }
    else if (f.key === "ejecutivo") ctl = selectEjecutivo(val);
    else ctl = `<input class="field" type="${f.type}" name="${f.key}" value="${esc(val)}">`;
    return `<div class="${ancho.trim()}"><label class="lbl">${esc(f.label)}</label>${ctl}</div>`;
  }).join("");

  /* El par de banquetes, fuera de CAMPOS_CLIENTE a propósito: esa lista es la
     del CSV —la plantilla, el mapeo de la importación y las columnas de la
     exportación salen de ella—, y esto es de pantalla, no de archivo. */
  const camposBq = enBanquetes() ? `
    <div><label class="lbl">Estatus de banquetes</label>
      <select class="field" name="estatusBq">
        <option value=""${c.estatusBq ? "" : " selected"}>— Sin tratar —</option>
        ${ESTATUS.map(e => `<option value="${e.id}"${e.id === c.estatusBq ? " selected" : ""}>${esc(e.name)}</option>`).join("")}
      </select>
      <div class="hint">La etapa con banquetes. La de ventas va aparte y no se toca desde aquí.</div></div>
    <div><label class="lbl">Ejecutivo de banquetes</label>
      ${selectEjecutivo(c.ejecutivoBq || "", "ejecutivoBq", "banquetes")}
      <div class="hint">Vacío quiere decir que nadie de banquetes lo ha tratado.</div></div>` : "";

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head">
        <h2>${existente ? esc(c.empresa || "Cliente") : "Nuevo cliente"}</h2>
        ${existente && c.telefono ? `<button class="btn wa" id="bWa" title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button>` : ""}
        <button class="btn" data-close>✕</button>
      </div>
      <div class="modal-body">
        ${existente ? `<div class="subtabs">
          <button data-pane="datos" aria-current="true">Datos</button>
          <button data-pane="acts">Actividad <span class="hint">(${actsVisiblesDe(c.id).length})</span></button>
          ${veHospedaje() ? `<button data-pane="convs">Convenios
            <span class="hint">(${conveniosDe(c.id).length})</span></button>` : ""}
        </div>` : ""}
        <div class="pane" id="p-datos" data-on><form id="fCliente"><div class="grid">${campos}${camposBq}</div></form></div>
        <div class="pane" id="p-acts"></div>
        <div class="pane" id="p-convs"></div>
      </div>
      <div class="modal-foot" id="footCli">
        ${existente ? `<button class="btn danger" id="bDel">Eliminar cliente</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOk">Guardar</button>
      </div>
    </div>`);

  const form = ov.querySelector("#fCliente");
  const selLada = form.querySelector('[name="lada"]');
  const otraLada = form.querySelector('[name="ladaOtra"]');
  if (selLada && otraLada) selLada.onchange = () => {
    otraLada.style.display = selLada.value === "otra" ? "" : "none";
    if (selLada.value === "otra") otraLada.focus();
  };
  form.querySelector('[name="empresa"]').focus();
  form.addEventListener("submit", e => { e.preventDefault(); guardarCliente(); });
  ov.querySelector("#bOk").onclick = guardarCliente;
  const bWa = ov.querySelector("#bWa");
  if (bWa) bWa.onclick = () => abrirWhatsApp(c);

  const bDel = ov.querySelector("#bDel");
  if (bDel) bDel.onclick = () => {
    // Se cuenta TODO lo que cuelga, aunque quien borra no lo alcance a ver:
    // banquetes no ve los convenios del cliente, y aun así se los llevaría por
    // delante. Más vale que lo sepa antes de apretar.
    const cuelga = [[actsDe(c.id).length, "actividad(es)"],
                    [conveniosDe(c.id).length, "convenio(s)"],
                    [state.contratos.filter(k => k.clienteId === c.id).length, "contrato(s) de hospedaje"],
                    [state.eventos.filter(e => e.clienteId === c.id).length, "evento(s) de banquetes"]]
                   .filter(([n]) => n).map(([n, q]) => `${n} ${q}`);
    const extra = cuelga.length ? `\n\nSe borrarán también ${cuelga.join(", ")}.` : "";
    if (!confirm(`¿Eliminar a "${c.empresa}"?${extra}\n\nEsta acción no se puede deshacer.`)) return;
    state.clientes    = state.clientes.filter(x => x.id !== c.id);
    state.actividades = state.actividades.filter(a => a.clienteId !== c.id);
    state.convenios   = state.convenios.filter(v => v.clienteId !== c.id);
    state.contratos   = state.contratos.filter(k => k.clienteId !== c.id);
    state.eventos     = state.eventos.filter(e => e.clienteId !== c.id);
    guardar(); render(); ov.remove();
  };

  if (existente){
    const foot = ov.querySelector("#footCli");
    ov.querySelectorAll(".subtabs button").forEach(b => b.onclick = () => {
      ov.querySelectorAll(".subtabs button").forEach(x => x.setAttribute("aria-current", String(x === b)));
      ov.querySelectorAll(".pane").forEach(pn =>
        pn.id === "p-" + b.dataset.pane ? pn.setAttribute("data-on","") : pn.removeAttribute("data-on"));
      foot.style.display = b.dataset.pane === "datos" ? "" : "none";
      if (b.dataset.pane === "acts")  pintaActs();
      if (b.dataset.pane === "convs") pintaConvs();
    });
    if (pane){
      const b = ov.querySelector(`.subtabs button[data-pane="${pane}"]`);
      if (b) b.click();
    }
  }

  function pintaActs(){
    const lista = actsVisiblesDe(c.id);
    ov.querySelector("#p-acts").innerHTML = `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <b>Actividad registrada</b><span class="hint">${lista.length} registro(s) · sin límite</span>
        <span style="flex:1"></span>
        <button class="btn primary" id="bAddAct">+ Registrar actividad</button>
      </div>
      ${lista.length ? lista.map(a => `
        <div class="act" data-act="${a.id}">
          <div class="act-ico" title="${esc(tipoAct(a.tipo).name)}">${tipoAct(a.tipo).icon}</div>
          <div class="act-body">
            <div class="act-top">
              <span class="act-asunto">${esc(a.asunto || tipoAct(a.tipo).name)}</span>
              <span class="act-meta">${esc(tipoAct(a.tipo).name)} · ${esc(fechaHora(a.fecha))}${a.responsable ? " · " + esc(a.responsable) : ""}</span>
            </div>
            ${a.notas ? `<div class="act-notas">${esc(a.notas)}</div>` : ""}
          </div>
          <button class="act-del" data-delact="${a.id}" title="Eliminar">✕</button>
        </div>`).join("")
        : `<div class="vacio">Todavía no hay actividad registrada para este cliente.</div>`}`;

    ov.querySelector("#bAddAct").onclick = () => modalActividad(c.id, null, pintaActs);
    ov.querySelectorAll("[data-delact]").forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      if (!confirm("¿Eliminar esta actividad?")) return;
      state.actividades = state.actividades.filter(x => x.id !== b.dataset.delact);
      guardar(); pintaActs(); render();
    });
    ov.querySelectorAll(".act").forEach(d => d.addEventListener("click", ev => {
      if (ev.target.closest("[data-delact]")) return;
      modalActividad(c.id, d.dataset.act, pintaActs);
    }));
  }

  function pintaConvs(){
    const lista = conveniosDe(c.id);
    ov.querySelector("#p-convs").innerHTML = `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <b>Convenios</b><span style="flex:1"></span>
        <button class="btn primary" id="bAddConv">+ Nuevo convenio</button>
      </div>
      ${lista.length ? `<table class="data"><thead><tr>
          <th>Folio</th><th>Fecha</th><th>Habitaciones</th><th>Estado</th><th></th></tr></thead>
        <tbody>${lista.map(v => {
          const ec = ESTADOS_CONV[v.estado];
          return `<tr class="row-link" data-conv="${v.id}">
            <td><b>${esc(v.folio || "—")}</b></td>
            <td class="nowrap">${esc(fechaCorta(v.fecha))}</td>
            <td style="max-width:190px" title="${esc(nombresConvenio(v))}">${codigosConvenio(v)}</td>
            <td><span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span></td>
            <td class="nowrap"><button class="btn sm" data-verconv="${v.id}">Ver carta</button></td></tr>`;
        }).join("")}</tbody></table>`
        : `<div class="vacio">Este cliente todavía no tiene convenios.</div>`}`;

    ov.querySelector("#bAddConv").onclick = () => editarConvenio(null, c.id, pintaConvs);
    ov.querySelectorAll("tr[data-conv]").forEach(tr => tr.addEventListener("click", ev => {
      const b = ev.target.closest("[data-verconv]");
      if (b){ ev.stopPropagation(); verConvenio(b.dataset.verconv, pintaConvs); return; }
      editarConvenio(tr.dataset.conv, null, pintaConvs);
    }));
  }

  function guardarCliente(){
    const fd = new FormData(form);
    const obj = Object.assign({}, c);
    for (const f of CAMPOS_CLIENTE){
      /* Un campo que esta pantalla no dibujó no se toca. Sin esto, esconder
         uno le pondría "" encima a lo que ya estaba guardado: lo borraría en
         silencio, y el renglón se iría así a la nube. */
      if (!form.elements[f.key]) continue;
      let v = (fd.get(f.key) ?? "").toString().trim();
      if (f.key === "tarifa") v = parseMoney(v);
      if (f.key === "lada" && v === "otra") v = (fd.get("ladaOtra") ?? "").toString();
      obj[f.key] = v;
    }
    if (enBanquetes()){
      obj.estatusBq   = (fd.get("estatusBq")   ?? "").toString().trim();
      obj.ejecutivoBq = (fd.get("ejecutivoBq") ?? "").toString().trim();
    }
    if (!obj.empresa){ alert("El nombre de la empresa es obligatorio."); form.querySelector('[name="empresa"]').focus(); return; }
    obj.updatedAt = new Date().toISOString();
    if (existente){
      const limpio = saneaCliente(obj);
      /* `Object.assign` suma, no quita: el par de banquetes que el saneador
         borró por quedar vacío se quedaría con el valor viejo pegado. */
      for (const k of ["estatusBq","ejecutivoBq"]) if (!(k in limpio)) delete c[k];
      Object.assign(c, limpio);
    }
    else { obj.id = nuevoId("c"); obj.createdAt = new Date().toISOString(); state.clientes.push(saneaCliente(obj)); }
    guardar(); render(); ov.remove();
  }
}

/* ----- Actividad ----- */

const ahoraLocal = () => new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);

function modalActividad(clienteId, actId, alCerrar){
  const a = actId ? state.actividades.find(x => x.id === actId) : null;
  const v = a || saneaAct({ clienteId, fecha: ahoraLocal() });

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${a ? "Editar actividad" : "Registrar actividad"}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body"><form id="fAct"><div class="grid">
        <div><label class="lbl">Tipo</label>
          <select class="field" name="tipo">${TIPOS_ACT.map(t =>
            `<option value="${t.id}"${t.id===v.tipo?" selected":""}>${t.icon} ${esc(t.name)}</option>`).join("")}</select></div>
        <div><label class="lbl">Fecha y hora</label>
          <input class="field" type="datetime-local" name="fecha" value="${esc(String(v.fecha).slice(0,16))}"></div>
        <div class="full"><label class="lbl">Asunto</label>
          <input class="field" name="asunto" value="${esc(v.asunto)}" placeholder="Seguimiento de cotización"></div>
        <div class="full"><label class="lbl">Responsable (ejecutivo de venta)</label>
          ${selectEjecutivo(v.responsable || (cliente(clienteId)||{}).ejecutivo || miNombre(), "responsable")}</div>
        <div class="full"><label class="lbl">Notas</label>
          <textarea class="field" name="notas" style="min-height:110px">${esc(v.notas)}</textarea></div>
      </div></form></div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOk">Guardar</button></div>
    </div>`);

  const form = ov.querySelector("#fAct");
  form.querySelector('[name="asunto"]').focus();
  form.addEventListener("submit", e => { e.preventDefault(); ok(); });
  ov.querySelector("#bOk").onclick = ok;

  function ok(){
    const fd = new FormData(form);
    const obj = Object.assign({}, v, {
      clienteId,
      tipo: fd.get("tipo"),
      fecha: fd.get("fecha") || ahoraLocal(),
      asunto: (fd.get("asunto")||"").trim(),
      responsable: (fd.get("responsable")||"").trim(),
      notas: (fd.get("notas")||"").trim()
    });
    if (a) Object.assign(a, saneaAct(obj));
    else { obj.id = nuevoId("a"); obj.createdAt = new Date().toISOString(); state.actividades.push(saneaAct(obj)); }
    guardar(); ov.remove(); render();
    if (alCerrar) alCerrar();
  }
}

/** Deja constancia automática de los hitos del convenio en la bitácora del cliente. */

/* ----- Bitácora de los ejecutivos ----- */

/**
 * Las actividades siempre estuvieron ahí, pero encerradas en la ficha de cada
 * cliente: para saber qué hizo alguien en la semana había que abrir cliente
 * por cliente. Esta vista las junta todas y las mira desde el otro lado, por
 * quien las hizo.
 */
let filtroAct = { periodo:"30", ejecutivo:"", tipo:"", desde:"", hasta:"" };

const PERIODOS = [
  { id:"hoy",  name:"Hoy" },
  { id:"7",    name:"Últimos 7 días" },
  { id:"30",   name:"Últimos 30 días" },
  { id:"mes",  name:"Este mes" },
  { id:"todo", name:"Todo" },
  { id:"rango",name:"Entre dos fechas" }
];

/** Los dos extremos del periodo elegido, como AAAA-MM-DD. */
function rangoActivo(){
  const hoy = hoyISO();
  const menos = n => {
    const d = new Date(hoy + "T12:00:00");
    d.setDate(d.getDate() - n);
    return d.toISOString().slice(0,10);
  };
  switch (filtroAct.periodo){
    case "hoy":  return [hoy, hoy];
    case "7":    return [menos(6), hoy];
    case "30":   return [menos(29), hoy];
    case "mes":  return [hoy.slice(0,7) + "-01", hoy];
    case "rango":return [filtroAct.desde || "0000-01-01", filtroAct.hasta || "9999-12-31"];
    default:     return ["0000-01-01", "9999-12-31"];
  }
}

function actividadesVisibles(){
  const [desde, hasta] = rangoActivo();
  const q = filtros.q.trim().toLowerCase();
  const mios = new Set(state.clientes.filter(esMio).map(c => c.id));
  const yo = miNombre().trim().toLowerCase();
  /* Cada departamento lleva su propia bitácora. La cartera de clientes sí se
     comparte entre ventas y banquetes —un evento cuelga de un cliente y sin él
     no se puede ni abrir—, pero las llamadas y las visitas de banquetes no son
     asunto de la gerencia de ventas, ni al revés, aunque el cliente sea el
     mismo. Y las de marketing no son de nadie más. */
  const ajenos = otrosDepartamentos();
  return state.actividades.filter(a => {
    if (ajenos.has(String(a.responsable || "").trim().toLowerCase())) return false;
    // Un ejecutivo ve lo de su cartera y, además, lo que él mismo hizo:
    // a veces cubre a un compañero y esa llamada es suya de todos modos.
    if (!puedeVerTodo() && !mios.has(a.clienteId) &&
        String(a.responsable || "").trim().toLowerCase() !== yo) return false;
    const dia = String(a.fecha || "").slice(0,10);
    if (dia < desde || dia > hasta) return false;
    if (filtroAct.ejecutivo && (a.responsable || "") !== filtroAct.ejecutivo) return false;
    if (filtroAct.tipo && a.tipo !== filtroAct.tipo) return false;
    if (!q) return true;
    return [a.asunto, a.notas, a.responsable, nombreCli(a.clienteId), tipoAct(a.tipo).name]
      .join(" ").toLowerCase().includes(q);
  }).sort((x,y) => String(y.fecha).localeCompare(String(x.fecha)));
}

/* ----- Editor de convenio ----- */

/**
 * El folio que sigue para un año: CV-2027-004.
 *
 * El consecutivo se cuenta por año y sale del folio más alto que ya exista
 * para ese año, no de cuántos convenios haya en total. Contar el total daba
 * folios repetidos en cuanto se borraba uno, y arrancaba el año nuevo con el
 * número donde se hubiera quedado el anterior.
 *
 * Se saltan los borradores sin firmar de otros años porque el folio se
 * recalcula solo mientras nadie lo haya escrito a mano.
 */
function folioAuto(anio){
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^CV-" + a + "-(\\d+)$", "i");
  const usados = state.convenios
    .map(v => (re.exec(String(v.folio || "").trim()) || [])[1])
    .filter(Boolean)
    .map(Number);
  const n = usados.length ? Math.max(...usados) + 1 : 1;
  return `CV-${a}-${String(n).padStart(3, "0")}`;
}

/** El año que manda en el folio es el de la vigencia, no el de hoy. */
const anioConvenio = v =>
  String(v.vigenciaDesde || v.fecha || hoyISO()).slice(0, 4) || String(new Date().getFullYear());

/** El primer folio libre de un año, saltándose los que ya existan. */
function folioLibre(anio, excluirId){
  const usados = new Set(state.convenios
    .filter(v => v.id !== excluirId)
    .map(v => String(v.folio || "").trim().toUpperCase()));
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^CV-" + a + "-(\\d+)$", "i");
  let n = Math.max(0, ...state.convenios
    .filter(v => v.id !== excluirId)
    .map(v => Number((re.exec(String(v.folio || "").trim()) || [])[1]) || 0)) + 1;
  let f;
  do { f = `CV-${a}-${String(n++).padStart(3, "0")}`; } while (usados.has(f));
  return f;
}

/** ¿Tiene la forma que arma la aplicación sola? */
const folioAutomatico = f => /^CV-\d{4}-\d+$/i.test(String(f || "").trim());

/* ==========================================================================
   EL CONSECUTIVO, DEL LADO DEL SERVIDOR

   El siguiente folio salía de los convenios que este equipo tiene bajados, y
   eso deja de ser cierto en cuanto el servidor reparte por dueño: un ejecutivo
   que sólo recibe los suyos cuenta desde el suyo más alto y propone un número
   que en el hotel ya existe. Y la renumeración automática tampoco lo agarra,
   porque trabaja con lo mismo que ve.

   Por eso el contador vive en el servidor —folios.sql—, que es el único que
   los ve todos. Aquí nada más se le pregunta y se le pide turno.

   Si no se ha corrido folios.sql, todo esto se hace a un lado y la aplicación
   cuenta como siempre: mejor un consecutivo aproximado que no poder trabajar.
   ========================================================================== */

/** Se anota a la primera negativa del servidor y ya no se vuelve a molestar. */
/* Se le vuelve a preguntar SIEMPRE que haya nube.

   Antes, un «no está montado» se recordaba el resto de la sesión. Eso quiere
   decir que si alguien corre folios.sql con el CRM abierto —que es justo lo que
   va a pasar—, nadie puede emitir nada hasta recargar; y nadie recarga una
   página para ver si un aviso se fue. `nube.sinFolios` queda nada más como
   dato para el panel de Ajustes, no como candado. Cuesta una petición fallida
   por intento, que es poquísimo al lado de dejar al equipo sin poder firmar. */
const hayContador = () => nubeActiva();

/** ¿Es un "esto no existe" —y no un problema de paso— lo que contestó? */
function noExisteLaFuncion(e){
  return /PGRST202|PGRST205|not find the function|does not exist|404/i.test(e.message || "");
}

/**
 * El número más alto que el hotel entero lleva en ese año.
 *
 * Es para ENSEÑAR el consecutivo al abrir el editor. No aparta nada: si dos
 * personas abren el editor a la vez, las dos ven el mismo número, y cada una
 * se lleva el suyo al guardar.
 */
async function ultimoFolioNube(tipo, anio){
  if (!hayContador()) return 0;
  try{
    const filas = await api(`/rest/v1/crm_folios?tipo=eq.${encodeURIComponent(tipo)}` +
      `&anio=eq.${Number(anio)}&select=numero&order=numero.desc&limit=1`);
    return (filas && filas[0] && Number(filas[0].numero)) || 0;
  }catch(e){
    if (noExisteLaFuncion(e)) nube.sinFolios = true;
    else console.warn("No se pudo consultar el contador de folios:", e.message);
    return 0;
  }
}

/**
 * Pide turno: devuelve un folio que nadie más va a recibir.
 *
 * Devuelve "" cuando no hay contador montado, y entonces manda lo que la
 * aplicación haya calculado con lo que tiene.
 */
async function apartarFolio(tipo, prefijo, anio){
  if (!hayContador()) return "";
  try{
    const r = await api("/rest/v1/rpc/crm_aparta_folio", {
      method:"POST",
      body: JSON.stringify({ p_tipo:tipo, p_anio:Number(anio),
                             p_prefijo:prefijo, p_quien:miNombre() })
    });
    return typeof r === "string" ? r : "";
  }catch(e){
    if (noExisteLaFuncion(e)) nube.sinFolios = true;
    else console.warn("No se pudo apartar folio:", e.message);
    return "";
  }
}

/**
 * El folio de un documento que se está firmando.
 *
 * AQUÍ, Y NO ANTES. Antes el número se apartaba al guardar el borrador, y eso
 * traía los dos defectos que Marco reportó:
 *
 *   · HUECOS. Cada borrador guardado gastaba un número. El que se abandonaba o
 *     se borraba dejaba un hueco en la serie para siempre.
 *   · REPETIDOS. Si el contador no contestaba, la aplicación adivinaba el
 *     número contando lo que ESE equipo alcanzaba a ver. Con los papeles
 *     puestos, Carmen no ve los convenios de Eduardo: los dos adivinaron el
 *     CV-2026-018 y los dos lo firmaron.
 *
 * Tomándolo en la firma, un número sólo se gasta cuando ya hay un documento de
 * verdad. Y el contador del servidor reparte de uno en uno con un candado por
 * tipo y año, así que dos personas al mismo segundo reciben números distintos
 * y seguidos.
 *
 * Devuelve "" cuando hay servidor pero el contador no contesta. Quien llama NO
 * FIRMA: un documento sin número garantizado es justo lo que estamos evitando.
 * Y como no se apartó nada, tampoco se gastó un número: al volver el contador,
 * el siguiente que firme se lleva el que tocaba.
 *
 * SIN SERVIDOR es otra cosa y no se bloquea. Un CRM que trabaja suelto —"Sólo
 * este equipo"— es el único que reparte folios: no hay con quién chocar, y
 * contar aquí da la misma serie seguida. Bloquearlo dejaría sin poder firmar a
 * quien nunca tuvo el problema.
 */
async function folioParaFirmar(doc, tipo, prefijo, anio, local){
  // Uno que ya trae folio lo conserva: vino en papel con su número, o es
  // viejo. Cambiárselo sería peor que el problema.
  const suyo = String((doc && doc.folio) || "").trim();
  if (suyo) return suyo;
  if (!nubeActiva()) return local ? local() : "";
  return await apartarFolio(tipo, prefijo, anio);
}

/** Lo que se le dice a alguien cuando no se pudo apartar el número. */
const AVISO_SIN_CONTADOR =
  "No se pudo apartar el folio, así que el documento NO se firmó.\n\n" +
  "El número lo reparte el servidor del hotel para que no se repita ni se " +
  "salte ninguno. Sin él, firmar sería volver a arriesgarse a dos documentos " +
  "con el mismo folio.\n\n" +
  "Si esto sale siempre, falta correr folios.sql en Supabase. Avísale al " +
  "administrador; en Ajustes se ve si el contador está montado.";

/**
 * Anota un folio que no salió del contador: el que venía en un papel, o el que
 * alguien escribió a mano. Si no se anotara, el contador lo volvería a repartir.
 */
async function anotarFolio(tipo, folio){
  if (!hayContador()) return false;   // hay servidor y no contesta: hay que decirlo
  const m = /^([A-Za-z]+)-(\d{4})-(\d+)$/.exec(String(folio || "").trim());
  if (!m) return true;   // formato de la casa: no entra a la cuenta, y está bien
  try{
    await api("/rest/v1/rpc/crm_anota_folio", {
      method:"POST",
      body: JSON.stringify({ p_tipo:tipo, p_anio:Number(m[2]), p_numero:Number(m[3]),
                             p_folio:folio.toUpperCase(), p_quien:miNombre() })
    });
    return true;
  }catch(e){
    /* Devuelve si quedó anotado o no, en vez de tragárselo. Que esta anotación
       se pierda no es un detalle: significa que el contador va a volver a
       repartir ese número, y el papel que se acaba de registrar quedará
       repetido con un documento nuevo. */
    if (noExisteLaFuncion(e)) nube.sinFolios = true;
    else console.warn("No se pudo anotar el folio:", e.message);
    return false;
  }
}

/** ¿Quién trae ya este folio? Sirve para avisar antes de que se repita. */
function duenioDelFolio(folio, excluirId){
  const f = String(folio || "").trim().toUpperCase();
  if (!f) return null;
  const v = state.convenios.find(x => x.id !== excluirId &&
    String(x.folio || "").trim().toUpperCase() === f);
  return v || null;
}

/**
 * Dos ejecutivos capturando a la vez, cada uno en su equipo, pueden tomar el
 * mismo folio: cada quien cuenta con lo que tiene bajado en ese momento y
 * ninguno ve todavía el convenio del otro. Se detecta al sincronizar, que es
 * segundos después.
 *
 * Se renumera el que se creó después, y sólo si sigue en borrador: un convenio
 * ya firmado o ya enviado lleva su folio impreso en un PDF que anda en el
 * correo de un cliente, y cambiárselo por detrás sería peor que el problema.
 * Esos se marcan para que alguien decida.
 */
/* ==========================================================================
   DOS DOCUMENTOS CON EL MISMO FOLIO

   Esto existía sólo para los convenios, y por eso lo de los contratos estuvo
   ahí sin que nadie lo viera hasta que Marco lo encontró a ojo: CT-2026-002 y
   CT-2026-004 repetidos, sin aviso, sin manera de arreglarlos desde el CRM.

   Las dos series se tratan igual. Lo que cambia entre ellas —cómo se llaman,
   su prefijo, de dónde sale su año— va aquí y una sola vez.
   ========================================================================== */
const SERIES_FOLIO = {
  convenios: {
    uno:"convenio", unos:"convenios", articulo:"el",
    tipo:"convenios", prefijo:"CV",
    lista: () => state.convenios,
    anio:  v => anioConvenio(v),
    libre: v => folioLibre(anioConvenio(v), v.id)
  },
  contratos: {
    uno:"documento", unos:"documentos", articulo:"el",
    tipo:"contratos", prefijo:"CT",
    lista: () => state.contratos,
    anio:  k => anioContrato(k),
    libre: k => folioContrato(anioContrato(k), k.id)
  },
  certificados: {
    uno:"certificado", unos:"certificados", articulo:"el",
    tipo:"certificados", prefijo:"CE",
    lista: () => state.certificados,
    anio:  c => anioCertificado(c),
    libre: c => folioCertificado(anioCertificado(c), c.id)
  }
};

/* Un documento ya firmado o ya enviado NO se renumera solo: su folio va
   impreso en un PDF que anda en el correo de un cliente. Ésos se marcan para
   que alguien decida. */
const folioIntocable = d => d.estado !== "borrador" || d.enviado || d.firmaHotel;

/**
 * Dos ejecutivos capturando a la vez, cada uno en su equipo, pueden tomar el
 * mismo folio: cada quien cuenta con lo que tiene bajado en ese momento y
 * ninguno ve todavía el documento del otro. Se detecta al sincronizar, que es
 * segundos después.
 *
 * Se renumera el que se creó después, y sólo si sigue en borrador.
 */
function resolverFoliosRepetidos(){
  let cambio = false;
  for (const serie of Object.values(SERIES_FOLIO)){
    const porFolio = new Map();
    for (const d of serie.lista()){
      const f = String(d.folio || "").trim().toUpperCase();
      if (!f) continue;
      if (!porFolio.has(f)) porFolio.set(f, []);
      porFolio.get(f).push(d);
    }
    for (const [folio, grupo] of porFolio){
      if (grupo.length < 2) continue;
      // El primero en crearse se queda con el folio.
      grupo.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
      for (const d of grupo.slice(1)){
        if (folioIntocable(d)){ d.folioRepetido = folio; continue; }
        const nuevo = serie.libre(d);
        registrarAuto(d.clienteId, `${serie.uno} ${d.folio} se renumeró como ${nuevo}`,
          `Otro equipo había tomado el folio ${d.folio} al mismo tiempo. Como éste seguía ` +
          "en borrador, se le dio el siguiente libre.", "");
        d.folio = nuevo;
        delete d.folioRepetido;
        d.updatedAt = new Date().toISOString();
        cambio = true;
      }
    }
  }
  if (cambio) guardar();
  return cambio;
}

/** El aviso de arriba de la lista, cuando quedaron folios repetidos. */
function avisoFoliosRepetidos(serie, repetidos){
  if (!repetidos.length) return "";
  return `<div class="note warn" id="avisoFolios">
    <b>Hay ${repetidos.length} ${repetidos.length === 1 ? serie.uno : serie.unos}
      con el folio repetido.</b>
    Dos equipos tomaron el mismo número al mismo tiempo y estos ya estaban
    firmados o enviados, así que no se les cambió solo: el folio va impreso en
    un PDF que ya anda con el cliente.
    <br>${repetidos.map(d => esc(d.folio + " · " + nombreCli(d.clienteId))).join("<br>")}
    <p style="margin:12px 0 0"><button class="btn danger" id="bRenumTodos">Darles un folio
      nuevo a ${repetidos.length === 1 ? "éste" : "los " + repetidos.length}</button>
      <span class="hint">El del hotel, del contador. Habrá que reenviarles el PDF.</span></p>
    </div>`;
}

/** El botón del aviso: pide números nuevos al contador del hotel. */
function engancharRenumTodos(cont, serie, visibles, repetidos){
  const bRT = cont.querySelector("#bRenumTodos");
  if (!bRT) return;
  bRT.onclick = async () => {
    const porFolio = new Map();
    for (const d of repetidos){
      const f = String(d.folio || "").toUpperCase();
      if (!porFolio.has(f)) porFolio.set(f, []);
      porFolio.get(f).push(d);
    }
    /* De cada folio repetido se respeta al más viejo: su número lleva más
       tiempo circulando y es el que menos cuesta dejar quieto. */
    const aCambiar = [];
    for (const grupo of porFolio.values()){
      grupo.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
      const mismoFolio = visibles.filter(x =>
        String(x.folio || "").toUpperCase() === String(grupo[0].folio || "").toUpperCase());
      // Si el más viejo del grupo NO es el más viejo con ese folio, también cambia.
      mismoFolio.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
      for (const d of grupo) if (d.id !== mismoFolio[0].id) aCambiar.push(d);
    }
    if (!aCambiar.length){
      alert("No hay ninguno que cambiar: cada folio repetido ya tiene su dueño más antiguo.");
      return;
    }
    if (!confirm(`Se le va a dar un folio nuevo a ${aCambiar.length} ${
        aCambiar.length === 1 ? serie.uno : serie.unos}.\n\n` +
        aCambiar.map(d => `${d.folio} · ${nombreCli(d.clienteId)}`).join("\n") +
        "\n\nEl más antiguo de cada folio conserva su número.\n\n" +
        "OJO: el PDF que ya tiene cada cliente dice el folio anterior. " +
        "Habrá que volver a mandárselos.\n\n¿Continuar?")) return;

    bRT.disabled = true; bRT.textContent = "Pidiendo números…";
    const hechos = [], fallidos = [];
    for (const d of aCambiar){
      const viejo = d.folio;
      const nuevo = await apartarFolio(serie.tipo, serie.prefijo, serie.anio(d));
      if (!nuevo){ fallidos.push(viejo); continue; }
      d.folio = nuevo;
      delete d.folioRepetido;
      d.updatedAt = new Date().toISOString();
      registrarAuto(d.clienteId, `${serie.uno} ${viejo} se renumeró como ${nuevo}`,
        `Otro ${serie.uno} del hotel ya tenía el folio ${viejo}. Éste ya estaba firmado o ` +
        `enviado, así que se renumeró a mano.\nHay que volver a mandarle el PDF al ` +
        `cliente: el que tiene dice ${viejo}.`, miNombre());
      hechos.push(`${viejo} → ${nuevo}`);
    }
    guardar(); render();
    alert((hechos.length ? "Listo:\n" + hechos.join("\n") : "No se cambió ninguno.") +
      (fallidos.length ? `\n\nNo se pudo con ${fallidos.length}: el contador no contestó. ` +
        "Vuelve a intentarlo, o revisa en Ajustes si está montado." : "") +
      (hechos.length ? "\n\nAcuérdate de reenviarles el PDF." : ""));
  };
}

function editarConvenio(id, clientePre, alCerrar){
  const existente = id ? state.convenios.find(v => v.id === id) : null;

  if (existente && existente.externo){ verConvenioExterno(existente, alCerrar); return; }
  if (existente && existente.estado !== "borrador"){
    alert("Este convenio ya está firmado y no se puede editar.\n\nSe abrirá la carta en modo lectura.");
    verConvenio(existente.id, alCerrar);
    return;
  }

  const finAnio = new Date().getFullYear() + "-12-31";
  const v = existente || saneaConv({
    clienteId: clientePre || "",
    folio: "",                 // se lo pone el contador al firmar: ver folioParaFirmar
    fecha: hoyISO(),
    vigenciaDesde: hoyISO(),
    vigenciaHasta: finAnio,
    textos: Object.assign({}, state.ajustes.textos)
  });

  /* En borrador la tarifa pública se refresca desde el catálogo; el precio
     convenio se conserva.
     Y se reconoce por identificador O POR CLAVE. Si el catálogo se recapturó
     —borrar los tipos y volverlos a dar de alta—, los identificadores son
     otros, y buscando sólo por identificador el convenio se reabría con TODAS
     las tarifas negociadas en blanco: quien le diera Guardar perdía el trabajo
     de la negociación, sin un solo aviso. */
  const previos = new Map();
  for (const h of v.habitaciones){
    if (h.tipoId) previos.set("id:" + h.tipoId, h.convenio);
    if (claveHab(h.codigo)) previos.set("cod:" + claveHab(h.codigo), h.convenio);
  }
  const yaNegociada = h =>
    previos.has("id:" + h.id)                 ? previos.get("id:" + h.id)
  : previos.has("cod:" + claveHab(h.codigo))  ? previos.get("cod:" + claveHab(h.codigo))
  : "";
  const filas = state.habitaciones.map(h => ({
    tipoId:h.id, codigo:h.codigo, nombre:h.nombre, grupo:h.grupo, publica:h.publica,
    convenio: yaNegociada(h)
  }));

  const bloque = gid => {
    const fs = filas.filter(f => f.grupo === gid);
    if (!fs.length) return `<p class="hint">No hay habitaciones de este bloque en el catálogo (pestaña Ajustes).</p>`;
    return `<table class="data"><thead><tr>
        <th style="width:44px"></th><th style="width:80px">Clave</th><th>Tipo de habitación</th>
        <th class="num" style="width:150px">Tarifa pública</th>
        <th class="num" style="width:170px">Tarifa convenio</th><th class="num" style="width:100px">Dcto.</th>
      </tr></thead><tbody>${fs.map(f => {
        const on = f.convenio !== "" && f.convenio !== null;
        return `<tr data-tipo="${f.tipoId}"${on ? "" : ' class="off"'}>
        <td class="selcell"><input type="checkbox" class="sel"${on ? " checked" : ""}
              title="Incluir esta habitación en el convenio"></td>
        <td>${f.codigo ? `<span class="pill">${esc(f.codigo)}</span>` : ""}</td>
        <td><b>${esc(f.nombre)}</b></td>
        <td class="num">${f.publica === null ? `<b>N/A</b>` : `<b>${esc(moneyMN(f.publica))}</b>`}
          <div class="hint">fija</div></td>
        <td class="num"><input class="field conv" inputmode="decimal" data-pub="${f.publica === null ? "" : f.publica}"
              value="${on ? esc(f.convenio) : ""}" placeholder="—" style="width:100%;text-align:right"
              ${on ? "" : "disabled"}></td>
        <td class="num desc">—</td></tr>`; }).join("")}</tbody></table>`;
  };

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${existente ? "Editar convenio" : "Nuevo convenio"}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="grid">
          <div class="full"><label class="lbl">Cliente</label>
            ${buscadorCliente(v.clienteId, "cCli")}</div>
          <div class="full"><label class="lbl">Ejecutivo de ventas</label>
            ${selectEjecutivo(v.ejecutivo || (cliente(v.clienteId) || {}).ejecutivo || miNombre(), "cEje")}
            <div class="hint">Quien firma la carta por el hotel y a quien se le avisa cuando el
              cliente la firma. La lista sale de <i>Ajustes → Usuarios y permisos</i>.</div></div>
          <div><label class="lbl">Folio</label>
            ${/* No se teclea. El número lo reparte el servidor en el momento de la
                  firma, y hasta entonces no existe: así no hay dos iguales ni se
                  salta ninguno. Ver folioParaFirmar. */""}
            <div class="field" id="cFolio" data-folio="${esc(v.folio)}"
              style="display:flex;align-items:center;min-height:38px;${v.folio
                ? "font-weight:600" : "color:var(--muted)"}"
              >${v.folio ? esc(v.folio) : "Se asigna al firmar"}</div>
            <div class="hint" id="cFolioNota">${v.folio ? ""
              : "El consecutivo lo lleva el hotel, no este equipo."}</div></div>
          <div><label class="lbl">Fecha de la carta</label><input class="field" type="date" id="cFecha" value="${esc(v.fecha)}"></div>
          <div><label class="lbl">Vigencia desde</label><input class="field" type="date" id="cDesde" value="${esc(v.vigenciaDesde)}"></div>
          <div><label class="lbl">Vigencia hasta</label><input class="field" type="date" id="cHasta" value="${esc(v.vigenciaHasta)}"></div>
        </div>

        ${/* Aquí sale el aviso si una tarifa cambia mientras esto está abierto.
              Lo llena avisarTarifas(), que lo dispara el sondeo. */""}
        <div data-aviso-tarifas></div>

        <h3 class="sec">Bloque ${esc(infoGrupo("deluxe").nombre)}</h3>
        <div id="cErr"></div>
        <div class="note">Marca las habitaciones que entran en este convenio. La <b>tarifa pública</b>
          viene del catálogo y no se edita aquí; <b>toda habitación marcada necesita su tarifa convenio</b>.</div>
        <div id="bloqueDeluxe">${bloque("deluxe")}</div>

        <h3 class="sec">Bloque ${esc(infoGrupo("recovery").nombre)}</h3>
        <h3 class="sec">Desayunos</h3>
        <p class="hint" style="margin-top:0">Se puede escoger más de uno. Sale en la carta,
          debajo de las tarifas.</p>
        <div class="opciones" id="cDesayunos">
          ${DESAYUNOS.map(d => pildora(
            `<input type="checkbox" class="desay" value="${d.id}"${
              v.desayunos.includes(d.id) ? " checked" : ""}>`, d.name)).join("")}
        </div>

        <p><label><input type="checkbox" id="cRec" ${v.incluyeRecovery ? "checked" : ""}>
          Considerar también habitaciones ${esc(infoGrupo("recovery").nombre)} en este convenio</label></p>
        <div id="bRecovery" ${v.incluyeRecovery ? "" : 'style="display:none"'}>${bloque("recovery")}</div>

        <h3 class="sec">Observaciones internas</h3>
        <p class="hint" style="margin-top:0">No se imprimen en la carta; son notas para el equipo.</p>
        <textarea class="field" id="cNotas" style="width:100%;min-height:80px">${esc(v.notas)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDel">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="bOk">Guardar borrador</button>
        <button class="btn ok" id="bFirmar">Guardar y firmar</button>
      </div>
    </div>`);

  const recalcular = () => ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
    const inp = tr.querySelector(".conv");
    const sel = tr.querySelector(".sel").checked;
    const pub = inp.dataset.pub === "" ? null : Number(inp.dataset.pub);
    const celda = tr.querySelector(".desc");
    const val = inp.value.trim();
    if (!sel || !val || pub === null || !pub){ celda.textContent = "—"; celda.style.color = ""; return; }
    const pct = Math.round((1 - parseMoney(val)/pub) * 100);
    celda.textContent = (pct >= 0 ? "-" : "+") + Math.abs(pct) + "%";
    celda.style.color = pct < 0 ? "var(--bad)" : "var(--muted)";
  });

  /** La casilla manda: sin marcar, la tarifa ni se captura. */
  function sincroniza(tr, foco){
    const sel = tr.querySelector(".sel").checked;
    const inp = tr.querySelector(".conv");
    inp.disabled = !sel;
    tr.classList.toggle("off", !sel);
    if (!sel){
      inp.value = "";
      tr.classList.remove("row-err");
      inp.classList.remove("err");
    } else if (foco) inp.focus();
    recalcular();
  }

  ov.addEventListener("change", e => {
    if (e.target.classList.contains("sel")) sincroniza(e.target.closest("tr"), true);
  });
  ov.addEventListener("input", e => {
    if (!e.target.classList.contains("conv")) return;
    e.target.classList.remove("err");
    e.target.closest("tr").classList.remove("row-err");
    recalcular();
  });
  recalcular();

  ov.querySelector("#cRec").onchange = e => {
    ov.querySelector("#bRecovery").style.display = e.target.checked ? "" : "none";
    validar();          // al apagarlo desaparece su reclamo, al prenderlo aparece
  };

  const bDel = ov.querySelector("#bDel");
  if (bDel) bDel.onclick = () => {
    if (!confirm("¿Eliminar este convenio? Esta acción no se puede deshacer.")) return;
    state.convenios = state.convenios.filter(x => x.id !== v.id);
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  /**
   * Traer las tarifas nuevas sin borrar lo que ya se negoció.
   *
   * Se repinta la tarifa PÚBLICA y el descuento; la tarifa convenio —que es lo
   * que costó trabajo teclear— se conserva tal cual. Y no se hace solo:
   * cambiarle los números por debajo a alguien que está negociando es otra
   * manera de provocar el error que se quiere evitar.
   */
  const actualizarTarifas = () => {
    const puestas = new Map();
    ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
      puestas.set(tr.dataset.tipo, {
        conv: tr.querySelector(".conv").value,
        sel:  tr.querySelector(".sel").checked
      });
    });
    for (const f of filas){
      const h = state.habitaciones.find(x => x.id === f.tipoId);
      if (h) f.publica = h.publica;
    }
    ov.querySelector("#bloqueDeluxe").innerHTML = bloque("deluxe");
    ov.querySelector("#bRecovery").innerHTML    = bloque("recovery");
    /* Los manejadores viven en el contenedor, no en cada fila, así que
       repintar las tablas no los desconecta. Sólo hay que devolver lo que
       estaba tecleado y volver a poner cada renglón en su estado. */
    ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
      const p = puestas.get(tr.dataset.tipo);
      if (!p) return;
      tr.querySelector(".conv").value  = p.conv;
      tr.querySelector(".sel").checked = p.sel;
      sincroniza(tr, false);
    });
    tarifasCambiadas = null;
    avisarTarifas();
    recalcular();
  };
  ov.addEventListener("click", e => {
    if (e.target.closest("[data-actualizar-tarifas]")) actualizarTarifas();
  });
  avisarTarifas();   // por si ya había cambiado algo antes de abrir

  /* Aquí vivía el adivinador del folio: proponía un número contando lo que
     este equipo alcanzaba a ver, lo acomodaba contra el servidor, y avisaba si
     chocaba. Se fue completo, y con él el defecto: proponer un número que no
     va a ser el suyo es lo que hizo que Carmen y Eduardo firmaran los dos el
     CV-2026-018. Ahora el borrador no tiene folio y el número se pide al
     contador en el momento de firmar. Ver folioParaFirmar. */

  // El ejecutivo sigue al cliente mientras nadie lo haya cambiado a mano.
  {
    const fCli = ov.querySelector("#cCli"), fEje = ov.querySelector('[name="cEje"]');
    let auto = existente ? null : fEje.value;
    fEje.addEventListener("change", () => { if (fEje.value !== auto) auto = null; });
    fCli.addEventListener("change", () => {
      if (auto === null || fEje.value !== auto) return;
      const e = String((cliente(fCli.value) || {}).ejecutivo || "").trim();
      if (e && [...fEje.options].some(o => o.value === e)) fEje.value = auto = e;
    });
  }

  // Guardar espera al servidor: es ahí donde se aparta el folio. Se bloquea el
  // botón mientras tanto para que dos clics no levanten dos convenios.
  const guardando = async (b, fn) => {
    const antes = b.textContent;
    b.disabled = true; b.textContent = "Guardando\u2026";
    try{ return await fn(); }
    finally{ b.disabled = false; b.textContent = antes; }
  };
  ov.querySelector("#bOk").onclick = e => guardando(e.currentTarget, async () => {
    if (await recoger()){ ov.remove(); if (alCerrar) alCerrar(); }
  });
  ov.querySelector("#bFirmar").onclick = e => guardando(e.currentTarget, async () => {
    if (!await recoger()) return;
    ov.remove();
    verConvenio(v.id, alCerrar, true);
  });

  /** Filas que cuentan: las de un bloque vigente (Recovery sólo si está activo). */
  function filasVigentes(){
    const incRec = ov.querySelector("#cRec").checked;
    return [...ov.querySelectorAll("tr[data-tipo]")].map(tr => {
      const cat = state.habitaciones.find(h => h.id === tr.dataset.tipo);
      if (!cat || (cat.grupo === "recovery" && !incRec)) return null;
      return { tr, cat, sel: tr.querySelector(".sel").checked, val: tr.querySelector(".conv").value.trim() };
    }).filter(Boolean);
  }

  function pintaErrores(lista){
    const caja = ov.querySelector("#cErr");
    caja.innerHTML = lista.length
      ? `<div class="errbox"><b>Falta esto para poder continuar:</b><ul>${
          lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      : "";
  }

  /**
   * Devuelve las habitaciones listas para guardar, o null si algo falta.
   * Reglas: al menos una habitación marcada; toda marcada con su tarifa
   * convenio; y si el bloque Recovery está activo, al menos una de ese bloque.
   */
  function validar(){
    ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
      tr.classList.remove("row-err");
      tr.querySelector(".conv").classList.remove("err");
    });

    const vigentes = filasVigentes();
    const marcadas = vigentes.filter(f => f.sel);
    const sinTarifa = marcadas.filter(f => parseMoney(f.val) <= 0);
    const problemas = [];

    if (!marcadas.length)
      problemas.push("Marca al menos un tipo de habitación para este convenio.");

    if (sinTarifa.length){
      problemas.push("Captura la tarifa convenio de: " +
        sinTarifa.map(f => f.cat.codigo || f.cat.nombre).join(", ") + ".");
      sinTarifa.forEach(f => {
        f.tr.classList.add("row-err");
        f.tr.querySelector(".conv").classList.add("err");
      });
    }

    const rec = infoGrupo("recovery").nombre;
    if (ov.querySelector("#cRec").checked && !marcadas.some(f => f.cat.grupo === "recovery"))
      problemas.push(`Activaste el bloque ${rec}: marca al menos una habitación de ese bloque con su tarifa, o desactívalo.`);

    pintaErrores(problemas);
    if (problemas.length){
      const primera = ov.querySelector("tr.row-err") || ov.querySelector("#cErr");
      if (primera) primera.scrollIntoView({ block:"center", behavior:"smooth" });
      return null;
    }
    return marcadas.map(f => ({
      tipoId: f.cat.id, codigo: f.cat.codigo, nombre: f.cat.nombre, grupo: f.cat.grupo,
      publica: f.cat.publica, convenio: parseMoney(f.val)
    }));
  }

  /**
   * El folio se decide al guardar, no al abrir el editor.
   *
   * Entre que alguien abre el editor y le da guardar pueden pasar minutos, y
   * en ese rato otro pudo haber tomado el mismo número. Sólo se recalcula si
   * sigue siendo el que puso la aplicación: si lo escribieron a mano, manda
   * lo que escribieron aunque se repita.
   */
  async function recoger(){
    const cid = ov.querySelector("#cCli").value;
    if (!cid){
      pintaErrores(["Selecciona el cliente del convenio."]);
      ov.querySelector("#cCli").focus();
      return false;
    }

    const habs = validar();
    if (!habs) return false;

    const desde = ov.querySelector("#cDesde").value, hasta = ov.querySelector("#cHasta").value;
    if (desde && hasta && hasta < desde){
      pintaErrores(['La vigencia "hasta" no puede ser anterior a "desde".']);
      return false;
    }
    pintaErrores([]);

    /* El folio NO se toca al guardar. Un borrador no tiene número y no gasta
       ninguno: por eso la serie deja de tener huecos cuando alguien abandona
       un borrador. Lo toma al firmar. */
    Object.assign(v, {
      clienteId: cid,
      ejecutivo: ov.querySelector('[name="cEje"]').value.trim(),
      fecha: ov.querySelector("#cFecha").value || hoyISO(),
      vigenciaDesde: desde, vigenciaHasta: hasta,
      incluyeRecovery: ov.querySelector("#cRec").checked,
      desayunos: [...ov.querySelectorAll(".desay:checked")].map(x => x.value),
      habitaciones: habs,
      notas: ov.querySelector("#cNotas").value.trim(),
      grupos: saneaGrupos(state.ajustes.grupos),
      updatedAt: new Date().toISOString()
    });
    if (!existente){ v.createdAt = new Date().toISOString(); state.convenios.push(v); }

    /* Lo que se GUARDA es la tarifa pública viva del catálogo, no la que se
       estaba viendo en pantalla. Si alguien tuvo el editor abierto mientras el
       administrador cambió un precio, vio un descuento y guardó otro. Guardar
       así es legítimo —el precio pudo pactarse antes— pero tiene que quedar
       constancia; nadie debería descubrirlo leyendo el PDF. */
    const movidas = habs.filter(h => {
      const vista = filas.find(f => f.tipoId === h.tipoId);
      return vista && vista.publica !== null && h.publica !== null &&
             Number(vista.publica) !== Number(h.publica);
    });
    if (movidas.length)
      registrarAuto(cid, "La tarifa pública cambió mientras se armaba el convenio",
        movidas.map(h => {
          const vista = filas.find(f => f.tipoId === h.tipoId);
          return `${h.nombre}: en pantalla decía ${money(vista.publica)} y se guardó ` +
                 `con ${money(h.publica)}, que es la del catálogo.`;
        }).join("\n") + "\n\nLa tarifa convenio es la que se tecleó; sólo cambió la pública.", "");

    guardar(); render();
    return true;
  }
}
