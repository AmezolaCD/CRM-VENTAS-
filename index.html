}

/** Si algo falta, se dice con todas sus letras en vez de fallar callado. */
function porQueNoHayIA(){
  if (!nube.url || !nube.anon)
    return "Este equipo no está conectado a la nube del hotel, y la IA vive ahí. " +
           "Toque el chip de arriba a la derecha para conectarlo.";
  if (!nube.sesion || !nube.sesion.access_token)
    return "Hay que entrar con su correo y contraseña para poder preguntar.";
  return "";
}

/**
 * Le pregunta a la función de Supabase, que es la que tiene la llave.
 *
 * La respuesta llega por pedazos para que el texto aparezca conforme se
 * escribe, en vez de dejar el recuadro en blanco medio minuto.
 */
async function preguntarIA(mensajes, conDatos, alLlegar){
  const r = await fetch(ligaFuncionIA(), {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + nube.sesion.access_token,
      "apikey": nube.anon
    },
    body: JSON.stringify({
      mensajes,
      instrucciones: INSTRUCCIONES_IA,
      contexto: conDatos ? contextoIA() : ""
    })
  });

  if (!r.ok){
    const t = await r.text().catch(() => "");
    if (r.status === 404)
      throw new Error("la función de IA no está montada en Supabase todavía. " +
        "Sistemas tiene que subir supabase/functions/ia (viene explicado en IA.md).");
    if (r.status === 401 || r.status === 403)
      throw new Error("la nube no aceptó la sesión. Cierre sesión y vuelva a entrar.");
    throw new Error(`${r.status} · ${String(t).slice(0, 300) || "sin detalle"}`);
  }
  if (!r.body) throw new Error("este navegador no puede leer la respuesta por pedazos.");

  const lector = r.body.getReader();
  const deco = new TextDecoder();
  let resto = "";
  for (;;){
    const { value, done } = await lector.read();
    if (done) break;
    resto += deco.decode(value, { stream:true });
    const lineas = resto.split("\n");
    resto = lineas.pop();
    for (const l of lineas){
      if (!l.trim()) continue;
      let d;
      try{ d = JSON.parse(l); }catch(e){ continue; }
      if (d.error) throw new Error(d.error);
      if (d.t) alLlegar(d.t);
      if (d.motor) motorIA = NOMBRE_MOTOR[d.motor] || d.motor;
    }
  }
}

/* ==========================================================================
   LA PÁGINA DEL CLIENTE

   El cliente no tiene cuenta ni tiene por qué tenerla: abre un enlace, lee su
   convenio y firma. Esta parte de la aplicación se enciende cuando el enlace
   trae "#firmar=..." y no enseña nada del CRM — ni tablero, ni cartera, ni
   pestañas—: sólo su documento.

   El enlace lleva la clave del convenio, y esa clave es lo único que abre ese
   convenio y ningún otro. La firma no se guarda encima del documento: se deja
   en un buzón aparte (crm_firmas) donde el visitante sólo puede depositar, no
   leer ni corregir. El CRM la recoge de ahí y la aplica. Así, aunque alguien
   estuviera de mirón, no podría leer convenios ajenos ni alterar el suyo.
   ========================================================================== */

const enlaceDeFirma = () => {
  const m = String(location.hash || "").match(/[#&]firmar=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try{
    const d = JSON.parse(deB64url(m[1]));
    return (d && d.v && d.t && d.u && d.k) ? d : null;
  }catch(e){ return null; }
};

function pantallaFirmaCliente(datos){
  // Se suelta la página a mano, además de por clase.
  //
  // El CRM fija el alto a la pantalla y esconde lo que sobra, porque son sus
  // columnas las que se desplazan. Un convenio de tres páginas necesita lo
  // contrario. Va en el propio elemento y no sólo en la hoja de estilos porque
  // esta pantalla la abre gente de fuera, en el teléfono que sea, y si una
  // regla se cuela por encima el cliente se queda sin poder llegar a firmar.
  document.documentElement.classList.add("modo-firma");
  document.documentElement.classList.remove("intro-activa");
  for (const el of [document.documentElement, document.body]){
    el.style.setProperty("height", "auto", "important");
    el.style.setProperty("min-height", "100%", "important");
    el.style.setProperty("max-height", "none", "important");
    el.style.setProperty("overflow", "visible", "important");
    el.style.setProperty("display", "block", "important");
    el.style.setProperty("position", "static", "important");
  }
  document.body.innerHTML = `<div id="firmaCliente"></div>`;
  const caja = document.getElementById("firmaCliente");
  const aviso = (clase, html) => { caja.innerHTML = `<div class="note ${clase}">${html}</div>`; };

  aviso("", "Abriendo su convenio…");

  const pedir = (ruta, opciones = {}) => fetch(datos.u + ruta, Object.assign({}, opciones, {
    headers: Object.assign({
      apikey: datos.k, "Content-Type":"application/json", "x-firma-token": datos.t
    }, opciones.headers || {})
  }));

  pedir(`/rest/v1/crm_datos?select=id,datos&id=eq.${encodeURIComponent("convenios:" + datos.v)}`)
    .then(async r => {
      const txt = await r.text();
      if (!r.ok) throw new Error(`${r.status} · ${txt.slice(0,200)}`);
      const filas = JSON.parse(txt || "[]");
      if (!filas.length) throw new Error("vacio");
      return saneaConv(filas[0].datos);
    })
    .then(v => dibujarParaFirmar(caja, v, datos, pedir))
    .catch(e => {
      if (String(e.message) === "vacio")
        aviso("warn", `<b>Este enlace ya no sirve.</b><br><br>Puede ser que el convenio ya se
          haya firmado, o que le hayan mandado un enlace nuevo. Pídale al hotel que se lo
          reenvíe.`);
      else if (/401|403|permission|policy/i.test(e.message))
        aviso("warn", `<b>Este enlace todavía no está habilitado.</b><br><br>Avísele al hotel:
          les falta correr el archivo <code>firmas.sql</code> en su servidor.
          <br><br><span class="hint">${esc(e.message)}</span>`);
      else
        aviso("warn", `<b>No se pudo abrir el convenio.</b><br>${esc(e.message)}
          <br><br>Revise su conexión y vuelva a abrir el enlace.`);
    });
}

      const bytes = await pdfDeConvenio(v, c);

    }catch(err){ alert("No se pudo generar el PDF: " + err.message + "\n\nUse Imprimir del navegador."); }
    finally{ b.disabled = false; b.textContent = antes; }
  };

  const zona = caja.querySelector("#zonaFirma");
  if (v.firmaEmpresa){
    zona.innerHTML = `<div class="note"><b>Este convenio ya está firmado.</b> No hay nada más
      que hacer; conserve el PDF para sus registros.</div>`;
    return;
  }

  zona.innerHTML = `
    <h3 class="sec">Su firma</h3>
    <div class="grid">
      <div class="full"><label class="lbl">Nombre completo</label>
        <input class="field" id="cfNombre" style="width:100%" autocomplete="name"></div>
      <div><label class="lbl">Puesto</label><input class="field" id="cfPuesto" style="width:100%"></div>
      <div><label class="lbl">Celular</label><input class="field" id="cfCel" style="width:100%" inputmode="tel"></div>
    </div>
    <label class="lbl" style="margin-top:10px;display:block">Firme con el dedo o el ratón</label>
    <canvas class="sign-pad" id="pad"></canvas>
    <p><button class="btn sm" id="cfBorrar">Borrar y volver a firmar</button></p>
    <div id="cfErr"></div>
    <p><button class="btn ok" id="cfOk" style="width:100%;font-size:16px;padding:12px">
      Firmar el convenio</button></p>
    <p class="hint">Al firmar, su firma queda registrada con la fecha y la hora.</p>`;

  const limpiar = prepararPad(zona.querySelector("#pad"));
  zona.querySelector("#cfBorrar").onclick = limpiar;

  zona.querySelector("#cfOk").onclick = async e => {
    const err = zona.querySelector("#cfErr");
    const nombre = zona.querySelector("#cfNombre").value.trim();
    const pad = zona.querySelector("#pad");

    err.innerHTML = "";
    const b = e.currentTarget, antes = b.textContent;
    b.disabled = true; b.textContent = "Enviando…";
    try{
      const r = await pedir("/rest/v1/crm_firmas", {
        method:"POST",
        headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({
          convenio_id: datos.v, token: datos.t, nombre,

          celular: zona.querySelector("#cfCel").value.trim(),
          img: pad.toDataURL("image/png")

      caja.innerHTML = `<div class="note" style="border-left:3px solid var(--ok)">
        <b>Listo, ${esc(nombre)}. Su convenio quedó firmado.</b><br><br>

        antes de cerrarlo y use <i>Descargar en PDF</i>.</div>`;
      window.scrollTo(0, 0);
    }catch(ex){
      err.innerHTML = `<div class="errbox">No se pudo registrar la firma.<br>${esc(ex.message)}
        <br><br>Intente de nuevo, o avísele a su ejecutivo.</div>`;

/* ----- El convenio se cierra por tres caminos ----- */

/** El enlace que se le manda al cliente para que firme en su pantalla. */
const ligaFirma = v =>
  location.origin + location.pathname + "#firmar=" +
  b64url(JSON.stringify({ v: v.id, t: v.tokenFirma, u: nube.url, k: nube.anon }));

const puedeMandarLiga = () => !!(nube.url && nube.anon);

/**
 * Aplica la firma del cliente, venga de donde venga: de la pantalla, de un
 * PDF escaneado, o capturada a mano por el ejecutivo. Los tres caminos tienen
 * que dejar el convenio y el cliente exactamente igual, o el tablero acabaría
 * diciendo una cosa y la carta otra.
 */
function cerrarConvenio(v, firma, comoLlego, quien){
  const fecha = new Date().toISOString();
  const c = cliente(v.clienteId);
  if (firma) v.firmaEmpresa = saneaFirma(firma);
  v.estado = "firmado_cliente";
  v.updatedAt = fecha;
  v.tokenFirma = "";          // el enlace deja de servir en cuanto se firma
  v.avisado = false;          // hay novedad que contarle al ejecutivo
  if (c){
    c.estatus = "ganado";
    c.updatedAt = fecha;
    const precios = v.habitaciones.map(x => Number(x.convenio)).filter(n => n > 0);
    if (precios.length) c.tarifa = Math.min(...precios);
  }
  registrarAuto(v.clienteId, `Convenio ${v.folio} firmado por el cliente`,
    `${comoLlego}\nEl cliente pasó automáticamente a "Ganado".`,
    quien || ejecutivoDe(v));
  guardar();
}

/** Convenios firmados por el cliente que el ejecutivo todavía no ha visto. */
const novedadesFirma = () => !veHospedaje() ? [] : state.convenios.filter(v =>
  v.estado === "firmado_cliente" && v.firmaEmpresa && !v.avisado && convenioEsMio(v));

function pintarAvisos(){
  const el = document.getElementById("avisos");

  const ns = novedadesFirma();

  el.style.display = "";
  el.innerHTML = `<span>✍️</span> ${ns.length === 1
      ? `<b>${esc(nombreCli(ns[0].clienteId))}</b> firmó el convenio ${esc(ns[0].folio)}`
      : `<b>${ns.length} convenios</b> fueron firmados por el cliente`}`;
  el.title = ns.map(v => `${v.folio} · ${nombreCli(v.clienteId)}`).join("\n");
  el.onclick = () => {
    if (ns.length === 1){ verConvenio(ns[0].id); return; }
    vista = "convenios"; render();
  };
}

/** Se da por visto al abrir la carta: ya lo está viendo. */
function marcarVisto(v){
  if (v.estado === "firmado_cliente" && !v.avisado){
    v.avisado = true;
    guardar();
    pintarAvisos();
  }
}

function enviarConvenio(v, c){
  const h = state.ajustes.hotel;
  const asunto = `Carta-convenio ${v.folio} · ${h.nombre}`;
  const archivo = nombrePdfConvenio(v, c);
  const conLiga = puedeMandarLiga() && !!v.tokenFirma;
  const firmante = (v.firmaHotel && v.firmaHotel.nombre) || ejecutivoDe(v);

  const saludo = `Estimado(a) ${(c && c.contacto) || ""}:\n\n` +
    `Adjunto la carta-convenio ${v.folio} de ${h.nombre}, vigente ` +
    `${textoVigencia(v)}, ya firmada por nuestra parte.\n\n`;
  const despedida = `\nSaludos cordiales,\n${firmante}\n${h.nombre}`;

  const msgLiga = saludo +
    `Puede revisarla y firmarla desde este enlace, sin instalar nada:\n${conLiga ? ligaFirma(v) : ""}\n\n` +
    `En cuanto la firme, queda registrada de nuestro lado.` + despedida;
  const msgPdf = saludo +
    `Le suplicamos hacerla llegar debidamente firmada de aceptación para proceder con la carga ` +
    `de tarifas en nuestro sistema de reservaciones.` + despedida;

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Enviar convenio al cliente</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="cuerpoEnvioC">
        <p class="hint">Preparando el convenio…</p>
      </div>
      <div class="modal-foot"><div class="spacer"></div><button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const anotar = via => {
    v.enviado = { fecha: new Date().toISOString(), via, quien: correoSesion() };
    registrarAuto(v.clienteId, `Convenio ${v.folio} enviado por ${VIAS[via]}`,
      `Enviado a ${via === "correo" ? (c && c.email) : (c && c.telefono)}.`, ejecutivoDe(v));
    guardar(); render();
  };
  const abrirCorreo = cuerpo => {
    window.location.href = `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
    anotar("correo");
  };
  const abrirWa = cuerpo => { window.open(waLink(c.telefono, cuerpo), "_blank", "noopener"); anotar("whatsapp"); };

  const botones = (id, hint) => `
    <p class="hint" style="margin:10px 0 4px">${hint}</p>
    <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn" data-mail="${id}" ${(c && c.email) ? "" : "disabled"}>Enviar por correo</button>
      <button class="btn wa" data-wa="${id}" ${(c && c.telefono) ? "" : "disabled"}
        title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button></p>`;

  pdfDeConvenio(v, c).then(bytes => {
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" && navigator.canShare({ files:[file] });
    const bajar = () => descargarBlob(blob, archivo);

    ov.querySelector("#cuerpoEnvioC").innerHTML = (conLiga
      ? `<h3 class="sec" style="margin-top:0">Que lo firme en su pantalla</h3>
         <div class="note"><b>Es el camino corto.</b> El cliente abre el enlace desde su
           teléfono o computadora, lee el convenio y lo firma con el dedo o el ratón. Cuando
           firme, este convenio pasa a <b>Firmado por cliente</b> y el cliente a
           <b>Ganado</b>, y aquí te avisamos.</div>
         ${botones("liga", "Se manda el enlace con el mensaje ya redactado:")}
         <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
           <button class="btn sm" id="cCopiar">Copiar el enlace</button>
           <span class="hint">El enlace sólo abre este convenio y deja de servir en cuanto se firma.</span></p>
         <h3 class="sec">O mándale el PDF</h3>
         <div class="note warn">Para quien prefiera imprimirlo y firmarlo a mano. Cuando te
           lo devuelva, súbelo con <b>Subir convenio firmado</b> en la carta.</div>`
      : `<div class="note warn"><b>El enlace de firma no está disponible.</b>
           ${puedeMandarLiga()
             ? "Este convenio se firmó antes de que existiera esa opción: vuelve a abrir la carta y usa <i>Rehacer enlace de firma</i>."
             : "Hace falta tener la nube configurada (Ajustes → Nube y equipo): el enlace vive ahí."}
           <br><br>Mientras tanto, mándale el PDF para que lo firme a mano.</div>`) +
      (puedeCompartir
        ? `<p><button class="btn ok" id="cCompartir" style="font-size:15px;padding:10px 16px">
             Compartir el PDF y el mensaje</button></p>`
        : "") +
      `<p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <button class="btn" id="cBajar">Descargar el PDF</button></p>` +
      botones("pdf", "O ábrelo con el mensaje del PDF:") +
      `<p class="hint">Se guardará como <b>${esc(archivo)}</b></p>
       <p class="hint" style="margin-top:14px">Si te lo devuelve firmado en papel, ábrelo desde
         la carta y usa <i>Subir convenio firmado</i>: queda igual de cerrado que si lo hubiera
         firmado en pantalla.</p>`;

    const cop = ov.querySelector("#cCopiar");
    if (cop) cop.onclick = async () => {
      try{ await navigator.clipboard.writeText(ligaFirma(v)); alert("Enlace copiado."); }
      catch(e){ prompt("Copia este enlace y mándaselo al cliente:", ligaFirma(v)); }
    };
    const bc = ov.querySelector("#cCompartir");
    if (bc) bc.onclick = async () => {
      try{
        await navigator.share({ files:[file], text: msgPdf, title: asunto });
        anotar("correo");
        ov.remove();
      }catch(err){ if (err && err.name !== "AbortError") alert("No se pudo compartir: " + err.message); }
    };
    ov.querySelector("#cBajar").onclick = bajar;
    ov.querySelectorAll("[data-mail]").forEach(b => { if (!b.disabled) b.onclick = () =>
      abrirCorreo(b.dataset.mail === "liga" ? msgLiga : msgPdf); });
    ov.querySelectorAll("[data-wa]").forEach(b => { if (!b.disabled) b.onclick = () =>
      abrirWa(b.dataset.wa === "liga" ? msgLiga : msgPdf); });
  }).catch(err => {
    ov.querySelector("#cuerpoEnvioC").innerHTML =
      `<div class="note warn"><b>No se pudo generar el PDF aquí.</b> ${esc(err.message)}</div>` +
      (conLiga ? botones("liga", "El enlace de firma sí funciona; mándaselo:") : "") +
      `<p><button class="btn" id="cVer">Abrir la carta para imprimirla</button></p>`;
    ov.querySelector("#cVer").onclick = () => { ov.remove(); verConvenio(v.id); };
    ov.querySelectorAll("[data-mail]").forEach(b => { if (!b.disabled) b.onclick = () => abrirCorreo(msgLiga); });
    ov.querySelectorAll("[data-wa]").forEach(b => { if (!b.disabled) b.onclick = () => abrirWa(msgLiga); });
  });
}

/** Lienzo de firma: ratón, dedo o lápiz. */
function padFirma(titulo, def, alFirmar, opciones){
  // recordar: es la firma de quien está usando la aplicación, así que se le
  // puede ofrecer guardarla. La del cliente no: esa es de otra persona.
  const op = Object.assign({ recordar:false }, opciones || {});
  const previa = op.recordar ? firmaGuardada() : null;

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${esc(titulo)}</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="grid" style="margin-bottom:14px">
          <div class="full"><label class="lbl">Nombre</label>
            <input class="field" id="fNombre" value="${esc(def.nombre || (previa && previa.nombre) || "")}" placeholder="Nombre completo"></div>
          <div><label class="lbl">Puesto</label>
            <input class="field" id="fPuesto" value="${esc(def.puesto || (previa && previa.puesto) || "")}"></div>
          <div><label class="lbl">Celular</label>
            <input class="field" id="fCel" value="${esc(def.celular || (previa && previa.celular) || "")}"></div>
        </div>
        ${previa ? `<div id="cajaPrevia">
          <label class="lbl">Su firma guardada</label>
          <div class="firma-previa"><img src="${previa.img}" alt="Firma guardada"></div>
          <p class="hint" style="margin:6px 0 0">Se traza una vez y se vuelve a usar sola.
            <button class="btn sm" id="bOtra" type="button">Trazar otra</button>
            <button class="btn sm danger" id="bOlvidar" type="button">Borrarla</button></p>
        </div>` : ""}
        <div id="cajaPad"${previa ? ` style="display:none"` : ""}>
          <label class="lbl">Firma (traza con el ratón o el dedo)</label>
          <canvas class="sign-pad" id="pad"></canvas>
          ${op.recordar ? `<p style="margin:8px 0 0"><label><input type="checkbox" id="fRecordar" checked>
            Guardar esta firma para no volver a trazarla</label></p>` : ""}
        </div>
        <p class="hint" style="margin-top:6px">Una vez firmado, el convenio ya no se puede editar.</p>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bClear"${previa ? ` style="display:none"` : ""}>Borrar trazo</button>
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn ok" id="bOk">Firmar</button>
      </div>
    </div>`);

  const cv = ov.querySelector("#pad");
  const bClear = ov.querySelector("#bClear");
  let usandoPrevia = !!previa, limpiar = null;

  /** El lienzo se prepara cuando se ve: oculto mide cero y la firma saldría vacía. */
  function mostrarPad(){
    usandoPrevia = false;
    const caja = ov.querySelector("#cajaPrevia");
    if (caja) caja.style.display = "none";
    ov.querySelector("#cajaPad").style.display = "";
    bClear.style.display = "";
    if (!limpiar) limpiar = prepararPad(cv);
  }
  if (!previa) mostrarPad();

  const bOtra = ov.querySelector("#bOtra");
  if (bOtra) bOtra.onclick = mostrarPad;

  const bOlvidar = ov.querySelector("#bOlvidar");
  if (bOlvidar) bOlvidar.onclick = () => {
    if (!confirm("¿Borrar la firma guardada? La próxima vez habrá que trazarla de nuevo.")) return;
    olvidarFirmaPropia();
    ov.querySelector("#cajaPrevia").remove();
    mostrarPad();
  };

  bClear.onclick = () => { if (limpiar) limpiar(); };

  ov.querySelector("#bOk").onclick = () => {
    const nombre = ov.querySelector("#fNombre").value.trim();
    if (!nombre){ alert("Escribe el nombre de quien firma."); return; }
    if (!usandoPrevia && !cv.dataset.trazado){ alert("Falta trazar la firma."); return; }
    const img = usandoPrevia ? previa.img : padAPng(cv);
    const puesto  = ov.querySelector("#fPuesto").value.trim();
    const celular = ov.querySelector("#fCel").value.trim();
    const recordar = ov.querySelector("#fRecordar");
    if (!usandoPrevia && recordar && recordar.checked)
      guardarFirmaPropia({ nombre, puesto, celular, img });
    ov.remove();
    alFirmar({ nombre, puesto, celular, img });
  };
}

/**
 * Deja un <canvas> listo para firmar con el dedo, el ratón o un lápiz.
 *
 * Lo usan el pad del ejecutivo y la página del cliente, que son pantallas muy
 * distintas: por eso vive aparte y no dentro de ninguna de las dos.
 */
function prepararPad(cv){
  const ctx = cv.getContext("2d");
  let trazando = false, last = null;
  cv.dataset.trazado = "";

  // Se dimensiona en píxeles físicos para que la firma no salga pixelada al imprimir.
  const medir = () => {
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width  = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#39104e";
  };
  requestAnimationFrame(medir);

  const punto = ev => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
  cv.addEventListener("pointerdown", ev => {
    ev.preventDefault(); trazando = true; cv.dataset.trazado = "sí";
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    last = punto(ev);
  });
  cv.addEventListener("pointermove", ev => {
    if (!trazando) return;
    const p = punto(ev);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const fin = () => { trazando = false; };
  cv.addEventListener("pointerup", fin);
  cv.addEventListener("pointercancel", fin);
  cv.addEventListener("pointerleave", fin);

  return () => { ctx.clearRect(0, 0, cv.width, cv.height); cv.dataset.trazado = ""; };
}

/** La firma como PNG con fondo blanco: uno transparente se ve mal al imprimir. */
function padAPng(cv){
  const out = document.createElement("canvas");
  out.width = cv.width; out.height = cv.height;
  const o = out.getContext("2d");
  o.fillStyle = "#fff"; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(cv, 0, 0);
  return out.toDataURL("image/png");
}

   ========================================================================== */

function abrirImportar(){
  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>Importar clientes</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note">Sube un <b>CSV</b> (o TSV) con la primera fila de encabezados. Desde Excel o
          Google Sheets usa <i>Archivo → Descargar → CSV</i>. También puedes pegar las filas abajo.
          Esto importa <b>clientes</b>; actividades y convenios se capturan dentro de cada ficha.</div>
        <p><input type="file" id="file" class="field" accept=".csv,.tsv,.txt,text/csv,text/plain"></p>
        <p class="hint">o pega aquí las filas (con su fila de encabezados):</p>
        <textarea id="paste" class="field" style="width:100%"
          placeholder="Empresa,Contacto,Teléfono,Correo,Ubicación,Estatus&#10;ACME,Ana López,5512345678,ana@acme.mx,Tijuana,Propuesta"></textarea>
        <div id="mapArea"></div>
      </div>
      <div class="modal-foot"><span class="hint" id="impInfo"></span><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="doImport" disabled>Importar</button></div>
    </div>`);

  let filas = null, heads = [];

  ov.querySelector("#file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => preparar(String(r.result));
    r.onerror = () => alert("No se pudo leer el archivo.");
    r.readAsText(f, "utf-8");
  });
  ov.querySelector("#paste").addEventListener("input", e => {
    const t = e.target.value.trim();
    if (t.length > 10) preparar(t); else limpiar();
  });

  function limpiar(){
    filas = null;
    ov.querySelector("#mapArea").innerHTML = "";
    ov.querySelector("#impInfo").textContent = "";
    ov.querySelector("#doImport").disabled = true;
  }

  function preparar(texto){
    const todo = parseCSV(texto);
    if (todo.length < 2){ limpiar(); ov.querySelector("#impInfo").textContent = "Hacen falta encabezados y al menos una fila."; return; }
    heads = todo[0].map(x => String(x).trim());
    filas = todo.slice(1);

    const hallado = autoMapear(CAMPOS_CLIENTE, heads);

    const cuerpo = CAMPOS_CLIENTE.map(f => {
      const g = hallado[f.key] != null ? hallado[f.key] : -1;
      const opts = [`<option value="-1">— ignorar —</option>`].concat(
        heads.map((x,i) => `<option value="${i}"${i===g?" selected":""}>${esc(x || "(columna "+(i+1)+")")}</option>`)).join("");
      const ej = g > -1 ? ((filas.find(r => String(r[g]||"").trim()) || [])[g] || "") : "";
      return `<tr><td><b>${esc(f.label)}</b>${f.req ? ' <span style="color:var(--bad)">*</span>' : ""}</td>
        <td><select class="field" data-f="${f.key}" style="width:100%">${opts}</select></td>
        <td class="hint" data-p="${f.key}" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ej)}</td></tr>`;
    }).join("");

    ov.querySelector("#mapArea").innerHTML = `
      <h3 class="sec">Relaciona tus columnas</h3>
      <p class="hint" style="margin-top:0">Ya adiviné el mapeo según tus encabezados. Corrige lo que haga falta.</p>
      <div style="max-height:42vh;overflow:auto"><table class="data">
        <thead><tr><th>Campo del CRM</th><th>Columna de tu archivo</th><th>Ejemplo</th></tr></thead>
        <tbody>${cuerpo}</tbody></table></div>
      <p style="margin:12px 0 0"><label><input type="checkbox" id="replace">
        Reemplazar la cartera actual (borra clientes, actividades y convenios existentes)</label></p>`;

    ov.querySelectorAll("#mapArea select").forEach(sel => sel.addEventListener("change", () => {
      const i = Number(sel.value);
      ov.querySelector(`[data-p="${sel.dataset.f}"]`).textContent =
        i > -1 ? ((filas.find(r => String(r[i]||"").trim()) || [])[i] || "") : "";
    }));

    ov.querySelector("#impInfo").textContent = `${filas.length} filas · ${heads.length} columnas detectadas`;
    ov.querySelector("#doImport").disabled = false;
  }

  ov.querySelector("#doImport").onclick = () => {
    if (!filas) return;
    const map = {};
    ov.querySelectorAll("#mapArea select").forEach(s => map[s.dataset.f] = Number(s.value));
    const reemplazar = ov.querySelector("#replace") && ov.querySelector("#replace").checked;
    if (reemplazar && !confirm("Se borrarán TODOS los clientes actuales junto con sus actividades y convenios. ¿Continuar?")) return;

    const nuevos = [];
    for (const r of filas){
      const o = {};
      for (const f of CAMPOS_CLIENTE){
        const i = map[f.key];
        const val = String((i > -1 ? r[i] : "") ?? "").trim();
        if (f.key === "tarifa") o.tarifa = parseMoney(val);
        else if (f.key === "estatus") o.estatus = matchEstatus(val);
        else o[f.key] = val;
      }
      if (!o.empresa && !o.contacto && !o.telefono && !o.email) continue;
      if (!o.empresa) o.empresa = o.contacto || o.email || "(sin nombre)";
      o.id = nuevoId("c");
      o.createdAt = new Date().toISOString();
      nuevos.push(saneaCliente(o));
    }
    if (!nuevos.length){ alert("No se encontraron filas con datos utilizables. Revisa el mapeo."); return; }

    if (reemplazar){ state.clientes = nuevos; state.actividades = []; state.convenios = []; }
    else state.clientes = state.clientes.concat(nuevos);
    guardar(); render(); ov.remove();
    alert(`Se importaron ${nuevos.length} clientes.`);
  };
}

          const opts = [`<option value="-1">— ignorar —</option>`].concat(
            heads.map((x,i) => `<option value="${i}"${i===gi?" selected":""}>${esc(x || "(columna "+(i+1)+")")}</option>`)).join("");
          const ej = gi > -1 ? ((filas.find(r => String(r[gi]||"").trim()) || [])[gi] || "") : "";
          return `<tr><td><b>${esc(f.label)}</b>${f.req ? ' <span style="color:var(--bad)">*</span>' : ""}</td>
            <td><select class="field" data-f="${f.key}" style="width:100%">${opts}</select></td>
            <td class="hint" data-p="${f.key}" style="max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ej)}</td></tr>`;
        }).join("")}</tbody></table></div>
      <p style="margin:12px 0 0"><label><input type="checkbox" id="repG" checked>
        Reemplazar la lista actual de huéspedes</label></p>`;

    ov.querySelectorAll("#mapG select").forEach(sel => sel.addEventListener("change", () => {
      const i = Number(sel.value);
      ov.querySelector(`[data-p="${sel.dataset.f}"]`).textContent =
        i > -1 ? ((filas.find(r => String(r[i]||"").trim()) || [])[i] || "") : "";
    }));
    ov.querySelector("#infoG").textContent = `${filas.length} filas · ${heads.length} columnas detectadas`;
    ov.querySelector("#doImpG").disabled = false;
  }

  ov.querySelector("#doImpG").onclick = () => {
    if (!filas) return;
    const map = {};
    ov.querySelectorAll("#mapG select").forEach(x => map[x.dataset.f] = Number(x.value));
    const reemplazar = ov.querySelector("#repG") && ov.querySelector("#repG").checked;

    const nuevos = [];
    let sinNombre = 0;
    for (const r of filas){
      const o = {};
      for (const f of CAMPOS_HUESPED){
        const i = map[f.key];
        const val = String((i > -1 ? r[i] : "") ?? "").trim();
        if (f.tipo === "fecha") o[f.key] = parseDate(val);
        else if (f.tipo === "entero") o[f.key] = val === "" ? "" : Math.max(0, Math.round(parseMoney(val)));
        else o[f.key] = val;
      }
      // Si sólo viene la columna de apellidos, ésa es el nombre.
      if (!o.nombre && o.apellidos){ o.nombre = o.apellidos; o.apellidos = ""; }
      if (!o.nombre){
        if (Object.values(o).some(v => String(v).trim())) sinNombre++;
        continue;                       // sin nombre no hay carta que emitir
      }
      o.id = nuevoId("g");
      o.createdAt = new Date().toISOString();
      nuevos.push(saneaHuesped(o));
    }
    if (!nuevos.length){ alert("No se encontró ninguna fila con nombre de huésped. Revisa el mapeo."); return; }

    state.huespedes = reemplazar ? nuevos : state.huespedes.concat(nuevos);
    guardar(); render(); ov.remove();
    alert(`Se cargaron ${nuevos.length} huésped(es): una carta para cada uno.` +
      (sinNombre ? `\n\nSe omitieron ${sinNombre} fila(s) sin nombre de huésped.` : ""));
  };
}

function abrirExportar(){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Exportar</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <p class="hint" style="margin-top:0">Los datos viven en este navegador. Descarga una copia
          para respaldarla o abrirla en Excel.</p>
        <p><button class="btn" id="eCli">Clientes (CSV)</button></p>
        <p><button class="btn" id="eAct">Actividades (CSV)</button></p>
        <p><button class="btn" id="eConv">Convenios (CSV)</button></p>
        <p><button class="btn" id="ePros">Prospectos de eventos (CSV)</button></p>
        <p><button class="btn primary" id="eJson">Respaldo completo (JSON)</button>
          <span class="hint">incluye firmas y textos</span></p>
        <p><button class="btn" id="eTpl">Plantilla de clientes vacía (CSV)</button></p>
        <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
        <p><label class="lbl">Restaurar respaldo JSON</label>
          <input type="file" id="rJson" class="field" accept=".json,application/json" style="width:100%"></p>
        <p><button class="btn danger" id="wipe">Borrar todos los datos</button></p>
      </div>
    </div>`);

  const hoy = hoyISO();

  ov.querySelector("#eCli").onclick = () => {
    const cols = CAMPOS_CLIENTE.map(f => f.label);
    descargar(`clientes-${hoy}.csv`, toCSV([cols].concat(state.clientes.map(c =>
      CAMPOS_CLIENTE.map(f => f.key === "estatus" ? est(c.estatus).name : (c[f.key] ?? ""))))), "text/csv");
  };
  ov.querySelector("#eAct").onclick = () => {
    descargar(`actividades-${hoy}.csv`, toCSV(
      [["Empresa","Tipo","Asunto","Fecha y hora","Responsable","Notas"]].concat(
        [...state.actividades].sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)))
          .map(a => [nombreCli(a.clienteId), tipoAct(a.tipo).name, a.asunto, a.fecha, a.responsable, a.notas]))), "text/csv");
  };
  ov.querySelector("#ePros").onclick = () => {
    descargar(`prospectos-${hoy}.csv`, toCSV(
      [["Fecha","Nombre","Apellido","Compañía","Correo","Teléfono","Evento",
        "Capturó","En cartera","Notas"]].concat(
        [...state.prospectos].sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)))
          .map(p => [p.fecha, p.nombre, p.apellido, p.compania, p.email, p.telefono,
                     p.evento, p.capturadoPor, p.clienteId ? "Sí" : "No", p.notas]))), "text/csv");
  };
  ov.querySelector("#eConv").onclick = () => {
    const fs = [["Folio","Empresa","Fecha","Vigencia desde","Vigencia hasta","Bloque","Clave","Tipo de habitación",
                 "Tarifa pública","Tarifa convenio","Estado","Firmó hotel","Firmó empresa","Observaciones"]];
    for (const v of state.convenios){
      const base = [v.folio, nombreCli(v.clienteId), v.fecha, v.vigenciaDesde, v.vigenciaHasta];
      const cola = [ESTADOS_CONV[v.estado].name, (v.firmaHotel||{}).nombre || "",
                    (v.firmaEmpresa||{}).nombre || "", v.notas];
      if (!v.habitaciones.length) fs.push(base.concat(["","","","",""], cola));
      for (const h of v.habitaciones)
        fs.push(base.concat([infoGrupo(h.grupo, v).nombre, h.codigo, h.nombre,
                             h.publica === null ? "N/A" : h.publica, h.convenio], cola));
    }
    descargar(`convenios-${hoy}.csv`, toCSV(fs), "text/csv");
  };
  ov.querySelector("#eJson").onclick = () =>
    descargar(`crm-respaldo-${hoy}.json`, JSON.stringify(state, null, 2), "application/json");
  ov.querySelector("#eTpl").onclick = () =>
    descargar("plantilla-clientes.csv", toCSV([CAMPOS_CLIENTE.map(f => f.label)]), "text/csv");

  ov.querySelector("#rJson").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let datos;
      try{ datos = JSON.parse(String(r.result)); }
      catch(err){ alert("El archivo no es un JSON válido."); return; }
      if (!datos || !Array.isArray(datos.clientes)){ alert("Este JSON no parece un respaldo del CRM."); return; }
      if (!confirm(`El respaldo trae ${datos.clientes.length} clientes. Reemplazará todo lo que hay ahora. ¿Continuar?`)) return;
      state = sanear(datos);
      guardar(); render(); ov.remove();
      alert("Respaldo restaurado.");
    };
    r.readAsText(f, "utf-8");
  });

  ov.querySelector("#wipe").onclick = () => {
    if (!confirm("Se borrarán TODOS los clientes, actividades y convenios de este navegador. ¿Continuar?")) return;
    if (!confirm("Confirma otra vez: esta acción no se puede deshacer.")) return;
    state = sanear({ habitaciones: state.habitaciones, ajustes: state.ajustes });
    guardar(); render(); ov.remove();
  };
}

/*
 * La entrada termina llevando el logo hasta el botón de inicio, que es el
 * mismo logo: se mide dónde y de qué tamaño está, y se anima hasta ahí. Al
 * llegar, el del encabezado reaparece y el de la entrada se retira, así que
 * el cambio de uno a otro no se ve.
 */
(function entrada(){
  const el = document.getElementById("intro");
  if (!el){ terminarEntrada(); return; }

  const quitar = () => {
    if (!el.parentNode) return;
    el.remove();
    document.documentElement.classList.remove("intro-activa");
    document.removeEventListener("pointerdown", quitar);
    document.removeEventListener("keydown", quitar);
    terminarEntrada();
  };

  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ quitar(); return; }

  document.documentElement.classList.add("intro-activa");
  document.addEventListener("pointerdown", quitar);
  document.addEventListener("keydown", quitar);

  const volar = () => {
    const svg = el.querySelector("svg");
    const meta = document.querySelector(".brand .logo");
    if (!svg || !meta){ quitar(); return; }
    const a = svg.getBoundingClientRect(), b = meta.getBoundingClientRect();
    if (!a.width || !b.width){ quitar(); return; }
    svg.style.transform =
      `translate(${(b.left + b.width/2) - (a.left + a.width/2)}px,` +
      ` ${(b.top + b.height/2) - (a.top + a.height/2)}px) scale(${b.width / a.width})`;
    el.classList.add("vuelo");
  };

  setTimeout(volar, 1350);
  setTimeout(quitar, 2250);
})();

if (!cargaRota) guardar();     // con la carga rota, no se pisa lo que quedó
render();
// Si el enlace es el de un cliente que viene a firmar, la aplicación se
// convierte en su documento y no arranca nada del CRM.
const _firma = enlaceDeFirma();
const _alta  = enlaceDeAlta();
if (_firma){ terminarEntrada(); pantallaFirmaCliente(_firma); }
else if (_alta){
  // Quien viene de un anuncio no entra al CRM: llena su registro y ya. Hace
  // falta la nube para depositarlo, así que se carga la configuración antes.
  terminarEntrada();
  cargarNube();
  pantallaAltaPublica(_alta);
}
else {
  arrancarNube();
  // A quien alcanza más de un departamento se le pregunta en cuanto se puede
  // ver la pantalla; antes se quedaría detrás de la animación de entrada.
  entradaLista.then(() => pantallaDepto());
  // Si la tableta venía en modo cliente, vuelve a él antes de que se alcance a
  // ver nada del CRM. Se espera a la animación nada más para no cortarla.
  const _k = kioscoGuardado();
  if (_k) entradaLista.then(() => {
    if (!document.getElementById("kiosco")) entrarKiosco(_k.evento || "", _k.quien || "");
  });
}
