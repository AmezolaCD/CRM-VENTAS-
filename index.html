        <div style="overflow:auto"><table class="data" id="tHosp">
          <thead><tr><th>Servicio</th><th class="num" style="width:90px">Noches</th>
            <th class="num" style="width:120px">P. unitario</th>
            <th class="num" style="width:120px">Subtotal</th>
            <th class="num" style="width:130px">Total c/imp.</th><th style="width:44px"></th></tr></thead>
          <tbody>${(k.hospedaje.length ? k.hospedaje : [saneaLineaHosp({})]).map(filaHosp).join("")}</tbody>
          <tfoot><tr><td><b>Total</b></td><td class="num" id="ctNoches"><b>0</b></td><td></td>
            <td class="num" id="ctSub"><b>—</b></td><td class="num" id="ctTot"><b>—</b></td><td></td></tr></tfoot>
        </table></div>
        <p style="margin:8px 0 0"><button class="btn" id="bAddHosp">+ Agregar línea</button></p>

        <h3 class="sec">Salones y eventos <span class="hint">(opcional)</span></h3>
        <div style="overflow:auto"><table class="data" id="tEv">
          <thead><tr><th>Fecha</th><th>Horario</th><th>Evento</th><th class="num">Pax</th>
            <th>Montaje</th><th>Salón</th><th>Renta</th><th style="width:44px"></th></tr></thead>
          <tbody>${k.eventos.map(filaEv).join("")}</tbody></table></div>
        <p style="margin:8px 0 0"><button class="btn" id="bAddEv">+ Agregar evento</button></p>

        <h3 class="sec">Costos adicionales no incluidos</h3>
        <div style="overflow:auto"><table class="data" id="tEx">
          <thead><tr><th>Concepto</th><th style="width:260px">Costo</th><th style="width:44px"></th></tr></thead>
          <tbody>${k.adicionales.map(filaEx).join("")}</tbody></table></div>
        <p style="margin:8px 0 0"><button class="btn" id="bAddEx">+ Agregar costo</button></p>

        <h3 class="sec">Observaciones</h3>
        <p class="hint" style="margin-top:0">Éstas sí se imprimen en el documento.</p>
        <textarea class="field" id="ctNotas" style="width:100%;min-height:70px">${esc(k.notas)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDelCt">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="bOkCt">Guardar borrador</button>
        <button class="btn ok" id="bFirmarCt">Guardar y firmar</button>
      </div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  const impuestos = () => Number(q("#ctImp").value) || 0;

  function recalcular(){
    const factor = 1 + impuestos() / 100;
    let noches = 0, sub = 0;
    const mon = q("#ctMoneda").value.trim().toUpperCase() || "MXN";
    ov.querySelectorAll("#tHosp tbody tr").forEach(tr => {
      const n = Number(tr.querySelector(".h-noches").value) || 0;
      const pr = parseMoney(tr.querySelector(".h-precio").value);
      const st = n * pr;
      noches += n; sub += st;
      tr.querySelector(".h-sub").textContent = st ? money(st, mon) : "—";
      tr.querySelector(".h-tot").textContent = st ? money(st * factor, mon) : "—";
    });
    q("#ctNoches").innerHTML = `<b>${noches}</b>`;
    q("#ctSub").innerHTML = `<b>${sub ? esc(money(sub, mon)) : "—"}</b>`;
    q("#ctTot").innerHTML = `<b>${sub ? esc(money(sub * factor, mon)) : "—"}</b>`;
  }

  ov.addEventListener("input", e => {
    if (e.target.closest("#tHosp") || e.target.id === "ctImp" || e.target.id === "ctMoneda")
      recalcular();
  });
  ov.addEventListener("click", e => {
    const b = e.target.closest("[data-quita]");
    if (!b) return;
    const tr = b.closest("tr"), cuerpo = tr.parentElement;
    tr.remove();
    if (cuerpo.closest("#tHosp") && !cuerpo.children.length)
      cuerpo.insertAdjacentHTML("beforeend", filaHosp(saneaLineaHosp({})));
    recalcular();
  });
  recalcular();

  q("#ctTipo").onchange = e => {
    q("#ctTipoAyuda").textContent = infoTipoCt(e.target.value).ayuda;
  };
  q("#bAddHosp").onclick = () => {
    ov.querySelector("#tHosp tbody").insertAdjacentHTML("beforeend", filaHosp(saneaLineaHosp({})));
    recalcular();
  };
  q("#bAddEv").onclick = () =>
    ov.querySelector("#tEv tbody").insertAdjacentHTML("beforeend", filaEv(saneaLineaEvento({})));
  q("#bAddEx").onclick = () =>
    ov.querySelector("#tEx tbody").insertAdjacentHTML("beforeend", filaEx(saneaLineaExtra({})));

  /* Aquí seguía el folio al año de la fecha. Ya no: el borrador no tiene folio
     y el número lo reparte el contador al firmar. Ver folioParaFirmar. */

  const bd = q("#bDelCt");
  if (bd) bd.onclick = () => {
    if (!confirm("¿Eliminar este documento? Esta acción no se puede deshacer.")) return;
    state.contratos = state.contratos.filter(x => x.id !== k.id);
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  q("#bOkCt").onclick = () => { if (recoger()){ ov.remove(); if (alCerrar) alCerrar(); } };
  q("#bFirmarCt").onclick = () => {
    if (!recoger()) return;
    ov.remove();
    verContrato(k.id, alCerrar, true);
  };

  function pintaErrores(lista){
    q("#ctErr").innerHTML = lista.length
      ? `<div class="errbox"><b>Falta esto para poder continuar:</b><ul>${
          lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      : "";
  }

  function recoger(){
    const cid = q("#ctCli").value;
    const hosp = [...ov.querySelectorAll("#tHosp tbody tr")].map(tr => saneaLineaHosp({
      descripcion: tr.querySelector(".h-desc").value.trim(),
      noches: tr.querySelector(".h-noches").value,
      precio: parseMoney(tr.querySelector(".h-precio").value)
    })).filter(l => l.descripcion || l.noches || l.precio);

    const problemas = [];
    if (!cid) problemas.push("Selecciona el cliente.");
    if (!hosp.length) problemas.push("Captura al menos una línea de hospedaje.");
    hosp.forEach((l, i) => {
      if (!l.descripcion) problemas.push(`A la línea ${i+1} de hospedaje le falta la descripción.`);
      if (!l.noches)      problemas.push(`A la línea ${i+1} de hospedaje le faltan las noches.`);
      if (!l.precio)      problemas.push(`A la línea ${i+1} de hospedaje le falta el precio.`);
    });
    const desde = q("#ctFecha").value, hasta = q("#ctVig").value;
    if (desde && hasta && hasta < desde)
      problemas.push("La vigencia no puede ser anterior a la fecha del documento.");

    pintaErrores(problemas);
    if (problemas.length){
      q("#ctErr").scrollIntoView({ block:"center", behavior:"smooth" });
      return false;
    }

    /* El folio no se toca al guardar: lo pone el contador al firmar. Se
       conserva el que traiga un documento viejo. */
    const folio = String(k.folio || "").trim();

    Object.assign(k, {
      clienteId: cid,
      ejecutivo: q('[name="ctEje"]').value.trim(),
      tipo: q("#ctTipo").value,
      titulo: q("#ctTitulo").value.trim(),
      folio,
      fecha: desde || hoyISO(),
      vigencia: hasta,
      moneda: q("#ctMoneda").value.trim().toUpperCase() || "MXN",
      tipoCambio: q("#ctTC").value.trim(),
      impuestos: impuestos(),
      hospedaje: hosp,
      eventos: [...ov.querySelectorAll("#tEv tbody tr")].map(tr => saneaLineaEvento({
        fecha: tr.querySelector(".e-fecha").value, horario: tr.querySelector(".e-hora").value,
        evento: tr.querySelector(".e-evento").value, pax: tr.querySelector(".e-pax").value,
        montaje: tr.querySelector(".e-montaje").value, salon: tr.querySelector(".e-salon").value,
        renta: tr.querySelector(".e-renta").value
      })).filter(e => e.fecha || e.evento || e.salon),
      adicionales: [...ov.querySelectorAll("#tEx tbody tr")].map(tr => saneaLineaExtra({
        concepto: tr.querySelector(".x-concepto").value, costo: tr.querySelector(".x-costo").value
      })).filter(x => x.concepto || x.costo),
      notas: q("#ctNotas").value.trim(),
      updatedAt: new Date().toISOString()
    });
    if (!existente){ k.createdAt = new Date().toISOString(); state.contratos.push(k); }
    guardar(); render();
    return true;
  }
}

const nombrePdfContrato = (k, c) =>
  infoTipoCt(k.tipo).name + "-" +
  nombreArchivo([k.folio || "sin-folio", c && c.empresa].filter(Boolean).join(" ")) + ".pdf";

function verContrato(id, alCerrar, pedirFirma){
  const k = state.contratos.find(x => x.id === id);
  if (!k) return;
  if (k.externo){ verContratoExterno(k, alCerrar); return; }
  const c = cliente(k.clienteId);
  const h = state.ajustes.hotel;
  const ec = ESTADOS_CT[k.estado];
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>${esc(infoTipoCt(k.tipo).name)} ${esc(k.folio || "")}</h2>
        <span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span>
        <button class="btn" data-close>✕</button>
      </div>
      <div class="doc-body">
        ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
        <div class="doc-contenido">${cuerpoContrato(k, c)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrintCt">Imprimir</button>
        <button class="btn" id="bPdfCt">Descargar PDF</button>
        ${k.estado === "borrador" ? `<button class="btn" id="bEditCt">Editar</button>` : ""}
        <div class="spacer"></div>
        ${!k.firmaHotel ? `<button class="btn ok" id="bCtF1">Firmar como ejecutivo</button>` : ""}
        ${k.firmaHotel && !k.firmaCliente
          ? `<button class="btn primary" id="bCtEnviar">Enviar al cliente</button>
             <button class="btn ok" id="bCtF2">Registrar firma del cliente</button>` : ""}
        ${k.firmaHotel && !k.firmaCliente && !k.tokenFirma && puedeMandarLiga()
          ? `<button class="btn" id="bCtLiga">Rehacer enlace de firma</button>` : ""}
        ${k.firmaCliente ? `<span class="hint">Aceptado por el cliente.</span>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrintCt").onclick = () => {
    fijarPagina(false);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);
  };

  const bp = ov.querySelector("#bPdfCt");
  bp.onclick = async () => {
    const antes = bp.textContent;
    bp.disabled = true; bp.textContent = "Generando…";
    try{
      const bytes = await pdfDeDocumento(cuerpoContrato(k, c));
      descargarBlob(new Blob([bytes], { type:"application/pdf" }), nombrePdfContrato(k, c));
    }catch(err){
      alert("No se pudo generar el PDF aquí: " + err.message +
            "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }finally{ bp.disabled = false; bp.textContent = antes; }
  };

  const be = ov.querySelector("#bEditCt");
  if (be) be.onclick = () => { ov.remove(); editarContrato(k.id, null, alCerrar); };

  const f1 = ov.querySelector("#bCtF1");
  if (f1) f1.onclick = () => padFirma("Firma del ejecutivo de ventas",
    { nombre: ejecutivoDeCt(k) || miNombre(), puesto:"Ejecutivo de ventas", celular:"" },
    async d => {
      if (!await firmarContrato(k, "hotel", d)) return;
      ov.remove(); verContrato(k.id, alCerrar);
    },
    { recordar:true });

  const f2 = ov.querySelector("#bCtF2");
  if (f2) f2.onclick = () => padFirma("Firma de aceptación del cliente",
    { nombre:(c && c.contacto) || "", puesto:"", celular:(c && c.telefono) || "" },
    async d => {
      if (!await firmarContrato(k, "cliente", d)) return;
      ov.remove(); verContrato(k.id, alCerrar);
    });

  const en = ov.querySelector("#bCtEnviar");
  if (en) en.onclick = () => enviarContrato(k, c);

  /* Los contratos que se firmaron antes de que existiera el enlace no tienen
     clave. Se les hace una y ya se pueden mandar a firmar en pantalla. */
  const bl = ov.querySelector("#bCtLiga");
  if (bl) bl.onclick = () => {
    k.tokenFirma = nuevoToken();
    k.updatedAt = new Date().toISOString();
    guardar(); render(); ov.remove();
    verContrato(k.id, alCerrar);
  };

  if (pedirFirma && !k.firmaHotel && f1) setTimeout(() => f1.click(), 60);
}

/**
 * Aplica la firma y deja constancia en la bitácora del cliente.
 *
 * Como en los convenios, el folio se toma AQUÍ: firmar es el momento en que
 * deja de ser un borrador. Ver folioParaFirmar.
 */
async function firmarContrato(k, quien, d){
  const fecha = new Date().toISOString();
  const firma = saneaFirma(Object.assign({}, d, { fecha }));
  const c = cliente(k.clienteId);
  const doc = infoTipoCt(k.tipo).name;

  if (quien === "hotel"){
    const folio = await folioParaFirmar(k, "contratos", "CT", anioContrato(k),
                                        () => folioContrato(anioContrato(k), k.id));
    if (!folio){ alert(AVISO_SIN_CONTADOR); return false; }
    k.folio = folio;
    k.firmaHotel = firma;
    if (k.estado === "borrador") k.estado = "firmado_hotel";
    k.tokenFirma = k.tokenFirma || nuevoToken();   // habilita el enlace del cliente
    // El destinatario se congela: el documento tiene que poder leerse igual
    // dentro de un año, aunque la ficha del cliente haya cambiado.
    if (c) k.destinatario = { empresa:c.empresa, contacto:c.contacto, ubicacion:c.ubicacion,
                              telefono:c.telefono, email:c.email };
    registrarAuto(k.clienteId, `${doc} ${k.folio} firmada por el ejecutivo`,
      k.titulo || "", ejecutivoDeCt(k));
  } else {
    if (!k.firmaHotel){ alert("Primero debe firmar el ejecutivo."); return false; }
    k.firmaCliente = firma;
    k.estado = "aceptado";
    registrarAuto(k.clienteId, `${doc} ${k.folio} aceptada por el cliente`,
      `Firmó ${d.nombre}.`, ejecutivoDeCt(k));
  }
  k.updatedAt = new Date().toISOString();
  guardar(); render();
  return true;
}

/** El PDF adjunto donde el aparato lo permita, y si no, el mensaje y el archivo aparte. */
function enviarContrato(k, c){
  const h = state.ajustes.hotel;
  const doc = infoTipoCt(k.tipo).name;
  const asunto = `${doc} ${k.folio} · ${h.nombre}`;
  const archivo = nombrePdfContrato(k, c);
  const firmante = (k.firmaHotel && k.firmaHotel.nombre) || ejecutivoDeCt(k);

  const mensaje = `Estimado(a) ${(c && c.contacto) || ""}:\n\n` +
    `Adjunto la ${doc.toLowerCase()} ${k.folio} de ${h.nombre}` +
    (k.titulo ? ` para ${k.titulo}` : "") + `.` +
    (k.vigencia ? ` Tiene vigencia hasta el ${fechaTexto(k.vigencia)}.` : "") +
    `\n\nQuedo al pendiente de sus comentarios.\n\nSaludos cordiales,\n${firmante}\n${h.nombre}`;

  /* El enlace para que la firme en su pantalla, igual que en los convenios.
     Hace falta la nube —el enlace vive ahí— y que el ejecutivo ya haya
     firmado, porque es al firmar cuando se genera la clave. */
  let conLiga = !!(k.tokenFirma && puedeMandarLiga());   // se baja si no hay buzón
  let sinBuzon = false;
  const msgLiga = () => `Estimado(a) ${(c && c.contacto) || ""}:\n\n` +
    `Le comparto la ${doc.toLowerCase()} ${k.folio} de ${h.nombre}` +
    (k.titulo ? ` para ${k.titulo}` : "") + `.` +
    (k.vigencia ? ` Tiene vigencia hasta el ${fechaTexto(k.vigencia)}.` : "") +
    `\n\nPuede revisarla y firmarla desde este enlace, sin instalar nada:\n` +
    ligaFirma(k, "contratos") +
    `\n\nQuedo al pendiente.\n\nSaludos cordiales,\n${firmante}\n${h.nombre}`;

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Enviar ${esc(doc.toLowerCase())} al cliente</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="cuerpoEnvioK"><p class="hint">Preparando el documento…</p></div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const anotar = via => {
    k.enviado = { fecha:new Date().toISOString(), via, quien: correoSesion() };
    k.updatedAt = new Date().toISOString();
    registrarAuto(k.clienteId, `${doc} ${k.folio} enviada por ${VIAS[via]}`,
      destinoEnvio(via, c), ejecutivoDeCt(k));
    guardar(); render();
  };

  pdfDeDocumento(cuerpoContrato(k, c)).then(async bytes => {
    if (conLiga && !(await buzonMontado())){ conLiga = false; sinBuzon = true; }
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" &&
                           navigator.canShare({ files:[file] });

    ov.querySelector("#cuerpoEnvioK").innerHTML =
      (conLiga
        ? `<h3 class="sec" style="margin-top:0">Que la firme en su pantalla</h3>
           <div class="note"><b>Es el camino corto.</b> El cliente abre el enlace desde su
             teléfono o computadora, la lee y la firma con el dedo. Cuando firme, este
             documento pasa a <b>Aceptado</b> y aquí te avisamos.</div>
           <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
             <button class="btn" id="kMailLiga" ${(c && c.email) ? "" : "disabled"}>Mandar el enlace por correo</button>
             <button class="btn wa" id="kWaLiga" ${(c && c.telefono) ? "" : "disabled"}
               title="Mandar el enlace por WhatsApp" aria-label="Mandar el enlace por WhatsApp">${ICONO_WA}</button>
             <button class="btn sm" id="kCopiar">Copiar el enlace</button></p>
           <p class="hint">El enlace sólo abre este documento y deja de servir en cuanto se firma.</p>
           ${enlaceYaViajo(k, "contratos") ? "" : avisoSinSubir()}
           <h3 class="sec">O mándale el PDF</h3>`
        : sinBuzon ? avisoSinBuzon()
        : `<div class="note warn"><b>El enlace de firma no está disponible.</b>
             ${!puedeMandarLiga()
               ? "Hace falta tener la nube configurada (Ajustes → Nube y equipo): el enlace vive ahí."
               : "Primero tiene que firmarla el ejecutivo: la clave del enlace se genera en ese momento."}
             <br><br>Mientras tanto, mándale el PDF.</div>`) +
      (puedeCompartir
        ? `<div class="note">Con <b>Compartir</b> se va el PDF y el mensaje juntos, por donde
             usted escoja. Es lo más cómodo desde el teléfono.</div>
           <p><button class="btn ok" id="kCompartir" style="font-size:15px;padding:10px 16px">
             Compartir el PDF y el mensaje</button></p>`
        : `<div class="note warn">Este navegador no deja mandar el archivo y el mensaje de una
             vez. Descargue el PDF y adjúntelo a mano después de abrir el correo o WhatsApp.</div>`) +
      `<p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <button class="btn" id="kBajar">Descargar el PDF</button></p>
       <p class="hint" style="margin:10px 0 4px">O abra el mensaje ya redactado:</p>
       <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <button class="btn" id="kMail" ${(c && c.email) ? "" : "disabled"}>Enviar por correo</button>
         <button class="btn wa" id="kWa" ${(c && c.telefono) ? "" : "disabled"}
           title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button></p>
       <p class="hint">Se guardará como <b>${esc(archivo)}</b></p>`;

    const comp = ov.querySelector("#kCompartir");
    if (comp) comp.onclick = async () => {
      try{
        await navigator.share({ files:[file], title:asunto, text:mensaje });
        anotar("whatsapp"); ov.remove();
      }catch(e){ /* si lo cancela, no pasa nada */ }
    };
    enganchaSubirYa(ov, k, "contratos");
    const cop = ov.querySelector("#kCopiar");
    if (cop) cop.onclick = async () => {
      const liga = ligaFirma(k, "contratos");
      try{ await navigator.clipboard.writeText(liga); alert("Enlace copiado."); }
      catch(e){ prompt("Copia este enlace y mándaselo al cliente:", liga); }
      // Se apunta en los dos caminos: por el portapapeles o a mano, el enlace
      // ya salió de aquí.
      anotar("enlace");
    };
    const ml = ov.querySelector("#kMailLiga");
    if (ml && !ml.disabled) ml.onclick = () => {
      window.location.href = `mailto:${encodeURIComponent((c && c.email) || "")}` +
        `?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(msgLiga())}`;
      anotar("correo"); ov.remove();
    };
    const wl = ov.querySelector("#kWaLiga");
    if (wl && !wl.disabled) wl.onclick = () => {
      window.open(waLink((c && c.telefono) || "", msgLiga(), ladaDe(c)), "_blank", "noopener");
      anotar("whatsapp"); ov.remove();
    };
    ov.querySelector("#kBajar").onclick = () => descargarBlob(blob, archivo);
    ov.querySelector("#kMail").onclick = () => {
      window.location.href = `mailto:${encodeURIComponent((c && c.email) || "")}` +
        `?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(mensaje)}`;
      anotar("correo"); ov.remove();
    };
    ov.querySelector("#kWa").onclick = () => {
      window.open(waLink((c && c.telefono) || "", mensaje, ladaDe(c)), "_blank", "noopener");
      anotar("whatsapp"); ov.remove();
    };
  }).catch(e => {
    ov.querySelector("#cuerpoEnvioK").innerHTML =
      `<div class="errbox">No se pudo armar el PDF: ${esc(e.message)}<br><br>
        Use <b>Imprimir</b> desde el documento y elija "Guardar como PDF".</div>`;
  });
}

function verConvenio(id, alCerrar, pedirFirma){
  const v = state.convenios.find(x => x.id === id);
  if (!v) return;
  // Un convenio de fuera no tiene carta que armar: lo que hay es el escaneado.
  if (v.externo){ verConvenioExterno(v, alCerrar); return; }
  const c = cliente(v.clienteId);
  const h = state.ajustes.hotel;
  const ec = ESTADOS_CONV[v.estado];
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>Convenio ${v.folio ? esc(v.folio)
          : `<span style="color:var(--muted);font-weight:400">sin folio todavía</span>`}</h2>
        <span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span>
        <button class="btn" data-close>✕</button>
      </div>
      <div class="doc-body">
        ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
        <div class="doc-contenido">${cuerpoConvenio(v, c)}</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrint">Imprimir</button>
        <button class="btn" id="bPdfC">Descargar PDF</button>
        ${v.estado === "borrador" ? `<button class="btn" id="bEdit">Editar</button>` : ""}
        ${v.folioRepetido ? `<button class="btn danger" id="bRenum">Darle un folio nuevo</button>` : ""}
        <div class="spacer"></div>
        ${!v.firmaHotel ? `<button class="btn ok" id="bF1">Firmar como ejecutivo</button>` : ""}
        ${v.firmaHotel && v.estado !== "firmado_cliente" ? `<button class="btn primary" id="bEnviar">Enviar al cliente</button>
          <button class="btn" id="bSubirF">Subir convenio firmado</button>
          <button class="btn ok" id="bF2">Registrar firma del cliente</button>` : ""}
        ${v.estado === "firmado_cliente" ? `<span class="hint">Convenio cerrado. El cliente pasó a <b>Ganado</b>.${
          v.firmaManual ? ` Firmado en papel.` : ""}</span>
          ${traeEscaneo(v.firmaManual) ? `<button class="btn sm" id="bVerEscaneo">Ver el escaneado</button>` : ""}` : ""}
      </div>
    </div>`);

  /**
   * Renumerar uno que quedó repetido.
   *
   * Sólo sale en un convenio marcado `folioRepetido`, o sea uno que ya estaba
   * firmado o enviado cuando se descubrió el choque. La renumeración
   * automática no los toca —con razón: el folio anda impreso en el correo de
   * un cliente— así que esto es un botón que alguien pica a sabiendas.
   *
   * El número nuevo sale del contador, no de contar aquí: es lo mismo que hace
   * la firma, y por la misma razón.
   */
  const bre = ov.querySelector("#bRenum");
  if (bre) bre.onclick = async () => {
    const viejo = v.folio;
    if (!confirm(`Este convenio tiene el folio ${viejo}, que ya es de otro.\n\n` +
        "Se le va a dar el siguiente número libre del hotel.\n\n" +
        "OJO: el PDF que ya tiene el cliente dice el folio anterior. " +
        "Habrá que volver a mandárselo.\n\n¿Continuar?")) return;
    bre.disabled = true; bre.textContent = "Pidiendo número…";
    const nuevo = await apartarFolio("convenios", "CV", anioConvenio(v));
    if (!nuevo){
      bre.disabled = false; bre.textContent = "Darle un folio nuevo";
      alert(AVISO_SIN_CONTADOR.replace("no se firmó", "no se renumeró"));
      return;
    }
    v.folio = nuevo;
    v.folioRepetido = "";
    v.updatedAt = new Date().toISOString();
    registrarAuto(v.clienteId, `El convenio ${viejo} se renumeró como ${nuevo}`,
      `Otro convenio del hotel ya tenía el folio ${viejo}. Éste ya estaba firmado, ` +
      "así que se renumeró a mano.\nHay que volver a mandarle el PDF al cliente: el " +
      "que tiene dice " + viejo + ".", miNombre());
    guardar(); render();
    ov.remove();
    verConvenio(v.id, alCerrar);
  };

  ov.querySelector("#bPrint").onclick = () => {
    fijarPagina(false);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);   // respaldo si el navegador no dispara afterprint
  };
  const bp = ov.querySelector("#bPdfC");
  bp.onclick = async () => {
    const antes = bp.textContent;
    bp.disabled = true; bp.textContent = "Generando…";
    try{
      const bytes = await pdfDeConvenio(v, c);
      descargarBlob(new Blob([bytes], { type:"application/pdf" }), nombrePdfConvenio(v, c));
    }catch(err){
      alert("No se pudo generar el PDF aquí: " + err.message + "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }finally{ bp.disabled = false; bp.textContent = antes; }
  };

  const bEdit = ov.querySelector("#bEdit");
  if (bEdit) bEdit.onclick = () => { ov.remove(); editarConvenio(v.id, null, alCerrar); };

  const f1 = ov.querySelector("#bF1");
  if (f1) f1.onclick = () => padFirma("Firma del ejecutivo de ventas",
    { nombre:ejecutivoDe(v) || miNombre(), puesto:"Ejecutivo de ventas", celular:"" },
    async d => {
      // Si no se pudo apartar folio no se firmó: se deja la carta abierta para
      // que se vuelva a intentar, en vez de cerrarla como si hubiera pasado.
      if (!await firmar(v, "hotel", d)) return;
      ov.remove(); verConvenio(v.id, alCerrar);
    },
    { recordar:true });

  const f2 = ov.querySelector("#bF2");
  if (f2) f2.onclick = () => padFirma("Firma del cliente",
    { nombre:(c && c.contacto) || "", puesto:"", celular:(c && c.telefono) || "" },
    async d => {
      if (!await firmar(v, "empresa", d)) return;
      ov.remove(); verConvenio(v.id, alCerrar);
    });

  const env = ov.querySelector("#bEnviar");
  if (env) env.onclick = () => {
    // Un convenio firmado antes de que existiera el enlace no tiene clave: se
    // le hace una al vuelo en vez de mandarlo sin poder firmar en pantalla.
    if (!v.tokenFirma && puedeMandarLiga()){ v.tokenFirma = nuevoToken(); guardar(); }
    enviarConvenio(v, c);
  };

  const bs = ov.querySelector("#bSubirF");
  if (bs) bs.onclick = () => subirConvenioFirmado(v, () => { ov.remove(); verConvenio(v.id, alCerrar); });

  const bve = ov.querySelector("#bVerEscaneo");
  if (bve) bve.onclick = () =>
    verEscaneado(v.firmaManual, `Convenio ${v.folio || "sin folio"} · escaneado`);

  marcarVisto(v);

  if (pedirFirma && !v.firmaHotel && f1) setTimeout(() => f1.click(), 60);
}

/**
 * Aplica la firma y empuja al cliente por el embudo.
 *
 * La firma del ejecutivo es el momento en que el convenio deja de ser un
 * borrador, y por eso es AQUÍ donde se le pone el folio. Ver folioParaFirmar.
 */
async function firmar(v, quien, d){
  const fecha = new Date().toISOString();
  const c = cliente(v.clienteId);
  const f = { nombre:d.nombre, puesto:d.puesto, celular:d.celular, fecha, img:d.img };

  if (quien === "hotel"){
    /* El número, ANTES de tocar nada. Si no se consigue, no se firma y no se
       gasta: así la serie no se queda con un hueco por un intento fallido. */
    const folio = await folioParaFirmar(v, "convenios", "CV", anioConvenio(v),
                                        () => folioLibre(anioConvenio(v), v.id));
    if (!folio){ alert(AVISO_SIN_CONTADOR); return false; }
    v.folio = folio;
    v.firmaHotel = f;
    v.estado = "firmado_ejecutiva";
    v.tokenFirma = v.tokenFirma || nuevoToken();   // habilita el enlace del cliente
    if (c) v.destinatario = { empresa:c.empresa, contacto:c.contacto,
      ubicacion:c.ubicacion, telefono:c.telefono, email:c.email };
    if (c && !est(c.estatus).lost){ c.estatus = "cotizacion_enviada"; c.updatedAt = fecha; }
    registrarAuto(v.clienteId, `Convenio ${v.folio} firmado por el ejecutivo`,
      `Firmado por ${d.nombre}. Se le asignó el folio ${v.folio}.\n` +
      `Listo para enviarse al cliente.\nEl cliente pasó a "Cotización enviada".`, d.nombre);
  } else {
    if (!v.firmaHotel){ alert("Primero debe firmar el ejecutivo de ventas."); return false; }
    cerrarConvenio(v, f, `Firmado por ${d.nombre}, capturado por el ejecutivo.`, ejecutivoDe(v));
    v.avisado = true;          // lo capturó el propio ejecutivo: no hay nada que avisarle
    guardar(); render();
    return true;
  }
  v.updatedAt = fecha;
  guardar(); render();
  return true;
}

/**
 * El cliente lo firmó en papel y alguien lo escaneó.
 *
 * El archivo se guarda dentro del convenio, y el convenio viaja completo a
 * cada equipo en cada sincronización: por eso el límite de tamaño es bajo y se
 * dice en voz alta. Un escaneado de 8 MB haría lenta la aplicación para todos,
 * todo el día, por un documento que se consulta una vez al año.
 */
function subirConvenioFirmado(v, alTerminar){
  const c = cliente(v.clienteId);
  const ov = modal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-head"><h2>Subir convenio firmado</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <p class="hint" style="margin-top:0">Para cuando el cliente lo firmó en papel. Al subirlo,
          el convenio queda <b>Firmado por cliente</b> y <b>${esc((c && c.empresa) || "el cliente")}</b>
          pasa a <b>Ganado</b>, igual que si lo hubiera firmado en pantalla.</p>
        <div class="grid">
          <div class="full"><label class="lbl">El PDF escaneado</label>
            <input type="file" class="field" id="fPdfFirmado" accept="application/pdf,image/*">
            <div class="hint">PDF o foto, <b>máximo 2 MB</b>. El archivo viaja a todos los
              equipos en cada sincronización, así que uno pesado los hace lentos a todos.
              Si tu escáner lo saca muy grande, sube una foto del documento.</div></div>
          <div class="full"><label class="lbl">¿Quién lo recibió?</label>
            <input class="field" id="fQuienRecibe" value="${esc(miNombre() || ejecutivoDe(v))}"></div>
        </div>
        <div id="errPdf" style="margin-top:10px"></div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkPdf">Subir y cerrar el convenio</button></div>
    </div>`);

  ov.querySelector("#bOkPdf").onclick = () => {
    const f = ov.querySelector("#fPdfFirmado").files[0];
    const err = ov.querySelector("#errPdf");
    const b = ov.querySelector("#bOkPdf");
    if (!f){ err.innerHTML = `<div class="errbox">Elige el archivo escaneado.</div>`; return; }
    const MAX = hayDeposito() ? MAX_ARCHIVO_NUBE : MAX_ARCHIVO;
    if (f.size > MAX){
      err.innerHTML = `<div class="errbox">Pesa ${Math.round(f.size/1024/1024*10)/10} MB y el límite
        son ${Math.round(MAX/1024/1024)} MB. Vuelve a escanearlo en blanco y negro o a menor
        resolución, o toma una foto.</div>`;
      return;
    }
    b.disabled = true; b.textContent = "Subiendo…";
    const suelta = () => { b.disabled = false; b.textContent = "Subir y cerrar el convenio"; };

    const cerrar = async manual => {
      /* También aquí: éste es otro momento en que el convenio deja de ser un
         borrador, así que también necesita su número. Un convenio que el
         cliente firmó en papel y nadie firmó en pantalla llegaba sin folio. */
      const folio = await folioParaFirmar(v, "convenios", "CV", anioConvenio(v),
                                          () => folioLibre(anioConvenio(v), v.id));
      if (!folio){ alert(AVISO_SIN_CONTADOR); suelta(); return; }
      v.folio = folio;
      v.firmaManual = manual;
      // Sin firma trazada: la constancia es el archivo.
      cerrarConvenio(v, null, `Firmado en papel. Se subió el archivo "${f.name}".`,
        v.firmaManual.quien);
      v.avisado = true;        // lo subió el propio equipo: no hay novedad que avisar
      guardar(); render();
      ov.remove();
      if (alTerminar) alTerminar();
    };
    const quien = () => ov.querySelector("#fQuienRecibe").value.trim();

    const incrustar = () => {
      if (pesoGuardado() + f.size * 1.4 > TOPE_TOTAL){
        suelta();
        err.innerHTML = `<div class="errbox"><b>Ya casi no cabe en este navegador.</b>
          Avísale a sistemas para que monte el almacén del proyecto
          (<code>archivos.sql</code>).</div>`;
        return;
      }
      const r = new FileReader();
      r.onload = () => cerrar(saneaManual({ fecha:new Date().toISOString(), quien: quien(),
        archivo: f.name, pdf: String(r.result), tam: f.size, tipoMime: f.type }));
      r.onerror = () => { suelta();
        err.innerHTML = `<div class="errbox">No se pudo leer el archivo.</div>`; };
      r.readAsDataURL(f);
    };

    if (hayDeposito()){
      subirEscaneo(f)
        .then(ruta => cerrar(saneaManual({ fecha:new Date().toISOString(), quien: quien(),
          archivo: f.name, ruta, tam: f.size, tipoMime: f.type })))
        .catch(e => {
          if (nube.sinDeposito) return incrustar();
          suelta();
          err.innerHTML = `<div class="errbox">No se pudo subir el archivo al almacén.<br>
            <span class="hint">${esc(e.message)}</span></div>`;
        });
    } else incrustar();
  };
}

/* ----- Documentos que no se hicieron aquí ----- */

/**
 * Registrar un convenio, una cotización o un contrato que ya andaba firmado
 * antes de que existiera el CRM —o que se hizo en Word, como siempre.
 *
 * No se inventa el documento: se guarda el escaneado tal cual y la ficha
 * queda marcada como externa, para que nadie espere ver la carta armada por
 * la aplicación cuando lo abra.
 */
const TIPOS_EXTERNO = [
  { id:"convenio",      name:"Convenio de hospedaje",      donde:"convenios" },
  { id:"cotizacion",    name:"Cotización de hospedaje",    donde:"contratos" },
  { id:"contrato",      name:"Contrato de hospedaje",      donde:"contratos" },
  { id:"cotizacionbq",  name:"Cotización de evento",       donde:"eventos" },
  { id:"contratobq",    name:"Contrato de banquetes",      donde:"contratosbq" }
];

/** Cuánto ocupa hoy la cartera en este navegador, para no pasarnos del tope. */
function pesoGuardado(){
  try{ return (localStorage.getItem(STORE) || "").length; }catch(e){ return 0; }
}
/* Con almacén en la nube el archivo ni toca el navegador, así que cabe uno de
   verdad: un escaneado a color de varias hojas anda por los 8 MB. Sin almacén
   se queda el límite viejo, que no es capricho —es lo que aguanta el navegador—. */
const MAX_ARCHIVO      = 2 * 1024 * 1024;    // incrustado, por documento
const MAX_ARCHIVO_NUBE = 20 * 1024 * 1024;   // en el almacén del proyecto
/* En CARACTERES, que es como los cuenta `pesoGuardado()` y como los corta el
   navegador: Chrome acepta 5,177,344 y aquí se para en el 85% de eso. */
const TOPE_TOTAL  = 4.4 * 1024 * 1024;

/* ==========================================================================
   EL ALMACÉN DE ESCANEADOS

   Un convenio escaneado pesa lo que pesa, y meterlo dentro del propio registro
   llenaba el navegador con tres documentos. Aquí los archivos van aparte, al
   almacén del proyecto, y del registro cuelga nada más la ruta.

   El depósito es privado: se lee con la sesión de quien pregunta, igual que
   todo lo demás. Se crea corriendo archivos.sql una sola vez.
   ========================================================================== */

const DEPOSITO = "escaneados";

/** ¿Hay a dónde subirlos? Sin nube o sin sesión, no. */
const hayDeposito = () => nubeActiva() && !nube.sinDeposito;

/** Nombre de archivo limpio y único, para que dos escaneados no se pisen. */
function rutaEscaneo(nombre){
  const ext = (String(nombre).match(/\.([A-Za-z0-9]{1,8})$/) || [,"bin"])[1].toLowerCase();
  const b = new Uint8Array(9);
  crypto.getRandomValues(b);
  const azar = [...b].map(x => x.toString(36).padStart(2,"0")).join("").slice(0, 14);
  return `${hoyISO().slice(0,7)}/${azar}.${ext}`;
}

/**
 * Sube el archivo al almacén y devuelve su ruta.
 *
 * Si el depósito no existe todavía —nadie ha corrido archivos.sql— se anota y
 * no se vuelve a intentar en esta sesión: el escaneado se guarda incrustado,
 * como antes, para no dejar a nadie sin poder registrar su documento.
 */
async function subirEscaneo(archivo, deposito, rutaFija){
  /* Dos depósitos: `escaneados` guarda los convenios firmados; `odts`, lo de
     marketing. Y una ruta fija cuando la quiere quien llama: al recoger una
     orden dos veces hace falta volver a subir el MISMO archivo a la MISMA
     ruta, y para eso el `x-upsert` tiene que dejar pisar lo que ya está. */
  deposito = deposito || DEPOSITO;
  const ruta = rutaFija || rutaEscaneo(archivo.name);
  const r = await fetch(`${nube.url}/storage/v1/object/${deposito}/${ruta}`, {
    method: "POST",
    headers: {
      apikey: nube.anon,
      Authorization: "Bearer " + (nube.sesion && nube.sesion.access_token),
      "Content-Type": archivo.type || "application/octet-stream",
      "x-upsert": rutaFija ? "true" : "false"
    },
    body: archivo
  });
  if (!r.ok){
    const detalle = await r.text().catch(() => "");
    if (r.status === 404 || /bucket not found/i.test(detalle)) nube.sinDeposito = true;
    throw new Error(`${r.status} · ${detalle || "sin detalle"}`);
  }
  return ruta;
}

/** Trae el archivo del almacén como una dirección que el navegador pueda abrir. */
async function bajarEscaneo(ruta, deposito){
  const r = await fetch(`${nube.url}/storage/v1/object/${deposito || DEPOSITO}/${ruta}`, {
    headers: {
      apikey: nube.anon,
      Authorization: "Bearer " + (nube.sesion && nube.sesion.access_token)
    }
  });
  if (!r.ok) throw new Error(`${r.status} · ${await r.text().catch(() => "")}`);
  return URL.createObjectURL(await r.blob());
}

/**
 * Todos los documentos que traen un escaneado, vengan de donde vengan.
 *
 * Se recorre de una sola manera para que mudarlos, contarlos y pesarlos usen
 * la misma lista y no se le olvide a nadie una colección.
 */
function documentosConEscaneo(){
  const fuera = [];
  for (const col of ["convenios","contratos","eventos"])
    for (const d of state[col])
      if (traeEscaneo(d.firmaManual)) fuera.push({ col, doc:d, m:d.firmaManual });
  return fuera;
}

/** Los que todavía pesan dentro del navegador. */
const escaneosIncrustados = () => documentosConEscaneo().filter(x => x.m.pdf);

/**
 * Sube al almacén los escaneados que estén incrustados y los saca del registro.
 *
 * Es la operación que libera el navegador. Se hace de uno en uno y guardando
 * después de cada uno: si se corta a la mitad, lo que ya subió quedó bien y
 * volver a darle continúa donde se quedó.
 */
async function mudarEscaneos(avisa){
  const pendientes = escaneosIncrustados();
  let hechos = 0;
  for (const { doc, m } of pendientes){
    if (avisa) avisa(hechos, pendientes.length);
    const blob = await (await fetch(m.pdf)).blob();
    const archivo = new File([blob], m.archivo || "escaneado",
                             { type: m.tipoMime || blob.type });
    const ruta = await subirEscaneo(archivo);
    doc.firmaManual = saneaManual(Object.assign({}, m,
      { ruta, pdf:"", tam: m.tam || blob.size, tipoMime: m.tipoMime || blob.type }));
    doc.updatedAt = new Date().toISOString();
    guardar();
    hechos++;
  }
  if (avisa) avisa(hechos, pendientes.length);
  return hechos;
}

/** Borra un escaneado del almacén. Que falle no es grave: queda huérfano y ya. */
async function borrarEscaneo(ruta){
  if (!ruta || !hayDeposito()) return;
  try{
    await fetch(`${nube.url}/storage/v1/object/${DEPOSITO}/${ruta}`, {
      method: "DELETE",
      headers: { apikey: nube.anon,
                 Authorization: "Bearer " + (nube.sesion && nube.sesion.access_token) }
    });
  }catch(e){ console.warn("No se pudo borrar el escaneado:", e.message); }
}

          <div><label class="lbl">Fecha del documento</label>
            <input class="field" type="date" id="exFecha" value="${esc(hoy)}"></div>
          <div><label class="lbl" id="exVigLbl">Vigencia hasta <span class="hint">(opcional)</span></label>
            <input class="field" type="date" id="exVig"></div>
          <div class="full"><label class="lbl">El archivo escaneado</label>
            <input type="file" class="field" id="exArchivo" accept="application/pdf,image/*">
            <div class="hint">PDF o foto, <b>máximo 2 MB</b>. El archivo viaja a todos los
              equipos en cada sincronización: uno pesado los vuelve lentos a todos. Si el
              escáner lo saca grande, escanéalo en blanco y negro o toma una foto.</div></div>
          <div class="full"><label class="lbl">Observaciones <span class="hint">(opcional)</span></label>
            <textarea class="field" id="exNotas" style="min-height:60px"
              placeholder="Convenio 2025 que venía en Word, firmado en papel."></textarea></div>
        </div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkEx">Registrar</button></div>
    </div>`);

  {
    const fCli = ov.querySelector("#exCli"), fEje = ov.querySelector('[name="exEje"]');
    let auto = fEje.value;
    fEje.addEventListener("change", () => { if (fEje.value !== auto) auto = null; });
    fCli.addEventListener("change", () => {
      if (auto === null || fEje.value !== auto) return;
      const e = String((cliente(fCli.value) || {}).ejecutivo || "").trim();
      if (e && [...fEje.options].some(o => o.value === e)) fEje.value = auto = e;
    });
    fCli.dispatchEvent(new Event("change"));   // por si ya venía un cliente escogido
  }

  // En un documento de banquetes lo que importa es cuándo es el evento.
  {
    const fTipo = ov.querySelector("#exTipo"), lbl = ov.querySelector("#exVigLbl");
    const acomoda = () => {
      const bq = /bq$/.test(fTipo.value);
      lbl.innerHTML = bq ? `Fecha del evento <span class="hint">(para el calendario)</span>`
                         : `Vigencia hasta <span class="hint">(opcional)</span>`;
    };
    fTipo.addEventListener("change", acomoda);
    acomoda();
  }

  const err = ov.querySelector("#exErr");
  const falla = html => { err.innerHTML = `<div class="errbox">${html}</div>`;
                          err.scrollIntoView({ block:"center", behavior:"smooth" }); };

  // Se avisa al abrir, no al final. Enterarse de que no cabe después de
  // escanear el papel, escoger el archivo y llenar la ficha es enterarse tarde.
  if (!hayDeposito() && pesoGuardado() > TOPE_TOTAL * 0.7)
    err.innerHTML = `<div class="errbox"><b>Este equipo ya casi no tiene lugar.</b>
      Sin el almacén del proyecto, los escaneados se guardan dentro del navegador y ahí
      el tope son unos 5 millones de caracteres —con tres o cuatro documentos se llena—.
      <br>Avísale a sistemas: se monta una vez (<code>archivos.sql</code>) y a partir de
      ahí los archivos dejan de ocupar lugar aquí.</div>`;

  ov.querySelector("#bOkEx").onclick = () => {
    const tipo = ov.querySelector("#exTipo").value;
    const cid  = ov.querySelector("#exCli").value;
    const f    = ov.querySelector("#exArchivo").files[0];

    if (!cid) return falla("Selecciona el cliente.");
    if (!f)   return falla("Elige el archivo escaneado.");
    const tope = hayDeposito() ? MAX_ARCHIVO_NUBE : MAX_ARCHIVO;
    if (f.size > tope)
      return falla(`El archivo pesa ${(f.size/1024/1024).toFixed(1)} MB y el límite son
        ${Math.round(tope/1024/1024)} MB.
        Vuelve a escanearlo en blanco y negro o a menor resolución, o toma una foto.`);
    if (!hayDeposito() && pesoGuardado() + f.size * 1.4 > TOPE_TOTAL)
      return falla(`<b>Ya casi no cabe en este navegador.</b> Sin el almacén del proyecto los
        archivos escaneados se guardan junto con la cartera, y el navegador corta cerca de
        los 5 MB. Avísale a sistemas para que monte el almacén (<code>archivos.sql</code>);
        a partir de ahí dejan de ocupar lugar aquí.`);

    const bOk = ov.querySelector("#bOkEx");
    bOk.disabled = true; bOk.textContent = "Guardando…";
    const listo = manual => { seguir(manual); };   // seguir es async: ver adentro
    const seRindio = e => {
      bOk.disabled = false; bOk.textContent = "Registrar";
      falla(`No se pudo guardar el archivo en el almacén del proyecto.<br>
        <span class="hint">${esc(e.message)}</span>`);
    };

    // Al almacén si lo hay; si no —o si el depósito todavía no existe—, al
    // propio registro, como se hacía antes.
    if (hayDeposito()){
      subirEscaneo(f)
        .then(ruta => listo(saneaManual({ fecha:new Date().toISOString(), quien:quienEs(),
          archivo:f.name, ruta, tam:f.size, tipoMime:f.type })))
        .catch(e => {
          if (!nube.sinDeposito) return seRindio(e);
          // El depósito no existe: se sigue por el camino viejo sin molestar.
          console.warn("Sin almacén de escaneados:", e.message);
          incrustado();
        });
    } else incrustado();

    function quienEs(){
      return ov.querySelector('[name="exEje"]').value.trim() || miNombre();
    }

    function incrustado(){
      if (pesoGuardado() + f.size * 1.4 > TOPE_TOTAL){
        bOk.disabled = false; bOk.textContent = "Registrar";
        return falla(`<b>Ya casi no cabe en este navegador.</b> Avísale a sistemas para que
          monte el almacén del proyecto (<code>archivos.sql</code>).`);
      }
      const r = new FileReader();
      r.onerror = () => { bOk.disabled = false; bOk.textContent = "Registrar";
                          falla("No se pudo leer el archivo."); };
      r.onload = () => listo(saneaManual({ fecha:new Date().toISOString(), quien:quienEs(),
        archivo:f.name, pdf:String(r.result), tam:f.size, tipoMime:f.type }));
      r.readAsDataURL(f);
    }

    /**
     * Registrar un documento que llegó en papel.
     *
     * ESTE ERA EL HUECO QUE QUEDABA. Los automáticos ya toman su número del
     * contador al firmarse, pero éstos seguían inventándolo aquí con
     * folioLibre(), contando lo que este equipo alcanza a ver. Eduardo subió
     * cuatro convenios de papel y les tocaron el 018, 019, 020 y 021, que
     * Carmen ya había usado. Todos los repetidos de la pantalla decían
     * "externo", y por esto.
     *
     * Ahora: si no escriben folio, lo pide al contador igual que una firma. Y
     * si lo escriben —el papel trae el suyo— se ANOTA en el contador y se
     * espera la respuesta, porque si esa anotación se pierde el contador
     * volverá a repartir ese número más adelante.
     */
    async function seguir(manual){
      const c = cliente(cid);
      const quien = ov.querySelector('[name="exEje"]').value.trim() || miNombre();
      const folio = ov.querySelector("#exFolio").value.trim();
      const fecha = ov.querySelector("#exFecha").value || hoy;
      const vig   = ov.querySelector("#exVig").value;
      const notas = ov.querySelector("#exNotas").value.trim();
      const dest = c ? { empresa:c.empresa, contacto:c.contacto, ubicacion:c.ubicacion,
                         telefono:c.telefono, email:c.email } : null;
      const nombre = TIPOS_EXTERNO.find(t => t.id === tipo).name;

      const anio = String(fecha).slice(0, 4);

      /* El número, antes de crear nada: si no se consigue, no se registra. Es
         la misma regla que al firmar, y por la misma razón. */
      const serie = tipo === "convenio"    ? ["convenios", "CV"]
                  : tipo === "cotizacionbq" ? ["eventos_ev", "EV"]
                  : tipo === "contratobq"   ? ["eventos_cb", "CB"]
                                            : ["contratos", "CT"];
      const local = () => tipo === "convenio"    ? folioLibre(anio)
                        : tipo === "cotizacionbq" ? folioEvento("cotizacion", anio)
                        : tipo === "contratobq"   ? folioEvento("contrato", anio)
                                                  : folioContrato(anio);
      const elFolio = await folioParaFirmar({ folio }, serie[0], serie[1], anio, local);
      if (!elFolio){ alert(AVISO_SIN_CONTADOR.replace("no se firmó", "no se registró")); return; }

      /* Si el folio venía escrito —del papel— hay que anotarlo, y hay que
         ESPERAR a que quede anotado: si esa anotación se pierde, el contador
         volverá a repartir ese mismo número y el papel quedará repetido con un
         documento nuevo. Que es exactamente lo que pasó. */
      if (folio && nubeActiva()){
        const quedo = await anotarFolio(serie[0], elFolio);
        if (quedo === false && !confirm(
            `No se pudo apartar el folio ${elFolio} en el contador del hotel.\n\n` +
            "Si se registra así, el contador puede volver a repartir ese número y " +
            "quedarían dos documentos con el mismo folio.\n\n¿Registrarlo de todos modos?"))
          return;
      }

      if (tipo === "convenio"){
        const v = saneaConv({
          clienteId:cid, ejecutivo:quien, externo:true,
          folio: elFolio,
          fecha, vigenciaDesde:fecha, vigenciaHasta:vig, notas,
          firmaManual: manual, createdAt:new Date().toISOString()
        });
        state.convenios.push(v);
        cerrarConvenio(v, null, `Documento externo. Se subió el archivo "${f.name}".`, quien);
        v.avisado = true;     // lo registró el propio equipo: no hay novedad que avisar
      } else if (tipo === "cotizacionbq" || tipo === "contratobq"){
        const ev = saneaEvento({
          clienteId:cid, ejecutivo:quien, externo:true,
          tipo: tipo === "contratobq" ? "contrato" : "cotizacion",
          folio: elFolio,
          fecha, vigencia:vig, observaciones:notas, estado:"confirmado",
          bloques: vig ? [saneaBloqueEv({ fecha: vig })] : [],
          firmaManual: manual, destinatario: dest, createdAt:new Date().toISOString()
        });
        state.eventos.push(ev);
        tocaBanquetes(ev);
        registrarAuto(cid, `${nombre} ${ev.folio} registrada desde un documento externo`,
          `Se subió el archivo "${f.name}".`, quien);
      } else {
        const k = saneaContrato({
          clienteId:cid, ejecutivo:quien, externo:true, tipo,
          folio: elFolio,
          fecha, vigencia:vig, notas, estado:"aceptado",
          firmaManual: manual, destinatario: dest, createdAt:new Date().toISOString()
        });
        state.contratos.push(k);
        registrarAuto(cid, `${nombre} ${k.folio} registrada desde un documento externo`,
          `Se subió el archivo "${f.name}".`, quien);
      }

      guardar(); render();
      ov.remove();
      vista = TIPOS_EXTERNO.find(t => t.id === tipo).donde;
      render();
      if (alTerminar) alTerminar();
    }
  };
}

/**
 * La ficha de un documento que vino de fuera.
 *
 * No se dibuja una carta: no hay de dónde. Se enseñan los datos que se
 * capturaron y el archivo tal cual lo subieron.
 */
function fichaExterna(titulo, etiqueta, filas, manual, alBorrar){
  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${esc(titulo)}</h2>
        <span class="estado-chip" style="background:var(--ok-soft);color:var(--ok)">${esc(etiqueta)}</span>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="note">Este documento <b>no se armó en el CRM</b>: se subió ya firmado.
          Lo que vale es el archivo escaneado.</div>
        <div style="overflow:auto"><table class="data"><tbody>${filas.map(([a,b]) => `<tr>
          <td style="width:190px;color:var(--muted)">${esc(a)}</td>
          <td><b>${esc(b || "—")}</b></td></tr>`).join("")}</tbody></table></div>
      </div>
      <div class="modal-foot">
        <button class="btn danger" id="bDelEx">Eliminar</button>
        <div class="spacer"></div>
        <button class="btn primary" id="bVerEsc">Ver el documento</button>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);
  ov.querySelector("#bVerEsc").onclick = () => verEscaneado(manual, titulo);
  ov.querySelector("#bDelEx").onclick = () => {
    if (!confirm("¿Eliminar este documento del CRM?\n\nSe borra también el archivo subido.")) return;
    // El archivo del almacén se va con el registro; si no, quedaría ocupando
    // lugar en el proyecto sin que nadie pueda volver a abrirlo.
    if (manual && manual.ruta) borrarEscaneo(manual.ruta);
    alBorrar(); ov.remove();
  };
  return ov;
}

function verConvenioExterno(v, alCerrar){
  const c = cliente(v.clienteId);
  fichaExterna(`Convenio ${v.folio || ""}`, "Externo · firmado", [
    ["Cliente", (c && c.empresa) || nombreCli(v.clienteId)],
    ["Ejecutivo", ejecutivoDe(v)],
    ["Fecha del documento", fechaCorta(v.fecha)],
    ["Vigencia hasta", v.vigenciaHasta ? fechaCorta(v.vigenciaHasta) : ""],
    ["Archivo", v.firmaManual && v.firmaManual.archivo],
    ["Lo registró", v.firmaManual && v.firmaManual.quien],
    ["Observaciones", v.notas]
  ], v.firmaManual, () => {
    state.convenios = state.convenios.filter(x => x.id !== v.id);
    guardar(); render(); if (alCerrar) alCerrar();
  });
}

function verContratoExterno(k, alCerrar){
  const c = cliente(k.clienteId);
  fichaExterna(`${infoTipoCt(k.tipo).name} ${k.folio || ""}`, "Externo · firmado", [
    ["Cliente", (c && c.empresa) || nombreCli(k.clienteId)],
    ["Ejecutivo", ejecutivoDeCt(k)],
    ["Fecha del documento", fechaCorta(k.fecha)],
    ["Vigencia hasta", k.vigencia ? fechaCorta(k.vigencia) : ""],
    ["Archivo", k.firmaManual && k.firmaManual.archivo],
    ["Lo registró", k.firmaManual && k.firmaManual.quien],
    ["Observaciones", k.notas]
  ], k.firmaManual, () => {
    state.contratos = state.contratos.filter(x => x.id !== k.id);
    guardar(); render(); if (alCerrar) alCerrar();
  });
}

/** Enseña el escaneado que se subió, sin sacarlo de la aplicación. */
function verEscaneado(manual, titulo, deposito){
  if (!traeEscaneo(manual)){ alert("Este documento no trae archivo."); return; }

  const nombre = manual.archivo || "documento";
  const esImagen = manual.pdf
    ? /^data:image\//.test(manual.pdf)
    : /^image\//.test(manual.tipoMime || "") || /\.(jpe?g|png|gif|webp|heic)$/i.test(nombre);
  /* Un video metido en un <iframe> se ve a medias en unos navegadores y en
     otros no se ve: no era una decisión, era que nadie había subido uno. */
  const esVideo = manual.pdf
    ? /^data:video\//.test(manual.pdf)
    : /^video\//.test(manual.tipoMime || "") || /\.(mp4|webm|mov|m4v)$/i.test(nombre);

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${esc(titulo || nombre)}</h2>
        <button class="btn" data-close>\u2715</button></div>
      <div class="modal-body" style="background:#f2f0f5">
        <div id="escCaja" class="vacio">Trayendo el archivo\u2026</div>
      </div>
      <div class="modal-foot">
        <span class="hint">${esc(nombre)}${manual.quien
          ? " \u00b7 lo subi\u00f3 " + esc(manual.quien) : ""}</span>
        <div class="spacer"></div>
        <button class="btn" id="bBajarEsc" disabled>Descargar</button>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const pintar = src => {
    ov.querySelector("#escCaja").outerHTML = esImagen
      ? `<img src="${esc(src)}" alt="${esc(nombre)}"
           style="max-width:100%;display:block;margin:0 auto;background:#fff">`
      : esVideo
        ? `<video src="${esc(src)}" controls playsinline
             style="max-width:100%;display:block;margin:0 auto;background:#000"></video>`
        : `<iframe src="${esc(src)}" title="${esc(nombre)}"
             style="border:0;width:100%;height:70vh;background:#fff"></iframe>`;
    const b = ov.querySelector("#bBajarEsc");
    b.disabled = false;
    b.onclick = () => {
      const a = document.createElement("a");
      a.href = src; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
    };
  };

  // Incrustado: ya lo trae consigo. En el almac\u00e9n: hay que ir por \u00e9l con la
  // sesi\u00f3n, porque el dep\u00f3sito es privado y no se abre con una liga suelta.
  if (manual.pdf) return pintar(manual.pdf);

  bajarEscaneo(manual.ruta, deposito)
    .then(src => {
      pintar(src);
      // La direcci\u00f3n temporal se suelta al cerrar; si no, el archivo se queda
      // en memoria hasta recargar la p\u00e1gina.
      ov.addEventListener("remove", () => URL.revokeObjectURL(src));
    })
    .catch(e => {
      const caja = ov.querySelector("#escCaja");
      if (caja) caja.innerHTML = `<div class="errbox" style="text-align:left">
        <b>No se pudo traer el archivo del almac\u00e9n.</b><br>
        <span class="hint">${esc(e.message)}</span><br>
        Si dice <i>Bucket not found</i>, falta correr <code>archivos.sql</code>.</div>`;
    });
}

/* ==========================================================================
   BANQUETES · el documento

   Sale de las cotizaciones que trae el departamento, sección por sección:
   detalles del evento, los servicios descritos, la propuesta económica con su
   IVA y su cargo por servicio, las observaciones y la firma.
   ========================================================================== */

const TEXTOS_EV = {
  saludo: "Agradeciendo su preferencia, anexo detallado de los servicios cotizados " +
          "para su evento en {{HOTEL}} en base a la información previamente proporcionada.",
  cortesia: "Si el consumo de Alimentos y Bebidas (en importes netos) cubre la renta del " +
            "espacio, el salón se otorga en cortesía. En caso contrario, el salón será " +
            "re-cotizado.",
  vigencia: "Le recordamos que la presente es solamente una cotización y no establece un " +
    "compromiso por parte del Hotel, tiene una vigencia hasta el {{VIGENCIA}}. En caso de " +
    "confirmar los servicios deberá procederse a la contratación del evento mediante firma " +
    "de contrato y pago de anticipo.",
  observaciones: "Se prohíbe el ingreso de Alimentos & Bebidas ajenos al Hotel.",
  cierre: "Me reitero nuevamente a sus órdenes por cualquier duda o requerimiento adicional."
};

const anioEvento = e => String(e.fecha || hoyISO()).slice(0, 4) ||
  String(new Date().getFullYear());

/** Serie propia: EV para cotizaciones de evento, CB para contratos de banquetes. */
function folioEvento(tipo, anio, excluirId){
  const pre = tipo === "contrato" ? "CB" : "EV";
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^" + pre + "-" + a + "-(\\d+)$", "i");
  const usados = new Set(state.eventos
    .filter(x => x.id !== excluirId)
    .map(x => String(x.folio || "").trim().toUpperCase()));
  let n = Math.max(0, ...state.eventos
    .filter(x => x.id !== excluirId)
    .map(x => Number((re.exec(String(x.folio || "").trim()) || [])[1]) || 0)) + 1;
  let f;
  do { f = `${pre}-${a}-${String(n++).padStart(3, "0")}`; } while (usados.has(f));
  return f;
}

const eventoEsMio = e => puedeVerTodo() ||
  (!!miNombre().trim() && ejecutivoDeEv(e).toLowerCase() === miNombre().trim().toLowerCase()) ||
  esMioPorVentas(cliente(e.clienteId) || {});

/** Los eventos que le tocan a quien está viendo, del tipo que se le pida. */
const eventosVisibles = tipo => state.eventos
  .filter(e => e.tipo === tipo && eventoEsMio(e))
  .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));

/** "jueves 15 de enero, 2026" — como lo escribe banquetes en sus cotizaciones. */
function fechaLarga(iso){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return String(iso || "");
  const [a, m, d] = String(iso).split("-").map(Number);
  const f = new Date(a, m - 1, d);
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
                 "septiembre","octubre","noviembre","diciembre"];
  return `${dias[f.getDay()]} ${d} de ${meses[m-1]}, ${a}`;
}

const fechaBloque = f => /^\d{4}-\d{2}-\d{2}$/.test(String(f))
  ? fechaCorta(f) : String(f || "—");

/** La cotización lleva su carta; el contrato, el legal completo. */
const docEvento = (e, c) => e.tipo === "contrato" ? cuerpoContratoBq(e, c) : cuerpoEvento(e, c);

function cuerpoEvento(e, c){
  if (!(c && c.empresa) && e.destinatario) c = e.destinatario;
  const h = state.ajustes.hotel;
  const cu = cuentasEvento(e);
  const u = state.usuarios.find(x => x.nombre === ejecutivoDeEv(e));

  const rellena = t => String(t || "")
    .replace(/\{\{HOTEL\}\}/g, h.nombre)
    .replace(/\{\{VIGENCIA\}\}/g, e.vigencia ? fechaTexto(e.vigencia) : "—");

  const bloqueFirma = (f, titulo, nombreDef, puestoDef, celDef) => `
    <div class="firma">
      <h4>${esc(titulo)}</h4>
      <div class="cv">${f ? `<img src="${f.img}" alt="Firma">` : `<span>Pendiente de firma</span>`}</div>
      <div class="lin">
        <i>Nombre</i> <u>${esc(f ? f.nombre : (nombreDef || ""))}</u><br>
        <i>Puesto</i> <u>${esc(f ? f.puesto : (puestoDef || ""))}</u><br>
        <i>Fecha</i> <u>${esc(f ? fechaFirma(f.fecha) : "")}</u><br>
        <i>Celular</i> <u>${esc(f ? f.celular : (celDef || ""))}</u>
      </div>
    </div>`;

  return `
    <div class="doc-hotel">
      ${h.logo ? `<img class="doc-logo" src="${esc(h.logo)}" alt="${esc(h.nombre)}">`
        : esQuartz(h.nombre) ? `<div class="doc-wordmark">${logoQuartz(MORADO_QUARTZ)}</div>`
        : `<div class="doc-mono">${monogramaQ(MORADO_QUARTZ)}</div><b>${esc(h.nombre)}</b>`}
      <div>${esc(h.direccion)}</div>
      <div>Tel. ${esc(h.telefono)}</div>
    </div>
    <div class="doc-regla"></div>
