/* ----- Editor de convenio ----- */

/**
 * El folio que sigue para un año: CV-2027-004.
 *
 * El consecutivo se cuenta por año y sale del folio más alto que ya exista
 * para ese año, no de cuántos convenios haya en total. Contar el total daba
 * folios repetidos en cuanto se borraba uno, y arrancaba el año nuevo con el
 * número donde se hubiera quedado el anterior.
 *
 * Se saltan los borradores sin firmar de otros años porque el folio se
 * recalcula solo mientras nadie lo haya escrito a mano.
 */
function folioAuto(anio){
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^CV-" + a + "-(\\d+)$", "i");
  const usados = state.convenios
    .map(v => (re.exec(String(v.folio || "").trim()) || [])[1])
    .filter(Boolean)
    .map(Number);
  const n = usados.length ? Math.max(...usados) + 1 : 1;
  return `CV-${a}-${String(n).padStart(3, "0")}`;
}

/** El año que manda en el folio es el de la vigencia, no el de hoy. */
const anioConvenio = v =>
  String(v.vigenciaDesde || v.fecha || hoyISO()).slice(0, 4) || String(new Date().getFullYear());

/** El primer folio libre de un año, saltándose los que ya existan. */
function folioLibre(anio, excluirId){
  const usados = new Set(state.convenios
    .filter(v => v.id !== excluirId)
    .map(v => String(v.folio || "").trim().toUpperCase()));
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^CV-" + a + "-(\\d+)$", "i");
  let n = Math.max(0, ...state.convenios
    .filter(v => v.id !== excluirId)
    .map(v => Number((re.exec(String(v.folio || "").trim()) || [])[1]) || 0)) + 1;
  let f;
  do { f = `CV-${a}-${String(n++).padStart(3, "0")}`; } while (usados.has(f));
  return f;
}

/** ¿Tiene la forma que arma la aplicación sola? */
const folioAutomatico = f => /^CV-\d{4}-\d+$/i.test(String(f || "").trim());

/* ==========================================================================
   EL CONSECUTIVO, DEL LADO DEL SERVIDOR

   El siguiente folio salía de los convenios que este equipo tiene bajados, y
   eso deja de ser cierto en cuanto el servidor reparte por dueño: un ejecutivo
   que sólo recibe los suyos cuenta desde el suyo más alto y propone un número
   que en el hotel ya existe. Y la renumeración automática tampoco lo agarra,
   porque trabaja con lo mismo que ve.

   Por eso el contador vive en el servidor —folios.sql—, que es el único que
   los ve todos. Aquí nada más se le pregunta y se le pide turno.

   Si no se ha corrido folios.sql, todo esto se hace a un lado y la aplicación
   cuenta como siempre: mejor un consecutivo aproximado que no poder trabajar.
   ========================================================================== */

/** Se anota a la primera negativa del servidor y ya no se vuelve a molestar. */
const hayContador = () => nubeActiva() && !nube.sinFolios;

/** ¿Es un "esto no existe" —y no un problema de paso— lo que contestó? */
function noExisteLaFuncion(e){
  return /PGRST202|PGRST205|not find the function|does not exist|404/i.test(e.message || "");
}

/**
 * El número más alto que el hotel entero lleva en ese año.
 *
 * Es para ENSEÑAR el consecutivo al abrir el editor. No aparta nada: si dos
 * personas abren el editor a la vez, las dos ven el mismo número, y cada una
 * se lleva el suyo al guardar.
 */
async function ultimoFolioNube(tipo, anio){
  if (!hayContador()) return 0;
  try{
    const filas = await api(`/rest/v1/crm_folios?tipo=eq.${encodeURIComponent(tipo)}` +
      `&anio=eq.${Number(anio)}&select=numero&order=numero.desc&limit=1`);
    return (filas && filas[0] && Number(filas[0].numero)) || 0;
  }catch(e){
    if (noExisteLaFuncion(e)) nube.sinFolios = true;
    else console.warn("No se pudo consultar el contador de folios:", e.message);
    return 0;
  }
}

/**
 * Pide turno: devuelve un folio que nadie más va a recibir.
 *
 * Devuelve "" cuando no hay contador montado, y entonces manda lo que la
 * aplicación haya calculado con lo que tiene.
 */
async function apartarFolio(tipo, prefijo, anio){
  if (!hayContador()) return "";
  try{
    const r = await api("/rest/v1/rpc/crm_aparta_folio", {
      method:"POST",
      body: JSON.stringify({ p_tipo:tipo, p_anio:Number(anio),
                             p_prefijo:prefijo, p_quien:miNombre() })
    });
    return typeof r === "string" ? r : "";
  }catch(e){
    if (noExisteLaFuncion(e)) nube.sinFolios = true;
    else console.warn("No se pudo apartar folio:", e.message);
    return "";
  }
}

/**
 * Anota un folio que no salió del contador: el que venía en un papel, o el que
 * alguien escribió a mano. Si no se anotara, el contador lo volvería a repartir.
 */
async function anotarFolio(tipo, folio){
  if (!hayContador()) return;
  const m = /^([A-Za-z]+)-(\d{4})-(\d+)$/.exec(String(folio || "").trim());
  if (!m) return;   // formato de la casa: no entra a la cuenta
  try{
    await api("/rest/v1/rpc/crm_anota_folio", {
      method:"POST",
      body: JSON.stringify({ p_tipo:tipo, p_anio:Number(m[2]), p_numero:Number(m[3]),
                             p_folio:folio.toUpperCase(), p_quien:miNombre() })
    });
  }catch(e){
    if (noExisteLaFuncion(e)) nube.sinFolios = true;
    else console.warn("No se pudo anotar el folio:", e.message);
  }
}

/** ¿Quién trae ya este folio? Sirve para avisar antes de que se repita. */
function duenioDelFolio(folio, excluirId){
  const f = String(folio || "").trim().toUpperCase();
  if (!f) return null;
  const v = state.convenios.find(x => x.id !== excluirId &&
    String(x.folio || "").trim().toUpperCase() === f);
  return v || null;
}

/**
 * Dos ejecutivos capturando a la vez, cada uno en su equipo, pueden tomar el
 * mismo folio: cada quien cuenta con lo que tiene bajado en ese momento y
 * ninguno ve todavía el convenio del otro. Se detecta al sincronizar, que es
 * segundos después.
 *
 * Se renumera el que se creó después, y sólo si sigue en borrador: un convenio
 * ya firmado o ya enviado lleva su folio impreso en un PDF que anda en el
 * correo de un cliente, y cambiárselo por detrás sería peor que el problema.
 * Esos se marcan para que alguien decida.
 */
function resolverFoliosRepetidos(){
  const porFolio = new Map();
  for (const v of state.convenios){
    const f = String(v.folio || "").trim().toUpperCase();
    if (!f) continue;
    if (!porFolio.has(f)) porFolio.set(f, []);
    porFolio.get(f).push(v);
  }

  let cambio = false;
  for (const [folio, grupo] of porFolio){
    if (grupo.length < 2) continue;
    // El primero en crearse se queda con el folio.
    grupo.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    for (const v of grupo.slice(1)){
      const intocable = v.estado !== "borrador" || v.enviado || v.firmaHotel;
      if (intocable){ v.folioRepetido = folio; continue; }
      const nuevo = folioLibre(anioConvenio(v), v.id);
      registrarAuto(v.clienteId, `El convenio ${v.folio} se renumeró como ${nuevo}`,
        `Otro equipo había tomado el folio ${v.folio} al mismo tiempo. Como este seguía en ` +
        "borrador, se le dio el siguiente libre.", "");
      v.folio = nuevo;
      v.folioRepetido = "";
      v.updatedAt = new Date().toISOString();
      cambio = true;
    }
  }
  if (cambio) guardar();
  return cambio;
}


function editarConvenio(id, clientePre, alCerrar){
  const existente = id ? state.convenios.find(v => v.id === id) : null;

  if (existente && existente.externo){ verConvenioExterno(existente, alCerrar); return; }
  if (existente && existente.estado !== "borrador"){
    alert("Este convenio ya está firmado y no se puede editar.\n\nSe abrirá la carta en modo lectura.");
    verConvenio(existente.id, alCerrar);
    return;
  }

  const finAnio = new Date().getFullYear() + "-12-31";
  const v = existente || saneaConv({
    clienteId: clientePre || "",
    folio: folioAuto(new Date().getFullYear()),
    fecha: hoyISO(),
    vigenciaDesde: hoyISO(),
    vigenciaHasta: finAnio,
    textos: Object.assign({}, state.ajustes.textos)
  });

  // En borrador la tarifa pública se refresca desde el catálogo; el precio convenio se conserva.
  const previos = new Map(v.habitaciones.map(h => [h.tipoId, h.convenio]));
  const filas = state.habitaciones.map(h => ({
    tipoId:h.id, codigo:h.codigo, nombre:h.nombre, grupo:h.grupo, publica:h.publica,
    convenio: previos.has(h.id) ? previos.get(h.id) : ""
  }));

  const bloque = gid => {
    const fs = filas.filter(f => f.grupo === gid);
    if (!fs.length) return `<p class="hint">No hay habitaciones de este bloque en el catálogo (pestaña Ajustes).</p>`;
    return `<table class="data"><thead><tr>
        <th style="width:44px"></th><th style="width:80px">Clave</th><th>Tipo de habitación</th>
        <th class="num" style="width:150px">Tarifa pública</th>
        <th class="num" style="width:170px">Tarifa convenio</th><th class="num" style="width:100px">Dcto.</th>
      </tr></thead><tbody>${fs.map(f => {
        const on = f.convenio !== "" && f.convenio !== null;
        return `<tr data-tipo="${f.tipoId}"${on ? "" : ' class="off"'}>
        <td class="selcell"><input type="checkbox" class="sel"${on ? " checked" : ""}
              title="Incluir esta habitación en el convenio"></td>
        <td>${f.codigo ? `<span class="pill">${esc(f.codigo)}</span>` : ""}</td>
        <td><b>${esc(f.nombre)}</b></td>
        <td class="num">${f.publica === null ? `<b>N/A</b>` : `<b>${esc(moneyMN(f.publica))}</b>`}
          <div class="hint">fija</div></td>
        <td class="num"><input class="field conv" inputmode="decimal" data-pub="${f.publica === null ? "" : f.publica}"
              value="${on ? esc(f.convenio) : ""}" placeholder="—" style="width:100%;text-align:right"
              ${on ? "" : "disabled"}></td>
        <td class="num desc">—</td></tr>`; }).join("")}</tbody></table>`;
  };

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${existente ? "Editar convenio" : "Nuevo convenio"}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div class="grid">
          <div class="full"><label class="lbl">Cliente</label>
            <select class="field" id="cCli">
              <option value="">— Selecciona un cliente —</option>
              ${[...state.clientes].sort((a,b)=>a.empresa.localeCompare(b.empresa,"es")).map(c =>
                `<option value="${c.id}"${c.id===v.clienteId?" selected":""}>${esc(c.empresa)}${c.contacto?" · "+esc(c.contacto):""}</option>`).join("")}
            </select></div>
          <div class="full"><label class="lbl">Ejecutivo de ventas</label>
            ${selectEjecutivo(v.ejecutivo || (cliente(v.clienteId) || {}).ejecutivo || miNombre(), "cEje")}
            <div class="hint">Quien firma la carta por el hotel y a quien se le avisa cuando el
              cliente la firma. La lista sale de <i>Ajustes → Usuarios y permisos</i>.</div></div>
          <div><label class="lbl">Folio</label><input class="field" id="cFolio" value="${esc(v.folio)}">
            <div class="hint" id="cFolioNota"></div></div>
          <div><label class="lbl">Fecha de la carta</label><input class="field" type="date" id="cFecha" value="${esc(v.fecha)}"></div>
          <div><label class="lbl">Vigencia desde</label><input class="field" type="date" id="cDesde" value="${esc(v.vigenciaDesde)}"></div>
          <div><label class="lbl">Vigencia hasta</label><input class="field" type="date" id="cHasta" value="${esc(v.vigenciaHasta)}"></div>
        </div>

        <h3 class="sec">Bloque ${esc(infoGrupo("deluxe").nombre)}</h3>
        <div id="cErr"></div>
        <div class="note">Marca las habitaciones que entran en este convenio. La <b>tarifa pública</b>
          viene del catálogo y no se edita aquí; <b>toda habitación marcada necesita su tarifa convenio</b>.</div>
        <div>${bloque("deluxe")}</div>

        <h3 class="sec">Bloque ${esc(infoGrupo("recovery").nombre)}</h3>
        <p><label><input type="checkbox" id="cRec" ${v.incluyeRecovery ? "checked" : ""}>
          Considerar también habitaciones ${esc(infoGrupo("recovery").nombre)} en este convenio</label></p>
        <div id="bRecovery" ${v.incluyeRecovery ? "" : 'style="display:none"'}>${bloque("recovery")}</div>

        <h3 class="sec">Observaciones internas</h3>
        <p class="hint" style="margin-top:0">No se imprimen en la carta; son notas para el equipo.</p>
        <textarea class="field" id="cNotas" style="width:100%;min-height:80px">${esc(v.notas)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDel">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="bOk">Guardar borrador</button>
        <button class="btn ok" id="bFirmar">Guardar y firmar</button>
      </div>
    </div>`);

  const recalcular = () => ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
    const inp = tr.querySelector(".conv");
    const sel = tr.querySelector(".sel").checked;
    const pub = inp.dataset.pub === "" ? null : Number(inp.dataset.pub);
    const celda = tr.querySelector(".desc");
    const val = inp.value.trim();
    if (!sel || !val || pub === null || !pub){ celda.textContent = "—"; celda.style.color = ""; return; }
    const pct = Math.round((1 - parseMoney(val)/pub) * 100);
    celda.textContent = (pct >= 0 ? "-" : "+") + Math.abs(pct) + "%";
    celda.style.color = pct < 0 ? "var(--bad)" : "var(--muted)";
  });

  /** La casilla manda: sin marcar, la tarifa ni se captura. */
  function sincroniza(tr, foco){
    const sel = tr.querySelector(".sel").checked;
    const inp = tr.querySelector(".conv");
    inp.disabled = !sel;
    tr.classList.toggle("off", !sel);
    if (!sel){
      inp.value = "";
      tr.classList.remove("row-err");
      inp.classList.remove("err");
    } else if (foco) inp.focus();
    recalcular();
  }

  ov.addEventListener("change", e => {
    if (e.target.classList.contains("sel")) sincroniza(e.target.closest("tr"), true);
  });
  ov.addEventListener("input", e => {
    if (!e.target.classList.contains("conv")) return;
    e.target.classList.remove("err");
    e.target.closest("tr").classList.remove("row-err");
    recalcular();
  });
  recalcular();

  ov.querySelector("#cRec").onchange = e => {
    ov.querySelector("#bRecovery").style.display = e.target.checked ? "" : "none";
    validar();          // al apagarlo desaparece su reclamo, al prenderlo aparece
  };

  const bDel = ov.querySelector("#bDel");
  if (bDel) bDel.onclick = () => {
    if (!confirm("¿Eliminar este convenio? Esta acción no se puede deshacer.")) return;
    state.convenios = state.convenios.filter(x => x.id !== v.id);
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  // Si se cambia la vigencia a otro año, el folio se acomoda solo. Se deja de
  // hacer en cuanto alguien lo escribe a mano: ahí manda lo que escribió.
  {
    const fFolio = ov.querySelector("#cFolio"), fDesde = ov.querySelector("#cDesde");
    const nota = ov.querySelector("#cFolioNota");
    let ultimoAuto = existente ? null : fFolio.value;

    /* El aviso de que ese folio ya es de alguien. Se dice mientras se escribe,
       no al guardar: enterarse después de llenar toda la carta es tarde. */
    const revisar = () => {
      const ya = duenioDelFolio(fFolio.value, v.id);
      fFolio.classList.toggle("campo-err", !!ya);
      if (ya){
        nota.innerHTML = `<b style="color:var(--bad)">Ese folio ya es del convenio de
          ${esc(nombreCli(ya.clienteId))}.</b> Si lo dejas así, quedan dos con el mismo
          número.`;
        return;
      }
      nota.textContent = ultimoAuto !== null && fFolio.value === ultimoAuto
        ? notaAuto : "";
    };

    let notaAuto = "";
    /* El consecutivo del hotel, no el de lo que este equipo alcanza a ver. Se
       pregunta al servidor y se acomoda cuando conteste; mientras, queda el
       que se calculó aquí, que es el bueno si esta persona los ve todos. */
    const alDia = async () => {
      if (ultimoAuto === null) return;      // lo escribieron a mano: no se toca
      const anio = String(fDesde.value || hoyISO()).slice(0, 4);
      if (anio.length !== 4) return;
      const alto = await ultimoFolioNube("convenios", anio);
      if (ultimoAuto === null || fFolio.value !== ultimoAuto) return;   // cambió en el camino
      const local = Number((new RegExp("^CV-" + anio + "-(\\d+)$", "i")
        .exec(ultimoAuto) || [])[1]) || 0;
      if (alto >= local){
        fFolio.value = ultimoAuto = `CV-${anio}-${String(alto + 1).padStart(3, "0")}`;
        notaAuto = `Sigue al último del hotel, el CV-${anio}-${String(alto).padStart(3, "0")}.`;
      } else if (!hayContador() && nubeActiva()){
        notaAuto = "";
      }
      revisar();
    };

    fFolio.addEventListener("input", () => {
      if (fFolio.value !== ultimoAuto) ultimoAuto = null;
      revisar();
    });
    fDesde.addEventListener("change", () => {
      if (ultimoAuto === null || fFolio.value !== ultimoAuto) return;
      const anio = String(fDesde.value || "").slice(0, 4);
      if (anio.length !== 4) return;
      fFolio.value = ultimoAuto = folioAuto(anio);
      notaAuto = "";
      revisar();
      alDia();
    });

    revisar();
    if (!existente) alDia();
  }

  // El ejecutivo sigue al cliente mientras nadie lo haya cambiado a mano.
  {
    const fCli = ov.querySelector("#cCli"), fEje = ov.querySelector('[name="cEje"]');
    let auto = existente ? null : fEje.value;
    fEje.addEventListener("change", () => { if (fEje.value !== auto) auto = null; });
    fCli.addEventListener("change", () => {
      if (auto === null || fEje.value !== auto) return;
      const e = String((cliente(fCli.value) || {}).ejecutivo || "").trim();
      if (e && [...fEje.options].some(o => o.value === e)) fEje.value = auto = e;
    });
  }

  // Guardar espera al servidor: es ahí donde se aparta el folio. Se bloquea el
  // botón mientras tanto para que dos clics no levanten dos convenios.
  const guardando = async (b, fn) => {
    const antes = b.textContent;
    b.disabled = true; b.textContent = "Guardando\u2026";
    try{ return await fn(); }
    finally{ b.disabled = false; b.textContent = antes; }
  };
  ov.querySelector("#bOk").onclick = e => guardando(e.currentTarget, async () => {
    if (await recoger()){ ov.remove(); if (alCerrar) alCerrar(); }
  });
  ov.querySelector("#bFirmar").onclick = e => guardando(e.currentTarget, async () => {
    if (!await recoger()) return;
    ov.remove();
    verConvenio(v.id, alCerrar, true);
  });

  /** Filas que cuentan: las de un bloque vigente (Recovery sólo si está activo). */
  function filasVigentes(){
    const incRec = ov.querySelector("#cRec").checked;
    return [...ov.querySelectorAll("tr[data-tipo]")].map(tr => {
      const cat = state.habitaciones.find(h => h.id === tr.dataset.tipo);
      if (!cat || (cat.grupo === "recovery" && !incRec)) return null;
      return { tr, cat, sel: tr.querySelector(".sel").checked, val: tr.querySelector(".conv").value.trim() };
    }).filter(Boolean);
  }

  function pintaErrores(lista){
    const caja = ov.querySelector("#cErr");
    caja.innerHTML = lista.length
      ? `<div class="errbox"><b>Falta esto para poder continuar:</b><ul>${
          lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      : "";
  }

  /**
   * Devuelve las habitaciones listas para guardar, o null si algo falta.
   * Reglas: al menos una habitación marcada; toda marcada con su tarifa
   * convenio; y si el bloque Recovery está activo, al menos una de ese bloque.
   */
  function validar(){
    ov.querySelectorAll("tr[data-tipo]").forEach(tr => {
      tr.classList.remove("row-err");
      tr.querySelector(".conv").classList.remove("err");
    });

    const vigentes = filasVigentes();
    const marcadas = vigentes.filter(f => f.sel);
    const sinTarifa = marcadas.filter(f => parseMoney(f.val) <= 0);
    const problemas = [];

    if (!marcadas.length)
      problemas.push("Marca al menos un tipo de habitación para este convenio.");

    if (sinTarifa.length){
      problemas.push("Captura la tarifa convenio de: " +
        sinTarifa.map(f => f.cat.codigo || f.cat.nombre).join(", ") + ".");
      sinTarifa.forEach(f => {
        f.tr.classList.add("row-err");
        f.tr.querySelector(".conv").classList.add("err");
      });
    }

    const rec = infoGrupo("recovery").nombre;
    if (ov.querySelector("#cRec").checked && !marcadas.some(f => f.cat.grupo === "recovery"))
      problemas.push(`Activaste el bloque ${rec}: marca al menos una habitación de ese bloque con su tarifa, o desactívalo.`);

    pintaErrores(problemas);
    if (problemas.length){
      const primera = ov.querySelector("tr.row-err") || ov.querySelector("#cErr");
      if (primera) primera.scrollIntoView({ block:"center", behavior:"smooth" });
      return null;
    }
    return marcadas.map(f => ({
      tipoId: f.cat.id, codigo: f.cat.codigo, nombre: f.cat.nombre, grupo: f.cat.grupo,
      publica: f.cat.publica, convenio: parseMoney(f.val)
    }));
  }

  /**
   * El folio se decide al guardar, no al abrir el editor.
   *
   * Entre que alguien abre el editor y le da guardar pueden pasar minutos, y
   * en ese rato otro pudo haber tomado el mismo número. Sólo se recalcula si
   * sigue siendo el que puso la aplicación: si lo escribieron a mano, manda
   * lo que escribieron aunque se repita.
   */
  async function folioAlGuardar(){
    const escrito = ov.querySelector("#cFolio").value.trim();
    const anio = String(ov.querySelector("#cDesde").value || escrito.slice(3, 7) ||
                        hoyISO()).slice(0, 4);

    // Uno que ya existía conserva su folio. Cambiárselo por detrás sería peor
    // que el problema: puede andar impreso en el correo de un cliente.
    if (existente && escrito === String(v.folio || "").trim()) return escrito;

    // Escrito a mano manda lo que escribieron. Sólo se anota, para que el
    // contador no vuelva a repartir ese número.
    if (!folioAutomatico(escrito)){ anotarFolio("convenios", escrito); return escrito; }

    // El turno lo da el servidor, que es el único que ve los folios de todo el
    // hotel. Dos personas al mismo segundo reciben números distintos.
    const apartado = await apartarFolio("convenios", "CV", anio);
    if (apartado) return apartado;

    // Sin contador montado: como siempre, con lo que este equipo alcanza a ver.
    const chocado = state.convenios.some(x =>
      x.id !== v.id && String(x.folio || "").trim().toUpperCase() === escrito.toUpperCase());
    return chocado ? folioLibre(anio, v.id) : escrito;
  }

  async function recoger(){
    const cid = ov.querySelector("#cCli").value;
    if (!cid){
      pintaErrores(["Selecciona el cliente del convenio."]);
      ov.querySelector("#cCli").focus();
      return false;
    }

    const habs = validar();
    if (!habs) return false;

    const desde = ov.querySelector("#cDesde").value, hasta = ov.querySelector("#cHasta").value;
    if (desde && hasta && hasta < desde){
      pintaErrores(['La vigencia "hasta" no puede ser anterior a "desde".']);
      return false;
    }
    pintaErrores([]);

    const pedido = ov.querySelector("#cFolio").value.trim();
    const folio = await folioAlGuardar();

    Object.assign(v, {
      clienteId: cid,
      ejecutivo: ov.querySelector('[name="cEje"]').value.trim(),
      folio,
      fecha: ov.querySelector("#cFecha").value || hoyISO(),
      vigenciaDesde: desde, vigenciaHasta: hasta,
      incluyeRecovery: ov.querySelector("#cRec").checked,
      habitaciones: habs,
      notas: ov.querySelector("#cNotas").value.trim(),
      grupos: saneaGrupos(state.ajustes.grupos),
      updatedAt: new Date().toISOString()
    });
    if (!existente){ v.createdAt = new Date().toISOString(); state.convenios.push(v); }
    // Si entre abrir el editor y guardar alguien más se llevó ese número, el
    // que quedó no es el que se vio en pantalla. Queda dicho en la bitácora
    // para que nadie ande buscando un folio que nunca existió.
    if (pedido && folio.toUpperCase() !== pedido.toUpperCase())
      registrarAuto(cid, `El convenio quedó con el folio ${folio}`,
        `Al abrir el editor se propuso el ${pedido}, pero al guardar ya estaba tomado. ` +
        "El consecutivo lo lleva el servidor, así que se le dio el siguiente libre.", "");
    guardar(); render();
    return true;
  }
}


/* ==========================================================================
   CAMPAÑAS
   ========================================================================== */

const campanasVisibles = () => state.campanas
  .slice()
  .sort((a, b) => String(b.desde || b.createdAt).localeCompare(String(a.desde || a.createdAt)));

const campana = id => state.campanas.find(c => c.id === id) || null;
const nombreCampana = id => (campana(id) || {}).nombre || "";

/** Los prospectos que trajo una campaña. Es el número que importa. */
const leadsDeCampana = id => state.prospectos.filter(p => p.campanaId === id).length;

function renderCampanas(){
  const cont = document.getElementById("tblCampanas");
  const cs = campanasVisibles();

  const cab = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <b style="font-size:15px">Campañas</b>
      <span class="hint">${cs.length} en total</span>
      <span style="flex:1"></span>
      <button class="btn primary" id="bNuevaCamp">+ Nueva campaña</button></div>
    <div class="note">Una campaña es lo que el hotel sale a hacer para que llegue gente.
      Lo que se mide es <b>cuánto costó y qué trajo</b>, así que de aquí cuelgan los
      prospectos: la liga que se genera en <i>Atribución &amp; UTMs</i> es la que los amarra.</div>`;

  if (!cs.length){
    cont.innerHTML = cab + `<div class="vacio">Todavía no hay campañas.</div>`;
  } else {
    cont.innerHTML = cab + `<table class="data">
      <thead><tr><th>Campaña</th><th>Canal</th><th>Periodo</th>
        <th class="num">Presupuesto</th><th class="num">Gastado</th>
        <th class="num">Leads</th><th>Estado</th><th>Responsable</th></tr></thead>
      <tbody>${cs.map(c => {
        const ec = ESTADOS_CAMP[c.estado], gasto = gastoCampana(c);
        const sobre = c.presupuesto && gasto > c.presupuesto;
        return `<tr class="row-link" data-id="${c.id}">
          <td><b>${esc(c.nombre || "(sin nombre)")}</b>${c.objetivo
            ? `<div class="hint">${esc(c.objetivo)}</div>` : ""}</td>
          <td>${esc(infoCanal(c.canal).name)}</td>
          <td class="nowrap">${c.desde ? esc(fechaCorta(c.desde)) : "—"}${
            c.hasta ? " → " + esc(fechaCorta(c.hasta)) : ""}</td>
          <td class="num nowrap">${c.presupuesto ? esc(moneyMN(c.presupuesto)) : "—"}</td>
          <td class="num nowrap"${sobre ? ' style="color:var(--bad)"' : ""}>${
            gasto ? esc(moneyMN(gasto)) : "—"}${sobre ? " ⚠" : ""}</td>
          <td class="num">${leadsDeCampana(c.id) || "—"}</td>
          <td><span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span></td>
          <td class="nowrap">${esc(c.responsable || "—")}</td>
        </tr>`;
      }).join("")}</tbody></table>`;

    cont.querySelectorAll("tr[data-id]").forEach(tr =>
      tr.addEventListener("click", () => editarCampana(tr.dataset.id)));
  }
  cont.querySelector("#bNuevaCamp").onclick = () => editarCampana(null);
}

function editarCampana(id, alCerrar){
  const existente = id ? campana(id) : null;
  const c = existente || saneaCampana({
    responsable: miNombre(),
    desde: hoyISO(),
    estado: "borrador"
  });

  const filaGasto = g => `<tr data-gasto>
    <td><input class="field g-mes" type="month" value="${esc(g.mes)}" style="width:150px"></td>
    <td><input class="field g-monto" inputmode="decimal" value="${g.monto || ""}"
          style="width:130px;text-align:right" placeholder="0.00"></td>
    <td><input class="field g-nota" value="${esc(g.nota)}" placeholder="opcional"></td>
    <td><button class="btn sm danger" data-quitag>Quitar</button></td></tr>`;

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>${existente ? "Campaña" : "Nueva campaña"}</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div id="campErr"></div>
        <div class="grid">
          <div class="full"><label class="lbl">Nombre</label>
            <input class="field" id="mkNombre" value="${esc(c.nombre)}"
              placeholder="Bodas verano 2026"></div>
          <div><label class="lbl">Canal</label>
            <select class="field" id="mkCanal">${CANALES.map(x =>
              `<option value="${x.id}"${x.id === c.canal ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
          <div><label class="lbl">Estado</label>
            <select class="field" id="mkEstado">${Object.entries(ESTADOS_CAMP).map(([k, v]) =>
              `<option value="${k}"${k === c.estado ? " selected" : ""}>${esc(v.name)}</option>`).join("")}</select></div>
          <div class="full"><label class="lbl">Objetivo <span class="hint">(opcional)</span></label>
            <input class="field" id="mkObjetivo" value="${esc(c.objetivo)}"
              placeholder="Llenar salón para bodas de mayo a agosto"></div>
          <div><label class="lbl">Desde</label>
            <input class="field" type="date" id="mkDesde" value="${esc(c.desde)}"></div>
          <div><label class="lbl">Hasta</label>
            <input class="field" type="date" id="mkHasta" value="${esc(c.hasta)}"></div>
          <div><label class="lbl">Presupuesto</label>
            <input class="field" id="mkPresupuesto" inputmode="decimal"
              value="${c.presupuesto || ""}" style="text-align:right" placeholder="0.00"></div>
          <div><label class="lbl">Responsable</label>
            ${selectEjecutivo(c.responsable || miNombre(), "mkResp")}</div>
        </div>

        <h3 class="sec">Gasto</h3>
        <div class="note">Se captura a mano, mes por mes, como lo cobra la plataforma.
          Conectarse solo a Meta o a Google necesita permisos de desarrollador y tiene costo;
          por ahora no compensa.</div>
        <div style="overflow:auto"><table class="data"><thead><tr>
          <th>Mes</th><th class="num">Monto</th><th>Nota</th><th></th></tr></thead>
          <tbody id="mkGastos">${(c.gastos.length ? c.gastos : []).map(filaGasto).join("")}</tbody></table></div>
        <p style="margin:8px 0 0"><button class="btn sm" id="bAddGasto">+ Agregar mes</button>
          <span class="hint" id="mkTotalGasto"></span></p>

        <h3 class="sec">Etiquetas de la liga</h3>
        <div class="note">Con esto se arman las ligas en <i>Atribución &amp; UTMs</i>. Si se dejan
          vacías, se toman del canal y del nombre, que es lo que conviene casi siempre.</div>
        <div class="grid">
          <div><label class="lbl">utm_source</label>
            <input class="field" id="mkSource" value="${esc(c.utmSource)}"
              placeholder="${esc(infoCanal(c.canal).utm)}"></div>
          <div><label class="lbl">utm_medium</label>
            <input class="field" id="mkMedium" value="${esc(c.utmMedium)}"
              placeholder="${esc(infoCanal(c.canal).medio)}"></div>
          <div><label class="lbl">utm_campaign</label>
            <input class="field" id="mkCampaign" value="${esc(c.utmCampaign)}"
              placeholder="${esc(etiquetaUtm(c))}"></div>
        </div>

        <h3 class="sec">Notas</h3>
        <textarea class="field" id="mkNotas" style="width:100%;min-height:70px">${esc(c.notas)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDelCamp">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkCamp">Guardar</button></div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  const cuerpoGastos = q("#mkGastos");

  const sumaGastos = () => [...cuerpoGastos.querySelectorAll("tr[data-gasto]")]
    .reduce((a, tr) => a + (parseMoney(tr.querySelector(".g-monto").value) || 0), 0);
  const pintaTotal = () => {
    const t = sumaGastos(), pre = parseMoney(q("#mkPresupuesto").value) || 0;
    q("#mkTotalGasto").innerHTML = t
      ? `Gastado: <b>${esc(moneyMN(t))}</b>` + (pre
          ? ` de ${esc(moneyMN(pre))}` + (t > pre
              ? ` · <b style="color:var(--bad)">se pasó por ${esc(moneyMN(t - pre))}</b>` : "")
          : "")
      : "";
  };

  const enganchaFila = tr => {
    tr.querySelector("[data-quitag]").onclick = () => { tr.remove(); pintaTotal(); };
    tr.querySelector(".g-monto").addEventListener("input", pintaTotal);
  };
  cuerpoGastos.querySelectorAll("tr[data-gasto]").forEach(enganchaFila);

  q("#bAddGasto").onclick = () => {
    cuerpoGastos.insertAdjacentHTML("beforeend", filaGasto(saneaGasto({ mes: hoyISO().slice(0, 7) })));
    enganchaFila(cuerpoGastos.lastElementChild);
    pintaTotal();
  };
  q("#mkPresupuesto").addEventListener("input", pintaTotal);
  pintaTotal();

  // Los marcadores de posición siguen al canal, para que se vea qué va a salir.
  q("#mkCanal").addEventListener("change", () => {
    const k = infoCanal(q("#mkCanal").value);
    q("#mkSource").placeholder = k.utm;
    q("#mkMedium").placeholder = k.medio;
  });

  if (existente) q("#bDelCamp").onclick = () => {
    const n = leadsDeCampana(c.id);
    if (!confirm(`¿Eliminar la campaña "${c.nombre}"?` +
      (n ? `\n\nLos ${n} prospecto(s) que trajo se quedan, pero pierden de qué campaña vinieron.` : "") +
      "\n\nEsta acción no se puede deshacer.")) return;
    state.campanas = state.campanas.filter(x => x.id !== c.id);
    for (const p of state.prospectos) if (p.campanaId === c.id) p.campanaId = "";
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  q("#bOkCamp").onclick = () => {
    const nombre = q("#mkNombre").value.trim();
    if (!nombre){
      q("#campErr").innerHTML = `<div class="errbox">La campaña necesita un nombre.</div>`;
      q("#mkNombre").focus();
      return;
    }
    const desde = q("#mkDesde").value, hasta = q("#mkHasta").value;
    if (desde && hasta && hasta < desde){
      q("#campErr").innerHTML = `<div class="errbox">La fecha "hasta" no puede ser anterior a "desde".</div>`;
      return;
    }

    Object.assign(c, {
      nombre,
      canal: q("#mkCanal").value,
      estado: q("#mkEstado").value,
      objetivo: q("#mkObjetivo").value.trim(),
      desde, hasta,
      presupuesto: parseMoney(q("#mkPresupuesto").value) || 0,
      responsable: q('[name="mkResp"]').value.trim(),
      notas: q("#mkNotas").value.trim(),
      utmSource: q("#mkSource").value.trim(),
      utmMedium: q("#mkMedium").value.trim(),
      utmCampaign: q("#mkCampaign").value.trim(),
      gastos: [...cuerpoGastos.querySelectorAll("tr[data-gasto]")].map(tr => saneaGasto({
        mes: tr.querySelector(".g-mes").value,
        monto: parseMoney(tr.querySelector(".g-monto").value) || 0,
        nota: tr.querySelector(".g-nota").value
      })).filter(g => g.mes),
      updatedAt: new Date().toISOString()
    });
    if (!existente){ c.createdAt = new Date().toISOString(); state.campanas.push(c); }
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };
}


/* ==========================================================================
   ATRIBUCIÓN & UTMs

   Una UTM es una etiqueta que viaja pegada a la liga de un anuncio. Cuando
   alguien la abre, la página sabe de dónde vino, y de ahí sale a qué campaña
   se le apunta el lead.

   Todo el chiste es que se escriban IGUAL siempre. "Facebook", "facebook" y
   "FB" son tres canales distintos para cualquier reporte, y ahí se acaba la
   medición. Por eso aquí no se escriben a mano: se arman.
   ========================================================================== */

let utmCampSel = "";

/** Junta la liga con sus etiquetas, sin dejar parámetros vacíos. */
function armaLiga(base, utm){
  const limpio = String(base || "").trim();
  if (!limpio) return "";
  const pares = Object.entries(utm)
    .filter(([, v]) => String(v || "").trim())
    .map(([k, v]) => `utm_${k}=${encodeURIComponent(String(v).trim())}`);
  if (!pares.length) return limpio;
  return limpio + (limpio.includes("?") ? "&" : "?") + pares.join("&");
}

function renderUtms(){
  const cont = document.getElementById("tblUtms");
  const cs = campanasVisibles();
  const sitio = String(state.ajustes.hotel.sitio || "").trim();

  if (!cs.length){
    cont.innerHTML = `<div style="max-width:760px">
      <b style="font-size:15px">Atribución &amp; UTMs</b>
      <div class="note" style="margin-top:12px">Primero hay que dar de alta una campaña:
        las ligas se arman a partir de ella. Ve a <b>Campañas</b> y crea una.</div></div>`;
    return;
  }

  if (!utmCampSel || !campana(utmCampSel)) utmCampSel = cs[0].id;
  const c = campana(utmCampSel);
  const k = infoCanal(c.canal);

  cont.innerHTML = `<div style="max-width:820px">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <b style="font-size:15px">Atribución &amp; UTMs</b>
      <span style="flex:1"></span>
      <label class="hint">Campaña</label>
      <select class="field" id="utmCamp">${cs.map(x =>
        `<option value="${x.id}"${x.id === utmCampSel ? " selected" : ""}>${esc(x.nombre)}</option>`).join("")}</select>
    </div>

    <div class="note">Pega esta liga en el anuncio, en la biografía o en el correo.
      Quien la abra llega a la página del hotel, y la campaña viaja con él.
      <b>No se escriben a mano</b>: basta cambiar el destino y el contenido.</div>

    <div class="grid">
      <div class="full"><label class="lbl">¿A dónde mandas a la gente?</label>
        <div class="subtabs" id="utmDestino" style="margin:0 0 8px">
          <button data-dest="registro" aria-current="true">La liga de registro</button>
          <button data-dest="sitio">La página del hotel</button>
        </div>
        <div id="utmDestNota" class="hint" style="margin-bottom:8px"></div>
        <input class="field" id="utmBase" value="${esc(sitio)}"
          placeholder="https://www.quartzhotel.mx/bodas" style="width:100%"></div>
      <div><label class="lbl">utm_source <span class="hint">de dónde</span></label>
        <input class="field" id="utmS" value="${esc(c.utmSource || k.utm)}"></div>
      <div><label class="lbl">utm_medium <span class="hint">cómo</span></label>
        <input class="field" id="utmM" value="${esc(c.utmMedium || k.medio)}"></div>
      <div><label class="lbl">utm_campaign <span class="hint">cuál</span></label>
        <input class="field" id="utmC" value="${esc(etiquetaUtm(c))}"></div>
      <div><label class="lbl">utm_content <span class="hint">qué pieza (opcional)</span></label>
        <input class="field" id="utmCt" placeholder="video-15s, carrusel-a"></div>
    </div>

    <h3 class="sec">La liga</h3>
    <div id="utmSalida"></div>

    ${nube.sinBuzonAltas ? `<div class="note warn" style="margin-top:12px">
      <b>La liga de registro todavía no está lista del lado del hotel.</b>
      Falta correr <code>prospectos.sql</code> una vez en Supabase. Mientras tanto la liga
      se puede armar, pero quien la abra no va a poder mandar sus datos.</div>` : ""}

    <h3 class="sec">Para qué sirve utm_content</h3>
    <div class="note">Cuando la misma campaña corre con dos piezas distintas —un video y
      un carrusel, dos textos— se les pone <b>utm_content</b> diferente y después se ve cuál
      trajo más. Si se deja vacío, no estorba: simplemente no aparece en la liga.</div>
  </div>`;

  const q = sel => cont.querySelector(sel);
  let destino = "registro";

  const pinta = () => {
    const utm = { source: q("#utmS").value, medium: q("#utmM").value,
                  campaign: q("#utmC").value, content: q("#utmCt").value };
    const alRegistro = destino === "registro";

    q("#utmBase").style.display = alRegistro ? "none" : "";
    q("#utmDestNota").innerHTML = alRegistro
      ? `El anuncio lleva directo al formulario del hotel. <b>Funciona desde hoy</b> y la
         campaña se amarra sola: no hay que tocar la página.`
      : (sitio
          ? `El anuncio lleva a la página del hotel. Para que la campaña se amarre, la
             página tiene que mandar a la gente a la liga de registro <b>conservando las
             etiquetas</b>; quien lleve el sitio sabrá hacerlo.`
          : `Falta la página del hotel. Escríbela aquí, o déjala fija en
             <i>Ajustes → Datos del hotel</i>.`);

    const liga = alRegistro ? ligaDeAlta(utm) : armaLiga(q("#utmBase").value, utm);
    q("#utmSalida").innerHTML = liga
      ? `<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
           <textarea class="field mono" id="utmLiga" readonly rows="2"
             style="flex:1;min-width:280px">${esc(liga)}</textarea>
           <button class="btn primary" id="bCopiarUtm">Copiar</button></div>
         <div class="hint" id="utmAviso" style="margin-top:6px"></div>`
      : `<div class="note warn">Falta la dirección a dónde llega la liga.</div>`;

    const b = q("#bCopiarUtm");
    if (b) b.onclick = async () => {
      try{
        await navigator.clipboard.writeText(liga);
        q("#utmAviso").textContent = "Copiada. Ya se puede pegar en el anuncio.";
      }catch(e){
        // Sin permiso de portapapeles: se selecciona para que la copien a mano.
        q("#utmLiga").select();
        q("#utmAviso").textContent = "Quedó seleccionada: cópiala con Ctrl+C.";
      }
    };
  };

  ["#utmBase","#utmS","#utmM","#utmC","#utmCt"].forEach(sel =>
    q(sel).addEventListener("input", pinta));
  cont.querySelectorAll("#utmDestino button").forEach(b => b.onclick = () => {
    destino = b.dataset.dest;
    cont.querySelectorAll("#utmDestino button").forEach(x =>
      x.setAttribute("aria-current", String(x === b)));
    pinta();
  });
  q("#utmCamp").onchange = e => { utmCampSel = e.target.value; renderUtms(); };
  pinta();
}


/* ==========================================================================
   LA LIGA PÚBLICA DE REGISTRO

   Quien vio un anuncio abre esta liga y deja sus datos. No tiene cuenta ni
   tiene por qué tenerla, así que esta pantalla no es el CRM: es un formulario
   con el membrete del hotel y nada más.

   Lo que deja cae en un buzón —prospectos.sql— del que el CRM lo recoge. El
   visitante no lee nada: ni la cartera, ni el buzón, ni siquiera lo que él
   mismo acaba de escribir.

   La campaña viaja en la propia dirección, en las etiquetas utm_. Por eso la
   liga se arma desde Atribución & UTMs y no se escribe a mano.
   ========================================================================== */

/** ¿La dirección trae una liga de registro? */
function enlaceDeAlta(){
  const m = String(location.hash || "").match(/[#&]alta=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  const p = new URLSearchParams(String(location.search || "").replace(/^\?/, ""));
  const h = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
  const dame = k => (p.get("utm_" + k) || h.get("utm_" + k) || "").trim();
  return {
    token: m[1],
    utm: { source:dame("source"), medium:dame("medium"), campaign:dame("campaign"),
           content:dame("content"), term:dame("term") }
  };
}

/** La clave de la liga. Se crea sola la primera vez que alguien la pide. */
function tokenAlta(){
  const h = state.ajustes.hotel;
  if (!h.tokenAlta){
    h.tokenAlta = nuevoToken();
    guardar();
  }
  return h.tokenAlta;
}

/** La dirección de esta misma aplicación, sin lo que traiga pegado. */
const ligaDeAltaBase = () =>
  location.origin + location.pathname + "#alta=" + tokenAlta();

/** La liga de registro ya con las etiquetas de una campaña. */
function ligaDeAlta(utm){
  const pares = Object.entries(utm || {})
    .filter(([, v]) => String(v || "").trim())
    .map(([k, v]) => `utm_${k}=${encodeURIComponent(String(v).trim())}`);
  return ligaDeAltaBase() + (pares.length ? "&" + pares.join("&") : "");
}

/**
 * Deja el registro en el buzón.
 *
 * Va con return=minimal a propósito: el visitante no tiene permiso de LEER la
 * tabla —ni lo suyo—, y si la petición pidiera de vuelta el renglón guardado,
 * el servidor la rechazaría entera aunque el registro estuviera bien.
 */
async function depositarAlta(token, datos){
  const r = await fetch(nube.url + "/rest/v1/crm_altas", {
    method: "POST",
    headers: { apikey: nube.anon, "Content-Type": "application/json",
               "Prefer": "return=minimal" },
    body: JSON.stringify(Object.assign({ token, aplicada: false }, datos))
  });
  if (!r.ok){
    const detalle = await r.text().catch(() => "");
    // La clave mala va PRIMERO: el aviso de que la regla lo rechazó nombra la
    // tabla, así que si se preguntara antes por la tabla, una clave inventada
    // se reportaría como "falta montar el buzón" y nadie entendería nada.
    if (/row-level security/i.test(detalle))
      throw new Error("Esta liga ya no está vigente. Pídele una nueva a quien te la mandó.");
    if (/schema cache|PGRST205|does not exist/i.test(detalle))
      throw new Error("La liga todavía no está lista del lado del hotel.");
    throw new Error(detalle || ("Error " + r.status));
  }
}

/**
 * La pantalla que ve quien abre la liga.
 *
 * Es la MISMA del modo tableta, a propósito: ya está probada en teléfono, ya
 * respeta el membrete del hotel y ya sabe reclamar en el idioma de quien la
 * llena. Lo único que cambia es a dónde va lo que se escribe —al buzón de la
 * nube en vez de a este equipo— y que aquí sí viaja de qué campaña vino.
 */
function pantallaAltaPublica(datos){
  document.documentElement.classList.add("modo-firma");
  document.documentElement.classList.remove("intro-activa");
  for (const el of [document.documentElement, document.body]){
    el.style.height = "auto"; el.style.overflow = "visible";
  }
  document.body.classList.add("con-kiosco");

  const caja = document.createElement("div");
  caja.id = "kiosco";
  document.body.appendChild(caja);
  pintarKiosco(caja, "", "");

  // El botón de la tableta guarda en este equipo; aquí tiene que ir al buzón.
  const err = caja.querySelector("#kErr");
  caja.querySelector("#kEnviar").onclick = () => mandarAlta(caja, err, datos);
  caja.querySelectorAll("input").forEach(el =>
    el.addEventListener("keydown", ev => {
      if (ev.key === "Enter" && el.id === "kTel"){
        ev.preventDefault(); mandarAlta(caja, err, datos);
      }
    }));
}

async function mandarAlta(caja, err, datos){
  const val = id => caja.querySelector("#" + id).value.trim();
  const marca = id => caja.querySelector("#" + id).classList.add("err");
  const faltan = [];

  // Las mismas reglas que la tableta: un registro sin manera de volver a
  // contactar a la persona no sirve de nada.
  if (!val("kNom")){ faltan.push("su nombre"); marca("kNom"); }
  if (!val("kApe")){ faltan.push("su apellido"); marca("kApe"); }
  const email = val("kMail").toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){
    faltan.push("un correo electrónico válido"); marca("kMail");
  }
  if (val("kTel").replace(/\D/g, "").length < 10){
    faltan.push("un teléfono de 10 dígitos"); marca("kTel");
  }
  if (faltan.length){
    err.innerHTML = `<div class="k-err"><b>Nos falta un dato:</b>
      <ul>${faltan.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    err.scrollIntoView({ block:"center", behavior:"smooth" });
    return;
  }

  const b = caja.querySelector("#kEnviar");
  b.disabled = true; b.textContent = "Enviando…"; err.innerHTML = "";
  try{
    await depositarAlta(datos.token, {
      nombre: val("kNom"), apellido: val("kApe"), email,
      telefono: val("kTel"), compania: val("kEmp"),
      interes: "", utm: datos.utm
    });
    caja.querySelector(".k-hoja").innerHTML = `
      <div class="k-marca">${membreteKiosco(state.ajustes.hotel)}</div>
      <div class="k-gracias"><div class="k-tick">✓</div>
        <h1 class="k-titulo">¡Gracias!</h1>
        <p class="k-sub">Ya tenemos sus datos. Alguien del hotel le contacta muy pronto.</p></div>`;
  }catch(ex){
    err.innerHTML = `<div class="k-err">${esc(ex.message)}</div>`;
    b.disabled = false; b.textContent = "Enviar mis datos";
  }
}

/**
 * Recoge del buzón lo que dejaron en la liga y lo vuelve prospecto.
 *
 * La campaña se resuelve por la etiqueta utm_campaign, que es la que el CRM
 * mismo generó. Si no la reconoce, el prospecto entra igual: más vale un lead
 * sin campaña que un lead perdido.
 */
async function recogerAltas(){
  const parte = { hubo:false, buzon:true, pendientes:0, aplicadas:0, notas:[] };
  if (!nubeActiva()){ parte.buzon = false; return parte; }

  let filas;
  try{
    filas = await api("/rest/v1/crm_altas?select=id,nombre,apellido,email,telefono,compania,interes,utm,creado&aplicada=is.false");
  }catch(e){
    if (/crm_altas|schema cache|does not exist|404|PGRST205/i.test(e.message)){
      nube.sinBuzonAltas = true;
      parte.buzon = false;
      parte.notas.push("El buzón de registros no existe todavía: falta correr prospectos.sql en Supabase.");
      return parte;
    }
    parte.notas.push("No se pudo leer el buzón de registros: " + e.message);
    return parte;
  }

  parte.pendientes = (filas || []).length;
  const aplicadas = [];
  for (const f of filas || []){
    const utm = f.utm || {};
    const etiqueta = String(utm.campaign || "").trim().toLowerCase();
    const c = etiqueta
      ? state.campanas.find(x => etiquetaUtm(x).toLowerCase() === etiqueta)
      : null;
    // El canal sale de la campaña si se reconoció; si no, de utm_source.
    const canal = c ? c.canal
      : (CANALES.find(x => x.utm === String(utm.source || "").toLowerCase()) || {}).id || "";

    state.prospectos.push(saneaProspecto({
      nombre: f.nombre, apellido: f.apellido, email: f.email, telefono: f.telefono,
      compania: f.compania,
      evento: String(f.interes || "").trim(),
      notas: "Se registró desde la liga del hotel.",
      capturadoPor: c ? c.responsable : "",
      fecha: String(f.creado || new Date().toISOString()).slice(0, 16),
      canal, campanaId: c ? c.id : "",
      utm: { source:utm.source, medium:utm.medium, campaign:utm.campaign,
             content:utm.content, term:utm.term },
      createdAt: new Date().toISOString()
    }));
    aplicadas.push(f.id);
    parte.aplicadas++;
    if (etiqueta && !c)
      parte.notas.push(`Llegó un registro de la campaña "${utm.campaign}", que este equipo no tiene dada de alta.`);
  }

  if (aplicadas.length){
    // Se marcan DESPUÉS de crearlos: si se cortara la luz entre una cosa y la
    // otra, más vale recoger dos veces al mismo que perderlo.
    try{
      await api(`/rest/v1/crm_altas?id=in.(${aplicadas.join(",")})`, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify({ aplicada: true })
      });
    }catch(e){
      parte.notas.push("Se recogieron los registros pero no se pudieron marcar: " + e.message);
    }
    parte.hubo = true;
    guardar();
  }
  return parte;
}

/** Mismo criterio que el del convenio, con su propia serie: CT-2026-001. */
function folioContrato(anio, excluirId){
  const a = String(anio || new Date().getFullYear()).slice(0, 4);
  const re = new RegExp("^CT-" + a + "-(\\d+)$", "i");
  const usados = new Set(state.contratos
    .filter(k => k.id !== excluirId)
    .map(k => String(k.folio || "").trim().toUpperCase()));
  let n = Math.max(0, ...state.contratos
    .filter(k => k.id !== excluirId)
    .map(k => Number((re.exec(String(k.folio || "").trim()) || [])[1]) || 0)) + 1;
  let f;
  do { f = `CT-${a}-${String(n++).padStart(3, "0")}`; } while (usados.has(f));
  return f;
}

            k.firmaCliente ? " · ✍️ Cliente" : ""}</td>
          <td class="nowrap"><button class="btn sm" data-doc="${k.id}">Ver documento</button></td>
        </tr>`;
      }).join("")}</tbody></table>`;

    cont.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", ev => {
      const d = ev.target.closest("[data-doc]");
      if (d){ ev.stopPropagation(); verContrato(d.dataset.doc); return; }
      editarContrato(tr.dataset.id);
    }));
  }
  cont.querySelector("#bNuevoCt").onclick = () => editarContrato(null);
  cont.querySelector("#bSubirExtCt").onclick = () => subirDocumentoExterno("cotizacion");
}

function editarContrato(id, clientePre, alCerrar){
  const existente = id ? state.contratos.find(k => k.id === id) : null;

  if (existente && existente.externo){ verContratoExterno(existente, alCerrar); return; }
  if (existente && existente.estado !== "borrador"){
    alert("Este documento ya está firmado y no se puede editar.\n\nSe abrirá en modo lectura.");
    verContrato(existente.id, alCerrar);
    return;
  }

  const k = existente || saneaContrato({
    clienteId: clientePre || "",
    folio: folioContrato(new Date().getFullYear()),
    fecha: hoyISO(),
    ejecutivo: miNombre(),
    moneda: state.ajustes.moneda || "MXN",
    hospedaje: [saneaLineaHosp({})],
    adicionales: [saneaLineaExtra({ concepto:"Estacionamiento por vehículo",
                                    costo:"$100 MN hasta 24 horas" })]
  });

  const filaHosp = l => `<tr>
    <td><input class="field h-desc" value="${esc(l.descripcion)}"
          placeholder="11 habitaciones King, 23 al 25 de octubre 2026" style="width:100%"></td>
    <td><input class="field h-noches num" inputmode="numeric" value="${l.noches || ""}"
          style="width:100%;text-align:right"></td>
    <td><input class="field h-precio num" inputmode="decimal" value="${l.precio || ""}"
          style="width:100%;text-align:right"></td>
    <td class="num h-sub">—</td>
    <td class="num h-tot">—</td>
    <td><button class="btn sm danger" data-quita>✕</button></td></tr>`;

  const filaEv = e => `<tr>
    <td><input class="field e-fecha" value="${esc(e.fecha)}" placeholder="23 oct" style="width:100%"></td>
    <td><input class="field e-hora" value="${esc(e.horario)}" placeholder="08:00-19:00" style="width:100%"></td>
    <td><input class="field e-evento" value="${esc(e.evento)}" placeholder="Conferencia" style="width:100%"></td>
    <td><input class="field e-pax num" inputmode="numeric" value="${esc(e.pax)}" style="width:100%;text-align:right"></td>
    <td><input class="field e-montaje" value="${esc(e.montaje)}" placeholder="Auditorio" style="width:100%"></td>
    <td><input class="field e-salon" value="${esc(e.salon)}" placeholder="Disponible" style="width:100%"></td>
    <td><input class="field e-renta" value="${esc(e.renta)}" placeholder="Cortesía en base a consumo" style="width:100%"></td>
    <td><button class="btn sm danger" data-quita>✕</button></td></tr>`;

  const filaEx = x => `<tr>
    <td><input class="field x-concepto" value="${esc(x.concepto)}" style="width:100%"></td>
    <td><input class="field x-costo" value="${esc(x.costo)}" style="width:100%"></td>
    <td><button class="btn sm danger" data-quita>✕</button></td></tr>`;

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${existente ? "Editar" : "Nuevo"} contrato</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div id="ctErr"></div>
        <div class="grid">
          <div class="full"><label class="lbl">Cliente</label>
            <select class="field" id="ctCli">
              <option value="">— Selecciona un cliente —</option>
              ${[...state.clientes].sort((a,b)=>a.empresa.localeCompare(b.empresa,"es")).map(x =>
                `<option value="${x.id}"${x.id===k.clienteId?" selected":""}>${esc(x.empresa)}${
                  x.contacto?" · "+esc(x.contacto):""}</option>`).join("")}
            </select></div>
          <div class="full"><label class="lbl">Ejecutivo de ventas</label>
            ${selectEjecutivo(k.ejecutivo || (cliente(k.clienteId)||{}).ejecutivo || miNombre(), "ctEje")}</div>
          <div><label class="lbl">Tipo de documento</label>
            <select class="field" id="ctTipo">${TIPOS_CONTRATO.map(t =>
              `<option value="${t.id}"${t.id===k.tipo?" selected":""}>${esc(t.name)}</option>`).join("")}</select>
            <div class="hint" id="ctTipoAyuda">${esc(infoTipoCt(k.tipo).ayuda)}</div></div>
          <div><label class="lbl">Título <span class="hint">(opcional)</span></label>
            <input class="field" id="ctTitulo" value="${esc(k.titulo)}" placeholder="Tecate Península"></div>
          <div><label class="lbl">Folio</label>
            <input class="field" id="ctFolio" value="${esc(k.folio)}"></div>
          <div><label class="lbl">Fecha del documento</label>
            <input class="field" type="date" id="ctFecha" value="${esc(k.fecha)}"></div>
          <div><label class="lbl">Vigencia hasta</label>
            <input class="field" type="date" id="ctVig" value="${esc(k.vigencia)}"></div>
          <div><label class="lbl">Moneda</label>
            <input class="field" id="ctMoneda" value="${esc(k.moneda)}" style="text-transform:uppercase"></div>
          <div><label class="lbl">Tipo de cambio <span class="hint">(opcional)</span></label>
            <input class="field" id="ctTC" value="${esc(k.tipoCambio)}" placeholder="$18.50"></div>
          <div><label class="lbl">Impuestos (%)</label>
            <input class="field" id="ctImp" inputmode="decimal" value="${esc(String(k.impuestos))}">
            <div class="hint">8% de IVA más 5% sobre hospedaje.</div></div>
        </div>

        <h3 class="sec">Hospedaje</h3>
        <div class="note">Una línea por tipo de habitación. El subtotal y el total con
          impuestos se calculan solos.</div>
        <div style="overflow:auto"><table class="data" id="tHosp">
          <thead><tr><th>Servicio</th><th class="num" style="width:90px">Noches</th>
            <th class="num" style="width:120px">P. unitario</th>
            <th class="num" style="width:120px">Subtotal</th>
            <th class="num" style="width:130px">Total c/imp.</th><th style="width:44px"></th></tr></thead>
          <tbody>${(k.hospedaje.length ? k.hospedaje : [saneaLineaHosp({})]).map(filaHosp).join("")}</tbody>
          <tfoot><tr><td><b>Total</b></td><td class="num" id="ctNoches"><b>0</b></td><td></td>
            <td class="num" id="ctSub"><b>—</b></td><td class="num" id="ctTot"><b>—</b></td><td></td></tr></tfoot>
        </table></div>
        <p style="margin:8px 0 0"><button class="btn" id="bAddHosp">+ Agregar línea</button></p>

        <h3 class="sec">Salones y eventos <span class="hint">(opcional)</span></h3>
        <div style="overflow:auto"><table class="data" id="tEv">
          <thead><tr><th>Fecha</th><th>Horario</th><th>Evento</th><th class="num">Pax</th>
            <th>Montaje</th><th>Salón</th><th>Renta</th><th style="width:44px"></th></tr></thead>
          <tbody>${k.eventos.map(filaEv).join("")}</tbody></table></div>
        <p style="margin:8px 0 0"><button class="btn" id="bAddEv">+ Agregar evento</button></p>

        <h3 class="sec">Costos adicionales no incluidos</h3>
        <div style="overflow:auto"><table class="data" id="tEx">
          <thead><tr><th>Concepto</th><th style="width:260px">Costo</th><th style="width:44px"></th></tr></thead>
          <tbody>${k.adicionales.map(filaEx).join("")}</tbody></table></div>
        <p style="margin:8px 0 0"><button class="btn" id="bAddEx">+ Agregar costo</button></p>

        <h3 class="sec">Observaciones</h3>
        <p class="hint" style="margin-top:0">Éstas sí se imprimen en el documento.</p>
        <textarea class="field" id="ctNotas" style="width:100%;min-height:70px">${esc(k.notas)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDelCt">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="bOkCt">Guardar borrador</button>
        <button class="btn ok" id="bFirmarCt">Guardar y firmar</button>
      </div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  const impuestos = () => Number(q("#ctImp").value) || 0;

  function recalcular(){
    const factor = 1 + impuestos() / 100;
    let noches = 0, sub = 0;
    const mon = q("#ctMoneda").value.trim().toUpperCase() || "MXN";
    ov.querySelectorAll("#tHosp tbody tr").forEach(tr => {
      const n = Number(tr.querySelector(".h-noches").value) || 0;
      const pr = parseMoney(tr.querySelector(".h-precio").value);
      const st = n * pr;
      noches += n; sub += st;
      tr.querySelector(".h-sub").textContent = st ? money(st, mon) : "—";
      tr.querySelector(".h-tot").textContent = st ? money(st * factor, mon) : "—";
    });
    q("#ctNoches").innerHTML = `<b>${noches}</b>`;
    q("#ctSub").innerHTML = `<b>${sub ? esc(money(sub, mon)) : "—"}</b>`;
    q("#ctTot").innerHTML = `<b>${sub ? esc(money(sub * factor, mon)) : "—"}</b>`;
  }

  ov.addEventListener("input", e => {
    if (e.target.closest("#tHosp") || e.target.id === "ctImp" || e.target.id === "ctMoneda")
      recalcular();
  });
  ov.addEventListener("click", e => {
    const b = e.target.closest("[data-quita]");
    if (!b) return;
    const tr = b.closest("tr"), cuerpo = tr.parentElement;
    tr.remove();
    if (cuerpo.closest("#tHosp") && !cuerpo.children.length)
      cuerpo.insertAdjacentHTML("beforeend", filaHosp(saneaLineaHosp({})));
    recalcular();
  });
  recalcular();

  q("#ctTipo").onchange = e => {
    q("#ctTipoAyuda").textContent = infoTipoCt(e.target.value).ayuda;
  };
  q("#bAddHosp").onclick = () => {
    ov.querySelector("#tHosp tbody").insertAdjacentHTML("beforeend", filaHosp(saneaLineaHosp({})));
    recalcular();
  };
  q("#bAddEv").onclick = () =>
    ov.querySelector("#tEv tbody").insertAdjacentHTML("beforeend", filaEv(saneaLineaEvento({})));
  q("#bAddEx").onclick = () =>
    ov.querySelector("#tEx tbody").insertAdjacentHTML("beforeend", filaEx(saneaLineaExtra({})));

  // El folio sigue al año de la fecha mientras nadie lo escriba a mano.
  {
    const fF = q("#ctFolio"), fD = q("#ctFecha");
    let auto = existente ? null : fF.value;
    fF.addEventListener("input", () => { if (fF.value !== auto) auto = null; });
    fD.addEventListener("change", () => {
      if (auto === null || fF.value !== auto) return;
      const a = String(fD.value || "").slice(0, 4);
      if (a.length === 4) fF.value = auto = folioContrato(a, k.id);
    });
  }

  const bd = q("#bDelCt");
  if (bd) bd.onclick = () => {
    if (!confirm("¿Eliminar este documento? Esta acción no se puede deshacer.")) return;
    state.contratos = state.contratos.filter(x => x.id !== k.id);
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  q("#bOkCt").onclick = () => { if (recoger()){ ov.remove(); if (alCerrar) alCerrar(); } };
  q("#bFirmarCt").onclick = () => {
    if (!recoger()) return;
    ov.remove();
    verContrato(k.id, alCerrar, true);
  };

  function pintaErrores(lista){
    q("#ctErr").innerHTML = lista.length
      ? `<div class="errbox"><b>Falta esto para poder continuar:</b><ul>${
          lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      : "";
  }

  function recoger(){
    const cid = q("#ctCli").value;
    const hosp = [...ov.querySelectorAll("#tHosp tbody tr")].map(tr => saneaLineaHosp({
      descripcion: tr.querySelector(".h-desc").value.trim(),
      noches: tr.querySelector(".h-noches").value,
      precio: parseMoney(tr.querySelector(".h-precio").value)
    })).filter(l => l.descripcion || l.noches || l.precio);

    const problemas = [];
    if (!cid) problemas.push("Selecciona el cliente.");
    if (!hosp.length) problemas.push("Captura al menos una línea de hospedaje.");
    hosp.forEach((l, i) => {
      if (!l.descripcion) problemas.push(`A la línea ${i+1} de hospedaje le falta la descripción.`);
      if (!l.noches)      problemas.push(`A la línea ${i+1} de hospedaje le faltan las noches.`);
      if (!l.precio)      problemas.push(`A la línea ${i+1} de hospedaje le falta el precio.`);
    });
    const desde = q("#ctFecha").value, hasta = q("#ctVig").value;
    if (desde && hasta && hasta < desde)
      problemas.push("La vigencia no puede ser anterior a la fecha del documento.");

    pintaErrores(problemas);
    if (problemas.length){
      q("#ctErr").scrollIntoView({ block:"center", behavior:"smooth" });
      return false;
    }

    // El folio se decide al guardar, no al abrir: entre una cosa y otra pudo
    // haberlo tomado otro equipo.
    let folio = q("#ctFolio").value.trim();
    if (folioCtAutomatico(folio) && state.contratos.some(x =>
        x.id !== k.id && String(x.folio || "").trim().toUpperCase() === folio.toUpperCase()))
      folio = folioContrato(String(desde || folio.slice(3, 7)).slice(0, 4), k.id);

    Object.assign(k, {
      clienteId: cid,
      ejecutivo: q('[name="ctEje"]').value.trim(),
      tipo: q("#ctTipo").value,
      titulo: q("#ctTitulo").value.trim(),
      folio,
      fecha: desde || hoyISO(),
      vigencia: hasta,
      moneda: q("#ctMoneda").value.trim().toUpperCase() || "MXN",
      tipoCambio: q("#ctTC").value.trim(),
      impuestos: impuestos(),
      hospedaje: hosp,
      eventos: [...ov.querySelectorAll("#tEv tbody tr")].map(tr => saneaLineaEvento({
        fecha: tr.querySelector(".e-fecha").value, horario: tr.querySelector(".e-hora").value,
        evento: tr.querySelector(".e-evento").value, pax: tr.querySelector(".e-pax").value,
        montaje: tr.querySelector(".e-montaje").value, salon: tr.querySelector(".e-salon").value,
        renta: tr.querySelector(".e-renta").value
      })).filter(e => e.fecha || e.evento || e.salon),
      adicionales: [...ov.querySelectorAll("#tEx tbody tr")].map(tr => saneaLineaExtra({
        concepto: tr.querySelector(".x-concepto").value, costo: tr.querySelector(".x-costo").value
      })).filter(x => x.concepto || x.costo),
      notas: q("#ctNotas").value.trim(),
      updatedAt: new Date().toISOString()
    });
    if (!existente){ k.createdAt = new Date().toISOString(); state.contratos.push(k); }
    guardar(); render();
    return true;
  }
}

const nombrePdfContrato = (k, c) =>
  infoTipoCt(k.tipo).name + "-" +
  nombreArchivo([k.folio, c && c.empresa].filter(Boolean).join(" ")) + ".pdf";

function verContrato(id, alCerrar, pedirFirma){
  const k = state.contratos.find(x => x.id === id);
  if (!k) return;
  if (k.externo){ verContratoExterno(k, alCerrar); return; }
  const c = cliente(k.clienteId);
  const h = state.ajustes.hotel;
  const ec = ESTADOS_CT[k.estado];
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>${esc(infoTipoCt(k.tipo).name)} ${esc(k.folio || "")}</h2>
        <span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span>
        <button class="btn" data-close>✕</button>
      </div>
      <div class="doc-body">
        ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
        <div class="doc-contenido">${cuerpoContrato(k, c)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrintCt">Imprimir</button>
        <button class="btn" id="bPdfCt">Descargar PDF</button>
        ${k.estado === "borrador" ? `<button class="btn" id="bEditCt">Editar</button>` : ""}
        <div class="spacer"></div>
        ${!k.firmaHotel ? `<button class="btn ok" id="bCtF1">Firmar como ejecutivo</button>` : ""}
        ${k.firmaHotel && !k.firmaCliente
          ? `<button class="btn primary" id="bCtEnviar">Enviar al cliente</button>
             <button class="btn ok" id="bCtF2">Registrar firma del cliente</button>` : ""}
        ${k.firmaCliente ? `<span class="hint">Aceptado por el cliente.</span>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrintCt").onclick = () => {
    fijarPagina(false);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);
  };

  const bp = ov.querySelector("#bPdfCt");
  bp.onclick = async () => {
    const antes = bp.textContent;
    bp.disabled = true; bp.textContent = "Generando…";
    try{
      const bytes = await pdfDeDocumento(cuerpoContrato(k, c));
      descargarBlob(new Blob([bytes], { type:"application/pdf" }), nombrePdfContrato(k, c));
    }catch(err){
      alert("No se pudo generar el PDF aquí: " + err.message +
            "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }finally{ bp.disabled = false; bp.textContent = antes; }
  };

  const be = ov.querySelector("#bEditCt");
  if (be) be.onclick = () => { ov.remove(); editarContrato(k.id, null, alCerrar); };

  const f1 = ov.querySelector("#bCtF1");
  if (f1) f1.onclick = () => padFirma("Firma del ejecutivo de ventas",
    { nombre: ejecutivoDeCt(k) || miNombre(), puesto:"Ejecutivo de ventas", celular:"" },
    d => { firmarContrato(k, "hotel", d); ov.remove(); verContrato(k.id, alCerrar); },
    { recordar:true });

  const f2 = ov.querySelector("#bCtF2");
  if (f2) f2.onclick = () => padFirma("Firma de aceptación del cliente",
    { nombre:(c && c.contacto) || "", puesto:"", celular:(c && c.telefono) || "" },
    d => { firmarContrato(k, "cliente", d); ov.remove(); verContrato(k.id, alCerrar); });

  const en = ov.querySelector("#bCtEnviar");
  if (en) en.onclick = () => enviarContrato(k, c);

  if (pedirFirma && !k.firmaHotel && f1) setTimeout(() => f1.click(), 60);
}

/** Aplica la firma y deja constancia en la bitácora del cliente. */
function firmarContrato(k, quien, d){
  const fecha = new Date().toISOString();
  const firma = saneaFirma(Object.assign({}, d, { fecha }));
  const c = cliente(k.clienteId);
  const doc = infoTipoCt(k.tipo).name;

  if (quien === "hotel"){
    k.firmaHotel = firma;
    if (k.estado === "borrador") k.estado = "firmado_hotel";
    // El destinatario se congela: el documento tiene que poder leerse igual
    // dentro de un año, aunque la ficha del cliente haya cambiado.
    if (c) k.destinatario = { empresa:c.empresa, contacto:c.contacto, ubicacion:c.ubicacion,
                              telefono:c.telefono, email:c.email };
    registrarAuto(k.clienteId, `${doc} ${k.folio} firmada por el ejecutivo`,
      k.titulo || "", ejecutivoDeCt(k));
  } else {
    k.firmaCliente = firma;
    k.estado = "aceptado";
    registrarAuto(k.clienteId, `${doc} ${k.folio} aceptada por el cliente`,
      `Firmó ${d.nombre}.`, ejecutivoDeCt(k));
  }
  k.updatedAt = new Date().toISOString();
  guardar(); render();
}

/** El PDF adjunto donde el aparato lo permita, y si no, el mensaje y el archivo aparte. */
function enviarContrato(k, c){
  const h = state.ajustes.hotel;
  const doc = infoTipoCt(k.tipo).name;
  const asunto = `${doc} ${k.folio} · ${h.nombre}`;
  const archivo = nombrePdfContrato(k, c);
  const firmante = (k.firmaHotel && k.firmaHotel.nombre) || ejecutivoDeCt(k);

  const mensaje = `Estimado(a) ${(c && c.contacto) || ""}:\n\n` +
    `Adjunto la ${doc.toLowerCase()} ${k.folio} de ${h.nombre}` +
    (k.titulo ? ` para ${k.titulo}` : "") + `.` +
    (k.vigencia ? ` Tiene vigencia hasta el ${fechaTexto(k.vigencia)}.` : "") +
    `\n\nQuedo al pendiente de sus comentarios.\n\nSaludos cordiales,\n${firmante}\n${h.nombre}`;

  const ov = modal(`
    <div class="modal">
      <div class="modal-head"><h2>Enviar ${esc(doc.toLowerCase())} al cliente</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body" id="cuerpoEnvioK"><p class="hint">Preparando el documento…</p></div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cerrar</button></div>
    </div>`);

  const anotar = via => {
    k.enviado = { fecha:new Date().toISOString(), via, quien: correoSesion() };
    k.updatedAt = new Date().toISOString();
    registrarAuto(k.clienteId, `${doc} ${k.folio} enviada por ${VIAS[via]}`,
      `Enviada a ${via === "correo" ? (c && c.email) : (c && c.telefono)}.`, ejecutivoDeCt(k));
    guardar(); render();
  };

  pdfDeDocumento(cuerpoContrato(k, c)).then(bytes => {
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" &&
                           navigator.canShare({ files:[file] });

    ov.querySelector("#cuerpoEnvioK").innerHTML =
      (puedeCompartir
        ? `<div class="note">Con <b>Compartir</b> se va el PDF y el mensaje juntos, por donde
             usted escoja. Es lo más cómodo desde el teléfono.</div>

    }catch(err){
      alert("No se pudo generar el PDF aquí: " + err.message + "\n\nUsa Imprimir y elige \"Guardar como PDF\".");

/** Aplica la firma y empuja al cliente por el embudo. */
function firmar(v, quien, d){
  const fecha = new Date().toISOString();
  const c = cliente(v.clienteId);
  const f = { nombre:d.nombre, puesto:d.puesto, celular:d.celular, fecha, img:d.img };

  if (quien === "hotel"){
    v.firmaHotel = f;
    v.estado = "firmado_ejecutiva";
    v.tokenFirma = v.tokenFirma || nuevoToken();   // habilita el enlace del cliente
    if (c) v.destinatario = { empresa:c.empresa, contacto:c.contacto,
      ubicacion:c.ubicacion, telefono:c.telefono, email:c.email };
    if (c && !est(c.estatus).lost){ c.estatus = "cotizacion_enviada"; c.updatedAt = fecha; }
    registrarAuto(v.clienteId, `Convenio ${v.folio} firmado por el ejecutivo`,
      `Firmado por ${d.nombre}. Listo para enviarse al cliente.\nEl cliente pasó a "Cotización enviada".`, d.nombre);
  } else {
    if (!v.firmaHotel){ alert("Primero debe firmar el ejecutivo de ventas."); return; }
    cerrarConvenio(v, f, `Firmado por ${d.nombre}, capturado por el ejecutivo.`, ejecutivoDe(v));
    v.avisado = true;          // lo capturó el propio ejecutivo: no hay nada que avisarle
    guardar(); render();
    return;
  }
  v.updatedAt = fecha;
  guardar(); render();
}

/**
 * El cliente lo firmó en papel y alguien lo escaneó.
 *
 * El archivo se guarda dentro del convenio, y el convenio viaja completo a
 * cada equipo en cada sincronización: por eso el límite de tamaño es bajo y se
 * dice en voz alta. Un escaneado de 8 MB haría lenta la aplicación para todos,
 * todo el día, por un documento que se consulta una vez al año.
 */
function subirConvenioFirmado(v, alTerminar){
  const c = cliente(v.clienteId);
  const ov = modal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-head"><h2>Subir convenio firmado</h2><button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <p class="hint" style="margin-top:0">Para cuando el cliente lo firmó en papel. Al subirlo,
          el convenio queda <b>Firmado por cliente</b> y <b>${esc((c && c.empresa) || "el cliente")}</b>
          pasa a <b>Ganado</b>, igual que si lo hubiera firmado en pantalla.</p>
        <div class="grid">
          <div class="full"><label class="lbl">El PDF escaneado</label>
            <input type="file" class="field" id="fPdfFirmado" accept="application/pdf,image/*">
            <div class="hint">PDF o foto, <b>máximo 2 MB</b>. El archivo viaja a todos los
              equipos en cada sincronización, así que uno pesado los hace lentos a todos.
              Si tu escáner lo saca muy grande, sube una foto del documento.</div></div>
          <div class="full"><label class="lbl">¿Quién lo recibió?</label>
            <input class="field" id="fQuienRecibe" value="${esc(miNombre() || ejecutivoDe(v))}"></div>
        </div>
        <div id="errPdf" style="margin-top:10px"></div>
      </div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn primary" id="bOkPdf">Subir y cerrar el convenio</button></div>
    </div>`);

  ov.querySelector("#bOkPdf").onclick = () => {
    const f = ov.querySelector("#fPdfFirmado").files[0];
    const err = ov.querySelector("#errPdf");
    const b = ov.querySelector("#bOkPdf");
    if (!f){ err.innerHTML = `<div class="errbox">Elige el archivo escaneado.</div>`; return; }
    const MAX = hayDeposito() ? MAX_ARCHIVO_NUBE : MAX_ARCHIVO;
    if (f.size > MAX){
      err.innerHTML = `<div class="errbox">Pesa ${Math.round(f.size/1024/1024*10)/10} MB y el límite
        son ${Math.round(MAX/1024/1024)} MB. Vuelve a escanearlo en blanco y negro o a menor
        resolución, o toma una foto.</div>`;
      return;
    }
    b.disabled = true; b.textContent = "Subiendo…";
    const suelta = () => { b.disabled = false; b.textContent = "Subir y cerrar el convenio"; };

    const cerrar = manual => {
      v.firmaManual = manual;
      // Sin firma trazada: la constancia es el archivo.
      cerrarConvenio(v, null, `Firmado en papel. Se subió el archivo "${f.name}".`,
        v.firmaManual.quien);
      v.avisado = true;        // lo subió el propio equipo: no hay novedad que avisar
      guardar(); render();
      ov.remove();
      if (alTerminar) alTerminar();
    };
    const quien = () => ov.querySelector("#fQuienRecibe").value.trim();

    const incrustar = () => {
      if (pesoGuardado() + f.size * 1.4 > TOPE_TOTAL){
        suelta();
        err.innerHTML = `<div class="errbox"><b>Ya casi no cabe en este navegador.</b>
          Avísale a sistemas para que monte el almacén del proyecto
          (<code>archivos.sql</code>).</div>`;
        return;
      }
      const r = new FileReader();
      r.onload = () => cerrar(saneaManual({ fecha:new Date().toISOString(), quien: quien(),
        archivo: f.name, pdf: String(r.result), tam: f.size, tipoMime: f.type }));
      r.onerror = () => { suelta();
        err.innerHTML = `<div class="errbox">No se pudo leer el archivo.</div>`; };
      r.readAsDataURL(f);
    };

    if (hayDeposito()){
      subirEscaneo(f)
        .then(ruta => cerrar(saneaManual({ fecha:new Date().toISOString(), quien: quien(),
          archivo: f.name, ruta, tam: f.size, tipoMime: f.type })))
        .catch(e => {
          if (nube.sinDeposito) return incrustar();
          suelta();
          err.innerHTML = `<div class="errbox">No se pudo subir el archivo al almacén.<br>
            <span class="hint">${esc(e.message)}</span></div>`;
        });
    } else incrustar();
  };
}
