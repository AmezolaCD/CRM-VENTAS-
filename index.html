/**
 * El renglón, como lo ve EL CLIENTE.
 *
 * Si la línea trae desglose, debajo del nombre del paquete van sus conceptos
 * como viñetas —y ni una sola cifra—. Los costos de cada cosa son control
 * interno: viven en la captura y en el reporte de ingresos, nunca en el papel
 * que se le manda al cliente. Lo que él ve del dinero es lo de siempre: su
 * cantidad, su precio por persona y su total.
 */
const conceptosDeLinea = l => {
  const nombre = esc(l.servicio || "—");
  if (!(l.partes && l.partes.length)) return nombre;
  return `${nombre}<ul class="inc-paq">${
    l.partes.map(d => `<li>${esc(d.concepto)}</li>`).join("")}</ul>`;
};

/* ----- Las dos listas: cotizaciones y contratos ----- */

function renderEventos(){ pintarListaEv("cotizacion", "tblEventos"); }
function renderContratosBq(){ pintarListaEv("contrato", "tblContratosBq"); }

function pintarListaEv(tipo, idCaja){
  const cont = document.getElementById(idCaja);
  const es = eventosVisibles(tipo);
  const conEje = puedeVerTodo();
  const esCot = tipo === "cotizacion";

  const cab = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <b style="font-size:15px">${esCot ? "Cotizaciones de evento" : "Contratos de banquetes"}</b>
      <span class="hint">${es.length} en total</span>
      <span style="flex:1"></span>
      <button class="btn" data-subirev="${tipo}">Subir uno firmado</button>
      <button class="btn primary" data-nuevoev="${tipo}">+ ${esCot ? "Nueva cotización" : "Nuevo contrato"}</button></div>
    <div class="note">${esCot
      ? "Cotiza un evento: el salón, las horas, los invitados y lo que se sirve. " +
        "Cuando el cliente confirma, se pasa a contrato desde la propia cotización."
      : "El contrato de prestación de servicios, con su anticipo y sus penas por " +
        "cancelación. Sale de una cotización aceptada."}</div>`;

  if (!es.length){
    cont.innerHTML = cab + `<div class="vacio">Todavía no hay ${esCot ? "cotizaciones" : "contratos"}.</div>`;
  } else {
    cont.innerHTML = cab + `<table class="data">
      <thead><tr><th>Folio</th><th>Evento</th><th>Cliente</th>${conEje ? "<th>Ejecutivo</th>" : ""}
        <th>Fecha del evento</th><th class="num">Pax</th><th class="num">Total</th>
        <th>Estado</th><th>Enviado</th><th></th></tr></thead>
      <tbody>${es.map(e => {
        const ec = ESTADOS_EV[e.estado], cu = cuentasEvento(e);
        const pax = e.bloques.reduce((a,b) => Math.max(a, Number(b.pax) || 0), 0);
        const fe = fechaEvento(e);
        return `<tr class="row-link" data-id="${e.id}">
          <td><b>${esc(e.folio || "—")}</b>${e.externo
            ? ` <span class="pill" title="Se subió escaneado">externo</span>` : ""}</td>
          <td>${esc(e.titulo || "—")}</td>
          <td>${esc(nombreCli(e.clienteId))}</td>
          ${conEje ? `<td class="nowrap">${esc(ejecutivoDeEv(e) || "—")}</td>` : ""}
          <td class="nowrap">${fe ? esc(fechaCorta(fe)) : "—"}</td>
          <td class="num">${pax || "—"}</td>
          <td class="num nowrap"><b>${esc(moneyMN(cu.total))}</b></td>
          <td><span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span></td>
          <td class="nowrap">${selloEnvio(e)}</td>
          <td class="nowrap"><button class="btn sm" data-doc="${e.id}">Ver documento</button></td>
        </tr>`;
      }).join("")}</tbody></table>`;

    cont.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", ev => {
      const d = ev.target.closest("[data-doc]");
      if (d){ ev.stopPropagation(); verEvento(d.dataset.doc); return; }
      editarEvento(tr.dataset.id);
    }));
  }
  cont.querySelector("[data-nuevoev]").onclick = () => editarEvento(null, tipo);
  cont.querySelector("[data-subirev]").onclick = () => subirEventoExterno(tipo);
}

/* ----- El editor ----- */

function editarEvento(id, tipoPre, alCerrar){
  const existente = id ? state.eventos.find(x => x.id === id) : null;

  if (existente && existente.externo){ verEventoExterno(existente, alCerrar); return; }
  if (existente && existente.estado !== "borrador"){
    alert("Este documento ya salió y no se puede editar.\n\nSe abrirá en modo lectura.");
    verEvento(existente.id, alCerrar);
    return;
  }

  const tipo = existente ? existente.tipo : (tipoPre || "cotizacion");
  const e = existente || saneaEvento({
    tipo, fecha: hoyISO(), ejecutivo: miNombre(),
    folio: "",                 // igual que los convenios: al firmar
    bloques: [saneaBloqueEv({})],
    lineas: [saneaLineaEv({})]
  });

  const filaB = b => `<tr>
    <td><input class="field b-fecha" type="date" value="${esc(b.fecha)}" style="width:100%"></td>
    <td><input class="field b-hora" value="${esc(b.horario)}" placeholder="20:00-02:00" style="width:100%"></td>
    <td><input class="field b-evento" value="${esc(b.evento)}" placeholder="Boda" style="width:100%"></td>
    <td><input class="field b-pax num" inputmode="numeric" value="${esc(b.pax)}" style="width:100%;text-align:right"></td>
    <td><input class="field b-montaje" value="${esc(b.montaje)}" list="listaMontajes" style="width:100%"></td>
    <td><input class="field b-salon" value="${esc(b.salon)}" placeholder="Ónix" style="width:100%"></td>
    <td><input class="field b-renta" value="${esc(b.renta)}" placeholder="En cortesía por consumo" style="width:100%"></td>
    <td><button class="btn sm danger" data-quita>✕</button></td></tr>`;

  /* El catálogo manda la lista, pero NO manda el renglón.
   *
   * La celda tiene las dos cosas: la lista para escoger y un campo de texto
   * que es el que de verdad guarda el valor. Así un documento viejo —y los
   * hay, la propuesta era texto libre— sigue abriendo con lo suyo aunque ese
   * servicio no esté en el catálogo, y una boda que pidió algo especial se
   * puede cotizar con «Otro servicio…» sin ir a Ajustes a media captura.
   * De paso, el renglón se sigue leyendo de `.l-servicio` igual que siempre. */
  const OTRO_SRV = "::otro::";
  const catalogoVivo = () => state.serviciosBq.filter(x => x.nombre);

  /** Los que coinciden con lo tecleado, por nombre o por familia. */
  const srvQueCoinciden = q => {
    const b = mismoNombre(q);
    if (!b) return catalogoVivo();
    return catalogoVivo().filter(x =>
      mismoNombre(x.nombre).includes(b) || mismoNombre(x.familia).includes(b));
  };

  /**
   * Las opciones de la lista, agrupadas por familia.
   *
   * `cat` es lo que se va a enseñar —todo, o nada más lo que coincidió con la
   * búsqueda—. Se vuelve a armar la lista en vez de esconder opciones con CSS,
   * por lo mismo que el buscador de clientes: esconder un `<option>` no
   * funciona igual en todos los navegadores, y aquí también se trabaja desde
   * el celular.
   */
  const opcionesSrv = (sel, cat) => {
    cat = cat || catalogoVivo();
    const conocido = catalogoVivo().some(x => x.nombre === sel);
    const una = x => `<option value="${esc(x.nombre)}"${
      x.nombre === sel ? " selected" : ""}>${esc(x.nombre)}</option>`;
    /* Por familias, en el orden en que aparecen en el catálogo. Las que no
       tienen se van al final, sueltas: con 180 servicios de dos listas
       distintas, una sola tira corrida no se puede usar. */
    const familias = [];
    for (const x of cat) if (x.familia && !familias.includes(x.familia)) familias.push(x.familia);
    const sueltos = cat.filter(x => !x.familia);
    return `<option value=""${!sel ? " selected" : ""}>— Escoge —</option>` +
      familias.map(f => `<optgroup label="${esc(f)}">${
        cat.filter(x => x.familia === f).map(una).join("")}</optgroup>`).join("") +
      sueltos.map(una).join("") +
      `<option value="${OTRO_SRV}"${sel && !conocido ? " selected" : ""}>Otro servicio…</option>`;
  };

  /* El buscador sólo aparece cuando de verdad hace falta. Con ocho servicios
     capturados estorba; con 180 —que es lo que hay entre el kit del hotel, la
     lista del proveedor y los paquetes— bajar la lista a mano no se puede. */
  const CON_BUSCADOR = 15;

  /* Con el catálogo vacío no se enseña una lista de un solo renglón: se deja
     el campo de siempre, para que nada se sienta peor que antes mientras
     alguien lo captura. */
  /**
   * ¿Este renglón es un paquete?
   *
   * Lo es si trae desglose, y también si el servicio que escogió está
   * palomeado como paquete en el catálogo: diez de los paquetes del libro de
   * Marco todavía no traen desglose y no por eso dejan de ser paquetes.
   */
  const esLineaPaquete = l => {
    if (l.partes && l.partes.length) return true;
    const x = servicioBqPorNombre(l.servicio);
    return !!(x && x.esPaquete);
  };

  const celdaServicio = l => {
    const cat = catalogoVivo();
    if (!cat.length)
      return `<input class="field l-servicio" value="${esc(l.servicio)}"
                placeholder="Cena emplatada" style="width:100%">`;
    return `<span class="et-paq"${esLineaPaquete(l) ? "" : " hidden"}>Paquete</span>
      ${cat.length >= CON_BUSCADOR
        ? `<input class="field busca-srv" type="search" placeholder="Buscar…"
             autocomplete="off" style="width:100%;margin-bottom:4px">` : ""}
      <select class="field l-srvSel" title="${esc(l.servicio)}" style="width:100%"
        >${opcionesSrv(l.servicio)}</select>
      <input class="field l-servicio" value="${esc(l.servicio)}" placeholder="Escríbelo"
        style="width:100%;margin-top:4px${
          cat.some(x => x.nombre === l.servicio) || !l.servicio ? ";display:none" : ""}">
      <div class="hint srv-cuenta" style="margin-top:2px"></div>`;
  };

  const filaL = l => `<tr class="${esLineaPaquete(l) ? "l-paq" : ""}" data-srv-antes="${esc(
      state.serviciosBq.some(x => x.nombre === l.servicio) ? l.servicio : "")}">
    <td><input class="field l-fecha" type="date" value="${esc(l.fecha)}" style="width:100%"></td>
    <td>${celdaServicio(l)}</td>
    <td><input class="field l-cant num" inputmode="numeric" value="${l.cantidad || ""}" style="width:100%;text-align:right"></td>
    <td><input class="field l-precio num" inputmode="decimal" value="${l.precio || ""}" style="width:100%;text-align:right"></td>
    <td class="selcell"><input type="checkbox" class="l-serv"${l.conServicio ? " checked" : ""}
          title="¿Lleva cargo por servicio? Sólo alimentos y bebidas."></td>
    <td class="num l-sub">—</td>
    <td class="num l-tot">—</td>
    <td><button class="btn sm danger" data-quita>✕</button></td></tr>
    <tr class="l-desglose"><td colspan="8" style="padding:0">${cajaDesglose(l)}</td></tr>`;

  /* --------------------------------------------------------------------
     Lo que incluye el paquete.

     Se lee como la lista de sus servicios —que es lo que un paquete es— y las
     cifras van a la derecha: son CONTROL INTERNO, de aquí sale el precio por
     persona, y en la cotización del cliente se imprimen los conceptos SIN
     una sola cifra —ver `conceptosDeLinea`—.
     -------------------------------------------------------------------- */
  const filaParte = d => `<tr>
      <td><input class="field d-concepto" value="${esc(d.concepto)}" style="width:100%"
            placeholder="Menú 3 tiempos"></td>
      <td><input class="field d-unit num" inputmode="decimal" value="${d.unitario || ""}"
            style="width:100%;text-align:right"></td>
      <td><input class="field d-cant num" inputmode="numeric" value="${d.cantidad || ""}"
            style="width:100%;text-align:right"></td>
      <td class="num d-sub">—</td>
      <td><button class="btn sm danger" data-quitaparte>✕</button></td></tr>`;

  const cajaDesglose = l => !(l.partes && l.partes.length) ? "" : `
    <div class="desglose">
      <div class="desglose-tit">
        <b>Servicios que incluye</b>
        <div class="spacer"></div>
        <button class="btn sm" data-addparte>+ Servicio</button>
        <button class="btn sm" data-sindesglose
          title="Vuelve a ser un renglón normal, con su precio a mano">Quitar el desglose</button>
      </div>
      <div class="hint desglose-nota">Las cifras son control interno: NO se imprimen en la
        cotización del cliente. De aquí sale el precio por persona.</div>
      <table class="data"><thead><tr>
        <th>Servicio incluido</th><th class="num" style="width:110px">Unitario</th>
        <th class="num" style="width:90px">Cant.</th>
        <th class="num" style="width:120px">Subtotal</th><th style="width:44px"></th>
      </tr></thead><tbody>${l.partes.map(filaParte).join("")}</tbody>
      <tfoot><tr><td colspan="3"><b>Total del paquete</b></td>
        <td class="num d-total"><b>—</b></td><td></td></tr>
      <tr><td colspan="3"><b>Por persona</b> <span class="hint d-pax"></span></td>
        <td class="num d-xpers"><b>—</b></td><td></td></tr></tfoot></table>
    </div>`;

  const ov = modal(`
    <div class="modal wide">
      <div class="modal-head"><h2>${existente ? "Editar" : "Nueva"} ${esc(infoTipoEv(tipo).name.toLowerCase())} de evento</h2>
        <button class="btn" data-close>✕</button></div>
      <div class="modal-body">
        <div id="evErr"></div>
        <div class="grid">
          <div class="full"><label class="lbl">Cliente</label>
            ${buscadorCliente(e.clienteId, "evCli")}</div>
          <div><label class="lbl">Atención a <span class="hint">(a quién va dirigida)</span></label>
            <input class="field" id="evAtn" value="${esc(e.atencion)}" placeholder="Claudia Cruz"></div>
          <div><label class="lbl">Referencia del evento</label>
            <input class="field" id="evTit" value="${esc(e.titulo)}" placeholder="Boda Claudia &amp; Ricardo"></div>
          <div><label class="lbl">Folio</label>
            <div class="field" id="evFolio"
              style="display:flex;align-items:center;min-height:38px;${e.folio
                ? "font-weight:600" : "color:var(--muted)"}"
              >${e.folio ? esc(e.folio) : "Se asigna al firmar"}</div></div>
          <div><label class="lbl">Fecha del documento</label>
            <input class="field" type="date" id="evFecha" value="${esc(e.fecha)}"></div>
          <div><label class="lbl">Vigencia hasta</label>
            <input class="field" type="date" id="evVig" value="${esc(e.vigencia)}"></div>
          <div class="full"><label class="lbl">Ejecutivo de banquetes</label>
            ${selectEjecutivo(e.ejecutivo || (esDeBanquetes(miNombre()) ? miNombre() : ""),
                              "evEje", "banquetes")}
            <div class="hint">Sólo salen los de banquetes.</div></div>
          <div><label class="lbl">IVA (%)</label>
            <input class="field" id="evIva" inputmode="decimal" value="${esc(String(e.iva))}"></div>
          <div><label class="lbl">Cargo por servicio (%)</label>
            <input class="field" id="evServ" inputmode="decimal" value="${esc(String(e.cargoServicio))}">
            <div class="hint">Sólo sobre alimentos y bebidas.</div></div>
        </div>

        <h3 class="sec">Detalles del evento</h3>
        <div class="note">Un renglón por momento: el cóctel, la cena, el after. Es lo que
          después se ve en el calendario.</div>
        <div style="overflow:auto"><table class="data" id="tBloq">
          <thead><tr><th style="width:150px">Fecha</th><th style="width:120px">Horario</th><th>Evento</th>
            <th class="num" style="width:80px">Pax</th><th style="width:130px">Montaje</th>
            <th style="width:130px">Salón</th><th style="width:180px">Renta</th><th style="width:44px"></th></tr></thead>
          <tbody>${(e.bloques.length ? e.bloques : [saneaBloqueEv({})]).map(filaB).join("")}</tbody></table></div>
        <datalist id="listaMontajes">${MONTAJES.map(m => `<option value="${esc(m)}">`).join("")}</datalist>
        <p style="margin:8px 0 0"><button class="btn" id="bAddBloq">+ Agregar momento</button></p>

        ${e.servicios ? `
        <h3 class="sec">Servicios cotizados</h3>
        <div class="note warn">Esta sección ya no se usa: con el catálogo, la propuesta
          económica de abajo ya dice qué se cotizó, y esto lo repetía. Sigue aquí porque
          <b>este documento</b> ya la traía escrita, para no cambiarle lo que dice. Se puede
          corregir o vaciar; una vez vacía, no vuelve a salir. Lo operativo —qué se monta en
          cada espacio— va en <i>Observaciones</i>.</div>
        <textarea class="field" id="evServicios" style="width:100%;min-height:150px"
          >${esc(e.servicios)}</textarea>` : ""}

        <h3 class="sec">Propuesta económica</h3>
        <div class="note">La palomita de <b>Serv.</b> marca los renglones que llevan el cargo
          por servicio: alimentos y bebidas sí, audiovisual y mobiliario no.
          ${state.serviciosBq.some(x => x.nombre)
            ? `Al escoger el servicio se llenan solos el precio y la palomita, y los dos se
               pueden corregir aquí sin tocar el catálogo.`
            : `<br><b>El catálogo de servicios está vacío</b>, así que por ahora el servicio se
               escribe a mano. Con los servicios y sus precios capturados en
               <i>Ajustes → Catálogo de servicios de banquetes</i>, aquí sale una lista para
               escoger y el precio se llena solo.`}</div>
        <div style="overflow:auto"><table class="data" id="tLin">
          <thead><tr><th style="width:150px">Fecha</th><th>Servicio</th>
            <th class="num" style="width:80px">Cant.</th><th class="num" style="width:110px">P. unitario</th>
            <th style="width:54px">Serv.</th>
            <th class="num" style="width:110px">Subtotal</th>
            <th class="num" style="width:120px">Total</th><th style="width:44px"></th></tr></thead>
          <tbody>${(e.lineas.length ? e.lineas : [saneaLineaEv({})]).map(filaL).join("")}</tbody>
          <tfoot><tr><td colspan="5"><b>Total del evento</b></td>
            <td class="num" id="evSub"><b>—</b></td>
            <td class="num" id="evTot"><b>—</b></td><td></td></tr></tfoot></table></div>
        <p style="margin:8px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn" id="bAddLin">+ Agregar renglón</button>
          <span class="hint" id="evDesglose"></span></p>

        ${tipo === "contrato" ? `
          <h3 class="sec">Del contrato</h3>
          <div class="grid">
            <div><label class="lbl">Garantía de invitados</label>
              <input class="field" id="evGar" inputmode="numeric" value="${esc(e.garantiaPax)}"
                placeholder="150"></div>
            <div><label class="lbl">Anticipo</label>
              <input class="field" id="evAnt" inputmode="decimal" value="${e.anticipo === "" ? "" : e.anticipo}"></div>
            <div><label class="lbl">Pagar antes del</label>
              <input class="field" type="date" id="evLim" value="${esc(e.fechaLimitePago)}"></div>
          </div>` : ""}

        <h3 class="sec">Observaciones</h3>
        <textarea class="field" id="evObs" style="width:100%;min-height:70px"
          placeholder="${esc(TEXTOS_EV.observaciones)}">${esc(e.observaciones)}</textarea>
      </div>
      <div class="modal-foot">
        ${existente ? `<button class="btn danger" id="bDelEv">Eliminar</button>` : ""}
        <div class="spacer"></div>
        <button class="btn" data-close>Cancelar</button>
        <button class="btn" id="bOkEv">Guardar borrador</button>
        <button class="btn ok" id="bFirmarEv">Guardar y firmar</button>
      </div>
    </div>`);

  const q = sel => ov.querySelector(sel);
  const pct = id => Number(q(id).value) || 0;

  /** El renglón del desglose que cuelga de esta línea, si lo tiene. */
  const desgloseDe = tr => {
    const sig = tr.nextElementSibling;
    return sig && sig.classList.contains("l-desglose") && sig.querySelector(".desglose")
      ? sig : null;
  };

  /* Los renglones del desglose, por su ruta completa.
     `caja.querySelectorAll("tbody tr")` NO sirve: en un selector con espacios
     los ancestros se buscan en TODO el documento, no dentro del elemento, así
     que el `tfoot` de la tabla chica también cumplía «tr dentro de un tbody»
     —el tbody grande, el de la tabla de renglones— y venía sin campos. */
  const renglonesDesglose = caja => caja.querySelectorAll(".desglose > table > tbody > tr");

  /** Lo capturado en el desglose de una línea, tal como está en pantalla. */
  const partesDe = tr => {
    const caja = desgloseDe(tr);
    if (!caja) return [];
    return [...renglonesDesglose(caja)].map(f => ({
      concepto: f.querySelector(".d-concepto").value.trim(),
      unitario: parseMoney(f.querySelector(".d-unit").value),
      cantidad: Number(f.querySelector(".d-cant").value) || 0
    })).filter(x => x.concepto);
  };

  function recalcular(){
    const pIva = pct("#evIva") / 100, pServ = pct("#evServ") / 100;
    let sub = 0, iva = 0, serv = 0;
    // Sólo las líneas: los renglones de desglose cuelgan de ellas y no suman aparte.
    ov.querySelectorAll("#tLin > tbody > tr:not(.l-desglose)").forEach(tr => {
      const cant = Number(tr.querySelector(".l-cant").value) || 0;
      const campoPr = tr.querySelector(".l-precio");
      const caja = desgloseDe(tr);

      /* Con desglose, el precio por persona NO se teclea: sale de la suma.
         Es lo que pidió Marco —que el total dependa de lo que el ejecutivo
         haya movido— y de paso impide que el desglose y el precio se
         contradigan delante de un cliente. */
      if (caja){
        const partes = partesDe(tr);
        const total = sumaPartes(partes);
        renglonesDesglose(caja).forEach((f, i) => {
          const d = partes.find((x, k) => k === i) ||
                    { unitario: parseMoney(f.querySelector(".d-unit").value),
                      cantidad: Number(f.querySelector(".d-cant").value) || 0 };
          const st = (d.unitario || 0) * (d.cantidad || 0);
          f.querySelector(".d-sub").textContent = st ? moneyMN(st) : "—";
        });
        caja.querySelector(".d-total").innerHTML = `<b>${total ? esc(moneyMN(total)) : "—"}</b>`;
        const xp = porPersonaPartes(partes, cant);
        caja.querySelector(".d-xpers").innerHTML = `<b>${xp ? esc(moneyMN(xp)) : "—"}</b>`;
        caja.querySelector(".d-pax").textContent = cant
          ? `entre ${cant} invitado(s)` : "— falta la cantidad de invitados";
        campoPr.value = xp || "";
        campoPr.readOnly = true;
        campoPr.title = "Sale del desglose de abajo";
      } else if (campoPr.readOnly){
        campoPr.readOnly = false;
        campoPr.title = "";
      }

      const pr = parseMoney(campoPr.value);
      const st = cant * pr;
      const i = st * pIva, sv = tr.querySelector(".l-serv").checked ? st * pServ : 0;
      sub += st; iva += i; serv += sv;
      tr.querySelector(".l-sub").textContent = st ? moneyMN(st) : "—";
      tr.querySelector(".l-tot").textContent = st ? moneyMN(st + i + sv) : "—";
    });
    q("#evSub").innerHTML = `<b>${sub ? esc(moneyMN(sub)) : "—"}</b>`;
    q("#evTot").innerHTML = `<b>${sub ? esc(moneyMN(sub + iva + serv)) : "—"}</b>`;
    q("#evDesglose").textContent = sub
      ? `Subtotal ${moneyMN(sub)} · IVA ${moneyMN(iva)} · servicio ${moneyMN(serv)}` : "";
  }

  ov.addEventListener("input", ev => {
    if (ev.target.closest("#tLin") || ev.target.id === "evIva" || ev.target.id === "evServ")
      recalcular();
  });
  /**
   * Escoger un servicio llena el renglón: su precio y su palomita.
   *
   * Lo que se cuida es no pisar lo tecleado a mano. Sólo se reescribe lo que
   * esté vacío o lo que siga siendo, al centavo, lo del servicio anterior —el
   * mismo trato que los textos del certificado—. Así, cambiar de servicio por
   * equivocación no borra el precio que alguien negoció con el cliente.
   */
  function escogerServicio(sel){
    const tr = sel.closest("tr");
    const txt = tr.querySelector(".l-servicio");
    const precio = tr.querySelector(".l-precio");
    const palomita = tr.querySelector(".l-serv");

    if (sel.value === OTRO_SRV){
      txt.style.display = "";
      // Venía de la lista: se limpia para que no parezca que ya está escrito.
      if (servicioBqPorNombre(txt.value)) txt.value = "";
      tr.dataset.srvAntes = "";
      marcarPaquete(tr);
      txt.focus();
      recalcular();
      return;
    }

    txt.style.display = "none";
    txt.value = sel.value;
    // La columna es angosta y hay nombres largos: el completo, al pasar el ratón.
    sel.title = sel.value;
    const x = servicioBqPorNombre(sel.value);
    if (x){
      const antes = servicioBqPorNombre(tr.dataset.srvAntes || "");
      const puesto = parseMoney(precio.value);
      if (!puesto || (antes && puesto === antes.precio)) precio.value = x.precio || "";
      if (!antes || palomita.checked === antes.conServicio) palomita.checked = x.conServicio;
    }
    tr.dataset.srvAntes = sel.value;
    /* El desglose viaja con el servicio: al escoger un paquete baja el suyo, y
       al cambiar a otro servicio se va el que había. Es una COPIA —por eso el
       JSON de ida y vuelta—: a partir de aquí este renglón es dueño del suyo y
       tocar el catálogo no lo mueve. */
    ponerDesglose(tr, x && x.partes && x.partes.length
      ? JSON.parse(JSON.stringify(x.partes)) : []);
    recalcular();
  }

  /**
   * Volver a marcar —o desmarcar— el renglón como paquete.
   *
   * Se vuelve a preguntar con lo que hay EN PANTALLA, no con lo que se dibujó,
   * porque entre una cosa y otra pudo cambiar de servicio o quedarse sin
   * desglose.
   */
  function marcarPaquete(tr){
    const txt = tr.querySelector(".l-servicio");
    const es = esLineaPaquete({ servicio: txt ? txt.value : "",
                                partes: desgloseDe(tr) ? [1] : [] });
    tr.classList.toggle("l-paq", es);
    const et = tr.querySelector(".et-paq");
    if (et) et.hidden = !es;
  }

  /** Cuelga (o quita) el desglose de una línea y lo vuelve a dibujar. */
  function ponerDesglose(tr, partes){
    const sig = tr.nextElementSibling;
    if (!sig || !sig.classList.contains("l-desglose")) return;
    sig.children[0].innerHTML = cajaDesglose({ partes: (partes || []).map(saneaParteBq) });
    marcarPaquete(tr);
  }

  /**
   * Escribir en el buscador vuelve a armar la lista de ESE renglón.
   *
   * Busca por nombre y también por familia: escribir «pista» saca las pistas,
   * y escribir «audio» saca todo lo de audio aunque el nombre no traiga la
   * palabra. Si queda uno solo se escoge solo —que es a lo que va quien está
   * buscando— y de paso se le llenan el precio y la palomita.
   */
  function buscarServicio(campo){
    const tr = campo.closest("tr");
    const sel = tr.querySelector(".l-srvSel");
    const cuenta = tr.querySelector(".srv-cuenta");
    if (!sel) return;
    const q = campo.value;
    const hallados = srvQueCoinciden(q);
    const antes = sel.value;
    /* Qué queda escogido después de teclear, en este orden:
         1. si quedó UNO solo, ése —a eso va quien busca—;
         2. si lo que ya estaba sigue entre los hallados, se queda;
         3. si ya estaba escogido algo del catálogo y la búsqueda no lo
            alcanza, TAMBIÉN se queda. Buscar es mirar, no deshacer: teclear
            una palabra que no empata no tiene por qué borrarle a nadie el
            servicio que ya había puesto.
       Ese tercer caso obliga a dejarlo en la lista aunque no coincida; si no,
       el `<select>` se quedaría apuntando a una opción que no existe. */
    const guardado = servicioBqPorNombre(antes);
    const sigue = hallados.length === 1 ? hallados[0].nombre
                : hallados.some(x => x.nombre === antes) ? antes
                : guardado ? antes : "";
    const paraLista = (sigue && !hallados.some(x => x.nombre === sigue))
      ? hallados.concat([servicioBqPorNombre(sigue)]) : hallados;
    sel.innerHTML = opcionesSrv(sigue, paraLista);
    sel.value = sigue || (antes === OTRO_SRV ? OTRO_SRV : "");
    if (sel.value !== antes) escogerServicio(sel);
    if (cuenta) cuenta.textContent = !mismoNombre(q) ? ""
      : hallados.length === 1 ? "Uno solo: ya quedó escogido."
      : hallados.length ? `${hallados.length} coinciden.`
      : "Ninguno coincide. Borra la búsqueda para ver todos.";
  }

  ov.addEventListener("input", ev => {
    if (ev.target.classList.contains("busca-srv")) buscarServicio(ev.target);
  });
  ov.addEventListener("change", ev => {
    if (ev.target.classList.contains("l-serv")) recalcular();
    if (ev.target.classList.contains("l-srvSel")) escogerServicio(ev.target);
  });
  ov.addEventListener("click", ev => {
    const add = ev.target.closest("[data-addparte]");
    if (add){
      const caja = add.closest(".l-desglose");
      caja.querySelector(".desglose > table > tbody")
        .insertAdjacentHTML("beforeend", filaParte(saneaParteBq({})));
      [...renglonesDesglose(caja)].pop().querySelector(".d-concepto").focus();
      recalcular();
      return;
    }
    const quitaP = ev.target.closest("[data-quitaparte]");
    if (quitaP){
      const f = quitaP.closest("tr"), cuerpo = f.parentElement;
      f.remove();
      /* Sin conceptos no hay desglose: el renglón vuelve a ser uno normal, con
         su precio a mano. Dejar la tabla vacía sería dejar un precio en cero
         que nadie puede corregir. */
      if (!cuerpo.children.length)
        ponerDesglose(cuerpo.closest(".l-desglose").previousElementSibling, []);
      recalcular();
      return;
    }
    const sinD = ev.target.closest("[data-sindesglose]");
    if (sinD){
      ponerDesglose(sinD.closest(".l-desglose").previousElementSibling, []);
      recalcular();
      return;
    }
    const b = ev.target.closest("[data-quita]");
    if (!b) return;
    const tr = b.closest("tr"), cuerpo = tr.parentElement;
    // Una línea se lleva consigo su renglón de desglose, si lo tiene.
    const sig = tr.nextElementSibling;
    if (sig && sig.classList.contains("l-desglose")) sig.remove();
    tr.remove();
    if (!cuerpo.children.length)
      cuerpo.insertAdjacentHTML("beforeend",
        cuerpo.closest("#tBloq") ? filaB(saneaBloqueEv({})) : filaL(saneaLineaEv({})));
    recalcular();
  });
  recalcular();

  q("#bAddBloq").onclick = () =>
    ov.querySelector("#tBloq tbody").insertAdjacentHTML("beforeend", filaB(saneaBloqueEv({})));
  q("#bAddLin").onclick = () => {
    ov.querySelector("#tLin tbody").insertAdjacentHTML("beforeend", filaL(saneaLineaEv({})));
    recalcular();
  };

  const bd = q("#bDelEv");
  if (bd) bd.onclick = () => {
    if (!confirm("¿Eliminar este documento? Esta acción no se puede deshacer.")) return;
    state.eventos = state.eventos.filter(x => x.id !== e.id);
    guardar(); render(); ov.remove();
    if (alCerrar) alCerrar();
  };

  q("#bOkEv").onclick = () => { if (recoger()){ ov.remove(); if (alCerrar) alCerrar(); } };
  q("#bFirmarEv").onclick = () => {
    if (!recoger()) return;
    ov.remove();
    verEvento(e.id, alCerrar, true);
  };

  function pintaErrores(lista){
    q("#evErr").innerHTML = lista.length
      ? `<div class="errbox"><b>Falta esto para poder continuar:</b><ul>${
          lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
      : "";
  }

  function recoger(){
    const cid = q("#evCli").value;
    const bloques = [...ov.querySelectorAll("#tBloq tbody tr")].map(tr => saneaBloqueEv({
      fecha: tr.querySelector(".b-fecha").value, horario: tr.querySelector(".b-hora").value,
      evento: tr.querySelector(".b-evento").value, pax: tr.querySelector(".b-pax").value,
      montaje: tr.querySelector(".b-montaje").value, salon: tr.querySelector(".b-salon").value,
      renta: tr.querySelector(".b-renta").value
    })).filter(b => b.fecha || b.evento || b.salon);
    const lineas = [...ov.querySelectorAll("#tLin > tbody > tr:not(.l-desglose)")].map(tr => saneaLineaEv({
      partes: partesDe(tr),
      fecha: tr.querySelector(".l-fecha").value, servicio: tr.querySelector(".l-servicio").value,
      cantidad: tr.querySelector(".l-cant").value,
      precio: parseMoney(tr.querySelector(".l-precio").value),
      conServicio: tr.querySelector(".l-serv").checked
    })).filter(l => l.servicio || l.cantidad || l.precio);

    const problemas = [];
    if (!cid) problemas.push("Selecciona el cliente.");
    if (!bloques.length) problemas.push("Captura al menos un momento del evento.");
    if (!bloques.some(b => b.fecha))
      problemas.push("Al menos un momento necesita fecha, o el evento no sale en el calendario.");
    if (!lineas.length) problemas.push("Captura al menos un renglón en la propuesta económica.");
    lineas.forEach((l, i) => {
      if (!l.servicio) problemas.push(`Al renglón ${i+1} de la propuesta le falta el servicio.`);
      if (!l.cantidad) problemas.push(`Al renglón ${i+1} le falta la cantidad.`);
      if (!l.precio)   problemas.push(`Al renglón ${i+1} le falta el precio.`);
    });

    pintaErrores(problemas);
    if (problemas.length){
      q("#evErr").scrollIntoView({ block:"center", behavior:"smooth" });
      return false;
    }

    /* El folio no se toca al guardar: lo pone el contador al firmar. Se lee del
       evento, NO del campo —que ya no es un campo sino un renglón de sólo
       lectura—, para conservar el de uno viejo que ya traía número.

       El `folio &&` hace falta: sin él, dos borradores sin folio se veían como
       el mismo ("" === "") y se les inventaba número. */
    let folio = String(e.folio || "").trim();
    if (folio && state.eventos.some(x => x.id !== e.id &&
        String(x.folio || "").trim().toUpperCase() === folio.toUpperCase()))
      folio = folioEvento(tipo, String(q("#evFecha").value || "").slice(0,4), e.id);

    Object.assign(e, {
      clienteId: cid,
      ejecutivo: q('[name="evEje"]').value.trim(),
      atencion: q("#evAtn").value.trim(),
      titulo: q("#evTit").value.trim(),
      folio,
      fecha: q("#evFecha").value || hoyISO(),
      vigencia: q("#evVig").value,
      iva: pct("#evIva"), cargoServicio: pct("#evServ"),
      bloques, lineas,
      /* El campo ya no se dibuja en un documento nuevo. Si no está, se conserva
         lo que el documento traiga: quitar una sección de la captura no puede
         borrarle el texto a una cotización que ya salió. */
      servicios: q("#evServicios") ? q("#evServicios").value.trim() : e.servicios,
      observaciones: q("#evObs").value.trim(),
      garantiaPax: q("#evGar") ? q("#evGar").value.trim() : e.garantiaPax,
      anticipo: q("#evAnt") ? (q("#evAnt").value.trim() === "" ? "" : parseMoney(q("#evAnt").value)) : e.anticipo,
      fechaLimitePago: q("#evLim") ? q("#evLim").value : e.fechaLimitePago,
      updatedAt: new Date().toISOString()
    });
    if (!existente){ e.createdAt = new Date().toISOString(); state.eventos.push(e); }
    tocaBanquetes(e);
    guardar(); render();
    return true;
  }
}

/**
 * El contrato de prestación de servicios de eventos sociales.
 *
 * Es el legal que usa banquetes, con sus diecinueve cláusulas. Lo que cambia
 * de un contrato a otro son unos cuantos huecos —el cliente, el evento, el
 * salón, el monto—; el resto es siempre igual, así que vive aquí y no se
 * recaptura. Los datos fiscales y bancarios del hotel salen de Ajustes: en
 * este archivo no puede haber ninguno, porque se publica.
 */
function cuerpoContratoBq(e, c){
  if (!(c && c.empresa) && e.destinatario) c = e.destinatario;
  const h = state.ajustes.hotel;
  const cu = cuentasEvento(e);
  const fe = fechaEvento(e);
  const primero = e.bloques[0] || {};
  const hueco = v => String(v || "").trim() || "________________";

  const cl = (t, x) => `<div class="cl"><b>${esc(t)}</b> ${x}</div>`;
  const li = xs => `<ul class="ct-serv">${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const penas = [
    "El 10% del monto total, si la cancelación se solicita 90 días hábiles antes del evento.",
    "El 25% del monto total, si se solicita 60 días hábiles antes del evento.",
    "El 50% del monto total, si se solicita 30 días hábiles antes del evento.",
    "El 100% del monto total, si se solicita 5 días hábiles antes del evento."
  ];

  return `
    <div class="doc-hotel">
      ${h.logo ? `<img class="doc-logo" src="${esc(h.logo)}" alt="${esc(h.nombre)}">`
        : esQuartz(h.nombre) ? `<div class="doc-wordmark">${logoQuartz(MORADO_QUARTZ)}</div>`
        : `<div class="doc-mono">${monogramaQ(MORADO_QUARTZ)}</div><b>${esc(h.nombre)}</b>`}
    </div>
    <div class="doc-regla"></div>

    <h1 style="font-size:14px;text-align:center;margin:14px 0 12px;color:#39104e;
      line-height:1.5">CONTRATO DE PRESTACIÓN DE SERVICIOS DE EVENTOS SOCIALES
      (BANQUETES)</h1>

    <div class="pol">Que celebran por una parte <b>${esc(hueco(h.razonSocial))}</b>,
      representada por <b>${esc(hueco(h.representante))}</b>, a quien en lo sucesivo se le
      denominará <b>“EL PRESTADOR DEL SERVICIO”</b>, y por la otra
      <b>${esc(hueco(c && c.empresa))}</b>, a quien en lo sucesivo se le denominará
      <b>“EL CLIENTE”</b>, al tenor de las siguientes declaraciones y cláusulas:</div>

    <h2>Declaraciones</h2>
    <div class="pol"><b>I.- Declara “EL PRESTADOR DEL SERVICIO”:</b></div>
    ${li([
      `Ser una persona moral mexicana según consta en la escritura pública ${hueco(h.escritura)}.`,
      `Que su RFC es ${hueco(h.rfc)} y su domicilio el ubicado en ${hueco(h.domicilioFiscal)}.`,
      "Que cuenta con la capacidad, infraestructura, servicios y recursos necesarios para dar " +
      "cabal cumplimiento a las obligaciones contenidas en el presente contrato.",
      `Que cuenta con personal capacitado para atender quejas y reclamaciones, para lo cual ` +
      `señala el teléfono ${h.telefono}, con horario de atención ${h.horarioAtencion}.`,
      "Que informó al CLIENTE los precios, tarifas, condiciones, características y costo total " +
      "del servicio, así como las restricciones aplicables."
    ])}

    <div class="pol"><b>II.- Declara “EL CLIENTE”:</b></div>
    ${li([
      "Llamarse como ha quedado plasmado en el proemio de este contrato.",
      "Que es su deseo obligarse en los términos y condiciones del presente contrato, " +
      "manifestando que cuenta con la capacidad legal para celebrarlo.",
      `Que su domicilio es ${hueco(c && c.ubicacion)}, con teléfono ` +
      `${hueco(c && c.telefono)} y correo electrónico ${hueco(c && c.email)}.`
    ])}

    <h2>Cláusulas</h2>

    ${cl("PRIMERA. CONSENTIMIENTO.—",
      "Las partes manifiestan su voluntad de celebrar el presente contrato de prestación de " +
      "servicios de eventos sociales, por lo que EL PRESTADOR DEL SERVICIO se obliga a prestar " +
      "el servicio a EL CLIENTE en el domicilio del primero y, en consecuencia, este último se " +
      "obliga a pagar como contraprestación un precio cierto y determinado.")}

    ${cl("SEGUNDA. OBJETO.—",
      `El Prestador de Servicios se obliga a proporcionar al CLIENTE el servicio del evento ` +
      `denominado <b>“${esc(hueco(e.titulo))}”</b>, con fecha ` +
      `<b>${esc(fe ? fechaLarga(fe) : "________________")}</b>, a llevarse a cabo en el salón ` +
      `<b>${esc(hueco(primero.salon))}</b>${primero.horario
        ? ` en horario de <b>${esc(primero.horario)}</b>` : ""}. Los servicios se especifican ` +
      `en el presupuesto final del evento (anexo A) y en la hoja de trabajo (anexo B), que ` +
      `forman parte integrante de este contrato.`)}

    ${cl("TERCERA. LOS SERVICIOS.—",

/** Cantidades en letra, que es como las pide un contrato. */
function enLetras(n){
  const ent = Math.floor(Math.abs(Number(n) || 0));
  const cent = Math.round((Math.abs(Number(n) || 0) - ent) * 100);
  const U = ["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez",
    "once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve",
    "veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis",
    "veintisiete","veintiocho","veintinueve"];
  const D = ["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const C = ["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos",
    "setecientos","ochocientos","novecientos"];
  const hasta999 = x => {
    if (x === 0) return "";
    if (x === 100) return "cien";
    const c = Math.floor(x / 100), d = Math.floor((x % 100) / 10), u = x % 10;
    const resto = x % 100;
    let t = C[c];
    if (resto){
      if (t) t += " ";
      t += resto < 30 ? U[resto] : (D[d] + (u ? " y " + U[u] : ""));
    }
    return t;
  };
  const tramo = (x, sing, plur) => {
    if (!x) return "";
    if (x === 1) return sing;
    return hasta999(x) + " " + plur;
  };
  let t;
  if (ent === 0) t = "cero";
  else {
    const mill = Math.floor(ent / 1e6), miles = Math.floor((ent % 1e6) / 1000), r = ent % 1000;
    t = [tramo(mill, "un millón", "millones"), tramo(miles, "mil", "mil"), hasta999(r)]
      .filter(Boolean).join(" ");
  }
  return `${t} pesos ${String(cent).padStart(2, "0")}/100 M.N.`;
}

function verEvento(id, alCerrar, pedirFirma){
  const e = state.eventos.find(x => x.id === id);
  if (!e) return;
  if (e.externo){ verEventoExterno(e, alCerrar); return; }
  const c = cliente(e.clienteId);
  const h = state.ajustes.hotel;
  const ec = ESTADOS_EV[e.estado];
  const agua = h.marcaAgua === "ninguna" ? ""
             : (h.marcaAgua === "logo" && h.logo) ? `<img src="${esc(h.logo)}" alt="">`
             : monogramaQ(MORADO_QUARTZ);
  const yaTieneContrato = state.eventos.some(x => x.cotizacionId === e.id);

  const ov = modal(`
    <div class="modal doc">
      <div class="modal-head">
        <h2>${esc(infoTipoEv(e.tipo).name)} ${esc(e.folio || "")}</h2>
        <span class="estado-chip" style="background:${ec.bg};color:${ec.fg}">${esc(ec.name)}</span>

      </div>
      <div class="doc-body">
        ${agua ? `<div class="doc-agua">${agua}</div>` : ""}
        <div class="doc-contenido">${docEvento(e, c)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="bPrintEv">Imprimir</button>
        <button class="btn" id="bPdfEv">Descargar PDF</button>
        ${e.estado === "borrador" ? `<button class="btn" id="bEditEv">Editar</button>` : ""}
        <div class="spacer"></div>
        ${e.tipo === "cotizacion" && !yaTieneContrato
          ? `<button class="btn" id="bAContrato">Pasar a contrato</button>` : ""}
        ${!e.firmaHotel ? `<button class="btn ok" id="bEvF1">Firmar por el hotel</button>` : ""}
        ${e.firmaHotel && !e.firmaCliente
          ? `<button class="btn primary" id="bEvEnviar">Enviar al cliente</button>
             <button class="btn ok" id="bEvF2">Registrar firma del cliente</button>` : ""}
        ${e.firmaCliente ? `<span class="hint">Aceptado y firmado por el cliente.</span>` : ""}
      </div>
    </div>`);

  ov.querySelector("#bPrintEv").onclick = () => {
    fijarPagina(false);
    ov.classList.add("printable");
    const quitar = () => { ov.classList.remove("printable"); window.removeEventListener("afterprint", quitar); };
    window.addEventListener("afterprint", quitar);
    window.print();
    setTimeout(quitar, 1500);
  };

  const bp = ov.querySelector("#bPdfEv");
  bp.onclick = async () => {
    const antes = bp.textContent;
    bp.disabled = true; bp.textContent = "Generando…";
    try{
      const bytes = await pdfDeDocumento(docEvento(e, c));
      descargarBlob(new Blob([bytes], { type:"application/pdf" }), nombrePdfEvento(e, c));
    }catch(err){
      alert("No se pudo generar el PDF aquí: " + err.message +
            "\n\nUsa Imprimir y elige \"Guardar como PDF\".");
    }finally{ bp.disabled = false; bp.textContent = antes; }
  };

  const be = ov.querySelector("#bEditEv");
  if (be) be.onclick = () => { ov.remove(); editarEvento(e.id, null, alCerrar); };

  const bc = ov.querySelector("#bAContrato");
  if (bc) bc.onclick = () => { ov.remove(); pasarAContratoBq(e, alCerrar); };

  const f1 = ov.querySelector("#bEvF1");
  if (f1) f1.onclick = () => padFirma("Firma por el hotel",
    { nombre: ejecutivoDeEv(e) || miNombre(), puesto:"Banquetes", celular:"" },
    async d => {
      if (!await firmarEvento(e, "hotel", d)) return;
      ov.remove(); verEvento(e.id, alCerrar);
    },
    { recordar:true });

  const f2 = ov.querySelector("#bEvF2");
  if (f2) f2.onclick = () => padFirma("Firma de aceptación del cliente",
    { nombre: e.atencion || (c && c.contacto) || "", puesto:"", celular:(c && c.telefono) || "" },
    async d => {
      if (!await firmarEvento(e, "cliente", d)) return;
      ov.remove(); verEvento(e.id, alCerrar);
    });

  const en = ov.querySelector("#bEvEnviar");
  if (en) en.onclick = () => enviarEvento(e, c);

  if (pedirFirma && !e.firmaHotel && f1) setTimeout(() => f1.click(), 60);
}

/**
 * Igual que convenios y contratos: el folio se toma al firmar.
 *
 * Los eventos llevan DOS series —EV para la cotización, CB para el contrato—,
 * así que el prefijo sale del tipo del documento. Cada serie lleva su propia
 * cuenta en el servidor y no se estorban entre sí.
 */
async function firmarEvento(e, quien, d){
  const fecha = new Date().toISOString();
  const firma = saneaFirma(Object.assign({}, d, { fecha }));
  const c = cliente(e.clienteId);
  const doc = infoTipoEv(e.tipo).name;

  if (quien === "hotel"){
    const serie = e.tipo === "contrato" ? "CB" : "EV";
    const folio = await folioParaFirmar(e, "eventos_" + serie.toLowerCase(), serie, anioEvento(e),
      () => folioEvento(e.tipo === "contrato" ? "contrato" : "cotizacion", anioEvento(e), e.id));
    if (!folio){ alert(AVISO_SIN_CONTADOR); return false; }
    e.folio = folio;
    e.firmaHotel = firma;
    if (e.estado === "borrador") e.estado = "firmado";
    if (c) e.destinatario = { empresa:c.empresa, contacto:c.contacto, ubicacion:c.ubicacion,
                              telefono:c.telefono, email:c.email };
    registrarAuto(e.clienteId, `${doc} ${e.folio} firmada por el hotel`,
      e.titulo || "", ejecutivoDeEv(e));
  } else {
    if (!e.firmaHotel){ alert("Primero debe firmar el hotel."); return false; }
    e.firmaCliente = firma;
    e.estado = "confirmado";
    registrarAuto(e.clienteId, `${doc} ${e.folio} aceptada por el cliente`,
      `Firmó ${d.nombre}.`, ejecutivoDeEv(e));
    /* Un evento confirmado es un cliente ganado PARA BANQUETES. Antes esto
       escribía el estatus de ventas: una boda confirmada le cerraba el embudo
       de hospedaje a una ejecutiva que ni se había enterado. Va derecho al
       campo de banquetes, no por `campoEstatus()`: da igual desde qué
       departamento se mire, lo que se ganó fue un evento. */
    tocaBanquetes(e);
    if (c && !(estatusSiHay(c.estatusBq) || {}).won){
      c.estatusBq = "ganado"; c.updatedAt = fecha;
    }
  }
  e.updatedAt = new Date().toISOString();
  guardar(); render();
  return true;
}

/** De cotización a contrato: se copia todo y se le agrega lo del contrato. */
function pasarAContratoBq(cot, alCerrar){
  const k = saneaEvento(Object.assign({}, cot, {
    id:"", tipo:"contrato", cotizacionId: cot.id,
    folio: "",                 // el contrato de banquetes toma el suyo al firmarse
    estado:"borrador", firmaHotel:null, firmaCliente:null, enviado:null,
    garantiaPax: String(cot.bloques.reduce((a,b) => Math.max(a, Number(b.pax) || 0), 0) || ""),
    fecha: hoyISO(), createdAt:"", updatedAt:""
  }));
  state.eventos.push(k);
  guardar();
  vista = "contratosbq"; render();
  editarEvento(k.id, null, alCerrar);
}

    </div>`);

  const anotar = via => {
    e.enviado = { fecha:new Date().toISOString(), via, quien: correoSesion() };
    if (e.estado === "firmado") e.estado = "enviada";
    e.updatedAt = new Date().toISOString();
    registrarAuto(e.clienteId, `${doc} ${e.folio} enviada por ${VIAS[via]}`,
      destinoEnvio(via, c), ejecutivoDeEv(e));
    guardar(); render();
  };

  pdfDeDocumento(docEvento(e, c)).then(bytes => {
    const blob = new Blob([bytes], { type:"application/pdf" });
    const file = new File([blob], archivo, { type:"application/pdf" });
    const puedeCompartir = typeof navigator.canShare === "function" &&
                           navigator.canShare({ files:[file] });

    ov.querySelector("#cuerpoEnvioEv").innerHTML =
      (puedeCompartir
        ? `<div class="note">Con <b>Compartir</b> se va el PDF y el mensaje juntos.</div>
           <p><button class="btn ok" id="evCompartir" style="font-size:15px;padding:10px 16px">
             Compartir el PDF y el mensaje</button></p>`
        : `<div class="note warn">Este navegador no deja mandar el archivo y el mensaje de una
             vez. Descargue el PDF y adjúntelo a mano.</div>`) +
      `<p><button class="btn" id="evBajar">Descargar el PDF</button></p>
       <p class="hint" style="margin:10px 0 4px">O abra el mensaje ya redactado:</p>
       <p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
         <button class="btn" id="evMail" ${(c && c.email) ? "" : "disabled"}>Enviar por correo</button>
         <button class="btn wa" id="evWa" ${(c && c.telefono) ? "" : "disabled"}
           title="Enviar por WhatsApp" aria-label="Enviar por WhatsApp">${ICONO_WA}</button></p>
       <p class="hint">Se guardará como <b>${esc(archivo)}</b></p>`;

    const comp = ov.querySelector("#evCompartir");
    if (comp) comp.onclick = async () => {
      try{
        await navigator.share({ files:[file], title:asunto, text:mensaje });
        anotar("whatsapp"); ov.remove();
      }catch(err){}
    };
    ov.querySelector("#evBajar").onclick = () => descargarBlob(blob, archivo);
    ov.querySelector("#evMail").onclick = () => {
      window.location.href = `mailto:${encodeURIComponent((c && c.email) || "")}` +
        `?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(mensaje)}`;
      anotar("correo"); ov.remove();
    };
    ov.querySelector("#evWa").onclick = () => {
      window.open(waLink((c && c.telefono) || "", mensaje, ladaDe(c)), "_blank", "noopener");
      anotar("whatsapp"); ov.remove();
    };
  }).catch(err => {
    ov.querySelector("#cuerpoEnvioEv").innerHTML =
      `<div class="errbox">No se pudo armar el PDF: ${esc(err.message)}</div>`;
  });
}

/** Un documento de banquetes que vino de fuera, ya firmado. */
function subirEventoExterno(tipo){
  subirDocumentoExterno(tipo === "contrato" ? "contratobq" : "cotizacionbq");
}

function verEventoExterno(e, alCerrar){
  const c = cliente(e.clienteId);
  fichaExterna(`${infoTipoEv(e.tipo).name} ${e.folio || ""}`, "Externo · firmado", [
    ["Cliente", (c && c.empresa) || nombreCli(e.clienteId)],
    ["Evento", e.titulo],
