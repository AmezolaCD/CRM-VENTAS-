/**
 * Lo que el último sanear() dejó fuera por no encontrarle cliente.
 *
 * Importa por una razón: con el servidor repartiendo por dueño, a alguien le
 * puede llegar una actividad o un evento suyo colgando de un cliente que no
 * alcanza a ver. Ese renglón se aparta —sin su cliente no sirve de nada—,
 * pero NO es un borrado. Si la sincronización lo confundiera con uno, este
 * equipo le daría de baja a todo el hotel un registro que ni siquiera puede
 * abrir. Por eso se anotan aquí y se sacan de la lista de "ya sincronizado".
 */
let huerfanos = new Set();

const nuevoId = p => (p||"x") + Date.now().toString(36) + "-" + (++idCounter);

/**
 * Si había datos guardados y aun así no se pudieron leer, NO se sigue como si
 * el equipo estuviera en blanco.
 *
 * Caer a los clientes de ejemplo y volver a guardar encima pisaría la cartera
 * de verdad por un error de programación, sin que nadie se enterara. Se avisa
 * y se deja el almacenamiento intacto para poder recuperarlo.
 */
let cargaRota = false;

let state = cargar();
let filtros = { q:"", ejecutivo:"" };
let vista = "tablero";
/* ¿La pantalla de Ajustes ya está dibujada, con lo que alguien esté llenando
   ahí sin guardar todavía? Mientras lo esté, no se vuelve a dibujar sola. */
let ajustesEnPantalla = false;
let arrastrando = null;

/**
 * La cartera más pelada que puede existir, armada a mano.
 *
 * Es el último recurso de `cargar()`: si ni siquiera `sanear({})` se deja
 * armar —porque falta algo, porque hay un error de programación— la
 * aplicación TIENE que abrir de todos modos. Abrir con esto y la bandera
 * `cargaRota` puesta es mucho mejor que no abrir: nadie guarda encima de lo
 * que quedó, y el seguro del <head> enseña qué fue.
 *
 * Cada pieza se pide entre paños: si una revienta, se queda vacía y las demás
 * siguen.
 */
function esqueletoDeEmergencia(){
  const dame = (f, siNo) => { try{ const v = f(); return v == null ? siNo : v; }catch(e){ return siNo; } };
  return {
    clientes: [], actividades: [], convenios: [], prospectos: [], contratos: [],
    eventos: [], campanas: [], odts: [], certificados: [], huespedes: [], serviciosBq: [],
    usuarios:     dame(() => USUARIOS_DEF.map(saneaUsuario), []),
    habitaciones: dame(() => HABS_DEF.map(saneaHab), []),
    ajustes: {
      hotel:  Object.assign({ jefes: [] }, dame(() => HOTEL_DEF, {})),
      textos: Object.assign({}, dame(() => TEXTOS_DEF, {})),
      grupos: dame(() => saneaGrupos(), []),
      moneda: "MXN",
      ladaPais: "52"
    }
  };
}

function cargar(){
  const raw0 = (() => { try{ return localStorage.getItem(STORE); }catch(e){ return null; } })();

  /* Abrir en blanco, sin que ni eso pueda tumbar el arranque. */
  const enBlanco = () => {
    try{ return sanear({}); }
    catch(e){
      console.error("No se pudo armar ni una cartera vacía:", e);
      return esqueletoDeEmergencia();
    }
  };

  /* Avisar sin que el aviso sea lo que reviente. */
  const avisarCarga = e => {
    try{
      cargaRota = true;
      console.error("No se pudo leer el almacenamiento local:", e);
      const detalle = (e && (e.message || e.name)) || String(e);
      setTimeout(() => alert(
        "No se pudieron leer los datos guardados en este equipo.\n\n" +
        "No se borró nada: siguen ahí. Avísale a sistemas y no captures nada todavía, " +
        "para no escribir encima.\n\nDetalle: " + detalle), 400);
    }catch(e2){ cargaRota = true; }
  };

  try{
    if (raw0) return sanear(JSON.parse(raw0));
  }catch(e){
    avisarCarga(e);
    return enBlanco();
  }

  for (const k of VIEJOS){
    try{
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.clientes) && p.clientes.length) return sanear(p);
      if (p && Array.isArray(p.deals) && p.deals.length){
        const mapa = { prospecto:"contactado", contactado:"contactado", calificado:"propuesta",
                       propuesta:"propuesta", negociacion:"negociacion", ganado:"ganado", perdido:"perdido" };
        return sanear({ clientes: p.deals.map(d => ({
          id: nuevoId("c"), empresa: d.empresa || d.nombre || "", contacto: d.contacto || "",
          telefono: d.telefono || "", email: d.email || "", ubicacion: "",
          tarifa: Number(d.monto) || 0, ejecutivo: d.responsable || "",
          estatus: mapa[d.stage] || "contactado", notas: d.notas || ""
        })) });
      }
    }catch(e){ console.warn("No se pudo migrar " + k + ":", e); }
  }
  try{
    return sanear({ clientes: clientesDemo() });
  }catch(e){
    /* No había nada guardado, así que no hay cartera que proteger; pero si
       hasta los clientes de ejemplo revientan, tampoco se escribe nada. */
    avisarCarga(e);
    return enBlanco();
  }
}

function sanear(s){
  s = s || {};
  const out = {
    clientes:     Array.isArray(s.clientes) ? s.clientes.map(saneaCliente) : [],
    actividades:  Array.isArray(s.actividades) ? s.actividades.map(saneaAct) : [],
    convenios:    Array.isArray(s.convenios) ? s.convenios.map(saneaConv) : [],
    prospectos:   Array.isArray(s.prospectos) ? s.prospectos.map(saneaProspecto) : [],
    contratos:    Array.isArray(s.contratos) ? s.contratos.map(saneaContrato) : [],
    eventos:      Array.isArray(s.eventos) ? s.eventos.map(saneaEvento) : [],
    campanas:     Array.isArray(s.campanas) ? s.campanas.map(saneaCampana) : [],
    odts:         Array.isArray(s.odts) ? s.odts.map(saneaOdt) : [],
    certificados: Array.isArray(s.certificados) ? s.certificados.map(saneaCertificado) : [],
    huespedes:    Array.isArray(s.huespedes) ? s.huespedes.map(saneaHuesped) : [],
    serviciosBq:  catalogoServiciosBq(s.serviciosBq),
    usuarios:     Array.isArray(s.usuarios) ? s.usuarios.map(saneaUsuario) : USUARIOS_DEF.map(saneaUsuario),
    habitaciones: catalogo(s.habitaciones),
    ajustes: {
      hotel:  (() => {
        const h = Object.assign({}, HOTEL_DEF, (s.ajustes && s.ajustes.hotel) || {});
        h.jefes = saneaJefes(h.jefes);
        return h;
      })(),
      textos: Object.assign({}, TEXTOS_DEF, (s.ajustes && s.ajustes.textos) || {}),
      grupos: saneaGrupos(s.ajustes && s.ajustes.grupos),
      moneda: (s.ajustes && s.ajustes.moneda) || "MXN",
      ladaPais: (s.ajustes && s.ajustes.ladaPais) || "52"
    }
  };
  const ids = new Set(out.clientes.map(c => c.id));
  huerfanos = new Set();
  const conCliente = (tipo, arr) => arr.filter(o => {
    if (ids.has(o.clienteId)) return true;
    huerfanos.add(tipo + ":" + o.id);
    return false;
  });
  out.actividades = conCliente("actividades", out.actividades);
  out.convenios   = conCliente("convenios",   out.convenios);
  out.contratos   = conCliente("contratos",   out.contratos);
  out.eventos     = conCliente("eventos",     out.eventos);
  // Un prospecto no cuelga de ningún cliente: si al que se pasó se borró, el
  // registro del evento se queda, nada más sin liga.
  out.prospectos.forEach(p => { if (p.clienteId && !ids.has(p.clienteId)) p.clienteId = ""; });
  return out;
}

/**
 * El catálogo por omisión salió de un solo convenio y sólo traía dos tipos.
 * Si lo guardado es exactamente ese catálogo viejo, nadie lo tocó: se
 * reemplaza por el del hotel. Un catálogo ya editado se respeta.
 */
function catalogo(guardadas){
  if (!Array.isArray(guardadas) || !guardadas.length) return HABS_DEF.map(saneaHab);
  const viejo = guardadas.length === 2 &&
    guardadas.some(h => h.nombre === "Sencilla y Doble") &&
    guardadas.some(h => h.nombre === "Care");
  const lista = (viejo ? HABS_DEF : guardadas).map(saneaHab);
  /* Se acomodan por el orden que dejó Ajustes, y aquí —al leer— no al bajar.
     La sincronización actualiza el CONTENIDO de un renglón que este equipo ya
     tiene, pero nunca lo mueve de lugar: el mapa que usa conserva la posición
     de cada clave. Ordenando aquí da igual en qué posición lo haya dejado,
     porque todo pasa por `sanear` antes de pintarse.
     Una habitación sin orden —de antes de octubre— se va al final sin
     estorbar, conservando la posición que traía entre las suyas. */
  const pos = h => Number.isFinite(h.orden) ? h.orden : Infinity;
  return lista.map((h, i) => [h, i])
    .sort((a, b) => pos(a[0]) - pos(b[0]) || a[1] - b[1])
    .map(par => par[0]);
}

function saneaCliente(c){
  const o = Object.assign({ id:"", empresa:"", contacto:"", telefono:"", email:"", ubicacion:"",
    tarifa:0, ejecutivo:"", estatus:"contactado", notas:"", campanaId:"", lada:"",
    createdAt:"", updatedAt:"" }, c || {});
  o.id = o.id || nuevoId("c");
  /* La lada de SU teléfono. Vacía quiere decir "la del hotel": así los
     clientes de siempre no cambian de la noche a la mañana, y los nuevos
     nacen con la que traiga Ajustes. */
  o.lada = String(o.lada || "").replace(/\D/g, "").slice(0, 4);
  o.tarifa = Number(o.tarifa) || 0;
  // De qué campaña salió, si es que salió de alguna. Los clientes de antes no
  // lo traen, y está bien: no todos llegan por un anuncio.
  o.campanaId = String(o.campanaId || "");
  if (!ESTATUS.some(e => e.id === o.estatus)) o.estatus = "contactado";
  /* La etapa y el ejecutivo DE BANQUETES.
   *
   * No van en los valores por omisión de arriba, y es a propósito. Ese
   * `Object.assign` corre sobre TODOS los clientes en cada arranque: un campo
   * nuevo ahí les cambiaría la forma a todos a la vez, la sincronización los
   * tomaría por edición local sin subir —se saltaría la bajada de la cartera
   * entera— y después mandaría la copia de este equipo encima de la de los
   * demás. Desde la máquina de banquetes, que se baja la cartera completa,
   * eso revierte el trabajo de ventas sin que nadie se entere.
   *
   * Así que nacen cuando banquetes los escribe y se borran al quedar vacíos:
   * un cliente que banquetes no ha tocado es byte por byte el de siempre.
   *
   * Y aquí vacío es un valor legítimo, al revés que en `estatus`: quiere decir
   * que nadie de banquetes se ha puesto en contacto con él. */
  if (o.estatusBq !== undefined){
    o.estatusBq = String(o.estatusBq || "").trim();
    if (!ESTATUS.some(e => e.id === o.estatusBq)) o.estatusBq = "";
    if (!o.estatusBq) delete o.estatusBq;
  }
  if (o.ejecutivoBq !== undefined){
    o.ejecutivoBq = String(o.ejecutivoBq || "").trim();
    if (!o.ejecutivoBq) delete o.ejecutivoBq;
  }
  return o;
}

function saneaAct(a){
  const o = Object.assign({ id:"", clienteId:"", tipo:"llamada", asunto:"", fecha:"",
    responsable:"", notas:"", createdAt:"" }, a || {});
  o.id = o.id || nuevoId("a");
  if (!TIPOS_ACT.some(t => t.id === o.tipo)) o.tipo = "llamada";
  return o;
}

function saneaFirma(f){
  if (!f || !f.img) return null;
  return { nombre:f.nombre||"", puesto:f.puesto||"", celular:f.celular||"", fecha:f.fecha||"", img:f.img };
}

/**
 * Un prospecto levantado en un evento.
 *
 * No es todavía un cliente: es un nombre y un teléfono apuntados de prisa en
 * un stand. Se guarda aparte y pasa a la cartera cuando alguien lo trabaja,
 * para que un evento con cien registros no llene el embudo de gente que nunca
 * contestó.
 */
/* ==========================================================================
   MARKETING

   Una campaña es lo que el hotel sale a hacer para que llegue gente: un
   anuncio en redes, una búsqueda pagada, una feria. Lo que interesa medir es
   cuánto costó y qué trajo, así que de aquí cuelgan los prospectos.

   Los canales no son texto libre a propósito: si cada quien escribe "face",
   "Facebook" y "FB", ningún reporte cuadra nunca.
   ========================================================================== */


/** Un gasto del mes: así se captura como lo cobra la plataforma. */
function saneaGasto(g){
  const o = Object.assign({ mes:"", monto:0, nota:"" }, g || {});
  o.mes = String(o.mes || "").slice(0, 7);      // AAAA-MM
  o.monto = Number(o.monto) || 0;
  o.nota = String(o.nota || "").trim();
  return o;
}

function saneaCampana(c){
  const o = Object.assign({ id:"", nombre:"", canal:"meta", objetivo:"",
    desde:"", hasta:"", presupuesto:0, gastos:[], estado:"borrador",
    responsable:"", notas:"", utmSource:"", utmMedium:"", utmCampaign:"",
    metaIds:[], origen:"", createdAt:"", updatedAt:"" }, c || {});
  o.id = o.id || nuevoId("mk");
  for (const k of ["nombre","objetivo","responsable","notas","utmSource","utmMedium","utmCampaign"])
    o[k] = String(o[k] || "").trim();
  o.canal = CANALES.some(x => x.id === o.canal) ? o.canal : "otro";
  o.estado = ESTADOS_CAMP[o.estado] ? o.estado : "borrador";
  o.desde = String(o.desde || "").slice(0, 10);
  o.hasta = String(o.hasta || "").slice(0, 10);
  o.presupuesto = Number(o.presupuesto) || 0;
  o.gastos = Array.isArray(o.gastos) ? o.gastos.map(saneaGasto).filter(g => g.mes) : [];
  /* Las campañas de Meta que le corresponden. Es una LISTA porque una campaña
     del hotel suele ser dos o tres de Meta —prospección y remarketing—, y
     sumarlas por separado no diría lo que costó traer a esa gente. Son ids de
     Meta, de puros dígitos: se escogen de una lista, nunca se teclean. */
  /* De dónde salió: "meta" si la trajo la sincronización, vacío si la capturó
     una persona. Sirve para poder limpiar lo que trajo la máquina sin tocar lo
     que escribió alguien. */
  o.origen = o.origen === "meta" ? "meta" : "";
  o.metaIds = (Array.isArray(o.metaIds) ? o.metaIds : [])
    .map(x => String(x || "").trim())
    .filter((x, i, a) => x && /^\d+$/.test(x) && a.indexOf(x) === i)
    .slice(0, 20);
  return o;
}

/**
 * Una orden de trabajo de marketing.
 *
 * Los campos son los de las dos hojas de papel, tal cual: lo común arriba, y
 * abajo lo que sólo pregunta una de las dos. Se guardan todos aunque la orden
 * sea del otro tipo —no estorban y valen vacíos— para que cambiar una orden de
 * tipo no borre lo que ya se había escrito.
 */
function saneaOdt(o){
  const d = Object.assign({ id:"", folio:"", tipo:"diseno", estado:"por_director",
    // De dónde viene y quién la pide
    departamento:"", solicitante:"", email:"", fecha:"", fechaEntrega:"",
    // Lo que pide, en las dos hojas
    objetivo:"", elementos:"", notas:"",
    // Sólo diseño gráfico
    salida:"", medidas:"", informacion:"",
    // Sólo audiovisual
    duracion:"", formato:"", audio:false, vozOff:false, tomas:[],
    lugar:"", dia:"", hora:"", plataformas:"",
    // Las dos rondas de correcciones, que las anota marketing
    cambio1:"", cambio2:"",
    // Las dos firmas
    firmaJefe:null, firmaDirector:null, tokenFirma:"", avisado:false,
    // El reparto. Es un DATO, no un permiso: ver duenioDe().
    asignadoA:"",
    // Los archivos de referencia que mandó quien la pide, y lo que se entregó
    adjuntos:[], entregas:[],
    // De qué renglón del buzón salió, para no recogerla dos veces
    origenId:"", createdAt:"", updatedAt:"" }, o || {});

  d.id = d.id || nuevoId("o");
  d.tipo = TIPOS_ODT.some(t => t.id === d.tipo) ? d.tipo : "diseno";
  d.estado = ESTADOS_ODT[d.estado] ? d.estado : "por_director";
  for (const k of ["folio","departamento","solicitante","email","objetivo","elementos",
                   "notas","medidas","informacion","duracion","lugar","plataformas",
                   "cambio1","cambio2","asignadoA","tokenFirma","origenId"])
    d[k] = String(d[k] || "").trim();
  for (const k of ["fecha","fechaEntrega","dia"]) d[k] = String(d[k] || "").slice(0, 10);
  d.hora = String(d.hora || "").slice(0, 5);
  d.salida  = SALIDAS_DG.some(x => x.id === d.salida)   ? d.salida  : "";
  d.formato = FORMATOS_AV.some(x => x.id === d.formato) ? d.formato : "";
  d.audio  = !!d.audio;
  d.vozOff = !!d.vozOff;
  d.tomas = (Array.isArray(d.tomas) ? d.tomas : [])
    .filter((x, i, a) => TOMAS_AV.some(t => t.id === x) && a.indexOf(x) === i);
  d.firmaJefe     = saneaFirma(d.firmaJefe);
  d.firmaDirector = saneaFirma(d.firmaDirector);
  d.avisado = !!d.avisado;
  d.adjuntos = (Array.isArray(d.adjuntos) ? d.adjuntos : []).map(saneaAdjunto).slice(0, 3);
  d.entregas = (Array.isArray(d.entregas) ? d.entregas : []).map(saneaEntrega).slice(0, 20);
  return d;
}

/**
 * Un archivo de referencia de los que manda quien pide la orden.
 *
 * `ruta` es dónde quedó en el almacén. Mientras va en camino —del formulario
 * público al CRM— viaja como texto dentro del buzón, pero aquí ya no: el
 * registro entero se replica a cada equipo en cada sincronización, y un PDF
 * incrustado haría lenta la aplicación de todo el hotel.
 */
function saneaAdjunto(a){
  const o = Object.assign({ nombre:"", ruta:"", tipoMime:"", tam:0 }, a || {});
  for (const k of ["nombre","ruta","tipoMime"]) o[k] = String(o[k] || "").trim();
  o.tam = Number(o.tam) || 0;
  return o;
}

/**
 * Lo que marketing entregó. Plural a propósito: una orden de diseño casi
 * siempre da varias piezas.
 *
 * Dos clases. "archivo" vive en el almacén del hotel y se ve completo. "enlace"
 * es para el video: un video de verdad no cabe —el almacén topa en 20 MB por
 * archivo— así que se pega la dirección de donde vive y se sube una portada,
 * que sí cabe y es lo que se ve en la lista.
 */
function saneaEntrega(e){
  const o = Object.assign({ clase:"archivo", nombre:"", ruta:"", tipoMime:"", tam:0,
    url:"", portada:"", cuando:"", quien:"" }, e || {});
  o.clase = o.clase === "enlace" ? "enlace" : "archivo";
  for (const k of ["nombre","ruta","tipoMime","url","portada","cuando","quien"])
    o[k] = String(o[k] || "").trim();
  o.tam = Number(o.tam) || 0;
  return o;
}

/** Lo gastado de verdad, que es lo que cuenta contra el presupuesto. */
const gastoCampana = c => (c.gastos || []).reduce((a, g) => a + (Number(g.monto) || 0), 0);

/**
 * La etiqueta de campaña que viaja en la liga.
 *
 * Sale del nombre si nadie escribió una: minúsculas, sin acentos y con guiones,
 * porque una UTM con espacios o acentos llega partida y no hay reporte que la
 * junte después.
 */
function etiquetaUtm(c){
  if (c.utmCampaign) return c.utmCampaign;
  return String(c.nombre || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "campana";
}

function saneaProspecto(p){
  const o = Object.assign({ id:"", nombre:"", apellido:"", compania:"", email:"", telefono:"",
    evento:"", notas:"", capturadoPor:"", fecha:"", clienteId:"",
    canal:"", campanaId:"", utm:null, asignadoA:"", area:"",
    createdAt:"", updatedAt:"" }, p || {});
  o.id = o.id || nuevoId("p");
  for (const k of ["nombre","apellido","compania","email","telefono","evento","notas",
                   "capturadoPor","asignadoA"])
    o[k] = String(o[k] || "").trim();
  o.area = infoArea(o.area) ? o.area : "";
  o.email = o.email.toLowerCase();
  o.clienteId = String(o.clienteId || "");
  o.fecha = String(o.fecha || "").slice(0, 16);
  // De dónde llegó. Vacío en los que se capturan a mano, que es lo normal en
  // una feria; lo llena solo el formulario público cuando entra por una liga.
  o.canal = CANALES.some(x => x.id === o.canal) ? o.canal : "";
  o.campanaId = String(o.campanaId || "");
  o.utm = o.utm && typeof o.utm === "object"
    ? { source:String(o.utm.source || ""), medium:String(o.utm.medium || ""),
        campaign:String(o.utm.campaign || ""), content:String(o.utm.content || ""),
        term:String(o.utm.term || "") }
    : null;
  return o;
}

const nombreProspecto = p => [p.nombre, p.apellido].filter(Boolean).join(" ").trim();


function saneaLineaHosp(l){
  const o = Object.assign({ descripcion:"", noches:"", precio:"" }, l || {});
  o.descripcion = String(o.descripcion || "").trim();
  o.noches = Number(o.noches) || 0;
  o.precio = Number(o.precio) || 0;
  return o;
}

function saneaLineaEvento(e){
  const o = Object.assign({ fecha:"", horario:"", evento:"", pax:"", montaje:"", salon:"", renta:"" },
    e || {});
  for (const k of ["fecha","horario","evento","montaje","salon","renta"])
    o[k] = String(o[k] || "").trim();
  o.pax = String(o.pax || "").trim();
  return o;
}

function saneaLineaExtra(x){
  const o = Object.assign({ concepto:"", costo:"" }, x || {});
  o.concepto = String(o.concepto || "").trim();
  o.costo    = String(o.costo || "").trim();
  return o;
}

function saneaBloqueEv(b){
  const o = Object.assign({ fecha:"", horario:"", evento:"", pax:"", montaje:"", salon:"",
    renta:"" }, b || {});
  for (const k of ["fecha","horario","evento","montaje","salon","renta"])
    o[k] = String(o[k] || "").trim();
  o.pax = String(o.pax || "").trim();
  return o;
}

/**
 * Un servicio del catálogo de banquetes.
 *
 * `conServicio` viaja con el servicio porque es una propiedad del servicio, no
 * del renglón: la cena lleva el 15% y la pista no, siempre. Escogerlo en la
 * cotización pone la palomita sola, y aun así se puede corregir —hay bodas
 * que negocian el cargo—.
 */
/**
 * Un renglón del desglose de un paquete: de qué se compone.
 *
 * Va con UNITARIO y CANTIDAD, no con un costo por persona ya repartido, y eso
 * es a propósito: en el libro del hotel las cantidades son mixtas —el menú va
 * por persona, el mantel por mesa, el hospedaje es uno—, así que repartirlo
 * entre los invitados daría una cifra que deja de ser cierta en cuanto cambia
 * el número de personas.
 */
function saneaParteBq(x){
  const o = Object.assign({ concepto:"", unitario:0, cantidad:0 }, x || {});
  o.concepto = String(o.concepto || "").trim();
  o.unitario = Number(o.unitario) || 0;
  o.cantidad = Number(o.cantidad) || 0;
  return o;
}

/** Lo que suman las partes: el costo del paquete para TODO el evento. */
const sumaPartes = partes =>
  (partes || []).reduce((a, x) => a + (Number(x.unitario) || 0) * (Number(x.cantidad) || 0), 0);

/**
 * El costo por persona que sale de un desglose, para `pax` invitados.
 *
 * Redondeado al peso: es lo que se le cotiza al cliente y nadie cotiza
 * centavos por persona. Sin invitados no hay por persona que valga.
 */
const porPersonaPartes = (partes, pax) => {
  const n = Number(pax) || 0;
  return n > 0 ? Math.round(sumaPartes(partes) / n) : 0;
};

function saneaServicioBq(s){
  const o = Object.assign({ id:"", nombre:"", precio:0, familia:"",
                            partes:[], conServicio:CON_SERVICIO_DEF }, s || {});
  /* De qué se compone, cuando es un paquete. Los demás servicios la traen
     vacía y no cambian en nada. */
  o.partes = Array.isArray(o.partes) ? o.partes.map(saneaParteBq).filter(x => x.concepto) : [];
  o.id = o.id || nuevoId("sb");
  o.nombre = String(o.nombre || "").trim();
  /* De qué es: alimentos, audiovisual, mobiliario… Es texto libre a propósito,
     porque la lista de un hotel no se parece a la de otro y el día que entre
     una familia nueva nadie tiene que pedirme nada. Sirve para una sola cosa:
     partir la lista desplegable, que con 130 renglones corridos no se puede
     usar. Vacía quiere decir «sin agrupar», y ésas salen al final. */
  o.familia = String(o.familia || "").trim();
  o.precio = Number(o.precio) || 0;
  o.conServicio = !!o.conServicio;
  /* ¿Paquete o servicio suelto? Un paquete es una SERIE de servicios —lo dijo
     Marco— y por eso se captura, se enseña y se lee distinto.
     No se adivina al vuelo: ni por la familia, que se puede renombrar, ni por
     traer desglose, que diez paquetes de su libro todavía no tienen. Es un
     dato. Lo único que se deduce es el valor inicial, UNA vez, para no
     obligar a palomear cincuenta y nueve renglones a mano. */
  if (o.esPaquete === undefined)
    o.esPaquete = o.partes.length > 0 || /^paquete/i.test(o.familia);
  o.esPaquete = !!o.esPaquete;
  /* El lugar que ocupa en la lista, igual que en el catálogo de habitaciones:
     sin esto, mover un renglón no cambia ningún dato y no hay nada que subir. */
  if (o.orden !== undefined){
    o.orden = Number(o.orden);
    if (!Number.isFinite(o.orden)) delete o.orden;
  }
  return o;
}

/** El catálogo, en el orden que dejó Ajustes. Uno sin orden se va al final. */
function catalogoServiciosBq(guardados){
  const lista = (Array.isArray(guardados) ? guardados : SERVICIOS_BQ_DEF).map(saneaServicioBq);
  const pos = x => Number.isFinite(x.orden) ? x.orden : Infinity;
  return lista.map((x, i) => [x, i])
    .sort((a, b) => pos(a[0]) - pos(b[0]) || a[1] - b[1])
    .map(par => par[0]);
}

/** El servicio del catálogo que se llama así, o null. */
const servicioBqPorNombre = nombre => {
  const n = String(nombre || "").trim();
  return n ? (state.serviciosBq.find(x => x.nombre === n) || null) : null;
};

function saneaLineaEv(l){
  const o = Object.assign({ fecha:"", servicio:"", cantidad:"", precio:"",
    partes:[], conServicio:CON_SERVICIO_DEF }, l || {});
  /* Su PROPIA copia del desglose, no una liga al catálogo. Cambiar un costo
     en Ajustes no puede mover una cotización ya capturada —igual que hoy no
     le mueve el precio—. */
  o.partes = Array.isArray(o.partes) ? o.partes.map(saneaParteBq).filter(x => x.concepto) : [];
  o.fecha = String(o.fecha || "").trim();
  o.servicio = String(o.servicio || "").trim();
  o.cantidad = Number(o.cantidad) || 0;
  o.precio = Number(o.precio) || 0;
  o.conServicio = !!o.conServicio;
  return o;
}

/* ==========================================================================
   LOS CERTIFICADOS DE CORTESÍA

   El hotel regala estancias, masajes, faciales y consumos: a un cliente que
   cerró bien el año, a una rifa, a una presentación de destino. Eso se hacía
   en un PowerPoint de 279 diapositivas —se duplicaba la última y se le
   cambiaban a mano el nombre, las fechas y el número—, y ahí se ve lo que eso
   cuesta: folios repetidos, folios saltados, «31 DE DICIEMBRE 224», y las
   mismas condiciones redactadas de tres maneras distintas.

   Aquí el número lo reparte el contador del hotel, las condiciones salen de
   una plantilla por tipo de servicio, y la fecha de validez se escribe sola.
   Todo se puede corregir antes de emitir; después ya no, porque el papel anda
   fuera con su folio impreso.
   ========================================================================== */

function saneaCertificado(c){
  const o = Object.assign({
    id:"", folio:"", tipo:"hospedaje", paraQuien:"", titulo:"", condiciones:"",
    desde:"", hasta:"", estado:"borrador", notas:"",
    emitidoPor:"", emitidoEn:"", createdAt:"", updatedAt:""
  }, c || {});
  o.id = o.id || nuevoId("ce");
  if (!TIPOS_CERT[o.tipo]) o.tipo = "hospedaje";
  if (!ESTADOS_CERT[o.estado]) o.estado = "borrador";
  for (const k of ["folio","paraQuien","titulo","condiciones","desde","hasta",
                   "notas","emitidoPor","emitidoEn","createdAt","updatedAt"])
    o[k] = String(o[k] || "");
  o.createdAt = o.createdAt || new Date().toISOString();
  // Ver saneaContrato: el marcador sólo existe mientras el folio esté repetido.
  if ("folioRepetido" in o){
    o.folioRepetido = String(o.folioRepetido || "");
    if (!o.folioRepetido) delete o.folioRepetido;
  }
  return o;
}

/** El título y las condiciones que van impresos: los suyos, o los de su tipo. */
const tituloCert = c => String(c.titulo || "").trim() || infoTipoCert(c.tipo).titulo;
const condicionesCert = c =>
  String(c.condiciones || "").trim() || infoTipoCert(c.tipo).condiciones;

/**
 * «Fecha de validez: 22 de febrero al 22 de marzo del 2026».
 *
 * En el PowerPoint esto se escribía a mano, y de ahí salieron cosas como «31
 * DE DICIEMBRE 224». Aquí sale de las dos fechas y no se puede escribir mal.
 */
function vigenciaCert(c){
  const d = c.desde, h = c.hasta;
  if (d && h){
    const a = new Date(d.slice(0,10) + "T00:00:00"), b = new Date(h.slice(0,10) + "T00:00:00");
    if (!isNaN(a) && !isNaN(b) && a.getFullYear() === b.getFullYear())
      return `${a.getDate()} de ${MESES[a.getMonth()]} al ${b.getDate()} de ` +
             `${MESES[b.getMonth()]} del ${b.getFullYear()}`;
    return `${fechaTexto(d)} al ${fechaTexto(h)}`;
  }
  if (h) return `hasta el ${fechaTexto(h)}`;
  if (d) return `a partir del ${fechaTexto(d)}`;
  return "";
}

/** A dónde llama quien lo quiera usar: el spa tiene su propia línea. */
function contactoCert(c){
  const h = state.ajustes.hotel;
  const esSpa = infoTipoCert(c.tipo).contacto === "spa";
  return {
    email: (esSpa && h.emailSpa) || h.emailReservaciones || "",
    tel:   (esSpa && h.telSpa)   || h.telReservaciones   || ""
  };
}


/**
 * Un documento de banquetes: la cotización de un evento o su contrato.
 *
 * Los dos viven en la misma lista porque el contrato sale de la cotización
 * —mismos bloques, mismas cuentas— y así no hay que recapturarlo todo.
 */
function saneaEvento(e){
  const o = Object.assign({ id:"", folio:"", clienteId:"", ejecutivo:"", tipo:"cotizacion",
    titulo:"", atencion:"", fecha:"", vigencia:"", bloques:[], servicios:"", lineas:[],
    iva:IVA_BANQ, cargoServicio:SERV_BANQ, observaciones:"", cotizacionId:"",
    anticipo:"", fechaLimitePago:"", garantiaPax:"",
    estado:"borrador", firmaHotel:null, firmaCliente:null, enviado:null, destinatario:null,
    total:0, firmaManual:null, externo:false, createdAt:"", updatedAt:"" }, e || {});
  o.id = o.id || nuevoId("e");
  if (!TIPOS_EVENTO.some(t => t.id === o.tipo)) o.tipo = "cotizacion";
  if (!ESTADOS_EV[o.estado]) o.estado = "borrador";
  for (const k of ["folio","clienteId","ejecutivo","titulo","atencion","fecha","vigencia",
                   "servicios","observaciones","cotizacionId","fechaLimitePago","garantiaPax"])
    o[k] = String(o[k] || "").trim();
  o.iva = o.iva === "" || o.iva === null || o.iva === undefined ? IVA_BANQ : (Number(o.iva) || 0);
  o.cargoServicio = o.cargoServicio === "" || o.cargoServicio === null ||
    o.cargoServicio === undefined ? SERV_BANQ : (Number(o.cargoServicio) || 0);
  o.anticipo = o.anticipo === "" ? "" : (Number(o.anticipo) || 0);
  o.bloques = (Array.isArray(o.bloques) ? o.bloques : []).map(saneaBloqueEv);
  o.lineas  = (Array.isArray(o.lineas)  ? o.lineas  : []).map(saneaLineaEv);
  o.externo = !!o.externo;
  o.firmaHotel   = saneaFirma(o.firmaHotel);
  o.firmaCliente = saneaFirma(o.firmaCliente);
  o.firmaManual  = saneaManual(o.firmaManual);
  o.enviado      = saneaEnvio(o.enviado);
  o.destinatario = o.destinatario && o.destinatario.empresa
    ? { empresa:o.destinatario.empresa || "", contacto:o.destinatario.contacto || "",
        ubicacion:o.destinatario.ubicacion || "", telefono:o.destinatario.telefono || "",
        email:o.destinatario.email || "" }
    : null;
  /* `folioRepetido` no nace en todos los renglones a propósito: un campo nuevo
     en cada documento haría que TODOS se vean editados y se vuelvan a subir
     enteros en la primera sincronización. Sólo existe mientras el folio esté
     de verdad repetido. */
  if ("folioRepetido" in o){
    o.folioRepetido = String(o.folioRepetido || "");
    if (!o.folioRepetido) delete o.folioRepetido;
  }
  return o;
}

/**
 * Las cuentas del evento.
 *
 * Cada renglón paga IVA; el cargo por servicio sólo lo pagan los de alimentos
 * y bebidas, que es como lo cobra el hotel.
 */
function cuentasEvento(e){
  const pIva  = (Number(e.iva) || 0) / 100;
  const pServ = (Number(e.cargoServicio) || 0) / 100;
  const lineas = e.lineas.map(l => {
    const subtotal = (Number(l.cantidad) || 0) * (Number(l.precio) || 0);
    const iva  = subtotal * pIva;
    const serv = l.conServicio ? subtotal * pServ : 0;
    return Object.assign({}, l, { subtotal, iva, serv, total: subtotal + iva + serv });
  });
  const suma = k => lineas.reduce((a, l) => a + l[k], 0);
  return { lineas, subtotal:suma("subtotal"), iva:suma("iva"), serv:suma("serv"),
           total:suma("total") };
}

/** La fecha en que ocurre el evento: la primera de sus bloques, o la del documento. */
function fechaEvento(e){
  const fs = e.bloques.map(b => b.fecha).filter(f => /^\d{4}-\d{2}-\d{2}$/.test(f)).sort();
  return fs[0] || (/^\d{4}-\d{2}-\d{2}$/.test(e.fecha) ? e.fecha : "");
}

const ejecutivoDeEv = e => String(e.ejecutivo || "").trim() ||
  String((cliente(e.clienteId) || {}).ejecutivo || "").trim();

/**
 * Banquetes acaba de trabajarle algo a este cliente: queda a su nombre.
 *
 * Es lo que hace verdad la columna vacía sin que nadie la llene a mano: si
 * ninguna ejecutiva de banquetes le ha hecho un documento, nadie se ha puesto
 * en contacto con él, y la columna lo dice. Sólo la PRIMERA vez: a quien ya lo
 * tomó no se lo quita la siguiente que le cotice algo.
 *
 * El nombre sale del DOCUMENTO, no de quien está sentado: la administración y
 * la dirección alcanzan banquetes pero no llevan cartera —por eso ni salen en
 * el desplegable del área—, y apuntarlas aquí marcaría como tratado a un
 * cliente que nadie trató.
 */
function tocaBanquetes(e){
  const c = cliente((e || {}).clienteId);
  if (!c) return;
  const quien = String(e.ejecutivo || "").trim();
  let toco = false;
  if (quien && esDeBanquetes(quien) && !String(c.ejecutivoBq || "").trim()){
    c.ejecutivoBq = quien; toco = true;
  }
  if (!String(c.estatusBq || "").trim()){ c.estatusBq = "contactado"; toco = true; }
  if (toco) c.updatedAt = new Date().toISOString();
}

function saneaContrato(k){
  const o = Object.assign({ id:"", folio:"", clienteId:"", ejecutivo:"", tipo:"cotizacion",

  o.externo = !!o.externo;

  o.tokenFirma = String(o.tokenFirma || "").trim();

  o.eventos     = (Array.isArray(o.eventos)     ? o.eventos     : []).map(saneaLineaEvento);
  o.adicionales = (Array.isArray(o.adicionales) ? o.adicionales : []).map(saneaLineaExtra);
  o.firmaHotel   = saneaFirma(o.firmaHotel);
  o.firmaCliente = saneaFirma(o.firmaCliente);
  o.enviado      = saneaEnvio(o.enviado);
  o.destinatario = o.destinatario && o.destinatario.empresa
    ? { empresa:o.destinatario.empresa || "", contacto:o.destinatario.contacto || "",
        ubicacion:o.destinatario.ubicacion || "", telefono:o.destinatario.telefono || "",
        email:o.destinatario.email || "" }
    : null;
  /* `folioRepetido` no nace en todos los renglones a propósito: un campo nuevo
     en cada documento haría que TODOS se vean editados y se vuelvan a subir
     enteros en la primera sincronización. Sólo existe mientras el folio esté
     de verdad repetido. */
  if ("folioRepetido" in o){
    o.folioRepetido = String(o.folioRepetido || "");
    if (!o.folioRepetido) delete o.folioRepetido;
  }
  return o;
}

/** Lo que cuesta cada renglón y lo que suma todo, con y sin impuestos. */
function cuentasContrato(k){
  const factor = 1 + (Number(k.impuestos) || 0) / 100;
  const lineas = k.hospedaje.map(l => {
    const subtotal = (Number(l.noches) || 0) * (Number(l.precio) || 0);
    return Object.assign({}, l, { subtotal, total: subtotal * factor });
  });
  return {
    lineas,
    noches:   lineas.reduce((a, l) => a + (Number(l.noches) || 0), 0),
    subtotal: lineas.reduce((a, l) => a + l.subtotal, 0),
    total:    lineas.reduce((a, l) => a + l.total, 0)
  };
}

function saneaConv(c){

function saneaHuesped(g){
  const o = Object.assign({ id:"", nombre:"", apellidos:"", reservacion:"", llegada:"", salida:"",

  o.noches = o.noches === "" || o.noches == null ? "" : Math.max(0, Math.round(Number(o.noches) || 0));
  o.enviado = saneaEnvio(o.enviado);

function saneaEnvio(e){
  if (!e || !e.fecha) return null;
  return { fecha: e.fecha, via: e.via === "whatsapp" ? "whatsapp" : "correo", quien: e.quien || "" };
}

/** Constancia de que el cliente lo firmó en papel y alguien subió el escaneado. */
/**
 * La constancia de un documento firmado en papel.
 *
 * El escaneado puede estar en dos lugares, y por eso hay dos campos:
 *
 *   ruta: vive en el almacén del proyecto (Supabase Storage). Es lo normal.
 *   pdf : viene incrustado en el propio registro, en base64. Así empezó, y
 *         así se quedaron los que se subieron antes; cabe mientras sean pocos,
 *         porque el navegador corta cerca de los 5 MB. Se pueden mudar desde
 *         Ajustes sin perder nada.
 */
function saneaManual(m){
  if (!m || !m.fecha) return null;
  return { fecha:m.fecha, quien:m.quien || "", archivo:m.archivo || "",
           pdf: typeof m.pdf === "string" ? m.pdf : "",
           ruta: typeof m.ruta === "string" ? m.ruta : "",
           tam: Number(m.tam) || 0,
           tipoMime: m.tipoMime || "" };
}

/** ¿Este documento trae escaneado, esté donde esté? */
const traeEscaneo = m => !!(m && (m.pdf || m.ruta));

/** Clave del enlace de firma: larga y al azar, para que no se pueda adivinar. */
function nuevoToken(){
  const b = new Uint8Array(18);
  crypto.getRandomValues(b);
  return [...b].map(x => x.toString(36).padStart(2,"0")).join("").slice(0, 28);
}

/* Por dónde se le hizo llegar al cliente.

   `enlace` es el caso que faltaba y que dejaba mintiendo a la columna
   ENVIADO: el ejecutivo copia el enlace de firma y se lo manda por donde
   quiera —un WhatsApp desde el teléfono, un correo de la empresa, un mensaje
   interno—, y la columna seguía diciendo «Sin enviar». Copiarlo ES mandarlo:
   a partir de ahí el enlace anda fuera del hotel. */
const VIAS = { correo:"correo", whatsapp:"WhatsApp", enlace:"enlace" };

/** A dónde se mandó, para dejarlo escrito en la bitácora. */
const destinoEnvio = (via, c) =>
  via === "correo"   ? `Enviado a ${(c && c.email) || "su correo"}.`
: via === "whatsapp" ? `Enviado a ${(c && c.telefono) || "su teléfono"}.`
: "Se copió el enlace de firma para hacérselo llegar.";

function marcarEnviada(id, via){
  const g = state.huespedes.find(x => x.id === id);
  if (!g) return;
  g.enviado = { fecha: new Date().toISOString(), via, quien: correoSesion() };
  guardar(); render();
}

/** El archivo trae nombre y apellidos por separado; la carta los une. */
const nombreCompleto = g => [g.nombre, g.apellidos].map(x => String(x || "").trim()).filter(Boolean).join(" ");

/** Noches capturadas, o las que dan las fechas. */
function nochesDe(g){
  if (g.noches !== "" && g.noches != null) return Number(g.noches);
  if (!g.llegada || !g.salida) return "";
  const d = Math.round((new Date(g.salida + "T00:00:00") - new Date(g.llegada + "T00:00:00")) / 864e5);
  return isNaN(d) || d < 0 ? "" : d;
}

/**
 * La clave de una habitación, para compararla.
 *
 * La clave —STKN, GDDB, CARE— es lo que de verdad identifica a un tipo de
 * habitación en el hotel. El identificador interno no: si el catálogo se
 * recaptura desde Ajustes, los tipos nacen con identificadores nuevos y lo
 * que apunte al viejo se queda colgando.
 */
const claveHab = c => String(c || "").trim().toUpperCase();

function saneaHab(h){
  const o = Object.assign({ id:"", codigo:"", nombre:"", grupo:"deluxe", publica:null }, h || {});
  o.id = o.id || nuevoId("h");
  o.codigo = String(o.codigo || "").toUpperCase().trim();
  if (!GRUPOS.some(g => g.id === o.grupo)) o.grupo = "deluxe";
  o.publica = (o.publica === null || o.publica === "" || o.publica === undefined) ? null : (Number(o.publica) || 0);
  /* El lugar que ocupa en la lista. Hasta ahora el orden era nada más el
     índice del arreglo: no iba en el renglón, así que no subía al servidor y
     cada equipo veía el suyo. Ahora es un dato y viaja como los demás.
     No lleva valor por omisión —nace cuando Ajustes lo escribe— para no
     cambiarle la forma a todos los renglones de golpe. */
  if (o.orden !== undefined){
    o.orden = Number(o.orden);
    if (!Number.isFinite(o.orden)) delete o.orden;
  }
  return o;
}

function saneaGrupos(g){
  const out = {};
  for (const k of Object.keys(GRUPOS_DEF))
    out[k] = Object.assign({}, GRUPOS_DEF[k], (g && g[k]) || {});
  return out;
}

/**
 * La lista de departamentos con su jefe que firma.
 *
 * Tiene saneador propio porque el renglón que arma ajustes.hotel en sanear()
 * es un Object.assign pelón: lo que venga guardado pisa a HOTEL_DEF tal cual.
 * Sin esto, un `jefes` que quedara hecho pedazos en el navegador —un texto en
 * vez de un arreglo, un renglón sin nombre— tumbaría la carga entera.
 *
 * Quita repetidos por departamento porque el desplegable del formulario se
 * arma de aquí: dos «Banquetes» serían dos renglones idénticos y quien lo
 * llena no sabría cuál escoger.
 */
function saneaJefes(j){
  const vistos = new Set();
  return (Array.isArray(j) ? j : HOTEL_DEF.jefes)
    .map(x => ({ depto: String((x && x.depto) || "").trim(),
                 jefe:  String((x && x.jefe)  || "").trim() }))
    .filter(x => {
      if (!x.depto) return false;                    // sin departamento no sirve de nada
      const k = x.depto.toLowerCase();
      if (vistos.has(k)) return false;
      vistos.add(k);
      return true;
    })
    .slice(0, 40);
}

/** El jefe que le toca a un departamento, o "" si ese departamento no está. */
function jefeDe(depto, lista){
  const d = String(depto || "").trim().toLowerCase();
  const x = (lista || state.ajustes.hotel.jefes || []).find(y =>
    String(y.depto || "").trim().toLowerCase() === d);
  return x ? x.jefe : "";
}

/**
 * El total de cada documento, guardado dentro del propio documento.
 *
 * El dinero se calcula aquí, en JavaScript: el IVA del 8%, el cargo por
 * servicio renglón por renglón, los impuestos de hospedaje. Si el tablero de
 * marketing lo volviera a calcular del lado del servidor —que es el único que
 * ve los documentos de todas las áreas—, la misma regla viviría en dos idiomas,
 * y el día que cambie una tasa se separarían sin que nadie lo note. Es la clase
 * de error que sale a los seis meses, en una junta.
 *
 * Así que se calcula UNA vez, donde vive la regla, y el servidor nada más suma.
 *
 * Va al guardar, que es el único momento en que algo pudo cambiar. Cuesta unas
 * cuantas multiplicaciones, y de pasada pone al día los documentos viejos en
 * cuanto alguien abre el CRM: no hace falta una migración aparte.
 */
function sellarTotales(){
  const redondo = n => Math.round((Number(n) || 0) * 100) / 100;
  for (const e of state.eventos){
    const t = redondo(cuentasEvento(e).total);
    if (e.total !== t) e.total = t;
  }
  for (const k of state.contratos){
    const t = redondo(cuentasContrato(k).total);
    if (k.total !== t) k.total = t;
  }
}

/* ==========================================================================
   LO QUE SE BORRÓ Y TODAVÍA NO LO SABE EL SERVIDOR

   Un borrado no viaja como "bórralo": viaja como una LÁPIDA, un renglón
   marcado `borrado:true`. Si la fila desapareciera sin más, los demás equipos
   nunca se enterarían de que ya no existe.

   El problema era de dónde salía la lista de lápidas: se DEDUCÍA de
   `sincronizado`, que es un Map en memoria y arranca vacío al recargar. Si el
   registro no estaba ahí, no había lápida, no subía nada, y en la siguiente
   bajada el servidor lo devolvía intacto. Marco borró un cliente, volvió a
   entrar, y ahí estaba otra vez con todos sus convenios.

   Así que ya no se deduce: se apunta, y se apunta EN EL NAVEGADOR, que es lo
   que hace que sobreviva a la recarga —que es justo donde se perdía—.
   ========================================================================== */
let tumbas = new Set();           // ids borrados aquí, sin confirmar allá
let idsGuardados = null;          // los ids de la última vez que se guardó

const CLAVE_TUMBAS = STORE + ":tumbas";
const CLAVE_IDS    = STORE + ":ids";

function cargarTumbas(){
  try{ tumbas = new Set(JSON.parse(localStorage.getItem(CLAVE_TUMBAS) || "[]")); }
  catch(e){ tumbas = new Set(); }
  try{
    const v = JSON.parse(localStorage.getItem(CLAVE_IDS) || "null");
    idsGuardados = Array.isArray(v) ? new Set(v) : null;
  }catch(e){ idsGuardados = null; }
}

function guardarTumbas(){
  try{
    localStorage.setItem(CLAVE_TUMBAS, JSON.stringify([...tumbas]));
    localStorage.setItem(CLAVE_IDS, JSON.stringify([...(idsGuardados || [])]));
  }catch(e){}
}

/**
 * Apunta lo que desapareció desde la última vez que se guardó.
 *
 * Va aquí y no en cada botón de borrar a propósito: hay quince lugares que
 * borran algo, y tocarlos uno por uno es garantizar que el próximo que se
 * escriba se olvide de apuntar. Todos terminan llamando a guardar(), así que
 * con compararlo aquí quedan cubiertos los quince y los que vengan.
 */
/**
 * EL CANDADO. Reemplazar el estado de golpe no es borrar.
 *
 * Hay tres momentos en que el estado entero se cambia de un jalón: al enlazar
 * el equipo por primera vez, al aplicar lo que bajó del servidor, y al cerrar
 * sesión. En esos tres, lo que "desaparece" no lo borró nadie.
 *
 * Sin esto, el siguiente guardar compararía contra los ids de ANTES y tumbaría
 * lo que ya no está. En el peor caso —cerrar sesión y que entre un ejecutivo,
 * que sólo recibe lo suyo— se tumbaría la cartera entera del hotel y se
 * subiría como borrada. Por eso el punto de comparación se pone al día sin
 * apuntar nada.
 *
 * Con `limpiar`, además se sueltan las lápidas pendientes: al cerrar sesión no
 * tienen a quién pertenecer, y arrastrarlas a la sesión del siguiente sería
 * borrarle registros que él sí alcanza y que nadie mandó borrar.
 */
function alDiaSinTumbar(limpiar){
  idsGuardados = new Set(filasDeEstado().map(f => f.id));
  if (limpiar) tumbas = new Set();
  guardarTumbas();
}

function anotarLoQueSeFue(){
  const ahora = new Set(filasDeEstado().map(f => f.id));
  if (idsGuardados){
    for (const id of idsGuardados) if (!ahora.has(id)) tumbas.add(id);
  }
  idsGuardados = ahora;
}

/* ==========================================================================
   CUÁNTO PESA LA COPIA DE ESTE NAVEGADOR

   El navegador le da a cada sitio unos 5.2 MILLONES DE CARACTERES de
   `localStorage` —medido en Chromium: 5,177,344—, que contados como los
   cuenta él, a dos bytes por carácter, son unos 10 MB. Ahí cabe todo menos
   las imágenes. Una firma trazada en un teléfono se guardaba como
   un PNG del lienzo COMPLETO a la resolución de la pantalla: 115 KB cada una,
   dos por documento. A los veintitantos documentos firmados el navegador
   dejaba de aceptar nada y la aplicación ya no podía guardar.

   Lo que sigue sirve para verlo —y para poder decir qué es lo que pesa, en
   vez de un «almacenamiento lleno» que no le dice nada a nadie—.
   ========================================================================== */

/** Lo que ocupa un texto en el navegador: cuenta en UTF-16, que es como mide él. */
const pesoTexto = t => (String(t || "").length * 2);

/* Hasta dónde aguanta `localStorage`, en las mismas unidades que `pesoTexto`.

   NO son 5 MB, que es el número que todo el mundo repite y que yo mismo puse
   mal en el letrero: lo que Chrome acepta son unos 5.2 MILLONES DE
   CARACTERES —5,177,344, medido—, y como aquí se cuenta a dos bytes por
   carácter, el techo en estas unidades es el doble. Decir «pesa 9.9 MB y ya
   casi llega a 5» era un absurdo que no ayudaba a nadie. */
const TECHO_LOCALSTORAGE = 5177344 * 2;

const techoDelAlmacen = () => TECHO_LOCALSTORAGE;

const enKB = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB"
                               : Math.round(n / 1024) + " KB";

/**
 * De qué se compone el peso de la copia local, de lo más pesado a lo menos.
 *
 * Las firmas se cuentan aparte de su documento: son la mitad del problema y
 * esconderlas dentro de «convenios» no ayudaría a nadie a entenderlo.
 */
function queLlenaElAlmacen(){
  let firmas = 0, nFirmas = 0;
  const mira = o => {
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o)) return o.forEach(mira);
    for (const [k, v] of Object.entries(o)){
      if (/^firma/.test(k) && v && v.img){ firmas += pesoTexto(v.img); nFirmas++; }
      else mira(v);
    }
  };
  mira(state);

  /* Las partes son los conjuntos de arriba —clientes, convenios, contratos—.
     Las firmas NO se listan aquí: viven dentro de sus documentos y sumarlas
     aparte contaría dos veces lo mismo. Van por su cuenta, porque son la
     mitad del problema y hay que poder nombrarlas. */
  const partes = Object.keys(state)
    .map(k => ({ que: NOMBRE_TIPO[k] || k, peso: pesoTexto(JSON.stringify(state[k])) }))
    .filter(x => x.peso > 1024)
    .sort((a, b) => b.peso - a.peso);

  /* Los escaneados incrustados son la otra mitad del problema, y para ésos ya
     existe el botón de mudarlos al almacén. Se cuentan aparte para poder
     mandar a quien lea esto al botón que lo arregla. */
  let escaneos = 0, nEscaneos = 0;
  try{
    for (const x of escaneosIncrustados()){ escaneos += pesoTexto(x.m.pdf); nEscaneos++; }
  }catch(e){}

  return { total: pesoTexto(JSON.stringify(state)),
           firmas, nFirmas, escaneos, nEscaneos, partes };
}

/**
 * Lo que pesa la copia de este navegador, dicho antes de que estorbe.
 *
 * El navegador no avisa: acepta todo hasta que un día deja de aceptar, y para
 * entonces ya no se puede guardar nada. Por eso, al pasar del 70% del techo
 * se dice en rojo y se explica qué hacer antes de que estorbe.
 */
function renglonDelPeso(){
  let d;
  try{ d = queLlenaElAlmacen(); }catch(e){ return ""; }
  const TECHO = techoDelAlmacen();
  const apretado = d.total > TECHO * 0.7;
  return `<div style="margin-top:6px">La copia de este equipo pesa
    <b${apretado ? ' style="color:var(--bad)"' : ""}>${enKB(d.total)}</b>` +
    (d.nFirmas ? ` · ${enKB(d.firmas)} en ${d.nFirmas} firma(s) trazada(s)` : "") +
    (d.nEscaneos ? ` · ${enKB(d.escaneos)} en ${d.nEscaneos} escaneado(s) ` +
                   "todavía incrustado(s)" : "") +
    (apretado
      ? `. <b style="color:var(--bad)">Se está acercando al tope de este
         navegador (${esc(enKB(TECHO))}), y al llegar deja de poder guardar.</b>
         Baja un respaldo y usa los botones de abajo:
         ${d.nEscaneos ? "«Mover los escaneados al almacén» y " : ""}
         «Compactar las firmas guardadas».`
      : ".") + `</div>`;
}

/**
 * Vuelve a guardar una firma ya almacenada, pero sin el papel que le sobra.
 *
 * Las firmas trazadas antes de octubre de 2026 se guardaron como el lienzo
 * ENTERO a la resolución de la pantalla: en un teléfono, 115 KB de los
 * cuales casi todo es blanco. Esto las recorta a lo trazado y las baja a
 * `ANCHO_FIRMA`, que es lo mismo que hace hoy `padAPng` al firmar.
 *
 * No redibuja ni retoca nada: lo que se quita es blanco. Si algo no se puede
 * leer, se devuelve la de antes —una firma grande es mejor que ninguna—.
 */
function compactarUnaFirma(dataURL){
  return new Promise(resolve => {
    const img = new Image();
    img.onerror = () => resolve(null);
    img.onload = () => {
      try{
        const cv = document.createElement("canvas");
        cv.width = img.naturalWidth; cv.height = img.naturalHeight;
        const c = cv.getContext("2d");
        c.drawImage(img, 0, 0);
        const d = c.getImageData(0, 0, cv.width, cv.height).data;
        /* Aquí el fondo YA es blanco —se lo puso `padAPng` al guardarla—, así
           que el trazo se busca por lo que no es blanco, no por el alfa. */
        let x1 = cv.width, y1 = cv.height, x2 = -1, y2 = -1;
        for (let y = 0; y < cv.height; y++)
          for (let x = 0; x < cv.width; x++){
            const i = (y * cv.width + x) * 4;
            if (d[i + 3] > 8 && (d[i] < 236 || d[i + 1] < 236 || d[i + 2] < 236)){
              if (x < x1) x1 = x;
              if (x > x2) x2 = x;
              if (y < y1) y1 = y;
              if (y > y2) y2 = y;
            }
          }
        if (x2 < 0) return resolve(null);            // en blanco: no se toca
        const aire = Math.round(cv.height * 0.06) + 4;
        x1 = Math.max(0, x1 - aire); y1 = Math.max(0, y1 - aire);
        x2 = Math.min(cv.width - 1, x2 + aire); y2 = Math.min(cv.height - 1, y2 + aire);
        const w = x2 - x1 + 1, h = y2 - y1 + 1;
        const esc = escalaFirma(w, h);
        const out = document.createElement("canvas");
        out.width  = Math.max(1, Math.round(w * esc));
        out.height = Math.max(1, Math.round(h * esc));
        const o = out.getContext("2d");
        o.fillStyle = "#fff"; o.fillRect(0, 0, out.width, out.height);
        o.imageSmoothingQuality = "high";
        o.drawImage(img, x1, y1, w, h, 0, 0, out.width, out.height);
        pocosTonos(o, out.width, out.height);
        const nueva = out.toDataURL("image/png");
        // Si no adelgaza, se queda la de antes: no se toca por tocar.
        resolve(nueva.length < dataURL.length * 0.95 ? nueva : null);
      }catch(e){ resolve(null); }
    };
    img.src = dataURL;
  });
}

/** Todas las firmas del estado, con cómo volver a ponerlas en su sitio. */
function firmasDelEstado(){
  const out = [];
  const mira = o => {
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o)) return o.forEach(mira);
    for (const [k, v] of Object.entries(o)){
      if (/^firma/.test(k) && v && typeof v === "object" && v.img) out.push(v);
      else mira(v);
    }
  };
  mira(state);
  return out;
}

/** El respaldo completo, tal cual, a un archivo. */
function respaldoJSON(){
  descargar(`crm-respaldo-${hoyISO()}.json`, JSON.stringify(state, null, 2),
            "application/json");
}

/**
 * El aviso de que el navegador ya no acepta nada.
 *
 * Una sola vez, y con el porqué: un «almacenamiento lleno» a secas deja a
 * cualquiera sin saber qué hacer. Además queda un letrero fijo arriba, porque
 * a partir de aquí lo que se escriba NO se está guardando en este equipo y
 * eso no se puede enterar nadie por una ventanita que ya cerró.
 */
function avisarAlmacenLleno(){
  ponerLetreroAlmacen();
  if (avisadoAlmacenLleno) return;
  avisadoAlmacenLleno = true;
  const d = queLlenaElAlmacen();
  const grande = d.partes[0];
  alert("Este navegador ya no deja guardar más: se llenó su espacio.\n\n" +
    `La copia de este equipo pesa ${enKB(d.total)}` +
    (d.nFirmas ? `, y ${enKB(d.firmas)} son las ${d.nFirmas} firmas trazadas` : "") +
    (grande ? `. Lo más pesado: ${grande.que} (${enKB(grande.peso)})` : "") + ".\n\n" +
    "Haz AHORA «Exportar → Respaldo completo (JSON)» y guarda ese archivo.\n\n" +
    "Lo que escribas a partir de ahora sigue en pantalla y se sube a la nube " +
    "si hay enlace, pero NO se está guardando en este navegador: si cierras " +
    "la pestaña sin respaldo, se pierde.");
}

/** El letrero fijo. Mientras no se pueda guardar, no se quita. */
function ponerLetreroAlmacen(){
  if (document.getElementById("avisoAlmacen")) return;
  const d = document.createElement("div");
  d.id = "avisoAlmacen";
  d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99998;background:#7a1020;" +
    "color:#fff;padding:8px 14px;font-size:13px;display:flex;gap:12px;align-items:center;" +
    "flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.3)";
  d.innerHTML = `<b>Este navegador ya no puede guardar: se llenó.</b>
    <span>Lo que escribas no se está guardando en este equipo.</span>
    <span style="flex:1"></span>
    <button class="btn sm" id="avisoAlmacenResp">Bajar el respaldo</button>
    <button class="btn sm" id="avisoAlmacenVer">¿Qué lo llenó?</button>`;
  document.body.appendChild(d);
  d.querySelector("#avisoAlmacenResp").onclick = () => respaldoJSON();
  d.querySelector("#avisoAlmacenVer").onclick = () => {
    const x = queLlenaElAlmacen();
    alert(`La copia de este equipo pesa ${enKB(x.total)}.\n\n` +
      x.partes.slice(0, 6).map(t => `· ${t.que}: ${enKB(t.peso)}`).join("\n") +
      (x.nFirmas ? `\n\nDe todo eso, ${enKB(x.firmas)} son las ${x.nFirmas} ` +
                   "firmas trazadas (imágenes)." : ""));
  };
}

/* Para no repetir el mismo aviso en cada tecla: el almacenamiento no se
   desatasca solo entre una y otra. */
let avisadoAlmacenLleno = false;

function guardar(){
  sellarTotales();
  anotarLoQueSeFue();
  /* El índice de Meta depende de qué conjuntos están enlazados, y eso cambia
     al guardar. Tirarlo cuesta una asignación; dejarlo viejo cuesta una cifra
     equivocada en la pantalla. */
  metaIndice = null;
  guardarTumbas();
  try{
    localStorage.setItem(STORE, JSON.stringify(state));
    avisadoAlmacenLleno = false;
  }catch(e){
    console.warn("No se pudo guardar:", e);
    avisarAlmacenLleno();
  }
  programarSubida();   // si hay nube, empuja lo que cambió
}

/* ==========================================================================
   NUBE: la misma cartera desde cualquier equipo

   El navegador sigue siendo la copia de trabajo —la aplicación abre al
   instante y funciona sin señal— y encima va una sincronización contra
   Supabase. Se sincroniza por entidad: cada cliente, actividad, convenio o
   huésped es una fila, así que dos personas pueden trabajar a la vez mientras
   no toquen el mismo registro.

   Se consulta por sondeo en lugar de websockets: para un equipo de este
   tamaño la diferencia no se nota y evita mantener una conexión viva y su
   protocolo. El sondeo se detiene mientras haya un formulario abierto, para
   no cambiarle los datos a alguien que está capturando.
   ========================================================================== */

const NUBE_CFG    = "crm-hotel-nube";
const NUBE_SESION = "crm-hotel-sesion";
const SONDEO_MS   = 15000;

let nube = { url:"", anon:"", sesion:null, estado:"local", ultimo:"", timer:null,
             pendiente:null, rechazados:[] };
let sincronizado = new Map();     // id de fila -> JSON ya confirmado en la nube

const nubeActiva = () => !!(nube.url && nube.anon && nube.sesion);

/**
 * Supabase enseña la dirección del proyecto en varios lados y no siempre igual:
 * en Settings sale limpia, pero en la pantalla de la API sale ya con /rest/v1/
 * pegado. La aplicación arma esas rutas por su cuenta, así que aquí se recorta
 * lo que sobre en vez de dejar que el usuario adivine cuál de las dos era.
 */
const normalizaUrlNube = u =>
  String(u || "").trim()
    .replace(/\/+$/, "")
    .replace(/\/(rest|auth|storage|realtime|functions)\/v\d+$/i, "")
    .replace(/\/+$/, "");
const correoSesion = () => (nube.sesion && nube.sesion.user && nube.sesion.user.email) || "";

/**
 * La nube del hotel, para que un equipo nuevo no tenga que configurarse.
 *
 * Con esto puesto, quien abra la liga cae directo en la pantalla de contraseña:
 * la aplicación ya sabe con qué servidor hablar y no enseña absolutamente nada
 * hasta que alguien entre. Sin esto, un equipo sin configurar sigue abriendo en
 * modo local, que es como se trabaja el archivo suelto.
 *
 * La llave 'anon' está hecha para ser pública —viaja al navegador de cualquiera
 * que abra la página— y por sí sola no alcanza nada: quien manda es la sesión
 * y las reglas de roles.sql. Aun así, esto sólo se llena con el repositorio en
 * privado.
 */
const NUBE_DEF = Object.assign({ url:"", anon:"" }, window.CORE_NUBE || {});

function cargarNube(){
  try{
    const c = JSON.parse(localStorage.getItem(NUBE_CFG) || "{}");
    nube.url = normalizaUrlNube(c.url);
    nube.anon = c.anon || "";
    nube.enlazado = !!c.enlazado;
  }catch(e){}
  // Equipo nuevo: adopta la nube del hotel sin preguntar nada.
  if (!nube.url && !nube.anon && NUBE_DEF.url && NUBE_DEF.anon){
    nube.url = normalizaUrlNube(NUBE_DEF.url);
    nube.anon = NUBE_DEF.anon;
    nube.enlazado = false;
    guardarNubeCfg();
  }
  try{ nube.sesion = JSON.parse(localStorage.getItem(NUBE_SESION) || "null"); }catch(e){}
}

function guardarNubeCfg(){
  try{ localStorage.setItem(NUBE_CFG,
    JSON.stringify({ url:nube.url, anon:nube.anon, enlazado:!!nube.enlazado })); }catch(e){}
}
function guardarSesion(){
  try{
    if (nube.sesion) localStorage.setItem(NUBE_SESION, JSON.stringify(nube.sesion));
    else localStorage.removeItem(NUBE_SESION);
  }catch(e){}
}

/** Llamada a la API con la llave y el token; renueva el token si caducó. */
async function api(ruta, opciones = {}, reintento = true){
  // Una sesión sin token se renueva antes de preguntar. Si no, la petición
  // sale como anónima y el servidor contesta una lista vacía —no un error—,
  // así que la aplicación creería que la nube se quedó sin datos.
  if (reintento && nube.sesion && !nube.sesion.access_token && nube.sesion.refresh_token)
    await renovarSesion();

  const h = Object.assign({
    "apikey": nube.anon,
    "Content-Type": "application/json"
  }, opciones.headers || {});
  if (nube.sesion && nube.sesion.access_token) h["Authorization"] = "Bearer " + nube.sesion.access_token;

  const r = await fetch(nube.url + ruta, Object.assign({}, opciones, { headers: h }));
  if (r.status === 401 && reintento && nube.sesion && nube.sesion.refresh_token){
    if (await renovarSesion()) return api(ruta, opciones, false);
  }
  if (!r.ok){
    let detalle = "";
    try{ const j = await r.json(); detalle = j.message || j.error_description || j.error || JSON.stringify(j); }
    catch(e){ detalle = await r.text().catch(() => ""); }
    throw new Error(`${r.status} · ${detalle || "sin detalle"}`);
  }
  // Al insertar con "return=minimal" el cuerpo viene vacío —a veces con 201,
  // a veces con 204—, así que no se puede pedir JSON a ciegas.
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

async function renovarSesion(){
  try{
    const r = await fetch(nube.url + "/auth/v1/token?grant_type=refresh_token", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: nube.sesion.refresh_token })
    });
    if (!r.ok) return false;
    nube.sesion = await r.json();
    guardarSesion();
    return true;
  }catch(e){ return false; }
}

/**
 * Traduce lo que contesta el servidor de cuentas.
 *
 * Antes, cualquier fallo se anunciaba como "correo o contraseña incorrectos",
 * y eso mandaba a la gente a reescribir una contraseña que estaba bien cuando
 * lo que faltaba era confirmar la cuenta o corregir la dirección del proyecto.
 * Cada caso tiene que decir qué hacer.
 */
function errorDeEntrada(estado, j, crudo){
  const codigo = String(j.error_code || j.code || j.error || "").toLowerCase();
  const texto  = String(j.msg || j.message || j.error_description || "").toLowerCase();

  if (codigo.includes("email_not_confirmed") || texto.includes("not confirmed"))
    return "La cuenta existe pero está sin confirmar. En Supabase, Authentication → Users, " +
           "bórrala y vuelve a crearla marcando «Auto Confirm User».";
  if (codigo.includes("invalid_credentials") || codigo.includes("invalid_grant") ||
      texto.includes("invalid login"))
    return "Correo o contraseña incorrectos. Si estás seguro de la contraseña, cámbiala en " +
           "Supabase: Authentication → Users → los tres puntos del usuario → Reset password.";
  if (codigo.includes("user_banned")) return "Esa cuenta está bloqueada en Supabase.";
  if (estado === 429)
    return "Demasiados intentos seguidos. Espera un minuto y vuelve a probar.";
  if (estado === 401 || codigo.includes("no api key") || texto.includes("api key"))
    return "La llave pública no corresponde a este proyecto. Revísala en Ajustes → Nube y equipo.";
  if (estado === 404)
    return `La dirección del proyecto no responde a las cuentas (${esc(nube.url)}/auth/v1). ` +
           "Revisa que sea la de tu proyecto, sin nada pegado al final.";

  // Nada conocido: mejor enseñar lo que llegó que inventar un diagnóstico.
  const detalle = (j.msg || j.message || j.error_description || crudo || "").slice(0, 300);
  return `El servidor contestó ${estado}${detalle ? ": " + detalle : " sin explicación"}.`;
}

/* ----- Alta de un equipo nuevo sin dictar nada ----- */

const b64url = t => btoa(t).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const deB64url = t => atob(t.replace(/-/g, "+").replace(/_/g, "/")
  .padEnd(Math.ceil(t.length / 4) * 4, "="));

/**
 * Una liga que ya trae dentro la dirección y la llave.
 *
 * Va en el fragmento —después del #— a propósito: esa parte no se manda al
 * servidor, así que la llave no queda escrita en los registros de quien
 * hospeda la página. Y al abrirla se borra de la barra de direcciones antes de
 * que alcance a colarse en el historial o en un favorito.
 */
const ligaInvitacion = () =>
  location.origin + location.pathname + "#nube=" +
  b64url(JSON.stringify({ u: nube.url, k: nube.anon }));

/**
 * Saca del enlace la configuración y, si viene, el pase de Core Quartz, y
 * borra el fragmento de la barra de direcciones.
 *
 * Se hace de inmediato, antes que ninguna otra cosa: mientras esté a la vista
 * puede acabar en un favorito o en el historial, y ahí van la llave y el pase.
 * Aplicarlo —que puede preguntar algo— es aparte y sí puede esperar.
 *
 * Devuelve `{ cfg, cq }`: `cfg` es la configuración de nube de siempre y `cq`
 * el token de un solo uso con el que Core Quartz manda a alguien ya
 * identificado. Cualquiera de los dos puede venir sin el otro.
 */
function leerInvitacion(){
  const hash = String(location.hash || "");
  const m  = hash.match(/[#&]nube=([A-Za-z0-9_-]+)/);
  const mc = hash.match(/[#&]cq=([A-Za-z0-9_.\-~%]+)/);
  if (!m && !mc) return null;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  let cfg = null;
  if (m){ try{ cfg = JSON.parse(deB64url(m[1])); }catch(e){ cfg = {}; } }
  let cq = null;
  if (mc){ try{ cq = decodeURIComponent(mc[1]); }catch(e){ cq = mc[1]; } }
  return { cfg, cq };
}

function aplicarInvitacion(cfg){
  if (!cfg) return;
  const url  = normalizaUrlNube(cfg && cfg.u);
  const anon = String((cfg && cfg.k) || "").trim();
  if (!url || !anon){
    alert("La liga de configuración llegó incompleta.\n\n" +
          "Suele pasar cuando se corta al copiarla o al mandarla por mensaje. " +
          "Pide que te la manden otra vez.");
    return;
  }
  if (nube.url && (nube.url !== url || nube.anon !== anon)){
    if (!confirm("Este equipo ya estaba conectado a otro servidor.\n\n" +
                 "¿Cambiarlo por el de esta liga? Tendrás que volver a entrar.")) return;
    nube.sesion = null;
    guardarSesion();
  }
  const otroServidor = nube.url !== url || nube.anon !== anon;
  nube.url = url;
  nube.anon = anon;
  nube.ultimo = "";
  if (otroServidor) nube.enlazado = false;   // servidor distinto: enlace nuevo
  guardarNubeCfg();
}

/** Deja la liga en el portapapeles, o a la vista si el navegador no deja. */
async function copiarInvitacion(){
  if (!/^https?:$/.test(location.protocol)){
    alert("Esta liga sólo sirve desde la dirección publicada del CRM.\n\n" +
          "Ábrelo desde su dirección de internet, no desde el archivo guardado en el equipo.");
    return;
  }

          "Al abrirla, su equipo queda configurado y sólo le pedirá su correo y contraseña.\n\n" +

  }catch(e){
    prompt("Copia esta liga y mándala a quien vaya a usar el CRM:", liga);
  }
}

/* ----- Diagnóstico ----- */

/** Lee lo que la llave lleva escrito dentro. No la valida: sólo la traduce. */
function leerLlave(anon){
  try{
    const p = anon.split(".")[1];
    const j = JSON.parse(atob(p.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(p.length/4)*4, "=")));
    return { ref:j.ref || "", rol:j.role || "", vence:j.exp ? new Date(j.exp*1000) : null };
  }catch(e){ return null; }
}

const refDeUrl = url => (String(url).match(/^https:\/\/([^.]+)\.supabase\./i) || [])[1] || "";

/**
 * Revisa la conexión paso por paso y dice en cuál se rompe.
 *
 * Cuando algo falla al entrar, el usuario no tiene modo de saber si el
 * problema es su contraseña, la llave, la dirección o una tabla que nunca se
 * creó: todo se ve igual desde la pantalla de entrada. Peor todavía si hay
 * dos proyectos en la misma cuenta, porque la dirección de uno con la llave
 * del otro parece bien escrita y nunca va a funcionar. Aquí se comprueba cada
 * cosa por separado.
 */
async function probarNube(url, anon){
  const pasos = [];
  const anota = (ok, titulo, detalle) => pasos.push({ ok, titulo, detalle });

  const llave = leerLlave(anon);
  if (!llave){
    anota(false, "La llave no se entiende",
      "No parece una llave de Supabase. Cópiala completa de Project Settings → API, " +
      "renglón «anon public», sin cortarla.");
    return pasos;
  }
  anota(true, "La llave se lee bien", `Es del proyecto <b>${esc(llave.ref)}</b>, permiso <b>${esc(llave.rol)}</b>.`);

  if (llave.rol !== "anon")
    anota(false, `Esa llave no es la pública, es «${esc(llave.rol)}»`,
      llave.rol === "service_role"
        ? "<b>La service_role salta todos los permisos y no debe ir dentro de una página.</b> " +
          "Bórrala de aquí y, por seguridad, revócala en Supabase. Usa la que dice «anon public»."
        : "Usa la que dice «anon public».");

  if (llave.vence && llave.vence < new Date())
    anota(false, "La llave caducó", `Venció el ${esc(fechaCorta(llave.vence.toISOString()))}. Genera una nueva en Supabase.`);

  // Sólo se pueden comparar cuando la dirección es la que reparte Supabase.
  // Quien lo tenga en servidor propio usa su dominio, y eso es legítimo: ahí
  // la comparación no aplica y son las pruebas de abajo las que hablan.
  const refUrl = refDeUrl(url);
  if (!refUrl)
    anota(true, "Dirección propia",
      `No es una de <code>supabase.co</code>, así que no se puede comparar con la llave ` +
      `(que es del proyecto <b>${esc(llave.ref)}</b>).`);
  else if (refUrl !== llave.ref)
    anota(false, "La dirección y la llave son de proyectos distintos",
      `La dirección apunta a <b>${esc(refUrl)}</b> y la llave es de <b>${esc(llave.ref)}</b>. ` +
      "Con dos proyectos en la misma cuenta es fácil mezclarlos. Toma los dos datos de la " +
      "misma pantalla: Project Settings → API del proyecto que quieras usar.");
  else
    anota(true, "La dirección y la llave son del mismo proyecto", esc(refUrl));

  // Servicio de cuentas
  try{
    const r = await fetch(url + "/auth/v1/settings", { headers:{ apikey:anon } });
    if (r.ok){
      const j = await r.json().catch(() => ({}));
      const correoOn = !j.external || j.external.email !== false;
      anota(true, "El servicio de cuentas responde",
        correoOn ? "Acepta entrar con correo y contraseña."
                 : "<b>Pero tiene apagado el acceso por correo.</b> Enciéndelo en " +
                   "Authentication → Sign In / Providers → Email.");
      if (!correoOn) pasos[pasos.length-1].ok = false;
    } else {
      anota(false, `El servicio de cuentas contestó ${r.status}`,
        r.status === 401 ? "La llave no vale para este proyecto."
                         : "Revisa que la dirección sea la del proyecto.");
    }
  }catch(e){
    anota(false, "No se pudo contactar al servicio de cuentas",
      "Sin internet, o la dirección está mal escrita.");
  }

  /* El buzón donde los clientes dejan su firma.

     Esto preguntaba asomándose a la tabla con un SELECT, y MENTÍA: el buzón no
     tiene regla de lectura para nadie de fuera a propósito, así que una tabla
     con las reglas tiradas contesta «200, lista vacía» igual que una sana. El
     panel decía «los clientes pueden firmar desde su enlace» justo cuando NO
     podían — y un cliente de verdad se topó con eso, con un error de base de
     datos en la pantalla, después de haber firmado con el dedo.

     Ahora se le pregunta al servidor si la regla existe. */
  try{
    const r = await fetch(url + "/rest/v1/rpc/crm_buzon_ok", {
      method:"POST", headers:{ apikey:anon, "Content-Type":"application/json",
        Authorization: "Bearer " + ((nube.sesion && nube.sesion.access_token) || anon) },
      body: "{}"
    });
    if (r.status === 404)
      anota(false, "LOS CLIENTES NO PUEDEN FIRMAR",
        "Falta correr <code>firmas.sql</code> en el SQL Editor de Supabase. " +
        "Pégalo <b>completo</b>: si se corta a la mitad no se aplica nada." +
        `<p style="margin:8px 0 0"><button class="btn primary" type="button" onclick="panelCorrerSql('firmas')">Arreglar esto</button></p>`);
    else if ((await r.text()).trim() === "true")
      anota(true, "El buzón de firmas está montado",
        "Los clientes pueden firmar desde su enlace.");
    else
      anota(false, "LOS CLIENTES NO PUEDEN FIRMAR",
        "El buzón existe pero le falta la regla que deja al cliente depositar su firma. " +
        "Vuelve a correr <code>firmas.sql</code> <b>completo</b> en el SQL Editor de Supabase." +
        `<p style="margin:8px 0 0"><button class="btn primary" type="button" onclick="panelCorrerSql('firmas')">Arreglar esto</button></p>`);
  }catch(e){ /* si falla la red ya se dijo arriba */ }

  // La tabla
  try{
    const r = await fetch(url + "/rest/v1/crm_datos?select=id&limit=1", { headers:{ apikey:anon } });
    if (r.ok) anota(true, "La tabla crm_datos existe", "El nube.sql ya se corrió en este proyecto.");
    else {
      const t = await r.text();
      anota(false, `La tabla no responde (${r.status})`,
        /does not exist|not find the table|schema cache/i.test(t)
          ? "<b>Falta correr el <code>nube.sql</code> en este proyecto.</b> " +
            "Ábrelo en el SQL Editor, pégalo completo y dale Run."
          : esc(t.slice(0, 200)));
    }
  }catch(e){
    anota(false, "No se pudo consultar la tabla", esc(e.message));
  }

  return pasos;
}

async function entrar(correo, contrasena){
  let r;
  try{
    r = await fetch(nube.url + "/auth/v1/token?grant_type=password", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ email: String(correo).trim(), password: contrasena })
    });
  }catch(e){
    throw new Error("No se pudo contactar al servidor. Revisa tu internet y que la dirección " +
                    `del proyecto esté bien escrita (${esc(nube.url)}).`);
  }
  const crudo = await r.text();
  let j = {};
  try{ j = JSON.parse(crudo); }catch(e){}
  if (!r.ok) throw new Error(errorDeEntrada(r.status, j, crudo));
  if (!j.access_token) throw new Error("El servidor respondió sin sesión. Vuelve a intentar.");
  nube.sesion = j;
  guardarSesion();
}

/**
 * Entrar con el pase de un solo uso que emite Core Quartz (PRD R5).
 *
 * El portal ya comprobó quién es y le pidió a Supabase un enlace mágico; aquí
 * sólo se canjea su `token_hash`. La sesión que sale es **del CRM**: el mismo
 * objeto, guardado en el mismo lugar que el acceso con contraseña. No se
 * comparten tokens entre aplicaciones.
 *
 * Si en este navegador quedó abierta la sesión de **otra** persona, primero se
 * va por el camino de «Cerrar sesión»: sube lo que tenga pendiente y borra su
 * copia local. Si no logra subirlo, pregunta, y si dice que no, aquí no se
 * abre nada: más vale quedarse fuera que perderle capturas a alguien.
 */
async function entrarConCore(tokenHash){
  const correoAnterior = correoSesion().trim().toLowerCase();

  // Primero se canjea el pase, pero **sin instalarlo**: hasta no saber de
  // quién es no se puede decidir si hay que despedir a quien estaba, y
  // despedirlo a ciegas le borraría la cartera a alguien que sólo volvió a
  // entrar desde el portal.
  let r;
  try{
    r = await fetch(nube.url + "/auth/v1/verify", {
      method:"POST", headers:{ apikey:nube.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ type:"magiclink", token_hash: tokenHash })
    });
  }catch(e){
    throw new Error("No se pudo contactar al servidor para validar tu entrada. " +
                    "Revisa tu internet y vuelve a abrir el CRM desde Core Quartz.");
  }
  let j = {};
  try{ j = JSON.parse(await r.text()); }catch(e){}
  if (!r.ok || !j.access_token)
    throw new Error("El enlace ya se usó; entra desde Core Quartz otra vez");

  const correoNuevo = String((j.user && j.user.email) || "").trim().toLowerCase();

  // Es otra persona: el camino de «Cerrar sesión», y todavía con la sesión de
  // quien se va puesta, que es la única que puede subir lo suyo.
  if (correoAnterior && correoNuevo && correoAnterior !== correoNuevo){
    await salir();
    if (nube.sesion) return false;       // se arrepintió en el aviso: no se sigue
  }

  nube.sesion = j;
  guardarSesion();
  const ov = document.getElementById("entrada");
  if (ov) ov.remove();                   // `salir()` la deja puesta; ya no hace falta
  return true;
}

/**
 * Cerrar sesión, pensado para una computadora compartida.
 *
 * No basta con olvidar el token: la copia de trabajo de quien se va sigue en
 * el navegador, y quien entre después la vería completa aunque el servidor no
 * le entregue ni una fila. Así que se borra, y el siguiente que entre la baja
 * de nuevo desde la nube.
 *
 * Antes de borrar se intenta subir lo que quede pendiente. Si no se logra, se
 * pregunta: perder capturas por cerrar sesión sería el peor final posible.
 */
async function salir(){
  if (nubeActiva()){
    const faltan = () => filasDeEstado()
      .filter(f => sincronizado.get(f.id) !== JSON.stringify(f.datos)).length;
    if (faltan()){
      try{ await sincronizar(); }catch(e){}
      if (faltan() && !confirm(
        `Quedan ${faltan()} cambio(s) de este equipo sin subir y no se pudo conectar ` +
        "con la nube.\n\nSi cierras la sesión ahora se pierden.\n\n¿Cerrar de todos modos?"))
        return;
    }
  }

  detenerSondeo();
  nube.sesion = null;
  nube.ultimo = "";
  ponDepto("");   // el que entre después escoge el suyo, no hereda éste
  try{ localStorage.removeItem(FIRMA_LOCAL); }catch(e){}
  nube.enlazado = false;      // el que entre después baja todo otra vez
  nube.estado = "local";
  guardarSesion();
  guardarNubeCfg();

  // La cartera del que se va no se queda esperando al siguiente.
  sincronizado = new Map();
  state = sanear({});
  alDiaSinTumbar(true);   // vaciar la pantalla NO es borrar: ver el candado
  /* Ni las cuentas que pidió prestadas al servidor: el ingreso por campaña y
     las cifras de Meta son de marketing, y quien entre después puede no ser
     de marketing. No se ven en su pantalla de todos modos, pero no tienen por
     qué seguir en la memoria de este equipo. */
  mkIngresos = null; mkIngresosError = "";
  waSync = null; waPidiendo = null;
  metaMetricas = null; metaObjetos = []; metaSync = null;
  metaError = ""; metaFallo = "";
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  vista = "tablero";
  filtros = { q:"", ejecutivo:"" };
  seleccion = new Set();

  render();
  pantallaEntrada();
}
